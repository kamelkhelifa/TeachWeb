notes: >
  Merged three versions: PHYS 402 (Griffiths-based: spin, identical particles, perturbation theory,
  variational, WKB), PHYS 402 MIT-8.05-based (formalism, dynamics pictures, angular momentum, PT) and
  UEF 131 (EN + AR pages; Arabic problem series, Arabic video lectures 01-08, notes on 3j/6j symbols).
  The 14-week schedule is a synthesis; weeks 13-14 (time-dependent perturbation theory, scattering)
  were added from standard syllabi (Griffiths 3rd ed. ch. 10-11) and are not in any source page.
  Readings re-mapped to Griffiths & Schroeter 3rd ed. numbering. Assessment weights reconstructed
  (sources used 10-20% problem sets, 2 x 20-25% periodic exams, 40% final). Topic labels of problem
  series B were inferred from the UEF 131 calendar (PS n released the week of topic n); PS11 topic
  unknown. Week assignment of the MIT-track sets follows that calendar compressed into weeks 1-5.
  Marks links (student portal), course-evaluation questionnaire and the Arabic page link were not kept.
  The 'Arabic translation of Griffiths' PDF link is preserved as found: check its copyright status.
  CLOs, quizzes, worked problems and glossary are new.

description:
  en: |
    <p>This course completes the core undergraduate sequence in quantum mechanics. It first rebuilds the theory on its proper mathematical foundation, the Hilbert space with Dirac bra–ket notation, Hermitian operators and the Schrödinger and Heisenberg pictures of time evolution, and then develops the quantum theory of angular momentum: orbital angular momentum, spin one-half, Pauli matrices and the addition of angular momenta with Clebsch–Gordan coefficients.</p>
    <p>The second part deals with systems of identical particles (bosons, fermions, exchange forces, the Pauli principle, helium and the periodic table) and with the approximation methods without which almost no realistic problem can be solved: time-independent perturbation theory (non-degenerate and degenerate, with the fine structure, Zeeman and hyperfine effects in hydrogen), the variational principle, the WKB approximation and tunnelling, time-dependent perturbation theory (Rabi oscillations, Fermi's golden rule) and an introduction to scattering theory.</p>
    <p>Throughout, the emphasis is on physical interpretation and on the problem-solving technique expected in exams: weekly problem sets, worked examples and self-check quizzes accompany every chapter, and an interactive two-level-system lab lets you explore Rabi oscillations.</p>
  ar: |
    <p>يُكمل هذا المقرر السلسلة الأساسية لميكانيكا الكم في المرحلة الجامعية الأولى. فهو يعيد أولًا بناء النظرية على أساسها الرياضي السليم: فضاء هيلبرت وترميز ديراك (برا–كت)، والمؤثرات الهرميتية، وصورتا شرودنغر وهايزنبرغ للتطور الزمني، ثم يطوّر النظرية الكمومية للزخم الزاوي: الزخم الزاوي المداري، والسبين نصف، ومصفوفات باولي، وجمع الزخوم الزاوية بمعاملات كليبش–غوردن.</p>
    <p>ويتناول الجزء الثاني أنظمة الجسيمات المتطابقة (البوزونات والفرميونات، وقوى التبادل، ومبدأ الاستبعاد لباولي، وذرة الهيليوم والجدول الدوري)، ثم الطرق التقريبية التي لا يمكن من دونها حل أي مسألة واقعية تقريبًا: نظرية الاضطراب المستقلة عن الزمن (غير المنحلّة والمنحلّة، مع تطبيقها على البنية الدقيقة وظاهرة زيمان والبنية فائقة الدقة في ذرة الهيدروجين)، والمبدأ التغايري، وتقريب WKB والنفق الكمومي، ونظرية الاضطراب المعتمدة على الزمن (تذبذبات رابي وقاعدة فيرمي الذهبية)، ومدخلًا إلى نظرية الاستطارة.</p>
    <p>ويُركَّز في المقرر كله على التفسير الفيزيائي وعلى مهارات حل المسائل المطلوبة في الاختبارات: ترافق كلَّ فصل سلسلةُ تمارين أسبوعية وأمثلةٌ محلولة واختباراتٌ ذاتية، كما يتيح مختبر تفاعلي لنظام ذي مستويين استكشاف تذبذبات رابي.</p>


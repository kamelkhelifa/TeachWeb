  - { en: Fine structure & Zeeman effect, ar: البنية الدقيقة وظاهرة زيمان }
  - { en: Variational principle, ar: المبدأ التغايري }
  - { en: WKB & tunnelling, ar: تقريب WKB والنفق الكمومي }
  - { en: Fermi's golden rule & scattering, ar: قاعدة فيرمي الذهبية والاستطارة }

outcomes:
  - id: CLO1
    bloom: understand
    domain: knowledge
    text:
      en: Formulate quantum mechanics in Dirac notation (state vectors, Hermitian operators, eigenbases, commutators) and describe time evolution in the Schrödinger and Heisenberg pictures.
      ar: يصوغ ميكانيكا الكم بترميز ديراك (متجهات الحالة، المؤثرات الهرميتية، القواعد الذاتية، المبدّلات) ويصف التطور الزمني في صورتي شرودنغر وهايزنبرغ.
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: Solve eigenvalue problems for orbital angular momentum and spin, using ladder operators and Pauli matrices, and predict the outcomes and probabilities of spin measurements.
      ar: يحل مسائل القيم الذاتية للزخم الزاوي المداري والسبين باستعمال مؤثرات السلّم ومصفوفات باولي، ويتنبأ بنتائج قياسات السبين واحتمالاتها.
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO3
    bloom: apply
    domain: skills
    text:
      en: Add two angular momenta, construct coupled states with Clebsch–Gordan coefficients and use them to diagonalise spin–spin and spin–orbit Hamiltonians.
      ar: يجمع زخمين زاويين، ويبني الحالات المقترنة بمعاملات كليبش–غوردن، ويستعملها لجعل هاملتونيات تفاعل سبين–سبين وسبين–مدار قطرية.
    assessed_by: [homework, midterm1, final]
  - id: CLO4
    bloom: analyze
    domain: knowledge
    text:
      en: Construct properly symmetrised states for systems of identical bosons and fermions and explain exchange forces, the Pauli principle, the helium atom and the structure of the periodic table.
      ar: يبني حالات متناظرة أو ضد متناظرة بالشكل الصحيح لأنظمة البوزونات والفرميونات المتطابقة، ويفسّر قوى التبادل ومبدأ باولي وذرة الهيليوم وبنية الجدول الدوري.
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO5
    bloom: apply
    domain: skills
    text:
      en: Apply non-degenerate and degenerate time-independent perturbation theory to compute energy shifts, including the fine structure, Zeeman, Stark and hyperfine effects in hydrogen.
      ar: يطبّق نظرية الاضطراب المستقلة عن الزمن، غير المنحلّة والمنحلّة، لحساب انزياحات الطاقة، بما في ذلك البنية الدقيقة وظواهر زيمان وشتارك والبنية فائقة الدقة في ذرة الهيدروجين.
    assessed_by: [quizzes, homework, midterm2, final]
  - id: CLO6
    bloom: evaluate
    domain: skills
    text:
      en: Estimate ground-state energies with the variational principle and quantisation conditions or tunnelling rates with the WKB approximation, and judge the validity of each approximation.
      ar: يقدّر طاقات الحالة الأرضية بالمبدأ التغايري، وشروط التكميم أو معدلات النفق بتقريب WKB، ويحكم على مدى صلاحية كل تقريب.
    assessed_by: [quizzes, homework, midterm2, project, final]
  - id: CLO7
    bloom: apply
    domain: knowledge
    text:
      en: Use time-dependent perturbation theory (two-level systems, Rabi oscillations, Fermi's golden rule) and the Born approximation to compute transition rates and scattering cross-sections.
      ar: يستعمل نظرية الاضطراب المعتمدة على الزمن (الأنظمة ذات المستويين، تذبذبات رابي، قاعدة فيرمي الذهبية) وتقريب بورن لحساب معدلات الانتقال والمقاطع العرضية للاستطارة.
    assessed_by: [quizzes, homework, final]
  - id: CLO8
    bloom: create
    domain: values
    text:
      en: Present complete, logically argued solutions and a short computational study, working independently and with academic integrity.
      ar: يقدّم حلولًا كاملة ومبرهنة منطقيًا ودراسة حسابية قصيرة، ويعمل باستقلالية والتزام بالنزاهة الأكاديمية.
    assessed_by: [homework, project, participation]

assessment:
  - id: quizzes
    type: quiz
    weight: 10
    title: { en: Short quizzes, ar: اختبارات قصيرة }
    detail:
      en: Four 15-minute quizzes at the end of a chapter (one or two short problems or conceptual questions). The best three count.
      ar: أربعة اختبارات قصيرة مدة كل منها 15 دقيقة في نهاية الفصول (مسألة أو مسألتان قصيرتان أو أسئلة مفاهيمية). تُحتسب أفضل ثلاثة منها.
    when: { en: 'Weeks 4, 6, 10, 13', ar: الأسابيع 4 و6 و10 و13 }
  - id: homework
    type: homework
    weight: 15
    title: { en: Weekly problem sets, ar: سلاسل التمارين الأسبوعية }
    detail:
      en: One problem sheet each week, due one week later. Solve the problems yourself, identify unclear concepts and ask for help, and write complete, clear and honest solutions. The lowest mark is dropped.
      ar: ورقة تمارين كل أسبوع تُسلَّم بعد أسبوع واحد. حُلّ المسائل بنفسك، وحدِّد المفاهيم غير الواضحة واطلب المساعدة، واكتب حلولًا كاملة وواضحة ونزيهة. تُحذف أدنى علامة.
    when: { en: Weeks 1–14, ar: الأسابيع 1–14 }
  - id: midterm1
    type: midterm
    weight: 15
    title: { en: First periodic exam, ar: الاختبار الدوري الأول }
    detail:
      en: 'One hour, three or four problems: formalism, angular momentum, spin and addition of angular momenta.'
      ar: 'ساعة واحدة، ثلاث أو أربع مسائل: الصياغة الرياضية، الزخم الزاوي، السبين وجمع الزخوم الزاوية.'
    when: { en: Week 7, ar: الأسبوع 7 }
  - id: midterm2
    type: midterm
    weight: 15
    title: { en: Second periodic exam, ar: الاختبار الدوري الثاني }
    detail:
      en: 'One hour: identical particles and time-independent perturbation theory (non-degenerate, degenerate, fine structure, Zeeman effect).'
      ar: 'ساعة واحدة: الجسيمات المتطابقة ونظرية الاضطراب المستقلة عن الزمن (غير المنحلّة، المنحلّة، البنية الدقيقة، ظاهرة زيمان).'
    when: { en: Week 11, ar: الأسبوع 11 }
  - id: project
    type: project
    weight: 5
    title: { en: Computational mini-project, ar: مشروع حسابي مصغّر }
    detail:
      en: A short numerical study (Python, spreadsheet or any language), e.g. variational energy of the anharmonic oscillator, WKB versus exact levels, or Rabi oscillations of a driven two-level system. Two-page report with plots.
      ar: دراسة عددية قصيرة (بايثون أو جدول بيانات أو أي لغة)، مثل الطاقة التغايرية للمتذبذب اللاتوافقي، أو مقارنة مستويات WKB بالقيم المضبوطة، أو تذبذبات رابي لنظام ذي مستويين مُثار. تقرير من صفحتين مع رسوم بيانية.
    when: { en: Due week 13, ar: يُسلَّم في الأسبوع 13 }
  - id: participation
    type: participation
    weight: 5
    title: { en: Tutorial participation, ar: المشاركة في الأعمال الموجهة }
    detail:
      en: Attendance and active participation in tutorials, including presenting a solution at the board at least once.
      ar: الحضور والمشاركة الفعّالة في حصص الأعمال الموجهة، بما في ذلك عرض حلّ على السبورة مرة واحدة على الأقل.
    when: { en: Throughout, ar: طوال الفصل }
  - id: final
    type: final
    weight: 35
    title: { en: Final exam, ar: الاختبار النهائي }
    detail:
      en: Two hours, comprehensive, five or six problems covering the whole course with emphasis on approximation methods.
      ar: ساعتان، شامل، خمس أو ست مسائل تغطي المقرر كله مع التركيز على الطرق التقريبية.
    when: { en: Final exam period, ar: فترة الاختبارات النهائية }

schedule:
  - week: 1
    title: { en: The formalism of quantum mechanics, ar: الصياغة الرياضية لميكانيكا الكم }
    topics:
      en:
        - Overview of the course; review of wave mechanics
        - Hilbert space, bras and kets, inner products
        - Hermitian operators, eigenvalues and orthonormal eigenbases
        - Projectors, completeness and change of basis
      ar:
        - نظرة عامة على المقرر؛ مراجعة الميكانيكا الموجية
        - فضاء هيلبرت، البرا والكت، الجداء الداخلي
        - المؤثرات الهرميتية، القيم الذاتية والقواعد الذاتية المتعامدة المعيارية
        - المُسقِطات، علاقة الاكتمال وتغيير القاعدة
    reading: Griffiths §3.1–3.4, §3.6
    activity: { en: Problem sets A1–A2 and B0–B3 (review), ar: السلاسل A1–A2 وB0–B3 (مراجعة) }
  - week: 2
    title: { en: Uncertainty and quantum dynamics, ar: الارتياب والديناميكا الكمومية }
    topics:
      en:
        - Generalised uncertainty principle
        - 'Time evolution operator \(U(t)=e^{-iHt/\hbar}\)'
        - Schrödinger and Heisenberg pictures; Ehrenfest theorem
        - Harmonic oscillator with ladder operators
      ar:
        - مبدأ الارتياب المعمَّم
        - 'مؤثر التطور الزمني \(U(t)=e^{-iHt/\hbar}\)'
        - صورتا شرودنغر وهايزنبرغ؛ مبرهنة إهرنفست
        - المتذبذب التوافقي بمؤثرات السلّم
    reading: Griffiths §3.5, §2.3; Shankar ch. 4
    activity: { en: Problem sets A3–A5, ar: السلاسل A3–A5 }
  - week: 3
    title: { en: Angular momentum, ar: الزخم الزاوي }
    topics:
      en:
        - Schrödinger equation in spherical coordinates (review)
        - 'Commutation relations \([L_i,L_j]=i\hbar\,\epsilon_{ijk}L_k\)'
        - 'Ladder operators \(L_\pm\) and the spectrum of \(L^2, L_z\)'
        - Spherical harmonics; hydrogen atom revisited
      ar:
        - معادلة شرودنغر في الإحداثيات الكروية (مراجعة)
        - 'علاقات التبديل \([L_i,L_j]=i\hbar\,\epsilon_{ijk}L_k\)'
        - 'مؤثرا السلّم \(L_\pm\) وطيف \(L^2, L_z\)'
        - التوافقيات الكروية؛ عودة إلى ذرة الهيدروجين
    reading: Griffiths §4.1–4.3
    activity: { en: Problem sets B4–B6, ar: السلاسل B4–B6 }
  - week: 4
    title: { en: Spin one-half, ar: السبين نصف }
    topics:
      en:
        - Stern–Gerlach experiment
        - Spinors and Pauli matrices
        - Measurements of spin along an arbitrary axis
        - Electron in a magnetic field; Larmor precession
      ar:
        - تجربة شتيرن–غرلاخ
        - السبينورات ومصفوفات باولي
        - قياس السبين على محور اختياري
        - إلكترون في مجال مغناطيسي؛ مبادرة لارمور
    reading: Griffiths §4.4.1–4.4.2
    activity: { en: Problem sets A6 and B7, ar: السلسلتان A6 وB7 }
    milestone: quiz
  - week: 5
    title: { en: Addition of angular momenta, ar: جمع الزخوم الزاوية }
    topics:
      en:
        - Two spin-½ particles; singlet and triplet states
        - Clebsch–Gordan coefficients and tables
        - '\(\vb{J}=\vb{L}+\vb{S}\); good quantum numbers'
        - 3j symbols, Wigner–Eckart theorem (overview), 6j symbols
      ar:
        - جسيمان سبين كل منهما ½؛ الحالة الأحادية والحالات الثلاثية
        - معاملات كليبش–غوردن وجداولها
        - '\(\vb{J}=\vb{L}+\vb{S}\)؛ الأعداد الكمومية الجيدة'
        - رموز 3j، مبرهنة فيغنر–إيكارت (نظرة عامة)، رموز 6j
    reading: Griffiths §4.4.3; Sakurai §3.8
    activity: { en: Problem sets A7 and B8–B9, ar: السلاسل A7 وB8–B9 }
  - week: 6
    title: { en: Identical particles, ar: الجسيمات المتطابقة }
    topics:
      en:
        - Two-particle systems; exchange operator
        - Bosons and fermions; symmetrisation postulate
        - Exchange forces
        - Slater determinants; Pauli exclusion principle
      ar:
        - أنظمة الجسيمين؛ مؤثر التبادل
        - البوزونات والفرميونات؛ مسلَّمة التناظر
        - قوى التبادل
        - محدِّدات سلايتر؛ مبدأ الاستبعاد لباولي
    reading: Griffiths §5.1
    activity: { en: Quiz 2 on spin and addition of angular momenta, ar: الاختبار القصير 2 حول السبين وجمع الزخوم }
    milestone: quiz
  - week: 7
    title: { en: Atoms, ar: الذرات }
    topics:
      en:
        - Helium; para- and orthohelium
        - The periodic table; Hund's rules
        - First periodic exam
      ar:
        - الهيليوم؛ الهيليوم البارا والأورثو
        - الجدول الدوري؛ قواعد هوند
        - الاختبار الدوري الأول
    reading: Griffiths §5.2
    milestone: midterm
  - week: 8
    title: { en: Non-degenerate perturbation theory, ar: نظرية الاضطراب غير المنحلّة }
    topics:
      en:
        - General formulation; first-order energies and states
        - Second-order energies
        - 'Examples: anharmonic oscillator, charged oscillator in an electric field'
      ar:
        - الصياغة العامة؛ الطاقات والحالات في الرتبة الأولى
        - الطاقات في الرتبة الثانية
        - 'أمثلة: المتذبذب اللاتوافقي، متذبذب مشحون في مجال كهربائي'
    reading: Griffiths §7.1
    activity: { en: Problem set B10, ar: السلسلة B10 }
  - week: 9
    title: { en: Degenerate perturbation theory, ar: نظرية الاضطراب المنحلّة }
    topics:
      en:
        - Two-fold degeneracy; good states
        - Higher-order degeneracy; diagonalising W
        - Linear Stark effect in hydrogen (n = 2)
      ar:
        - الانحلال الثنائي؛ الحالات الجيدة
        - الانحلال من رتب أعلى؛ جعل المصفوفة W قطرية
        - ظاهرة شتارك الخطية في الهيدروجين (n = 2)
    reading: Griffiths §7.2
  - week: 10
    title: { en: 'Fine structure, Zeeman and hyperfine effects', ar: البنية الدقيقة وظاهرة زيمان والبنية فائقة الدقة }
    topics:
      en:
        - Relativistic correction and spin–orbit coupling
        - 'Fine-structure formula \(E_{nj}\)'
        - Weak-field, strong-field and intermediate Zeeman effect
        - Hyperfine splitting; the 21 cm line
      ar:
        - التصحيح النسبي والاقتران سبين–مدار
        - 'صيغة البنية الدقيقة \(E_{nj}\)'
        - ظاهرة زيمان في المجال الضعيف والقوي والمتوسط
        - انشطار البنية فائقة الدقة؛ خط 21 سم
    reading: Griffiths §7.3–7.5
    milestone: quiz
  - week: 11
    title: { en: The variational principle, ar: المبدأ التغايري }
    topics:
      en:
        - Theory and trial wavefunctions
        - Ground state of helium
        - Hydrogen molecule ion
        - Second periodic exam
      ar:
        - النظرية والدوال التجريبية
        - الحالة الأرضية لذرة الهيليوم
        - أيون جزيء الهيدروجين
        - الاختبار الدوري الثاني
    reading: Griffiths §8.1–8.3
    milestone: midterm
  - week: 12
    title: { en: The WKB approximation, ar: تقريب WKB }
    topics:
      en:
        - The classical region; quantisation condition
        - Tunnelling; Gamow theory of alpha decay
        - The connection formulas
      ar:
        - المنطقة الكلاسيكية؛ شرط التكميم
        - النفق الكمومي؛ نظرية غاموف لاضمحلال ألفا
        - صيغ الربط
    reading: Griffiths §9.1–9.3
  - week: 13
    title: { en: Time-dependent perturbation theory, ar: نظرية الاضطراب المعتمدة على الزمن }
    topics:
      en:
        - Two-level systems; sinusoidal perturbations
        - Rabi oscillations
        - Emission and absorption of radiation; selection rules
        - Fermi's golden rule
      ar:
        - الأنظمة ذات المستويين؛ الاضطرابات الجيبية
        - تذبذبات رابي
        - انبعاث الإشعاع وامتصاصه؛ قواعد الانتقاء
        - قاعدة فيرمي الذهبية
    reading: Griffiths §11.1–11.4
    activity: { en: Mini-project due; quiz 4, ar: تسليم المشروع المصغّر؛ الاختبار القصير 4 }
    milestone: project
  - week: 14
    title: { en: Scattering and review, ar: الاستطارة والمراجعة }
    topics:
      en:
        - Cross-sections; partial-wave analysis and phase shifts
        - The Born approximation; Yukawa and Coulomb scattering
        - Course review and exam preparation
      ar:
        - المقاطع العرضية؛ تحليل الموجات الجزئية وإزاحات الطور
        - تقريب بورن؛ استطارة يوكاوا وكولوم
        - مراجعة المقرر والتحضير للاختبار
    reading: Griffiths §10.1–10.4
    milestone: review


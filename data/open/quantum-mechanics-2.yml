glossary:
  - { en: Hilbert space, ar: فضاء هيلبرت, fr: Espace de Hilbert, def: { en: Complete vector space with an inner product in which quantum states live., ar: فضاء متجهي تام مزوّد بجداء داخلي تعيش فيه الحالات الكمومية. } }
  - { en: Ket / bra, ar: الكت / البرا, fr: Ket / bra, def: { en: 'Dirac notation for a state vector \(\ket{\psi}\) and its dual \(\bra{\psi}\).', ar: 'ترميز ديراك لمتجه الحالة \(\ket{\psi}\) ولمرافقه الثنوي \(\bra{\psi}\).' } }
  - { en: Hermitian operator, ar: المؤثر الهرميتي, fr: Opérateur hermitien, def: { en: 'Operator equal to its adjoint; it has real eigenvalues and represents an observable.', ar: 'مؤثر يساوي مرافقه؛ قيمه الذاتية حقيقية ويمثّل مقدارًا قابلًا للقياس.' } }
  - { en: Commutator, ar: المبدّل, fr: Commutateur, def: { en: '\(\comm{A}{B} = AB - BA\); non-commuting observables cannot be measured simultaneously with arbitrary precision.', ar: '\(\comm{A}{B} = AB - BA\)؛ المقادير غير المتبادلة لا يمكن قياسها معًا بدقة اعتباطية.' } }
  - { en: Heisenberg picture, ar: صورة هايزنبرغ, fr: Représentation de Heisenberg, def: { en: Description in which operators evolve in time and state vectors are fixed., ar: وصف تتطور فيه المؤثرات مع الزمن بينما تبقى متجهات الحالة ثابتة. } }
  - { en: Ladder operators, ar: مؤثرات السلّم, fr: Opérateurs d'échelle, def: { en: 'Operators such as \(a_\pm\) or \(L_\pm\) that raise or lower a quantum number by one.', ar: 'مؤثرات مثل \(a_\pm\) أو \(L_\pm\) ترفع العدد الكمومي أو تخفضه بمقدار واحد.' } }
  - { en: Angular momentum, ar: الزخم الزاوي, fr: Moment cinétique, def: { en: 'Generator of rotations; its components obey \([J_i,J_j] = i\hbar\epsilon_{ijk}J_k\).', ar: 'مولِّد الدورانات؛ تحقق مركّباته \([J_i,J_j] = i\hbar\epsilon_{ijk}J_k\).' } }
  - { en: Spherical harmonics, ar: التوافقيات الكروية, fr: Harmoniques sphériques, def: { en: 'Common eigenfunctions \(Y_l^m(\theta,\phi)\) of \(L^2\) and \(L_z\).', ar: 'الدوال الذاتية المشتركة \(Y_l^m(\theta,\phi)\) لـ \(L^2\) و\(L_z\).' } }
  - { en: Spin, ar: السبين (اللف المغزلي), fr: Spin, def: { en: Intrinsic angular momentum of a particle with no classical orbital counterpart., ar: زخم زاوي ذاتي للجسيم لا مقابل مداري كلاسيكي له. } }
  - { en: Pauli matrices, ar: مصفوفات باولي, fr: Matrices de Pauli, def: { en: 'The three 2×2 matrices \(\sigma_{x,y,z}\) with \(\vb{S} = \frac{\hbar}{2}\boldsymbol{\sigma}\) for spin ½.', ar: 'المصفوفات الثلاث 2×2 \(\sigma_{x,y,z}\) حيث \(\vb{S} = \frac{\hbar}{2}\boldsymbol{\sigma}\) للسبين ½.' } }
  - { en: Clebsch–Gordan coefficients, ar: معاملات كليبش–غوردن, fr: Coefficients de Clebsch-Gordan, def: { en: Expansion coefficients of coupled angular-momentum states on the uncoupled product basis., ar: معاملات نشر حالات الزخم الزاوي المقترنة على قاعدة الجداءات غير المقترنة. } }
  - { en: Singlet / triplet, ar: الحالة الأحادية / الحالات الثلاثية, fr: Singulet / triplet, def: { en: The total spin 0 and total spin 1 states of two spin-½ particles., ar: حالات السبين الكلي 0 والسبين الكلي 1 لجسيمين سبين كل منهما ½. } }
  - { en: Identical particles, ar: الجسيمات المتطابقة, fr: Particules identiques, def: { en: Particles that cannot be distinguished even in principle; their states are symmetric or antisymmetric under exchange., ar: جسيمات لا يمكن تمييزها حتى من حيث المبدأ؛ وحالاتها متناظرة أو ضد متناظرة بالنسبة للتبادل. } }
  - { en: Boson / fermion, ar: البوزون / الفرميون, fr: Boson / fermion, def: { en: Particle with integer / half-integer spin and symmetric / antisymmetric multiparticle states., ar: جسيم سبينه صحيح / نصف صحيح، وحالاته المتعددة الجسيمات متناظرة / ضد متناظرة. } }
  - { en: Pauli exclusion principle, ar: مبدأ الاستبعاد لباولي, fr: Principe d'exclusion de Pauli, def: { en: No two identical fermions can occupy the same one-particle state., ar: لا يمكن لفرميونين متطابقين أن يشغلا الحالة الأحادية نفسها. } }
  - { en: Exchange force, ar: قوة التبادل, fr: Force d'échange, def: { en: Apparent attraction or repulsion between identical particles due solely to the symmetry of their wavefunction., ar: تجاذب أو تنافر ظاهري بين جسيمات متطابقة ناتج فقط عن تناظر دالتها الموجية. } }
  - { en: Perturbation theory, ar: نظرية الاضطراب, fr: Théorie des perturbations, def: { en: Systematic expansion of energies and states in powers of a small additional Hamiltonian H′., ar: نشر منهجي للطاقات والحالات بقوى هاملتوني إضافي صغير H′. } }
  - { en: Degeneracy, ar: الانحلال, fr: Dégénérescence, def: { en: Existence of several linearly independent states with the same energy., ar: وجود عدة حالات مستقلة خطيًا لها الطاقة نفسها. } }
  - { en: Fine structure, ar: البنية الدقيقة, fr: Structure fine, def: { en: 'Splitting of hydrogen levels of order \(\alpha^2E_n\) due to relativistic and spin–orbit corrections.', ar: 'انشطار مستويات الهيدروجين من رتبة \(\alpha^2E_n\) بسبب التصحيحات النسبية وتصحيح سبين–مدار.' } }
  - { en: Spin–orbit coupling, ar: الاقتران سبين–مدار, fr: Couplage spin-orbite, def: { en: 'Interaction \(\propto \vb{L}\cdot\vb{S}\) between the electron''s spin and the magnetic field it sees in its rest frame.', ar: 'تفاعل \(\propto \vb{L}\cdot\vb{S}\) بين سبين الإلكترون والمجال المغناطيسي الذي يراه في إطاره السكوني.' } }
  - { en: Zeeman effect, ar: ظاهرة زيمان, fr: Effet Zeeman, def: { en: Splitting of atomic levels in an external magnetic field., ar: انشطار المستويات الذرية في مجال مغناطيسي خارجي. } }
  - { en: Stark effect, ar: ظاهرة شتارك, fr: Effet Stark, def: { en: Shift and splitting of atomic levels in an external electric field., ar: انزياح المستويات الذرية وانشطارها في مجال كهربائي خارجي. } }
  - { en: Hyperfine structure, ar: البنية فائقة الدقة, fr: Structure hyperfine, def: { en: Small splitting due to the interaction between electron and nuclear magnetic moments (e.g. the 21 cm line)., ar: انشطار صغير ناتج عن التفاعل بين العزمين المغناطيسيين للإلكترون والنواة (مثل خط 21 سم). } }
  - { en: Variational principle, ar: المبدأ التغايري, fr: Principe variationnel, def: { en: The expectation value of H in any trial state is an upper bound on the ground-state energy., ar: القيمة المتوقعة لـ H في أي حالة تجريبية حدّ أعلى لطاقة الحالة الأرضية. } }
  - { en: WKB approximation, ar: تقريب WKB, fr: Approximation BKW, def: { en: Semiclassical approximation valid when the potential varies slowly on the scale of the de Broglie wavelength., ar: تقريب شبه كلاسيكي صالح حين يتغير الجهد ببطء على سلّم طول موجة دي برولي. } }
  - { en: Turning point, ar: نقطة الانعطاف, fr: Point de rebroussement, def: { en: 'Point where \(E = V(x)\) and the classical particle reverses direction.', ar: 'نقطة يتحقق فيها \(E = V(x)\) ويعكس عندها الجسيم الكلاسيكي اتجاه حركته.' } }
  - { en: Tunnelling, ar: النفق الكمومي, fr: Effet tunnel, def: { en: Quantum penetration through a classically forbidden barrier region., ar: نفاذ كمومي عبر منطقة حاجز ممنوعة كلاسيكيًا. } }
  - { en: Rabi oscillations, ar: تذبذبات رابي, fr: Oscillations de Rabi, def: { en: Periodic population exchange between two levels driven by an oscillating field., ar: تبادل دوري للإشغال بين مستويين تحت تأثير مجال متذبذب. } }
  - { en: Fermi's golden rule, ar: قاعدة فيرمي الذهبية, fr: Règle d'or de Fermi, def: { en: 'Transition rate \(\Gamma = \frac{2\pi}{\hbar}|H''_{fi}|^2\rho(E_f)\) into a continuum of states.', ar: 'معدل الانتقال \(\Gamma = \frac{2\pi}{\hbar}|H''_{fi}|^2\rho(E_f)\) نحو متّصلة من الحالات.' } }
  - { en: Born approximation, ar: تقريب بورن, fr: Approximation de Born, def: { en: First-order treatment of scattering in which the amplitude is the Fourier transform of the potential., ar: معالجة الاستطارة في الرتبة الأولى، تكون فيها السعة تحويل فورييه للجهد. } }

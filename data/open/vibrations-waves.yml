  - { en: Electromechanical analogies, ar: التماثلات الكهروميكانيكية }
  - { en: Coupled oscillators & normal modes, ar: الهزازات المتقارنة والأنماط الذاتية }
  - { en: The wave equation, ar: معادلة الموجة }

  - { en: Dispersion & Doppler effect, ar: التبدد وظاهرة دوبلر }

outcomes:
  - id: CLO1
    bloom: understand
    domain: knowledge
    text:
      en: Describe periodic and simple harmonic motion and explain the exchange between kinetic and potential energy in a vibrating system.
      ar: يصف الحركة الدورية والحركة التوافقية البسيطة ويشرح تبادل الطاقة الحركية والطاقة الكامنة في جملة مهتزة.
    assessed_by: [quizzes, homework, midterm, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: Write the Lagrangian of a mechanical system with one or two degrees of freedom, derive its equations of motion and linearise them for small oscillations about a stable equilibrium.
      ar: يكتب دالة لاغرانج لجملة ميكانيكية ذات درجة حرية واحدة أو درجتين، ويستنتج معادلات حركتها ويحوّلها إلى معادلات خطية في حالة الاهتزازات الصغيرة حول وضع توازن مستقر.
    assessed_by: [homework, midterm, final]
  - id: CLO3
    bloom: analyze
    domain: knowledge
    text:
      en: Analyse damped and driven oscillators — damping regimes, logarithmic decrement, resonance, phase lag, bandwidth, quality factor and absorbed power.
      ar: يحلّل الهزازات المتخامدة والقسرية — أنظمة التخامد، والتناقص اللوغاريتمي، والتجاوب، وفرق الطور، وعرض المجال، ومعامل الجودة، والاستطاعة الممتصة.
    assessed_by: [quizzes, homework, midterm, final]
  - id: CLO4
    bloom: apply
    domain: skills
    text:
      en: Use mechanical–electrical analogies and the concept of impedance to model RLC circuits and electromechanical transducers.
      ar: يستعمل التماثلات الميكانيكية–الكهربائية ومفهوم الممانعة لنمذجة دارات RLC والمحوّلات الكهروميكانيكية.
    assessed_by: [homework, lab, final]
  - id: CLO5
    bloom: analyze
    domain: skills
    text:
      en: Determine the natural frequencies, mode shapes and normal coordinates of coupled systems and interpret beats as a superposition of normal modes.
      ar: يحدّد التواترات الذاتية وأشكال الأنماط والإحداثيات الطبيعية للجمل المتقارنة، ويفسّر الضربات على أنها تراكب لأنماط ذاتية.
    assessed_by: [midterm, lab, final]
  - id: CLO6
    bloom: apply
    domain: knowledge
    text:
      en: Derive and solve the one-dimensional wave equation for strings and fluids, and distinguish phase velocity, group velocity and dispersion.
      ar: يستنتج معادلة الموجة أحادية البعد للأوتار والموائع ويحلّها، ويميّز بين سرعة الطور وسرعة المجموعة والتبدد.
    assessed_by: [quizzes, homework, final]
  - id: CLO7
    bloom: analyze
    domain: skills
    text:
      en: Calculate characteristic impedances, reflection and transmission coefficients, energy flux, standing-wave modes and Doppler shifts in concrete situations.
      ar: يحسب الممانعات المميزة ومعاملات الانعكاس والنفاذ وتدفق الطاقة وأنماط الأمواج المستقرة وانزياح دوبلر في حالات ملموسة.
    assessed_by: [homework, lab, final]
  - id: CLO8
    bloom: evaluate
    domain: values
    text:
      en: Carry out vibration and wave experiments safely, evaluate measurements and uncertainties honestly, and report them clearly and with academic integrity.
      ar: يُجري تجارب الاهتزازات والأمواج بأمان، ويقيّم القياسات وارتياباتها بنزاهة، ويعرضها في تقرير واضح يحترم الأمانة العلمية.
    assessed_by: [lab, participation]

assessment:
  - id: quizzes
    type: quiz
    weight: 5
    title: { en: Tutorial quizzes, ar: اختبارات قصيرة في الأعمال الموجهة }
    detail:
      en: Four 15-minute quizzes at the start of a tutorial session, one per chapter block; one short problem or 3–4 conceptual questions each. The best three count.
      ar: أربعة اختبارات قصيرة مدة كل منها 15 دقيقة في بداية حصة الأعمال الموجهة، اختبار لكل مجموعة فصول؛ يتضمن كل منها مسألة قصيرة أو 3–4 أسئلة مفاهيمية. تُحتسب أفضل ثلاث علامات.
    when: { en: 'Weeks 4, 7, 10, 13', ar: 'الأسابيع 4، 7، 10، 13' }
  - id: homework
    type: homework
    weight: 7
    title: { en: Problem sets, ar: سلاسل التمارين }
    detail:
      en: One problem set per chapter, due one week later. Two problems per set are marked in detail (method, physics, units, final answer); the rest are checked for completion. Solutions must be written individually.
      ar: سلسلة تمارين لكل فصل تُسلَّم بعد أسبوع. تُصحَّح مسألتان من كل سلسلة بالتفصيل (المنهجية، الفيزياء، الوحدات، النتيجة النهائية) ويُتحقَّق من إنجاز البقية. يجب أن يكتب كل طالب حلوله بنفسه.
    when: { en: Weeks 2–13, ar: الأسابيع 2–13 }
  - id: midterm
    type: midterm
    weight: 12
    title: { en: Midterm exam, ar: الاختبار النصفي }
    detail:
      en: 'Written, 1 h. Covers one-degree-of-freedom systems: Lagrange''s equations, free, damped and forced oscillations, electrical analogues.'
      ar: 'كتابي، مدته ساعة واحدة. يشمل الجمل ذات درجة الحرية الواحدة: معادلات لاغرانج، والاهتزازات الحرة والمتخامدة والقسرية، والتماثلات الكهربائية.'
    when: { en: Week 8, ar: الأسبوع 8 }
  - id: lab
    type: lab
    weight: 12
    title: { en: Laboratory work and reports, ar: الأعمال التطبيقية والتقارير }
    detail:
      en: Six experiments (vibrating string, RLC resonance, loudspeaker, coupled oscillators — beats and natural frequencies, Kundt tube). Each is graded on preparation, data quality and a short report with uncertainty analysis; a practical test closes the series.
      ar: ست تجارب (الوتر المهتز، تجاوب دارة RLC، مكبر الصوت، الهزازات المتقارنة — الضربات والتواترات الذاتية، أنبوب كونت). تُقيَّم كل تجربة على التحضير وجودة المعطيات وتقرير قصير يتضمن تحليل الارتيابات؛ وتُختتم السلسلة باختبار تطبيقي.
    when: { en: Weeks 3–13 (alternate weeks), ar: الأسابيع 3–13 (أسبوع بعد أسبوع) }
  - id: participation
    type: participation
    weight: 4
    title: { en: Attendance and participation, ar: الحضور والمشاركة }
    detail:
      en: Attendance at tutorials and active participation (presenting a solution at the board at least once).
      ar: حضور حصص الأعمال الموجهة والمشاركة الفعّالة (عرض حل على السبورة مرة واحدة على الأقل).
    when: { en: Throughout, ar: طوال الفصل }
  - id: final
    type: final
    weight: 60
    title: { en: Final exam, ar: الاختبار النهائي }
    detail:
      en: Written, 1 h 30 min, comprehensive, typically three exercises (one-degree-of-freedom system, coupled system, waves).
      ar: كتابي، مدته ساعة ونصف، شامل لكل المقرر، يتضمن عادة ثلاثة تمارين (جملة ذات درجة حرية واحدة، جملة متقارنة، أمواج).
    when: { en: Exam period, ar: فترة الاختبارات }

schedule:
  - week: 1
    title: { en: Introduction and mathematical toolkit, ar: مدخل وأدوات رياضية }
    topics:
      en:
        - Periodic, harmonic and vibratory motion; examples
        - 'Complex representation \(x = \mathrm{Re}\,(A e^{i\omega t})\)'
        - Second-order linear ODEs with constant coefficients (homogeneous and with a source term)
      ar:
        - الحركة الدورية والتوافقية والاهتزازية؛ أمثلة
        - 'التمثيل المركب \(x = \mathrm{Re}\,(A e^{i\omega t})\)'
        - المعادلات التفاضلية الخطية من الرتبة الثانية ذات المعاملات الثابتة (المتجانسة وذات الطرف الثاني)
    reading: King Ch. 1; French Ch. 1–2
    activity: { en: Problem set 0 (revision) released, ar: نشر السلسلة 0 (مراجعة) }
  - week: 2
    title: { en: Lagrange's equations, ar: معادلات لاغرانج }
    topics:
      en:
        - Degrees of freedom and generalised coordinates
        - 'Kinetic and potential energy; the Lagrangian \(L = T - U\)'
        - Lagrange's equation for a conservative system
        - Equilibrium, stability and small oscillations
      ar:
        - درجات الحرية والإحداثيات المعممة
        - 'الطاقة الحركية والطاقة الكامنة؛ دالة لاغرانج \(L = T - U\)'
        - معادلة لاغرانج لجملة محافظة
        - التوازن والاستقرار والاهتزازات الصغيرة
    reading: Lecture notes Ch. 1; Becherrawy Vol. 1
    activity: { en: Problem set 1 (Lagrange) released, ar: نشر السلسلة 1 (لاغرانج) }
  - week: 3
    title: { en: Free undamped oscillations, ar: الاهتزازات الحرة غير المتخامدة }
    topics:
      en:
        - Mass–spring, simple and compound pendulums, torsion pendulum
        - 'Natural angular frequency \(\omega_0\), period, amplitude and phase'
        - Energy of a harmonic oscillator; equivalent springs
      ar:
        - كتلة–نابض، النواس البسيط والنواس المركب، نواس الفتل
        - 'النبض الذاتي \(\omega_0\) والدور والسعة والطور'
        - طاقة الهزاز التوافقي؛ النوابض المكافئة
    reading: King Ch. 1; French Ch. 3
    activity: { en: Lab 1 — transverse vibrations of a string, ar: التجربة 1 — الاهتزازات العرضية لوتر }
    milestone: lab
  - week: 4
    title: { en: Free damped oscillations, ar: الاهتزازات الحرة المتخامدة }
    topics:
      en:
        - 'Viscous friction and the dissipation function \(D = \tfrac12\alpha\dot q^2\)'
        - Overdamped, critically damped and underdamped regimes
        - Logarithmic decrement, energy decay and quality factor
      ar:
        - 'الاحتكاك اللزج ودالة التبديد \(D = \tfrac12\alpha\dot q^2\)'
        - الأنظمة فوق الحرجة والحرجة وتحت الحرجة (شبه الدورية)
        - التناقص اللوغاريتمي وتناقص الطاقة ومعامل الجودة
    reading: King Ch. 2; French Ch. 3
    activity: { en: Quiz 1 (free oscillations), ar: الاختبار القصير 1 (الاهتزازات الحرة) }
    milestone: quiz
  - week: 5
    title: { en: Forced oscillations (I), ar: الاهتزازات القسرية (1) }
    topics:
      en:
        - Sinusoidal driving force; transient and steady-state solutions
        - Amplitude and phase response curves; displacement resonance
        - Complex method for the steady state
      ar:
        - قوة إثارة جيبية؛ النظام الانتقالي والنظام الدائم
        - منحنيات استجابة السعة والطور؛ تجاوب الانتقال
        - الطريقة المركبة لحساب النظام الدائم
    reading: King Ch. 3; French Ch. 4
    activity: { en: Lab 2 — RLC circuit in free and forced oscillations, ar: التجربة 2 — دارة RLC في الاهتزازات الحرة والقسرية }
    milestone: lab
  - week: 6
    title: { en: Forced oscillations (II), ar: الاهتزازات القسرية (2) }
    topics:
      en:
        - Velocity resonance, absorbed power, bandwidth and Q
        - Mechanical impedance
        - Arbitrary periodic driving force (Fourier series)
      ar:
        - تجاوب السرعة، والاستطاعة الممتصة، وعرض المجال، ومعامل الجودة
        - الممانعة الميكانيكية
        - قوة إثارة دورية كيفية (سلاسل فورييه)
    reading: King Ch. 3; French Ch. 4
  - week: 7
    title: { en: Electrical and electromechanical oscillators, ar: الهزازات الكهربائية والكهروميكانيكية }
    topics:
      en:
        - LC and RLC circuits; force–voltage analogy
        - Electrical impedance and resonance in series RLC
        - 'Electromechanical systems: the electrodynamic loudspeaker'
      ar:
        - 'دارتا LC وRLC؛ التماثل قوة–توتر'
        - الممانعة الكهربائية والتجاوب في دارة RLC على التسلسل
        - 'الجمل الكهروميكانيكية: مكبر الصوت الكهروديناميكي'
    reading: King Ch. 2–3; Bekefi & Barrett Ch. 1
    activity: { en: Quiz 2 (damped and forced); Lab 3 — loudspeaker, ar: الاختبار القصير 2 (التخامد والإثارة)؛ التجربة 3 — مكبر الصوت }
    milestone: quiz
  - week: 8
    title: { en: Coupled oscillators — two degrees of freedom, ar: الهزازات المتقارنة — درجتا حرية }
    topics:
      en:
        - Two masses and three springs; the secular determinant
        - Natural frequencies, mode shapes and normal coordinates
        - General motion as a superposition of normal modes
      ar:
        - كتلتان وثلاثة نوابض؛ المحدد المميز
        - التواترات الذاتية وأشكال الأنماط والإحداثيات الطبيعية
        - الحركة العامة كتراكب للأنماط الذاتية
    reading: King Ch. 4; French Ch. 5
    activity: { en: Midterm exam, ar: الاختبار النصفي }
    milestone: midterm
  - week: 9
    title: { en: 'Coupled oscillators — beats, forcing, N degrees of freedom', ar: الهزازات المتقارنة — الضربات والإثارة وN درجة حرية }
    topics:
      en:
        - Coupled pendulums; weak coupling and beats
        - Damped and driven two-degree-of-freedom systems; dynamic absorber
        - Systems with N degrees of freedom (general behaviour)
      ar:
        - النواسات المتقارنة؛ التقارن الضعيف والضربات
        - الجمل ذات درجتي الحرية المتخامدة والقسرية؛ الماصّ الديناميكي
        - الجمل ذات N درجة حرية (السلوك العام)
    reading: King Ch. 4; French Ch. 5
    activity: { en: 'Lab 4 — coupled oscillations, beats and natural frequencies', ar: التجربة 4 — الاهتزازات المتقارنة، الضربات والتواترات الذاتية }
    milestone: lab
  - week: 10
    title: { en: From oscillators to waves, ar: من الهزازات إلى الأمواج }
    topics:
      en:
        - 'Linear chain of masses and springs; dispersion relation \(\omega(k)\)'
        - 'Continuum limit and the wave equation \(\partial_t^2 y = v^2 \partial_x^2 y\)'
        - 'D''Alembert''s general solution; harmonic travelling waves'
        - Classification of waves; phase velocity and group velocity
      ar:
        - 'السلسلة الخطية من الكتل والنوابض؛ علاقة التبدد \(\omega(k)\)'
        - 'نهاية الوسط المستمر ومعادلة الموجة \(\partial_t^2 y = v^2 \partial_x^2 y\)'
        - الحل العام لدالمبير؛ الأمواج المتنقلة التوافقية
        - تصنيف الأمواج؛ سرعة الطور وسرعة المجموعة
    reading: King Ch. 5, Ch. 8; French Ch. 6–7
    activity: { en: Quiz 3 (coupled oscillators), ar: الاختبار القصير 3 (الهزازات المتقارنة) }
    milestone: quiz
  - week: 11
    title: { en: Transverse waves on a string, ar: الأمواج العرضية على وتر }
    topics:
      en:
        - Equation of motion of a stretched string
        - Characteristic impedance; energy and power of a travelling wave
        - Reflection and transmission at a junction of two strings
      ar:
        - معادلة حركة وتر مشدود
        - الممانعة المميزة؛ طاقة واستطاعة الموجة المتنقلة
        - الانعكاس والنفاذ عند نقطة اتصال وترين
    reading: King Ch. 5; French Ch. 7–8
  - week: 12
    title: { en: Standing waves and waves in 2D and 3D, ar: الأمواج المستقرة والأمواج في بعدين وثلاثة أبعاد }
    topics:
      en:
        - Free vibrations of a string fixed at both ends; normal modes and harmonics
        - Forced vibrations of a string
        - Wavefronts; plane and spherical waves; the wave equation in 3D
      ar:
        - الاهتزازات الحرة لوتر مثبت الطرفين؛ الأنماط الذاتية والتوافقيات
        - الاهتزازات القسرية لوتر
        - صدر الموجة؛ الأمواج المستوية والكروية؛ معادلة الموجة في ثلاثة أبعاد
    reading: King Ch. 6–7; French Ch. 6
    activity: { en: Lab 5 — Kundt tube, ar: التجربة 5 — أنبوب كونت }
    milestone: lab
  - week: 13
    title: { en: Acoustic waves in fluids, ar: الأمواج الصوتية في الموائع }
    topics:
      en:
        - Plane waves in a pipe; wave equation in a gas and in a liquid; speed of sound
        - Acoustic impedance, intensity and decibels
        - Reflection and transmission at an interface; standing waves in pipes
        - The Doppler effect
      ar:
        - الأمواج المستوية في أنبوب؛ معادلة الموجة في غاز وفي سائل؛ سرعة الصوت
        - الممانعة الصوتية والشدة والديسيبل
        - الانعكاس والنفاذ عند سطح فاصل؛ الأمواج المستقرة في الأنابيب
        - ظاهرة دوبلر
    reading: King Ch. 5–6; French Ch. 7–8
    activity: { en: Quiz 4 (waves); Lab 6 — longitudinal waves in a fluid, ar: الاختبار القصير 4 (الأمواج)؛ التجربة 6 — الأمواج الطولية في مائع }
    milestone: quiz
  - week: 14
    title: { en: Elastic waves in solids and review, ar: الأمواج المرنة في الأجسام الصلبة ومراجعة }
    topics:
      en:
        - Longitudinal waves in a bar; Young's modulus and wave speed
        - Synthesis of the course; analogy table (strings, fluids, circuits)
        - Review of past exam problems
      ar:
        - الأمواج الطولية في قضيب؛ معامل يونغ وسرعة الموجة
        - تركيب المقرر؛ جدول التماثلات (أوتار، موائع، دارات)
        - مراجعة مسائل الاختبارات السابقة
    reading: French Ch. 6; Lecture notes Ch. 8
    milestone: review


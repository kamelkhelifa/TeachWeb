exam_guide:
  format:
    en: The final exam is a 1 h 30 min written paper with three independent exercises of roughly equal weight — typically one on a one-degree-of-freedom system (Lagrangian, damping, forcing), one on a coupled two-degree-of-freedom system, and one on waves (strings or acoustics). The midterm (1 h) covers weeks 1–7.
    ar: الاختبار النهائي ورقة كتابية مدتها ساعة ونصف تتضمن ثلاثة تمارين مستقلة متقاربة الوزن — عادةً تمرين حول جملة ذات درجة حرية واحدة (دالة لاغرانج، التخامد، الإثارة)، وتمرين حول جملة متقارنة ذات درجتي حرية، وتمرين حول الأمواج (الأوتار أو الصوتيات). ويشمل الاختبار النصفي (ساعة واحدة) الأسابيع 1–7.
  allowed:
    en: A non-programmable scientific calculator. No notes or books; a short formula sheet (trigonometric identities, useful integrals) is printed with the paper when needed.
    ar: آلة حاسبة علمية غير قابلة للبرمجة. لا يُسمح بالمذكرات أو الكتب؛ وتُرفق بالورقة عند الحاجة قائمة صيغ مختصرة (متطابقات مثلثية وتكاملات مفيدة).
  tips:
    - en: For every mechanical system, start by choosing the generalised coordinate, then write T, U (and D) before anything else — most marks come from a correct Lagrangian.
      ar: في كل جملة ميكانيكية ابدأ باختيار الإحداثية المعممة، ثم اكتب T وU (وD) قبل أي شيء آخر — فمعظم العلامة تأتي من دالة لاغرانج صحيحة.
    - en: 'Linearise only at the end: expand \(\cos\theta \approx 1-\theta^2/2\) and \(\sin\theta\approx\theta\) in the energies, and keep terms of second order.'
      ar: 'لا تجعل المعادلة خطية إلا في النهاية: انشر \(\cos\theta \approx 1-\theta^2/2\) و\(\sin\theta\approx\theta\) في عبارات الطاقة واحتفظ بحدود الرتبة الثانية.'
    - en: Check dimensions and limiting cases (zero damping, zero coupling, equal impedances) — they catch most algebra slips.
      ar: تحقّق من الأبعاد ومن الحالات الحدّية (تخامد معدوم، تقارن معدوم، ممانعات متساوية) — فهي تكشف معظم الأخطاء الجبرية.
    - en: In wave problems, write the boundary conditions explicitly (continuity of displacement and of force or pressure) before solving for r and t.
      ar: في مسائل الأمواج، اكتب الشروط الحدية صراحةً (استمرار الانتقال واستمرار القوة أو الضغط) قبل حساب r وt.
    - en: Give numerical results with units and a sensible number of significant figures.
      ar: أعطِ النتائج العددية مع وحداتها وبعدد معقول من الأرقام المعنوية.

problems:
  - title: { en: Pendulum stiffened by a spring, ar: نواس مدعوم بنابض }
    difficulty: 1
    statement:
      en: |
        A point mass \(m\) hangs at the end of a massless rigid rod of length \(l\) that pivots freely about a horizontal axis O. A horizontal spring of stiffness \(k\) is attached to the rod at a distance \(a\) below O; its other end is fixed, and the spring is unstretched when the rod is vertical. Let \(\theta\) be the angle of the rod with the vertical.

        (a) Write the kinetic and potential energies and the Lagrangian.
        (b) Derive the equation of motion for small oscillations and the natural angular frequency \(\omega_0\).
        (c) Compute \(\omega_0\) and the period for \(m = 0.5\ \text{kg}\), \(l = 0.4\ \text{m}\), \(a = 0.2\ \text{m}\), \(k = 20\ \text{N/m}\), \(g = 9.8\ \text{m/s}^2\).
      ar: |
        كتلة نقطية \(m\) معلّقة في طرف قضيب صلب مهمل الكتلة طوله \(l\) يدور بحرية حول محور أفقي O. يُثبَّت في القضيب نابض أفقي ثابت مرونته \(k\) على بعد \(a\) أسفل O، وطرفه الآخر مثبت، ويكون النابض غير مشوَّه عندما يكون القضيب شاقوليًا. لتكن \(\theta\) زاوية القضيب مع الشاقول.

        (أ) اكتب الطاقة الحركية والطاقة الكامنة ودالة لاغرانج.
        (ب) استنتج معادلة الحركة في حالة الاهتزازات الصغيرة والنبض الذاتي \(\omega_0\).
        (ج) احسب \(\omega_0\) والدور من أجل \(m = 0.5\ \text{kg}\)، \(l = 0.4\ \text{m}\)، \(a = 0.2\ \text{m}\)، \(k = 20\ \text{N/m}\)، \(g = 9.8\ \text{m/s}^2\).
    hint:
      en: 'The horizontal stretch of the spring is \(a\sin\theta\). Expand both potential energies to second order in \(\theta\).'
      ar: 'استطالة النابض الأفقية هي \(a\sin\theta\). انشر عبارتي الطاقة الكامنة حتى الرتبة الثانية في \(\theta\).'
    solution:
      en: |
        (a) The mass moves on a circle of radius \(l\): \(T = \tfrac12 m l^2\dot\theta^2\). Taking the lowest position as reference for gravity,
        \[ U = mgl(1-\cos\theta) + \tfrac12 k a^2\sin^2\theta, \qquad L = T - U. \]

        (b) For small angles \(1-\cos\theta\approx \theta^2/2\) and \(\sin^2\theta\approx\theta^2\), so
        \[ U \approx \tfrac12\left(mgl + k a^2\right)\theta^2 . \]
        Lagrange's equation \(\dv{}{t}\pdv{L}{\dot\theta} - \pdv{L}{\theta} = 0\) gives
        \[ m l^2\ddot\theta + \left(mgl + k a^2\right)\theta = 0, \qquad \omega_0^2 = \frac{g}{l} + \frac{k a^2}{m l^2}. \]
        The spring simply adds its stiffness to the gravitational restoring torque.

        (c) \(g/l = 24.5\ \text{s}^{-2}\) and \(k a^2/(m l^2) = 0.8/0.08 = 10\ \text{s}^{-2}\), so \(\omega_0^2 = 34.5\ \text{s}^{-2}\),
        \[ \omega_0 \approx 5.87\ \text{rad/s}, \qquad T_0 = \frac{2\pi}{\omega_0} \approx 1.07\ \text{s}. \]
      ar: |
        (أ) تتحرك الكتلة على دائرة نصف قطرها \(l\): \(T = \tfrac12 m l^2\dot\theta^2\). وباعتبار الوضع الأدنى مرجعًا للثقالة:
        \[ U = mgl(1-\cos\theta) + \tfrac12 k a^2\sin^2\theta, \qquad L = T - U. \]

        (ب) من أجل الزوايا الصغيرة \(1-\cos\theta\approx \theta^2/2\) و\(\sin^2\theta\approx\theta^2\)، ومنه
        \[ U \approx \tfrac12\left(mgl + k a^2\right)\theta^2 . \]
        تعطي معادلة لاغرانج \(\dv{}{t}\pdv{L}{\dot\theta} - \pdv{L}{\theta} = 0\):
        \[ m l^2\ddot\theta + \left(mgl + k a^2\right)\theta = 0, \qquad \omega_0^2 = \frac{g}{l} + \frac{k a^2}{m l^2}. \]
        أي أن النابض يضيف صلابته إلى عزم الإرجاع الناتج عن الثقالة.

        (ج) \(g/l = 24.5\ \text{s}^{-2}\) و\(k a^2/(m l^2) = 0.8/0.08 = 10\ \text{s}^{-2}\)، إذن \(\omega_0^2 = 34.5\ \text{s}^{-2}\)،
        \[ \omega_0 \approx 5.87\ \text{rad/s}, \qquad T_0 = \frac{2\pi}{\omega_0} \approx 1.07\ \text{s}. \]
  - title: { en: Measuring damping from a decay record, ar: قياس التخامد من منحنى التناقص }
    difficulty: 2
    statement:
      en: |
        A mass \(m = 0.20\ \text{kg}\) attached to a spring \(k = 80\ \text{N/m}\) moves in a viscous medium (friction force \(-\alpha\dot x\)). The amplitude of the oscillations is observed to halve after exactly 10 oscillations.

        (a) Find the logarithmic decrement \(\delta\).
        (b) Find the damping constant \(\lambda = \alpha/2m\) and the friction coefficient \(\alpha\).
        (c) Find the quality factor \(Q\). By what factor has the mechanical energy decreased after the 10 oscillations?
      ar: |
        كتلة \(m = 0.20\ \text{kg}\) مثبتة بنابض \(k = 80\ \text{N/m}\) تتحرك في وسط لزج (قوة احتكاك \(-\alpha\dot x\)). نلاحظ أن سعة الاهتزازات تنقص إلى النصف بعد 10 اهتزازات بالضبط.

        (أ) أوجد التناقص اللوغاريتمي \(\delta\).
        (ب) أوجد ثابت التخامد \(\lambda = \alpha/2m\) ومعامل الاحتكاك \(\alpha\).
        (ج) أوجد معامل الجودة \(Q\). بأي معامل نقصت الطاقة الميكانيكية بعد الاهتزازات العشر؟
    hint:
      en: 'In the underdamped regime \(x(t) = A e^{-\lambda t}\cos(\omega_d t+\varphi)\), so the ratio of successive maxima is \(e^{\lambda T_d}\).'
      ar: 'في النظام شبه الدوري \(x(t) = A e^{-\lambda t}\cos(\omega_d t+\varphi)\)، لذا فإن نسبة قيمتين عظميين متتاليتين هي \(e^{\lambda T_d}\).'
    solution:
      en: |
        (a) After \(n\) pseudo-periods the amplitude ratio is \(e^{n\lambda T_d} = e^{n\delta}\). With \(n = 10\) and ratio 2:
        \[ \delta = \frac{\ln 2}{10} \approx 0.0693 . \]

        (b) \(\omega_0 = \sqrt{k/m} = 20\ \text{rad/s}\). The damping is weak (\(\lambda\ll\omega_0\), checked below), so \(T_d\approx 2\pi/\omega_0 = 0.314\ \text{s}\) and
        \[ \lambda = \frac{\delta}{T_d} \approx 0.221\ \text{s}^{-1}, \qquad \alpha = 2m\lambda \approx 0.088\ \text{kg/s}. \]
        Indeed \(\omega_d = \sqrt{\omega_0^2-\lambda^2}\) differs from \(\omega_0\) by about one part in \(10^4\).

        (c) \[ Q = \frac{\omega_0}{2\lambda} \approx 45 \qquad (\text{equivalently } Q\approx \pi/\delta). \]
        The energy is proportional to the square of the amplitude, so after 10 oscillations it has decreased by a factor \(2^2 = 4\).
      ar: |
        (أ) بعد \(n\) من أشباه الأدوار تكون نسبة السعتين \(e^{n\lambda T_d} = e^{n\delta}\). ومع \(n = 10\) والنسبة 2:
        \[ \delta = \frac{\ln 2}{10} \approx 0.0693 . \]

        (ب) \(\omega_0 = \sqrt{k/m} = 20\ \text{rad/s}\). التخامد ضعيف (\(\lambda\ll\omega_0\)، كما نتحقق أدناه)، لذا \(T_d\approx 2\pi/\omega_0 = 0.314\ \text{s}\) و
        \[ \lambda = \frac{\delta}{T_d} \approx 0.221\ \text{s}^{-1}, \qquad \alpha = 2m\lambda \approx 0.088\ \text{kg/s}. \]
        وفعلًا يختلف \(\omega_d = \sqrt{\omega_0^2-\lambda^2}\) عن \(\omega_0\) بجزء واحد تقريبًا من \(10^4\).

        (ج) \[ Q = \frac{\omega_0}{2\lambda} \approx 45, \]
        وهو ما يوافق أيضًا \(Q\approx \pi/\delta\).
        الطاقة متناسبة مع مربع السعة، لذا فإنها تنقص بعد 10 اهتزازات بمعامل \(2^2 = 4\).
  - title: { en: Resonance curve of a driven oscillator, ar: منحنى التجاوب لهزاز قسري }
    difficulty: 2
    statement:
      en: |
        A mass \(m = 1\ \text{kg}\), spring \(k = 100\ \text{N/m}\) and damper \(\alpha = 2\ \text{kg/s}\) are driven by \(F(t) = F_0\cos\Omega t\) with \(F_0 = 1\ \text{N}\).

        (a) Using complex notation, find the steady-state amplitude \(X(\Omega)\) and phase lag \(\varphi(\Omega)\).
        (b) Find the frequency of displacement resonance and the maximum amplitude.
        (c) Find the bandwidth \(\Delta\omega\), the quality factor, and the average power absorbed at \(\Omega = \omega_0\).
      ar: |
        كتلة \(m = 1\ \text{kg}\) ونابض \(k = 100\ \text{N/m}\) ومخمِّد \(\alpha = 2\ \text{kg/s}\) تخضع لقوة إثارة \(F(t) = F_0\cos\Omega t\) حيث \(F_0 = 1\ \text{N}\).

        (أ) باستعمال الترميز المركب، أوجد سعة النظام الدائم \(X(\Omega)\) وتأخر الطور \(\varphi(\Omega)\).
        (ب) أوجد تواتر تجاوب الانتقال والسعة العظمى.
        (ج) أوجد عرض المجال \(\Delta\omega\) ومعامل الجودة ومتوسط الاستطاعة الممتصة عند \(\Omega = \omega_0\).
    hint:
      en: 'Set \(x = \mathrm{Re}(\underline{X}e^{i\Omega t})\); the amplitude is maximal where the denominator \((\omega_0^2-\Omega^2)^2 + 4\lambda^2\Omega^2\) is minimal.'
      ar: 'ضع \(x = \mathrm{Re}(\underline{X}e^{i\Omega t})\)؛ تكون السعة عظمى حين يكون المقام \((\omega_0^2-\Omega^2)^2 + 4\lambda^2\Omega^2\) أصغريًا.'
    solution:
      en: |
        (a) With \(\omega_0^2 = k/m = 100\ \text{s}^{-2}\) and \(2\lambda = \alpha/m = 2\ \text{s}^{-1}\), the equation \(\ddot x + 2\lambda\dot x + \omega_0^2 x = (F_0/m)\cos\Omega t\) gives \(\underline{X} = \dfrac{F_0/m}{\omega_0^2-\Omega^2+2i\lambda\Omega}\), hence
        \[ X(\Omega) = \frac{F_0/m}{\sqrt{(\omega_0^2-\Omega^2)^2+4\lambda^2\Omega^2}}, \qquad \tan\varphi = \frac{2\lambda\Omega}{\omega_0^2-\Omega^2}, \]
        with \(x = X\cos(\Omega t-\varphi)\): the displacement lags the force by \(\varphi\in[0,\pi]\).

        (b) Minimising the denominator with respect to \(\Omega^2\) gives \(\Omega_r^2 = \omega_0^2 - 2\lambda^2\):
        \[ \Omega_r = \sqrt{98} \approx 9.90\ \text{rad/s}, \qquad X_{\max} = \frac{F_0/m}{2\lambda\sqrt{\omega_0^2-\lambda^2}} = \frac{1}{2\sqrt{99}} \approx 5.03\ \text{cm}. \]

        (c) The power resonance occurs at \(\omega_0\) and the half-power bandwidth is \(\Delta\omega = 2\lambda = 2\ \text{rad/s}\), so \(Q = \omega_0/\Delta\omega = 5\). At \(\Omega=\omega_0\) the velocity amplitude is \(F_0/\alpha\) and is in phase with the force:
        \[ \langle P\rangle = \frac{F_0^2}{2\alpha} = 0.25\ \text{W}. \]
        Check: \(X(\omega_0) = F_0/(2m\lambda\omega_0) = 5\ \text{cm} = Q\times(F_0/k)\).
      ar: |
        (أ) مع \(\omega_0^2 = k/m = 100\ \text{s}^{-2}\) و\(2\lambda = \alpha/m = 2\ \text{s}^{-1}\)، تعطي المعادلة \(\ddot x + 2\lambda\dot x + \omega_0^2 x = (F_0/m)\cos\Omega t\) السعة المركبة \(\underline{X} = \dfrac{F_0/m}{\omega_0^2-\Omega^2+2i\lambda\Omega}\)، ومنه
        \[ X(\Omega) = \frac{F_0/m}{\sqrt{(\omega_0^2-\Omega^2)^2+4\lambda^2\Omega^2}}, \qquad \tan\varphi = \frac{2\lambda\Omega}{\omega_0^2-\Omega^2}, \]
        مع \(x = X\cos(\Omega t-\varphi)\): أي أن الانتقال يتأخر عن القوة بـ \(\varphi\in[0,\pi]\).

        (ب) بجعل المقام أصغريًا بالنسبة إلى \(\Omega^2\) نجد \(\Omega_r^2 = \omega_0^2 - 2\lambda^2\):
        \[ \Omega_r = \sqrt{98} \approx 9.90\ \text{rad/s}, \qquad X_{\max} = \frac{F_0/m}{2\lambda\sqrt{\omega_0^2-\lambda^2}} = \frac{1}{2\sqrt{99}} \approx 5.03\ \text{cm}. \]

        (ج) يحدث تجاوب الاستطاعة عند \(\omega_0\)، وعرض المجال عند نصف الاستطاعة هو \(\Delta\omega = 2\lambda = 2\ \text{rad/s}\)، إذن \(Q = \omega_0/\Delta\omega = 5\). عند \(\Omega=\omega_0\) تكون سعة السرعة \(F_0/\alpha\) وهي على توافق في الطور مع القوة:
        \[ \langle P\rangle = \frac{F_0^2}{2\alpha} = 0.25\ \text{W}. \]
        تحقق: \(X(\omega_0) = F_0/(2m\lambda\omega_0) = 5\ \text{cm} = Q\times(F_0/k)\).
  - title: { en: Two coupled masses and beats, ar: كتلتان متقارنتان والضربات }
    difficulty: 3
    statement:
      en: |
        Two identical masses \(m\) slide without friction on a horizontal line. Each is attached to a fixed wall by a spring \(k\), and they are joined to each other by a coupling spring \(K\). Let \(x_1, x_2\) be the displacements from equilibrium.

        (a) Write the Lagrangian and the equations of motion.
        (b) Find the two natural angular frequencies and the corresponding mode shapes; define the normal coordinates.
        (c) At \(t = 0\), \(x_1 = A\), \(x_2 = 0\), both at rest. Find \(x_1(t)\) and \(x_2(t)\).
        (d) For \(m = 0.1\ \text{kg}\), \(k = 10\ \text{N/m}\), \(K = 0.5\ \text{N/m}\), how long does it take for the energy to pass completely from mass 1 to mass 2?
      ar: |
        كتلتان متماثلتان \(m\) تنزلقان دون احتكاك على مستقيم أفقي. كل منهما مربوطة بجدار ثابت بنابض \(k\)، وتربط بينهما نابض تقارن \(K\). ليكن \(x_1, x_2\) انتقالَيهما عن وضع التوازن.

        (أ) اكتب دالة لاغرانج ومعادلات الحركة.
        (ب) أوجد النبضين الذاتيين وأشكال الأنماط الموافقة، وعرّف الإحداثيات الطبيعية.
        (ج) عند \(t = 0\): \(x_1 = A\)، \(x_2 = 0\)، والكتلتان ساكنتان. أوجد \(x_1(t)\) و\(x_2(t)\).
        (د) من أجل \(m = 0.1\ \text{kg}\)، \(k = 10\ \text{N/m}\)، \(K = 0.5\ \text{N/m}\)، ما المدة اللازمة لانتقال الطاقة كليًا من الكتلة 1 إلى الكتلة 2؟
    hint:
      en: 'Look for solutions \(x_j = A_j\cos\omega t\) and set the determinant of the linear system to zero. Use \(\cos a + \cos b = 2\cos\frac{a+b}{2}\cos\frac{a-b}{2}\).'
      ar: 'ابحث عن حلول من الشكل \(x_j = A_j\cos\omega t\) واجعل محدد الجملة الخطية معدومًا. استعمل \(\cos a + \cos b = 2\cos\frac{a+b}{2}\cos\frac{a-b}{2}\).'
    solution:
      en: |
        (a) \[ L = \tfrac12 m(\dot x_1^2+\dot x_2^2) - \tfrac12 k x_1^2 - \tfrac12 k x_2^2 - \tfrac12 K (x_2-x_1)^2 , \]
        \[ m\ddot x_1 + (k+K)x_1 - K x_2 = 0, \qquad m\ddot x_2 + (k+K)x_2 - K x_1 = 0. \]

        (b) With \(x_j = A_j\cos\omega t\): \(\left(k+K-m\omega^2\right)^2 - K^2 = 0\), so \(k+K-m\omega^2 = \pm K\):
        \[ \omega_1 = \sqrt{\frac{k}{m}}\ \ (A_1 = A_2,\ \text{in phase}), \qquad \omega_2 = \sqrt{\frac{k+2K}{m}}\ \ (A_1 = -A_2,\ \text{antiphase}). \]
        The normal coordinates \(q_1 = (x_1+x_2)/\sqrt2\) and \(q_2 = (x_1-x_2)/\sqrt2\) obey uncoupled equations \(\ddot q_i + \omega_i^2 q_i = 0\).

        (c) The initial conditions give \(q_1(0) = q_2(0) = A/\sqrt2\) and zero velocities, so \(x_{1,2} = \tfrac{A}{2}(\cos\omega_1 t \pm \cos\omega_2 t)\):
        \[ x_1 = A\cos\!\Big(\frac{\omega_2-\omega_1}{2}t\Big)\cos\!\Big(\frac{\omega_2+\omega_1}{2}t\Big), \qquad x_2 = A\sin\!\Big(\frac{\omega_2-\omega_1}{2}t\Big)\sin\!\Big(\frac{\omega_2+\omega_1}{2}t\Big). \]
        Each mass oscillates at the mean frequency with a slowly modulated envelope: beats.

        (d) \(\omega_1 = 10\ \text{rad/s}\), \(\omega_2 = \sqrt{110}\approx 10.49\ \text{rad/s}\). Mass 1 is at rest (all energy in mass 2) when \(\tfrac12(\omega_2-\omega_1)t = \pi/2\):
        \[ \tau = \frac{\pi}{\omega_2-\omega_1} \approx \frac{3.142}{0.488} \approx 6.4\ \text{s}. \]
      ar: |
        (أ) \[ L = \tfrac12 m(\dot x_1^2+\dot x_2^2) - \tfrac12 k x_1^2 - \tfrac12 k x_2^2 - \tfrac12 K (x_2-x_1)^2 , \]
        \[ m\ddot x_1 + (k+K)x_1 - K x_2 = 0, \qquad m\ddot x_2 + (k+K)x_2 - K x_1 = 0. \]

        (ب) بوضع \(x_j = A_j\cos\omega t\): \(\left(k+K-m\omega^2\right)^2 - K^2 = 0\)، أي \(k+K-m\omega^2 = \pm K\):
        \[ \omega_1 = \sqrt{\frac{k}{m}}\ \ (A_1 = A_2), \qquad \omega_2 = \sqrt{\frac{k+2K}{m}}\ \ (A_1 = -A_2). \]
        النمط الأول تهتز فيه الكتلتان على توافق في الطور، والثاني على تعاكس في الطور.
        وتحقق الإحداثيات الطبيعية \(q_1 = (x_1+x_2)/\sqrt2\) و\(q_2 = (x_1-x_2)/\sqrt2\) معادلتين مستقلتين \(\ddot q_i + \omega_i^2 q_i = 0\).

        (ج) تعطي الشروط الابتدائية \(q_1(0) = q_2(0) = A/\sqrt2\) وسرعتين معدومتين، ومنه \(x_{1,2} = \tfrac{A}{2}(\cos\omega_1 t \pm \cos\omega_2 t)\):
        \[ x_1 = A\cos\!\Big(\frac{\omega_2-\omega_1}{2}t\Big)\cos\!\Big(\frac{\omega_2+\omega_1}{2}t\Big), \qquad x_2 = A\sin\!\Big(\frac{\omega_2-\omega_1}{2}t\Big)\sin\!\Big(\frac{\omega_2+\omega_1}{2}t\Big). \]
        تهتز كل كتلة بالتواتر المتوسط مع غلاف يتغير ببطء: إنها ظاهرة الضربات.

        (د) \(\omega_1 = 10\ \text{rad/s}\)، \(\omega_2 = \sqrt{110}\approx 10.49\ \text{rad/s}\). تتوقف الكتلة 1 (وتصبح الطاقة كلها في الكتلة 2) عندما \(\tfrac12(\omega_2-\omega_1)t = \pi/2\):
        \[ \tau = \frac{\pi}{\omega_2-\omega_1} \approx \frac{3.142}{0.488} \approx 6.4\ \text{s}. \]
  - title: { en: Junction of two strings, ar: نقطة اتصال وترين }
    difficulty: 2
    statement:
      en: |
        Two long strings with linear densities \(\mu_1\) and \(\mu_2 = 4\mu_1\) are joined at \(x = 0\) and stretched with the same tension \(T\). A harmonic wave \(y_i = A\cos(\omega t - k_1 x)\) arrives from \(x<0\).

        (a) Write the boundary conditions at the junction and derive the amplitude reflection and transmission coefficients \(r\) and \(t\) in terms of the impedances \(Z_j = \sqrt{T\mu_j}\).
        (b) Evaluate \(r\), \(t\) and the fractions of power reflected and transmitted; check energy conservation.
        (c) Find the wave speeds for \(T = 40\ \text{N}\), \(\mu_1 = 0.01\ \text{kg/m}\).
      ar: |
        وتران طويلان كثافتاهما الخطيتان \(\mu_1\) و\(\mu_2 = 4\mu_1\) متصلان عند \(x = 0\) ومشدودان بالتوتر نفسه \(T\). تصل موجة توافقية \(y_i = A\cos(\omega t - k_1 x)\) من الجهة \(x<0\).

        (أ) اكتب الشروط الحدية عند نقطة الاتصال واستنتج معاملَي الانعكاس والنفاذ للسعة \(r\) و\(t\) بدلالة الممانعتين \(Z_j = \sqrt{T\mu_j}\).
        (ب) احسب \(r\) و\(t\) ونسبتي الاستطاعة المنعكسة والنافذة، وتحقق من انحفاظ الطاقة.
        (ج) أوجد سرعتي الانتشار من أجل \(T = 40\ \text{N}\)، \(\mu_1 = 0.01\ \text{kg/m}\).
    hint:
      en: 'The string is continuous (\(y\) continuous) and the massless junction has no net transverse force (\(\partial y/\partial x\) continuous). For a travelling wave \(T\,\partial_x y = \mp Z\,\partial_t y\).'
      ar: 'الوتر متصل (\(y\) مستمرة)، ونقطة الاتصال مهملة الكتلة فلا تخضع لقوة عرضية محصلة (\(\partial y/\partial x\) مستمرة). وفي الموجة المتنقلة \(T\,\partial_x y = \mp Z\,\partial_t y\).'
    solution:
      en: |
        (a) Write \(y_1 = A\cos(\omega t-k_1x) + rA\cos(\omega t+k_1x)\) for \(x<0\) and \(y_2 = tA\cos(\omega t-k_2x)\) for \(x>0\), with \(k_j = \omega/v_j\), \(v_j = \sqrt{T/\mu_j}\). Continuity of \(y\) at \(x=0\): \(1 + r = t\). Continuity of \(T\,\partial_x y\): \(k_1(1-r) = k_2 t\). Since \(Tk_j = \omega Z_j\),
        \[ r = \frac{Z_1-Z_2}{Z_1+Z_2}, \qquad t = \frac{2Z_1}{Z_1+Z_2}. \]

        (b) \(Z_2 = \sqrt{4}\,Z_1 = 2Z_1\), so \(r = -\tfrac13\) (reflected wave inverted) and \(t = \tfrac23\). The power of a wave is \(\tfrac12 Z\omega^2A^2\), so
        \[ R = r^2 = \frac19, \qquad \mathcal{T} = \frac{Z_2}{Z_1}t^2 = 2\cdot\frac49 = \frac89, \qquad R+\mathcal{T} = 1. \]

        (c) \(v_1 = \sqrt{40/0.01} \approx 63.2\ \text{m/s}\) and \(v_2 = v_1/2 \approx 31.6\ \text{m/s}\).
      ar: |
        (أ) نكتب \(y_1 = A\cos(\omega t-k_1x) + rA\cos(\omega t+k_1x)\) من أجل \(x<0\) و\(y_2 = tA\cos(\omega t-k_2x)\) من أجل \(x>0\)، حيث \(k_j = \omega/v_j\) و\(v_j = \sqrt{T/\mu_j}\). استمرار \(y\) عند \(x=0\): \(1 + r = t\). استمرار \(T\,\partial_x y\): \(k_1(1-r) = k_2 t\). وبما أن \(Tk_j = \omega Z_j\):
        \[ r = \frac{Z_1-Z_2}{Z_1+Z_2}, \qquad t = \frac{2Z_1}{Z_1+Z_2}. \]

        (ب) \(Z_2 = \sqrt{4}\,Z_1 = 2Z_1\)، إذن \(r = -\tfrac13\) (الموجة المنعكسة مقلوبة) و\(t = \tfrac23\). استطاعة الموجة هي \(\tfrac12 Z\omega^2A^2\)، ومنه
        \[ R = r^2 = \frac19, \qquad \mathcal{T} = \frac{Z_2}{Z_1}t^2 = 2\cdot\frac49 = \frac89, \qquad R+\mathcal{T} = 1. \]

        (ج) \(v_1 = \sqrt{40/0.01} \approx 63.2\ \text{m/s}\) و\(v_2 = v_1/2 \approx 31.6\ \text{m/s}\).
  - title: { en: Sound at an air–water interface and in a closed pipe, ar: الصوت عند السطح الفاصل هواء–ماء وفي أنبوب مغلق }
    difficulty: 3
    statement:
      en: |
        (a) A plane sound wave in air (\(\rho_1 = 1.2\ \text{kg/m}^3\), \(c_1 = 340\ \text{m/s}\)) hits the flat surface of water (\(\rho_2 = 1000\ \text{kg/m}^3\), \(c_2 = 1480\ \text{m/s}\)) at normal incidence. Compute the specific acoustic impedances, the fraction of the incident intensity transmitted into the water, and express it in decibels.
        (b) A pipe of length \(L = 0.85\ \text{m}\) is closed at one end and open at the other. Find the three lowest resonance frequencies in air.
        (c) The pipe, sounding its fundamental, moves towards a stationary listener at \(20\ \text{m/s}\). What frequency does the listener hear?
      ar: |
        (أ) موجة صوتية مستوية في الهواء (\(\rho_1 = 1.2\ \text{kg/m}^3\)، \(c_1 = 340\ \text{m/s}\)) تسقط ناظميًا على سطح ماء مستوٍ (\(\rho_2 = 1000\ \text{kg/m}^3\)، \(c_2 = 1480\ \text{m/s}\)). احسب الممانعتين الصوتيتين النوعيتين، ونسبة الشدة الواردة التي تنفذ إلى الماء، وعبّر عنها بالديسيبل.
        (ب) أنبوب طوله \(L = 0.85\ \text{m}\) مغلق من طرف ومفتوح من الطرف الآخر. أوجد أدنى ثلاثة تواترات تجاوب في الهواء.
        (ج) يتحرك الأنبوب وهو يُصدر صوته الأساسي نحو مستمع ساكن بسرعة \(20\ \text{m/s}\). ما التواتر الذي يسمعه المستمع؟
    hint:
      en: 'Intensity transmission coefficient \(\mathcal{T} = 4Z_1Z_2/(Z_1+Z_2)^2\). A closed end is a displacement node (pressure antinode), an open end a displacement antinode.'
      ar: 'معامل نفاذ الشدة \(\mathcal{T} = 4Z_1Z_2/(Z_1+Z_2)^2\). الطرف المغلق عقدة انتقال (بطن ضغط)، والطرف المفتوح بطن انتقال.'
    solution:
      en: |
        (a) \(Z = \rho c\): \(Z_1 = 408\ \text{kg\,m}^{-2}\text{s}^{-1}\) and \(Z_2 = 1.48\times10^{6}\ \text{kg\,m}^{-2}\text{s}^{-1}\). Pressure and normal particle velocity are continuous, which gives
        \[ \mathcal{T} = \frac{4Z_1Z_2}{(Z_1+Z_2)^2} \approx \frac{4Z_1}{Z_2} \approx 1.1\times10^{-3}, \qquad 10\log_{10}\mathcal{T}\approx -29.6\ \text{dB}. \]
        Only about 0.1 % of the sound energy enters the water: the impedance mismatch is huge.

        (b) The pipe length must hold an odd number of quarter wavelengths, \(L = (2n-1)\lambda/4\):
        \[ f_n = \frac{(2n-1)c}{4L} = 100,\ 300,\ 500\ \text{Hz}. \]
        Only odd harmonics are present.

        (c) For a source moving towards a stationary observer, the wavelength ahead of the source is shortened:
        \[ f' = f\,\frac{c}{c - v_s} = 100\times\frac{340}{320} \approx 106\ \text{Hz}. \]
      ar: |
        (أ) \(Z = \rho c\): \(Z_1 = 408\ \text{kg\,m}^{-2}\text{s}^{-1}\) و\(Z_2 = 1.48\times10^{6}\ \text{kg\,m}^{-2}\text{s}^{-1}\). استمرار الضغط والسرعة الناظمية للجسيمات يعطي
        \[ \mathcal{T} = \frac{4Z_1Z_2}{(Z_1+Z_2)^2} \approx \frac{4Z_1}{Z_2} \approx 1.1\times10^{-3}, \qquad 10\log_{10}\mathcal{T}\approx -29.6\ \text{dB}. \]
        أي أن نحو 0.1 % فقط من الطاقة الصوتية يدخل الماء: عدم توافق الممانعتين كبير جدًا.

        (ب) يجب أن يحتوي طول الأنبوب عددًا فرديًا من أرباع طول الموجة، \(L = (2n-1)\lambda/4\):
        \[ f_n = \frac{(2n-1)c}{4L} = 100,\ 300,\ 500\ \text{Hz}. \]
        فلا توجد إلا التوافقيات الفردية.

        (ج) من أجل منبع يقترب من مستمع ساكن، يقصر طول الموجة أمام المنبع:
        \[ f' = f\,\frac{c}{c - v_s} = 100\times\frac{340}{320} \approx 106\ \text{Hz}. \]

quizzes:
  - title: { en: Free oscillations and Lagrange's equations, ar: الاهتزازات الحرة ومعادلات لاغرانج }
    questions:
      - q:
          en: What is the period of a mass \(m\) on a spring of stiffness \(k\)?
          ar: ما دور كتلة \(m\) مثبتة بنابض ثابت مرونته \(k\)؟
        options:
          - '\(2\pi\sqrt{k/m}\)'
          - '\(2\pi\sqrt{m/k}\)'
          - '\(\sqrt{k/m}\)'
          - '\(\frac{1}{2\pi}\sqrt{m/k}\)'
        answer: 1
        explain:
          en: '\(\omega_0 = \sqrt{k/m}\) and \(T_0 = 2\pi/\omega_0 = 2\pi\sqrt{m/k}\): a heavier mass oscillates more slowly, a stiffer spring faster.'
          ar: '\(\omega_0 = \sqrt{k/m}\) و\(T_0 = 2\pi/\omega_0 = 2\pi\sqrt{m/k}\): الكتلة الأثقل تهتز أبطأ، والنابض الأصلب يجعلها أسرع.'
      - q:
          en: 'A mass–spring oscillator has amplitude \(A\). Its total mechanical energy is:'
          ar: 'هزاز كتلة–نابض سعته \(A\). طاقته الميكانيكية الكلية هي:'
        options:
          - '\(\tfrac12 kA^2\)'
          - '\(\tfrac12 mA^2\)'
          - '\(kA^2\)'
          - '\(\tfrac12 kA\)'
        answer: 0
        explain:
          en: At maximum displacement the velocity is zero, so all the energy is elastic potential energy \(\tfrac12 kA^2\); it is constant in time.
          ar: عند أقصى انتقال تنعدم السرعة، فتكون الطاقة كلها طاقة كامنة مرونية \(\tfrac12 kA^2\)، وهي ثابتة مع الزمن.
      - q:
          en: 'Two springs \(k_1\) and \(k_2\) are connected in series. The equivalent stiffness is:'
          ar: 'نابضان \(k_1\) و\(k_2\) موصولان على التسلسل. ثابت المرونة المكافئ هو:'
        options:
          - '\(k_1+k_2\)'
          - '\(\sqrt{k_1k_2}\)'
          - '\(\dfrac{k_1k_2}{k_1+k_2}\)'
          - '\(\dfrac{k_1+k_2}{2}\)'
        answer: 2
        explain:
          en: In series both springs carry the same force and their extensions add, so \(1/k = 1/k_1 + 1/k_2\). The series combination is softer than either spring.
          ar: في التسلسل يخضع النابضان للقوة نفسها وتُجمع استطالتاهما، لذا \(1/k = 1/k_1 + 1/k_2\). فالتركيب على التسلسل أقل صلابة من كل نابض على حدة.
      - q:
          en: 'For \(L = \tfrac12 ml^2\dot\theta^2 - mgl(1-\cos\theta)\), Lagrange''s equation gives:'
          ar: 'من أجل \(L = \tfrac12 ml^2\dot\theta^2 - mgl(1-\cos\theta)\)، تعطي معادلة لاغرانج:'
        options:
          - '\(ml^2\ddot\theta - mgl\sin\theta = 0\)'
          - '\(ml\ddot\theta + mg\cos\theta = 0\)'
          - '\(ml^2\ddot\theta + mgl\dot\theta = 0\)'
          - '\(ml^2\ddot\theta + mgl\sin\theta = 0\)'
        answer: 3
        explain:
          en: '\(\partial L/\partial\dot\theta = ml^2\dot\theta\), whose time derivative is \(ml^2\ddot\theta\); \(\partial L/\partial\theta = -mgl\sin\theta\). Subtracting gives \(ml^2\ddot\theta + mgl\sin\theta = 0\), the pendulum equation.'
          ar: '\(\partial L/\partial\dot\theta = ml^2\dot\theta\) ومشتقها الزمني \(ml^2\ddot\theta\)؛ و\(\partial L/\partial\theta = -mgl\sin\theta\). بالطرح نحصل على \(ml^2\ddot\theta + mgl\sin\theta = 0\)، وهي معادلة النواس.'
      - q:
          en: 'A system has \(T = \tfrac12 a\dot q^2\) (\(a>0\) constant) and potential \(U(q)\) with a minimum at \(q_0\). The angular frequency of small oscillations is:'
          ar: 'جملة طاقتها الحركية \(T = \tfrac12 a\dot q^2\) (\(a>0\) ثابت) وطاقتها الكامنة \(U(q)\) لها قيمة صغرى عند \(q_0\). النبض الذاتي للاهتزازات الصغيرة هو:'
        options:
          - '\(\sqrt{U''''(q_0)/a}\)'
          - '\(\sqrt{U''(q_0)/a}\)'
          - '\(\sqrt{a/U''''(q_0)}\)'
          - '\(\sqrt{U(q_0)/a}\)'
        answer: 0
        explain:
          en: 'Near the minimum \(U \approx U(q_0) + \tfrac12 U''''(q_0)(q-q_0)^2\) (the first derivative vanishes at equilibrium), so the effective stiffness is \(U''''(q_0)\) and the effective mass is \(a\).'
          ar: 'قرب القيمة الصغرى \(U \approx U(q_0) + \tfrac12 U''''(q_0)(q-q_0)^2\) (المشتق الأول منعدم عند التوازن)، فالصلابة الفعلية هي \(U''''(q_0)\) والكتلة الفعلية هي \(a\).'
  - title: { en: Damped and forced oscillations, ar: الاهتزازات المتخامدة والقسرية }
    questions:
      - q:
          en: 'The oscillator \(\ddot x + 2\lambda\dot x + \omega_0^2x = 0\) oscillates (pseudo-periodic regime) when:'
          ar: 'يهتز الهزاز \(\ddot x + 2\lambda\dot x + \omega_0^2x = 0\) (نظام شبه دوري) عندما:'
        options:
          - '\(\lambda > \omega_0\)'
          - '\(\lambda = \omega_0\)'
          - '\(\lambda < \omega_0\)'
          - en: '\(\lambda = 0\) only'
            ar: '\(\lambda = 0\) فقط'
        answer: 2
        explain:
          en: 'The characteristic roots are \(-\lambda \pm\sqrt{\lambda^2-\omega_0^2}\). They are complex — giving oscillations at \(\omega_d = \sqrt{\omega_0^2-\lambda^2}\) — only if \(\lambda<\omega_0\). \(\lambda = \omega_0\) is critical damping.'
          ar: 'جذرا المعادلة المميزة هما \(-\lambda \pm\sqrt{\lambda^2-\omega_0^2}\). ولا يكونان مركبين — فتظهر اهتزازات بنبض \(\omega_d = \sqrt{\omega_0^2-\lambda^2}\) — إلا إذا كان \(\lambda<\omega_0\). أما \(\lambda = \omega_0\) فهو التخامد الحرج.'
      - q:
          en: The logarithmic decrement \(\delta = \ln[x(t)/x(t+T_d)]\) equals
          ar: التناقص اللوغاريتمي \(\delta = \ln[x(t)/x(t+T_d)]\) يساوي
        options:
          - '\(\lambda/T_d\)'
          - '\(\lambda T_d\)'
          - '\(\omega_0T_d\)'
          - '\(2\pi\lambda\)'
        answer: 1
        explain:
          en: Successive maxima are separated by one pseudo-period and the envelope is \(e^{-\lambda t}\), so their ratio is \(e^{\lambda T_d}\) and \(\delta = \lambda T_d\).
          ar: تفصل بين قيمتين عظميين متتاليتين مدة شبه دور واحد، والغلاف هو \(e^{-\lambda t}\)، فنسبتهما \(e^{\lambda T_d}\) ومنه \(\delta = \lambda T_d\).
      - q:
          en: For a weakly damped driven oscillator, the quality factor is related to the half-power bandwidth \(\Delta\omega\) by
          ar: في هزاز قسري ضعيف التخامد، يرتبط معامل الجودة بعرض المجال عند نصف الاستطاعة \(\Delta\omega\) بالعلاقة
        options:
          - '\(Q = \Delta\omega/\omega_0\)'
          - '\(Q = \omega_0\Delta\omega\)'
          - '\(Q = 1/(\omega_0\Delta\omega)\)'
          - '\(Q = \omega_0/\Delta\omega\)'
        answer: 3
        explain:
          en: 'The power curve has width \(\Delta\omega = 2\lambda\) and \(Q = \omega_0/2\lambda\), hence \(Q = \omega_0/\Delta\omega\): a sharp resonance means a high Q.'
          ar: 'عرض منحنى الاستطاعة هو \(\Delta\omega = 2\lambda\) و\(Q = \omega_0/2\lambda\)، ومنه \(Q = \omega_0/\Delta\omega\): التجاوب الحاد يعني معامل جودة كبيرًا.'
      - q:
          en: When the driving frequency equals \(\omega_0\), the steady-state displacement relative to the driving force is
          ar: عندما يساوي تواتر الإثارة \(\omega_0\)، يكون الانتقال في النظام الدائم بالنسبة إلى قوة الإثارة
        options:
          - en: 'in phase'
            ar: 'على توافق في الطور'
          - en: 'lagging by π/2'
            ar: 'متأخرًا بـ π/2'
          - en: 'lagging by π'
            ar: 'متأخرًا بـ π'
          - en: 'leading by π/2'
            ar: 'متقدمًا بـ π/2'
        answer: 1
        explain:
          en: '\(\tan\varphi = 2\lambda\Omega/(\omega_0^2-\Omega^2)\) diverges at \(\Omega=\omega_0\), so \(\varphi = \pi/2\): the displacement lags by a quarter period while the velocity is in phase with the force — power transfer is maximal.'
          ar: '\(\tan\varphi = 2\lambda\Omega/(\omega_0^2-\Omega^2)\) تؤول إلى اللانهاية عند \(\Omega=\omega_0\)، فيكون \(\varphi = \pi/2\): يتأخر الانتقال بربع دور بينما تكون السرعة على توافق مع القوة — فيكون نقل الاستطاعة أعظميًا.'
      - q:
          en: 'In the force–voltage analogy between a mass–spring–damper and a series RLC circuit, the mass \(m\) corresponds to:'
          ar: 'في التماثل قوة–توتر بين جملة كتلة–نابض–مخمِّد ودارة RLC على التسلسل، تقابل الكتلة \(m\):'
        options:
          - en: 'the inductance L'
            ar: 'الذاتية L'
          - en: 'the capacitance C'
            ar: 'السعة C'
          - en: 'the resistance R'
            ar: 'المقاومة R'
          - en: 'the inverse capacitance 1/C'
            ar: 'مقلوب السعة 1/C'
        answer: 0
        explain:
          en: 'Compare \(m\ddot x + \alpha\dot x + kx = F\) with \(L\ddot q + R\dot q + q/C = u\): \(m\leftrightarrow L\) (inertia), \(\alpha\leftrightarrow R\), \(k\leftrightarrow 1/C\), \(x\leftrightarrow q\).'
          ar: 'بمقارنة \(m\ddot x + \alpha\dot x + kx = F\) مع \(L\ddot q + R\dot q + q/C = u\): \(m\leftrightarrow L\) (العطالة)، \(\alpha\leftrightarrow R\)، \(k\leftrightarrow 1/C\)، \(x\leftrightarrow q\).'
  - title: { en: Coupled oscillations, ar: الاهتزازات المتقارنة }
    questions:
      - q:
          en: How many normal modes does a linear system with \(N\) degrees of freedom have?
          ar: كم عدد الأنماط الذاتية لجملة خطية ذات \(N\) درجة حرية؟
        options:
          - 'N'
          - '2N'
          - 'N − 1'
          - '1'
        answer: 0
        explain:
          en: The secular determinant is a polynomial of degree \(N\) in \(\omega^2\), giving \(N\) normal frequencies and \(N\) independent mode shapes.
          ar: المحدد المميز كثير حدود من الدرجة \(N\) في \(\omega^2\)، فيعطي \(N\) نبضًا ذاتيًا و\(N\) شكل نمط مستقل.
      - q:
          en: Two identical simple pendulums (length \(l\)) are coupled by a light spring. In the in-phase mode the angular frequency is
          ar: نواسان بسيطان متماثلان (طول كل منهما \(l\)) متقارنان بنابض خفيف. في النمط المتوافق يكون النبض
        options:
          - '\(\sqrt{K/m}\)'
          - '\(\sqrt{g/l + 2K/m}\)'
          - '\(\sqrt{g/l}\)'
          - en: 'zero'
            ar: 'معدومًا'
        answer: 2
        explain:
          en: When both pendulums swing together the spring is never stretched, so it plays no role and each swings at its own frequency \(\sqrt{g/l}\).
          ar: عندما يتأرجح النواسان معًا لا يستطيل النابض أبدًا، فلا دور له، ويهتز كل نواس بنبضه الخاص \(\sqrt{g/l}\).
      - q:
          en: 'Two masses \(m\), each tied to a wall by a spring \(k\) and to each other by \(K\). The antiphase mode has angular frequency:'
          ar: 'كتلتان \(m\)، كل منهما مربوطة بجدار بنابض \(k\) وبينهما نابض \(K\). نبض النمط المتعاكس هو:'
        options:
          - '\(\sqrt{(k+K)/m}\)'
          - '\(\sqrt{(k+2K)/m}\)'
          - '\(\sqrt{k/m}\)'
          - '\(\sqrt{2K/m}\)'
        answer: 1
        explain:
          en: 'In antiphase the middle of the coupling spring stays fixed, so each mass feels \(k\) plus half of the spring \(K\), whose stiffness is \(2K\): \(\omega^2 = (k+2K)/m\).'
          ar: 'في النمط المتعاكس يبقى منتصف نابض التقارن ثابتًا، فتخضع كل كتلة للنابض \(k\) ولنصف النابض \(K\) الذي صلابته \(2K\): \(\omega^2 = (k+2K)/m\).'
      - q:
          en: With weak coupling, one pendulum is released while the other is at rest. The time for the energy to pass completely to the second pendulum is
          ar: في تقارن ضعيف، نحرّر أحد النواسين بينما الآخر ساكن. المدة اللازمة لانتقال الطاقة كليًا إلى النواس الثاني هي
        options:
          - '\(2\pi/(\omega_1+\omega_2)\)'
          - '\(\pi/(\omega_1+\omega_2)\)'
          - '\(2\pi/\omega_1\)'
          - '\(\pi/(\omega_2-\omega_1)\)'
        answer: 3
        explain:
          en: 'The amplitude of pendulum 1 is \(A\cos[(\omega_2-\omega_1)t/2]\); it first vanishes when \((\omega_2-\omega_1)t/2 = \pi/2\).'
          ar: 'سعة النواس 1 هي \(A\cos[(\omega_2-\omega_1)t/2]\)، وتنعدم لأول مرة عندما \((\omega_2-\omega_1)t/2 = \pi/2\).'
      - q:
          en: Written in normal coordinates, the equations of motion of an undamped coupled system are
          ar: عند كتابتها بالإحداثيات الطبيعية، تكون معادلات حركة جملة متقارنة غير متخامدة
        options:
          - en: 'independent harmonic-oscillator equations'
            ar: 'معادلات هزازات توافقية مستقلة'
          - en: 'still coupled but with equal frequencies'
            ar: 'لا تزال متقارنة لكن بنبضات متساوية'
          - en: 'first-order equations'
            ar: 'معادلات من الرتبة الأولى'
          - en: 'nonlinear equations'
            ar: 'معادلات غير خطية'
        answer: 0
        explain:
          en: Normal coordinates diagonalise both the kinetic and potential energies simultaneously, so each obeys \(\ddot q_i + \omega_i^2q_i = 0\) independently of the others.
          ar: تجعل الإحداثيات الطبيعية الطاقتين الحركية والكامنة قطريتين في آن واحد، فتحقق كل منها \(\ddot q_i + \omega_i^2q_i = 0\) باستقلال عن الأخرى.
  - title: { en: Waves, ar: الأمواج }
    questions:
      - q:
          en: The speed of transverse waves on a string with tension \(T\) and linear density \(\mu\) is
          ar: سرعة الأمواج العرضية على وتر توتره \(T\) وكثافته الخطية \(\mu\) هي
        options:
          - '\(\sqrt{\mu/T}\)'
          - '\(T/\mu\)'
          - '\(\sqrt{T/\mu}\)'
          - '\(T\mu\)'
        answer: 2
        explain:
          en: 'Newton''s law on a string element gives \(\mu\,\partial_t^2y = T\,\partial_x^2y\), a wave equation with \(v^2 = T/\mu\). Check units: N/(kg/m) = m²/s².'
          ar: 'يعطي قانون نيوتن لعنصر من الوتر \(\mu\,\partial_t^2y = T\,\partial_x^2y\)، وهي معادلة موجة حيث \(v^2 = T/\mu\). تحقق من الوحدات: N/(kg/m) = m²/s².'
      - q:
          en: The wave \(y(x,t) = A\sin(kx-\omega t)\) travels
          ar: الموجة \(y(x,t) = A\sin(kx-\omega t)\) تنتشر
        options:
          - en: 'towards +x with speed ω/k'
            ar: 'نحو +x بسرعة ω/k'
          - en: 'towards −x with speed ω/k'
            ar: 'نحو −x بسرعة ω/k'
          - en: 'towards +x with speed k/ω'
            ar: 'نحو +x بسرعة k/ω'
          - en: 'nowhere — it is a standing wave'
            ar: 'لا تنتشر — إنها موجة مستقرة'
        answer: 0
        explain:
          en: A point of constant phase satisfies \(kx-\omega t = \text{const}\), i.e. \(x = (\omega/k)t + \text{const}\), which moves towards +x at the phase velocity \(\omega/k\).
          ar: النقطة ذات الطور الثابت تحقق \(kx-\omega t = \text{const}\)، أي \(x = (\omega/k)t + \text{const}\)، فهي تتحرك نحو +x بسرعة الطور \(\omega/k\).
      - q:
          en: A pulse on a string reaches a rigidly fixed end. The reflected pulse is
          ar: نبضة على وتر تصل إلى طرف مثبت بإحكام. النبضة المنعكسة تكون
        options:
          - en: 'upright, with the same amplitude'
            ar: 'في نفس الاتجاه وبنفس السعة'
          - en: 'inverted, with the same amplitude'
            ar: 'مقلوبة وبنفس السعة'
          - en: 'absent — all energy is absorbed'
            ar: 'غائبة — تُمتص الطاقة كلها'
          - en: 'upright, with double amplitude'
            ar: 'في نفس الاتجاه وبضعف السعة'
        answer: 1
        explain:
          en: 'A fixed end has infinite impedance, so \(r = (Z_1-Z_2)/(Z_1+Z_2)\to -1\): the displacement must vanish there, which forces an inverted reflection.'
          ar: 'للطرف المثبت ممانعة لانهائية، لذا \(r = (Z_1-Z_2)/(Z_1+Z_2)\to -1\): يجب أن ينعدم الانتقال هناك، ما يفرض انعكاسًا مقلوبًا.'
      - q:
          en: The allowed wavelengths of standing waves on a string of length \(L\) fixed at both ends are
          ar: أطوال الموجة المسموح بها للأمواج المستقرة على وتر طوله \(L\) مثبت الطرفين هي
        options:
          - '\(\lambda_n = 4L/(2n-1)\)'
          - '\(\lambda_n = L/n\)'
          - '\(\lambda_n = nL\)'
          - '\(\lambda_n = 2L/n\)'
        answer: 3
        explain:
          en: Both ends must be nodes, so the string holds a whole number of half wavelengths, \(L = n\lambda/2\). The form \(4L/(2n-1)\) applies to a pipe closed at one end.
          ar: يجب أن يكون الطرفان عقدتين، فيحتوي الوتر عددًا صحيحًا من أنصاف طول الموجة، \(L = n\lambda/2\). أما الشكل \(4L/(2n-1)\) فيخص أنبوبًا مغلقًا من طرف واحد.
      - q:
          en: Deep-water gravity waves obey \(\omega = \sqrt{gk}\). Their group velocity is
          ar: تحقق الأمواج الثقالية في المياه العميقة \(\omega = \sqrt{gk}\). سرعة مجموعتها هي
        options:
          - en: 'equal to the phase velocity'
            ar: 'مساوية لسرعة الطور'
          - en: 'twice the phase velocity'
            ar: 'ضعف سرعة الطور'
          - en: 'half the phase velocity'
            ar: 'نصف سرعة الطور'
          - en: 'zero'
            ar: 'معدومة'
        answer: 2
        explain:
          en: '\(v_g = \dv{\omega}{k} = \tfrac12\sqrt{g/k} = \tfrac12\,\omega/k = v_\varphi/2\). The medium is dispersive, so energy travels more slowly than the crests.'
          ar: '\(v_g = \dv{\omega}{k} = \tfrac12\sqrt{g/k} = \tfrac12\,\omega/k = v_\varphi/2\). الوسط مبدِّد، فتنتقل الطاقة أبطأ من القمم.'


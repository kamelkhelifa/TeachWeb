description:
  en: |
    <p>Oscillations and waves are everywhere in physics: a pendulum, an RLC circuit, the atoms of a crystal, a guitar string, the air in an organ pipe. This course builds a single mathematical language for all of them. Starting from the Lagrangian description of a system with one degree of freedom, it treats free, damped and driven oscillations, resonance and the quality factor, and the deep analogy between mechanical and electrical oscillators.</p>
    <p>The second part moves from one oscillator to many: coupled systems with two or more degrees of freedom, normal modes and beats, and then the limit of a continuous medium, where the wave equation appears. Travelling and standing waves on strings, acoustic waves in fluids, characteristic impedance, energy transport, reflection and transmission at a boundary, dispersion and the Doppler effect complete the picture.</p>
    <p>Weekly tutorials train problem solving, and laboratory sessions (vibrating strings, RLC resonance, coupled oscillators, Kundt tube, the loudspeaker) connect the theory to measurement. The course prepares directly for electromagnetism, optics and quantum mechanics, where the same equations return.</p>
  ar: |
    <p>الاهتزازات والأمواج حاضرة في كل فروع الفيزياء: النواس، ودارة RLC، وذرات البلّورة، ووتر القيثارة، والهواء داخل أنبوب الأرغن. يبني هذا المقرر لغة رياضية واحدة لوصفها جميعًا. فانطلاقًا من وصف لاغرانج لجملة ذات درجة حرية واحدة، يدرس الاهتزازات الحرة والمتخامدة والقسرية، وظاهرة التجاوب (الرنين) ومعامل الجودة، والتماثل العميق بين الهزازات الميكانيكية والكهربائية.</p>
    <p>وينتقل الجزء الثاني من هزاز واحد إلى عدة هزازات: الجمل المتقارنة ذات درجتين أو أكثر من درجات الحرية، والأنماط الذاتية والضربات، ثم إلى نهاية الوسط المستمر حيث تظهر معادلة الموجة. وتكتمل الصورة بدراسة الأمواج المتنقلة والمستقرة على الأوتار، والأمواج الصوتية في الموائع، والممانعة المميزة، ونقل الطاقة، والانعكاس والنفاذ عند الحدود، والتبدد، وظاهرة دوبلر.</p>
    <p>تُدرّب الأعمال الموجهة الأسبوعية على حل المسائل، وتربط الأعمال التطبيقية (الأوتار المهتزة، تجاوب دارة RLC، الهزازات المتقارنة، أنبوب كونت، مكبر الصوت) النظريةَ بالقياس. ويُعدّ المقرر تمهيدًا مباشرًا للكهرومغناطيسية والبصريات وميكانيكا الكم، حيث تعود المعادلات نفسها.</p>


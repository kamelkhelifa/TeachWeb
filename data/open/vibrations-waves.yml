glossary:
  - { en: Degree of freedom, ar: درجة الحرية, fr: Degré de liberté, def: { en: An independent coordinate needed to specify the configuration of a system., ar: إحداثية مستقلة لازمة لتحديد هيئة الجملة. } }
  - { en: Generalised coordinate, ar: الإحداثية المعممة, fr: Coordonnée généralisée, def: { en: Any set of independent variables (lengths or angles) that fixes the configuration., ar: أي مجموعة من المتغيرات المستقلة (أطوال أو زوايا) تحدد هيئة الجملة. } }
  - { en: Lagrangian, ar: دالة لاغرانج (اللاغرانجي), fr: Lagrangien, def: { en: 'The function \(L = T - U\) from which the equations of motion follow.', ar: 'الدالة \(L = T - U\) التي تُستنتج منها معادلات الحركة.' } }
  - { en: Simple harmonic motion, ar: الحركة التوافقية البسيطة, fr: Mouvement harmonique simple, def: { en: 'Motion obeying \(\ddot x + \omega_0^2x = 0\), i.e. sinusoidal in time.', ar: 'حركة تحقق \(\ddot x + \omega_0^2x = 0\)، أي جيبية بالنسبة إلى الزمن.' } }
  - { en: Natural angular frequency, ar: النبض الذاتي, fr: Pulsation propre, def: { en: The angular frequency at which an undamped system oscillates freely., ar: النبض الذي تهتز به الجملة حرةً في غياب التخامد. } }
  - { en: Amplitude, ar: السعة, fr: Amplitude, def: { en: The maximum displacement from equilibrium., ar: أقصى انتقال عن وضع التوازن. } }
  - { en: Phase, ar: الطور, fr: Phase, def: { en: 'The argument \(\omega t+\varphi\) of the sinusoid; it fixes the state within a cycle.', ar: 'وسيط الدالة الجيبية \(\omega t+\varphi\)؛ يحدد حالة الجملة خلال الدورة.' } }
  - { en: Damping, ar: التخامد, fr: Amortissement, def: { en: 'Loss of mechanical energy by friction, which makes free oscillations decay.', ar: ضياع الطاقة الميكانيكية بالاحتكاك ما يجعل الاهتزازات الحرة تتناقص. } }
  - { en: Critical damping, ar: التخامد الحرج, fr: Amortissement critique, def: { en: 'The case \(\lambda = \omega_0\): fastest return to equilibrium without oscillation.', ar: 'الحالة \(\lambda = \omega_0\): أسرع عودة إلى التوازن دون اهتزاز.' } }
  - { en: Logarithmic decrement, ar: التناقص اللوغاريتمي, fr: Décrément logarithmique, def: { en: 'Natural log of the ratio of two successive maxima, \(\delta = \lambda T_d\).', ar: 'اللوغاريتم الطبيعي لنسبة قيمتين عظميين متتاليتين، \(\delta = \lambda T_d\).' } }
  - { en: Quality factor, ar: معامل الجودة, fr: Facteur de qualité, def: { en: '\(Q = \omega_0/2\lambda\); \(2\pi\) times the energy stored divided by the energy lost per cycle.', ar: '\(Q = \omega_0/2\lambda\)؛ يساوي \(2\pi\) مضروبًا في نسبة الطاقة المخزنة إلى الطاقة الضائعة في كل دورة.' } }
  - { en: Forced oscillation, ar: الاهتزاز القسري, fr: Oscillation forcée, def: { en: Oscillation maintained by an external periodic force; in steady state it follows the driving frequency., ar: اهتزاز تحافظ عليه قوة خارجية دورية؛ وفي النظام الدائم يتبع تواتر الإثارة. } }
  - { en: Transient regime, ar: النظام الانتقالي, fr: Régime transitoire, def: { en: The decaying free part of the motion of a driven oscillator., ar: الجزء الحر المتناقص من حركة هزاز قسري. } }
  - { en: Resonance, ar: التجاوب (الرنين), fr: Résonance, def: { en: Large response of a driven system when the driving frequency is close to a natural frequency., ar: استجابة كبيرة لجملة قسرية عندما يقترب تواتر الإثارة من تواتر ذاتي. } }
  - { en: Bandwidth, ar: عرض المجال (عرض النطاق), fr: Bande passante, def: { en: Width of the power-resonance curve between its half-maximum points., ar: عرض منحنى تجاوب الاستطاعة بين نقطتي نصف القيمة العظمى. } }
  - { en: Mechanical impedance, ar: الممانعة الميكانيكية, fr: Impédance mécanique, def: { en: Ratio of complex force amplitude to complex velocity amplitude., ar: نسبة السعة المركبة للقوة إلى السعة المركبة للسرعة. } }
  - { en: Coupling, ar: التقارن, fr: Couplage, def: { en: 'An interaction (spring, mass, resistor…) through which oscillators exchange energy.', ar: تفاعل (نابض، كتلة، مقاومة…) تتبادل الهزازات الطاقة عبره. } }
  - { en: Normal mode, ar: النمط الذاتي, fr: Mode propre, def: { en: A motion in which all parts oscillate at the same frequency with fixed amplitude ratios., ar: حركة تهتز فيها كل أجزاء الجملة بالتواتر نفسه وبنسب سعات ثابتة. } }
  - { en: Normal coordinates, ar: الإحداثيات الطبيعية, fr: Coordonnées normales, def: { en: Combinations of the coordinates in which the equations of motion decouple., ar: تركيبات من الإحداثيات تصبح فيها معادلات الحركة مستقلة. } }
  - { en: Beats, ar: الضربات (الخفقان), fr: Battements, def: { en: Slow periodic modulation of amplitude produced by two close frequencies., ar: تغيّر دوري بطيء للسعة ينتج عن تراكب تواترين متقاربين. } }
  - { en: Wave equation, ar: معادلة الموجة (معادلة الانتشار), fr: Équation de d'Alembert, def: { en: '\(\partial_t^2 y = v^2\nabla^2 y\); its solutions propagate at speed \(v\) without change of shape.', ar: '\(\partial_t^2 y = v^2\nabla^2 y\)؛ تنتشر حلولها بالسرعة \(v\) دون تغيير شكلها.' } }
  - { en: Travelling wave, ar: الموجة المتنقلة, fr: Onde progressive, def: { en: 'A disturbance \(f(x \mp vt)\) that carries energy along the medium.', ar: 'اضطراب من الشكل \(f(x \mp vt)\) ينقل الطاقة عبر الوسط.' } }
  - { en: Standing wave, ar: الموجة المستقرة, fr: Onde stationnaire, def: { en: Superposition of two opposite travelling waves with fixed nodes and antinodes., ar: تراكب موجتين متنقلتين متعاكستين له عقد وبطون ثابتة. } }
  - { en: Node / antinode, ar: العقدة / البطن, fr: Nœud / ventre, def: { en: Points of zero / maximum amplitude in a standing wave., ar: نقاط السعة المنعدمة / العظمى في موجة مستقرة. } }
  - { en: Characteristic impedance, ar: الممانعة المميزة, fr: Impédance caractéristique, def: { en: 'Ratio of driving force (or pressure) to velocity for a travelling wave, e.g. \(Z = \sqrt{T\mu}\) or \(Z = \rho c\).', ar: 'نسبة القوة (أو الضغط) إلى السرعة في موجة متنقلة، مثل \(Z = \sqrt{T\mu}\) أو \(Z = \rho c\).' } }
  - { en: Reflection coefficient, ar: معامل الانعكاس, fr: Coefficient de réflexion, def: { en: Ratio of reflected to incident amplitude at a boundary., ar: نسبة السعة المنعكسة إلى السعة الواردة عند الحد الفاصل. } }
  - { en: Transmission coefficient, ar: معامل النفاذ, fr: Coefficient de transmission, def: { en: Ratio of transmitted to incident amplitude at a boundary., ar: نسبة السعة النافذة إلى السعة الواردة عند الحد الفاصل. } }
  - { en: Dispersion, ar: التبدد, fr: Dispersion, def: { en: Dependence of phase velocity on frequency; wave packets then change shape as they travel., ar: تعلّق سرعة الطور بالتواتر؛ فتتغير أشكال الحزم الموجية أثناء انتشارها. } }
  - { en: Group velocity, ar: سرعة المجموعة, fr: Vitesse de groupe, def: { en: '\(v_g = \dv{\omega}{k}\): the speed of a wave packet and of the energy it carries.', ar: '\(v_g = \dv{\omega}{k}\): سرعة الحزمة الموجية والطاقة التي تحملها.' } }
  - { en: Doppler effect, ar: ظاهرة دوبلر, fr: Effet Doppler, def: { en: Change of the observed frequency due to motion of the source or the observer., ar: تغيّر التواتر المرصود بسبب حركة المنبع أو الراصد. } }


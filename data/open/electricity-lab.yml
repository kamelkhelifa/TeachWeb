notes: >
  Source: the French "Electricité" page (UEF 212), which had 5 lab sheets (TP1 introduction, TP2
  characteristics of two-terminal components, TP3 oscilloscope, TP4 RC/RL transients, TP5 electrolytic
  tank), a lab exam with marking scheme, and a record that reports 1+2 covered TP2 and TP5. Its lecture /
  tutorial material (electrostatics notes, TD, tests, exam) was placed in general-physics-2. Labs were
  fortnightly in the source; the 14-week, 3 h/week plan is reconstructed from standard calculus-based
  E&M lab courses (PHYS 194 type): Ohm's law, Kirchhoff, Wheatstone bridge, coil field (Hall probe),
  induction/transformer were added and have no hand-out yet. Assessment, CLOs, quizzes, problems and
  glossary written new. Mark lists not kept. Please check: whether the electricity lecture notes
  should also be listed here, and whether lab-sheet solutions exist.

description:
  en: |
    <p>This laboratory course accompanies the lecture course on electricity and magnetism. Each three-hour session is built around one experiment: students prepare it beforehand, assemble the circuit from a schematic, take careful measurements, and analyse them on the spot in a bound lab notebook.</p>
    <p>The first weeks establish the habits of an experimental physicist: electrical safety, correct use of multimeters and power supplies, reading the accuracy class of an instrument, estimating and propagating uncertainties, linearising data and fitting a straight line. The experiments then cover current–voltage characteristics (resistor, lamp, diode), Kirchhoff's laws, the Wheatstone bridge, mapping equipotentials in an electrolytic tank, the oscilloscope, RC and RL transients, the magnetic field of a coil and electromagnetic induction.</p>
    <p>The emphasis is not on "getting the right answer" but on <strong>comparing a measurement with a model honestly</strong>: is the discrepancy covered by the uncertainty? If not, which systematic effect could explain it? Lab sheets are in French; the pre-lab questions, worked data-analysis problems and glossary on this page are bilingual.</p>
  ar: |
    <p>يرافق هذا المقرر التجريبي مقرر المحاضرات في الكهرباء والمغناطيسية. تتمحور كل حصة (ثلاث ساعات) حول تجربة واحدة: يحضّرها الطلاب مسبقًا، ثم يركّبون الدارة انطلاقًا من مخططها، ويأخذون قياسات دقيقة، ويحللونها فورًا في دفتر مختبر مجلّد.</p>
    <p>تُرسّخ الأسابيع الأولى عادات الفيزيائي التجريبي: السلامة الكهربائية، والاستعمال الصحيح لأجهزة القياس المتعددة ومولدات التغذية، وقراءة صنف دقة الجهاز، وتقدير الارتيابات وانتشارها، وتحويل البيانات إلى علاقة خطية وملاءمة مستقيم. ثم تتناول التجارب المميزات تيار-جهد (مقاومة، مصباح، ثنائي)، وقانوني كيرشوف، وقنطرة ويتستون، ورسم خطوط تساوي الكمون في الحوض الإلكتروليتي، وراسم الاهتزاز المهبطي، والنظام الانتقالي في الدارتين RC وRL، والحقل المغناطيسي لوشيعة، والتحريض الكهرومغناطيسي.</p>
    <p>لا ينصبّ التركيز على "الحصول على الإجابة الصحيحة"، بل على <strong>مقارنة القياس بالنموذج بأمانة</strong>: هل يغطي الارتيابُ الفرقَ الملاحظ؟ وإن لم يكن كذلك، فأيّ أثر منهجي قد يفسّره؟ أوراق التجارب محررة بالفرنسية، أما أسئلة التحضير والمسائل المحلولة في تحليل البيانات والمسرد في هذه الصفحة فهي ثنائية اللغة.</p>


outcomes:
  - id: CLO1
    bloom: apply
    domain: values
    text:
      en: 'Follow electrical safety rules and good laboratory practice at every stage of an experiment.'
      ar: 'يلتزم بقواعد السلامة الكهربائية والممارسات المخبرية السليمة في كل مراحل التجربة.'
    assessed_by: [prelab, participation, practical]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: 'Assemble circuits from schematic diagrams and use multimeters, power supplies, function generators and the oscilloscope correctly.'
      ar: 'يركّب الدارات انطلاقًا من مخططاتها، ويستعمل أجهزة القياس المتعددة ومولدات التغذية ومولدات الإشارات وراسم الاهتزاز استعمالًا صحيحًا.'
    assessed_by: [notebook, practical]
  - id: CLO3
    bloom: apply
    domain: skills
    text:
      en: 'Estimate instrumental and statistical uncertainties, propagate them, and report results with appropriate significant figures.'
      ar: 'يقدّر الارتيابات الآلية والإحصائية وينشرها، ويعرض النتائج بعدد مناسب من الأرقام المعنوية.'
    assessed_by: [prelab, reports, written]
  - id: CLO4
    bloom: analyze
    domain: skills
    text:
      en: 'Linearise data and use graphical and least-squares fits to extract physical parameters (resistance, time constant, \(\mu_0\)…) with their uncertainties.'
      ar: 'يحوّل البيانات إلى علاقات خطية ويستعمل الملاءمة البيانية وطريقة المربعات الصغرى لاستخراج المقادير الفيزيائية (المقاومة، ثابت الزمن، \(\mu_0\)…) مع ارتياباتها.'
    assessed_by: [reports, written]
  - id: CLO5
    bloom: evaluate
    domain: skills
    text:
      en: 'Compare measurements with theoretical models (Ohm, Kirchhoff, RC/RL transients, Biot–Savart, Faraday), judge agreement within uncertainty and identify systematic errors.'
      ar: 'يقارن القياسات بالنماذج النظرية (أوم، كيرشوف، النظام الانتقالي RC/RL، بيو-سافار، فاراداي)، ويحكم على التوافق في حدود الارتياب، ويحدد الأخطاء المنهجية.'
    assessed_by: [reports, practical, written]
  - id: CLO6
    bloom: analyze
    domain: knowledge
    text:
      en: 'Explain the physical principle behind each experiment and predict the expected behaviour before measuring.'
      ar: 'يشرح المبدأ الفيزيائي لكل تجربة ويتوقع السلوك المنتظر قبل إجراء القياس.'
    assessed_by: [prelab, written]
  - id: CLO7
    bloom: create
    domain: values
    text:
      en: 'Keep a complete and honest lab notebook and write clear, structured laboratory reports as part of a team.'
      ar: 'يحتفظ بدفتر مختبر كامل وأمين، ويكتب ضمن فريق تقارير مخبرية واضحة ومنظمة.'
    assessed_by: [notebook, reports, participation]

assessment:
  - id: prelab
    type: quiz
    weight: 10
    title: { en: 'Pre-lab quizzes', ar: 'اختبارات التحضير القبلي' }
    detail:
      en: 'A 10-minute quiz at the start of each session on the principle, expected results and safety points of the day''s experiment. The safety quiz of week 1 must be passed before working with mains-powered equipment.'
      ar: 'اختبار مدته 10 دقائق في بداية كل حصة حول مبدأ تجربة اليوم ونتائجها المتوقعة ونقاط السلامة فيها. يجب اجتياز اختبار السلامة في الأسبوع الأول قبل العمل بأجهزة موصولة بالشبكة الكهربائية.'
    when: { en: 'Weeks 2–13', ar: 'الأسابيع 2–13' }
  - id: notebook
    type: portfolio
    weight: 10
    title: { en: 'Lab notebook', ar: 'دفتر المختبر' }
    detail:
      en: 'Bound notebook written in ink during the session: circuit diagrams, raw data tables with units and uncertainties, quick graphs, observations. Checked and signed at the end of each session.'
      ar: 'دفتر مجلّد يُكتب بالحبر أثناء الحصة: مخططات الدارات، وجداول البيانات الخام مع الوحدات والارتيابات، ومنحنيات سريعة، وملاحظات. يُراجَع ويُوقَّع في نهاية كل حصة.'
    when: { en: 'Every session', ar: 'كل حصة' }
  - id: reports
    type: report
    weight: 30
    title: { en: 'Lab reports', ar: 'تقارير المختبر' }
    detail:
      en: 'Four formal reports (aim, principle, method, results with uncertainties, graphs with fitted lines, discussion, conclusion), handed in one week after the experiment. Graded with a published rubric.'
      ar: 'أربعة تقارير رسمية (الهدف، المبدأ، الطريقة، النتائج مع الارتيابات، المنحنيات مع المستقيمات الملائمة، المناقشة، الخلاصة)، تُسلَّم بعد أسبوع من التجربة، وتُقيَّم وفق سلّم تنقيط معلن.'
    when: { en: 'Weeks 5, 8, 11, 13', ar: 'الأسابيع 5 و8 و11 و13' }
  - id: participation
    type: participation
    weight: 5
    title: { en: 'Conduct and teamwork', ar: 'السلوك والعمل الجماعي' }
    detail:
      en: 'Punctuality, safe handling of equipment, tidy bench, effective sharing of tasks within the team.'
      ar: 'الانضباط في المواعيد، والتعامل الآمن مع الأجهزة، ونظافة طاولة العمل، والتوزيع الفعّال للمهام داخل الفريق.'
    when: { en: 'Throughout', ar: 'طوال الفصل' }
  - id: practical
    type: lab
    weight: 25
    title: { en: 'Practical exam', ar: 'الامتحان التطبيقي' }
    detail:
      en: 'Individual 90-minute exam: assemble a circuit, take a series of measurements, produce a graph and a result with its uncertainty, followed by a short oral question on the method.'
      ar: 'امتحان فردي مدته 90 دقيقة: تركيب دارة، وإجراء سلسلة قياسات، ورسم منحنى، واستخراج نتيجة مع ارتيابها، يليه سؤال شفهي قصير حول الطريقة المتبعة.'
    when: { en: 'Week 14', ar: 'الأسبوع 14' }
  - id: written
    type: final
    weight: 20
    title: { en: 'Final written test', ar: 'الاختبار الكتابي النهائي' }
    detail:
      en: '60-minute written test: principles of the experiments, instrument use, uncertainty calculations and the analysis of a given data set.'
      ar: 'اختبار كتابي مدته 60 دقيقة: مبادئ التجارب، واستعمال الأجهزة، وحساب الارتيابات، وتحليل مجموعة بيانات معطاة.'
    when: { en: 'Week 14', ar: 'الأسبوع 14' }

schedule:
  - week: 1
    title: { en: 'Safety, instruments and measurement', ar: 'السلامة والأجهزة والقياس' }
    topics:
      en:
        - 'Electrical safety rules; organisation of the lab'
        - 'DC power supply, breadboard, digital and analogue multimeters'
        - 'Resolution, accuracy class and reading uncertainty'
      ar:
        - 'قواعد السلامة الكهربائية؛ تنظيم المختبر'
        - 'مولد التغذية المستمرة، لوحة التجارب، أجهزة القياس المتعددة الرقمية والتماثلية'
        - 'دقة التمييز وصنف الدقة وارتياب القراءة'
    reading: Taylor ch. 1–2
    activity: { en: 'TP 1 — Introduction (part 1); safety quiz', ar: 'العمل التطبيقي 1 — مقدمة (الجزء 1)؛ اختبار السلامة' }
  - week: 2
    title: { en: 'Uncertainties and graphs', ar: 'الارتيابات والتمثيل البياني' }
    topics:
      en:
        - 'Propagation of uncertainties: maximum error and quadrature'
        - 'Significant figures and presentation of results'
        - 'Linearisation and graphical slope; least-squares fit'
      ar:
        - 'انتشار الارتيابات: الخطأ الأعظمي والجمع التربيعي'
        - 'الأرقام المعنوية وطريقة عرض النتائج'
        - 'التحويل إلى علاقة خطية والميل البياني؛ ملاءمة المربعات الصغرى'
    reading: Taylor ch. 3, 8
    activity: { en: 'TP 1 — Introduction (part 2): data-analysis exercises', ar: 'العمل التطبيقي 1 — مقدمة (الجزء 2): تمارين في تحليل البيانات' }
  - week: 3
    title: { en: 'Ohm''s law and resistivity', ar: 'قانون أوم والمقاومية' }
    topics:
      en:
        - 'Voltmeter and ammeter connections and their systematic errors'
        - 'I–V line of a resistor; resistance from the slope'
        - 'Resistivity of a wire from \(R\) versus length'
      ar:
        - 'طريقتا ربط مقياس الجهد ومقياس التيار وأخطاؤهما المنهجية'
        - 'المميزة تيار-جهد لمقاومة؛ المقاومة من الميل'
        - 'مقاومية سلك من تغيّر \(R\) بدلالة الطول'
    reading: Halliday §26.3–26.5
    milestone: lab
  - week: 4
    title: { en: 'Characteristics of two-terminal components', ar: 'مميزات ثنائيات الأقطاب' }
    topics:
      en:
        - 'Linear and non-linear components: resistor, filament lamp'
        - 'Semiconductor diode in forward and reverse bias; threshold voltage'
        - 'Static and dynamic resistance'
      ar:
        - 'العناصر الخطية وغير الخطية: المقاومة، مصباح التوهج'
        - 'الثنائي نصف الناقل في الاستقطاب المباشر والعكسي؛ جهد العتبة'
        - 'المقاومة الساكنة والمقاومة الديناميكية'
    activity: { en: 'TP 2 — Characteristics of two-terminal components', ar: 'العمل التطبيقي 2 — مميزات ثنائيات الأقطاب' }
    milestone: lab
  - week: 5
    title: { en: 'Kirchhoff''s laws and real sources', ar: 'قانونا كيرشوف والمولدات الحقيقية' }
    topics:
      en:
        - 'Series and parallel combinations of resistors'
        - 'Verification of the junction and loop rules'
        - 'emf and internal resistance of a battery from its V–I line'
      ar:
        - 'ربط المقاومات على التسلسل وعلى التفرع'
        - 'التحقق من قانوني العقد والحلقات'
        - 'القوة المحركة الكهربائية والمقاومة الداخلية لبطارية من مميزتها'
    reading: Halliday §27.1–27.3
    activity: { en: 'Report 1 due (characteristics)', ar: 'تسليم التقرير 1 (المميزات)' }
    milestone: lab
  - week: 6
    title: { en: 'The Wheatstone bridge', ar: 'قنطرة ويتستون' }
    topics:
      en:
        - 'Balance condition of the bridge'
        - 'Slide-wire bridge; sensitivity and best balance point'
        - 'Comparison with a direct ohmmeter reading'
      ar:
        - 'شرط توازن القنطرة'
        - 'قنطرة السلك المنزلق؛ الحساسية وأفضل نقطة توازن'
        - 'المقارنة مع القراءة المباشرة لمقياس المقاومة'
    milestone: lab
  - week: 7
    title: { en: 'Equipotentials in an electrolytic tank', ar: 'خطوط تساوي الكمون في الحوض الإلكتروليتي' }
    topics:
      en:
        - 'Mapping equipotential lines for several electrode shapes'
        - 'Drawing field lines perpendicular to equipotentials'
        - 'Estimating \(E \approx -\Delta V/\Delta s\)'
      ar:
        - 'رسم خطوط تساوي الكمون لعدة أشكال من الأقطاب'
        - 'رسم خطوط الحقل عموديًا على خطوط تساوي الكمون'
        - 'تقدير \(E \approx -\Delta V/\Delta s\)'
    reading: Halliday §24.2
    activity: { en: 'TP 5 — The electrolytic (rheographic) tank', ar: 'العمل التطبيقي 5 — الحوض الإلكتروليتي (الريوغرافي)' }
    milestone: lab
  - week: 8
    title: { en: 'Report workshop and mid-course review', ar: 'ورشة التقارير ومراجعة منتصف المقرر' }
    topics:
      en:
        - 'Feedback on report 1; what makes a good figure and a good discussion'
        - 'Make-up session for missed experiments'
      ar:
        - 'ملاحظات على التقرير 1؛ مواصفات المنحنى الجيد والمناقشة الجيدة'
        - 'حصة استدراك للتجارب الفائتة'
    activity: { en: 'Report 2 due (bridge and equipotentials)', ar: 'تسليم التقرير 2 (القنطرة وخطوط تساوي الكمون)' }
    milestone: review
  - week: 9
    title: { en: 'The oscilloscope', ar: 'راسم الاهتزاز المهبطي' }
    topics:
      en:
        - 'Vertical sensitivity, time base, triggering'
        - 'Measuring amplitude, period, frequency and rms value'
        - 'XY mode: Lissajous figures and phase shift'
      ar:
        - 'الحساسية الشاقولية والقاعدة الزمنية والتزامن'
        - 'قياس السعة والدور والتواتر والقيمة الفعالة'
        - 'النمط XY: منحنيات ليساجو وفرق الطور'
    activity: { en: 'TP 3 — The oscilloscope', ar: 'العمل التطبيقي 3 — راسم الاهتزاز المهبطي' }
    milestone: lab
  - week: 10
    title: { en: 'RC circuit transients', ar: 'النظام الانتقالي في الدارة RC' }
    topics:
      en:
        - 'Charging and discharging with a square-wave generator'
        - 'Time constant from the 63 % point, the half-life and a semi-log plot'
        - 'Effect of the generator''s output resistance'
      ar:
        - 'الشحن والتفريغ بواسطة مولد إشارة مربعة'
        - 'ثابت الزمن من نقطة 63 % ومن زمن نصف القيمة ومن منحنى نصف لوغاريتمي'
        - 'أثر المقاومة الداخلية للمولد'
    reading: Halliday §27.4
    activity: { en: 'TP 4 — Transients (RC part); compare with the RC-circuit simulation', ar: 'العمل التطبيقي 4 — النظام الانتقالي (جزء RC)؛ قارن مع محاكاة الدارة RC' }
    milestone: lab
  - week: 11
    title: { en: 'RL circuit transients', ar: 'النظام الانتقالي في الدارة RL' }
    topics:
      en:
        - 'Growth and decay of current in an RL circuit'
        - 'Time constant \(L/R\) and the resistance of the coil'
        - 'Determining an inductance'
      ar:
        - 'نمو التيار وتناقصه في الدارة RL'
        - 'ثابت الزمن \(L/R\) ومقاومة الوشيعة'
        - 'تعيين ذاتية وشيعة'
    reading: Halliday §30.7
    activity: { en: 'TP 4 — Transients (RL part); report 3 due (oscilloscope and RC)', ar: 'العمل التطبيقي 4 — النظام الانتقالي (جزء RL)؛ تسليم التقرير 3 (راسم الاهتزاز وRC)' }
    milestone: lab
  - week: 12
    title: { en: 'Magnetic field of a coil', ar: 'الحقل المغناطيسي لوشيعة' }
    topics:
      en:
        - 'Hall-probe teslameter; zeroing and orientation'
        - 'Field at the centre versus current; \(B = \mu_0 NI/2R\)'
        - 'Field along the axis; Helmholtz configuration'
      ar:
        - 'مقياس التسلا بمسبار هول؛ ضبط الصفر والتوجيه'
        - 'الحقل في المركز بدلالة التيار؛ \(B = \mu_0 NI/2R\)'
        - 'الحقل على طول المحور؛ تشكيلة هلمهولتز'
    reading: Halliday §29.1–29.2, 29.5
    milestone: lab
  - week: 13
    title: { en: 'Electromagnetic induction', ar: 'التحريض الكهرومغناطيسي' }
    topics:
      en:
        - 'Induced emf from a moving magnet; Lenz''s law'
        - 'Mutual induction between two coils versus frequency'
        - 'Voltage ratio of a transformer'
      ar:
        - 'القوة المحركة المتحرَّضة بمغناطيس متحرك؛ قانون لنز'
        - 'التحريض المتبادل بين وشيعتين بدلالة التواتر'
        - 'نسبة التحويل في المحوّل'
    reading: Halliday §30.1–30.2, 30.10
    activity: { en: 'Report 4 due (coil field)', ar: 'تسليم التقرير 4 (حقل الوشيعة)' }
    milestone: lab
  - week: 14
    title: { en: 'Practical exam and written test', ar: 'الامتحان التطبيقي والاختبار الكتابي' }
    topics:

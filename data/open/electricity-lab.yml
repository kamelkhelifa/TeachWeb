glossary:
  - { en: 'Measurement uncertainty', ar: 'ارتياب القياس', fr: 'Incertitude de mesure', def: { en: 'Range within which the true value is expected to lie, written \(x \pm \Delta x\).', ar: 'المجال الذي يُتوقع أن تقع فيه القيمة الحقيقية، ويُكتب \(x \pm \Delta x\).' } }
  - { en: 'Relative uncertainty', ar: 'الارتياب النسبي', fr: 'Incertitude relative', def: { en: '\(\Delta x/|x|\), often in percent; used to compare precisions and to propagate through products.', ar: '\(\Delta x/|x|\)، ويُعبَّر عنه غالبًا بالنسبة المئوية؛ يُستعمل لمقارنة الدقة ولنشر الارتياب في الجداءات.' } }
  - { en: 'Systematic error', ar: 'الخطأ المنهجي', fr: 'Erreur systématique', def: { en: 'Error that shifts all readings the same way (offset, calibration, method); not reduced by averaging.', ar: 'خطأ يزيح كل القراءات في الاتجاه نفسه (انزياح، معايرة، طريقة)؛ ولا يقل بأخذ المتوسط.' } }
  - { en: 'Random error', ar: 'الخطأ العشوائي', fr: 'Erreur aléatoire', def: { en: 'Unpredictable scatter of repeated readings; reduced by averaging \(n\) readings as \(1/\sqrt n\).', ar: 'تشتت غير متوقع للقراءات المتكررة؛ يقل بأخذ متوسط \(n\) قراءة بنسبة \(1/\sqrt n\).' } }
  - { en: 'Accuracy class', ar: 'صنف الدقة', fr: 'Classe de précision', def: { en: 'For an analogue meter, the maximum error as a percentage of full scale.', ar: 'في الجهاز التماثلي، الخطأ الأعظمي معبَّرًا عنه بنسبة مئوية من أقصى التدريج.' } }
  - { en: 'Resolution', ar: 'دقة التمييز', fr: 'Résolution', def: { en: 'Smallest change an instrument can display (last digit or smallest division).', ar: 'أصغر تغيّر يستطيع الجهاز إظهاره (آخر رقم أو أصغر تدريجة).' } }
  - { en: 'Significant figures', ar: 'الأرقام المعنوية', fr: 'Chiffres significatifs', def: { en: 'Meaningful digits of a result, fixed by the size of its uncertainty.', ar: 'أرقام النتيجة ذات المعنى، ويحددها مقدار ارتيابها.' } }
  - { en: 'Propagation of uncertainty', ar: 'انتشار الارتيابات', fr: 'Propagation des incertitudes', def: { en: 'Computing the uncertainty of \(f(x, y,\dots)\) from those of \(x, y,\dots\), by quadrature (independent errors) or maximum-error sum.', ar: 'حساب ارتياب \(f(x, y,\dots)\) انطلاقًا من ارتيابات \(x, y,\dots\)، بالجمع التربيعي (أخطاء مستقلة) أو بجمع الأخطاء العظمى.' } }
  - { en: 'Least-squares fit', ar: 'الملاءمة بطريقة المربعات الصغرى', fr: 'Ajustement par moindres carrés', def: { en: 'Choosing the line that minimises the sum of squared residuals; gives slope, intercept and their uncertainties.', ar: 'اختيار المستقيم الذي يجعل مجموع مربعات البواقي أصغر ما يمكن؛ ويعطي الميل والتقاطع وارتيابيهما.' } }
  - { en: 'Multimeter', ar: 'جهاز القياس المتعدد', fr: 'Multimètre', def: { en: 'Instrument measuring voltage, current and resistance on selectable ranges.', ar: 'جهاز يقيس الجهد والتيار والمقاومة على عيارات قابلة للاختيار.' } }
  - { en: 'Ammeter', ar: 'مقياس التيار (الأمبيرمتر)', fr: 'Ampèremètre', def: { en: 'Current meter of very low resistance, connected in series.', ar: 'جهاز لقياس التيار مقاومته صغيرة جدًا، يُربط على التسلسل.' } }
  - { en: 'Voltmeter', ar: 'مقياس الجهد (الفولطمتر)', fr: 'Voltmètre', def: { en: 'Voltage meter of very high resistance, connected in parallel.', ar: 'جهاز لقياس الجهد مقاومته كبيرة جدًا، يُربط على التفرع.' } }
  - { en: 'Internal resistance', ar: 'المقاومة الداخلية', fr: 'Résistance interne', def: { en: 'Resistance \(r\) of a real source: terminal voltage \(V = \mathcal E - rI\).', ar: 'مقاومة المولد الحقيقي \(r\): الجهد بين قطبيه \(V = \mathcal E - rI\).' } }
  - { en: 'Current–voltage characteristic', ar: 'المميزة تيار-جهد', fr: 'Caractéristique courant-tension', def: { en: 'Graph \(I(V)\) of a two-terminal component; a straight line through the origin for an ohmic resistor.', ar: 'المنحنى \(I(V)\) لثنائي قطب؛ وهو مستقيم يمر بالمبدأ في حالة المقاومة الأومية.' } }
  - { en: 'Diode', ar: 'الثنائي (الديود)', fr: 'Diode', def: { en: 'Semiconductor component that conducts mainly in one direction, above a threshold voltage.', ar: 'عنصر نصف ناقل يوصل أساسًا في اتجاه واحد، فوق جهد عتبة معيّن.' } }
  - { en: 'Wheatstone bridge', ar: 'قنطرة ويتستون', fr: 'Pont de Wheatstone', def: { en: 'Four-resistor network used to measure an unknown resistance by a null method.', ar: 'شبكة من أربع مقاومات تُستعمل لقياس مقاومة مجهولة بطريقة صفرية.' } }
  - { en: 'Galvanometer', ar: 'الغلفانومتر', fr: 'Galvanomètre', def: { en: 'Very sensitive current detector, used as a null indicator.', ar: 'كاشف تيار شديد الحساسية، يُستعمل مؤشرًا صفريًا.' } }
  - { en: 'Equipotential line', ar: 'خط تساوي الكمون', fr: 'Ligne équipotentielle', def: { en: 'Line along which the potential is constant; perpendicular to the field.', ar: 'خط يكون الكمون على طوله ثابتًا، وهو عمودي على الحقل.' } }
  - { en: 'Electrolytic tank', ar: 'الحوض الإلكتروليتي', fr: 'Cuve rhéographique', def: { en: 'Shallow tank of conducting liquid used to map the potential between electrodes.', ar: 'حوض ضحل يحتوي سائلًا ناقلًا يُستعمل لرسم توزيع الكمون بين الأقطاب.' } }
  - { en: 'Oscilloscope', ar: 'راسم الاهتزاز المهبطي', fr: 'Oscilloscope', def: { en: 'Instrument displaying a voltage as a function of time (or of another voltage in XY mode).', ar: 'جهاز يعرض الجهد بدلالة الزمن (أو بدلالة جهد آخر في النمط XY).' } }
  - { en: 'Time base', ar: 'القاعدة الزمنية', fr: 'Base de temps', def: { en: 'Horizontal scale of the oscilloscope, in time per division.', ar: 'السلّم الأفقي لراسم الاهتزاز، بوحدة الزمن لكل تدريجة.' } }
  - { en: 'RMS value', ar: 'القيمة الفعالة', fr: 'Valeur efficace', def: { en: 'Root-mean-square value; for a sine wave \(V_{rms} = V_m/\sqrt2\).', ar: 'الجذر التربيعي لمتوسط المربع؛ وللإشارة الجيبية \(V_{rms} = V_m/\sqrt2\).' } }
  - { en: 'Function generator', ar: 'مولد الإشارات', fr: 'Générateur basse fréquence (GBF)', def: { en: 'Source of sine, square or triangle voltages of adjustable frequency and amplitude.', ar: 'منبع لجهود جيبية أو مربعة أو مثلثية قابلة لضبط التواتر والسعة.' } }
  - { en: 'Time constant', ar: 'ثابت الزمن', fr: 'Constante de temps', def: { en: '\(\tau = RC\) or \(L/R\); characteristic time of an exponential transient.', ar: '\(\tau = RC\) أو \(L/R\)؛ الزمن المميز لنظام انتقالي أسّي.' } }
  - { en: 'Hall probe', ar: 'مسبار هول', fr: 'Sonde à effet Hall', def: { en: 'Sensor whose transverse voltage is proportional to the magnetic field component perpendicular to it.', ar: 'حسّاس يتناسب جهده العرضي مع مركّبة الحقل المغناطيسي العمودية عليه.' } }
  - { en: 'Helmholtz coils', ar: 'وشيعتا هلمهولتز', fr: 'Bobines de Helmholtz', def: { en: 'Pair of coaxial coils separated by their radius, producing a nearly uniform field.', ar: 'وشيعتان متحدتا المحور تفصل بينهما مسافة تساوي نصف قطرهما، وتنتجان حقلًا شبه منتظم.' } }
  - { en: 'Induced emf', ar: 'القوة المحركة الكهربائية المتحرَّضة', fr: 'Force électromotrice induite', def: { en: 'emf produced by a changing magnetic flux, \(\mathcal E = -N\,\dd\Phi_B/\dd t\).', ar: 'قوة محركة كهربائية تنشأ عن تغيّر التدفق المغناطيسي \(\mathcal E = -N\,\dd\Phi_B/\dd t\).' } }
  - { en: 'Transformer', ar: 'المحوّل', fr: 'Transformateur', def: { en: 'Two coils coupled by an iron core; for AC, \(V_s/V_p \approx N_s/N_p\).', ar: 'وشيعتان مقترنتان بنواة حديدية؛ وفي التيار المتناوب \(V_s/V_p \approx N_s/N_p\).' } }


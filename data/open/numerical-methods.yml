notes: >
  Sources are thin. The EN page gives the description, the topic order (integration, nonlinear equations, Gauss and
  Gauss-Seidel, Euler and Runge-Kutta), the use of Fortran in the computer lab, the textbook list and all links (one
  summary, five assignments with solutions, three solution codes). The Arabic-taught page has the same structure and no
  extra links. Reconstructed: the programming and floating-point/error weeks (1-3), interpolation and numerical
  differentiation (week 11), the 14-week schedule, CLOs, assessment (sources give 10% problem sets + 33% midterm + 67%
  final, which is inconsistent; replaced with a varied scheme), Burden & Faires and Chapman as main references, exam
  guide, quizzes, problems and glossary. Credits (4) and hours (1.5 h lecture + 1.5 h lab) should be checked. The week
  attached to each assignment assumes Assignment n = TP n of the original calendar (A5 assumed to be on ODEs); please
  verify. Document languages of the Drive files are unknown and left unset. The two "translated books" links on the EN
  page point to quantum-mechanics books (copy-paste leftover) and were not kept. Fortran is used for the code examples
  to match the sources; Python/MATLAB are accepted alternatives.

description:
  en: |
    <p>Most equations in physics cannot be solved with pen and paper. This course teaches the essential <strong>numerical methods</strong> used in physics and chemistry, and how to implement them in clear, efficient programs. Lectures present each algorithm, why it works and how accurate it is. In the weekly <strong>computer lab</strong> students write, test and debug their own code. The lab uses Fortran; Python or MATLAB are accepted alternatives.</p>
    <p>After a refresher on programming (variables, loops, conditions, arrays, functions and subroutines) and on floating-point arithmetic and numerical errors, we study numerical integration (trapezoidal and Simpson rules), the solution of nonlinear equations (bisection, Newton–Raphson, secant), linear systems (Gauss elimination with pivoting, Gauss–Seidel iteration), interpolation and numerical differentiation, and initial-value problems for ordinary differential equations (Euler and Runge–Kutta methods).</p>
    <p>Each method is assessed on three points: <em>accuracy</em> (order of the error), <em>cost</em> (number of operations) and <em>stability</em>. Students learn to check a code against known exact results before trusting it on a real problem — for example, the motion of a nonlinear pendulum.</p>
  ar: |
    <p>معظم معادلات الفيزياء لا يمكن حلها بالورقة والقلم. يقدّم هذا المقرر أهم <strong>الطرق العددية</strong> المستعملة في الفيزياء والكيمياء، وكيفية برمجتها في برامج واضحة وفعّالة. تعرض المحاضرات كل خوارزمية وسبب نجاحها ومدى دقتها. وفي <strong>حصة الإعلام الآلي</strong> الأسبوعية يكتب الطلبة برامجهم ويختبرونها ويصحّحون أخطاءها. تُستعمل لغة فورتران، ويُقبل استعمال بايثون أو ماتلاب بديلًا.</p>
    <p>بعد مراجعة للبرمجة (المتغيرات، حلقات التكرار، الشروط، المصفوفات، الدوال والبرامج الفرعية) ولحساب الفاصلة العائمة والأخطاء العددية، ندرس التكامل العددي (قاعدتا شبه المنحرف وسمبسون)، وحل المعادلات غير الخطية (التنصيف، نيوتن-رافسون، القاطع)، والجمل الخطية (طريقة غاوس للحذف مع الارتكاز، وتكرار غاوس-زايدل)، والاستكمال الداخلي والاشتقاق العددي، ومسائل القيم الابتدائية للمعادلات التفاضلية العادية (طريقتا أويلر ورونغه-كوتا).</p>
    <p>تُقيَّم كل طريقة من ثلاث جهات: <em>الدقة</em> (رتبة الخطأ)، و<em>الكلفة</em> (عدد العمليات)، و<em>الاستقرار</em>. ويتعلم الطلبة اختبار البرنامج على نتائج مضبوطة معروفة قبل الوثوق به في مسألة حقيقية، مثل حركة النواس غير الخطي.</p>


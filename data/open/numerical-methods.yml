glossary:
  - { en: Algorithm, ar: الخوارزمية, fr: Algorithme, def: { en: 'A finite, unambiguous sequence of steps that solves a problem.', ar: متتالية منتهية وواضحة من الخطوات تحل مسألة ما. } }
  - { en: Compiler, ar: المترجم (المُصرِّف), fr: Compilateur, def: { en: Program that translates source code (e.g. Fortran) into machine code., ar: برنامج يحوّل الشفرة المصدرية (مثل فورتران) إلى لغة الآلة. } }
  - { en: Loop, ar: حلقة التكرار, fr: Boucle, def: { en: 'A block of instructions executed repeatedly (Fortran <code>do ... end do</code>).', ar: 'كتلة تعليمات تُنفَّذ بشكل متكرر (في فورتران <code>do ... end do</code>).' } }
  - { en: Subroutine, ar: البرنامج الفرعي, fr: Sous-programme, def: { en: 'A named, reusable block of code called with arguments.', ar: كتلة شفرة مسمّاة قابلة لإعادة الاستعمال تُستدعى بوسائط. } }
  - { en: Floating-point number, ar: العدد ذو الفاصلة العائمة, fr: Nombre à virgule flottante, def: { en: 'Representation \(\pm m\times2^e\) with a finite mantissa and exponent.', ar: 'تمثيل من الشكل \(\pm m\times2^e\) بجزء عشري وأس منتهيين.' } }
  - { en: Machine epsilon, ar: إبسيلون الآلة, fr: Epsilon machine, def: { en: 'Smallest \(\varepsilon\) such that \(1+\varepsilon\neq1\) in the machine (\(\approx2.2\times10^{-16}\) in double precision).', ar: 'أصغر \(\varepsilon\) يحقق \(1+\varepsilon\neq1\) في الآلة (\(\approx2.2\times10^{-16}\) في الدقة المضاعفة).' } }
  - { en: Round-off error, ar: خطأ التدوير, fr: Erreur d'arrondi, def: { en: Error due to storing numbers with a finite number of digits., ar: خطأ ناتج عن تخزين الأعداد بعدد منتهٍ من الأرقام. } }
  - { en: Truncation error, ar: خطأ البتر, fr: Erreur de troncature, def: { en: Error due to replacing an exact mathematical process by a finite approximation (e.g. a truncated Taylor series)., ar: خطأ ناتج عن استبدال عملية رياضية مضبوطة بتقريب منتهٍ (مثل بتر متسلسلة تايلور). } }
  - { en: Relative error, ar: الخطأ النسبي, fr: Erreur relative, def: { en: '\(|x-\tilde x|/|x|\); it measures the number of correct significant digits.', ar: '\(|x-\tilde x|/|x|\)، ويقيس عدد الأرقام المعنوية الصحيحة.' } }
  - { en: Catastrophic cancellation, ar: الحذف الكارثي, fr: Élimination catastrophique, def: { en: Loss of significant digits when subtracting two nearly equal numbers., ar: ضياع الأرقام المعنوية عند طرح عددين متقاربين جدًّا. } }
  - { en: Order of a method, ar: رتبة الطريقة, fr: Ordre d'une méthode, def: { en: 'The power \(p\) in an error \(\order{h^p}\).', ar: 'القوة \(p\) في خطأ من الشكل \(\order{h^p}\).' } }
  - { en: Convergence, ar: التقارب, fr: Convergence, def: { en: Approach of the iterates or approximations to the exact solution as iterations increase or \(h\to0\)., ar: 'اقتراب التكرارات أو التقريبات من الحل المضبوط بزيادة عدد التكرارات أو عندما \(h\to0\).' } }
  - { en: Bisection method, ar: طريقة التنصيف, fr: Méthode de dichotomie, def: { en: Root finding by repeatedly halving an interval where the function changes sign., ar: إيجاد الجذر بتنصيف متكرر لمجال تغيّر فيه الدالة إشارتها. } }
  - { en: Newton–Raphson method, ar: طريقة نيوتن-رافسون, fr: Méthode de Newton-Raphson, def: { en: 'Iteration \(x_{n+1}=x_n-f(x_n)/f''(x_n)\); quadratic convergence near a simple root.', ar: 'التكرار \(x_{n+1}=x_n-f(x_n)/f''(x_n)\)، وتقاربه تربيعي قرب الجذر البسيط.' } }
  - { en: Secant method, ar: طريقة القاطع, fr: Méthode de la sécante, def: { en: Newton-like method in which the derivative is replaced by the slope through the last two iterates., ar: طريقة شبيهة بطريقة نيوتن تُستبدل فيها المشتقة بميل المستقيم المار بآخر تكرارين. } }
  - { en: Trapezoidal rule, ar: قاعدة شبه المنحرف, fr: Méthode des trapèzes, def: { en: 'Integration by linear interpolation on each sub-interval; error \(\order{h^2}\).', ar: 'تكامل باستكمال خطي على كل مجال جزئي، وخطؤها \(\order{h^2}\).' } }
  - { en: Simpson's rule, ar: قاعدة سمبسون, fr: Méthode de Simpson, def: { en: 'Integration by quadratic interpolation on pairs of sub-intervals; error \(\order{h^4}\).', ar: 'تكامل باستكمال تربيعي على كل زوج من المجالات الجزئية، وخطؤها \(\order{h^4}\).' } }
  - { en: Interpolation, ar: الاستكمال الداخلي, fr: Interpolation, def: { en: Construction of a function (often a polynomial) passing exactly through given data points., ar: إنشاء دالة (غالبًا كثير حدود) تمر تمامًا بنقاط معطاة. } }
  - { en: Lagrange polynomial, ar: كثير حدود لاغرانج, fr: Polynôme de Lagrange, def: { en: 'Interpolating polynomial written as \(\sum_i y_i\,\ell_i(x)\) with \(\ell_i(x_j)=\delta_{ij}\).', ar: 'كثير الحدود الاستكمالي المكتوب على الشكل \(\sum_i y_i\,\ell_i(x)\) حيث \(\ell_i(x_j)=\delta_{ij}\).' } }
  - { en: Finite difference, ar: الفروق المنتهية, fr: Différences finies, def: { en: Approximation of derivatives by differences of function values at nearby points., ar: تقريب المشتقات بفروق بين قيم الدالة عند نقاط متجاورة. } }
  - { en: Gauss elimination, ar: طريقة غاوس للحذف, fr: Méthode d'élimination de Gauss, def: { en: Reduction of a linear system to upper-triangular form followed by back substitution., ar: تحويل جملة خطية إلى شكل مثلثي علوي ثم حلها بالتعويض التراجعي. } }
  - { en: Pivoting, ar: الارتكاز, fr: Pivotage, def: { en: Row (and column) exchanges choosing a large pivot to avoid division by small numbers., ar: تبديل الأسطر (والأعمدة) لاختيار ارتكاز كبير وتجنّب القسمة على أعداد صغيرة. } }
  - { en: LU decomposition, ar: تفكيك LU, fr: Décomposition LU, def: { en: 'Factorisation \(A=LU\) into lower- and upper-triangular matrices.', ar: 'تحليل \(A=LU\) إلى جداء مصفوفة مثلثية سفلية ومصفوفة مثلثية علوية.' } }
  - { en: Gauss–Seidel method, ar: طريقة غاوس-زايدل, fr: Méthode de Gauss-Seidel, def: { en: Iterative solver that updates each unknown using the most recent values of the others., ar: طريقة تكرارية تحدّث كل مجهول باستعمال أحدث قيم المجاهيل الأخرى. } }
  - { en: Diagonal dominance, ar: الهيمنة القطرية, fr: Dominance diagonale, def: { en: '\(|a_{ii}|>\sum_{j\neq i}|a_{ij}|\) for every row; a sufficient condition for Jacobi/Gauss–Seidel convergence.', ar: '\(|a_{ii}|>\sum_{j\neq i}|a_{ij}|\) في كل سطر، وهو شرط كافٍ لتقارب جاكوبي وغاوس-زايدل.' } }
  - { en: Euler method, ar: طريقة أويلر, fr: Méthode d'Euler, def: { en: '\(y_{n+1}=y_n+hf(t_n,y_n)\); first-order ODE integrator.', ar: '\(y_{n+1}=y_n+hf(t_n,y_n)\)، طريقة مكاملة من الرتبة الأولى.' } }
  - { en: Runge–Kutta method, ar: طريقة رونغه-كوتا, fr: Méthode de Runge-Kutta, def: { en: One-step method combining several slope evaluations per step; RK4 is fourth order., ar: طريقة ذات خطوة واحدة تجمع عدة حسابات للميل في كل خطوة، وRK4 من الرتبة الرابعة. } }
  - { en: Step size, ar: الخطوة, fr: Pas, def: { en: 'The increment \(h\) of the discretisation; it controls both accuracy and cost.', ar: 'مقدار \(h\) في التقطيع، وهو يتحكم في الدقة والكلفة معًا.' } }
  - { en: Stability, ar: الاستقرار, fr: Stabilité, def: { en: Property of a method whose errors do not grow without bound from step to step., ar: خاصية طريقة لا تتضخم أخطاؤها بلا حدود من خطوة إلى أخرى. } }
  - { en: Residual, ar: الباقي, fr: Résidu, def: { en: '\(\vb r=\vb b-A\tilde{\vb x}\); it measures how well an approximate solution satisfies the system.', ar: '\(\vb r=\vb b-A\tilde{\vb x}\)، ويقيس مدى تحقيق الحل التقريبي للجملة.' } }

outcomes:
  - id: CLO1
    bloom: apply
    domain: skills
    text:
      en: Write, compile, test and debug structured programs (loops, conditions, arrays, functions, subroutines, file output) that implement numerical algorithms.
      ar: يكتب برامج مهيكلة (حلقات تكرار، شروط، مصفوفات، دوال، برامج فرعية، كتابة في ملفات) تنفّذ خوارزميات عددية، ويترجمها ويختبرها ويصحّح أخطاءها.
    assessed_by: [lab, homework, project]
  - id: CLO2
    bloom: understand
    domain: knowledge
    text:
      en: Explain floating-point representation, round-off and truncation errors, and the meaning of the order of a method.
      ar: يشرح تمثيل الأعداد بالفاصلة العائمة وأخطاء التدوير والبتر ومعنى رتبة الطريقة.
    assessed_by: [quizzes, midterm, final]
  - id: CLO3
    bloom: apply
    domain: skills
    text:
      en: Apply the trapezoidal and Simpson rules and estimate their errors as functions of the step size.
      ar: يطبّق قاعدتي شبه المنحرف وسمبسون ويقدّر أخطاءهما بدلالة الخطوة.
    assessed_by: [quizzes, homework, lab, midterm, final]
  - id: CLO4
    bloom: analyze
    domain: knowledge
    text:
      en: Solve nonlinear equations with bisection and Newton–Raphson, and analyse their convergence (linear vs quadratic, failure cases).
      ar: يحل المعادلات غير الخطية بطريقتي التنصيف ونيوتن-رافسون، ويحلل تقاربهما (خطي أو تربيعي، وحالات الإخفاق).
    assessed_by: [quizzes, homework, lab, midterm, final]
  - id: CLO5
    bloom: apply
    domain: skills
    text:
      en: Solve linear systems by Gauss elimination with partial pivoting and by Gauss–Seidel iteration, and state when the iteration converges.
      ar: يحل الجمل الخطية بطريقة غاوس للحذف مع الارتكاز الجزئي وبتكرار غاوس-زايدل، ويحدد شروط تقارب التكرار.
    assessed_by: [homework, lab, final]
  - id: CLO6
    bloom: apply
    domain: skills
    text:
      en: Integrate initial-value problems (including second-order equations rewritten as systems) with Euler and RK4 and compare their accuracy and stability.
      ar: يكامل مسائل القيم الابتدائية (بما فيها المعادلات من الرتبة الثانية بعد كتابتها كجملة) بطريقتي أويلر ورونغه-كوتا من الرتبة الرابعة، ويقارن دقتيهما واستقرارهما.
    assessed_by: [quizzes, lab, project, final]
  - id: CLO7
    bloom: evaluate
    domain: skills
    text:
      en: Choose a suitable method for a physics problem, validate the code against exact results and justify the choice of step size in a short report.
      ar: يختار طريقة مناسبة لمسألة فيزيائية، ويتحقق من صحة البرنامج بمقارنته بنتائج مضبوطة، ويبرّر اختيار الخطوة في تقرير قصير.
    assessed_by: [project]
  - id: CLO8
    bloom: apply
    domain: values
    text:
      en: Write their own code and reports honestly, document sources, and work responsibly in pairs during lab sessions.
      ar: يكتب برامجه وتقاريره بنفسه وبأمانة، ويوثّق مصادره، ويعمل بمسؤولية ضمن ثنائي في حصص الإعلام الآلي.
    assessed_by: [lab, project]

assessment:
  - id: lab
    type: lab
    weight: 15
    title: { en: Computer-lab work (TP), ar: الأعمال التطبيقية على الحاسوب }
    detail:
      en: 'Each lab session ends with a working, commented program and a short output file or plot. Graded on correctness, code clarity and testing.'
      ar: 'تنتهي كل حصة تطبيقية ببرنامج يعمل ومشروح بتعليقات، مع ملف نتائج قصير أو منحنى. تُقيَّم على صحة البرنامج ووضوح الكود والاختبار.'
    when: { en: Weekly, ar: أسبوعيًّا }
  - id: homework
    type: homework
    weight: 10
    title: { en: Assignments, ar: الواجبات }
    detail:
      en: Five assignments mixing hand calculations and short programs, each due one week after release.
      ar: خمسة واجبات تجمع بين الحساب اليدوي والبرامج القصيرة، يُسلَّم كلٌّ منها بعد أسبوع من نشره.
    when: { en: 'Weeks 5, 7, 9, 10, 13', ar: الأسابيع 5، 7، 9، 10، 13 }
  - id: quizzes
    type: quiz
    weight: 5
    title: { en: Short quizzes, ar: اختبارات قصيرة }
    detail:
      en: Two 15-minute quizzes on concepts (error orders, convergence, stability).
      ar: اختباران قصيران مدة كلٍّ منهما 15 دقيقة حول المفاهيم (رتب الأخطاء، التقارب، الاستقرار).
    when: { en: Weeks 4 and 11, ar: الأسبوعان 4 و11 }
  - id: midterm
    type: midterm
    weight: 20
    title: { en: Midterm exam, ar: الفرض (الاختبار النصفي) }
    detail:
      en: One hour, written. Errors, numerical integration and root finding; includes reading or completing a short code.
      ar: ساعة واحدة، كتابي. الأخطاء والتكامل العددي وإيجاد الجذور، ويتضمن قراءة برنامج قصير أو إكماله.
    when: { en: Week 7, ar: الأسبوع 7 }
  - id: project
    type: project
    weight: 10
    title: { en: Mini-project, ar: مشروع مصغّر }
    detail:
      en: 'In pairs: solve a physics problem numerically (e.g. nonlinear pendulum with RK4, projectile with air drag, anharmonic oscillator energy levels by shooting), with code, validation and a 4-page report.'
      ar: 'ثنائيًّا: حلّ مسألة فيزيائية عدديًّا (مثل النواس غير الخطي بطريقة RK4، أو المقذوف مع مقاومة الهواء، أو مستويات طاقة مهتز غير توافقي بطريقة الرمي)، مع البرنامج والتحقق من صحته وتقرير من 4 صفحات.'
    when: { en: 'Assigned week 10, presented week 14', ar: يُكلَّف به في الأسبوع 10 ويُعرض في الأسبوع 14 }
  - id: final
    type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }
    detail:
      en: Two hours, written, comprehensive. Hand application of the algorithms on small cases, error analysis and pseudo-code.
      ar: ساعتان، كتابي وشامل. تطبيق يدوي للخوارزميات على حالات صغيرة، وتحليل للأخطاء، وكتابة شبه برامج.
    when: { en: Final exam period, ar: فترة الاختبارات النهائية }

schedule:
  - week: 1
    title: { en: Introduction; first programs, ar: مدخل؛ البرامج الأولى }
    topics:
      en: ['Why numerical methods? Algorithms and pseudo-code', 'Structure of a Fortran program, compiling and running (gfortran)', 'Variables, types (integer, real, double precision), input/output']
      ar: ['لماذا الطرق العددية؟ الخوارزميات وشبه البرامج', 'بنية برنامج فورتران، الترجمة والتنفيذ (gfortran)', 'المتغيرات والأنواع (صحيح، حقيقي، مضاعف الدقة)، الإدخال والإخراج']
    reading: Chapman Ch. 1–2
    activity: { en: 'Lab: environment set-up, "hello world", unit conversions', ar: 'تطبيق: تهيئة بيئة العمل، برنامج "hello world"، تحويل الوحدات' }
    milestone: lab
  - week: 2
    title: { en: 'Control structures, arrays and subprograms', ar: بنى التحكم والمصفوفات والبرامج الفرعية }
    topics:
      en: ['IF blocks and DO loops', 'Arrays and file output for plotting', 'Functions and subroutines; modular programs']
      ar: ['كتل IF وحلقات DO', 'المصفوفات والكتابة في الملفات لرسم المنحنيات', 'الدوال والبرامج الفرعية؛ البرامج المجزّأة']
    reading: Chapman Ch. 3–7
    activity: { en: 'Lab: sums of series, tables of functions', ar: 'تطبيق: مجاميع المتسلسلات وجداول الدوال' }
    milestone: lab
  - week: 3
    title: { en: Floating-point arithmetic and errors, ar: حساب الفاصلة العائمة والأخطاء }
    topics:
      en: ['IEEE representation, machine epsilon, overflow/underflow', 'Absolute and relative error, significant digits', 'Round-off vs truncation error; catastrophic cancellation']
      ar: ['تمثيل IEEE، إبسيلون الآلة، الفيضان والغوص', 'الخطأ المطلق والنسبي، الأرقام المعنوية', 'خطأ التدوير وخطأ البتر؛ الحذف الكارثي']
    reading: Burden & Faires §1.2–1.3
    activity: { en: 'Lab: computing machine epsilon; summing series forwards and backwards', ar: 'تطبيق: حساب إبسيلون الآلة؛ جمع متسلسلة تصاعديًّا وتنازليًّا' }
    milestone: lab
  - week: 4
    title: { en: Numerical integration I — trapezoidal rule, ar: التكامل العددي 1 — قاعدة شبه المنحرف }
    topics:
      en: ['Newton–Cotes idea: integrate an interpolating polynomial', 'Simple and composite trapezoidal rule', 'Error term \(-\frac{(b-a)h^2}{12}f''''(\xi)\)']
      ar: ['فكرة نيوتن-كوتس: تكامل كثير حدود استكمالي', 'قاعدة شبه المنحرف البسيطة والمركّبة', 'حد الخطأ \(-\frac{(b-a)h^2}{12}f''''(\xi)\)']
    reading: Burden & Faires §4.3–4.4; Hoffman Ch. 6
    activity: { en: Quiz 1, ar: الاختبار القصير 1 }
    milestone: quiz
  - week: 5
    title: { en: Numerical integration II — Simpson's rule, ar: التكامل العددي 2 — قاعدة سمبسون }
    topics:
      en: ['Simpson''s 1/3 rule, composite form, error \(\order{h^4}\)', 'Convergence tests: halving the step', 'Fortran code for trapezoidal and Simpson rules']
      ar: ['قاعدة سمبسون 1/3 وصيغتها المركّبة، والخطأ \(\order{h^4}\)', 'اختبار التقارب بتنصيف الخطوة', 'برنامج فورتران لقاعدتي شبه المنحرف وسمبسون']
    reading: Burden & Faires §4.3–4.4; Hoffman Ch. 6
    activity: { en: 'TP 1: integration codes; Assignment 1 released', ar: 'التطبيق 1: برامج التكامل؛ نشر الواجب 1' }
    milestone: lab
  - week: 6
    title: { en: Nonlinear equations I — bisection, ar: المعادلات غير الخطية 1 — التنصيف }
    topics:
      en: ['Bracketing a root; intermediate value theorem', 'Bisection algorithm and error bound \((b-a)/2^n\)', 'Stopping criteria']
      ar: ['حصر الجذر؛ مبرهنة القيم الوسطى', 'خوارزمية التنصيف وحدّ الخطأ \((b-a)/2^n\)', 'معايير التوقف']
    reading: Burden & Faires §2.1; Hoffman Ch. 3
  - week: 7
    title: { en: Nonlinear equations II — Newton–Raphson, ar: المعادلات غير الخطية 2 — نيوتن-رافسون }
    topics:
      en: ['Newton–Raphson iteration and its geometric meaning', 'Quadratic convergence; failure cases; secant method', 'Fortran code for Newton and bisection', Midterm exam]
      ar: ['تكرار نيوتن-رافسون ومعناه الهندسي', 'التقارب التربيعي؛ حالات الإخفاق؛ طريقة القاطع', 'برنامج فورتران لطريقتي نيوتن والتنصيف', الفرض (الاختبار النصفي)]
    reading: Burden & Faires §2.3–2.4; Hoffman Ch. 3
    activity: { en: 'TP 2: root-finding codes; Assignment 2', ar: 'التطبيق 2: برامج إيجاد الجذور؛ الواجب 2' }
    milestone: midterm
  - week: 8
    title: { en: Linear systems I — Gauss elimination, ar: الجمل الخطية 1 — طريقة غاوس للحذف }
    topics:
      en: ['Matrix form \(A\vb{x}=\vb{b}\); triangular systems and back substitution', 'Gauss elimination without pivoting', 'Operation count \(\sim\tfrac23 n^3\)']
      ar: ['الصيغة المصفوفية \(A\vb{x}=\vb{b}\)؛ الجمل المثلثية والتعويض التراجعي', 'طريقة غاوس للحذف دون ارتكاز', 'عدد العمليات \(\sim\tfrac23 n^3\)']
    reading: Burden & Faires §6.1; Hoffman Ch. 1
  - week: 9
    title: { en: Linear systems II — pivoting, ar: الجمل الخطية 2 — الارتكاز }
    topics:
      en: ['Zero and small pivots; partial and total pivoting', 'LU factorisation (overview)', 'Fortran code for Gauss elimination']
      ar: ['الارتكازات المعدومة والصغيرة؛ الارتكاز الجزئي والكلي', 'تفكيك LU (نظرة عامة)', 'برنامج فورتران لطريقة غاوس']
    reading: Burden & Faires §6.2, 6.5; Hoffman Ch. 1
    activity: { en: 'TP 3: Gauss elimination; Assignment 3', ar: 'التطبيق 3: طريقة غاوس؛ الواجب 3' }
    milestone: lab
  - week: 10
    title: { en: Linear systems III — iterative methods, ar: الجمل الخطية 3 — الطرق التكرارية }
    topics:
      en: ['Jacobi and Gauss–Seidel iterations', 'Convergence for strictly diagonally dominant matrices', 'Stopping criteria and residual']
      ar: ['تكرارا جاكوبي وغاوس-زايدل', 'التقارب في حالة المصفوفات ذات الهيمنة القطرية الصارمة', 'معايير التوقف والباقي']
    reading: Burden & Faires §7.3; Hoffman Ch. 1
    activity: { en: 'TP 4: Gauss–Seidel; Assignment 4; mini-project assigned', ar: 'التطبيق 4: غاوس-زايدل؛ الواجب 4؛ تكليف المشروع المصغّر' }
    milestone: project
  - week: 11
    title: { en: Interpolation and numerical differentiation, ar: الاستكمال الداخلي والاشتقاق العددي }
    topics:
      en: ['Lagrange polynomial and Newton divided differences', 'Forward, backward and central differences; error orders', 'Optimal step: truncation vs round-off']
      ar: ['كثير حدود لاغرانج والفروق المقسومة لنيوتن', 'الفروق الأمامية والخلفية والمركزية؛ رتب الأخطاء', 'الخطوة المثلى: خطأ البتر مقابل خطأ التدوير']
    reading: Burden & Faires §3.1, 3.3, 4.1; Hoffman Ch. 4–5
    activity: { en: Quiz 2, ar: الاختبار القصير 2 }
    milestone: quiz
  - week: 12
    title: { en: ODEs I — Euler's method, ar: المعادلات التفاضلية 1 — طريقة أويلر }
    topics:
      en: ['Initial-value problems \(y''=f(t,y)\)', 'Explicit Euler: local and global errors', 'Stability for \(y''=-\lambda y\)']
      ar: ['مسائل القيم الابتدائية \(y''=f(t,y)\)', 'طريقة أويلر الصريحة: الخطأ المحلي والكلي', 'الاستقرار في حالة \(y''=-\lambda y\)']
    reading: Burden & Faires §5.2; Hoffman Ch. 7
  - week: 13
    title: { en: ODEs II — Runge–Kutta methods, ar: المعادلات التفاضلية 2 — طرق رونغه-كوتا }
    topics:
      en: ['RK2 (midpoint/Heun) and classical RK4', 'Systems and second-order equations: the pendulum', 'Energy drift and step-size choice']
      ar: ['RK2 (نقطة المنتصف/هيون) وRK4 الكلاسيكية', 'الجمل والمعادلات من الرتبة الثانية: النواس', 'انجراف الطاقة واختيار الخطوة']
    reading: Burden & Faires §5.4, 5.9; Hoffman Ch. 7
    activity: { en: 'TP 5: Euler vs RK4 on the pendulum; Assignment 5', ar: 'التطبيق 5: مقارنة أويلر وRK4 على النواس؛ الواجب 5' }

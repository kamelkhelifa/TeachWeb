exam_guide:
  format:
    en: The final exam is a 2-hour written paper with four or five problems — typically one on systems of particles or plane rigid-body motion, one on three-dimensional rotation, one or two Lagrangian problems (set up coordinates, find the equations of motion, conserved quantities, small oscillations) and one Hamiltonian or normal-mode problem. Midterms last 1 h 30 min with three problems each.
    ar: الاختبار النهائي ورقة كتابية مدتها ساعتان تتضمن أربع أو خمس مسائل — عادةً مسألة حول جمل الجسيمات أو الحركة المستوية للجسم الصلب، ومسألة حول الدوران في ثلاثة أبعاد، ومسألة أو مسألتان بطريقة لاغرانج (اختيار الإحداثيات، معادلات الحركة، المقادير المنحفظة، الاهتزازات الصغيرة)، ومسألة حول صياغة هاملتون أو الأنماط الذاتية. ومدة كل اختبار نصفي ساعة ونصف بثلاث مسائل.
  allowed:
    en: A non-programmable scientific calculator. A table of moments of inertia of standard bodies is provided; no other notes.
    ar: آلة حاسبة علمية غير قابلة للبرمجة. يُقدَّم جدول بعزوم عطالة الأجسام المألوفة؛ ولا يُسمح بأي مذكرات أخرى.
  tips:
    - en: 'In Lagrangian problems, count the degrees of freedom first, choose coordinates that make the constraints automatic, and write T and U carefully — velocity of each mass in the chosen coordinates is where most errors occur.'
      ar: في مسائل لاغرانج، احسب عدد درجات الحرية أولًا، واختر إحداثيات تجعل القيود محققة تلقائيًا، واكتب T وU بعناية — فحساب سرعة كل كتلة بالإحداثيات المختارة هو موضع معظم الأخطاء.
    - en: Look for cyclic coordinates and time-independence before solving anything — the conserved quantities often give the answer directly.
      ar: ابحث عن الإحداثيات الدورية وعن عدم تعلق دالة لاغرانج بالزمن قبل أي حل — فالمقادير المنحفظة تعطي الجواب مباشرة في كثير من الأحيان.
    - en: For rigid bodies, always state the axis about which a moment of inertia is taken; use the parallel-axis theorem only from the centre of mass.
      ar: في الأجسام الصلبة، حدّد دائمًا المحور الذي يُحسب حوله عزم العطالة؛ ولا تستعمل نظرية المحاور المتوازية إلا انطلاقًا من مركز الكتلة.
    - en: Check every result in a limiting case (zero rotation, equal masses, small angles) and with dimensional analysis.
      ar: تحقّق من كل نتيجة في حالة حدّية (دوران معدوم، كتل متساوية، زوايا صغيرة) وبالتحليل البُعدي.

problems:
  - title: { en: Physical pendulum — the best pivot, ar: النواس الفيزيائي — أفضل نقطة تعليق }
    difficulty: 1
    statement:
      en: |
        A uniform rod of mass \(M\) and length \(L\) swings in a vertical plane about a horizontal pivot located a distance \(d\) from its centre.

        (a) Find the period of small oscillations \(T(d)\).
        (b) For which \(d\) is the period minimal? What is \(T_{\min}\) for \(L = 1\ \text{m}\)?
        (c) Show that pivoting at the distance \(d' = L^2/12d\) on the other side of the centre gives the same period.
      ar: |
        قضيب متجانس كتلته \(M\) وطوله \(L\) يهتز في مستوٍ شاقولي حول محور أفقي يبعد مسافة \(d\) عن مركزه.

        (أ) أوجد دور الاهتزازات الصغيرة \(T(d)\).
        (ب) من أجل أي قيمة لـ \(d\) يكون الدور أصغريًا؟ ما قيمة \(T_{\min}\) من أجل \(L = 1\ \text{m}\)؟
        (ج) بيّن أن التعليق على البعد \(d' = L^2/12d\) من الجهة الأخرى للمركز يعطي الدور نفسه.
    hint:
      en: 'Torque about the pivot: \(-Mgd\sin\theta\). Moment of inertia about the pivot: \(I = ML^2/12 + Md^2\).'
      ar: 'العزم حول نقطة التعليق: \(-Mgd\sin\theta\). وعزم العطالة حولها: \(I = ML^2/12 + Md^2\).'
    solution:
      en: |
        (a) \(I\ddot\theta = -Mgd\sin\theta \approx -Mgd\,\theta\), with \(I = M(L^2/12 + d^2)\):
        \[ T(d) = 2\pi\sqrt{\frac{L^2/12 + d^2}{g\,d}}. \]

        (b) Minimise \(f(d) = L^2/12d + d\): \(f'(d) = -L^2/12d^2 + 1 = 0\), so
        \[ d^\ast = \frac{L}{\sqrt{12}} \approx 0.289\,L, \qquad T_{\min} = 2\pi\sqrt{\frac{2d^\ast}{g}} \approx 2\pi\sqrt{\frac{0.577}{9.81}} \approx 1.52\ \text{s}. \]

        (c) \(f(d') = \dfrac{L^2}{12d'} + d' = d + \dfrac{L^2}{12d} = f(d)\). The equivalent simple-pendulum length is \(\ell = d + d'\); the two pivot points are conjugate (this is the principle of Kater's reversible pendulum).
      ar: |
        (أ) \(I\ddot\theta = -Mgd\sin\theta \approx -Mgd\,\theta\)، مع \(I = M(L^2/12 + d^2)\):
        \[ T(d) = 2\pi\sqrt{\frac{L^2/12 + d^2}{g\,d}}. \]

        (ب) نجعل \(f(d) = L^2/12d + d\) أصغرية: \(f'(d) = -L^2/12d^2 + 1 = 0\)، ومنه
        \[ d^\ast = \frac{L}{\sqrt{12}} \approx 0.289\,L, \qquad T_{\min} = 2\pi\sqrt{\frac{2d^\ast}{g}} \approx 2\pi\sqrt{\frac{0.577}{9.81}} \approx 1.52\ \text{s}. \]

        (ج) \(f(d') = \dfrac{L^2}{12d'} + d' = d + \dfrac{L^2}{12d} = f(d)\). طول النواس البسيط المكافئ هو \(\ell = d + d'\)؛ ونقطتا التعليق مترافقتان (وهذا مبدأ نواس كاتر العكوس).
  - title: { en: Rocket launch with gravity, ar: إطلاق صاروخ مع الثقالة }
    difficulty: 2
    statement:
      en: |
        A rocket of initial mass \(m_0\) ejects gas at constant speed \(u = 2.5\ \text{km/s}\) relative to itself, at a constant rate, until its mass is \(m_f = m_0/4\) after \(t_b = 100\ \text{s}\).

        (a) Derive the rocket equation in free space and find the speed gained.
        (b) The rocket is now launched vertically from the ground in a uniform field \(g = 9.81\ \text{m/s}^2\) (no air). Check that it can lift off, and find its speed at burn-out.
      ar: |
        صاروخ كتلته الابتدائية \(m_0\) يقذف الغاز بسرعة ثابتة \(u = 2.5\ \text{km/s}\) بالنسبة إليه، وبمعدل ثابت، حتى تصبح كتلته \(m_f = m_0/4\) بعد \(t_b = 100\ \text{s}\).

        (أ) استنتج معادلة الصاروخ في الفضاء الحر وأوجد السرعة المكتسبة.
        (ب) يُطلق الصاروخ الآن شاقوليًا من سطح الأرض في حقل ثقالة منتظم \(g = 9.81\ \text{m/s}^2\) (دون هواء). تحقّق من أنه يستطيع الإقلاع، وأوجد سرعته عند انتهاء الاحتراق.
    hint:
      en: 'Write the momentum of rocket + ejected gas at \(t\) and \(t+\dd t\). The thrust is \(u\,|\dd m/\dd t|\).'
      ar: 'اكتب كمية حركة الصاروخ والغاز المقذوف عند \(t\) وعند \(t+\dd t\). قوة الدفع هي \(u\,|\dd m/\dd t|\).'
    solution:
      en: |
        (a) In a time \(\dd t\) the rocket ejects a mass \(-\dd m>0\) with velocity \(v-u\). Conservation of momentum gives \(m\,\dd v = -u\,\dd m\), hence
        \[ \Delta v = u\ln\frac{m_0}{m_f} = 2.5\ln 4 \approx 3.47\ \text{km/s}. \]

        (b) With gravity, \(m\dv{v}{t} = -u\dv{m}{t} - mg\). The burn rate is \(|\dot m| = 0.75\,m_0/100\ \text{s}\), so the initial thrust \(u|\dot m| = 18.75\,m_0\ \text{N/kg}\) exceeds the weight \(9.81\,m_0\): the rocket lifts off (thrust-to-weight ratio ≈ 1.9). Integrating,
        \[ v(t_b) = u\ln\frac{m_0}{m_f} - g\,t_b \approx 3.47 - 0.98 \approx 2.49\ \text{km/s}. \]
        Gravity losses cost about 1 km/s — one reason real rockets burn fast.
      ar: |
        (أ) خلال \(\dd t\) يقذف الصاروخ كتلة \(-\dd m>0\) بسرعة \(v-u\). يعطي انحفاظ كمية الحركة \(m\,\dd v = -u\,\dd m\)، ومنه
        \[ \Delta v = u\ln\frac{m_0}{m_f} = 2.5\ln 4 \approx 3.47\ \text{km/s}. \]

        (ب) مع الثقالة \(m\dv{v}{t} = -u\dv{m}{t} - mg\). معدل الاحتراق \(|\dot m| = 0.75\,m_0/100\ \text{s}\)، فقوة الدفع الابتدائية \(u|\dot m| = 18.75\,m_0\ \text{N/kg}\) أكبر من الثقل \(9.81\,m_0\): يقلع الصاروخ (نسبة الدفع إلى الثقل ≈ 1.9). وبالمكاملة
        \[ v(t_b) = u\ln\frac{m_0}{m_f} - g\,t_b \approx 3.47 - 0.98 \approx 2.49\ \text{km/s}. \]
        تكلّف الثقالة نحو 1 km/s — وهذا أحد أسباب الاحتراق السريع في الصواريخ الحقيقية.
  - title: { en: Inertia tensor of a square plate, ar: موتر العطالة لصفيحة مربعة }
    difficulty: 2
    statement:
      en: |
        A thin uniform square plate of mass \(M\) and side \(a\) lies in the \(xy\)-plane with one corner at the origin and two edges along the \(x\)- and \(y\)-axes.

        (a) Compute the inertia tensor about the origin.
        (b) Find the principal moments and principal axes at the corner.
        (c) The plate rotates with \(\boldsymbol\omega = \omega\hat{\vb{x}}\). Find \(\vb{L}\) and explain why it is not parallel to \(\boldsymbol\omega\).
      ar: |
        صفيحة مربعة رقيقة متجانسة كتلتها \(M\) وطول ضلعها \(a\) تقع في المستوي \(xy\)، أحد رؤوسها في المبدأ وضلعان منها على المحورين \(x\) و\(y\).

        (أ) احسب موتر العطالة بالنسبة إلى المبدأ.
        (ب) أوجد العزوم الرئيسية والمحاور الرئيسية عند الرأس.
        (ج) تدور الصفيحة بـ \(\boldsymbol\omega = \omega\hat{\vb{x}}\). أوجد \(\vb{L}\) واشرح لماذا لا يوازي \(\boldsymbol\omega\).
    hint:
      en: 'Surface density \(\sigma = M/a^2\). \(I_{xx} = \int y^2\,\dd m\), \(I_{xy} = -\int xy\,\dd m\); for a plane body \(I_{zz} = I_{xx}+I_{yy}\).'
      ar: 'الكثافة السطحية \(\sigma = M/a^2\). \(I_{xx} = \int y^2\,\dd m\)، \(I_{xy} = -\int xy\,\dd m\)؛ ولجسم مستوٍ \(I_{zz} = I_{xx}+I_{yy}\).'
    solution:
      en: |
        (a) \(I_{xx} = \sigma\int_0^a\!\int_0^a y^2\,\dd x\,\dd y = \tfrac13Ma^2 = I_{yy}\), \(I_{zz} = \tfrac23Ma^2\), \(I_{xy} = -\sigma\left(\tfrac{a^2}{2}\right)^2 = -\tfrac14Ma^2\), and \(I_{xz} = I_{yz} = 0\) (since \(z = 0\)):
        \[ \mathsf{I} = Ma^2\begin{pmatrix} 1/3 & -1/4 & 0\\ -1/4 & 1/3 & 0\\ 0 & 0 & 2/3 \end{pmatrix}. \]

        (b) The \(z\)-axis is principal with \(I_3 = \tfrac23Ma^2\). The \(2\times2\) block has eigenvalues \(\tfrac13\mp\tfrac14\):
        \[ I_1 = \tfrac{1}{12}Ma^2,\ \ \hat{\vb{e}}_1 = \tfrac{1}{\sqrt2}(1,1,0); \qquad I_2 = \tfrac{7}{12}Ma^2,\ \ \hat{\vb{e}}_2 = \tfrac{1}{\sqrt2}(1,-1,0). \]
        Check: the diagonal passes through the centre, so \(I_1 = Ma^2/12\); the perpendicular axis through the corner is at distance \(a/\sqrt2\) from the centre, so \(I_2 = Ma^2/12 + Ma^2/2 = 7Ma^2/12\).

        (c) \(\vb{L} = \mathsf{I}\boldsymbol\omega = Ma^2\omega\left(\tfrac13, -\tfrac14, 0\right)\). The \(x\)-axis is not a principal axis (\(I_{xy}\neq0\)), so \(\vb{L}\) has a component along \(y\) and rotates with the body: bearings holding such an axis must supply a torque.
      ar: |
        (أ) \(I_{xx} = \sigma\int_0^a\!\int_0^a y^2\,\dd x\,\dd y = \tfrac13Ma^2 = I_{yy}\)، \(I_{zz} = \tfrac23Ma^2\)، \(I_{xy} = -\sigma\left(\tfrac{a^2}{2}\right)^2 = -\tfrac14Ma^2\)، و\(I_{xz} = I_{yz} = 0\) (لأن \(z = 0\)):
        \[ \mathsf{I} = Ma^2\begin{pmatrix} 1/3 & -1/4 & 0\\ -1/4 & 1/3 & 0\\ 0 & 0 & 2/3 \end{pmatrix}. \]

        (ب) المحور \(z\) رئيسي مع \(I_3 = \tfrac23Ma^2\). وللكتلة \(2\times2\) القيمتان الذاتيتان \(\tfrac13\mp\tfrac14\):
        \[ I_1 = \tfrac{1}{12}Ma^2,\ \ \hat{\vb{e}}_1 = \tfrac{1}{\sqrt2}(1,1,0); \qquad I_2 = \tfrac{7}{12}Ma^2,\ \ \hat{\vb{e}}_2 = \tfrac{1}{\sqrt2}(1,-1,0). \]
        أي أن \(I_1\) يوافق القطر و\(I_2\) يوافق المحور العمودي عليه في المستوي. تحقق: القطر يمر بالمركز، إذن \(I_1 = Ma^2/12\)؛ والمحور العمودي عليه المار بالرأس يبعد \(a/\sqrt2\) عن المركز، إذن \(I_2 = Ma^2/12 + Ma^2/2 = 7Ma^2/12\).

        (ج) \(\vb{L} = \mathsf{I}\boldsymbol\omega = Ma^2\omega\left(\tfrac13, -\tfrac14, 0\right)\). المحور \(x\) ليس محورًا رئيسيًا (\(I_{xy}\neq0\))، فلـ \(\vb{L}\) مركبة على \(y\) تدور مع الجسم: ويجب على المساند التي تثبّت هذا المحور أن تؤثر بعزم.
  - title: { en: Bead on a rotating hoop, ar: خرزة على حلقة دوّارة }
    difficulty: 3
    statement:
      en: |
        A bead of mass \(m\) slides without friction on a circular hoop of radius \(R\). The hoop rotates at constant angular velocity \(\omega\) about its vertical diameter. Let \(\theta\) be the angle of the bead measured from the bottom of the hoop.

        (a) Write the Lagrangian and the equation of motion.
        (b) Find the equilibrium positions and discuss their stability as a function of \(\omega\).
        (c) Find the frequency of small oscillations about each stable equilibrium.
        (d) Is the total energy conserved? Identify the conserved quantity.
      ar: |
        خرزة كتلتها \(m\) تنزلق دون احتكاك على حلقة دائرية نصف قطرها \(R\). تدور الحلقة بسرعة زاوية ثابتة \(\omega\) حول قطرها الشاقولي. لتكن \(\theta\) زاوية الخرزة مقيسة من أسفل الحلقة.

        (أ) اكتب دالة لاغرانج ومعادلة الحركة.
        (ب) أوجد أوضاع التوازن وناقش استقرارها بدلالة \(\omega\).
        (ج) أوجد تواتر الاهتزازات الصغيرة حول كل وضع توازن مستقر.
        (د) هل الطاقة الكلية منحفظة؟ حدّد المقدار المنحفظ.
    hint:
      en: 'The bead''s velocity has a component \(R\dot\theta\) along the hoop and \(R\omega\sin\theta\) perpendicular to the plane of the hoop. Height: \(-R\cos\theta\).'
      ar: 'لسرعة الخرزة مركبة \(R\dot\theta\) على طول الحلقة ومركبة \(R\omega\sin\theta\) عمودية على مستوي الحلقة. الارتفاع: \(-R\cos\theta\).'
    solution:
      en: |
        (a) \[ L = \tfrac12 mR^2\left(\dot\theta^2 + \omega^2\sin^2\theta\right) + mgR\cos\theta, \]
        \[ \ddot\theta = \sin\theta\left(\omega^2\cos\theta - \frac{g}{R}\right) \equiv F(\theta). \]

        (b) Equilibria: \(\theta = 0\), \(\theta = \pi\), and, if \(\omega^2 > g/R\), \(\cos\theta_0 = g/R\omega^2\). Stability requires \(F'(\theta_{\text{eq}})<0\), with \(F'(\theta) = \cos\theta(\omega^2\cos\theta - g/R) - \omega^2\sin^2\theta\).
        <ul><li>\(\theta = 0\): \(F'(0) = \omega^2 - g/R\) — stable only if \(\omega^2 < g/R\).</li><li>\(\theta = \pi\): \(F'(\pi) = \omega^2 + g/R > 0\) — always unstable.</li><li>\(\theta_0\): \(F'(\theta_0) = -\omega^2\sin^2\theta_0 < 0\) — stable whenever it exists.</li></ul>
        Above the critical rate \(\omega_c = \sqrt{g/R}\) the bottom becomes unstable and the bead moves to \(\pm\theta_0\) (a symmetry-breaking bifurcation).

        (c) \(\Omega^2 = -F'(\theta_{\text{eq}})\):
        \[ \Omega_{\theta=0} = \sqrt{\frac{g}{R} - \omega^2}, \qquad \Omega_{\theta_0} = \omega\sin\theta_0 = \sqrt{\omega^2 - \frac{g^2}{R^2\omega^2}}. \]

        (d) The constraint is time-dependent (the hoop is driven), so \(T+U\) is not conserved — the motor does work. But \(L\) has no explicit time dependence, so the energy function is conserved:
        \[ h = \dot\theta\pdv{L}{\dot\theta} - L = \tfrac12mR^2\dot\theta^2 - \tfrac12mR^2\omega^2\sin^2\theta - mgR\cos\theta. \]
      ar: |
        (أ) \[ L = \tfrac12 mR^2\left(\dot\theta^2 + \omega^2\sin^2\theta\right) + mgR\cos\theta, \]
        \[ \ddot\theta = \sin\theta\left(\omega^2\cos\theta - \frac{g}{R}\right) \equiv F(\theta). \]

        (ب) أوضاع التوازن: \(\theta = 0\)، \(\theta = \pi\)، وإذا كان \(\omega^2 > g/R\) فأيضًا \(\cos\theta_0 = g/R\omega^2\). يتطلب الاستقرار \(F'(\theta_{\text{eq}})<0\)، حيث \(F'(\theta) = \cos\theta(\omega^2\cos\theta - g/R) - \omega^2\sin^2\theta\).
        <ul><li>\(\theta = 0\): \(F'(0) = \omega^2 - g/R\) — مستقر فقط إذا كان \(\omega^2 < g/R\).</li><li>\(\theta = \pi\): \(F'(\pi) = \omega^2 + g/R > 0\) — غير مستقر دائمًا.</li><li>\(\theta_0\): \(F'(\theta_0) = -\omega^2\sin^2\theta_0 < 0\) — مستقر كلما وُجد.</li></ul>
        فوق السرعة الحرجة \(\omega_c = \sqrt{g/R}\) يصبح الوضع السفلي غير مستقر وتنتقل الخرزة إلى \(\pm\theta_0\) (تفرّع يكسر التناظر).

        (ج) \(\Omega^2 = -F'(\theta_{\text{eq}})\):
        \[ \Omega_{\theta=0} = \sqrt{\frac{g}{R} - \omega^2}, \qquad \Omega_{\theta_0} = \omega\sin\theta_0 = \sqrt{\omega^2 - \frac{g^2}{R^2\omega^2}}. \]

        (د) القيد متعلق بالزمن (الحلقة مُدارة بمحرك)، فالمجموع \(T+U\) غير منحفظ — إذ ينجز المحرك عملًا. لكن \(L\) لا تتعلق بالزمن صراحة، فدالة الطاقة منحفظة:
        \[ h = \dot\theta\pdv{L}{\dot\theta} - L = \tfrac12mR^2\dot\theta^2 - \tfrac12mR^2\omega^2\sin^2\theta - mgR\cos\theta. \]
  - title: { en: Hamiltonian of a central-force orbit, ar: دالة هاملتون لمدار تحت قوة مركزية }
    difficulty: 3
    statement:
      en: |
        A particle of mass \(m\) moves in a plane under the attractive potential \(U(r) = -k/r\).

        (a) Using polar coordinates, write the Lagrangian, the conjugate momenta and the Hamiltonian.
        (b) Write Hamilton's equations and identify the conserved quantities.
        (c) Find the radius \(r_0\) of the circular orbit with angular momentum \(\ell\).
        (d) Show that the angular frequency of small radial oscillations about \(r_0\) equals the orbital angular velocity. What does this imply for the shape of slightly non-circular orbits?
      ar: |
        جسيم كتلته \(m\) يتحرك في مستوٍ تحت تأثير الكمون الجاذب \(U(r) = -k/r\).

        (أ) باستعمال الإحداثيات القطبية، اكتب دالة لاغرانج وكميات الحركة المرافقة ودالة هاملتون.
        (ب) اكتب معادلات هاملتون وحدّد المقادير المنحفظة.
        (ج) أوجد نصف قطر المدار الدائري \(r_0\) ذي العزم الحركي \(\ell\).
        (د) بيّن أن النبض الزاوي للاهتزازات القطرية الصغيرة حول \(r_0\) يساوي السرعة الزاوية المدارية. ماذا يعني ذلك بالنسبة لشكل المدارات القريبة من الدائرية؟
    hint:
      en: 'Effective potential \(U_{\text{eff}}(r) = \ell^2/2mr^2 + U(r)\); small radial oscillations have \(\omega_r^2 = U_{\text{eff}}''''(r_0)/m\).'
      ar: 'الكمون الفعّال \(U_{\text{eff}}(r) = \ell^2/2mr^2 + U(r)\)؛ وللاهتزازات القطرية الصغيرة \(\omega_r^2 = U_{\text{eff}}''''(r_0)/m\).'
    solution:
      en: |
        (a) \(L = \tfrac12m(\dot r^2 + r^2\dot\theta^2) + k/r\); \(p_r = m\dot r\), \(p_\theta = mr^2\dot\theta\);
        \[ H = \frac{p_r^2}{2m} + \frac{p_\theta^2}{2mr^2} - \frac{k}{r}. \]

        (b) \[ \dot r = \frac{p_r}{m},\quad \dot p_r = \frac{p_\theta^2}{mr^3} - \frac{k}{r^2},\quad \dot\theta = \frac{p_\theta}{mr^2},\quad \dot p_\theta = 0. \]
        \(\theta\) is cyclic, so \(p_\theta = \ell\) (angular momentum) is conserved; \(H\) has no explicit time dependence, so \(H = E\) is conserved.

        (c) A circular orbit needs \(\dot p_r = 0\): \(\ell^2/mr_0^3 = k/r_0^2\), i.e. \(r_0 = \ell^2/mk\).

        (d) \(U_{\text{eff}}'' = 3\ell^2/mr^4 - 2k/r^3\); at \(r_0\) (using \(\ell^2 = mkr_0\)) this is \(k/r_0^3\), so \(\omega_r^2 = k/mr_0^3\). The orbital angular velocity is \(\dot\theta = \ell/mr_0^2\), and \(\dot\theta^2 = \ell^2/m^2r_0^4 = k/mr_0^3\). Hence \(\omega_r = \dot\theta\): the radius returns to the same value after exactly one revolution, so nearly circular orbits close on themselves — they are ellipses, and the perihelion does not precess. This is special to the \(1/r\) potential (and the harmonic one).
      ar: |
        (أ) \(L = \tfrac12m(\dot r^2 + r^2\dot\theta^2) + k/r\)؛ \(p_r = m\dot r\)، \(p_\theta = mr^2\dot\theta\)؛
        \[ H = \frac{p_r^2}{2m} + \frac{p_\theta^2}{2mr^2} - \frac{k}{r}. \]

        (ب) \[ \dot r = \frac{p_r}{m},\quad \dot p_r = \frac{p_\theta^2}{mr^3} - \frac{k}{r^2},\quad \dot\theta = \frac{p_\theta}{mr^2},\quad \dot p_\theta = 0. \]
        الإحداثية \(\theta\) دورية، فـ \(p_\theta = \ell\) (العزم الحركي) منحفظ؛ و\(H\) لا تتعلق بالزمن صراحة، فـ \(H = E\) منحفظة.

        (ج) يتطلب المدار الدائري \(\dot p_r = 0\): \(\ell^2/mr_0^3 = k/r_0^2\)، أي \(r_0 = \ell^2/mk\).

        (د) \(U_{\text{eff}}'' = 3\ell^2/mr^4 - 2k/r^3\)؛ وعند \(r_0\) (باستعمال \(\ell^2 = mkr_0\)) تساوي \(k/r_0^3\)، إذن \(\omega_r^2 = k/mr_0^3\). والسرعة الزاوية المدارية \(\dot\theta = \ell/mr_0^2\)، و\(\dot\theta^2 = \ell^2/m^2r_0^4 = k/mr_0^3\). ومنه \(\omega_r = \dot\theta\): يعود نصف القطر إلى القيمة نفسها بعد دورة واحدة بالضبط، فتنغلق المدارات القريبة من الدائرية على نفسها — إنها قطوع ناقصة، ولا يتقدم الحضيض. وهذه خاصية مميزة للكمون \(1/r\) (وللكمون التوافقي).
  - title: { en: Normal modes of the double pendulum, ar: الأنماط الذاتية للنواس المزدوج }
    difficulty: 3
    statement:
      en: |
        A double pendulum consists of two equal masses \(m\) and two massless rods of equal length \(l\), moving in a vertical plane. Let \(\theta_1, \theta_2\) be the angles of the upper and lower rods with the vertical.

        (a) Write \(T\) and \(U\) to second order in the small angles and velocities.
        (b) Find the two normal frequencies.
        (c) Find the mode shapes and describe them physically.
      ar: |
        نواس مزدوج يتكون من كتلتين متساويتين \(m\) وقضيبين مهملي الكتلة طول كل منهما \(l\)، يتحرك في مستوٍ شاقولي. لتكن \(\theta_1, \theta_2\) زاويتا القضيبين العلوي والسفلي مع الشاقول.

        (أ) اكتب \(T\) و\(U\) حتى الرتبة الثانية في الزوايا والسرعات الصغيرة.
        (ب) أوجد التواترين الذاتيين.
        (ج) أوجد أشكال الأنماط وصفها فيزيائيًا.
    hint:
      en: 'Position of the lower mass: \((l\sin\theta_1 + l\sin\theta_2,\ -l\cos\theta_1 - l\cos\theta_2)\). Solve \(\det(\mathsf{K} - \omega^2\mathsf{M}) = 0\).'
      ar: 'موضع الكتلة السفلى: \((l\sin\theta_1 + l\sin\theta_2,\ -l\cos\theta_1 - l\cos\theta_2)\). حلّ \(\det(\mathsf{K} - \omega^2\mathsf{M}) = 0\).'
    solution:
      en: |
        (a) To second order (\(\cos(\theta_1-\theta_2)\approx1\)):
        \[ T = \tfrac12ml^2\left(2\dot\theta_1^2 + 2\dot\theta_1\dot\theta_2 + \dot\theta_2^2\right), \qquad U = \tfrac12mgl\left(2\theta_1^2 + \theta_2^2\right) + \text{const}. \]
        So \(\mathsf{M} = ml^2\begin{pmatrix}2&1\\1&1\end{pmatrix}\), \(\mathsf{K} = mgl\begin{pmatrix}2&0\\0&1\end{pmatrix}\).

        (b) With \(x = \omega^2 l/g\): \(\det\begin{pmatrix}2-2x & -x\\ -x & 1-x\end{pmatrix} = 2(1-x)^2 - x^2 = 0\), so \(\sqrt2(1-x) = \pm x\) and
        \[ \omega_{1,2}^2 = \left(2\mp\sqrt2\right)\frac{g}{l}, \qquad \omega_1\approx0.765\sqrt{g/l},\quad \omega_2\approx1.848\sqrt{g/l}. \]

        (c) From the first row, \(A_2/A_1 = (2-2x)/x\):
        <ul><li>slow mode, \(x = 2-\sqrt2\): \(A_2/A_1 = +\sqrt2\) — both rods swing in the same direction, the lower one with larger amplitude;</li><li>fast mode, \(x = 2+\sqrt2\): \(A_2/A_1 = -\sqrt2\) — the rods swing in opposite directions.</li></ul>
        Any small motion is a superposition of these two modes; since \(\omega_2/\omega_1 = \sqrt2+1\) is irrational, the general motion is never periodic.
      ar: |
        (أ) حتى الرتبة الثانية (\(\cos(\theta_1-\theta_2)\approx1\)):
        \[ T = \tfrac12ml^2\left(2\dot\theta_1^2 + 2\dot\theta_1\dot\theta_2 + \dot\theta_2^2\right), \qquad U = \tfrac12mgl\left(2\theta_1^2 + \theta_2^2\right) + \text{const}. \]
        إذن \(\mathsf{M} = ml^2\begin{pmatrix}2&1\\1&1\end{pmatrix}\)، \(\mathsf{K} = mgl\begin{pmatrix}2&0\\0&1\end{pmatrix}\).

        (ب) بوضع \(x = \omega^2 l/g\): \(\det\begin{pmatrix}2-2x & -x\\ -x & 1-x\end{pmatrix} = 2(1-x)^2 - x^2 = 0\)، أي \(\sqrt2(1-x) = \pm x\) و
        \[ \omega_{1,2}^2 = \left(2\mp\sqrt2\right)\frac{g}{l}, \qquad \omega_1\approx0.765\sqrt{g/l},\quad \omega_2\approx1.848\sqrt{g/l}. \]

        (ج) من السطر الأول \(A_2/A_1 = (2-2x)/x\):
        <ul><li>النمط البطيء، \(x = 2-\sqrt2\): \(A_2/A_1 = +\sqrt2\) — يتأرجح القضيبان في الاتجاه نفسه، والسفلي بسعة أكبر؛</li><li>النمط السريع، \(x = 2+\sqrt2\): \(A_2/A_1 = -\sqrt2\) — يتأرجح القضيبان في اتجاهين متعاكسين.</li></ul>
        كل حركة صغيرة هي تراكب لهذين النمطين؛ وبما أن \(\omega_2/\omega_1 = \sqrt2+1\) عدد غير ناطق، فإن الحركة العامة ليست دورية أبدًا.

quizzes:
  - title: { en: Systems of particles and collisions, ar: جمل الجسيمات والتصادمات }
    questions:
      - q:
          en: The total linear momentum of a system of particles is conserved when
          ar: تنحفظ كمية الحركة الخطية الكلية لجملة جسيمات عندما
        options:
          - en: the internal forces vanish
            ar: تنعدم القوى الداخلية
          - en: the total kinetic energy is conserved
            ar: تنحفظ الطاقة الحركية الكلية
          - en: the net external force is zero
            ar: تنعدم محصلة القوى الخارجية
          - en: all collisions are elastic
            ar: تكون كل التصادمات مرنة
        answer: 2
        explain:
          en: '\(\dd\vb{P}/\dd t = \vb{F}_{\text{ext}}\): internal forces cancel in pairs (Newton''s third law), whatever their size, and energy conservation is not required.'
          ar: '\(\dd\vb{P}/\dd t = \vb{F}_{\text{ext}}\): القوى الداخلية تتلاشى مثنى مثنى (قانون نيوتن الثالث) مهما كانت شدتها، ولا يُشترط انحفاظ الطاقة.'
      - q:
          en: The reduced mass of two bodies \(m_1\) and \(m_2\) is
          ar: الكتلة المختزلة لجسمين \(m_1\) و\(m_2\) هي
        options:
          - '\(m_1+m_2\)'
          - '\(\dfrac{m_1m_2}{m_1+m_2}\)'
          - '\(\sqrt{m_1m_2}\)'
          - '\(\dfrac{m_1+m_2}{2}\)'
        answer: 1
        explain:
          en: 'The relative coordinate obeys \(\mu\ddot{\vb{r}} = \vb{F}\) with \(1/\mu = 1/m_1 + 1/m_2\). If \(m_2\gg m_1\), \(\mu\approx m_1\).'
          ar: 'يحقق الإحداثي النسبي \(\mu\ddot{\vb{r}} = \vb{F}\) حيث \(1/\mu = 1/m_1 + 1/m_2\). وإذا كان \(m_2\gg m_1\) فإن \(\mu\approx m_1\).'
      - q:
          en: A mass \(m\) moving at speed \(v\) sticks to an identical mass at rest. The fraction of kinetic energy lost is
          ar: كتلة \(m\) تتحرك بسرعة \(v\) تلتحم بكتلة مماثلة ساكنة. نسبة الطاقة الحركية الضائعة هي
        options:
          - '0'
          - '1/4'
          - '3/4'
          - '1/2'
        answer: 3
        explain:
          en: 'Momentum gives a final speed \(v/2\); final KE \(= \tfrac12(2m)(v/2)^2 = \tfrac14mv^2\), half of the initial \(\tfrac12mv^2\).'
          ar: 'من انحفاظ كمية الحركة تكون السرعة النهائية \(v/2\)؛ والطاقة الحركية النهائية \(= \tfrac12(2m)(v/2)^2 = \tfrac14mv^2\)، أي نصف الطاقة الابتدائية \(\tfrac12mv^2\).'
      - q:
          en: A coefficient of restitution \(e = 1\) characterises
          ar: يميّز معامل الارتداد \(e = 1\)
        options:
          - en: an elastic collision
            ar: تصادمًا مرنًا
          - en: a perfectly inelastic collision
            ar: تصادمًا عديم المرونة كليًا
          - en: an explosion
            ar: انفجارًا
          - en: a collision in which momentum is not conserved
            ar: تصادمًا لا تنحفظ فيه كمية الحركة
        answer: 0
        explain:
          en: '\(e\) is the ratio of relative speeds after and before the collision. \(e = 1\) means kinetic energy is conserved; \(e = 0\) means the bodies stick together.'
          ar: '\(e\) هو نسبة السرعتين النسبيتين بعد التصادم وقبله. \(e = 1\) يعني انحفاظ الطاقة الحركية، و\(e = 0\) يعني التحام الجسمين.'
      - q:
          en: In free space, a rocket with exhaust speed \(u\) goes from mass \(m_0\) to \(m_f\). Its gain in speed is
          ar: في الفضاء الحر، ينتقل صاروخ سرعة غازاته \(u\) من الكتلة \(m_0\) إلى \(m_f\). الزيادة في سرعته هي
        options:
          - '\(u(m_0-m_f)/m_0\)'
          - '\(u\,m_0/m_f\)'
          - '\(u\ln(m_0/m_f)\)'
          - '\(u\ln(m_f/m_0)\)'
        answer: 2
        explain:
          en: '\(m\,\dd v = -u\,\dd m\) integrates to Tsiolkovsky''s equation. The logarithm shows why large speed gains need very large mass ratios (or staging).'
          ar: 'بمكاملة \(m\,\dd v = -u\,\dd m\) نحصل على معادلة تسيولكوفسكي. ويبيّن اللوغاريتم لماذا تحتاج الزيادات الكبيرة في السرعة إلى نسب كتل كبيرة جدًا (أو إلى صواريخ متعددة المراحل).'
  - title: { en: Rigid bodies, ar: الأجسام الصلبة }
    questions:
      - q:
          en: The moment of inertia of a uniform rod of mass \(M\) and length \(L\) about an axis through one end, perpendicular to the rod, is
          ar: عزم عطالة قضيب متجانس كتلته \(M\) وطوله \(L\) حول محور يمر بأحد طرفيه عموديًا عليه هو
        options:
          - '\(ML^2/12\)'
          - '\(ML^2/3\)'
          - '\(ML^2/2\)'
          - '\(ML^2\)'
        answer: 1
        explain:
          en: '\(I = \int_0^L x^2\,(M/L)\,\dd x = ML^2/3\), or \(ML^2/12 + M(L/2)^2\) by the parallel-axis theorem.'
          ar: '\(I = \int_0^L x^2\,(M/L)\,\dd x = ML^2/3\)، أو \(ML^2/12 + M(L/2)^2\) بنظرية المحاور المتوازية.'
      - q:
          en: The parallel-axis theorem states that \(I = I_{\text{cm}} + Md^2\), where \(I_{\text{cm}}\) is taken about
          ar: تنص نظرية المحاور المتوازية على أن \(I = I_{\text{cm}} + Md^2\)، حيث يُحسب \(I_{\text{cm}}\) حول
        options:
          - en: any axis parallel to the new one
            ar: أي محور مواز للمحور الجديد
          - en: the axis of symmetry only
            ar: محور التناظر فقط
          - en: a principal axis through the origin
            ar: محور رئيسي يمر بالمبدأ
          - en: the parallel axis through the centre of mass
            ar: المحور الموازي المار بمركز الكتلة
        answer: 3
        explain:
          en: The cross term vanishes only when the reference axis passes through the centre of mass. Consequently the moment of inertia is smallest about the centroidal axis of a family of parallel axes.
          ar: لا ينعدم الحد المختلط إلا إذا مر المحور المرجعي بمركز الكتلة. لذلك يكون عزم العطالة أصغريًا حول المحور المار بمركز الكتلة من بين عائلة محاور متوازية.
      - q:
          en: A uniform solid sphere rolls without slipping down an incline of angle \(\alpha\). Its acceleration is
          ar: كرة مصمتة متجانسة تتدحرج دون انزلاق على مستوٍ مائل بزاوية \(\alpha\). تسارعها هو
        options:
          - '\(\tfrac57 g\sin\alpha\)'
          - '\(g\sin\alpha\)'
          - '\(\tfrac23 g\sin\alpha\)'
          - '\(\tfrac12 g\sin\alpha\)'
        answer: 0
        explain:
          en: '\(a = g\sin\alpha/(1 + I/MR^2)\) with \(I = \tfrac25MR^2\). Part of the energy goes into rotation, so the sphere is slower than a frictionless block. (\(\tfrac23\) is for a thin spherical shell.)'
          ar: '\(a = g\sin\alpha/(1 + I/MR^2)\) مع \(I = \tfrac25MR^2\). يذهب جزء من الطاقة إلى الدوران، فتكون الكرة أبطأ من جسم ينزلق دون احتكاك. (أما \(\tfrac23\) فتخص قشرة كروية رقيقة.)'
      - q:
          en: A rigid body rotates about one of its principal axes. Then
          ar: يدور جسم صلب حول أحد محاوره الرئيسية. عندئذ
        options:
          - en: L is perpendicular to ω
            ar: يكون L عموديًا على ω
          - en: the inertia tensor is zero
            ar: يكون موتر العطالة معدومًا
          - en: L is parallel to ω
            ar: يكون L موازيًا لـ ω
          - en: the kinetic energy is zero
            ar: تكون الطاقة الحركية معدومة
        answer: 2
        explain:
          en: 'Principal axes are eigenvectors of the inertia tensor: \(\mathsf{I}\boldsymbol\omega = I_k\boldsymbol\omega\). No torque is needed to keep the axis fixed (dynamic balance).'
          ar: 'المحاور الرئيسية أشعة ذاتية لموتر العطالة: \(\mathsf{I}\boldsymbol\omega = I_k\boldsymbol\omega\). فلا حاجة إلى عزم لتثبيت المحور (توازن ديناميكي).'
      - q:
          en: For torque-free rotation of a body with three different principal moments, rotation about the axis of intermediate moment is
          ar: في الدوران الحر دون عزم لجسم له ثلاثة عزوم رئيسية مختلفة، يكون الدوران حول محور العزم المتوسط
        options:
          - en: stable
            ar: مستقرًا
          - en: unstable
            ar: غير مستقر
          - en: impossible
            ar: مستحيلًا
          - en: stable only if the body is symmetric
            ar: مستقرًا فقط إذا كان الجسم متناظرًا
        answer: 1
        explain:
          en: 'Linearising Euler''s equations gives exponential growth of perturbations for the intermediate axis and bounded oscillations for the largest and smallest — the "tennis-racket" (Dzhanibekov) effect.'
          ar: 'بجعل معادلات أويلر خطية نجد نموًا أُسيًا للاضطرابات حول المحور المتوسط، واهتزازات محدودة حول المحورين الأكبر والأصغر — وهو أثر «مضرب التنس» (أثر جانيبيكوف).'
  - title: { en: Variational principles and Lagrangian mechanics, ar: المبادئ التغايرية وميكانيكا لاغرانج }
    questions:
      - q:
          en: The functional \(J = \int f(y, y', x)\,\dd x\) is stationary when
          ar: تكون الدالية \(J = \int f(y, y', x)\,\dd x\) مستقرة عندما
        options:
          - '\(\pdv{f}{y} - \dv{}{x}\pdv{f}{y''} = 0\)'
          - '\(\pdv{f}{y} + \pdv{f}{y''} = 0\)'
          - '\(\dv{f}{x} = 0\)'
          - '\(\pdv{f}{y''} = 0\)'
        answer: 0
        explain:
          en: Varying \(y\to y+\eta\) and integrating by parts (with \(\eta = 0\) at the endpoints) gives the Euler–Lagrange equation. With \(f = L\), \(y = q\), \(x = t\) it becomes Lagrange's equation.
          ar: بتغيير \(y\to y+\eta\) والمكاملة بالتجزئة (مع \(\eta = 0\) عند الطرفين) نحصل على معادلة أويلر–لاغرانج. ومع \(f = L\)، \(y = q\)، \(x = t\) تصبح معادلة لاغرانج.
      - q:
          en: How many generalised coordinates does a planar double pendulum with rigid rods need?
          ar: كم إحداثية معممة يحتاج نواس مزدوج مستوٍ بقضيبين صلبين؟
        options:
          - '1'
          - '4'
          - '6'
          - '2'
        answer: 3
        explain:
          en: Two masses in a plane have 4 Cartesian coordinates, minus 2 constraints (fixed rod lengths) = 2 degrees of freedom, e.g. the two angles.
          ar: لكتلتين في مستوٍ 4 إحداثيات ديكارتية، ناقص قيدين (طولا القضيبين ثابتان) = درجتا حرية، مثل الزاويتين.
      - q:
          en: If the Lagrangian does not depend on a coordinate \(q_k\) (cyclic coordinate), then
          ar: إذا كانت دالة لاغرانج لا تتعلق بإحداثية \(q_k\) (إحداثية دورية)، فإن
        options:
          - '\(\dot q_k = 0\)'
          - en: '\(p_k = \partial L/\partial\dot q_k\) is conserved'
            ar: '\(p_k = \partial L/\partial\dot q_k\) منحفظة'
          - en: the energy is not conserved
            ar: الطاقة غير منحفظة
          - '\(q_k = 0\)'
        answer: 1
        explain:
          en: 'Lagrange''s equation reduces to \(\dd p_k/\dd t = \partial L/\partial q_k = 0\). Example: the azimuthal angle of a central-force problem gives conservation of angular momentum.'
          ar: 'تؤول معادلة لاغرانج إلى \(\dd p_k/\dd t = \partial L/\partial q_k = 0\). مثال: الزاوية السمتية في مسألة القوة المركزية تعطي انحفاظ العزم الحركي.'
      - q:
          en: For a free particle in plane polar coordinates, \(L = \tfrac12m(\dot r^2 + r^2\dot\theta^2)\). The momentum conjugate to \(\theta\) is
          ar: من أجل جسيم حر بالإحداثيات القطبية المستوية \(L = \tfrac12m(\dot r^2 + r^2\dot\theta^2)\). كمية الحركة المرافقة لـ \(\theta\) هي
        options:
          - '\(m\dot\theta\)'
          - '\(mr\dot\theta\)'
          - '\(mr^2\dot\theta\)'
          - '\(m\dot r\)'
        answer: 2
        explain:
          en: '\(p_\theta = \partial L/\partial\dot\theta = mr^2\dot\theta\), the angular momentum. Generalised momenta need not have the dimensions of linear momentum.'
          ar: '\(p_\theta = \partial L/\partial\dot\theta = mr^2\dot\theta\)، وهو العزم الحركي. ولا يُشترط أن تكون لكميات الحركة المعممة أبعاد كمية الحركة الخطية.'
      - q:
          en: If \(L\) has no explicit time dependence, which quantity is conserved?
          ar: إذا كانت \(L\) لا تتعلق بالزمن صراحة، فما المقدار المنحفظ؟
        options:
          - en: '\(L\) itself'
            ar: '\(L\) نفسها'
          - '\(\sum_k q_k\,\partial L/\partial q_k\)'
          - en: the action
            ar: الفعل
          - '\(h = \sum_k\dot q_k\,\partial L/\partial\dot q_k - L\)'
        answer: 3
        explain:
          en: '\(\dd h/\dd t = -\partial L/\partial t = 0\). \(h\) equals the total energy \(T+U\) when the constraints are time-independent; for a driven system (e.g. a rotating hoop) it differs from \(T+U\).'
          ar: '\(\dd h/\dd t = -\partial L/\partial t = 0\). وتساوي \(h\) الطاقة الكلية \(T+U\) إذا كانت القيود مستقلة عن الزمن؛ أما في جملة مُدارة (كالحلقة الدوّارة) فتختلف عن \(T+U\).'
  - title: { en: Hamiltonian mechanics and small oscillations, ar: ميكانيكا هاملتون والاهتزازات الصغيرة }
    questions:
      - q:
          en: 'Hamilton''s canonical equations are:'
          ar: 'معادلات هاملتون القانونية هي:'
        options:
          - '\(\dot q = -\partial H/\partial p,\ \dot p = \partial H/\partial q\)'
          - '\(\dot q = \partial H/\partial p,\ \dot p = -\partial H/\partial q\)'
          - '\(\dot q = \partial H/\partial q,\ \dot p = \partial H/\partial p\)'
          - en: '\(\dot q = p/m,\ \dot p = 0\) always'
            ar: '\(\dot q = p/m,\ \dot p = 0\) دائمًا'
        answer: 1
        explain:
          en: 'Check with \(H = p^2/2m + U(q)\): \(\dot q = p/m\) and \(\dot p = -U''(q)\), i.e. Newton''s law.'
          ar: 'للتحقق خذ \(H = p^2/2m + U(q)\): \(\dot q = p/m\) و\(\dot p = -U''(q)\)، أي قانون نيوتن.'
      - q:
          en: In phase space \((q, p)\), the trajectories of a one-dimensional harmonic oscillator are
          ar: في فضاء الطور \((q, p)\)، تكون مسارات الهزاز التوافقي أحادي البعد
        options:
          - en: straight lines
            ar: مستقيمات
          - en: parabolas
            ar: قطوعًا مكافئة
          - en: ellipses
            ar: قطوعًا ناقصة
          - en: spirals towards the origin
            ar: حلزونات نحو المبدأ
        answer: 2
        explain:
          en: '\(H = p^2/2m + \tfrac12kq^2 = E\) is an ellipse. Spirals appear only with damping; for the pendulum, closed curves near the bottom become open curves beyond the separatrix.'
          ar: '\(H = p^2/2m + \tfrac12kq^2 = E\) معادلة قطع ناقص. ولا تظهر الحلزونات إلا مع التخامد؛ وفي النواس تتحول المنحنيات المغلقة قرب الوضع السفلي إلى منحنيات مفتوحة وراء الفاصل.'
      - q:
          en: An equilibrium of a conservative system is stable when the potential energy there is
          ar: يكون توازن جملة محافظة مستقرًا عندما تكون الطاقة الكامنة عنده
        options:
          - en: a local minimum
            ar: قيمة صغرى محلية
          - en: a local maximum
            ar: قيمة عظمى محلية
          - en: equal to zero
            ar: معدومة
          - en: a saddle point
            ar: نقطة سرج
        answer: 0
        explain:
          en: A positive-definite matrix of second derivatives gives real normal frequencies and bounded oscillations; a maximum or saddle gives exponentially growing modes.
          ar: مصفوفة مشتقات ثانية موجبة التحديد تعطي تواترات ذاتية حقيقية واهتزازات محدودة؛ أما القيمة العظمى أو نقطة السرج فتعطي أنماطًا تنمو أُسيًا.
      - q:
          en: A linear triatomic molecule is modelled as three masses joined by two springs, moving along the axis only. How many of its normal modes have zero frequency?
          ar: تُنمذَج جزيئة ثلاثية الذرات خطية بثلاث كتل يربطها نابضان، وتتحرك على المحور فقط. كم نمطًا ذاتيًا منها تواتره معدوم؟
        options:
          - '0'
          - '2'
          - '3'
          - '1'
        answer: 3
        explain:
          en: Three degrees of freedom give three modes. Uniform translation of the whole molecule costs no potential energy (zero frequency); the other two are the symmetric and antisymmetric stretches.
          ar: ثلاث درجات حرية تعطي ثلاثة أنماط. الانسحاب المنتظم للجزيئة كلها لا يكلّف طاقة كامنة (تواتر معدوم)؛ والنمطان الآخران هما التمدد المتناظر والتمدد غير المتناظر.
      - q:
          en: In the continuum limit of a loaded string (N beads, spacing \(a\), tension \(T\)), the beads' equations become
          ar: في نهاية الوسط المستمر لوتر محمَّل (N خرزة، تباعد \(a\)، توتر \(T\))، تصبح معادلات الخرزات
        options:
          - en: Laplace's equation
            ar: معادلة لابلاس
          - en: the heat equation
            ar: معادلة الحرارة
          - en: the wave equation with v² = T/μ
            ar: معادلة الموجة مع v² = T/μ
          - en: Euler's equations
            ar: معادلات أويلر
        answer: 2
        explain:
          en: 'The coupling term \(T(y_{j+1} - 2y_j + y_{j-1})/a\) becomes \(Ta\,\partial_x^2y\), and with \(m = \mu a\) one obtains \(\mu\,\partial_t^2y = T\,\partial_x^2y\).'
          ar: 'يصبح حد التقارن \(T(y_{j+1} - 2y_j + y_{j-1})/a\) مساويًا \(Ta\,\partial_x^2y\)، ومع \(m = \mu a\) نحصل على \(\mu\,\partial_t^2y = T\,\partial_x^2y\).'


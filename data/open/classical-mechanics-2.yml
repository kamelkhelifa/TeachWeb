prerequisite_note:
  en: Newtonian mechanics of a particle (Classical Mechanics I level, including central forces and non-inertial frames); ordinary differential equations; linear algebra (matrices, eigenvalues); multivariable calculus.
  ar: ميكانيكا نيوتن للنقطة المادية (مستوى الميكانيكا الكلاسيكية 1، بما فيها القوى المركزية والمراجع غير العطالية)؛ المعادلات التفاضلية العادية؛ الجبر الخطي (المصفوفات والقيم الذاتية)؛ حساب التفاضل والتكامل لعدة متغيرات.
sims: [phase-space, oscillator]
sources:

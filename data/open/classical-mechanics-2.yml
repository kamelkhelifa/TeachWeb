glossary:
  - { en: Centre of mass, ar: مركز الكتلة, fr: Centre de masse, def: { en: Mass-weighted average position of a system; it moves as if all external forces acted on the total mass there., ar: الموضع المتوسط المرجَّح بالكتل؛ يتحرك كأن كل القوى الخارجية تؤثر على الكتلة الكلية المجمعة فيه. } }
  - { en: Reduced mass, ar: الكتلة المختزلة, fr: Masse réduite, def: { en: 'The mass \(\mu = m_1m_2/(m_1+m_2)\) governing the relative motion of two bodies.', ar: 'الكتلة \(\mu = m_1m_2/(m_1+m_2)\) التي تحكم الحركة النسبية لجسمين.' } }
  - { en: Coefficient of restitution, ar: معامل الارتداد, fr: Coefficient de restitution, def: { en: Ratio of relative speeds after and before a collision., ar: نسبة السرعتين النسبيتين بعد التصادم وقبله. } }
  - { en: Impulse, ar: الدفع, fr: Impulsion (percussion), def: { en: Time integral of a force; equals the change in momentum., ar: التكامل الزمني للقوة؛ يساوي التغير في كمية الحركة. } }
  - { en: Rigid body, ar: الجسم الصلب, fr: Solide indéformable, def: { en: A body whose inter-particle distances stay fixed., ar: جسم تبقى المسافات بين جسيماته ثابتة. } }
  - { en: Moment of inertia, ar: عزم العطالة, fr: Moment d'inertie, def: { en: 'Rotational inertia about an axis, \(I = \sum m_i d_i^2\).', ar: 'العطالة الدورانية حول محور، \(I = \sum m_i d_i^2\).' } }
  - { en: Parallel-axis theorem, ar: نظرية المحاور المتوازية (هويغنز–شتاينر), fr: Théorème de Huygens, def: { en: '\(I = I_{\text{cm}} + Md^2\) for parallel axes a distance \(d\) apart.', ar: '\(I = I_{\text{cm}} + Md^2\) لمحورين متوازيين البعد بينهما \(d\).' } }
  - { en: Physical pendulum, ar: النواس الفيزيائي (المركب), fr: Pendule pesant, def: { en: A rigid body oscillating about a fixed horizontal axis under gravity., ar: جسم صلب يهتز حول محور أفقي ثابت تحت تأثير الثقالة. } }
  - { en: Rolling without slipping, ar: الدحرجة دون انزلاق, fr: Roulement sans glissement, def: { en: 'Motion with zero velocity at the contact point: \(v_{\text{cm}} = R\omega\).', ar: 'حركة تنعدم فيها السرعة عند نقطة التماس: \(v_{\text{cm}} = R\omega\).' } }
  - { en: Inertia tensor, ar: موتر العطالة, fr: Tenseur d'inertie, def: { en: 'Symmetric matrix linking angular velocity to angular momentum, \(\vb{L} = \mathsf{I}\boldsymbol\omega\).', ar: 'مصفوفة متناظرة تربط السرعة الزاوية بالعزم الحركي، \(\vb{L} = \mathsf{I}\boldsymbol\omega\).' } }
  - { en: Principal axes, ar: المحاور الرئيسية, fr: Axes principaux d'inertie, def: { en: Axes in which the inertia tensor is diagonal; L is parallel to ω along them., ar: محاور يكون فيها موتر العطالة قطريًا؛ ويوازي L عندها ω. } }
  - { en: Euler's equations, ar: معادلات أويلر, fr: Équations d'Euler, def: { en: Equations of rotational motion of a rigid body written in its principal-axis frame., ar: معادلات الحركة الدورانية لجسم صلب مكتوبة في مرجع محاوره الرئيسية. } }
  - { en: Euler angles, ar: زوايا أويلر, fr: Angles d'Euler, def: { en: Three angles specifying the orientation of a rigid body., ar: ثلاث زوايا تحدد توجّه جسم صلب. } }
  - { en: Precession, ar: المبادرة (الحركة البدارية), fr: Précession, def: { en: Slow rotation of the spin axis of a top or gyroscope about the vertical., ar: دوران بطيء لمحور دوران الخذروف أو الجيروسكوب حول الشاقول. } }
  - { en: Nutation, ar: الترنّح, fr: Nutation, def: { en: Nodding oscillation of the axis of a top superposed on its precession., ar: تأرجح محور الخذروف صعودًا ونزولًا متراكبًا مع حركة المبادرة. } }
  - { en: Coriolis force, ar: قوة كوريوليس, fr: Force de Coriolis, def: { en: 'Inertial force \(-2m\boldsymbol\omega\times\vb{v}''\) felt by a body moving in a rotating frame.', ar: 'قوة عطالية \(-2m\boldsymbol\omega\times\vb{v}''\) يخضع لها جسم يتحرك في مرجع دوّار.' } }
  - { en: Functional, ar: الدالية (الدالة التابعية), fr: Fonctionnelle, def: { en: A map that assigns a number to a whole function (e.g. the action)., ar: تطبيق يقرن عددًا بدالة كاملة (مثل الفعل). } }
  - { en: Euler–Lagrange equation, ar: معادلة أويلر–لاغرانج, fr: Équation d'Euler-Lagrange, def: { en: Condition for a functional to be stationary., ar: شرط استقرار دالية. } }
  - { en: Action, ar: الفعل, fr: Action, def: { en: 'Time integral of the Lagrangian, \(S = \int L\,\dd t\).', ar: 'التكامل الزمني لدالة لاغرانج، \(S = \int L\,\dd t\).' } }
  - { en: Hamilton's principle, ar: مبدأ هاملتون, fr: Principe de Hamilton, def: { en: The actual motion makes the action stationary., ar: الحركة الفعلية تجعل الفعل مستقرًا. } }
  - { en: Generalised coordinates, ar: الإحداثيات المعممة, fr: Coordonnées généralisées, def: { en: Independent variables that specify the configuration and respect the constraints., ar: متغيرات مستقلة تحدد هيئة الجملة وتحترم القيود. } }
  - { en: Constraint, ar: القيد (الرابط), fr: Liaison, def: { en: A geometric or kinematic condition restricting the motion., ar: شرط هندسي أو حركي يحدّ من الحركة. } }
  - { en: Lagrange multiplier, ar: مضاعف لاغرانج, fr: Multiplicateur de Lagrange, def: { en: Auxiliary variable that enforces a constraint and yields the constraint force., ar: متغير مساعد يفرض القيد ويعطي قوة القيد. } }
  - { en: Cyclic coordinate, ar: الإحداثية الدورية (المهملة), fr: Coordonnée cyclique, def: { en: A coordinate absent from the Lagrangian; its conjugate momentum is conserved., ar: إحداثية غائبة عن دالة لاغرانج؛ وكمية الحركة المرافقة لها منحفظة. } }
  - { en: Generalised momentum, ar: كمية الحركة المعممة (المرافقة), fr: Moment conjugué, def: { en: '\(p_k = \partial L/\partial\dot q_k\).', ar: '\(p_k = \partial L/\partial\dot q_k\).' } }
  - { en: Hamiltonian, ar: دالة هاملتون (الهاملتوني), fr: Hamiltonien, def: { en: 'Legendre transform of the Lagrangian, \(H = \sum p_k\dot q_k - L\); usually the total energy.', ar: 'تحويل لوجاندر لدالة لاغرانج، \(H = \sum p_k\dot q_k - L\)؛ وهي عادة الطاقة الكلية.' } }
  - { en: Phase space, ar: فضاء الطور, fr: Espace des phases, def: { en: The space of all coordinates and momenta; each state is one point., ar: فضاء كل الإحداثيات وكميات الحركة؛ تمثَّل كل حالة بنقطة. } }
  - { en: Normal coordinates, ar: الإحداثيات الطبيعية, fr: Coordonnées normales, def: { en: Coordinates in which small oscillations decouple into independent harmonic oscillators., ar: إحداثيات تنفصل فيها الاهتزازات الصغيرة إلى هزازات توافقية مستقلة. } }
  - { en: Effective potential, ar: الكمون الفعّال, fr: Potentiel effectif, def: { en: 'Radial potential \(U(r) + \ell^2/2mr^2\) including the centrifugal barrier.', ar: 'الكمون القطري \(U(r) + \ell^2/2mr^2\) شاملًا الحاجز النابذ.' } }

notes: >
  Single source page (English, with Arabic translation). Kept: textbook (Fowles & Cassiday) and its chapter
  structure (Ch. 7–10 listed in the source, Ch. 11 named in the description), the five source learning outcomes
  (merged into CLO1–CLO2), the two lecture-note PDFs, three problem sets, the formula table, and the quiz/midterm
  papers with solutions. The marks spreadsheet link and the course-evaluation Google Form were not kept. The source
  evaluation was 2 quizzes (10%) + 2 midterms (50%) + final (40%); homework and a small computational project were
  added and the weights rebalanced (proposal). Weeks 9–14 (calculus of variations, Lagrangian and Hamiltonian
  mechanics, small oscillations, continuous systems) were only listed by title in the source and are reconstructed;
  section numbers refer to Fowles & Cassiday 7th ed. and should be checked. The source page shows no lab content,
  so lab hours are 0. Quizzes, problems and glossary are new.

description:
  en: |
    <p>This course takes mechanics from single particles to extended bodies and from forces to energies. The first part treats systems of particles — centre of mass, the two-body problem and reduced mass, collisions and rocket motion — and then rigid bodies: moments of inertia, the physical pendulum, rolling and impulsive motion in a plane, and finally fully three-dimensional rotation with the inertia tensor, principal axes, Euler's equations, the gyroscope and the spinning top.</p>
    <p>The second part reformulates mechanics. The calculus of variations leads to Hamilton's principle of stationary action and to Lagrange's equations in generalised coordinates, which handle constraints effortlessly and reveal the link between symmetries and conservation laws. The Hamiltonian formulation then describes motion as a flow in phase space — the language of statistical and quantum mechanics.</p>
    <p>The course closes with small oscillations of systems with many degrees of freedom — normal modes and normal coordinates — and the passage to continuous systems and the wave equation. Interactive phase-space and oscillator simulations accompany the lectures, and a short computational project trains students to test analytic results numerically.</p>
  ar: |
    <p>ينقل هذا المقرر الميكانيكا من النقطة المادية إلى الأجسام الممتدة، ومن القوى إلى الطاقات. يتناول الجزء الأول جمل الجسيمات — مركز الكتلة، ومسألة الجسمين والكتلة المختزلة، والتصادمات، وحركة الصاروخ — ثم الأجسام الصلبة: عزوم العطالة، والنواس الفيزيائي، والدحرجة والحركة الدفعية في المستوي، وأخيرًا الدوران في ثلاثة أبعاد بموتر العطالة والمحاور الرئيسية ومعادلات أويلر والجيروسكوب والخذروف.</p>
    <p>ويعيد الجزء الثاني صياغة الميكانيكا. فحساب التغيرات يقود إلى مبدأ هاملتون للفعل المستقر وإلى معادلات لاغرانج بالإحداثيات المعممة، التي تعالج القيود بسهولة وتكشف الصلة بين التناظرات وقوانين الانحفاظ. ثم تصف صياغة هاملتون الحركة كتدفق في فضاء الطور — وهي لغة الميكانيكا الإحصائية وميكانيكا الكم.</p>
    <p>ويُختتم المقرر بالاهتزازات الصغيرة للجمل ذات درجات الحرية المتعددة — الأنماط الذاتية والإحداثيات الطبيعية — والانتقال إلى الجمل المستمرة ومعادلة الموجة. وترافق المحاضراتِ محاكاةٌ تفاعلية لفضاء الطور وللهزاز، ويُدرّب مشروع حسابي قصير الطلبةَ على اختبار النتائج التحليلية عدديًا.</p>


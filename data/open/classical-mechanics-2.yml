outcomes:
  - id: CLO1
    bloom: apply
    domain: knowledge
    text:
      en: Apply the laws of motion and conservation of momentum, angular momentum and energy to systems of particles, the two-body problem, collisions and variable-mass systems.
      ar: يطبّق قوانين الحركة وانحفاظ كمية الحركة والعزم الحركي والطاقة على جمل الجسيمات ومسألة الجسمين والتصادمات والجمل ذات الكتلة المتغيرة.
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: Compute centres of mass and moments of inertia of rigid bodies and analyse their rotation about a fixed axis and their plane (laminar) motion, including rolling and impulsive collisions.
      ar: يحسب مراكز الكتلة وعزوم العطالة للأجسام الصلبة ويحلّل دورانها حول محور ثابت وحركتها المستوية، بما في ذلك الدحرجة والتصادمات الدفعية.
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO3
    bloom: analyze
    domain: knowledge
    text:
      en: Construct the inertia tensor, find principal axes, and use Euler's equations to analyse free rotation, gyroscopes and the heavy symmetric top.
      ar: يبني موتر العطالة ويحدد المحاور الرئيسية، ويستعمل معادلات أويلر لتحليل الدوران الحر والجيروسكوبات والخذروف الثقيل المتناظر.
    assessed_by: [homework, midterm2, final]
  - id: CLO4
    bloom: apply
    domain: skills
    text:
      en: Use the calculus of variations and Hamilton's principle to derive Lagrange's equations for constrained systems in generalised coordinates, and identify cyclic coordinates and conserved quantities.
      ar: يستعمل حساب التغيرات ومبدأ هاملتون لاستنتاج معادلات لاغرانج للجمل المقيدة بالإحداثيات المعممة، ويحدد الإحداثيات الدورية والمقادير المنحفظة.
    assessed_by: [quizzes, homework, midterm2, final]
  - id: CLO5
    bloom: apply
    domain: knowledge
    text:
      en: Construct the Hamiltonian of a system, write Hamilton's equations and interpret motion as trajectories in phase space.
      ar: يبني دالة هاملتون لجملة ويكتب معادلات هاملتون ويفسّر الحركة كمسارات في فضاء الطور.
    assessed_by: [homework, project, final]
  - id: CLO6
    bloom: analyze
    domain: skills
    text:
      en: Linearise a system about stable equilibrium, determine its normal frequencies, mode shapes and normal coordinates, and take the continuum limit leading to the wave equation.
      ar: يحوّل جملة إلى الشكل الخطي حول توازن مستقر، ويحدد تواتراتها الذاتية وأشكال أنماطها وإحداثياتها الطبيعية، ويأخذ نهاية الوسط المستمر التي تقود إلى معادلة الموجة.
    assessed_by: [homework, final]
  - id: CLO7
    bloom: create
    domain: skills
    text:
      en: Build a short numerical simulation of a mechanical system (e.g. a double pendulum or a top) and use it to test analytic predictions such as conservation laws and small-oscillation frequencies.
      ar: يُنشئ محاكاة عددية قصيرة لجملة ميكانيكية (مثل النواس المزدوج أو الخذروف) ويستعملها لاختبار التنبؤات التحليلية كقوانين الانحفاظ وتواترات الاهتزازات الصغيرة.
    assessed_by: [project]
  - id: CLO8
    bloom: evaluate
    domain: values
    text:
      en: Present complete, honest and well-justified solutions, critically checking results against limiting cases, dimensions and symmetry.
      ar: يقدّم حلولًا كاملة وأمينة ومبرَّرة، ويتحقق من نتائجه بنظرة نقدية عبر الحالات الحدية والأبعاد والتناظر.
    assessed_by: [homework, project]

assessment:
  - id: quizzes
    type: quiz
    weight: 10
    title: { en: Quizzes, ar: اختبارات قصيرة }
    detail:
      en: Two 20-minute in-class quizzes (one short problem each) on the material of the preceding weeks; papers and solutions of earlier quizzes are available under Exams.
      ar: اختباران قصيران في القاعة مدة كل منهما 20 دقيقة (مسألة قصيرة واحدة لكل منهما) حول محتوى الأسابيع السابقة؛ وتتوفر أوراق الاختبارات السابقة وحلولها في قسم الاختبارات.
    when: { en: Weeks 5 and 10, ar: الأسبوعان 5 و10 }
  - id: homework
    type: homework
    weight: 10
    title: { en: Problem sets, ar: سلاسل المسائل }
    detail:
      en: One problem set per chapter, due one week after release; graded on the physical setup, correctness of the derivation and the final checks (units, limits).
      ar: سلسلة مسائل لكل فصل تُسلَّم بعد أسبوع من نشرها؛ تُقيَّم على صياغة المسألة فيزيائيًا وصحة الاستنتاج والتحققات النهائية (الوحدات والحالات الحدية).
    when: { en: Weeks 2–13, ar: الأسابيع 2–13 }
  - id: midterm1
    type: midterm
    weight: 20
    title: { en: Midterm exam 1, ar: الاختبار النصفي 1 }
    detail:
      en: 'Written, 1 h 30 min: systems of particles and plane motion of rigid bodies.'
      ar: 'كتابي، مدته ساعة ونصف: جمل الجسيمات والحركة المستوية للأجسام الصلبة.'
    when: { en: Week 7, ar: الأسبوع 7 }
  - id: midterm2
    type: midterm
    weight: 20
    title: { en: Midterm exam 2, ar: الاختبار النصفي 2 }
    detail:
      en: 'Written, 1 h 30 min: rigid bodies in three dimensions, calculus of variations and Lagrangian mechanics.'
      ar: 'كتابي، مدته ساعة ونصف: الأجسام الصلبة في ثلاثة أبعاد، وحساب التغيرات، وميكانيكا لاغرانج.'
    when: { en: Week 12, ar: الأسبوع 12 }
  - id: project
    type: project
    weight: 5
    title: { en: Computational mini-project, ar: مشروع حسابي مصغر }
    detail:
      en: Individually or in pairs, integrate the equations of motion of a chosen system (double pendulum, heavy top, bead on a rotating hoop…) with a Runge–Kutta method, check energy or momentum conservation, and compare with the analytic small-oscillation result. Two-page report with plots.
      ar: فرديًا أو في ثنائيات، يُكامَل عدديًا نظام معادلات الحركة لجملة مختارة (نواس مزدوج، خذروف ثقيل، خرزة على حلقة دوّارة…) بطريقة رونغه–كوتا، مع التحقق من انحفاظ الطاقة أو كمية الحركة ومقارنة النتائج بنتيجة الاهتزازات الصغيرة التحليلية. تقرير من صفحتين مع منحنيات.
    when: { en: Due week 13, ar: يُسلَّم في الأسبوع 13 }
  - id: final
    type: final
    weight: 35
    title: { en: Final exam, ar: الاختبار النهائي }
    detail:
      en: Written, 2 h, comprehensive, with emphasis on Lagrangian and Hamiltonian mechanics and small oscillations.
      ar: كتابي، مدته ساعتان، شامل، مع تركيز على ميكانيكا لاغرانج وهاملتون والاهتزازات الصغيرة.
    when: { en: Exam period, ar: فترة الاختبارات }

schedule:
  - week: 1
    title: { en: Systems of particles (I), ar: جمل الجسيمات (1) }
    topics:
      en:
        - Centre of mass and linear momentum of a system
        - Angular momentum and kinetic energy of a system; internal and external forces
      ar:
        - مركز الكتلة وكمية الحركة الخطية لجملة
        - العزم الحركي والطاقة الحركية لجملة؛ القوى الداخلية والخارجية
    reading: Fowles & Cassiday §7.1–7.2
  - week: 2
    title: { en: Systems of particles (II), ar: جمل الجسيمات (2) }
    topics:
      en:
        - Motion of two interacting bodies; reduced mass
        - Elastic and inelastic collisions; laboratory and centre-of-mass frames
        - Motion of a body with variable mass — the rocket
      ar:
        - حركة جسمين متفاعلين؛ الكتلة المختزلة
        - التصادمات المرنة وغير المرنة؛ مرجع المخبر ومرجع مركز الكتلة
        - حركة جسم كتلته متغيرة — الصاروخ
    reading: Fowles & Cassiday §7.3–7.7
    activity: { en: Problem set 1 released, ar: نشر السلسلة 1 }
  - week: 3
    title: { en: 'Rigid bodies (I): moment of inertia', ar: 'الأجسام الصلبة (1): عزم العطالة' }
    topics:
      en:
        - Centre of mass of a rigid body
        - Rotation about a fixed axis; moment of inertia
        - Parallel- and perpendicular-axis theorems
      ar:
        - مركز كتلة الجسم الصلب
        - الدوران حول محور ثابت؛ عزم العطالة
        - نظريتا المحاور المتوازية والمحاور المتعامدة
    reading: Fowles & Cassiday §8.1–8.3
  - week: 4
    title: { en: 'Rigid bodies (II): physical pendulum and plane motion', ar: 'الأجسام الصلبة (2): النواس الفيزيائي والحركة المستوية' }
    topics:
      en:
        - The physical pendulum; centre of percussion
        - Angular momentum of a rigid body in laminar motion
        - Rolling with and without slipping
      ar:
        - النواس الفيزيائي؛ مركز الصدم
        - العزم الحركي لجسم صلب في حركة مستوية
        - الدحرجة مع الانزلاق ودونه
    reading: Fowles & Cassiday §8.4–8.6
    activity: { en: Problem set 2 released, ar: نشر السلسلة 2 }
  - week: 5
    title: { en: 'Rigid bodies (III): impulse and collisions', ar: 'الأجسام الصلبة (3): الدفع والتصادمات' }
    topics:
      en:
        - Angular impulse; impulsive motion of rigid bodies
        - Collisions involving rigid bodies
      ar:
        - الدفع الزاوي؛ الحركة الدفعية للأجسام الصلبة
        - التصادمات التي تشمل أجسامًا صلبة
    reading: Fowles & Cassiday §8.7
    activity: { en: Quiz 1, ar: الاختبار القصير 1 }
    milestone: quiz
  - week: 6
    title: { en: 'Rigid bodies in 3D (I): the inertia tensor', ar: 'الأجسام الصلبة في ثلاثة أبعاد (1): موتر العطالة' }
    topics:
      en:
        - Rotation about an arbitrary axis; products of inertia
        - 'The inertia tensor; \(\vb{L} = \mathsf{I}\,\boldsymbol\omega\) and \(T = \tfrac12\boldsymbol\omega\cdot\mathsf{I}\,\boldsymbol\omega\)'
        - Principal axes as an eigenvalue problem
      ar:
        - الدوران حول محور كيفي؛ جداءات العطالة
        - 'موتر العطالة؛ \(\vb{L} = \mathsf{I}\,\boldsymbol\omega\) و\(T = \tfrac12\boldsymbol\omega\cdot\mathsf{I}\,\boldsymbol\omega\)'
        - المحاور الرئيسية كمسألة قيم ذاتية
    reading: Fowles & Cassiday §9.1–9.2
    activity: { en: Problem set 3 released, ar: نشر السلسلة 3 }
  - week: 7
    title: { en: 'Rigid bodies in 3D (II): Euler''s equations', ar: 'الأجسام الصلبة في ثلاثة أبعاد (2): معادلات أويلر' }
    topics:
      en:
        - 'Rotating frames: time derivatives, centrifugal and Coriolis terms (review)'
        - 'Euler''s equations of motion'
        - Torque-free rotation; stability of rotation about principal axes
      ar:
        - 'المراجع الدوّارة: المشتقات الزمنية والحدّان النابذ وكوريوليس (مراجعة)'
        - معادلات أويلر للحركة
        - الدوران الحر دون عزم؛ استقرار الدوران حول المحاور الرئيسية
    reading: Fowles & Cassiday §5.2–5.3, §9.3–9.5
    activity: { en: Midterm exam 1, ar: الاختبار النصفي 1 }
    milestone: midterm
  - week: 8
    title: { en: 'Rigid bodies in 3D (III): tops and gyroscopes', ar: 'الأجسام الصلبة في ثلاثة أبعاد (3): الخذاريف والجيروسكوبات' }
    topics:
      en:
        - Euler angles
        - The heavy symmetric top; precession and nutation
        - The gyroscope and the gyrocompass
      ar:
        - زوايا أويلر
        - الخذروف الثقيل المتناظر؛ المبادرة والترنّح
        - الجيروسكوب والبوصلة الجيروسكوبية
    reading: Fowles & Cassiday §9.6–9.8
  - week: 9
    title: { en: Calculus of variations and Hamilton's principle, ar: حساب التغيرات ومبدأ هاملتون }
    topics:
      en:
        - Functionals and the Euler–Lagrange equation
        - Brachistochrone, geodesics and minimal surfaces
        - 'Hamilton''s principle \(\delta\int L\,\dd t = 0\)'
      ar:
        - الداليات (الدوال التابعية) ومعادلة أويلر–لاغرانج
        - منحني أقصر زمن، والخطوط الجيوديزية، والسطوح الصغرى
        - 'مبدأ هاملتون \(\delta\int L\,\dd t = 0\)'
    reading: Fowles & Cassiday §10.8; Taylor Ch. 6
  - week: 10
    title: { en: Lagrangian mechanics, ar: ميكانيكا لاغرانج }
    topics:
      en:
        - Generalised coordinates and constraints; generalised forces
        - 'Lagrange''s equations'
        - Generalised momenta; cyclic (ignorable) coordinates and conservation laws
      ar:
        - الإحداثيات المعممة والقيود؛ القوى المعممة
        - معادلات لاغرانج
        - كميات الحركة المعممة؛ الإحداثيات الدورية (المهملة) وقوانين الانحفاظ
    reading: Fowles & Cassiday §10.1–10.5
    activity: { en: Quiz 2; problem set 4 released, ar: الاختبار القصير 2؛ نشر السلسلة 4 }
    milestone: quiz
  - week: 11
    title: { en: Applications of Lagrangian mechanics, ar: تطبيقات ميكانيكا لاغرانج }
    topics:
      en:
        - Lagrange multipliers and forces of constraint
        - Central-force motion; effective potential
        - Rotating systems (bead on a rotating hoop); the energy function
      ar:
        - مضاعفات لاغرانج وقوى القيد
        - الحركة تحت تأثير قوة مركزية؛ الكمون الفعّال
        - الجمل الدوّارة (خرزة على حلقة دوّارة)؛ دالة الطاقة
    reading: Fowles & Cassiday §10.4, §10.6; Ch. 6 (review)
  - week: 12
    title: { en: Hamiltonian mechanics, ar: ميكانيكا هاملتون }
    topics:
      en:
        - Legendre transformation; the Hamiltonian function
        - 'Hamilton''s canonical equations'
        - Phase space and phase portraits; conservation of phase-space volume (Liouville)
      ar:
        - تحويل لوجاندر؛ دالة هاملتون
        - معادلات هاملتون القانونية
        - فضاء الطور وصور الطور؛ انحفاظ حجم فضاء الطور (نظرية ليوفيل)
    reading: Fowles & Cassiday §10.9–10.10
    activity: { en: Midterm exam 2, ar: الاختبار النصفي 2 }
    milestone: midterm
  - week: 13
    title: { en: Small oscillations and normal modes, ar: الاهتزازات الصغيرة والأنماط الذاتية }
    topics:
      en:
        - Potential energy and stability of equilibrium
        - Coupled harmonic oscillators; the matrix eigenvalue problem
        - Normal coordinates; general theory of vibrating systems
      ar:
        - الطاقة الكامنة واستقرار التوازن
        - الهزازات التوافقية المتقارنة؛ مسألة القيم الذاتية المصفوفية
        - الإحداثيات الطبيعية؛ النظرية العامة للجمل المهتزة
    reading: Fowles & Cassiday §11.1–11.5
    activity: { en: Computational mini-project due, ar: تسليم المشروع الحسابي المصغر }
    milestone: project
  - week: 14
    title: { en: Continuous systems and review, ar: الجمل المستمرة ومراجعة }
    topics:
      en:
        - The loaded string and its continuum limit
        - The wave equation for a continuous string
        - Course review
      ar:
        - الوتر المحمَّل ونهايته المستمرة
        - معادلة الموجة لوتر مستمر
        - مراجعة المقرر
    reading: Fowles & Cassiday §11.6–11.7
    milestone: review


title: { en: Classical Mechanics II, ar: الميكانيكا الكلاسيكية 2 }
tagline:
  en: Spinning tops, least action and phase space — mechanics beyond Newton's laws.
  ar: الخذاريف ومبدأ الفعل الأصغري وفضاء الطور — الميكانيكا فيما وراء قوانين نيوتن.

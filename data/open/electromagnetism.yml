glossary:
  - { en: Electric field, ar: الحقل (المجال) الكهربائي, fr: Champ électrique, def: { en: Force per unit charge exerted on a test charge., ar: القوة المؤثرة على شحنة اختبار مقسومة على قيمتها. } }
  - { en: Electric potential, ar: الكمون (الجهد) الكهربائي, fr: Potentiel électrique, def: { en: 'Scalar function with \(\vb{E} = -\nabla V\); potential energy per unit charge.', ar: 'دالة سلمية تحقق \(\vb{E} = -\nabla V\)؛ الطاقة الكامنة لوحدة الشحنة.' } }
  - { en: Gradient, ar: التدرج, fr: Gradient, def: { en: Vector pointing in the direction of fastest increase of a scalar field., ar: شعاع يتجه نحو أسرع تزايد لحقل سلمي. } }
  - { en: Divergence, ar: التباعد, fr: Divergence, def: { en: Net outward flux per unit volume of a vector field — its source density., ar: التدفق الصافي الخارج لوحدة الحجم من حقل شعاعي — أي كثافة منابعه. } }
  - { en: Curl, ar: الدوار, fr: Rotationnel, def: { en: Circulation per unit area of a vector field — measures its swirling., ar: الدوران لوحدة المساحة لحقل شعاعي — يقيس دورانيته. } }
  - { en: Dirac delta, ar: دالة (توزيع) ديراك, fr: Distribution de Dirac, def: { en: Distribution that is zero except at one point and has unit integral; models point charges., ar: توزيع منعدم إلا في نقطة واحدة وتكامله يساوي الواحد؛ يُنمذج الشحنات النقطية. } }
  - { en: Gauss's law, ar: قانون (نظرية) غاوس, fr: Théorème de Gauss, def: { en: Flux of E through a closed surface equals enclosed charge over ε₀., ar: تدفق E عبر سطح مغلق يساوي الشحنة المحتواة مقسومة على ε₀. } }
  - { en: Poisson's equation, ar: معادلة بواسون, fr: Équation de Poisson, def: { en: '\(\nabla^2V = -\rho/\varepsilon_0\); reduces to Laplace''s equation where \(\rho = 0\).', ar: '\(\nabla^2V = -\rho/\varepsilon_0\)؛ تؤول إلى معادلة لابلاس حيث \(\rho = 0\).' } }
  - { en: Electric dipole moment, ar: عزم ثنائي القطب الكهربائي, fr: Moment dipolaire électrique, def: { en: '\(\vb{p} = q\vb{d}\) for two opposite charges separated by \(\vb{d}\).', ar: '\(\vb{p} = q\vb{d}\) لشحنتين متعاكستين يفصل بينهما \(\vb{d}\).' } }
  - { en: Polarisation, ar: الاستقطاب, fr: Polarisation, def: { en: Dipole moment per unit volume of a dielectric., ar: عزم ثنائي القطب لوحدة الحجم في عازل. } }
  - { en: Bound charge, ar: الشحنة المقيدة, fr: Charge liée, def: { en: 'Charge due to polarisation: \(\sigma_b = \vb{P}\cdot\hat{\vb{n}}\), \(\rho_b = -\nabla\cdot\vb{P}\).', ar: 'الشحنة الناتجة عن الاستقطاب: \(\sigma_b = \vb{P}\cdot\hat{\vb{n}}\)، \(\rho_b = -\nabla\cdot\vb{P}\).' } }
  - { en: Electric displacement, ar: شعاع الانزياح الكهربائي, fr: Induction (déplacement) électrique, def: { en: '\(\vb{D} = \varepsilon_0\vb{E} + \vb{P}\); its sources are the free charges only.', ar: '\(\vb{D} = \varepsilon_0\vb{E} + \vb{P}\)؛ منابعه الشحنات الحرة فقط.' } }
  - { en: Permittivity, ar: السماحية, fr: Permittivité, def: { en: 'Constant \(\varepsilon = \varepsilon_0\varepsilon_r\) relating D to E in a linear dielectric.', ar: 'الثابت \(\varepsilon = \varepsilon_0\varepsilon_r\) الذي يربط D بـ E في عازل خطي.' } }
  - { en: Lorentz force, ar: قوة لورنتز, fr: Force de Lorentz, def: { en: '\(\vb{F} = q(\vb{E} + \vb{v}\times\vb{B})\).', ar: '\(\vb{F} = q(\vb{E} + \vb{v}\times\vb{B})\).' } }
  - { en: Biot–Savart law, ar: قانون بيو–سافار, fr: Loi de Biot et Savart, def: { en: Gives the magnetic field produced by a steady current element., ar: يعطي الحقل المغناطيسي الناتج عن عنصر تيار مستقر. } }
  - { en: Ampère's law, ar: قانون (نظرية) أمبير, fr: Théorème d'Ampère, def: { en: Circulation of B around a closed loop equals μ₀ times the current through it., ar: دوران B على حلقة مغلقة يساوي μ₀ مضروبًا في التيار المار عبرها. } }
  - { en: Vector potential, ar: الكمون الشعاعي, fr: Potentiel vecteur, def: { en: 'Field \(\vb{A}\) with \(\vb{B} = \nabla\times\vb{A}\).', ar: 'حقل \(\vb{A}\) يحقق \(\vb{B} = \nabla\times\vb{A}\).' } }
  - { en: Magnetisation, ar: التمغنط, fr: Aimantation, def: { en: Magnetic dipole moment per unit volume., ar: عزم ثنائي القطب المغناطيسي لوحدة الحجم. } }
  - { en: Permeability, ar: النفاذية المغناطيسية, fr: Perméabilité, def: { en: 'Constant \(\mu = \mu_0\mu_r\) relating B to H in a linear magnetic medium.', ar: 'الثابت \(\mu = \mu_0\mu_r\) الذي يربط B بـ H في وسط مغناطيسي خطي.' } }
  - { en: Electromotive force (emf), ar: القوة المحركة الكهربائية, fr: Force électromotrice, def: { en: Work per unit charge done around a circuit by the driving force., ar: العمل لوحدة الشحنة الذي تنجزه القوة المحرّكة على طول الدارة. } }
  - { en: Faraday's law, ar: قانون فاراداي, fr: Loi de Faraday, def: { en: 'The induced emf equals minus the rate of change of magnetic flux: \(\mathcal{E} = -\dd\Phi/\dd t\).', ar: 'القوة المحركة المتحرضة تساوي سالب معدل تغيّر التدفق المغناطيسي: \(\mathcal{E} = -\dd\Phi/\dd t\).' } }
  - { en: Lenz's rule, ar: قاعدة لنز, fr: Loi de Lenz, def: { en: The induced current opposes the change of flux that produces it., ar: يعاكس التيار المتحرض تغيّر التدفق الذي سبّبه. } }
  - { en: Self-inductance, ar: الذاتية (المحاثة الذاتية), fr: Inductance propre, def: { en: 'Ratio \(L = \Phi/I\) of the flux through a circuit to its own current.', ar: 'النسبة \(L = \Phi/I\) بين التدفق عبر دارة والتيار المار فيها.' } }
  - { en: Displacement current, ar: تيار الانزياح, fr: Courant de déplacement, def: { en: 'The term \(\varepsilon_0\partial\vb{E}/\partial t\) added by Maxwell to Ampère''s law.', ar: 'الحد \(\varepsilon_0\partial\vb{E}/\partial t\) الذي أضافه ماكسويل إلى قانون أمبير.' } }
  - { en: Maxwell's equations, ar: معادلات ماكسويل, fr: Équations de Maxwell, def: { en: The four equations that govern all classical electromagnetic fields., ar: المعادلات الأربع التي تحكم جميع الحقول الكهرومغناطيسية الكلاسيكية. } }
  - { en: Gauge transformation, ar: تحويل المعايرة, fr: Transformation de jauge, def: { en: Change of the potentials that leaves E and B unchanged., ar: تغيير في الكمونين يترك E وB دون تغيير. } }
  - { en: Poynting vector, ar: شعاع بوينتينغ, fr: Vecteur de Poynting, def: { en: '\(\vb{S} = \vb{E}\times\vb{B}/\mu_0\): energy flux density of the field (W/m²).', ar: '\(\vb{S} = \vb{E}\times\vb{B}/\mu_0\): كثافة تدفق طاقة الحقل (W/m²).' } }
  - { en: Plane wave, ar: الموجة المستوية, fr: Onde plane, def: { en: Wave whose fields are uniform over planes perpendicular to the propagation direction., ar: موجة حقولها منتظمة على المستويات العمودية على اتجاه الانتشار. } }
  - { en: Refractive index, ar: قرينة الانكسار, fr: Indice de réfraction, def: { en: 'Ratio \(n = c/v\) of the speed of light in vacuum to that in the medium.', ar: 'النسبة \(n = c/v\) بين سرعة الضوء في الفراغ وسرعته في الوسط.' } }
  - { en: Skin depth, ar: عمق القشرة (العمق الجلدي), fr: Épaisseur de peau, def: { en: Distance over which a wave amplitude in a conductor falls by a factor e., ar: المسافة التي تنقص عليها سعة الموجة داخل ناقل بمعامل e. } }

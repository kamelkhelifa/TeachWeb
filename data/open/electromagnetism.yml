outcomes:
  - id: CLO1
    bloom: apply
    domain: skills
    text:
      en: Apply gradient, divergence, curl, the Laplacian and the integral theorems of Gauss and Stokes in Cartesian, cylindrical and spherical coordinates.
      ar: يطبّق التدرج والتباعد والدوار واللابلاسي ونظريتي غاوس وستوكس التكامليتين في الإحداثيات الديكارتية والأسطوانية والكروية.
    assessed_by: [quizzes, homework, midterm]
  - id: CLO2
    bloom: apply
    domain: knowledge
    text:
      en: Describe the electric field and potential of static charges and calculate them for simple distributions using Coulomb's law, Gauss's law and the potential.
      ar: يصف الحقل الكهربائي والكمون للشحنات الساكنة ويحسبهما لتوزيعات بسيطة باستعمال قانون كولوم وقانون غاوس والكمون.
    assessed_by: [quizzes, homework, midterm, final]
  - id: CLO3
    bloom: understand
    domain: knowledge
    text:
      en: 'Explain polarisation and magnetisation of matter, bound charges and currents, the fields \(\vb{D}\) and \(\vb{H}\), and the boundary conditions at interfaces.'
      ar: 'يشرح استقطاب المادة وتمغنطها، والشحنات والتيارات المقيدة، والحقلين \(\vb{D}\) و\(\vb{H}\)، والشروط الحدية عند السطوح الفاصلة.'
    assessed_by: [quizzes, homework, final]
  - id: CLO4
    bloom: apply
    domain: skills
    text:
      en: Calculate magnetic fields of steady currents with the Biot–Savart and Ampère laws, and the forces they exert.
      ar: يحسب الحقول المغناطيسية للتيارات المستقرة بقانوني بيو–سافار وأمبير، والقوى التي تؤثر بها.
    assessed_by: [quizzes, homework, midterm, final]
  - id: CLO5
    bloom: apply
    domain: skills
    text:
      en: Describe electromagnetic induction and compute induced emfs, currents, inductances and magnetic energy using the laws of Faraday and Lenz.
      ar: يصف التحريض الكهرومغناطيسي ويحسب القوى المحركة الكهربائية المتحرضة والتيارات والذاتيات والطاقة المغناطيسية باستعمال قانوني فاراداي ولنز.
    assessed_by: [homework, final]
  - id: CLO6
    bloom: understand
    domain: knowledge
    text:
      en: State Maxwell's equations in integral and differential form and explain how each follows from an empirical law, including the role of the displacement current.
      ar: يكتب معادلات ماكسويل بالصيغتين التكاملية والتفاضلية ويشرح كيف تنتج كل منها من قانون تجريبي، بما في ذلك دور تيار الانزياح.
    assessed_by: [quizzes, final, project]
  - id: CLO7
    bloom: analyze
    domain: knowledge
    text:
      en: Derive the properties of plane electromagnetic waves in vacuum from Maxwell's equations and analyse their energy flow, intensity and reflection at normal incidence.
      ar: يستنتج خصائص الأمواج الكهرومغناطيسية المستوية في الفراغ من معادلات ماكسويل ويحلّل تدفق طاقتها وشدتها وانعكاسها عند السقوط الناظمي.
    assessed_by: [homework, final, project]
  - id: CLO8
    bloom: evaluate
    domain: values
    text:
      en: Research and present a real-world application of electromagnetism, judging the validity of the physical models used and citing sources honestly.
      ar: يبحث في تطبيق واقعي للكهرومغناطيسية ويعرضه، مع تقييم صلاحية النماذج الفيزيائية المستعملة والإحالة إلى المصادر بأمانة.
    assessed_by: [project, participation]

assessment:
  - id: quizzes
    type: quiz
    weight: 10
    title: { en: Tutorial tests, ar: اختبارات الأعمال الموجهة }
    detail:
      en: Two 30-minute written tests in tutorial sessions (vector analysis and electrostatics; magnetostatics and induction), each with one or two short problems.
      ar: اختباران كتابيان مدة كل منهما 30 دقيقة في حصص الأعمال الموجهة (التحليل الشعاعي والكهروساكنة؛ المغناطيسية الساكنة والتحريض)، يتضمن كل منهما مسألة أو مسألتين قصيرتين.
    when: { en: Weeks 5 and 11, ar: الأسبوعان 5 و11 }
  - id: homework
    type: homework
    weight: 8
    title: { en: Problem sheets, ar: سلاسل التمارين }
    detail:
      en: Selected exercises from each problem sheet are handed in one week after the tutorial; graded on method, correct use of vector calculus, units and clarity.
      ar: تُسلَّم تمارين مختارة من كل سلسلة بعد أسبوع من حصة الأعمال الموجهة؛ وتُقيَّم على المنهجية والاستعمال الصحيح للتحليل الشعاعي والوحدات والوضوح.
    when: { en: Weeks 2–14, ar: الأسابيع 2–14 }
  - id: midterm
    type: midterm
    weight: 15
    title: { en: Midterm exam, ar: الاختبار النصفي }
    detail:
      en: 'Written, 1 h 30 min: vector analysis, electrostatics in vacuum and dielectrics.'
      ar: 'كتابي، مدته ساعة ونصف: التحليل الشعاعي، والكهروساكنة في الفراغ وفي العوازل.'
    when: { en: Week 8, ar: الأسبوع 8 }
  - id: project
    type: project
    weight: 7
    title: { en: Mini-project and presentation, ar: مشروع مصغر وعرض }
    detail:
      en: In groups of three, students study one application (wireless charging, induction cooking, MRI magnets, microwave ovens, optical fibres, radar…), write a 4-page report with at least one calculation and present it in 10 minutes.
      ar: يدرس الطلبة في مجموعات من ثلاثة تطبيقًا واحدًا (الشحن اللاسلكي، الطهي بالتحريض، مغانط التصوير بالرنين المغناطيسي، أفران الموجات الميكروية، الألياف البصرية، الرادار…)، ويكتبون تقريرًا من 4 صفحات يتضمن حسابًا واحدًا على الأقل، ويعرضونه في 10 دقائق.
    when: { en: Report and talk in week 13, ar: التقرير والعرض في الأسبوع 13 }
  - id: participation
    type: participation
    weight: 5
    title: { en: Attendance and participation, ar: الحضور والمشاركة }
    detail:
      en: Attendance at tutorials and contributions at the board.
      ar: حضور الأعمال الموجهة والمساهمة في حل التمارين على السبورة.
    when: { en: Throughout, ar: طوال الفصل }
  - id: final
    type: final
    weight: 55
    title: { en: Final exam, ar: الاختبار النهائي }
    detail:
      en: Written, 1 h 30 min, comprehensive with emphasis on magnetostatics, induction, Maxwell's equations and electromagnetic waves.
      ar: كتابي، مدته ساعة ونصف، شامل مع تركيز على المغناطيسية الساكنة والتحريض ومعادلات ماكسويل والأمواج الكهرومغناطيسية.
    when: { en: Exam period, ar: فترة الاختبارات }

schedule:
  - week: 1
    title: { en: Vector analysis (I), ar: التحليل الشعاعي (1) }
    topics:
      en:
        - Scalar and vector fields; vector algebra
        - 'The operator \(\nabla\): gradient, divergence, curl, Laplacian'
        - Cylindrical and spherical coordinates
      ar:
        - الحقول السلمية والشعاعية؛ الجبر الشعاعي
        - 'المؤثر \(\nabla\): التدرج والتباعد والدوار واللابلاسي'
        - الإحداثيات الأسطوانية والكروية
    reading: Griffiths §1.1–1.2, §1.4
    activity: { en: Problem sheet 1 released, ar: نشر السلسلة 1 }
  - week: 2
    title: { en: Vector analysis (II), ar: التحليل الشعاعي (2) }
    topics:
      en:
        - Line, surface and volume integrals; fundamental theorems
        - Divergence (Gauss–Ostrogradsky) and Stokes theorems
        - 'The Dirac delta and point charges; \(\nabla\cdot(\hat{\vb{r}}/r^2) = 4\pi\delta^3(\vb{r})\)'
        - Helmholtz theorem; scalar and vector potentials
      ar:
        - التكاملات الخطية والسطحية والحجمية؛ النظريات الأساسية
        - نظريتا التباعد (غاوس–أوستروغرادسكي) وستوكس
        - 'توزيع ديراك والشحنات النقطية؛ \(\nabla\cdot(\hat{\vb{r}}/r^2) = 4\pi\delta^3(\vb{r})\)'
        - نظرية هلمهولتز؛ الكمونات السلمية والشعاعية
    reading: Griffiths §1.3, §1.5–1.6
  - week: 3
    title: { en: 'Electrostatics (I): Coulomb''s law', ar: 'الكهروساكنة (1): قانون كولوم' }
    topics:
      en:
        - Coulomb's law and superposition
        - The electric field of discrete and continuous charge distributions
        - Field lines and flux
      ar:
        - قانون كولوم ومبدأ التراكب
        - الحقل الكهربائي لتوزيعات شحنية متقطعة ومستمرة
        - خطوط الحقل والتدفق
    reading: Griffiths §2.1
    activity: { en: Problem sheet 2 released, ar: نشر السلسلة 2 }
  - week: 4
    title: { en: 'Electrostatics (II): Gauss''s law', ar: 'الكهروساكنة (2): قانون غاوس' }
    topics:
      en:
        - Gauss's law in integral and differential form
        - Using symmetry (spherical, cylindrical, planar)
        - 'Curl of \(\vb{E}\) and the conservative nature of the field'
      ar:
        - قانون غاوس بالصيغتين التكاملية والتفاضلية
        - استغلال التناظر (كروي، أسطواني، مستوٍ)
        - 'دوار \(\vb{E}\) والطبيعة المحافظة للحقل'
    reading: Griffiths §2.2
  - week: 5
    title: { en: 'Electrostatics (III): potential, energy and conductors', ar: 'الكهروساكنة (3): الكمون والطاقة والنواقل' }
    topics:
      en:
        - 'Electric potential; Poisson and Laplace equations'
        - Work and energy in electrostatics
        - Conductors in equilibrium; capacitors; uniqueness and the method of images
      ar:
        - 'الكمون الكهربائي؛ معادلتا بواسون ولابلاس'
        - العمل والطاقة في الكهروساكنة
        - النواقل في حالة التوازن؛ المكثفات؛ نظرية الوحدانية وطريقة الصور
    reading: Griffiths §2.3–2.5, §3.1–3.2
    activity: { en: Tutorial test 1, ar: اختبار الأعمال الموجهة 1 }
    milestone: quiz
  - week: 6
    title: { en: Multipoles and polarisation, ar: متعددات الأقطاب والاستقطاب }
    topics:
      en:
        - Multipole expansion; the electric dipole
        - Dielectrics; induced dipoles; polarisation \(\vb{P}\)
        - Bound surface and volume charges
      ar:
        - النشر متعدد الأقطاب؛ ثنائي القطب الكهربائي
        - العوازل الكهربائية؛ ثنائيات الأقطاب المتحرضة؛ شعاع الاستقطاب \(\vb{P}\)
        - الشحنات المقيدة السطحية والحجمية
    reading: Griffiths §3.4, §4.1–4.2
  - week: 7
    title: { en: Electrostatics in dielectrics, ar: الكهروساكنة في العوازل }
    topics:
      en:
        - 'Electric displacement \(\vb{D} = \varepsilon_0\vb{E} + \vb{P}\); Gauss''s law in matter'
        - Linear dielectrics; susceptibility and permittivity
        - Boundary conditions; energy in dielectric systems
      ar:
        - 'شعاع الانزياح الكهربائي \(\vb{D} = \varepsilon_0\vb{E} + \vb{P}\)؛ قانون غاوس في المادة'
        - العوازل الخطية؛ القابلية الكهربائية والسماحية
        - الشروط الحدية؛ الطاقة في الجمل العازلة
    reading: Griffiths §4.3–4.4
    activity: { en: Mini-project topics assigned, ar: توزيع مواضيع المشاريع المصغرة }
  - week: 8
    title: { en: 'Magnetostatics (I): Lorentz force and Biot–Savart', ar: 'المغناطيسية الساكنة (1): قوة لورنتز وقانون بيو–سافار' }
    topics:
      en:
        - Lorentz force; currents, current density and the continuity equation
        - The Biot–Savart law; field of a wire and of a loop
      ar:
        - قوة لورنتز؛ التيارات وكثافة التيار ومعادلة الاستمرارية
        - قانون بيو–سافار؛ حقل سلك وحقل حلقة
    reading: Griffiths §5.1–5.2
    activity: { en: Midterm exam; problem sheet 3 released, ar: الاختبار النصفي؛ نشر السلسلة 3 }
    milestone: midterm
  - week: 9
    title: { en: 'Magnetostatics (II): Ampère''s law and vector potential', ar: 'المغناطيسية الساكنة (2): قانون أمبير والكمون الشعاعي' }
    topics:
      en:
        - 'Divergence and curl of \(\vb{B}\); Ampère''s law and its applications'
        - 'The magnetic vector potential \(\vb{A}\)'
        - Magnetic dipole; multipole expansion of the vector potential
      ar:
        - 'تباعد \(\vb{B}\) ودواره؛ قانون أمبير وتطبيقاته'
        - 'الكمون الشعاعي المغناطيسي \(\vb{A}\)'
        - ثنائي القطب المغناطيسي؛ النشر متعدد الأقطاب للكمون الشعاعي
    reading: Griffiths §5.3–5.4
  - week: 10
    title: { en: Magnetic fields in matter, ar: الحقول المغناطيسية في المادة }
    topics:
      en:
        - 'Magnetisation \(\vb{M}\); bound currents'
        - 'The auxiliary field \(\vb{H}\); Ampère''s law in matter'
        - Dia-, para- and ferromagnetism; permeability; boundary conditions
      ar:
        - 'التمغنط \(\vb{M}\)؛ التيارات المقيدة'
        - 'الحقل المساعد \(\vb{H}\)؛ قانون أمبير في المادة'
        - 'المغناطيسية المعاكسة والمسايرة والحديدية؛ النفاذية؛ الشروط الحدية'
    reading: Griffiths Ch. 6
  - week: 11
    title: { en: Electromagnetic induction, ar: التحريض الكهرومغناطيسي }
    topics:
      en:
        - Electromotive force; motional emf
        - 'Faraday''s law and Lenz''s rule'
        - Self and mutual inductance; energy in magnetic fields
      ar:
        - القوة المحركة الكهربائية؛ القوة المحركة الحركية
        - قانون فاراداي وقاعدة لنز
        - الذاتية والتحريض المتبادل؛ الطاقة في الحقول المغناطيسية
    reading: Griffiths §7.1–7.2
    activity: { en: Tutorial test 2; problem sheet 4 released, ar: اختبار الأعمال الموجهة 2؛ نشر السلسلة 4 }
    milestone: quiz
  - week: 12
    title: { en: Maxwell's equations, ar: معادلات ماكسويل }
    topics:
      en:
        - Displacement current; Maxwell's equations in vacuum and in matter
        - Integral and differential forms; boundary conditions
        - Scalar and vector potentials; gauge transformations
        - 'Energy conservation: Poynting''s theorem'
      ar:
        - تيار الانزياح؛ معادلات ماكسويل في الفراغ وفي المادة
        - الصيغتان التكاملية والتفاضلية؛ الشروط الحدية
        - الكمونان السلمي والشعاعي؛ تحويلات المعايرة
        - 'انحفاظ الطاقة: نظرية بوينتينغ'
    reading: Griffiths §7.3, §8.1, §10.1
  - week: 13
    title: { en: Electromagnetic waves in vacuum, ar: الأمواج الكهرومغناطيسية في الفراغ }
    topics:
      en:
        - 'Wave equations for \(\vb{E}\) and \(\vb{B}\); \(c = 1/\sqrt{\mu_0\varepsilon_0}\)'
        - Monochromatic plane waves; transversality; polarisation
        - Energy density, Poynting vector, intensity and radiation pressure
      ar:
        - 'معادلتا الموجة لـ \(\vb{E}\) و\(\vb{B}\)؛ \(c = 1/\sqrt{\mu_0\varepsilon_0}\)'
        - الأمواج المستوية أحادية اللون؛ العرضانية؛ الاستقطاب
        - كثافة الطاقة وشعاع بوينتينغ والشدة وضغط الإشعاع
    reading: Griffiths §9.1–9.2
    activity: { en: Mini-project presentations; problem sheet 5 released, ar: عروض المشاريع المصغرة؛ نشر السلسلة 5 }
    milestone: project
  - week: 14
    title: { en: Waves in matter and course review, ar: الأمواج في المادة ومراجعة المقرر }
    topics:
      en:
        - Waves in linear media; refractive index
        - Reflection and transmission at normal incidence; laws of reflection and refraction; Fresnel equations (overview)
        - Waves in conductors and skin depth; introduction to guided waves
        - Review
      ar:
        - الأمواج في الأوساط الخطية؛ قرينة الانكسار
        - الانعكاس والنفاذ عند السقوط الناظمي؛ قانونا الانعكاس والانكسار؛ معادلات فرينل (لمحة)
        - الأمواج في النواقل وعمق القشرة؛ مدخل إلى الأمواج الموجَّهة
        - مراجعة
    reading: Griffiths §9.3–9.5
    activity: { en: Problem sheet 6 (EM in matter), ar: السلسلة 6 (الكهرومغناطيسية في المادة) }
    milestone: review


notes: >
  Merged the English page (mostly empty skeleton) and the richer French page (chapter plan, eight learning
  outcomes, lecture notes, six problem sheets). The French plan put "EM in matter" as a final chapter (three PDFs);
  here dielectrics and magnetic materials are taught right after electrostatics and magnetostatics, so its three
  parts are attached to weeks 6, 10 and 14. Weekly schedule, Griffiths readings, assessment weights (the source only
  gives 33% continuous + 67% exam, with two tutorial tests), mini-project, CLO mapping, quizzes, worked problems and
  glossary are reconstructed. The past paper is labelled "2014" in the source (session year not certain). Credits (4)
  assumed. Instruction languages set to en/fr (all available documents are in French).

description:
  en: |
    <p>This course develops classical electromagnetism as a field theory. It starts with the vector-analysis toolkit — gradient, divergence, curl, the theorems of Gauss and Stokes and the Dirac delta — and uses it to build electrostatics from Coulomb's law: Gauss's law, the electric potential, Poisson's and Laplace's equations, conductors, energy and the multipole expansion.</p>
    <p>Magnetostatics follows the same path from the Lorentz force and the Biot–Savart law to Ampère's law and the vector potential. Both fields are then studied inside matter: polarisation of dielectrics, magnetisation, the auxiliary fields \(\vb{D}\) and \(\vb{H}\), and boundary conditions. Faraday's law of induction and Maxwell's displacement current complete the four Maxwell equations.</p>
    <p>The course ends with the most spectacular consequence of the theory: electromagnetic waves. Students derive the wave equation, the properties of plane waves in vacuum, energy transport by the Poynting vector, and the basics of propagation in matter and reflection at interfaces — the same wave equation already met in Vibrations &amp; Waves, now describing light.</p>
  ar: |
    <p>يُقدّم هذا المقرر الكهرومغناطيسية الكلاسيكية بوصفها نظرية حقول. ويبدأ بالأدوات الرياضية للتحليل الشعاعي — التدرج والتباعد والدوار ونظريتي غاوس وستوكس وتوزيع ديراك — ثم يستعملها لبناء الكهروساكنة انطلاقًا من قانون كولوم: قانون غاوس، والكمون الكهربائي، ومعادلتي بواسون ولابلاس، والنواقل، والطاقة، والنشر متعدد الأقطاب.</p>
    <p>وتسلك المغناطيسية الساكنة الطريق نفسه من قوة لورنتز وقانون بيو–سافار إلى قانون أمبير والكمون الشعاعي. ثم يُدرس الحقلان داخل المادة: استقطاب العوازل، والتمغنط، والحقلان المساعدان \(\vb{D}\) و\(\vb{H}\)، والشروط الحدية. ويكتمل بناء معادلات ماكسويل الأربع بقانون فاراداي للتحريض وتيار الانزياح.</p>
    <p>ويُختتم المقرر بأروع نتائج النظرية: الأمواج الكهرومغناطيسية. يستنتج الطالب معادلة الموجة وخصائص الأمواج المستوية في الفراغ، ونقل الطاقة بشعاع بوينتينغ، وأساسيات الانتشار في المادة والانعكاس عند السطوح الفاصلة — إنها معادلة الموجة نفسها التي صادفها في مقرر الاهتزازات والأمواج، لكنها تصف الآن الضوء.</p>


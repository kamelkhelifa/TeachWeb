glossary:
  - { en: Wavefunction, ar: الدالة الموجية, fr: Fonction d'onde, def: { en: Complex amplitude whose squared modulus gives the probability density of a particle., ar: سعة مركّبة يعطي مربع طويلتها كثافة احتمال وجود الجسيم. } }
  - { en: Born interpretation, ar: تفسير بورن, fr: Interprétation de Born, def: { en: 'Statistical reading of \(|\Psi|^2\) as a probability density.', ar: 'القراءة الإحصائية لـ \(|\Psi|^2\) بوصفها كثافة احتمال.' } }
  - { en: Normalisation, ar: التنظيم (الاستنظام), fr: Normalisation, def: { en: Condition that the total probability of finding the particle somewhere equals one., ar: شرط أن يساوي الاحتمال الكلي لوجود الجسيم في مكان ما واحدًا. } }
  - { en: Wave packet, ar: الحزمة الموجية, fr: Paquet d'ondes, def: { en: Localised superposition of plane waves describing a particle., ar: تراكب متموضع لموجات مستوية يصف جسيمًا. } }
  - { en: Infinite square well, ar: بئر الجهد اللانهائي, fr: Puits de potentiel infini, def: { en: Region of zero potential bounded by infinitely high walls; the 'particle in a box'., ar: منطقة جهدها صفر تحدّها جدران لانهائية الارتفاع؛ «الجسيم في صندوق». } }
  - { en: Zero-point energy, ar: طاقة نقطة الصفر, fr: Énergie de point zéro, def: { en: 'Lowest, non-zero energy of a confined quantum system, e.g. \(\hbar\omega/2\) for the oscillator.', ar: 'أدنى طاقة غير معدومة لنظام كمومي محصور، مثل \(\hbar\omega/2\) للمتذبذب.' } }
  - { en: Expectation value, ar: القيمة المتوقعة, fr: Valeur moyenne, def: { en: Average of many measurements of an observable on identically prepared systems., ar: متوسط قياسات عديدة لمقدار قابل للقياس على أنظمة محضّرة بشكل متطابق. } }
  - { en: Operator, ar: المؤثر, fr: Opérateur, def: { en: Mathematical object acting on wavefunctions that represents an observable., ar: كائن رياضي يؤثر على الدوال الموجية ويمثّل مقدارًا قابلًا للقياس. } }
  - { en: Tunnelling, ar: النفق الكمومي, fr: Effet tunnel, def: { en: Passage of a particle through a classically forbidden barrier., ar: عبور جسيم حاجزًا ممنوعًا كلاسيكيًا. } }
  - { en: Degeneracy, ar: الانحلال, fr: Dégénérescence, def: { en: Several distinct states having the same energy., ar: اشتراك عدة حالات مختلفة في الطاقة نفسها. } }
  - { en: Principal quantum number, ar: العدد الكمومي الرئيسي, fr: Nombre quantique principal, def: { en: 'Integer n that fixes the hydrogen energy \(E_n = -13.6\ \text{eV}/n^2\).', ar: 'العدد الصحيح n الذي يحدد طاقة الهيدروجين \(E_n = -13.6\ \text{eV}/n^2\).' } }
  - { en: Space quantisation, ar: التكميم الفضائي, fr: Quantification spatiale, def: { en: 'Restriction of \(L_z\) to the values \(m_l\hbar\), i.e. discrete orientations of angular momentum.', ar: 'اقتصار \(L_z\) على القيم \(m_l\hbar\)، أي توجهات متقطعة للزخم الزاوي.' } }
  - { en: Radial probability density, ar: كثافة الاحتمال القطرية, fr: Densité de probabilité radiale, def: { en: 'Probability per unit radius, \(P(r) = r^2|R(r)|^2\).', ar: 'الاحتمال لكل وحدة نصف قطر: \(P(r) = r^2|R(r)|^2\).' } }
  - { en: Bohr magneton, ar: مغنطون بور, fr: Magnéton de Bohr, def: { en: '\(\mu_B = e\hbar/2m_e\), the natural unit of atomic magnetic moments.', ar: '\(\mu_B = e\hbar/2m_e\)، الوحدة الطبيعية للعزوم المغناطيسية الذرية.' } }
  - { en: Zeeman effect, ar: ظاهرة زيمان, fr: Effet Zeeman, def: { en: Splitting of spectral lines in a magnetic field., ar: انشطار الخطوط الطيفية في مجال مغناطيسي. } }
  - { en: Electron spin, ar: سبين الإلكترون, fr: Spin de l'électron, def: { en: 'Intrinsic angular momentum \(s = \frac12\) of the electron.', ar: 'الزخم الزاوي الذاتي \(s = \frac12\) للإلكترون.' } }
  - { en: Spin–orbit coupling, ar: الاقتران المغزلي-المداري, fr: Couplage spin-orbite, def: { en: Interaction between the spin and the orbital motion of an electron that produces fine structure., ar: تفاعل بين السبين والحركة المدارية للإلكترون ينتج البنية الدقيقة. } }
  - { en: Pauli exclusion principle, ar: مبدأ الاستبعاد لباولي, fr: Principe d'exclusion de Pauli, def: { en: No two electrons in an atom can have the same set of four quantum numbers., ar: لا يمكن لإلكترونين في ذرة أن يملكا المجموعة نفسها من الأعداد الكمومية الأربعة. } }
  - { en: Moseley's law, ar: قانون موزلي, fr: Loi de Moseley, def: { en: 'Square root of the \(K_\alpha\) frequency is linear in \(Z-1\).', ar: 'الجذر التربيعي لتردد \(K_\alpha\) دالة خطية في \(Z-1\).' } }
  - { en: Fermi energy, ar: طاقة فيرمي, fr: Énergie de Fermi, def: { en: Energy of the highest occupied electron state in a metal at absolute zero., ar: طاقة أعلى حالة إلكترونية مشغولة في معدن عند الصفر المطلق. } }
  - { en: Energy band / band gap, ar: عصابة الطاقة / الفجوة الطاقية, fr: Bande d'énergie / bande interdite, def: { en: Allowed energy ranges of electrons in a crystal and the forbidden range between them., ar: مجالات الطاقة المسموح بها للإلكترونات في البلورة، والمجال الممنوع بينها. } }
  - { en: Semiconductor, ar: شبه الموصل, fr: Semi-conducteur, def: { en: 'Solid with a small band gap (about 1 eV) whose conductivity rises with temperature and doping.', ar: 'جسم صلب ذو فجوة طاقية صغيرة (نحو 1 eV) تزداد ناقليته مع الحرارة والتطعيم.' } }
  - { en: Superconductivity, ar: الموصلية الفائقة, fr: Supraconductivité, def: { en: Zero electrical resistance and expulsion of magnetic field (Meissner effect) below a critical temperature., ar: انعدام المقاومة الكهربائية وطرد المجال المغناطيسي (ظاهرة مايسنر) تحت درجة حرارة حرجة. } }
  - { en: Nucleon, ar: النوكليون, fr: Nucléon, def: { en: A proton or a neutron., ar: بروتون أو نيوترون. } }
  - { en: Binding energy, ar: طاقة الربط, fr: Énergie de liaison, def: { en: Energy needed to separate a nucleus into its free nucleons; equals the mass defect times c²., ar: الطاقة اللازمة لتفكيك النواة إلى نوكليوناتها الحرة؛ وتساوي النقص الكتلي مضروبًا في c². } }
  - { en: Liquid-drop model, ar: نموذج القطرة السائلة, fr: Modèle de la goutte liquide, def: { en: Model treating the nucleus as an incompressible charged drop; basis of the semi-empirical mass formula., ar: نموذج يعامل النواة كقطرة مشحونة غير قابلة للانضغاط؛ وهو أساس صيغة الكتلة شبه التجريبية. } }
  - { en: Shell model, ar: نموذج الطبقات, fr: Modèle en couches, def: { en: 'Model of nucleons in quantised orbits explaining the magic numbers 2, 8, 20, 28, 50, 82, 126.', ar: 'نموذج للنوكليونات في مدارات مكمّاة يفسّر الأعداد السحرية 2، 8، 20، 28، 50، 82، 126.' } }
  - { en: Half-life, ar: عمر النصف, fr: Demi-vie, def: { en: 'Time for half of the nuclei of a sample to decay, \(T_{1/2} = \ln2/\lambda\).', ar: 'الزمن اللازم لاضمحلال نصف أنوية العيّنة: \(T_{1/2} = \ln2/\lambda\).' } }
  - { en: Activity, ar: النشاطية الإشعاعية, fr: Activité, def: { en: 'Number of decays per second, \(A = \lambda N\), measured in becquerel.', ar: 'عدد التفككات في الثانية \(A = \lambda N\)، وتقاس بالبكريل.' } }
  - { en: Alpha / beta / gamma decay, ar: اضمحلال ألفا / بيتا / غاما, fr: Désintégration alpha / bêta / gamma, def: { en: Emission of a helium nucleus / an electron or positron with a (anti)neutrino / a high-energy photon., ar: انبعاث نواة هيليوم / إلكترون أو بوزيترون مع (ضديد) نيوترينو / فوتون عالي الطاقة. } }


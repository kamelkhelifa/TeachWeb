exam_guide:
  format:
    en: Two 20-minute quizzes, two 50-minute mid-term tests (three or four problems each, often with a short conceptual part) and a two-hour comprehensive final with five or six problems. Problems are mostly numerical applications of the course formulas, with short derivations and explanations.
    ar: اختباران قصيران مدة كل منهما 20 دقيقة، واختباران نصفيان مدة كل منهما 50 دقيقة (ثلاث أو أربع مسائل لكل منهما، غالبًا مع جزء مفاهيمي قصير)، واختبار نهائي شامل مدته ساعتان يتضمن خمس أو ست مسائل. المسائل في معظمها تطبيقات عددية لصيغ المقرر، مع اشتقاقات وشروح قصيرة.
  allowed:
    en: A non-programmable scientific calculator. Physical constants and a short table of integrals are given on the paper; no personal notes.
    ar: آلة حاسبة علمية غير قابلة للبرمجة. تُعطى الثوابت الفيزيائية وجدول قصير للتكاملات على ورقة الاختبار؛ ولا يُسمح بالمذكرات الشخصية.
  tips:
    - en: 'Learn the handy combinations: \(hc = 1240\) eV·nm, \(\hbar c = 197.3\) MeV·fm, \(m_ec^2 = 0.511\) MeV, \(1\ \text{u} = 931.5\) MeV/\(c^2\). They save time and errors.'
      ar: 'احفظ التركيبات المفيدة: \(hc = 1240\) eV·nm، \(\hbar c = 197.3\) MeV·fm، \(m_ec^2 = 0.511\) MeV، \(1\ \text{u} = 931.5\) MeV/\(c^2\). فهي توفّر الوقت وتقلّل الأخطاء.'
    - en: Always state which quantum numbers label a state and how many states share an energy — many marks are lost on degeneracies.
      ar: حدِّد دائمًا الأعداد الكمومية التي تميّز الحالة وعدد الحالات التي تشترك في طاقة واحدة؛ فكثير من العلامات تضيع في حساب الانحلال.
    - en: In nuclear problems use atomic masses consistently (the electron masses cancel) and keep at least six significant figures in mass differences.
      ar: في المسائل النووية استعمل الكتل الذرية بشكل متّسق (فكتل الإلكترونات تُختزل)، واحتفظ بستة أرقام معنوية على الأقل في فروق الكتل.
    - en: Re-do the homework problems without looking at the solutions; exam problems closely follow them.
      ar: أعد حل مسائل الواجبات دون النظر إلى الحلول؛ فمسائل الاختبارات قريبة منها جدًا.

problems:
  - title: { en: Electron in a box, ar: إلكترون في صندوق }
    difficulty: 1
    statement:
      en: |
        An electron is confined to a one-dimensional infinite square well of width \(L = 1.00\) nm.
        (a) Find its ground-state energy in eV.
        (b) Find the wavelength of the photon emitted in the transition \(n=2 \to n=1\).
        (c) In the ground state, what is the probability of finding the electron in the middle third of the well, \(L/3 < x < 2L/3\)?
      ar: |
        إلكترون محصور في بئر جهد مربع لانهائي أحادي البعد عرضه \(L = 1.00\) nm.
        (أ) أوجد طاقة حالته الأرضية بالإلكترون-فولط.
        (ب) أوجد طول موجة الفوتون المنبعث في الانتقال \(n=2 \to n=1\).
        (ج) ما احتمال وجود الإلكترون، وهو في حالته الأرضية، في الثلث الأوسط من البئر \(L/3 < x < 2L/3\)؟
    hint:
      en: '\(E_n = n^2h^2/8mL^2\) and \(\psi_n = \sqrt{2/L}\,\sin(n\pi x/L)\). Use \(\sin^2u = \frac12(1-\cos2u)\).'
      ar: '\(E_n = n^2h^2/8mL^2\) و\(\psi_n = \sqrt{2/L}\,\sin(n\pi x/L)\). استعمل \(\sin^2u = \frac12(1-\cos2u)\).'
    solution:
      en: |
        (a) \(E_1 = \dfrac{h^2}{8mL^2} = \dfrac{(6.626\times10^{-34})^2}{8(9.109\times10^{-31})(1.00\times10^{-9})^2} = 6.02\times10^{-20}\ \text{J} = 0.376\ \text{eV}\).
        (b) \(\Delta E = E_2 - E_1 = 3E_1 = 1.13\) eV, so \(\lambda = hc/\Delta E = (1240\ \text{eV·nm})/(1.13\ \text{eV}) \approx 1.10\times10^{3}\) nm (near infrared).
        (c)
        \[ P = \frac{2}{L}\int_{L/3}^{2L/3}\sin^2\frac{\pi x}{L}\,dx = \frac13 - \frac{1}{2\pi}\left[\sin\frac{4\pi}{3}-\sin\frac{2\pi}{3}\right] = \frac13+\frac{\sqrt3}{2\pi} \approx 0.609. \]
        Classically (uniform probability) the answer would be 1/3; the quantum ground state is concentrated near the centre.
      ar: |
        (أ) \(E_1 = \dfrac{h^2}{8mL^2} = \dfrac{(6.626\times10^{-34})^2}{8(9.109\times10^{-31})(1.00\times10^{-9})^2} = 6.02\times10^{-20}\ \text{J} = 0.376\ \text{eV}\).
        (ب) \(\Delta E = E_2 - E_1 = 3E_1 = 1.13\) eV، إذن \(\lambda = hc/\Delta E = (1240\ \text{eV·nm})/(1.13\ \text{eV}) \approx 1.10\times10^{3}\) nm (في المجال تحت الأحمر القريب).
        (ج)
        \[ P = \frac{2}{L}\int_{L/3}^{2L/3}\sin^2\frac{\pi x}{L}\,dx = \frac13 - \frac{1}{2\pi}\left[\sin\frac{4\pi}{3}-\sin\frac{2\pi}{3}\right] = \frac13+\frac{\sqrt3}{2\pi} \approx 0.609. \]
        في الفيزياء الكلاسيكية (احتمال منتظم) يكون الجواب 1/3؛ أما الحالة الأرضية الكمومية فتتركّز قرب المركز.
  - title: { en: 'Where is the electron in hydrogen?', ar: أين يوجد الإلكترون في ذرة الهيدروجين؟ }
    difficulty: 2
    statement:
      en: |
        The ground-state wavefunction of hydrogen is \(\psi_{100} = \frac{1}{\sqrt{\pi a_0^3}}e^{-r/a_0}\).
        (a) Find the radial probability density \(P(r)\) and the most probable distance from the nucleus.
        (b) Find the probability that the electron is found inside a sphere of radius \(a_0\).
      ar: |
        الدالة الموجية للحالة الأرضية لذرة الهيدروجين هي \(\psi_{100} = \frac{1}{\sqrt{\pi a_0^3}}e^{-r/a_0}\).
        (أ) أوجد كثافة الاحتمال القطرية \(P(r)\) والمسافة الأكثر احتمالًا عن النواة.
        (ب) أوجد احتمال وجود الإلكترون داخل كرة نصف قطرها \(a_0\).
    hint:
      en: '\(P(r)\,dr = |\psi|^2\,4\pi r^2\,dr\). For (b) integrate by parts or use \(\int x^2e^{-x}dx = -(x^2+2x+2)e^{-x}\).'
      ar: '\(P(r)\,dr = |\psi|^2\,4\pi r^2\,dr\). في (ب) كامل بالتجزئة أو استعمل \(\int x^2e^{-x}dx = -(x^2+2x+2)e^{-x}\).'
    solution:
      en: |
        (a) \(P(r) = 4\pi r^2|\psi_{100}|^2 = \dfrac{4r^2}{a_0^3}e^{-2r/a_0}\).
        \(\dv{P}{r} = \dfrac{4}{a_0^3}\left(2r - \dfrac{2r^2}{a_0}\right)e^{-2r/a_0} = 0 \Rightarrow r = a_0\): the most probable radius is the Bohr radius.
        (b) With \(x = 2r/a_0\):
        \[ P(r<a_0) = \frac12\int_0^{2}x^2e^{-x}\,dx = \frac12\left[2-(4+4+2)e^{-2}\right] = 1-5e^{-2} \approx 0.323. \]
        Only about one third of the time is the electron closer than \(a_0\); its mean distance is \(\expval{r} = 1.5\,a_0\).
      ar: |
        (أ) \(P(r) = 4\pi r^2|\psi_{100}|^2 = \dfrac{4r^2}{a_0^3}e^{-2r/a_0}\).
        \(\dv{P}{r} = \dfrac{4}{a_0^3}\left(2r - \dfrac{2r^2}{a_0}\right)e^{-2r/a_0} = 0 \Rightarrow r = a_0\): نصف القطر الأكثر احتمالًا هو نصف قطر بور.
        (ب) بوضع \(x = 2r/a_0\):
        \[ P(r<a_0) = \frac12\int_0^{2}x^2e^{-x}\,dx = \frac12\left[2-(4+4+2)e^{-2}\right] = 1-5e^{-2} \approx 0.323. \]
        لا يوجد الإلكترون على مسافة أقل من \(a_0\) إلا في نحو ثلث الوقت؛ ومتوسط بُعده \(\expval{r} = 1.5\,a_0\).
  - title: { en: Normal Zeeman effect on the H-alpha line, ar: ظاهرة زيمان العادية على خط H-ألفا }
    difficulty: 2
    statement:
      en: |
        The red Balmer line of hydrogen (\(3 \to 2\), \(\lambda = 656.3\) nm) is observed in a magnetic field \(B = 1.00\) T. Ignoring electron spin (normal Zeeman effect):
        (a) Into how many components does the line split, and why?
        (b) Find the energy separation and the wavelength separation between adjacent components.
      ar: |
        يُرصد خط بالمر الأحمر للهيدروجين (\(3 \to 2\)، \(\lambda = 656.3\) nm) في مجال مغناطيسي \(B = 1.00\) T. بإهمال سبين الإلكترون (ظاهرة زيمان العادية):
        (أ) إلى كم مركّبة ينشطر الخط، ولماذا؟
        (ب) أوجد الفرق في الطاقة والفرق في طول الموجة بين مركّبتين متجاورتين.
    hint:
      en: 'Each level shifts by \(m_l\mu_BB\) with \(\mu_B = 5.788\times10^{-5}\) eV/T; the selection rule is \(\Delta m_l = 0, \pm1\). Use \(\abs{\Delta\lambda} = \lambda^2\Delta E/hc\).'
      ar: 'ينزاح كل مستوى بمقدار \(m_l\mu_BB\) حيث \(\mu_B = 5.788\times10^{-5}\) eV/T؛ وقاعدة الانتقاء هي \(\Delta m_l = 0, \pm1\). استعمل \(\abs{\Delta\lambda} = \lambda^2\Delta E/hc\).'
    solution:
      en: |
        (a) The photon energy becomes \(h\nu = h\nu_0 + \Delta m_l\,\mu_BB\). Since only \(\Delta m_l = 0,\pm1\) are allowed, the line splits into <strong>three</strong> equally spaced components, whatever the values of \(l\) involved.
        (b) \(\Delta E = \mu_BB = 5.79\times10^{-5}\) eV. Then
        \[ \abs{\Delta\lambda} = \frac{\lambda^2\,\Delta E}{hc} = \frac{(656.3\ \text{nm})^2(5.79\times10^{-5}\ \text{eV})}{1240\ \text{eV·nm}} \approx 2.01\times10^{-2}\ \text{nm}. \]
        The splitting is tiny (0.003 % of \(\lambda\)), which is why a high-resolution spectrometer is needed. With spin included the pattern becomes the more complex anomalous Zeeman effect.
      ar: |
        (أ) تصبح طاقة الفوتون \(h\nu = h\nu_0 + \Delta m_l\,\mu_BB\). وبما أن الانتقالات المسموح بها هي \(\Delta m_l = 0,\pm1\) فقط، ينشطر الخط إلى <strong>ثلاث</strong> مركّبات متساوية التباعد، مهما كانت قيم \(l\) المعنية.
        (ب) \(\Delta E = \mu_BB = 5.79\times10^{-5}\) eV. ومنه
        \[ \abs{\Delta\lambda} = \frac{\lambda^2\,\Delta E}{hc} = \frac{(656.3\ \text{nm})^2(5.79\times10^{-5}\ \text{eV})}{1240\ \text{eV·nm}} \approx 2.01\times10^{-2}\ \text{nm}. \]
        الانشطار ضئيل جدًا (0.003 % من \(\lambda\))، ولذلك نحتاج إلى مطياف عالي الدقة. وعند أخذ السبين في الحسبان يصبح النمط أعقد، وهو ظاهرة زيمان الشاذة.
  - title: { en: Fermi energy of copper, ar: طاقة فيرمي للنحاس }
    difficulty: 2
    statement:
      en: |
        Copper has one conduction electron per atom and a free-electron density \(n = 8.47\times10^{28}\ \text{m}^{-3}\). Using the quantum free-electron model, compute the Fermi energy \(E_F = \frac{\hbar^2}{2m}(3\pi^2n)^{2/3}\) and the Fermi temperature \(T_F = E_F/k_B\). Comment on the result.
      ar: |
        في النحاس إلكترون توصيل واحد لكل ذرة، وكثافة الإلكترونات الحرة \(n = 8.47\times10^{28}\ \text{m}^{-3}\). باستعمال النموذج الكمومي للإلكترون الحر، احسب طاقة فيرمي \(E_F = \frac{\hbar^2}{2m}(3\pi^2n)^{2/3}\) ودرجة حرارة فيرمي \(T_F = E_F/k_B\). علّق على النتيجة.
    hint:
      en: 'Compute \(3\pi^2n\) first, then its \(2/3\) power; \(\hbar^2/2m_e = 6.10\times10^{-39}\ \text{J·m}^2\).'
      ar: 'احسب أولًا \(3\pi^2n\) ثم ارفعه إلى القوة \(2/3\)؛ و\(\hbar^2/2m_e = 6.10\times10^{-39}\ \text{J·m}^2\).'
    solution:
      en: |
        \(3\pi^2n = 29.61\times8.47\times10^{28} = 2.51\times10^{30}\ \text{m}^{-3}\), so \((3\pi^2n)^{2/3} = 1.85\times10^{20}\ \text{m}^{-2}\).
        \[ E_F = (6.10\times10^{-39})(1.85\times10^{20}) = 1.13\times10^{-18}\ \text{J} = 7.04\ \text{eV}. \]
        \[ T_F = \frac{E_F}{k_B} = \frac{7.04\ \text{eV}}{8.617\times10^{-5}\ \text{eV/K}} \approx 8.2\times10^{4}\ \text{K}. \]
        Since \(T_F\) is hundreds of times room temperature, only electrons within about \(k_BT\) of \(E_F\) can be thermally excited. This explains why the electronic heat capacity of metals is far smaller than the classical prediction \(\frac32 k_B\) per electron.
      ar: |
        \(3\pi^2n = 29.61\times8.47\times10^{28} = 2.51\times10^{30}\ \text{m}^{-3}\)، إذن \((3\pi^2n)^{2/3} = 1.85\times10^{20}\ \text{m}^{-2}\).
        \[ E_F = (6.10\times10^{-39})(1.85\times10^{20}) = 1.13\times10^{-18}\ \text{J} = 7.04\ \text{eV}. \]
        \[ T_F = \frac{E_F}{k_B} = \frac{7.04\ \text{eV}}{8.617\times10^{-5}\ \text{eV/K}} \approx 8.2\times10^{4}\ \text{K}. \]
        بما أن \(T_F\) تفوق درجة حرارة الغرفة بمئات المرات، فلا يمكن إثارة إلا الإلكترونات الواقعة في حدود \(k_BT\) تقريبًا من \(E_F\) حراريًا. وهذا يفسّر لماذا تكون السعة الحرارية الإلكترونية للمعادن أصغر بكثير من التوقع الكلاسيكي \(\frac32 k_B\) لكل إلكترون.
  - title: { en: Binding energy of helium-4, ar: طاقة الربط لنواة الهيليوم-4 }
    difficulty: 1
    statement:
      en: |
        Using the atomic masses \(M(^4\text{He}) = 4.002603\) u, \(M(^1\text{H}) = 1.007825\) u and \(m_n = 1.008665\) u, compute the total binding energy of \(^4\text{He}\) and its binding energy per nucleon (\(1\ \text{u} = 931.494\ \text{MeV}/c^2\)).
      ar: |
        باستعمال الكتل الذرية \(M(^4\text{He}) = 4.002603\) u و\(M(^1\text{H}) = 1.007825\) u و\(m_n = 1.008665\) u، احسب طاقة الربط الكلية لنواة \(^4\text{He}\) وطاقة الربط لكل نوكليون (\(1\ \text{u} = 931.494\ \text{MeV}/c^2\)).
    hint:
      en: '\(B = \left[Z\,M(^1\text{H}) + N\,m_n - M(^A\text{X})\right]c^2\); using hydrogen atomic masses makes the electron masses cancel.'
      ar: '\(B = \left[Z\,M(^1\text{H}) + N\,m_n - M(^A\text{X})\right]c^2\)؛ واستعمال الكتل الذرية للهيدروجين يجعل كتل الإلكترونات تُختزل.'
    solution:
      en: |
        \[ \Delta M = 2(1.007825) + 2(1.008665) - 4.002603 = 4.032980 - 4.002603 = 0.030377\ \text{u}. \]
        \[ B = 0.030377 \times 931.494\ \text{MeV} = 28.3\ \text{MeV}, \qquad \frac{B}{A} = \frac{28.3}{4} = 7.07\ \text{MeV per nucleon}. \]
        This is unusually large for such a light nucleus (compare 1.11 MeV for the deuteron), which is why alpha particles are emitted as a unit in heavy-nucleus decays.
      ar: |
        \[ \Delta M = 2(1.007825) + 2(1.008665) - 4.002603 = 4.032980 - 4.002603 = 0.030377\ \text{u}. \]
        \[ B = 0.030377 \times 931.494\ \text{MeV} = 28.3\ \text{MeV}, \qquad \frac{B}{A} = \frac{28.3}{4} = 7.07\ \text{MeV}. \]
        أي 7.07 MeV لكل نوكليون، وهي قيمة كبيرة على نحو غير معتاد لنواة بهذه الخفة (قارنها بـ 1.11 MeV للديوترون)، ولهذا تنبعث جسيمات ألفا ككتلة واحدة في اضمحلال الأنوية الثقيلة.
  - title: { en: Radiocarbon dating, ar: التأريخ بالكربون المشع }
    difficulty: 2
    statement:
      en: |
        Living wood has a \(^{14}\text{C}\) activity of 15.3 decays per minute per gram of carbon. A wooden artefact shows 3.8 decays per minute per gram. Given \(T_{1/2}(^{14}\text{C}) = 5730\) y, estimate the age of the artefact.
      ar: |
        للخشب الحي نشاطية \(^{14}\text{C}\) قدرها 15.3 تفككًا في الدقيقة لكل غرام من الكربون. وتُظهر قطعة أثرية خشبية 3.8 تفككات في الدقيقة لكل غرام. علمًا أن \(T_{1/2}(^{14}\text{C}) = 5730\) سنة، قدّر عمر القطعة.
    hint:
      en: '\(A(t) = A_0e^{-\lambda t}\) with \(\lambda = \ln2/T_{1/2}\).'
      ar: '\(A(t) = A_0e^{-\lambda t}\) حيث \(\lambda = \ln2/T_{1/2}\).'
    solution:
      en: |
        \[ t = \frac{1}{\lambda}\ln\frac{A_0}{A} = \frac{T_{1/2}}{\ln2}\ln\frac{15.3}{3.8} = \frac{5730\ \text{y}}{0.693}\times\ln(4.03) = 8267\ \text{y}\times1.393 \approx 1.15\times10^{4}\ \text{y}. \]
        Check: the activity has dropped by a factor of about 4, i.e. two half-lives (11 460 y) — consistent.
      ar: |
        \[ t = \frac{1}{\lambda}\ln\frac{A_0}{A} = \frac{T_{1/2}}{\ln2}\ln\frac{15.3}{3.8} = \frac{5730\ \text{y}}{0.693}\times\ln(4.03) = 8267\ \text{y}\times1.393 \approx 1.15\times10^{4}\ \text{y}. \]
        للتحقق: انخفضت النشاطية بعامل يقارب 4، أي ما يعادل عمرَي نصف (11460 سنة)، وهذا متّسق.

quizzes:
  - title: { en: Quantum mechanics in one dimension, ar: ميكانيكا الكم في بعد واحد }
    questions:
      - q:
          en: 'For a particle in an infinite square well, what is the ratio \(E_3/E_1\)?'
          ar: 'لجسيم في بئر مربع لانهائي، ما قيمة النسبة \(E_3/E_1\)؟'
        options: ['3', '6', '27', '9']
        answer: 3
        explain:
          en: '\(E_n = n^2E_1\), so \(E_3/E_1 = 9\).'
          ar: '\(E_n = n^2E_1\)، إذن \(E_3/E_1 = 9\).'
      - q:
          en: 'According to the Born interpretation, \(|\Psi(x,t)|^2\,dx\) is:'
          ar: 'حسب تفسير بورن، يمثّل \(|\Psi(x,t)|^2\,dx\):'
        options:
          - { en: The charge of the particle in dx, ar: شحنة الجسيم في dx }
          - { en: 'The probability of finding the particle between x and x + dx at time t', ar: 'احتمال وجود الجسيم بين x وx + dx عند اللحظة t' }
          - { en: The energy stored in dx, ar: الطاقة المخزّنة في dx }
          - { en: The fraction of the particle located in dx, ar: جزء الجسيم الموجود في dx }
        answer: 1
        explain:
          en: 'The wavefunction is a probability amplitude; its squared modulus is a probability density, which is why \(\Psi\) must be normalised.'
          ar: 'الدالة الموجية سعة احتمال، ومربع طويلتها كثافة احتمال؛ ولهذا يجب تنظيم \(\Psi\).'
      - q:
          en: 'What is the lowest possible energy of a quantum harmonic oscillator of angular frequency \(\omega\)?'
          ar: 'ما أدنى طاقة ممكنة لمتذبذب توافقي كمومي تردده الزاوي \(\omega\)؟'
        options: ['\(0\)', '\(\hbar\omega/2\)', '\(\hbar\omega\)', '\(3\hbar\omega/2\)']
        answer: 1
        explain:
          en: '\(E_n = (n+\frac12)\hbar\omega\); the zero-point energy \(\hbar\omega/2\) is required by the uncertainty principle — the particle cannot be at rest at the bottom of the well.'
          ar: '\(E_n = (n+\frac12)\hbar\omega\)؛ وطاقة نقطة الصفر \(\hbar\omega/2\) يفرضها مبدأ الارتياب، إذ لا يمكن للجسيم أن يسكن في قاع البئر.'
      - q:
          en: 'Why can a single plane wave \(e^{i(kx-\omega t)}\) not represent a real free particle?'
          ar: 'لماذا لا يمكن لموجة مستوية واحدة \(e^{i(kx-\omega t)}\) أن تمثّل جسيمًا حرًّا حقيقيًا؟'
        options:
          - { en: It does not satisfy the Schrödinger equation, ar: لأنها لا تحقق معادلة شرودنغر }
          - { en: Its momentum is undefined, ar: لأن زخمها غير معرّف }
          - { en: It cannot be normalised (uniform probability over all space), ar: لأنها غير قابلة للتنظيم (احتمال منتظم في كل الفضاء) }
          - { en: Its energy is negative, ar: لأن طاقتها سالبة }
        answer: 2
        explain:
          en: '\(|e^{i(kx-\omega t)}|^2 = 1\) everywhere, so the integral over all space diverges. Physical particles are wave packets — superpositions of plane waves (see the wave-packet animation).'
          ar: '\(|e^{i(kx-\omega t)}|^2 = 1\) في كل مكان، فيتباعد التكامل على كامل الفضاء. الجسيمات الفيزيائية حُزم موجية، أي تراكبات لموجات مستوية (انظر الرسم المتحرك للحزمة الموجية).'
      - q:
          en: 'In one dimension, which operator represents the momentum \(p\)?'
          ar: 'في بعد واحد، أي مؤثر يمثّل الزخم \(p\)؟'
        options: ['\(i\hbar\,\partial/\partial x\)', '\(-i\hbar\,\partial/\partial x\)', '\(-i\hbar\,\partial/\partial t\)', '\(\hbar k x\)']
        answer: 1
        explain:
          en: '\(\hat p = -i\hbar\,\partial/\partial x\): acting on \(e^{ikx}\) it gives \(\hbar k\,e^{ikx}\), in agreement with de Broglie''s \(p = \hbar k\).'
          ar: '\(\hat p = -i\hbar\,\partial/\partial x\): بتأثيره على \(e^{ikx}\) نحصل على \(\hbar k\,e^{ikx}\)، وهذا يوافق علاقة دي برولي \(p = \hbar k\).'
  - title: { en: QM in three dimensions and hydrogen, ar: ميكانيكا الكم في ثلاثة أبعاد والهيدروجين }
    questions:
      - q:
          en: 'For a particle in a cubic box, the first excited level \((n_x,n_y,n_z) = (2,1,1)\) and permutations has degeneracy:'
          ar: 'لجسيم في صندوق مكعب، درجة انحلال المستوى المثار الأول \((n_x,n_y,n_z) = (2,1,1)\) وتبديلاته هي:'
        options: ['1', '2', '3', '6']
        answer: 2
        explain:
          en: '\((2,1,1), (1,2,1), (1,1,2)\) all have \(E = 6E_0\): three states. The degeneracy comes from the cubic symmetry.'
          ar: '\((2,1,1), (1,2,1), (1,1,2)\) لها جميعًا الطاقة \(E = 6E_0\): ثلاث حالات. وينشأ الانحلال من التناظر المكعبي.'
      - q:
          en: 'What is the energy of the \(n=2\) level of hydrogen?'
          ar: 'ما طاقة المستوى \(n=2\) في ذرة الهيدروجين؟'
        options: ['\(-13.6\) eV', '\(-6.8\) eV', '\(-3.4\) eV', '\(-1.51\) eV']
        answer: 2
        explain:
          en: '\(E_n = -13.6\ \text{eV}/n^2\), so \(E_2 = -3.4\) eV (and \(E_3 = -1.51\) eV).'
          ar: '\(E_n = -13.6\ \text{eV}/n^2\)، إذن \(E_2 = -3.4\) eV (و\(E_3 = -1.51\) eV).'
      - q:
          en: 'What is the magnitude of the orbital angular momentum of an electron with \(l = 1\)?'
          ar: 'ما مقدار الزخم الزاوي المداري لإلكترون فيه \(l = 1\)؟'
        options: ['\(\hbar\)', '\(\sqrt2\,\hbar\)', '\(2\hbar\)', '\(\hbar/2\)']
        answer: 1
        explain:
          en: '\(|\vb{L}| = \sqrt{l(l+1)}\,\hbar = \sqrt2\,\hbar\) — larger than the maximum \(L_z = \hbar\), so \(\vb{L}\) can never point exactly along \(z\).'
          ar: '\(|\vb{L}| = \sqrt{l(l+1)}\,\hbar = \sqrt2\,\hbar\)، وهو أكبر من القيمة العظمى \(L_z = \hbar\)، فلا يمكن لـ \(\vb{L}\) أن يتجه تمامًا على المحور \(z\).'
      - q:
          en: 'For \(l = 1\), \(m_l = 1\), what is the angle between \(\vb{L}\) and the \(z\)-axis?'
          ar: 'من أجل \(l = 1\) و\(m_l = 1\)، ما الزاوية بين \(\vb{L}\) والمحور \(z\)؟'
        options: ['\(0^\circ\)', '\(30^\circ\)', '\(45^\circ\)', '\(60^\circ\)']
        answer: 2
        explain:
          en: '\(\cos\theta = m_l/\sqrt{l(l+1)} = 1/\sqrt2\), so \(\theta = 45^\circ\). This is space quantisation.'
          ar: '\(\cos\theta = m_l/\sqrt{l(l+1)} = 1/\sqrt2\)، إذن \(\theta = 45^\circ\). وهذا هو التكميم الفضائي.'
      - q:
          en: 'Ignoring spin, how many states share the hydrogen energy level with principal quantum number \(n\)?'
          ar: 'بإهمال السبين، كم حالة تشترك في مستوى الطاقة ذي العدد الكمومي الرئيسي \(n\) في ذرة الهيدروجين؟'
        options: ['\(n\)', '\(2n+1\)', '\(2n^2\)', '\(n^2\)']
        answer: 3
        explain:
          en: '\(\sum_{l=0}^{n-1}(2l+1) = n^2\). Including the two spin states gives \(2n^2\).'
          ar: '\(\sum_{l=0}^{n-1}(2l+1) = n^2\). وبإضافة حالتي السبين نحصل على \(2n^2\).'
  - title: { en: Atomic structure, ar: البنية الذرية }
    questions:
      - q:
          en: 'In the normal Zeeman effect, a spectral line splits into how many components?'
          ar: 'في ظاهرة زيمان العادية، إلى كم مركّبة ينشطر الخط الطيفي؟'
        options: ['2', '3', '\(2l+1\)', '\(n^2\)']
        answer: 1
        explain:
          en: 'The selection rule \(\Delta m_l = 0,\pm1\) allows only three photon energies, \(h\nu_0\) and \(h\nu_0\pm\mu_BB\).'
          ar: 'قاعدة الانتقاء \(\Delta m_l = 0,\pm1\) لا تسمح إلا بثلاث طاقات للفوتون: \(h\nu_0\) و\(h\nu_0\pm\mu_BB\).'
      - q:
          en: 'What is the magnitude of the spin angular momentum of an electron?'
          ar: 'ما مقدار الزخم الزاوي المغزلي (السبين) للإلكترون؟'
        options: ['\(\hbar/2\)', '\(\hbar\)', '\(\frac{\sqrt3}{2}\hbar\)', '\(\sqrt2\,\hbar\)']
        answer: 2
        explain:
          en: '\(|\vb{S}| = \sqrt{s(s+1)}\,\hbar\) with \(s = \frac12\): \(\frac{\sqrt3}{2}\hbar\). Its \(z\)-component is \(\pm\hbar/2\).'
          ar: '\(|\vb{S}| = \sqrt{s(s+1)}\,\hbar\) مع \(s = \frac12\): \(\frac{\sqrt3}{2}\hbar\). ومركّبته على \(z\) تساوي \(\pm\hbar/2\).'
      - q:
          en: 'The two yellow sodium D lines (589.0 and 589.6 nm) are due to:'
          ar: 'ينشأ خطّا الصوديوم الأصفران D (589.0 و589.6 nm) عن:'
        options:
          - { en: The Zeeman effect of the Earth's field, ar: ظاهرة زيمان الناتجة عن المجال الأرضي }
          - { en: 'Spin–orbit splitting of the 3p level into \(3p_{3/2}\) and \(3p_{1/2}\)', ar: 'الانشطار المغزلي-المداري للمستوى 3p إلى \(3p_{3/2}\) و\(3p_{1/2}\)' }
          - { en: Two different isotopes of sodium, ar: نظيرين مختلفين للصوديوم }
          - { en: The hyperfine structure of the 3s level, ar: البنية فائقة الدقة للمستوى 3s }
        answer: 1
        explain:
          en: 'Spin–orbit coupling splits 3p into \(j = 3/2\) and \(j = 1/2\) levels separated by about 2 meV; transitions from each to \(3s_{1/2}\) give the D2 and D1 lines.'
          ar: 'يشطر الاقتران المغزلي-المداري المستوى 3p إلى مستويين \(j = 3/2\) و\(j = 1/2\) يفصل بينهما نحو 2 meV؛ والانتقالان منهما إلى \(3s_{1/2}\) يعطيان الخطين D2 وD1.'
      - q:
          en: 'According to Moseley''s law, the frequency of the \(K_\alpha\) X-ray line is proportional to:'
          ar: 'حسب قانون موزلي، يتناسب تردد خط الأشعة السينية \(K_\alpha\) مع:'
        options: ['\(Z\)', '\(Z^2\)', '\((Z-1)^2\)', '\(1/Z^2\)']
        answer: 2
        explain:
          en: 'A 2p electron filling a 1s hole sees the nuclear charge screened by the remaining 1s electron: \(f \propto (Z-1)^2\). This allowed Moseley to order the elements by atomic number.'
          ar: 'يرى إلكترون 2p الذي يملأ ثغرة في 1s شحنة النواة محجوبة بإلكترون 1s المتبقي: \(f \propto (Z-1)^2\). وقد مكّن ذلك موزلي من ترتيب العناصر حسب عددها الذري.'
      - q:
          en: 'What is the ground-state electron configuration of sodium (Z = 11)?'
          ar: 'ما التوزيع الإلكتروني للحالة الأرضية للصوديوم (Z = 11)؟'
        options:
          - '\(1s^2\,2s^2\,2p^6\,3s^1\)'
          - '\(1s^2\,2s^2\,2p^7\)'
          - '\(1s^2\,2s^2\,2p^5\,3s^2\)'
          - '\(1s^2\,2s^1\,2p^6\,3s^2\)'
        answer: 0
        explain:
          en: 'The Pauli principle allows at most 2 electrons in s and 6 in p subshells; the 11th electron goes to 3s. One loosely bound outer electron makes sodium an alkali metal.'
          ar: 'يسمح مبدأ باولي بإلكترونين على الأكثر في الطبقة الجزئية s وبستة في p؛ فيذهب الإلكترون الحادي عشر إلى 3s. ووجود إلكترون خارجي واحد ضعيف الارتباط يجعل الصوديوم فلزًا قلويًا.'
  - title: { en: Solids and nuclei, ar: الأجسام الصلبة والأنوية }
    questions:
      - q:
          en: 'In band theory, what distinguishes a metal from an insulator?'
          ar: 'في نظرية العصابات، ما الذي يميّز المعدن عن العازل؟'
        options:
          - { en: The metal has more electrons per atom, ar: للمعدن عدد أكبر من الإلكترونات لكل ذرة }
          - { en: The metal has a partially filled band; the insulator has a filled band separated by a large gap, ar: للمعدن عصابة مملوءة جزئيًا؛ أما العازل فعصابته مملوءة وتفصلها فجوة كبيرة }
          - { en: Only metals have a band structure, ar: المعادن وحدها لها بنية عصابات }
          - { en: The insulator has no valence electrons, ar: لا يملك العازل إلكترونات تكافؤ }
        answer: 1
        explain:
          en: 'Electrons can be accelerated by a field only if empty states lie just above them. A partially filled band provides them; a full band separated by a gap of several eV does not. A semiconductor is an insulator with a small gap (Si: 1.1 eV).'
          ar: 'لا يمكن للمجال أن يسرّع الإلكترونات إلا إذا وُجدت حالات فارغة فوقها مباشرة. والعصابة المملوءة جزئيًا توفّرها، أما العصابة الممتلئة التي تفصلها فجوة من عدة eV فلا. وشبه الموصل عازل ذو فجوة صغيرة (Si: 1.1 eV).'
      - q:
          en: 'Nuclear radii follow \(R = r_0A^{1/3}\). What is the ratio of the radius of a nucleus with \(A = 216\) to that of one with \(A = 27\)?'
          ar: 'تتبع أنصاف أقطار الأنوية العلاقة \(R = r_0A^{1/3}\). ما نسبة نصف قطر نواة فيها \(A = 216\) إلى نصف قطر نواة فيها \(A = 27\)؟'
        options: ['2', '4', '8', '1.5']
        answer: 0
        explain:
          en: '\((216/27)^{1/3} = 8^{1/3} = 2\). Volume grows like \(A\): all nuclei have roughly the same density, about \(2.3\times10^{17}\ \text{kg/m}^3\).'
          ar: '\((216/27)^{1/3} = 8^{1/3} = 2\). ويتناسب الحجم مع \(A\): فلكل الأنوية تقريبًا الكثافة نفسها، نحو \(2.3\times10^{17}\ \text{kg/m}^3\).'
      - q:
          en: 'The binding energy per nucleon is largest for nuclei near:'
          ar: 'تكون طاقة الربط لكل نوكليون أكبر ما يمكن للأنوية القريبة من:'
        options:
          - '\(^{4}\text{He}\)'
          - '\(^{56}\text{Fe}\)'
          - '\(^{235}\text{U}\)'
          - '\(^{12}\text{C}\)'
        answer: 1
        explain:
          en: 'The curve peaks near iron and nickel (about 8.8 MeV per nucleon). This is why fusion of light nuclei and fission of heavy nuclei both release energy.'
          ar: 'يبلغ المنحنى قمّته قرب الحديد والنيكل (نحو 8.8 MeV لكل نوكليون). ولهذا يحرّر كلٌّ من اندماج الأنوية الخفيفة وانشطار الأنوية الثقيلة طاقة.'
      - q:
          en: 'What fraction of a radioactive sample remains after three half-lives?'
          ar: 'ما الجزء المتبقي من عيّنة مشعّة بعد ثلاثة أعمار نصف؟'
        options: ['\(1/3\)', '\(1/6\)', '\(1/9\)', '\(1/8\)']
        answer: 3
        explain:
          en: '\(N/N_0 = (1/2)^3 = 1/8\).'
          ar: '\(N/N_0 = (1/2)^3 = 1/8\).'
      - q:
          en: 'In \(\beta^-\) decay, \(n \to p + e^- + \bar\nu_e\) inside the nucleus. How do \(Z\) and \(A\) change?'
          ar: 'في اضمحلال \(\beta^-\) يحدث داخل النواة \(n \to p + e^- + \bar\nu_e\). كيف يتغير \(Z\) و\(A\)؟'
        options:
          - { en: 'Z decreases by 1, A unchanged', ar: 'ينقص Z بواحد، ويبقى A ثابتًا' }
          - { en: 'Z increases by 1, A unchanged', ar: 'يزداد Z بواحد، ويبقى A ثابتًا' }
          - { en: 'Z decreases by 2, A decreases by 4', ar: 'ينقص Z باثنين، وينقص A بأربعة' }
          - { en: Both unchanged, ar: يبقى كلاهما ثابتًا }
        answer: 1
        explain:
          en: 'A neutron becomes a proton: \(Z \to Z+1\) with the same \(A\). The antineutrino explains the continuous electron energy spectrum (option 3 describes alpha decay).'
          ar: 'يتحول نيوترون إلى بروتون: \(Z \to Z+1\) مع بقاء \(A\). ويفسّر ضديد النيوترينو الطيف المتصل لطاقة الإلكترون (أما الخيار الثالث فيصف اضمحلال ألفا).'


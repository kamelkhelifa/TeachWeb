notes: >
  Syllabus, weekly lecture notes (weeks 1-15), homework sets 2-15, solutions 2-6, quizzes, midterms,
  final and three past exams taken from the source page (15-week course, so weeks: 15). Week-by-week
  allocation inside each chapter, textbook section numbers (Serway, Moses & Moyer 3rd ed.), CLOs,
  assessment weights (source gave only the list of tests), quizzes, worked problems and glossary are
  reconstructed/new. The marks PDF (student grades) was deliberately not linked. Past-exam session
  years converted from Hijri labels 1437(S1), 1437(S2), 1438(S1) to 2015-2016 / 2016-2017: please
  double-check. Supplementary external readings kept with neutral titles. The 'particles' sim was
  added for the nuclear/decay chapter (beta decay, neutrinos).

description:
  en: |
    <p>This course turns the student's classical, Newtonian picture of nature into the quantum picture of modern physics, and then uses it to explain the structure of matter from the atom to the nucleus. It starts with a short review of the old quantum theory and introduces the Schrödinger equation and its one-dimensional applications: the Born interpretation, free particles and wave packets, the particle in a box, the finite well and the quantum oscillator, expectation values, observables and operators.</p>
    <p>The Schrödinger equation is then solved in three dimensions: the three-dimensional box, central forces and angular momentum, space quantisation and the hydrogen atom. Atomic structure follows — orbital magnetism and the normal Zeeman effect, electron spin, spin–orbit coupling and fine structure, exchange symmetry and the Pauli principle, the periodic table and X-ray spectra.</p>
    <p>The last part applies these ideas to condensed and nuclear matter: the free-electron model and band theory of solids, semiconductors and superconductivity; properties of nuclei, binding energy, nuclear models, radioactivity and the alpha, beta and gamma decay processes.</p>
  ar: |
    <p>يهدف هذا المقرر إلى نقل الطالب من التصور الكلاسيكي (النيوتوني) للطبيعة إلى التصور الكمومي للفيزياء الحديثة، ثم توظيفه في تفسير بنية المادة من الذرة إلى النواة. يبدأ بمراجعة قصيرة لنظرية الكم القديمة، ثم يقدّم معادلة شرودنغر وتطبيقاتها في بعد واحد: تفسير بورن، والجسيم الحر والحُزم الموجية، والجسيم في صندوق، والبئر المنتهي، والمتذبذب الكمومي، والقيم المتوقعة، والمقادير القابلة للقياس والمؤثرات.</p>
    <p>ثم تُحلّ معادلة شرودنغر في ثلاثة أبعاد: الصندوق ثلاثي الأبعاد، والقوى المركزية والزخم الزاوي، والتكميم الفضائي، وذرة الهيدروجين. وتليها البنية الذرية: المغناطيسية المدارية وظاهرة زيمان العادية، وسبين الإلكترون، والاقتران المغزلي-المداري والبنية الدقيقة، وتناظر التبادل ومبدأ باولي، والجدول الدوري، وأطياف الأشعة السينية.</p>
    <p>ويطبّق الجزء الأخير هذه الأفكار على المادة المكثفة والمادة النووية: نموذج الإلكترون الحر ونظرية العصابات في الأجسام الصلبة، وأشباه الموصلات، والموصلية الفائقة؛ ثم خصائص الأنوية، وطاقة الربط، والنماذج النووية، والنشاط الإشعاعي، وعمليات الاضمحلال ألفا وبيتا وغاما.</p>

topics:
  - { en: Schrödinger equation, ar: معادلة شرودنغر }
  - { en: Particle in a box & oscillator, ar: الجسيم في صندوق والمتذبذب }
  - { en: Hydrogen atom, ar: ذرة الهيدروجين }
  - { en: Angular momentum & space quantisation, ar: الزخم الزاوي والتكميم الفضائي }
  - { en: Electron spin & Zeeman effect, ar: سبين الإلكترون وظاهرة زيمان }
  - { en: Pauli principle & periodic table, ar: مبدأ باولي والجدول الدوري }
  - { en: Band theory & superconductivity, ar: نظرية العصابات والموصلية الفائقة }
  - { en: Nuclear structure & binding energy, ar: البنية النووية وطاقة الربط }
  - { en: Radioactivity & decay processes, ar: النشاط الإشعاعي وعمليات الاضمحلال }

outcomes:
  - id: CLO1
    bloom: understand
    domain: knowledge
    text:
      en: Explain why classical physics fails at atomic scales and summarise the experimental basis of quantum theory (blackbody radiation, photoelectric and Compton effects, atomic spectra, matter waves).
      ar: يشرح لماذا تفشل الفيزياء الكلاسيكية على السلّم الذري، ويلخّص الأساس التجريبي لنظرية الكم (إشعاع الجسم الأسود، الظاهرة الكهروضوئية وظاهرة كومبتون، الأطياف الذرية، الموجات المادية).
    assessed_by: [quizzes, midterm1, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: Solve the time-independent Schrödinger equation for the infinite and finite wells and the harmonic oscillator, normalise wavefunctions and compute probabilities and expectation values.
      ar: يحل معادلة شرودنغر المستقلة عن الزمن للبئر اللانهائي والبئر المنتهي والمتذبذب التوافقي، وينظّم الدوال الموجية، ويحسب الاحتمالات والقيم المتوقعة.
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO3
    bloom: apply
    domain: skills
    text:
      en: Describe the hydrogen atom with the quantum numbers n, l, m, compute energy levels, radial probabilities and angular-momentum magnitudes, and interpret space quantisation.
      ar: يصف ذرة الهيدروجين بالأعداد الكمومية n وl وm، ويحسب مستويات الطاقة والاحتمالات القطرية ومقادير الزخم الزاوي، ويفسّر التكميم الفضائي.
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO4
    bloom: analyze
    domain: knowledge
    text:
      en: Analyse atomic spectra using electron spin, the Zeeman effect, spin–orbit coupling, the exclusion principle and Moseley's law, and relate electron configurations to the periodic table.
      ar: يحلّل الأطياف الذرية باستعمال سبين الإلكترون وظاهرة زيمان والاقتران المغزلي-المداري ومبدأ الاستبعاد وقانون موزلي، ويربط التوزيعات الإلكترونية بالجدول الدوري.
    assessed_by: [quizzes, homework, midterm2, final]
  - id: CLO5
    bloom: understand
    domain: knowledge
    text:
      en: Explain the electrical properties of metals, insulators and semiconductors with the free-electron and band models, and describe the main features of superconductivity.
      ar: يفسّر الخصائص الكهربائية للمعادن والعوازل وأشباه الموصلات بنموذجي الإلكترون الحر والعصابات، ويصف السمات الرئيسة للموصلية الفائقة.
    assessed_by: [homework, midterm2, final]
  - id: CLO6
    bloom: apply
    domain: skills
    text:
      en: Calculate nuclear sizes, binding energies and decay energetics, apply the radioactive decay law (half-life, activity, dating) and identify alpha, beta and gamma processes.
      ar: يحسب أحجام الأنوية وطاقات الربط وطاقات الاضمحلال، ويطبّق قانون الاضمحلال الإشعاعي (عمر النصف، النشاطية، التأريخ)، ويميّز عمليات ألفا وبيتا وغاما.
    assessed_by: [quizzes, homework, final]
  - id: CLO7
    bloom: create
    domain: values
    text:
      en: Prepare and deliver a short, well-sourced presentation on a modern technological application of quantum physics, and submit honest, independently written homework.
      ar: يُعدّ ويقدّم عرضًا قصيرًا موثّق المصادر حول تطبيق تقني حديث لفيزياء الكم، ويسلّم واجبات نزيهة مكتوبة باستقلالية.
    assessed_by: [presentation, homework, participation]

assessment:
  - id: quizzes
    type: quiz
    weight: 10
    title: { en: Quizzes, ar: اختبارات قصيرة }
    detail:
      en: Two 20-minute quizzes with short problems on the most recent chapters.
      ar: اختباران قصيران مدة كل منهما 20 دقيقة، فيهما مسائل قصيرة حول الفصول الأخيرة.
    when: { en: Weeks 4 and 9, ar: الأسبوعان 4 و9 }
  - id: homework
    type: homework
    weight: 10
    title: { en: Weekly homework, ar: الواجبات الأسبوعية }
    detail:
      en: One homework set per week, due the following week; problems mirror the lecture of that week. Graded on completeness and correctness.
      ar: سلسلة واجبات واحدة كل أسبوع تُسلَّم في الأسبوع الموالي؛ وتوافق مسائلها محاضرة ذلك الأسبوع. يُقيَّم الحل على أساس اكتماله وصحته.
    when: { en: Weeks 1–15, ar: الأسابيع 1–15 }
  - id: midterm1
    type: midterm
    weight: 15
    title: { en: Mid-term test 1, ar: الاختبار النصفي 1 }
    detail:
      en: 'Fifty minutes: old quantum theory, QM in one dimension and the beginning of QM in three dimensions.'
      ar: 'خمسون دقيقة: نظرية الكم القديمة، وميكانيكا الكم في بعد واحد، وبداية ميكانيكا الكم في ثلاثة أبعاد.'
    when: { en: Week 7, ar: الأسبوع 7 }
  - id: midterm2
    type: midterm
    weight: 15
    title: { en: Mid-term test 2, ar: الاختبار النصفي 2 }
    detail:
      en: 'Fifty minutes: hydrogen atom, atomic structure and solid state.'
      ar: 'خمسون دقيقة: ذرة الهيدروجين، والبنية الذرية، والحالة الصلبة.'
    when: { en: Week 12, ar: الأسبوع 12 }
  - id: presentation
    type: presentation
    weight: 5
    title: { en: Application presentation, ar: عرض حول تطبيق }
    detail:
      en: 'A 10-minute talk (in pairs) on an application of modern physics: lasers, LEDs and solar cells, MRI, scanning tunnelling microscopy, superconducting magnets, nuclear power or radiocarbon dating.'
      ar: 'عرض مدته 10 دقائق (ضمن ثنائيات) حول تطبيق من تطبيقات الفيزياء الحديثة: الليزر، الثنائيات الباعثة للضوء والخلايا الشمسية، التصوير بالرنين المغناطيسي، مجهر المسح النفقي، المغانط فائقة التوصيل، الطاقة النووية أو التأريخ بالكربون المشع.'
    when: { en: Weeks 13–14, ar: الأسبوعان 13–14 }
  - id: participation
    type: participation
    weight: 5
    title: { en: Class participation, ar: المشاركة في القسم }
    detail:
      en: Attendance, answers to in-class questions and contributions to problem discussions.
      ar: الحضور، والإجابة عن الأسئلة داخل القسم، والمساهمة في مناقشة المسائل.
    when: { en: Throughout, ar: طوال الفصل }
  - id: final
    type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }
    detail:
      en: Comprehensive two-hour exam covering all chapters, with emphasis on atomic structure and nuclear physics.
      ar: اختبار شامل مدته ساعتان يغطي كل الفصول، مع التركيز على البنية الذرية والفيزياء النووية.
    when: { en: Final exam period, ar: فترة الاختبارات النهائية }

schedule:
  - week: 1
    title: { en: Review of the old quantum theory, ar: مراجعة نظرية الكم القديمة }
    topics:
      en:
        - Blackbody radiation and Planck's hypothesis
        - Photoelectric and Compton effects
        - Bohr model of hydrogen; de Broglie waves
        - Uncertainty principle
      ar:
        - إشعاع الجسم الأسود وفرضية بلانك
        - الظاهرة الكهروضوئية وظاهرة كومبتون
        - نموذج بور للهيدروجين؛ موجات دي برولي
        - مبدأ الارتياب
    reading: Serway ch. 3–5
    activity: { en: Homework 1, ar: الواجب 1 }
  - week: 2
    title: { en: The Schrödinger equation, ar: معادلة شرودنغر }
    topics:
      en:
        - The Born interpretation; normalisation
        - Wavefunction for a free particle; wave packets
      ar:
        - تفسير بورن؛ التنظيم
        - الدالة الموجية لجسيم حر؛ الحُزم الموجية
    reading: Serway §6.1–6.2
    activity: { en: Homework 2, ar: الواجب 2 }
  - week: 3
    title: { en: Particles in potential wells, ar: الجسيمات في آبار الجهد }
    topics:
      en:
        - Wavefunctions in the presence of forces
        - The particle in a box (infinite square well)
        - The finite square well; tunnelling (overview)
      ar:
        - الدوال الموجية في وجود قوى
        - الجسيم في صندوق (بئر جهد لانهائي)
        - البئر المربع المنتهي؛ النفق الكمومي (نظرة عامة)
    reading: Serway §6.3–6.5, ch. 7
    activity: { en: Homework 3, ar: الواجب 3 }
  - week: 4
    title: { en: Oscillator and operators, ar: المتذبذب والمؤثرات }
    topics:
      en:
        - The quantum oscillator; zero-point energy
        - Expectation values
        - Observables and operators
      ar:
        - المتذبذب الكمومي؛ طاقة نقطة الصفر
        - القيم المتوقعة
        - المقادير القابلة للقياس والمؤثرات
    reading: Serway §6.6–6.8
    activity: { en: Homework 4; quiz 1, ar: الواجب 4؛ الاختبار القصير 1 }
    milestone: quiz
  - week: 5
    title: { en: Schrödinger equation in three dimensions, ar: معادلة شرودنغر في ثلاثة أبعاد }
    topics:
      en:
        - Particle in a three-dimensional box
        - Separation of variables; degeneracy
      ar:
        - جسيم في صندوق ثلاثي الأبعاد
        - فصل المتغيرات؛ الانحلال
    reading: Serway §8.1
    activity: { en: Homework 5, ar: الواجب 5 }
  - week: 6
    title: { en: Central forces and angular momentum, ar: القوى المركزية والزخم الزاوي }
    topics:
      en:
        - Central forces; spherical coordinates
        - 'Quantisation of \(L^2\) and \(L_z\)'
        - Space quantisation
      ar:
        - القوى المركزية؛ الإحداثيات الكروية
        - 'تكميم \(L^2\) و\(L_z\)'
        - التكميم الفضائي
    reading: Serway §8.2–8.3
    activity: { en: Homework 6, ar: الواجب 6 }
  - week: 7
    title: { en: The hydrogen atom, ar: ذرة الهيدروجين }
    topics:
      en:
        - Atomic hydrogen and hydrogen-like ions
        - Radial probability densities
        - Mid-term test 1
      ar:
        - الهيدروجين الذري والأيونات الشبيهة بالهيدروجين
        - كثافات الاحتمال القطرية
        - الاختبار النصفي 1
    reading: Serway §8.4–8.5
    activity: { en: Homework 7, ar: الواجب 7 }
    milestone: midterm
  - week: 8
    title: { en: Orbital magnetism, ar: المغناطيسية المدارية }
    topics:
      en:
        - Magnetic moment of an orbiting electron; Bohr magneton
        - The normal Zeeman effect
      ar:
        - العزم المغناطيسي للإلكترون المداري؛ مغنطون بور
        - ظاهرة زيمان العادية
    reading: Serway §9.1
    activity: { en: Homework 8, ar: الواجب 8 }
  - week: 9
    title: { en: The spinning electron, ar: الإلكترون المغزلي }
    topics:
      en:
        - Stern–Gerlach experiment; electron spin
        - Spin–orbit coupling; fine structure
        - Total angular momentum J
      ar:
        - تجربة شتيرن-غرلاخ؛ سبين الإلكترون
        - الاقتران المغزلي-المداري؛ البنية الدقيقة
        - الزخم الزاوي الكلي J
    reading: Serway §9.2–9.3
    activity: { en: Homework 9; quiz 2, ar: الواجب 9؛ الاختبار القصير 2 }
    milestone: quiz
  - week: 10
    title: { en: Many-electron atoms, ar: الذرات المتعددة الإلكترونات }
    topics:
      en:
        - Exchange symmetry and the exclusion principle
        - Screening; the periodic table
        - X-ray spectra and Moseley's law
        - Bonding in molecules and solids
      ar:
        - تناظر التبادل ومبدأ الاستبعاد
        - الحجب؛ الجدول الدوري
        - أطياف الأشعة السينية وقانون موزلي
        - الروابط في الجزيئات والأجسام الصلبة
    reading: Serway §9.4–9.7, ch. 11
    activity: { en: Homework 10, ar: الواجب 10 }
  - week: 11
    title: { en: The solid state, ar: الحالة الصلبة }
    topics:
      en:
        - Classical free-electron model
        - Quantum theory of metals; Fermi energy
        - Band theory; semiconductors
        - Superconductivity
      ar:
        - النموذج الكلاسيكي للإلكترون الحر
        - النظرية الكمومية للمعادن؛ طاقة فيرمي
        - نظرية العصابات؛ أشباه الموصلات
        - الموصلية الفائقة
    reading: Serway §12.1–12.6
    activity: { en: Homework 11, ar: الواجب 11 }
  - week: 12
    title: { en: Properties of nuclei, ar: خصائص الأنوية }
    topics:
      en:
        - Composition, size and density of nuclei
        - Nuclear spin and magnetic moments
        - Mid-term test 2
      ar:
        - تركيب الأنوية وحجمها وكثافتها
        - سبين النواة وعزومها المغناطيسية
        - الاختبار النصفي 2
    reading: Serway §13.1
    activity: { en: Homework 12, ar: الواجب 12 }
    milestone: midterm
  - week: 13
    title: { en: Binding energy and nuclear models, ar: طاقة الربط والنماذج النووية }
    topics:
      en:
        - Mass defect and binding energy per nucleon
        - The nuclear force
        - Liquid-drop model and semi-empirical mass formula
        - Shell model; magic numbers
      ar:
        - النقص الكتلي وطاقة الربط لكل نوكليون
        - القوة النووية
        - نموذج القطرة السائلة وصيغة الكتلة شبه التجريبية
        - نموذج الطبقات؛ الأعداد السحرية
    reading: Serway §13.2–13.3
    activity: { en: Homework 13; presentations begin, ar: الواجب 13؛ بداية العروض }
    milestone: project
  - week: 14
    title: { en: Radioactivity, ar: النشاط الإشعاعي }
    topics:
      en:
        - Decay law; activity and half-life
        - Natural radioactivity and decay series
        - Radioactive dating
      ar:
        - قانون الاضمحلال؛ النشاطية وعمر النصف
        - النشاط الإشعاعي الطبيعي وسلاسل الاضمحلال
        - التأريخ الإشعاعي
    reading: Serway §13.4, §13.6
    activity: { en: Homework 14; presentations, ar: الواجب 14؛ العروض }
  - week: 15
    title: { en: Decay processes and review, ar: عمليات الاضمحلال والمراجعة }
    topics:
      en:
        - Alpha decay and tunnelling
        - Beta decay and the neutrino
        - Gamma decay
        - Course review
      ar:
        - اضمحلال ألفا والنفق الكمومي
        - اضمحلال بيتا والنيوترينو
        - اضمحلال غاما
        - مراجعة المقرر
    reading: Serway §13.5
    activity: { en: Homework 15, ar: الواجب 15 }
    milestone: review


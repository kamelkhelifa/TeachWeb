  ar: 'الفيزياء الحديثة 1 أو ما يعادلها (النسبية الخاصة، الفوتونات، نموذج بور، موجات دي برولي)، والتفاضل والتكامل بما في ذلك المشتقات الجزئية، والأعداد المركبة.'

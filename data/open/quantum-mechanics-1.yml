outcomes:
  - id: CLO1
    bloom: understand
    domain: knowledge
    text:
      en: Explain the experimental origins of quantum theory and the statistical interpretation of the wavefunction, including normalisation, expectation values and the uncertainty principle.
      ar: يشرح الأصول التجريبية لنظرية الكم والتفسير الإحصائي للدالة الموجية، بما في ذلك الاستنظام والقيم المتوقعة ومبدأ الارتياب.
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: Solve the time-independent Schrödinger equation for standard one-dimensional potentials (infinite and finite square wells, harmonic oscillator, delta function, free particle) and interpret the bound and scattering solutions.
      ar: يحل معادلة شرودنغر المستقلة عن الزمن للجهود أحادية البعد القياسية (البئران المربعان اللانهائي والمتناهي، والمهتز التوافقي، ودالة دلتا، والجسيم الحر) ويفسّر حلول الارتباط والاستطارة.
    assessed_by: [homework, midterm1, final]
  - id: CLO3
    bloom: analyze
    domain: skills
    text:
      en: Analyse the time evolution of a superposition of stationary states and compute the probabilities and expectation values of energy and position measurements.
      ar: يحلّل التطور الزمني لتراكب من الحالات المستقرة ويحسب احتمالات نتائج قياس الطاقة والموضع وقيمها المتوقعة.
    assessed_by: [homework, midterm1, project, final]
  - id: CLO4
    bloom: apply
    domain: knowledge
    text:
      en: Use the operator formalism (Hilbert space, Hermitian operators, commutators, Dirac notation) to evaluate observables, measurement probabilities and uncertainty relations.
      ar: يوظّف الصياغة المؤثرية (فضاء هيلبرت، المؤثرات الهرميتية، المبدّلات، ترميز ديراك) لحساب المقادير القابلة للرصد واحتمالات القياس وعلاقات الارتياب.
    assessed_by: [quizzes, homework, midterm2, final]
  - id: CLO5
    bloom: apply
    domain: skills
    text:
      en: Separate the Schrödinger equation in spherical coordinates for a central potential and derive the energy levels, degeneracies and radial probability distributions of the hydrogen atom.
      ar: يفصل متغيرات معادلة شرودنغر في الإحداثيات الكروية لجهد مركزي، ويستنتج مستويات الطاقة وانحلالها وتوزيعات الاحتمال القطرية لذرة الهيدروجين.
    assessed_by: [homework, midterm2, final]
  - id: CLO6
    bloom: understand
    domain: knowledge
    text:
      en: Describe the algebra of orbital angular momentum and spin one-half and predict the outcomes of spin measurements with Pauli matrices.
      ar: يصف جبر الزخم الزاوي المداري واللف المغزلي النصفي، ويتنبأ بنتائج قياسات اللف المغزلي باستعمال مصفوفات باولي.
    assessed_by: [quizzes, homework, final]
  - id: CLO7
    bloom: create
    domain: skills
    text:
      en: Build a short numerical or graphical model of a quantum system (e.g. a wave packet in a well) and report its results in a clear written note.
      ar: يبني نموذجًا عدديًا أو بيانيًا قصيرًا لنظام كمومي (مثل حزمة موجية في بئر) ويعرض نتائجه في تقرير مكتوب واضح.
    assessed_by: [project]
  - id: CLO8
    bloom: apply
    domain: values
    text:
      en: Work independently and with academic integrity, presenting complete, logical and clearly written solutions.
      ar: يعمل باستقلالية ونزاهة أكاديمية، ويقدّم حلولًا كاملة ومنطقية ومكتوبة بوضوح.
    assessed_by: [homework, participation]

assessment:
  - id: homework
    type: homework
    weight: 10
    title:
      en: Weekly problem sets
      ar: أوراق المسائل الأسبوعية
    detail:
      en: One problem sheet per week, due one week later. Solve the problems yourself, identify unclear concepts, ask for help when stuck, and write up complete, clear and honest solutions. Two randomly chosen problems per sheet are graded in detail.
      ar: ورقة مسائل كل أسبوع تُسلَّم بعد أسبوع. حُلّ المسائل بنفسك، وحدّد المفاهيم غير الواضحة، واطلب المساعدة عند التعثّر، واكتب حلولًا كاملة وواضحة ونزيهة. تُصحَّح بالتفصيل مسألتان تُختاران عشوائيًا من كل ورقة.
    when:
      en: Weeks 2–13
      ar: الأسابيع 2–13
  - id: quizzes
    type: quiz
    weight: 10
    title:
      en: Short quizzes
      ar: اختبارات قصيرة
    detail:
      en: Four 15-minute quizzes at the end of each chapter (concept questions and one short calculation). The best three count.
      ar: أربعة اختبارات مدة كل منها 15 دقيقة في نهاية كل فصل (أسئلة مفاهيمية وحساب قصير). تُحتسب أفضل ثلاثة.
    when:
      en: Weeks 3, 8, 11, 14
      ar: الأسابيع 3 و8 و11 و14
  - id: midterm1
    type: midterm
    weight: 15
    title:
      en: First periodic exam
      ar: الاختبار الدوري الأول
    detail:
      en: One hour, in class. Chapter 1 and the first half of chapter 2 (wavefunction, stationary states, infinite well, harmonic oscillator, free particle).
      ar: ساعة واحدة في وقت المحاضرة. يشمل الفصل الأول والنصف الأول من الفصل الثاني (الدالة الموجية، الحالات المستقرة، البئر اللانهائي، المهتز التوافقي، الجسيم الحر).
    when:
      en: Week 7
      ar: الأسبوع 7
  - id: midterm2
    type: midterm
    weight: 15
    title:
      en: Second periodic exam
      ar: الاختبار الدوري الثاني
    detail:
      en: One hour, in class. Delta and finite wells, and the formalism of chapter 3.
      ar: ساعة واحدة في وقت المحاضرة. يشمل جهد دالة دلتا والبئر المتناهي والصياغة الرياضية في الفصل الثالث.
    when:
      en: Week 12
      ar: الأسبوع 12
  - id: project
    type: project
    weight: 5
    title:
      en: Computational mini-project
      ar: مشروع حسابي مصغّر
    detail:
      en: In pairs, model a simple quantum system numerically or graphically (e.g. time evolution of a two-state superposition in the infinite well, a finite-well eigenvalue solver, a Gaussian wave packet). Deliverable is a 3-page report with figures and code.
      ar: يعمل الطلاب في ثنائيات على نمذجة نظام كمومي بسيط عدديًا أو بيانيًا (مثل التطور الزمني لتراكب حالتين في البئر اللانهائي، أو حلّ عددي لقيم البئر المتناهي، أو حزمة موجية غاوسية). المطلوب تقرير من 3 صفحات مع أشكال وشيفرة.
    when:
      en: Proposal week 6, report week 13
      ar: المقترح في الأسبوع 6، والتقرير في الأسبوع 13
  - id: participation
    type: participation
    weight: 5
    title:
      en: Attendance and participation
      ar: الحضور والمشاركة
    detail:
      en: Regular attendance, presenting solutions at the board during tutorials, and constructive conduct.
      ar: الحضور المنتظم، وعرض الحلول على السبورة في حصص الأعمال الموجهة، والسلوك البنّاء.
    when:
      en: All weeks
      ar: كل الأسابيع
  - id: final
    type: final
    weight: 40
    title:
      en: Final exam
      ar: الاختبار النهائي
    detail:
      en: Two hours, comprehensive, with emphasis on chapters 3 and 4.
      ar: ساعتان، شامل لكل المقرر مع التركيز على الفصلين الثالث والرابع.
    when:
      en: Final exam period
      ar: فترة الاختبارات النهائية

schedule:
  - week: 1
    title:
      en: Quantum phenomena and the wavefunction
      ar: الظواهر الكمومية والدالة الموجية
    topics:
      en:
        - Overview of the course
        - Black-body radiation, photoelectric and Compton effects, de Broglie waves
        - The Schrödinger equation and the statistical interpretation
      ar:
        - نظرة عامة على المقرر
        - إشعاع الجسم الأسود والظاهرة الكهروضوئية وظاهرة كومبتون وموجات دي بروي
        - معادلة شرودنغر والتفسير الإحصائي
    reading: Griffiths §1.1–1.2
    activity:
      en: Problem set 0 (mathematical review)
      ar: السلسلة 0 (مراجعة رياضية)
  - week: 2
    title:
      en: Probability and normalisation
      ar: الاحتمالات والاستنظام
    topics:
      en:
        - Discrete and continuous probability distributions
        - 'Normalisation and its conservation in time'
        - Expectation values
      ar:
        - التوزيعات الاحتمالية المتقطعة والمتصلة
        - الاستنظام وانحفاظه مع الزمن
        - القيم المتوقعة
    reading: Griffiths §1.3–1.4
    activity:
      en: Problem set 1 released
      ar: نشر السلسلة 1
  - week: 3
    title:
      en: Momentum and the uncertainty principle
      ar: الزخم ومبدأ الارتياب
    topics:
      en:
        - 'Momentum operator \(\hat p = -i\hbar\,\partial/\partial x\)'
        - Ehrenfest theorem
        - Heisenberg uncertainty principle
      ar:
        - 'مؤثر الزخم \(\hat p = -i\hbar\,\partial/\partial x\)'
        - مبرهنة إهرنفست
        - مبدأ الارتياب لهايزنبرغ
    reading: Griffiths §1.5–1.6
    activity:
      en: Problem set 2; quiz 1
      ar: السلسلة 2؛ الاختبار القصير 1
    milestone: quiz
  - week: 4
    title:
      en: Stationary states and the infinite square well
      ar: الحالات المستقرة والبئر المربع اللانهائي
    topics:
      en:
        - Separation of variables and stationary states
        - 'Infinite square well: \(E_n = n^2\pi^2\hbar^2/2ma^2\)'
        - Completeness and time evolution of superpositions
      ar:
        - فصل المتغيرات والحالات المستقرة
        - 'البئر المربع اللانهائي: \(E_n = n^2\pi^2\hbar^2/2ma^2\)'
        - التمام والتطور الزمني للتراكبات
    reading: Griffiths §2.1–2.2
    activity:
      en: Problem set 3; explore the particle-in-a-box lab
      ar: السلسلة 3؛ استكشاف مختبر الجسيم في صندوق
  - week: 5
    title:
      en: The harmonic oscillator
      ar: المهتز التوافقي
    topics:
      en:
        - Ladder operators and the spectrum \((n+\tfrac12)\hbar\omega\)
        - Analytic method and Hermite polynomials
      ar:
        - مؤثرات السلّم والطيف \((n+\tfrac12)\hbar\omega\)
        - الطريقة التحليلية وكثيرات حدود هيرميت
    reading: Griffiths §2.3
    activity:
      en: Problem set 4
      ar: السلسلة 4
  - week: 6
    title:
      en: The free particle
      ar: الجسيم الحر
    topics:
      en:
        - Plane waves are not normalisable
        - Wave packets, phase and group velocity
        - Fourier transform and momentum space
      ar:
        - الموجات المستوية غير قابلة للاستنظام
        - الحزم الموجية وسرعتا الطور والمجموعة
        - تحويل فورييه وفضاء الزخم
    reading: Griffiths §2.4
    activity:
      en: Mini-project proposal due
      ar: تسليم مقترح المشروع المصغّر
    milestone: project
  - week: 7
    title:
      en: The delta-function potential
      ar: جهد دالة دلتا
    topics:
      en:
        - Bound and scattering states
        - Reflection and transmission coefficients
        - First periodic exam
      ar:
        - حالات الارتباط وحالات الاستطارة
        - معاملا الانعكاس والنفاذ
        - الاختبار الدوري الأول
    reading: Griffiths §2.5
    activity:
      en: Problem set 5
      ar: السلسلة 5
    milestone: midterm
  - week: 8
    title:
      en: The finite square well
      ar: البئر المربع المتناهي
    topics:
      en:
        - Even and odd bound states, graphical solution
        - Scattering over the well, transmission resonances
        - Tunnelling through a barrier
      ar:
        - حالات الارتباط الزوجية والفردية والحل البياني
        - الاستطارة فوق البئر ورنين النفاذ
        - النفق الكمومي عبر حاجز
    reading: Griffiths §2.6
    activity:
      en: Problem set 6; quiz 2
      ar: السلسلة 6؛ الاختبار القصير 2
    milestone: quiz
  - week: 9
    title:
      en: Hilbert space and observables
      ar: فضاء هيلبرت والمقادير القابلة للرصد
    topics:
      en:
        - Square-integrable functions, inner product
        - Hermitian operators, determinate states
      ar:
        - الدوال القابلة للتكامل التربيعي والجداء الداخلي
        - المؤثرات الهرميتية والحالات المحدَّدة
    reading: Griffiths §3.1–3.2
    activity:
      en: Problem set 7
      ar: السلسلة 7
  - week: 10
    title:
      en: Eigenfunctions and the generalised statistical interpretation
      ar: الدوال الذاتية والتفسير الإحصائي المعمَّم
    topics:
      en:
        - Discrete and continuous spectra
        - 'Measurement probabilities \(\abs{c_n}^2\) and collapse'
      ar:
        - الطيف المتقطع والطيف المتصل
        - 'احتمالات القياس \(\abs{c_n}^2\) وانهيار الدالة الموجية'
    reading: Griffiths §3.3–3.4
    activity:
      en: Problem set 8
      ar: السلسلة 8
  - week: 11
    title:
      en: Uncertainty principle and Dirac notation
      ar: مبدأ الارتياب وترميز ديراك
    topics:
      en:
        - Generalised uncertainty principle, energy–time uncertainty
        - Time evolution of expectation values
        - Bras, kets, matrix representation, tensor products
      ar:
        - مبدأ الارتياب المعمَّم، وارتياب الطاقة والزمن
        - التطور الزمني للقيم المتوقعة
        - البرا والكت والتمثيل المصفوفي والجداء الموتّري
    reading: Griffiths §3.5–3.6
    activity:
      en: Quiz 3
      ar: الاختبار القصير 3
    milestone: quiz
  - week: 12
    title:
      en: The Schrödinger equation in three dimensions
      ar: معادلة شرودنغر في ثلاثة أبعاد
    topics:
      en:
        - Separation of variables in spherical coordinates
        - Spherical harmonics and the radial equation
        - Second periodic exam
      ar:
        - فصل المتغيرات في الإحداثيات الكروية
        - التوافقيات الكروية والمعادلة القطرية
        - الاختبار الدوري الثاني
    reading: Griffiths §4.1
    activity:
      en: Problem set 9
      ar: السلسلة 9
    milestone: midterm
  - week: 13
    title:
      en: The hydrogen atom and angular momentum
      ar: ذرة الهيدروجين والزخم الزاوي
    topics:
      en:
        - 'Energy levels \(E_n = -13.6\ \text{eV}/n^2\), degeneracy \(n^2\)'
        - Radial wavefunctions and the spectrum of hydrogen
        - 'Angular momentum algebra, \(L^2\) and \(L_z\) eigenvalues'
      ar:
        - 'مستويات الطاقة \(E_n = -13.6\ \text{eV}/n^2\) والانحلال \(n^2\)'
        - الدوال الموجية القطرية وطيف الهيدروجين
        - 'جبر الزخم الزاوي والقيم الذاتية لـ \(L^2\) و\(L_z\)'
    reading: Griffiths §4.2–4.3
    activity:
      en: Problem set 10; mini-project report due
      ar: السلسلة 10؛ تسليم تقرير المشروع المصغّر

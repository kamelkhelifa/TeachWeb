glossary:
  - { en: Wavefunction, ar: الدالة الموجية, fr: Fonction d'onde, def: { en: 'Complex function Ψ(x,t) that contains all the information about a quantum state.', ar: 'دالة مركبة Ψ(x,t) تحوي كل المعلومات عن الحالة الكمومية.' } }
  - { en: Born rule, ar: قاعدة بورن, fr: Règle de Born, def: { en: '|Ψ|² is the probability density for finding the particle at a given position.', ar: '|Ψ|² هي كثافة احتمال وجود الجسيم في موضع معيّن.' } }
  - { en: Normalisation, ar: الاستنظام, fr: Normalisation, def: { en: Requirement that the total probability ∫|Ψ|²dx equals one., ar: اشتراط أن يساوي الاحتمال الكلي ∫|Ψ|²dx الواحد. } }
  - { en: Expectation value, ar: القيمة المتوقعة, fr: Valeur moyenne, def: { en: Average of many measurements of an observable on identically prepared systems., ar: متوسط نتائج قياسات عديدة لمقدار قابل للرصد على أنظمة محضّرة بشكل متطابق. } }
  - { en: Uncertainty principle, ar: مبدأ الارتياب, fr: Principe d'incertitude, def: { en: 'The product of the standard deviations of incompatible observables has a lower bound, e.g. σxσp ≥ ħ/2.', ar: 'لجداء الانحرافين المعياريين لمقدارين غير متوافقين حدّ أدنى، مثل σxσp ≥ ħ/2.' } }
  - { en: Schrödinger equation, ar: معادلة شرودنغر, fr: Équation de Schrödinger, def: { en: Equation iħ∂Ψ/∂t = ĤΨ governing the time evolution of the wavefunction., ar: المعادلة iħ∂Ψ/∂t = ĤΨ التي تحكم التطور الزمني للدالة الموجية. } }
  - { en: Stationary state, ar: الحالة المستقرة, fr: État stationnaire, def: { en: Energy eigenstate whose probability density does not change in time., ar: حالة ذاتية للطاقة لا تتغير كثافة احتمالها مع الزمن. } }
  - { en: Infinite square well, ar: البئر المربع اللانهائي, fr: Puits de potentiel infini, def: { en: Region of zero potential bounded by infinitely high walls; energies grow as n²., ar: منطقة جهد منعدم محصورة بجدارين لانهائيي الارتفاع؛ تتناسب طاقاتها مع n². } }
  - { en: Harmonic oscillator, ar: المهتز التوافقي, fr: Oscillateur harmonique, def: { en: 'Particle in the potential ½mω²x²; equally spaced levels (n + ½)ħω.', ar: 'جسيم في الجهد ½mω²x²؛ مستوياته متساوية التباعد (n + ½)ħω.' } }
  - { en: Ladder operators, ar: مؤثرات السلّم, fr: Opérateurs d'échelle, def: { en: Raising and lowering operators a₊ and a₋ that step between adjacent oscillator levels., ar: مؤثرا الرفع والخفض a₊ وa₋ اللذان ينقلان بين مستويات المهتز المتجاورة. } }
  - { en: Zero-point energy, ar: طاقة نقطة الصفر, fr: Énergie de point zéro, def: { en: 'Lowest possible energy of a confined quantum system, e.g. ħω/2 for the oscillator.', ar: 'أدنى طاقة ممكنة لنظام كمومي محصور، مثل ħω/2 للمهتز التوافقي.' } }
  - { en: Wave packet, ar: الحزمة الموجية, fr: Paquet d'ondes, def: { en: Normalisable superposition of plane waves describing a localised particle., ar: تراكب قابل للاستنظام من موجات مستوية يصف جسيمًا متموضعًا. } }
  - { en: Group velocity, ar: سرعة المجموعة, fr: Vitesse de groupe, def: { en: 'dω/dk, the speed of the envelope of a wave packet (equals the classical particle velocity).', ar: dω/dk، سرعة غلاف الحزمة الموجية (تساوي سرعة الجسيم الكلاسيكية). } }
  - { en: Bound state, ar: حالة الارتباط, fr: État lié, def: { en: Normalisable state with energy below the potential at infinity; discrete spectrum., ar: حالة قابلة للاستنظام طاقتها أقل من قيمة الجهد في اللانهاية؛ طيفها متقطع. } }
  - { en: Scattering state, ar: حالة الاستطارة, fr: État de diffusion, def: { en: Non-normalisable state with energy above the potential at infinity; continuous spectrum., ar: حالة غير قابلة للاستنظام طاقتها أكبر من قيمة الجهد في اللانهاية؛ طيفها متصل. } }
  - { en: Quantum tunnelling, ar: النفق الكمومي, fr: Effet tunnel, def: { en: Transmission of a particle through a barrier higher than its energy., ar: نفاذ جسيم عبر حاجز جهد أعلى من طاقته. } }
  - { en: Transmission coefficient, ar: معامل النفاذ, fr: Coefficient de transmission, def: { en: Probability that an incident particle passes through a potential., ar: احتمال أن يعبر جسيم ساقط منطقة الجهد. } }
  - { en: Hilbert space, ar: فضاء هيلبرت, fr: Espace de Hilbert, def: { en: Complete vector space with an inner product; quantum states are its vectors., ar: فضاء متجهي تام مزوّد بجداء داخلي؛ الحالات الكمومية هي متجهاته. } }
  - { en: Hermitian operator, ar: المؤثر الهرميتي, fr: Opérateur hermitien, def: { en: 'Operator equal to its adjoint; it has real eigenvalues and represents an observable.', ar: 'مؤثر يساوي مرافقه؛ قيمه الذاتية حقيقية ويمثّل مقدارًا قابلًا للرصد.' } }
  - { en: Observable, ar: المقدار القابل للرصد, fr: Observable, def: { en: Measurable physical quantity represented by a Hermitian operator., ar: مقدار فيزيائي قابل للقياس يمثَّل بمؤثر هرميتي. } }
  - { en: Eigenvalue, ar: القيمة الذاتية, fr: Valeur propre, def: { en: 'Number q such that Q̂f = qf; the possible results of measuring Q.', ar: 'عدد q يحقق Q̂f = qf؛ وهي النتائج الممكنة لقياس Q.' } }
  - { en: Commutator, ar: المبدّل, fr: Commutateur, def: { en: '[A, B] = AB − BA; observables that do not commute cannot be sharply measured together.', ar: '[A, B] = AB − BA؛ المقادير غير المتبادلة لا يمكن قياسها بدقة معًا.' } }
  - { en: Dirac notation, ar: ترميز ديراك, fr: Notation de Dirac, def: { en: 'Bra–ket notation ⟨α|β⟩ for states, inner products and operators.', ar: 'ترميز البرا–كت ⟨α|β⟩ للحالات والجداءات الداخلية والمؤثرات.' } }
  - { en: Collapse of the wavefunction, ar: انهيار الدالة الموجية, fr: Réduction du paquet d'ondes, def: { en: Abrupt change of the state to the eigenfunction corresponding to the measured value., ar: تحوّل مفاجئ للحالة إلى الدالة الذاتية الموافقة للقيمة المقيسة. } }
  - { en: Spherical harmonics, ar: التوافقيات الكروية, fr: Harmoniques sphériques, def: { en: 'Functions Y_l^m(θ,φ), common eigenfunctions of L² and L_z.', ar: 'الدوال Y_l^m(θ,φ)، وهي دوال ذاتية مشتركة لـ L² وL_z.' } }
  - { en: Bohr radius, ar: نصف قطر بور, fr: Rayon de Bohr, def: { en: 'a = 4πε₀ħ²/(me²) ≈ 0.529 Å, the natural length scale of hydrogen.', ar: 'a = 4πε₀ħ²/(me²) ≈ 0.529 Å، وهو مقياس الطول الطبيعي لذرة الهيدروجين.' } }
  - { en: Degeneracy, ar: الانحلال, fr: Dégénérescence, def: { en: Several independent states sharing the same energy (n² for hydrogen without spin)., ar: اشتراك عدة حالات مستقلة في الطاقة نفسها (n² للهيدروجين دون اللف المغزلي). } }
  - { en: Orbital angular momentum, ar: الزخم الزاوي المداري, fr: Moment cinétique orbital, def: { en: 'L = r × p; L² has eigenvalues ħ²l(l+1) and L_z has mħ.', ar: 'L = r × p؛ القيم الذاتية لـ L² هي ħ²l(l+1) ولـ L_z هي mħ.' } }
  - { en: Spin, ar: اللف المغزلي, fr: Spin, def: { en: 'Intrinsic angular momentum of a particle, with no classical analogue (s = ½ for the electron).', ar: زخم زاوي ذاتي للجسيم لا مقابل كلاسيكي له (s = ½ للإلكترون). } }
  - { en: Pauli matrices, ar: مصفوفات باولي, fr: Matrices de Pauli, def: { en: 'Three 2×2 matrices σx, σy, σz with S = (ħ/2)σ for spin ½.', ar: 'ثلاث مصفوفات 2×2 هي σx وσy وσz، حيث S = (ħ/2)σ للف المغزلي النصفي.' } }


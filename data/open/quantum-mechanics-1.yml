notes: >
  Merged from three versions of the course (PHYS401 calendar and notes as the backbone, PHYS354 description,
  notes, problem sets and 2017-18 tests, UEF223 Arabic sets, solutions, videos and past finals). The
  14-week schedule follows Griffiths ch. 1-4 (3rd ed. numbering) and absorbs the UEF223 introduction to
  quantum phenomena (week 1) and tensor-product notes (week 11). Week numbers of the PHYS354 multi-part
  PDFs, the UEF223 sets and the YouTube lectures were assigned by topic order and should be checked.
  The assessment scheme (quizzes, mini-project, participation), CLO mapping, exam guide, quizzes,
  problems and glossary were written new. Hijri-year past exams were converted to academic years
  (1437 = 2015-16, ..., 1440 = 2018-19). Not carried over: marks sheets, student-portal links, course
  questionnaires, assignment-submission forms and a dead goo.gl short link. The Arabic Griffiths PDF and
  the translated-book collections are third-party copies; check their copyright status.

description:
  en: |
    <p>This is the first full course in quantum mechanics. It starts from the experimental facts that forced physics to abandon the classical picture (black-body radiation, the photoelectric and Compton effects, de Broglie waves) and builds, step by step, the wave mechanics of Schrödinger: the wavefunction and its statistical interpretation, normalisation, expectation values, momentum and the uncertainty principle.</p>
    <p>The time-independent Schrödinger equation is then solved for the classic one-dimensional systems: the infinite square well, the harmonic oscillator (analytic and ladder-operator methods), the free particle and wave packets, the delta-function potential and the finite square well, including bound and scattering states and quantum tunnelling. The third part introduces the formal language of the theory: Hilbert space, Hermitian operators and observables, the generalised statistical interpretation, commutators and the generalised uncertainty principle, and Dirac notation.</p>
    <p>The course ends in three dimensions: separation of variables in spherical coordinates, spherical harmonics, the hydrogen atom, the algebra of angular momentum and spin one-half. Weekly problem sets, short quizzes and a small computational project train students to move fluently between physical reasoning and the mathematics of the theory.</p>
  ar: |
    <p>هذا هو المقرر الكامل الأول في ميكانيكا الكم. ينطلق من الحقائق التجريبية التي أجبرت الفيزياء على التخلي عن الصورة الكلاسيكية (إشعاع الجسم الأسود، والظاهرة الكهروضوئية، وظاهرة كومبتون، وموجات دي بروي)، ثم يبني خطوة بخطوة الميكانيكا الموجية لشرودنغر: الدالة الموجية وتفسيرها الإحصائي، والاستنظام، والقيم المتوقعة، والزخم، ومبدأ الارتياب.</p>
    <p>بعد ذلك تُحل معادلة شرودنغر المستقلة عن الزمن للأنظمة الكلاسيكية أحادية البعد: البئر المربع اللانهائي، والمهتز التوافقي (بالطريقة التحليلية وبمؤثرات السلّم)، والجسيم الحر والحزم الموجية، وجهد دالة دلتا، والبئر المربع المتناهي، مع دراسة حالات الارتباط وحالات الاستطارة والنفق الكمومي. ويقدّم الجزء الثالث اللغة الصورية للنظرية: فضاء هيلبرت، والمؤثرات الهرميتية والمقادير القابلة للرصد، والتفسير الإحصائي المعمَّم، والمبدّلات ومبدأ الارتياب المعمَّم، وترميز ديراك.</p>
    <p>ويُختتم المقرر في ثلاثة أبعاد: فصل المتغيرات في الإحداثيات الكروية، والتوافقيات الكروية، وذرة الهيدروجين، وجبر الزخم الزاوي، واللف المغزلي النصفي. وتدرّب أوراق المسائل الأسبوعية والاختبارات القصيرة ومشروع حسابي صغير الطالبَ على الانتقال بسلاسة بين الاستدلال الفيزيائي والأدوات الرياضية للنظرية.</p>


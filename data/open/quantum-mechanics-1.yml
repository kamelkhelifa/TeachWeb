exam_guide:
  format:
    en: Two periodic exams of 60 minutes (3–4 problems each) and a 2-hour comprehensive final (5–6 problems). Every paper opens with short conceptual questions (about 20–30% of the marks), followed by multi-part calculation problems similar to the weekly problem sets and the worked problems below.
    ar: اختباران دوريان مدة كل منهما 60 دقيقة (3–4 مسائل)، واختبار نهائي شامل مدته ساعتان (5–6 مسائل). يبدأ كل اختبار بأسئلة مفاهيمية قصيرة (نحو 20–30% من العلامة)، تليها مسائل حسابية متعددة الأجزاء مشابهة لأوراق المسائل الأسبوعية وللمسائل المحلولة أدناه.
  allowed:
    en: Non-programmable scientific calculator. A table of standard integrals and physical constants (the course formula sheet) is attached to the paper; no personal notes or books.
    ar: آلة حاسبة علمية غير قابلة للبرمجة. يُرفق بورقة الاختبار جدول التكاملات القياسية والثوابت الفيزيائية (ورقة الصيغ الخاصة بالمقرر)؛ ولا يُسمح بالمذكرات الشخصية أو الكتب.
  tips:
    - en: Always check normalisation first — many marks are lost because a constant was never fixed.
      ar: ابدأ دائمًا بالتحقق من الاستنظام، فكثير من العلامات تضيع بسبب ثابت لم يُحدَّد.
    - en: Exploit symmetry (parity of the potential, orthogonality of eigenfunctions) before doing any integral.
      ar: استغلّ التناظر (زوجية الجهد، وتعامد الدوال الذاتية) قبل حساب أي تكامل.
    - en: For the harmonic oscillator, ladder operators are almost always faster than integrating Hermite polynomials.
      ar: في المهتز التوافقي، تكون مؤثرات السلّم دائمًا تقريبًا أسرع من مكاملة كثيرات حدود هيرميت.
    - en: Check dimensions and limiting cases of every final answer (e.g. does an uncertainty product exceed ħ/2?).
      ar: تحقّق من أبعاد كل جواب نهائي ومن حالاته الحدّية (مثلًا، هل يتجاوز جداء الارتياب ħ/2؟).
    - en: Write the physical meaning of each result in one sentence — graders reward interpretation, not only algebra.
      ar: اكتب المعنى الفيزيائي لكل نتيجة في جملة واحدة، فالمصحّح يكافئ التفسير لا الحساب الجبري وحده.

problems:
  - title:
      en: Normalisation and uncertainties in the infinite well
      ar: الاستنظام والارتيابات في البئر اللانهائي
    difficulty: 1
    statement:
      en: |
        A particle in the infinite square well \(0 \le x \le a\) has the initial wavefunction
        \[ \Psi(x,0) = A\,x(a-x), \qquad 0\le x\le a, \]
        and zero outside. (a) Find \(A\). (b) Compute \(\expval{x}\), \(\expval{x^2}\), \(\expval{p}\) and \(\expval{p^2}\). (c) Find \(\sigma_x\sigma_p\) and check the uncertainty principle.
      ar: |
        جسيم في البئر المربع اللانهائي \(0 \le x \le a\) دالته الموجية الابتدائية
        \[ \Psi(x,0) = A\,x(a-x), \qquad 0\le x\le a, \]
        ومنعدمة خارجه. (أ) أوجد \(A\). (ب) احسب \(\expval{x}\) و\(\expval{x^2}\) و\(\expval{p}\) و\(\expval{p^2}\). (ج) أوجد \(\sigma_x\sigma_p\) وتحقّق من مبدأ الارتياب.
    hint:
      en: 'Use \(\int_0^a x^m(a-x)^n\,\dd x = a^{m+n+1}\,m!\,n!/(m+n+1)!\). For \(\expval{p^2}\) use \(\hat p^2 = -\hbar^2\,\dd^2/\dd x^2\).'
      ar: 'استعمل \(\int_0^a x^m(a-x)^n\,\dd x = a^{m+n+1}\,m!\,n!/(m+n+1)!\). ولحساب \(\expval{p^2}\) استعمل \(\hat p^2 = -\hbar^2\,\dd^2/\dd x^2\).'
    solution:
      en: |
        (a) \(1 = A^2\int_0^a x^2(a-x)^2\,\dd x = A^2\,\dfrac{a^5\,2!\,2!}{5!} = A^2\dfrac{a^5}{30}\), so \(A = \sqrt{30/a^5}\).
        <br>(b) The density is symmetric about \(a/2\), hence \(\expval{x} = a/2\). Next
        \[ \expval{x^2} = A^2\int_0^a x^4(a-x)^2\,\dd x = \frac{30}{a^5}\cdot\frac{a^7\,4!\,2!}{7!} = \frac{30}{a^5}\cdot\frac{a^7}{105} = \frac{2a^2}{7}. \]
        The wavefunction is real, so \(\expval{p} = -i\hbar\int\Psi\Psi'\,\dd x = -\tfrac{i\hbar}{2}\big[\Psi^2\big]_0^a = 0\). With \(\Psi'' = -2A\):
        \[ \expval{p^2} = -\hbar^2\int_0^a \Psi\Psi''\,\dd x = 2\hbar^2A^2\int_0^a x(a-x)\,\dd x = 2\hbar^2\frac{30}{a^5}\frac{a^3}{6} = \frac{10\hbar^2}{a^2}. \]
        (c) \(\sigma_x^2 = \tfrac{2a^2}{7} - \tfrac{a^2}{4} = \tfrac{a^2}{28}\), \(\sigma_p^2 = \tfrac{10\hbar^2}{a^2}\), so
        \[ \sigma_x\sigma_p = \hbar\sqrt{\tfrac{10}{28}} = \hbar\sqrt{\tfrac{5}{14}} \approx 0.598\,\hbar > \tfrac{\hbar}{2}. \]
        The uncertainty principle is satisfied, and quite tightly: this parabola is very close to the ground state.
      ar: |
        (أ) \(1 = A^2\int_0^a x^2(a-x)^2\,\dd x = A^2\,\dfrac{a^5\,2!\,2!}{5!} = A^2\dfrac{a^5}{30}\)، إذن \(A = \sqrt{30/a^5}\).
        <br>(ب) كثافة الاحتمال متناظرة حول \(a/2\)، ومنه \(\expval{x} = a/2\). ثم
        \[ \expval{x^2} = A^2\int_0^a x^4(a-x)^2\,\dd x = \frac{30}{a^5}\cdot\frac{a^7\,4!\,2!}{7!} = \frac{30}{a^5}\cdot\frac{a^7}{105} = \frac{2a^2}{7}. \]
        الدالة الموجية حقيقية، لذا \(\expval{p} = -i\hbar\int\Psi\Psi'\,\dd x = -\tfrac{i\hbar}{2}\big[\Psi^2\big]_0^a = 0\). ومع \(\Psi'' = -2A\):
        \[ \expval{p^2} = -\hbar^2\int_0^a \Psi\Psi''\,\dd x = 2\hbar^2A^2\int_0^a x(a-x)\,\dd x = 2\hbar^2\frac{30}{a^5}\frac{a^3}{6} = \frac{10\hbar^2}{a^2}. \]
        (ج) \(\sigma_x^2 = \tfrac{2a^2}{7} - \tfrac{a^2}{4} = \tfrac{a^2}{28}\) و\(\sigma_p^2 = \tfrac{10\hbar^2}{a^2}\)، ومنه
        \[ \sigma_x\sigma_p = \hbar\sqrt{\tfrac{10}{28}} = \hbar\sqrt{\tfrac{5}{14}} \approx 0.598\,\hbar > \tfrac{\hbar}{2}. \]
        مبدأ الارتياب محقَّق وبهامش ضيّق، لأن هذا القطع المكافئ قريب جدًا من الحالة الأساسية.
  - title:
      en: Expanding a state in energy eigenstates
      ar: نشر حالة بدلالة الحالات الذاتية للطاقة
    difficulty: 2
    statement:
      en: |
        For the state \(\Psi(x,0) = \sqrt{30/a^5}\,x(a-x)\) of the previous problem, (a) find the coefficients \(c_n\) of its expansion in the eigenstates \(\psi_n(x) = \sqrt{2/a}\,\sin(n\pi x/a)\); (b) find the probability that an energy measurement gives \(E_1\); (c) compute \(\expval{H}\) and compare with \(E_1\); (d) write \(\Psi(x,t)\).
      ar: |
        من أجل الحالة \(\Psi(x,0) = \sqrt{30/a^5}\,x(a-x)\) في المسألة السابقة: (أ) أوجد المعاملات \(c_n\) لنشرها بدلالة الحالات الذاتية \(\psi_n(x) = \sqrt{2/a}\,\sin(n\pi x/a)\)؛ (ب) أوجد احتمال أن يعطي قياس الطاقة القيمة \(E_1\)؛ (ج) احسب \(\expval{H}\) وقارنها بـ \(E_1\)؛ (د) اكتب \(\Psi(x,t)\).
    hint:
      en: 'Integrate by parts twice: \(\int_0^a x(a-x)\sin(n\pi x/a)\,\dd x = \frac{2a^3}{(n\pi)^3}\,[1-(-1)^n]\).'
      ar: 'كامِل بالتجزئة مرتين: \(\int_0^a x(a-x)\sin(n\pi x/a)\,\dd x = \frac{2a^3}{(n\pi)^3}\,[1-(-1)^n]\).'
    solution:
      en: |
        (a) \(c_n = \int_0^a \psi_n\Psi\,\dd x = \sqrt{\tfrac{2}{a}}\sqrt{\tfrac{30}{a^5}}\,\dfrac{2a^3}{(n\pi)^3}[1-(-1)^n]\). Hence
        \[ c_n = \begin{cases} \dfrac{8\sqrt{15}}{(n\pi)^3}, & n \text{ odd},\\[4pt] 0, & n \text{ even}. \end{cases} \]
        Even states vanish because \(\Psi\) is symmetric about the centre of the well while \(\psi_{2k}\) are antisymmetric.
        <br>(b) \(P(E_1) = \abs{c_1}^2 = \dfrac{960}{\pi^6} \approx 0.9986\).
        <br>(c) \(\expval{H} = \expval{p^2}/2m = \dfrac{5\hbar^2}{ma^2}\), while \(E_1 = \dfrac{\pi^2\hbar^2}{2ma^2} \approx \dfrac{4.935\,\hbar^2}{ma^2}\). As required, \(\expval{H} \ge E_1\) (variational principle), and they are very close because \(\abs{c_1}^2 \approx 1\). Check: \(\sum_n \abs{c_n}^2E_n = \tfrac{960}{\pi^6}\tfrac{\pi^2\hbar^2}{2ma^2}\sum_{\text{odd}}\tfrac{1}{n^4} = \tfrac{5\hbar^2}{ma^2}\), using \(\sum_{\text{odd}} n^{-4} = \pi^4/96\).
        <br>(d) \[ \Psi(x,t) = \sqrt{\frac{2}{a}}\sum_{n=1,3,5,\dots}\frac{8\sqrt{15}}{(n\pi)^3}\,\sin\!\Big(\frac{n\pi x}{a}\Big)\,e^{-in^2\pi^2\hbar t/2ma^2}. \]
      ar: |
        (أ) \(c_n = \int_0^a \psi_n\Psi\,\dd x = \sqrt{\tfrac{2}{a}}\sqrt{\tfrac{30}{a^5}}\,\dfrac{2a^3}{(n\pi)^3}[1-(-1)^n]\)، ومنه
        \[ c_n = \begin{cases} \dfrac{8\sqrt{15}}{(n\pi)^3}, & n \text{ odd},\\[4pt] 0, & n \text{ even}. \end{cases} \]
        تنعدم معاملات الحالات ذات \(n\) الزوجي لأن \(\Psi\) متناظرة حول مركز البئر بينما الدوال \(\psi_{2k}\) ضد متناظرة.
        <br>(ب) \(P(E_1) = \abs{c_1}^2 = \dfrac{960}{\pi^6} \approx 0.9986\).
        <br>(ج) \(\expval{H} = \expval{p^2}/2m = \dfrac{5\hbar^2}{ma^2}\)، بينما \(E_1 = \dfrac{\pi^2\hbar^2}{2ma^2} \approx \dfrac{4.935\,\hbar^2}{ma^2}\). وكما هو متوقع \(\expval{H} \ge E_1\) (مبدأ التغاير)، والقيمتان متقاربتان جدًا لأن \(\abs{c_1}^2 \approx 1\). للتحقق: \(\sum_n \abs{c_n}^2E_n = \tfrac{960}{\pi^6}\tfrac{\pi^2\hbar^2}{2ma^2}\sum_{\text{odd}}\tfrac{1}{n^4} = \tfrac{5\hbar^2}{ma^2}\)، باستعمال \(\sum_{\text{odd}} n^{-4} = \pi^4/96\).
        <br>(د) \[ \Psi(x,t) = \sqrt{\frac{2}{a}}\sum_{n=1,3,5,\dots}\frac{8\sqrt{15}}{(n\pi)^3}\,\sin\!\Big(\frac{n\pi x}{a}\Big)\,e^{-in^2\pi^2\hbar t/2ma^2}. \]
  - title:
      en: A sloshing harmonic-oscillator state
      ar: حالة متأرجحة للمهتز التوافقي
    difficulty: 2
    statement:
      en: |
        A particle of mass \(m\) in the potential \(V = \tfrac12 m\omega^2x^2\) starts in \(\Psi(x,0) = \tfrac{1}{\sqrt2}\big[\psi_0(x) + \psi_1(x)\big]\). (a) Write \(\Psi(x,t)\). (b) Using ladder operators, find \(\expval{x}(t)\) and \(\expval{p}(t)\). (c) Find \(\expval{H}\). (d) Verify Ehrenfest's theorem \(\dd\expval{p}/\dd t = \expval{-\partial V/\partial x}\).
      ar: |
        جسيم كتلته \(m\) في الجهد \(V = \tfrac12 m\omega^2x^2\) يبدأ في الحالة \(\Psi(x,0) = \tfrac{1}{\sqrt2}\big[\psi_0(x) + \psi_1(x)\big]\). (أ) اكتب \(\Psi(x,t)\). (ب) باستعمال مؤثرات السلّم أوجد \(\expval{x}(t)\) و\(\expval{p}(t)\). (ج) أوجد \(\expval{H}\). (د) تحقّق من مبرهنة إهرنفست \(\dd\expval{p}/\dd t = \expval{-\partial V/\partial x}\).
    hint:
      en: '\(\hat x = \sqrt{\hbar/2m\omega}\,(a_+ + a_-)\), \(a_+\psi_n = \sqrt{n+1}\,\psi_{n+1}\), \(a_-\psi_n = \sqrt{n}\,\psi_{n-1}\).'
      ar: '\(\hat x = \sqrt{\hbar/2m\omega}\,(a_+ + a_-)\)، و\(a_+\psi_n = \sqrt{n+1}\,\psi_{n+1}\)، و\(a_-\psi_n = \sqrt{n}\,\psi_{n-1}\).'
    solution:
      en: |
        (a) With \(E_n = (n+\tfrac12)\hbar\omega\):
        \[ \Psi(x,t) = \tfrac{1}{\sqrt2}\Big[\psi_0\,e^{-i\omega t/2} + \psi_1\,e^{-3i\omega t/2}\Big]. \]
        (b) The only non-zero matrix elements of \(\hat x\) are \(\int\psi_0\,\hat x\,\psi_1\,\dd x = \int\psi_1\,\hat x\,\psi_0\,\dd x = \sqrt{\hbar/2m\omega}\). Therefore
        \[ \expval{x} = \tfrac12\sqrt{\tfrac{\hbar}{2m\omega}}\big(e^{-i\omega t} + e^{i\omega t}\big) = \sqrt{\frac{\hbar}{2m\omega}}\,\cos\omega t, \qquad \expval{p} = m\frac{\dd\expval{x}}{\dd t} = -\sqrt{\frac{m\hbar\omega}{2}}\,\sin\omega t. \]
        (c) \(\expval{H} = \tfrac12E_0 + \tfrac12E_1 = \tfrac12\big(\tfrac12+\tfrac32\big)\hbar\omega = \hbar\omega\) — constant in time.
        <br>(d) \(\dfrac{\dd\expval{p}}{\dd t} = -\omega\sqrt{\tfrac{m\hbar\omega}{2}}\cos\omega t\), and \(\expval{-\partial V/\partial x} = -m\omega^2\expval{x} = -m\omega^2\sqrt{\tfrac{\hbar}{2m\omega}}\cos\omega t = -\omega\sqrt{\tfrac{m\hbar\omega}{2}}\cos\omega t\). The two agree: the centre of the packet oscillates exactly like a classical particle, at the classical frequency \(\omega\).
      ar: |
        (أ) مع \(E_n = (n+\tfrac12)\hbar\omega\):
        \[ \Psi(x,t) = \tfrac{1}{\sqrt2}\Big[\psi_0\,e^{-i\omega t/2} + \psi_1\,e^{-3i\omega t/2}\Big]. \]
        (ب) العناصر المصفوفية غير المنعدمة الوحيدة لـ \(\hat x\) هي \(\int\psi_0\,\hat x\,\psi_1\,\dd x = \int\psi_1\,\hat x\,\psi_0\,\dd x = \sqrt{\hbar/2m\omega}\). ومنه
        \[ \expval{x} = \tfrac12\sqrt{\tfrac{\hbar}{2m\omega}}\big(e^{-i\omega t} + e^{i\omega t}\big) = \sqrt{\frac{\hbar}{2m\omega}}\,\cos\omega t, \qquad \expval{p} = m\frac{\dd\expval{x}}{\dd t} = -\sqrt{\frac{m\hbar\omega}{2}}\,\sin\omega t. \]
        (ج) \(\expval{H} = \tfrac12E_0 + \tfrac12E_1 = \tfrac12\big(\tfrac12+\tfrac32\big)\hbar\omega = \hbar\omega\)، وهي ثابتة مع الزمن.
        <br>(د) \(\dfrac{\dd\expval{p}}{\dd t} = -\omega\sqrt{\tfrac{m\hbar\omega}{2}}\cos\omega t\)، و\(\expval{-\partial V/\partial x} = -m\omega^2\expval{x} = -m\omega^2\sqrt{\tfrac{\hbar}{2m\omega}}\cos\omega t = -\omega\sqrt{\tfrac{m\hbar\omega}{2}}\cos\omega t\). النتيجتان متطابقتان: يهتز مركز الحزمة تمامًا كجسيم كلاسيكي وبالتردد الكلاسيكي \(\omega\).
  - title:
      en: Bound state of the delta-function well
      ar: حالة الارتباط في بئر دالة دلتا
    difficulty: 2
    statement:
      en: |
        A particle of mass \(m\) moves in \(V(x) = -\alpha\,\delta(x)\), \(\alpha > 0\). (a) Find the bound-state wavefunction and energy. (b) What is the probability of finding the particle within \(\abs{x} < 1/\kappa\), where \(\psi \propto e^{-\kappa\abs{x}}\)? (c) Evaluate the binding energy for an electron with \(\alpha = 1\ \text{eV}\,\text{nm}\).
      ar: |
        جسيم كتلته \(m\) يتحرك في الجهد \(V(x) = -\alpha\,\delta(x)\) حيث \(\alpha > 0\). (أ) أوجد الدالة الموجية وطاقة حالة الارتباط. (ب) ما احتمال وجود الجسيم في المجال \(\abs{x} < 1/\kappa\)، حيث \(\psi \propto e^{-\kappa\abs{x}}\)؟ (ج) احسب طاقة الارتباط لإلكترون من أجل \(\alpha = 1\ \text{eV}\,\text{nm}\).
    hint:
      en: 'Integrate the Schrödinger equation from \(-\epsilon\) to \(+\epsilon\): the derivative jumps by \(\Delta\psi'' = -(2m\alpha/\hbar^2)\,\psi(0)\). Use \(\hbar^2/m_e = 0.0762\ \text{eV}\,\text{nm}^2\).'
      ar: 'كامِل معادلة شرودنغر من \(-\epsilon\) إلى \(+\epsilon\): تقفز المشتقة بمقدار \(\Delta\psi'' = -(2m\alpha/\hbar^2)\,\psi(0)\). استعمل \(\hbar^2/m_e = 0.0762\ \text{eV}\,\text{nm}^2\).'
    solution:
      en: |
        (a) For \(x \ne 0\), \(\psi'' = \kappa^2\psi\) with \(\kappa = \sqrt{-2mE}/\hbar\). Normalisable and continuous: \(\psi = B\,e^{-\kappa\abs{x}}\). The jump condition gives \(-2\kappa B = -\tfrac{2m\alpha}{\hbar^2}B\), so
        \[ \kappa = \frac{m\alpha}{\hbar^2}, \qquad E = -\frac{\hbar^2\kappa^2}{2m} = -\frac{m\alpha^2}{2\hbar^2}, \qquad \psi(x) = \sqrt{\kappa}\,e^{-\kappa\abs{x}}. \]
        There is exactly one bound state.
        <br>(b) \(P = 2\kappa\int_0^{1/\kappa} e^{-2\kappa x}\,\dd x = 1 - e^{-2} \approx 0.865\).
        <br>(c) \(\abs{E} = \dfrac{\alpha^2}{2(\hbar^2/m_e)} = \dfrac{(1\ \text{eV}\,\text{nm})^2}{2\times 0.0762\ \text{eV}\,\text{nm}^2} \approx 6.6\ \text{eV}\), and \(1/\kappa = (\hbar^2/m_e)/\alpha \approx 0.076\ \text{nm}\): an atomic-size bound state.
      ar: |
        (أ) من أجل \(x \ne 0\) لدينا \(\psi'' = \kappa^2\psi\) حيث \(\kappa = \sqrt{-2mE}/\hbar\). الحل القابل للاستنظام والمستمر هو \(\psi = B\,e^{-\kappa\abs{x}}\). ويعطي شرط قفزة المشتقة \(-2\kappa B = -\tfrac{2m\alpha}{\hbar^2}B\)، ومنه
        \[ \kappa = \frac{m\alpha}{\hbar^2}, \qquad E = -\frac{\hbar^2\kappa^2}{2m} = -\frac{m\alpha^2}{2\hbar^2}, \qquad \psi(x) = \sqrt{\kappa}\,e^{-\kappa\abs{x}}. \]
        توجد حالة ارتباط واحدة فقط.
        <br>(ب) \(P = 2\kappa\int_0^{1/\kappa} e^{-2\kappa x}\,\dd x = 1 - e^{-2} \approx 0.865\).
        <br>(ج) \(\abs{E} = \dfrac{\alpha^2}{2(\hbar^2/m_e)} = \dfrac{(1\ \text{eV}\,\text{nm})^2}{2\times 0.0762\ \text{eV}\,\text{nm}^2} \approx 6.6\ \text{eV}\)، و\(1/\kappa = (\hbar^2/m_e)/\alpha \approx 0.076\ \text{nm}\)، أي حالة ارتباط بحجم ذري.
  - title:
      en: Commutators and the time evolution of expectation values
      ar: المبدّلات والتطور الزمني للقيم المتوقعة
    difficulty: 2
    statement:
      en: |
        For a particle with Hamiltonian \(\hat H = \hat p^2/2m + V(\hat x)\): (a) show that \(\comm{\hat x}{\hat p} = i\hbar\); (b) compute \(\comm{\hat x}{\hat H}\) and \(\comm{\hat p}{\hat H}\); (c) use \(\dfrac{\dd\expval{Q}}{\dd t} = \dfrac{i}{\hbar}\expval{\comm{\hat H}{\hat Q}}\) to recover Ehrenfest's theorem; (d) deduce the uncertainty relation \(\sigma_x\sigma_H \ge \dfrac{\hbar}{2m}\abs{\expval{p}}\).
      ar: |
        لجسيم هاملتونيه \(\hat H = \hat p^2/2m + V(\hat x)\): (أ) بيّن أن \(\comm{\hat x}{\hat p} = i\hbar\)؛ (ب) احسب \(\comm{\hat x}{\hat H}\) و\(\comm{\hat p}{\hat H}\)؛ (ج) استعمل \(\dfrac{\dd\expval{Q}}{\dd t} = \dfrac{i}{\hbar}\expval{\comm{\hat H}{\hat Q}}\) لاسترجاع مبرهنة إهرنفست؛ (د) استنتج علاقة الارتياب \(\sigma_x\sigma_H \ge \dfrac{\hbar}{2m}\abs{\expval{p}}\).
    hint:
      en: 'Act on a test function \(f(x)\). Use \(\comm{A}{BC} = \comm{A}{B}C + B\comm{A}{C}\) and the generalised uncertainty principle \(\sigma_A\sigma_B \ge \abs{\expval{\comm{A}{B}}/2i}\).'
      ar: 'طبّق المؤثرات على دالة اختبار \(f(x)\). استعمل \(\comm{A}{BC} = \comm{A}{B}C + B\comm{A}{C}\) ومبدأ الارتياب المعمَّم \(\sigma_A\sigma_B \ge \abs{\expval{\comm{A}{B}}/2i}\).'
    solution:
      en: |
        (a) \(\comm{\hat x}{\hat p}f = -i\hbar\big(xf' - (xf)'\big) = -i\hbar(xf' - f - xf') = i\hbar f\), so \(\comm{\hat x}{\hat p} = i\hbar\).
        <br>(b) \(\comm{\hat x}{\hat p^2} = \comm{\hat x}{\hat p}\hat p + \hat p\comm{\hat x}{\hat p} = 2i\hbar\hat p\), and \(\hat x\) commutes with \(V(\hat x)\), hence
        \[ \comm{\hat x}{\hat H} = \frac{i\hbar}{m}\hat p. \]
        Acting on \(f\): \(\comm{\hat p}{V}f = -i\hbar\big((Vf)' - Vf'\big) = -i\hbar V'f\), so \(\comm{\hat p}{\hat H} = -i\hbar\,V'(\hat x)\).
        <br>(c) \(\dfrac{\dd\expval{x}}{\dd t} = \dfrac{i}{\hbar}\Big(-\dfrac{i\hbar}{m}\expval{p}\Big) = \dfrac{\expval{p}}{m}\) and \(\dfrac{\dd\expval{p}}{\dd t} = \dfrac{i}{\hbar}\big(i\hbar\expval{V'}\big) = -\expval{\dfrac{\partial V}{\partial x}}\) — Ehrenfest's theorem.
        <br>(d) \(\sigma_x\sigma_H \ge \Big|\dfrac{1}{2i}\dfrac{i\hbar}{m}\expval{p}\Big| = \dfrac{\hbar}{2m}\abs{\expval{p}}\). In a stationary state \(\sigma_H = 0\), which is consistent only because \(\expval{p} = 0\) there.
      ar: |
        (أ) \(\comm{\hat x}{\hat p}f = -i\hbar\big(xf' - (xf)'\big) = -i\hbar(xf' - f - xf') = i\hbar f\)، إذن \(\comm{\hat x}{\hat p} = i\hbar\).
        <br>(ب) \(\comm{\hat x}{\hat p^2} = \comm{\hat x}{\hat p}\hat p + \hat p\comm{\hat x}{\hat p} = 2i\hbar\hat p\)، و\(\hat x\) يتبادل مع \(V(\hat x)\)، ومنه
        \[ \comm{\hat x}{\hat H} = \frac{i\hbar}{m}\hat p. \]
        وبالتطبيق على \(f\): \(\comm{\hat p}{V}f = -i\hbar\big((Vf)' - Vf'\big) = -i\hbar V'f\)، إذن \(\comm{\hat p}{\hat H} = -i\hbar\,V'(\hat x)\).
        <br>(ج) \(\dfrac{\dd\expval{x}}{\dd t} = \dfrac{i}{\hbar}\Big(-\dfrac{i\hbar}{m}\expval{p}\Big) = \dfrac{\expval{p}}{m}\) و\(\dfrac{\dd\expval{p}}{\dd t} = \dfrac{i}{\hbar}\big(i\hbar\expval{V'}\big) = -\expval{\dfrac{\partial V}{\partial x}}\)، وهذه مبرهنة إهرنفست.
        <br>(د) \(\sigma_x\sigma_H \ge \Big|\dfrac{1}{2i}\dfrac{i\hbar}{m}\expval{p}\Big| = \dfrac{\hbar}{2m}\abs{\expval{p}}\). في الحالة المستقرة يكون \(\sigma_H = 0\)، وهذا متّسق فقط لأن \(\expval{p} = 0\) فيها.
  - title:
      en: Spin-1/2 measurements and the hydrogen ground state
      ar: قياسات اللف المغزلي النصفي والحالة الأساسية للهيدروجين
    difficulty: 3
    statement:
      en: |
        (a) An electron is in the spin state \(\chi = A\begin{pmatrix} 3i \\ 4 \end{pmatrix}\). Normalise it, find the probabilities of \(\pm\hbar/2\) for \(S_z\) and for \(S_x\), and compute \(\expval{S_x}\), \(\expval{S_y}\), \(\expval{S_z}\).
        <br>(b) In the hydrogen ground state \(\psi_{100} = e^{-r/a}/\sqrt{\pi a^3}\), find the most probable radius, \(\expval{r}\), and the probability that the electron lies inside the Bohr radius \(a\).
      ar: |
        (أ) إلكترون في حالة اللف المغزلي \(\chi = A\begin{pmatrix} 3i \\ 4 \end{pmatrix}\). استنظِم هذه الحالة، وأوجد احتمالي القيمتين \(\pm\hbar/2\) لكل من \(S_z\) و\(S_x\)، واحسب \(\expval{S_x}\) و\(\expval{S_y}\) و\(\expval{S_z}\).
        <br>(ب) في الحالة الأساسية للهيدروجين \(\psi_{100} = e^{-r/a}/\sqrt{\pi a^3}\)، أوجد نصف القطر الأكثر احتمالًا، و\(\expval{r}\)، واحتمال وجود الإلكترون داخل نصف قطر بور \(a\).
    hint:
      en: '\(S_i = \tfrac{\hbar}{2}\sigma_i\); the eigenvectors of \(S_x\) are \(\tfrac{1}{\sqrt2}(1,\pm1)^T\). The radial density is \(P(r) = 4\pi r^2\abs{\psi}^2\); use \(\int_0^\infty r^n e^{-\beta r}\dd r = n!/\beta^{n+1}\).'
      ar: '\(S_i = \tfrac{\hbar}{2}\sigma_i\)؛ والمتجهان الذاتيان لـ \(S_x\) هما \(\tfrac{1}{\sqrt2}(1,\pm1)^T\). كثافة الاحتمال القطرية \(P(r) = 4\pi r^2\abs{\psi}^2\)؛ استعمل \(\int_0^\infty r^n e^{-\beta r}\dd r = n!/\beta^{n+1}\).'
    solution:
      en: |
        (a) \(\abs{A}^2(9+16) = 1 \Rightarrow A = 1/5\). For \(S_z\): \(P(+\hbar/2) = 9/25\), \(P(-\hbar/2) = 16/25\), so \(\expval{S_z} = \tfrac{\hbar}{2}\cdot\tfrac{9-16}{25} = -\tfrac{7\hbar}{50}\).
        For \(S_x\): \(c_\pm = \tfrac{1}{\sqrt2}\cdot\tfrac{3i\pm4}{5}\), so \(\abs{c_+}^2 = \abs{c_-}^2 = \tfrac{25}{50} = \tfrac12\) and \(\expval{S_x} = 0\).
        With \(\chi = (a,b)^T\), \(a = 3i/5\), \(b = 4/5\):
        \[ \expval{S_y} = \tfrac{\hbar}{2}\big(-i\,a^*b + i\,b^*a\big) = \tfrac{\hbar}{2}\Big(-\tfrac{12}{25} - \tfrac{12}{25}\Big) = -\tfrac{12\hbar}{25}. \]
        Check: \(\sqrt{\expval{S_x}^2 + \expval{S_y}^2 + \expval{S_z}^2} = \tfrac{\hbar}{50}\sqrt{0 + 24^2 + 7^2} = \tfrac{\hbar}{2}\), as it must for a pure spin-1/2 state.
        <br>(b) \(P(r) = \tfrac{4}{a^3}r^2e^{-2r/a}\). \(P'(r) = 0 \Rightarrow r_{\text{mp}} = a\).
        \[ \expval{r} = \frac{4}{a^3}\int_0^\infty r^3e^{-2r/a}\,\dd r = \frac{4}{a^3}\cdot\frac{3!}{(2/a)^4} = \frac{3a}{2}. \]
        With \(u = 2r/a\): \(P(r<a) = \tfrac12\int_0^2 u^2e^{-u}\,\dd u = \tfrac12\big[2 - 10e^{-2}\big] = 1 - 5e^{-2} \approx 0.323\). The electron spends about two-thirds of the time outside the Bohr radius.
      ar: |
        (أ) \(\abs{A}^2(9+16) = 1 \Rightarrow A = 1/5\). من أجل \(S_z\): \(P(+\hbar/2) = 9/25\) و\(P(-\hbar/2) = 16/25\)، إذن \(\expval{S_z} = \tfrac{\hbar}{2}\cdot\tfrac{9-16}{25} = -\tfrac{7\hbar}{50}\).
        ومن أجل \(S_x\): \(c_\pm = \tfrac{1}{\sqrt2}\cdot\tfrac{3i\pm4}{5}\)، ومنه \(\abs{c_+}^2 = \abs{c_-}^2 = \tfrac{25}{50} = \tfrac12\) و\(\expval{S_x} = 0\).
        ومع \(\chi = (a,b)^T\) حيث \(a = 3i/5\) و\(b = 4/5\):
        \[ \expval{S_y} = \tfrac{\hbar}{2}\big(-i\,a^*b + i\,b^*a\big) = \tfrac{\hbar}{2}\Big(-\tfrac{12}{25} - \tfrac{12}{25}\Big) = -\tfrac{12\hbar}{25}. \]
        للتحقق: \(\sqrt{\expval{S_x}^2 + \expval{S_y}^2 + \expval{S_z}^2} = \tfrac{\hbar}{50}\sqrt{0 + 24^2 + 7^2} = \tfrac{\hbar}{2}\)، كما يجب لحالة لف مغزلي نصفي نقية.
        <br>(ب) \(P(r) = \tfrac{4}{a^3}r^2e^{-2r/a}\). ومن \(P'(r) = 0\) نجد \(r_{\text{mp}} = a\).
        \[ \expval{r} = \frac{4}{a^3}\int_0^\infty r^3e^{-2r/a}\,\dd r = \frac{4}{a^3}\cdot\frac{3!}{(2/a)^4} = \frac{3a}{2}. \]
        وبوضع \(u = 2r/a\): \(P(r<a) = \tfrac12\int_0^2 u^2e^{-u}\,\dd u = \tfrac12\big[2 - 10e^{-2}\big] = 1 - 5e^{-2} \approx 0.323\). أي أن الإلكترون يقضي نحو ثلثي الوقت خارج نصف قطر بور.

quizzes:
  - title:
      en: The wavefunction
      ar: الدالة الموجية
    questions:
      - q:
          en: 'According to Born''s statistical interpretation, \(\abs{\Psi(x,t)}^2\,\dd x\) is'
          ar: 'وفق التفسير الإحصائي لبورن، المقدار \(\abs{\Psi(x,t)}^2\,\dd x\) هو'
        options:
          - { en: the charge of the particle between x and x + dx, ar: شحنة الجسيم بين x وx + dx }
          - { en: the probability of finding the particle between x and x + dx at time t, ar: احتمال وجود الجسيم بين x وx + dx في اللحظة t }
          - { en: the energy density of the matter wave, ar: كثافة طاقة الموجة المادية }
          - { en: the fraction of the particle located between x and x + dx, ar: جزء الجسيم الموجود بين x وx + dx }
        answer: 1
        explain:
          en: '\(\abs{\Psi}^2\) is a probability density. The particle is not smeared out: a position measurement always finds it whole at one point, with probability \(\abs{\Psi}^2\dd x\) of lying in \([x, x+\dd x]\).'
          ar: '\(\abs{\Psi}^2\) كثافة احتمال. الجسيم ليس موزّعًا في الفضاء؛ فقياس الموضع يجده كاملًا في نقطة واحدة، واحتمال وقوعه في \([x, x+\dd x]\) هو \(\abs{\Psi}^2\dd x\).'
      - q:
          en: A wavefunction normalised at t = 0 evolves according to the Schrödinger equation with a real potential. Then
          ar: دالة موجية مستنظمة عند t = 0 تتطور وفق معادلة شرودنغر بجهد حقيقي. عندئذ
        options:
          - { en: it must be renormalised at every instant, ar: يجب إعادة استنظامها في كل لحظة }
          - { en: it stays normalised only for stationary states, ar: تبقى مستنظمة في الحالات المستقرة فقط }
          - { en: it stays normalised for all times, ar: تبقى مستنظمة في كل الأزمنة }
          - { en: its norm decreases exponentially, ar: يتناقص معيارها أسيًا }
        answer: 2
        explain:
          en: 'Using the Schrödinger equation one finds \(\frac{\dd}{\dd t}\int\abs{\Psi}^2\dd x = \frac{i\hbar}{2m}\big[\Psi^*\Psi_x - \Psi\Psi^*_x\big]_{-\infty}^{\infty} = 0\) for a normalisable \(\Psi\): probability is conserved.'
          ar: 'باستعمال معادلة شرودنغر نجد \(\frac{\dd}{\dd t}\int\abs{\Psi}^2\dd x = \frac{i\hbar}{2m}\big[\Psi^*\Psi_x - \Psi\Psi^*_x\big]_{-\infty}^{\infty} = 0\) لكل \(\Psi\) قابلة للاستنظام؛ فالاحتمال منحفظ.'
      - q:
          en: In the position representation the momentum operator is
          ar: في تمثيل الموضع يُكتب مؤثر الزخم على الشكل
        options:
          - '\(-i\hbar\,\partial/\partial x\)'
          - '\(i\hbar\,\partial/\partial x\)'
          - '\(-\hbar^2\,\partial^2/\partial x^2\)'
          - '\(m\,\dd x/\dd t\)'
        answer: 0
        explain:
          en: '\(\expval{p} = m\,\dd\expval{x}/\dd t = \int\Psi^*\big(-i\hbar\,\partial_x\big)\Psi\,\dd x\). The sign matters: \(-i\hbar\partial_x e^{ikx} = \hbar k\,e^{ikx}\), consistent with de Broglie.'
          ar: '\(\expval{p} = m\,\dd\expval{x}/\dd t = \int\Psi^*\big(-i\hbar\,\partial_x\big)\Psi\,\dd x\). والإشارة مهمة: \(-i\hbar\partial_x e^{ikx} = \hbar k\,e^{ikx}\)، بما يتّفق مع علاقة دي بروي.'
      - q:
          en: Heisenberg's uncertainty principle states that
          ar: ينص مبدأ الارتياب لهايزنبرغ على أن
        options:
          - '\(\sigma_x\sigma_p \ge \hbar\)'
          - '\(\sigma_x\sigma_p \ge h\)'
          - '\(\sigma_x\sigma_p = \hbar/2\)'
          - '\(\sigma_x\sigma_p \ge \hbar/2\)'
        answer: 3
        explain:
          en: 'The bound is \(\hbar/2\), and it is an inequality; equality is reached only by Gaussian wavefunctions (e.g. the oscillator ground state).'
          ar: 'الحدّ الأدنى هو \(\hbar/2\) وهي متراجحة؛ ولا تتحقق المساواة إلا للدوال الغاوسية (مثل الحالة الأساسية للمهتز التوافقي).'
      - q:
          en: 'For a real, normalisable wavefunction \(\psi(x)\) (no complex phase), the expectation value of momentum is'
          ar: 'من أجل دالة موجية حقيقية قابلة للاستنظام \(\psi(x)\) (دون طور مركب)، تكون القيمة المتوقعة للزخم'
        options:
          - { en: 'zero', ar: 'صفرًا' }
          - '\(\hbar k\)'
          - { en: 'positive, equal to \(\hbar/2\sigma_x\)', ar: 'موجبة وتساوي \(\hbar/2\sigma_x\)' }
          - { en: impossible to determine without more data, ar: غير قابلة للتحديد دون معطيات إضافية }
        answer: 0
        explain:
          en: '\(\expval{p} = -i\hbar\int\psi\psi''\,\dd x = -\tfrac{i\hbar}{2}\big[\psi^2\big]_{-\infty}^{\infty} = 0\). Also, a purely imaginary result for a Hermitian operator would be impossible, so it must vanish.'
          ar: '\(\expval{p} = -i\hbar\int\psi\psi''\,\dd x = -\tfrac{i\hbar}{2}\big[\psi^2\big]_{-\infty}^{\infty} = 0\). كما أن نتيجة تخيلية بحتة مستحيلة لمؤثر هرميتي، فلا بد أن تنعدم.'
  - title:
      en: One-dimensional potentials
      ar: الجهود أحادية البعد
    questions:
      - q:
          en: 'In an infinite square well, what is the ratio \(E_3/E_1\)?'
          ar: 'في البئر المربع اللانهائي، ما قيمة النسبة \(E_3/E_1\)؟'
        options: ['3', '9', '6', '27']
        answer: 1
        explain:
          en: '\(E_n = n^2\pi^2\hbar^2/2ma^2 \propto n^2\), so \(E_3/E_1 = 9\).'
          ar: '\(E_n = n^2\pi^2\hbar^2/2ma^2 \propto n^2\)، إذن \(E_3/E_1 = 9\).'
      - q:
          en: The energy of the first excited state of a harmonic oscillator of angular frequency ω is
          ar: طاقة الحالة المثارة الأولى لمهتز توافقي تردده الزاوي ω هي
        options:
          - '\(\hbar\omega\)'
          - '\(\hbar\omega/2\)'
          - '\(3\hbar\omega/2\)'
          - '\(2\hbar\omega\)'
        answer: 2
        explain:
          en: '\(E_n = (n+\tfrac12)\hbar\omega\); the first excited state has \(n = 1\), so \(E_1 = \tfrac32\hbar\omega\).'
          ar: '\(E_n = (n+\tfrac12)\hbar\omega\)؛ والحالة المثارة الأولى توافق \(n = 1\)، إذن \(E_1 = \tfrac32\hbar\omega\).'
      - q:
          en: 'Why is the plane wave \(e^{i(kx-\omega t)}\) not a physically realisable state of a free particle?'
          ar: 'لماذا لا تمثل الموجة المستوية \(e^{i(kx-\omega t)}\) حالة فيزيائية ممكنة لجسيم حر؟'
        options:
          - { en: It does not satisfy the Schrödinger equation, ar: لأنها لا تحقق معادلة شرودنغر }
          - { en: Its energy is negative, ar: لأن طاقتها سالبة }
          - { en: Its velocity exceeds the speed of light, ar: لأن سرعتها تتجاوز سرعة الضوء }
          - { en: It cannot be normalised; physical states are wave packets, ar: لأنها غير قابلة للاستنظام؛ والحالات الفيزيائية حزم موجية }
        answer: 3
        explain:
          en: '\(\int\abs{e^{ikx}}^2\dd x\) diverges. Plane waves are useful as a basis, but a real particle is a superposition \(\int\phi(k)e^{i(kx-\omega t)}\dd k\) — a normalisable wave packet.'
          ar: 'التكامل \(\int\abs{e^{ikx}}^2\dd x\) متباعد. الموجات المستوية مفيدة كأساس، لكن الجسيم الحقيقي تراكب \(\int\phi(k)e^{i(kx-\omega t)}\dd k\)، أي حزمة موجية قابلة للاستنظام.'
      - q:
          en: 'How many bound states does the attractive delta potential \(V(x) = -\alpha\delta(x)\) have?'
          ar: 'كم حالة ارتباط يملك جهد دلتا الجاذب \(V(x) = -\alpha\delta(x)\)؟'
        options:
          - { en: Exactly one, ar: حالة واحدة بالضبط }
          - { en: None, ar: لا شيء }
          - { en: Infinitely many, ar: عدد لانهائي }
          - { en: It depends on α, ar: يتوقف على α }
        answer: 0
        explain:
          en: 'The derivative-jump condition fixes \(\kappa = m\alpha/\hbar^2\) uniquely, giving the single bound state \(E = -m\alpha^2/2\hbar^2\) for any \(\alpha > 0\).'
          ar: 'شرط قفزة المشتقة يحدد \(\kappa = m\alpha/\hbar^2\) بشكل وحيد، فنحصل على حالة ارتباط وحيدة \(E = -m\alpha^2/2\hbar^2\) مهما كانت \(\alpha > 0\).'
      - q:
          en: In a one-dimensional finite square well,
          ar: في البئر المربع المتناهي أحادي البعد
        options:
          - { en: there may be no bound state if the well is too shallow, ar: قد لا توجد أي حالة ارتباط إذا كان البئر ضحلًا جدًا }
          - { en: there is always at least one (even) bound state, ar: توجد دائمًا حالة ارتباط واحدة (زوجية) على الأقل }
          - { en: the number of bound states is always infinite, ar: عدد حالات الارتباط لانهائي دائمًا }
          - { en: the bound wavefunctions vanish outside the well, ar: تنعدم دوال الارتباط الموجية خارج البئر }
        answer: 1
        explain:
          en: 'In 1D any attractive well binds: the even-state condition \(\tan z = \sqrt{(z_0/z)^2 - 1}\) always has a root. The number of states grows with \(z_0 = (a/\hbar)\sqrt{2mV_0}\), and the wavefunctions leak (decay exponentially) outside.'
          ar: 'في بعد واحد يربط كل بئر جاذب جسيمًا: شرط الحالات الزوجية \(\tan z = \sqrt{(z_0/z)^2 - 1}\) له دائمًا جذر. ويزداد عدد الحالات مع \(z_0 = (a/\hbar)\sqrt{2mV_0}\)، وتتسرّب الدوال الموجية خارج البئر (تتناقص أسيًا).'
  - title:
      en: The formalism
      ar: الصياغة الرياضية
    questions:
      - q:
          en: The eigenvalues of a Hermitian operator are
          ar: القيم الذاتية لمؤثر هرميتي تكون
        options:
          - { en: always positive, ar: موجبة دائمًا }
          - { en: purely imaginary, ar: تخيلية بحتة }
          - { en: real, ar: حقيقية }
          - { en: integers, ar: أعدادًا صحيحة }
        answer: 2
        explain:
          en: 'If \(\hat Q f = qf\), then \(q\braket{f}{f} = \braket{f}{\hat Qf} = \braket{\hat Qf}{f} = q^*\braket{f}{f}\), so \(q = q^*\). This is why observables are Hermitian.'
          ar: 'إذا كان \(\hat Q f = qf\) فإن \(q\braket{f}{f} = \braket{f}{\hat Qf} = \braket{\hat Qf}{f} = q^*\braket{f}{f}\)، ومنه \(q = q^*\). ولهذا تُمثَّل المقادير القابلة للرصد بمؤثرات هرميتية.'
      - q:
          en: Eigenfunctions of a Hermitian operator belonging to distinct eigenvalues are
          ar: الدوال الذاتية لمؤثر هرميتي المرافقة لقيم ذاتية مختلفة تكون
        options:
          - { en: orthogonal, ar: متعامدة }
          - { en: parallel, ar: متوازية }
          - { en: identical up to a phase, ar: متطابقة بغض النظر عن طور }
          - { en: not normalisable, ar: غير قابلة للاستنظام }
        answer: 0
        explain:
          en: '\(q\braket{g}{f} = \braket{g}{\hat Qf} = \braket{\hat Qg}{f} = q''\braket{g}{f}\); with \(q \ne q''\) this forces \(\braket{g}{f} = 0\).'
          ar: '\(q\braket{g}{f} = \braket{g}{\hat Qf} = \braket{\hat Qg}{f} = q''\braket{g}{f}\)؛ ومع \(q \ne q''\) يجب أن يكون \(\braket{g}{f} = 0\).'
      - q:
          en: 'The commutator \(\comm{\hat x}{\hat p}\) equals'
          ar: 'المبدّل \(\comm{\hat x}{\hat p}\) يساوي'
        options:
          - '\(0\)'
          - '\(-i\hbar\)'
          - '\(\hbar\)'
          - '\(i\hbar\)'
        answer: 3
        explain:
          en: 'Acting on a test function: \(\comm{\hat x}{\hat p}f = -i\hbar(xf'' - (xf)'') = i\hbar f\). The non-zero commutator is the root of \(\sigma_x\sigma_p \ge \hbar/2\).'
          ar: 'بالتطبيق على دالة اختبار: \(\comm{\hat x}{\hat p}f = -i\hbar(xf'' - (xf)'') = i\hbar f\). وهذا المبدّل غير المنعدم أصل العلاقة \(\sigma_x\sigma_p \ge \hbar/2\).'
      - q:
          en: 'A measurement of observable Q on the state \(\sum_n c_n f_n\) gives the eigenvalue \(q_2\). An immediate second measurement of Q gives'
          ar: 'قياس للمقدار Q على الحالة \(\sum_n c_n f_n\) أعطى القيمة الذاتية \(q_2\). قياس ثانٍ فوري لـ Q يعطي'
        options:
          - { en: '\(q_n\) with probability \(\abs{c_n}^2\)', ar: '\(q_n\) باحتمال \(\abs{c_n}^2\)' }
          - { en: '\(q_2\) with certainty', ar: '\(q_2\) بشكل مؤكد' }
          - '\(\expval{Q}\)'
          - { en: a random eigenvalue with equal probabilities, ar: قيمة ذاتية عشوائية باحتمالات متساوية }
        answer: 1
        explain:
          en: 'The first measurement collapses the state onto \(f_2\) (a determinate state of Q). Repeating the measurement at once must give the same value \(q_2\).'
          ar: 'القياس الأول يُسقط الحالة على \(f_2\) (حالة محدَّدة لـ Q). وتكرار القياس فورًا يجب أن يعطي القيمة نفسها \(q_2\).'
      - q:
          en: 'In Dirac notation, the complex conjugate of \(\braket{\alpha}{\beta}\) is'
          ar: 'في ترميز ديراك، المرافق المركب لـ \(\braket{\alpha}{\beta}\) هو'
        options:
          - '\(\braket{\alpha}{\beta}\)'
          - '\(-\braket{\alpha}{\beta}\)'
          - '\(\braket{\beta}{\alpha}\)'
          - '\(\ket{\beta}\bra{\alpha}\)'
        answer: 2
        explain:
          en: 'The inner product is Hermitian-symmetric: \(\braket{\alpha}{\beta}^* = \braket{\beta}{\alpha}\). The last option is an operator, not a number.'
          ar: 'الجداء الداخلي متناظر هرميتيًا: \(\braket{\alpha}{\beta}^* = \braket{\beta}{\alpha}\). أما الخيار الأخير فهو مؤثر وليس عددًا.'
  - title:
      en: Quantum mechanics in three dimensions
      ar: ميكانيكا الكم في ثلاثة أبعاد
    questions:
      - q:
          en: The energy of the n = 2 level of hydrogen is
          ar: طاقة المستوى n = 2 في ذرة الهيدروجين هي
        options:
          - '\(-6.8\ \text{eV}\)'
          - '\(-3.4\ \text{eV}\)'
          - '\(-1.51\ \text{eV}\)'
          - '\(-13.6\ \text{eV}\)'
        answer: 1
        explain:
          en: '\(E_n = -13.6\ \text{eV}/n^2\), so \(E_2 = -13.6/4 = -3.4\ \text{eV}\).'
          ar: '\(E_n = -13.6\ \text{eV}/n^2\)، إذن \(E_2 = -13.6/4 = -3.4\ \text{eV}\).'
      - q:
          en: Ignoring spin, what is the degeneracy of the n = 3 level of hydrogen?
          ar: مع إهمال اللف المغزلي، ما درجة انحلال المستوى n = 3 في ذرة الهيدروجين؟
        options: ['3', '6', '9', '18']
        answer: 2
        explain:
          en: 'For each \(n\), \(l = 0,\dots,n-1\) and \(m = -l,\dots,l\): \(\sum_{l=0}^{n-1}(2l+1) = n^2 = 9\). Including spin it would be \(2n^2 = 18\).'
          ar: 'لكل \(n\) تأخذ \(l\) القيم \(0,\dots,n-1\) وتأخذ \(m\) القيم \(-l,\dots,l\): \(\sum_{l=0}^{n-1}(2l+1) = n^2 = 9\). ومع احتساب اللف المغزلي يصبح \(2n^2 = 18\).'
      - q:
          en: 'The eigenvalue of \(L^2\) for a state with \(l = 2\) is'
          ar: 'القيمة الذاتية لـ \(L^2\) لحالة ذات \(l = 2\) هي'
        options:
          - '\(6\hbar^2\)'
          - '\(4\hbar^2\)'
          - '\(2\hbar^2\)'
          - '\(5\hbar^2\)'
        answer: 0
        explain:
          en: '\(L^2 Y_l^m = \hbar^2 l(l+1) Y_l^m\); for \(l = 2\) this is \(6\hbar^2\). The maximum \(L_z\) is only \(2\hbar\), so \(\vb{L}\) can never point exactly along \(z\).'
          ar: '\(L^2 Y_l^m = \hbar^2 l(l+1) Y_l^m\)؛ ومن أجل \(l = 2\) نجد \(6\hbar^2\). وأكبر قيمة لـ \(L_z\) هي \(2\hbar\) فقط، لذا لا يمكن أن يتجه \(\vb{L}\) تمامًا على المحور \(z\).'
      - q:
          en: 'The commutator \(\comm{L_x}{L_y}\) equals'
          ar: 'المبدّل \(\comm{L_x}{L_y}\) يساوي'
        options:
          - '\(0\)'
          - '\(i\hbar L_x\)'
          - '\(\hbar L_z\)'
          - '\(i\hbar L_z\)'
        answer: 3
        explain:
          en: 'The components obey \(\comm{L_x}{L_y} = i\hbar L_z\) (and cyclic permutations), so they are incompatible observables; only \(L^2\) and one component can be measured simultaneously.'
          ar: 'تحقق المركبات \(\comm{L_x}{L_y} = i\hbar L_z\) (مع التبديلات الدورية)، فهي مقادير غير متوافقة؛ ولا يمكن قياس سوى \(L^2\) ومركبة واحدة في آن واحد.'
      - q:
          en: 'For a spin-1/2 particle, the eigenvalue of \(S^2\) is'
          ar: 'من أجل جسيم ذي لف مغزلي نصفي، القيمة الذاتية لـ \(S^2\) هي'
        options:
          - '\(\hbar^2/4\)'
          - '\(3\hbar^2/4\)'
          - '\(\hbar^2/2\)'
          - '\(\hbar^2\)'
        answer: 1
        explain:
          en: '\(S^2 = \hbar^2 s(s+1)\) with \(s = 1/2\): \(\tfrac12\cdot\tfrac32\hbar^2 = \tfrac34\hbar^2\). Equivalently \(S^2 = \tfrac{\hbar^2}{4}(\sigma_x^2 + \sigma_y^2 + \sigma_z^2) = \tfrac{3\hbar^2}{4}\).'
          ar: '\(S^2 = \hbar^2 s(s+1)\) مع \(s = 1/2\): \(\tfrac12\cdot\tfrac32\hbar^2 = \tfrac34\hbar^2\). أو بطريقة مكافئة \(S^2 = \tfrac{\hbar^2}{4}(\sigma_x^2 + \sigma_y^2 + \sigma_z^2) = \tfrac{3\hbar^2}{4}\).'


  ar: 'رياضيات وفيزياء المرحلة الثانوية (الجبر، حساب المثلثات، مبادئ الميكانيكا). يُستعمل الاشتقاق والتكامل البسيطان ابتداءً من الأسبوع الثالث، ويمكن دراستهما بالتوازي مع المقرر.'

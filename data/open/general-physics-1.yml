glossary:
  - { en: 'Displacement', ar: 'الإزاحة', fr: 'Déplacement', def: { en: 'Change in position vector, \(\Delta\vec r = \vec r_f - \vec r_i\); independent of the path followed.', ar: 'تغيّر متجه الموضع \(\Delta\vec r = \vec r_f - \vec r_i\)، وهو مستقل عن المسار المتّبع.' } }
  - { en: 'Velocity', ar: 'السرعة المتجهة', fr: 'Vitesse', def: { en: 'Time derivative of the position vector, \(\vec v = \dd\vec r/\dd t\); tangent to the trajectory.', ar: 'مشتق متجه الموضع بالنسبة للزمن \(\vec v = \dd\vec r/\dd t\)، وهي مماسة للمسار.' } }
  - { en: 'Acceleration', ar: 'التسارع', fr: 'Accélération', def: { en: 'Rate of change of velocity, \(\vec a = \dd\vec v/\dd t\).', ar: 'معدل تغيّر السرعة بالنسبة للزمن \(\vec a = \dd\vec v/\dd t\).' } }
  - { en: 'Vector', ar: 'المتجه', fr: 'Vecteur', def: { en: 'Quantity with magnitude and direction that adds by the parallelogram rule.', ar: 'مقدار له طويلة واتجاه، ويُجمع وفق قاعدة متوازي الأضلاع.' } }
  - { en: 'Scalar', ar: 'الكمية العددية', fr: 'Grandeur scalaire', def: { en: 'Quantity fully described by a number and a unit (mass, energy, time).', ar: 'مقدار يُعرَّف كليًا بعدد ووحدة (الكتلة، الطاقة، الزمن).' } }
  - { en: 'Dimensional analysis', ar: 'التحليل البعدي', fr: 'Analyse dimensionnelle', def: { en: 'Checking or deriving relations by requiring both sides to have the same dimensions (M, L, T…).', ar: 'التحقق من العلاقات أو استنتاجها باشتراط تساوي أبعاد الطرفين (M وL وT…).' } }
  - { en: 'Significant figures', ar: 'الأرقام المعنوية', fr: 'Chiffres significatifs', def: { en: 'Digits of a measured value that are known reliably, plus the first uncertain digit.', ar: 'أرقام القيمة المقيسة المعروفة بثقة، مضافًا إليها أول رقم مشكوك فيه.' } }
  - { en: 'Projectile motion', ar: 'حركة المقذوفات', fr: 'Mouvement d''un projectile', def: { en: 'Motion under gravity alone: uniform horizontally, uniformly accelerated vertically; the path is a parabola.', ar: 'حركة تحت تأثير الثقالة وحدها: منتظمة أفقيًا ومتغيرة بانتظام عموديًا، ومسارها قطع مكافئ.' } }
  - { en: 'Centripetal acceleration', ar: 'التسارع المركزي', fr: 'Accélération centripète', def: { en: 'Acceleration \(v^2/r\) directed towards the centre of a circular path.', ar: 'تسارع مقداره \(v^2/r\) يتجه نحو مركز المسار الدائري.' } }
  - { en: 'Relative velocity', ar: 'السرعة النسبية', fr: 'Vitesse relative', def: { en: 'Velocity measured in a moving frame: \(\vec v_{A/B} = \vec v_{A/O} - \vec v_{B/O}\) (Galilean addition).', ar: 'السرعة المقيسة في معلم متحرك: \(\vec v_{A/B} = \vec v_{A/O} - \vec v_{B/O}\) (جمع غاليليو).' } }
  - { en: 'Inertia', ar: 'القصور الذاتي', fr: 'Inertie', def: { en: 'Tendency of a body to keep its state of rest or uniform motion; measured by its mass.', ar: 'ميل الجسم إلى الحفاظ على حالة السكون أو الحركة المنتظمة، وتقاس بالكتلة.' } }
  - { en: 'Newton''s second law', ar: 'قانون نيوتن الثاني', fr: 'Principe fondamental de la dynamique', def: { en: '\(\sum\vec F = \dd\vec p/\dd t = m\vec a\) in an inertial frame.', ar: '\(\sum\vec F = \dd\vec p/\dd t = m\vec a\) في معلم عطالي.' } }
  - { en: 'Normal force', ar: 'رد الفعل العمودي', fr: 'Réaction normale', def: { en: 'Contact force exerted by a surface, perpendicular to it.', ar: 'قوة تلامس يؤثر بها سطح على جسم، وتكون عمودية على السطح.' } }
  - { en: 'Coefficient of friction', ar: 'معامل الاحتكاك', fr: 'Coefficient de frottement', def: { en: 'Ratio \(\mu = f/N\); static friction obeys \(f_s \le \mu_s N\), kinetic friction \(f_k = \mu_k N\).', ar: 'النسبة \(\mu = f/N\)؛ الاحتكاك السكوني يحقق \(f_s \le \mu_s N\) والحركي \(f_k = \mu_k N\).' } }
  - { en: 'Free-body diagram', ar: 'مخطط الجسم الحر', fr: 'Bilan des forces', def: { en: 'Sketch of one isolated body showing every external force acting on it.', ar: 'رسم لجسم معزول تظهر عليه جميع القوى الخارجية المؤثرة فيه.' } }
  - { en: 'Work', ar: 'الشغل', fr: 'Travail', def: { en: 'Energy transferred by a force: \(W = \int \vec F\cdot \dd\vec r\).', ar: 'الطاقة المنقولة بواسطة قوة: \(W = \int \vec F\cdot \dd\vec r\).' } }
  - { en: 'Kinetic energy', ar: 'الطاقة الحركية', fr: 'Énergie cinétique', def: { en: 'Energy of motion, \(K = \tfrac12 m v^2\); its change equals the net work (work–energy theorem).', ar: 'طاقة الحركة \(K = \tfrac12 m v^2\)، وتغيّرها يساوي الشغل الكلي (مبرهنة الشغل والطاقة).' } }
  - { en: 'Potential energy', ar: 'طاقة الوضع', fr: 'Énergie potentielle', def: { en: 'Energy of configuration associated with a conservative force, \(F_x = -\dd U/\dd x\).', ar: 'طاقة مرتبطة بالتشكيل وبقوة محافظة، حيث \(F_x = -\dd U/\dd x\).' } }
  - { en: 'Conservative force', ar: 'القوة المحافظة', fr: 'Force conservative', def: { en: 'Force whose work is path-independent (gravity, spring force).', ar: 'قوة لا يتعلق شغلها بالمسار (الثقالة، قوة النابض).' } }
  - { en: 'Power', ar: 'القدرة', fr: 'Puissance', def: { en: 'Rate of energy transfer, \(P = \dd W/\dd t = \vec F\cdot\vec v\); unit: watt.', ar: 'معدل نقل الطاقة \(P = \dd W/\dd t = \vec F\cdot\vec v\)، ووحدتها الواط.' } }
  - { en: 'Linear momentum', ar: 'الزخم الخطي (كمية الحركة)', fr: 'Quantité de mouvement', def: { en: '\(\vec p = m\vec v\); conserved for an isolated system.', ar: '\(\vec p = m\vec v\)، وهو محفوظ في النظام المعزول.' } }
  - { en: 'Impulse', ar: 'الدفع', fr: 'Impulsion', def: { en: '\(\vec J = \int\vec F\,\dd t = \Delta\vec p\).', ar: '\(\vec J = \int\vec F\,\dd t = \Delta\vec p\).' } }
  - { en: 'Elastic collision', ar: 'التصادم المرن', fr: 'Choc élastique', def: { en: 'Collision in which total kinetic energy as well as momentum is conserved.', ar: 'تصادم تُحفظ فيه الطاقة الحركية الكلية إضافة إلى الزخم الخطي.' } }
  - { en: 'Centre of mass', ar: 'مركز الكتلة', fr: 'Centre de masse', def: { en: 'Point \(\vec r_{cm} = \sum m_i\vec r_i/M\) that moves as if all external forces acted on the total mass there.', ar: 'النقطة \(\vec r_{cm} = \sum m_i\vec r_i/M\) التي تتحرك كأن الكتلة الكلية متمركزة فيها وتؤثر عليها كل القوى الخارجية.' } }
  - { en: 'Torque', ar: 'عزم القوة', fr: 'Moment d''une force', def: { en: '\(\vec\tau = \vec r\times\vec F\); the rotational effect of a force about a point.', ar: '\(\vec\tau = \vec r\times\vec F\)، وهو الأثر الدوراني لقوة حول نقطة.' } }
  - { en: 'Moment of inertia', ar: 'عزم القصور الذاتي', fr: 'Moment d''inertie', def: { en: '\(I = \sum m_i r_i^2\); resistance of a body to angular acceleration about an axis.', ar: '\(I = \sum m_i r_i^2\)، ويقيس ممانعة الجسم للتسارع الزاوي حول محور.' } }
  - { en: 'Angular momentum', ar: 'الزخم الزاوي', fr: 'Moment cinétique', def: { en: '\(\vec L = \vec r\times\vec p\); for a rigid body about a fixed axis \(L = I\omega\). Conserved when the net external torque is zero.', ar: '\(\vec L = \vec r\times\vec p\)؛ ولجسم صلب حول محور ثابت \(L = I\omega\). يُحفظ عندما ينعدم العزم الخارجي الكلي.' } }
  - { en: 'Universal gravitation', ar: 'الجذب العام', fr: 'Gravitation universelle', def: { en: 'Attraction between any two masses, \(F = G m_1 m_2/r^2\).', ar: 'تجاذب بين أي كتلتين \(F = G m_1 m_2/r^2\).' } }
  - { en: 'Escape speed', ar: 'سرعة الإفلات', fr: 'Vitesse de libération', def: { en: 'Minimum launch speed to escape a planet''s gravity, \(v_{esc} = \sqrt{2GM/R}\) (about 11.2 km/s for Earth).', ar: 'أدنى سرعة إطلاق للإفلات من جاذبية كوكب \(v_{esc} = \sqrt{2GM/R}\) (نحو 11.2 km/s للأرض).' } }
  - { en: 'Simple harmonic motion', ar: 'الحركة التوافقية البسيطة', fr: 'Mouvement harmonique simple', def: { en: 'Oscillation with \(x(t) = A\cos(\omega t + \phi)\), caused by a restoring force proportional to displacement; \(\omega = \sqrt{k/m}\).', ar: 'اهتزاز وفق \(x(t) = A\cos(\omega t + \phi)\) ناتج عن قوة إرجاع متناسبة مع الإزاحة؛ \(\omega = \sqrt{k/m}\).' } }


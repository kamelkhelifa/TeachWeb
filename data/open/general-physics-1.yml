notes: >
  Merged from two first-year mechanics pages: an English calculus-based course (PHYS 101, Serway
  chapter order, slides + problem sets + solutions + lab manual + three past tests) and a French
  first-year mechanics course (UEF 112: lecture notes, 4 TD sheets, 5 lab sheets, one test). The
  "Circular motion" slides were moved from their original position (after momentum) to week 7, next
  to Newton's-law applications, following Serway ch. 6. The PHYS 101 description mentions fluids and
  simple harmonic motion, which had no slides; SHM appears briefly in week 14, fluids were dropped.
  Links to student mark lists were deliberately not kept (personal data). Description, CLOs, assessment
  weights, weekly readings (Serway 9th ed.), quizzes, worked problems and glossary were written new.
  Please check: Fundamentals of Physics edition/year (source says 2011) and Halliday-Resnick-Krane year.

description:
  en: |
    <p>This is the first semester of the calculus-based introductory physics sequence. It builds the language of physics — units, dimensions, orders of magnitude, uncertainties and vectors — and then develops classical mechanics of a particle and of a rigid body: kinematics in one and two dimensions, Newton's laws and their applications, work and energy, linear momentum and collisions, rotation, angular momentum and universal gravitation.</p>
    <p>The emphasis is on <strong>modelling</strong>: choosing a system, drawing a free-body diagram, identifying which conservation law applies and checking the answer by dimensions and limiting cases. Weekly tutorial sessions train problem solving, and the laboratory sessions (rectilinear and circular motion, motion in the gravitational field, friction, energy transfer) introduce measurement, graphs and error analysis.</p>
    <p>Course materials exist in English and French: slides and problem sets with solutions follow the chapter order of Serway &amp; Jewett, while the French lecture notes, tutorial sheets (TD) and lab sheets (TP) cover the same programme in the French tradition (kinematics in several coordinate systems, relative motion, energy and collisions).</p>
  ar: |
    <p>هذا المقرر هو الفصل الأول من سلسلة الفيزياء التمهيدية القائمة على التفاضل والتكامل. يبدأ ببناء لغة الفيزياء — الوحدات والأبعاد ورتب المقادير والارتيابات والمتجهات — ثم يتناول الميكانيكا الكلاسيكية للجسيم وللجسم الصلب: الحركة في بعد واحد وفي بعدين، وقوانين نيوتن وتطبيقاتها، والشغل والطاقة، والزخم الخطي والتصادمات، والحركة الدورانية، والزخم الزاوي، والجذب العام.</p>
    <p>ينصبّ التركيز على <strong>النمذجة</strong>: اختيار النظام، ورسم مخطط الجسم الحر، وتحديد قانون الحفظ المناسب، ثم التحقق من النتيجة بالتحليل البعدي والحالات الحدّية. تُدرِّب حصص التمارين الأسبوعية على حل المسائل، وتُعرِّف حصص المختبر (الحركة المستقيمة والدائرية، الحركة في حقل الثقالة، الاحتكاك، تحويل الطاقة) بالقياس والتمثيل البياني وحساب الأخطاء.</p>
    <p>تتوفر مواد المقرر بالإنجليزية والفرنسية: تتبع الشرائح وسلاسل المسائل وحلولها ترتيب فصول كتاب Serway &amp; Jewett، في حين تغطي المطبوعة الفرنسية وسلاسل الأعمال الموجهة (TD) والأعمال التطبيقية (TP) البرنامج نفسه وفق التقليد الفرنسي (الحركة في جمل إحداثيات مختلفة، الحركة النسبية، الطاقة والتصادمات).</p>


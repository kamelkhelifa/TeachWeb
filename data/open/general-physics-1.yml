exam_guide:
  format:
    en: 'Midterms last 75 minutes: about five conceptual multiple-choice questions followed by two or three problems. The final exam lasts 2 hours and covers the whole course with 8–10 MCQs and 4–5 multi-step problems; partial credit is given for a correct method, diagram and units.'
    ar: 'مدة كل اختبار دوري 75 دقيقة: نحو خمسة أسئلة مفاهيمية من نوع الاختيار من متعدد تليها مسألتان أو ثلاث. مدة الاختبار النهائي ساعتان ويغطي المقرر كاملًا بـ 8–10 أسئلة اختيار من متعدد و4–5 مسائل متعددة الخطوات؛ تُمنح علامات جزئية على المنهجية الصحيحة والمخطط والوحدات.'
  allowed:
    en: 'A non-programmable scientific calculator. A formula sheet is provided with the paper; personal notes and phones are not allowed. Use \(g = 9.8\ \mathrm{m/s^2}\) unless stated otherwise.'
    ar: 'آلة حاسبة علمية غير قابلة للبرمجة. تُرفق ورقة صيغ مع ورقة الأسئلة، ولا يُسمح بالملاحظات الشخصية ولا بالهواتف. استعمل \(g = 9.8\ \mathrm{m/s^2}\) ما لم يُذكر خلاف ذلك.'
  tips:
    - en: 'Start every dynamics problem with a clear free-body diagram and a chosen sign convention.'
      ar: 'ابدأ كل مسألة تحريك بمخطط واضح للجسم الحر وباختيار صريح لاتجاه المحاور والإشارات.'
    - en: 'Before writing equations, ask: is energy conserved? is momentum conserved? This often decides the shortest route.'
      ar: 'قبل كتابة المعادلات اسأل نفسك: هل الطاقة محفوظة؟ هل الزخم الخطي محفوظ؟ فهذا يحدد غالبًا أقصر طريق للحل.'
    - en: 'Solve symbolically first and substitute numbers at the end; then check the dimensions and a limiting case.'
      ar: 'حلّ رمزيًا أولًا وعوّض بالأرقام في النهاية، ثم تحقق من الأبعاد ومن حالة حدّية.'
    - en: 'Give final answers with units and a sensible number of significant figures.'
      ar: 'اكتب النتائج النهائية مع وحداتها وبعدد معقول من الأرقام المعنوية.'
    - en: 'Practise with the past papers below under timed conditions before reading the solutions.'
      ar: 'تدرّب على الاختبارات السابقة أدناه في زمن محدد قبل الاطلاع على حلولها.'

problems:
  - title: { en: 'Catching a speeding car', ar: 'اللحاق بسيارة مسرعة' }
    difficulty: 1
    statement:
      en: 'A car travelling at a constant \(25\ \mathrm{m/s}\) passes a police car at rest. At that instant the police car starts with a constant acceleration of \(2.5\ \mathrm{m/s^2}\). (a) When does it catch the car? (b) How far has it travelled? (c) What is its speed at that moment?'
      ar: 'تمر سيارة تسير بسرعة ثابتة \(25\ \mathrm{m/s}\) بجانب سيارة شرطة متوقفة. في تلك اللحظة تنطلق سيارة الشرطة بتسارع ثابت \(2.5\ \mathrm{m/s^2}\). (أ) متى تلحق بالسيارة؟ (ب) ما المسافة التي قطعتها؟ (ج) ما سرعتها في تلك اللحظة؟'
    hint:
      en: 'Take \(x = 0\) and \(t = 0\) at the meeting point and write \(x(t)\) for both vehicles; "catch" means equal positions.'
      ar: 'اختر \(x = 0\) و\(t = 0\) عند نقطة الالتقاء الأولى، واكتب \(x(t)\) لكلتا السيارتين؛ "اللحاق" يعني تساوي الموضعين.'
    solution:
      en: |
        Positions: \(x_c = v t\) and \(x_p = \tfrac12 a t^2\).
        \[ v t = \tfrac12 a t^2 \;\Rightarrow\; t = \frac{2v}{a} = \frac{2(25)}{2.5} = 20\ \mathrm{s} \]
        (the root \(t = 0\) is the initial crossing).
        (b) \(x = v t = 25 \times 20 = 500\ \mathrm{m}\).
        (c) \(v_p = a t = 2.5 \times 20 = 50\ \mathrm{m/s}\), exactly twice the car's speed — as expected, since both cover the same distance in the same time, so their <em>average</em> speeds are equal and the police car's average speed is \(v_p/2\).
      ar: |
        الموضعان: \(x_c = v t\) و\(x_p = \tfrac12 a t^2\).
        \[ v t = \tfrac12 a t^2 \;\Rightarrow\; t = \frac{2v}{a} = \frac{2(25)}{2.5} = 20\ \mathrm{s} \]
        (الجذر \(t = 0\) يوافق لحظة المرور الأولى).
        (ب) \(x = v t = 25 \times 20 = 500\ \mathrm{m}\).
        (ج) \(v_p = a t = 2.5 \times 20 = 50\ \mathrm{m/s}\)، أي ضعف سرعة السيارة تمامًا — وهذا متوقع، لأن السيارتين تقطعان المسافة نفسها في الزمن نفسه، فسرعتاهما <em>المتوسطتان</em> متساويتان، والسرعة المتوسطة لسيارة الشرطة هي \(v_p/2\).
  - title: { en: 'Projectile launched from a cliff', ar: 'مقذوف من أعلى جرف' }
    difficulty: 2
    statement:
      en: 'A ball is thrown from the top of a cliff \(h = 15\ \mathrm{m}\) high with speed \(v_0 = 20\ \mathrm{m/s}\) at \(30^\circ\) above the horizontal. Neglect air resistance and take \(g = 9.8\ \mathrm{m/s^2}\). Find (a) the maximum height above the cliff, (b) the time of flight, (c) the horizontal distance travelled, (d) the impact speed.'
      ar: 'تُقذف كرة من أعلى جرف ارتفاعه \(h = 15\ \mathrm{m}\) بسرعة \(v_0 = 20\ \mathrm{m/s}\) تصنع زاوية \(30^\circ\) فوق الأفق. أهمل مقاومة الهواء وخذ \(g = 9.8\ \mathrm{m/s^2}\). أوجد (أ) أقصى ارتفاع فوق الجرف، (ب) زمن التحليق، (ج) المسافة الأفقية المقطوعة، (د) سرعة الارتطام.'
    hint:
      en: 'Separate the motion: uniform along \(x\), uniformly accelerated along \(y\). For (d), energy conservation is quickest.'
      ar: 'افصل الحركة: منتظمة على \(x\) ومتغيرة بانتظام على \(y\). في (د) يكون حفظ الطاقة أسرع طريق.'
    solution:
      en: |
        Components: \(v_{0x} = 20\cos 30^\circ = 17.3\ \mathrm{m/s}\), \(v_{0y} = 20\sin 30^\circ = 10.0\ \mathrm{m/s}\). Origin at the launch point, \(y\) upward.
        (a) At the top \(v_y = 0\): \(\Delta y_{\max} = \dfrac{v_{0y}^2}{2g} = \dfrac{100}{19.6} = 5.10\ \mathrm{m}\).
        (b) Landing when \(y = -15\ \mathrm{m}\):
        \[ -15 = 10\,t - 4.9\,t^2 \;\Rightarrow\; 4.9t^2 - 10t - 15 = 0 \;\Rightarrow\; t = \frac{10 + \sqrt{100 + 294}}{9.8} = 3.05\ \mathrm{s} \]
        (c) \(x = v_{0x} t = 17.3 \times 3.05 = 52.8\ \mathrm{m}\).
        (d) \(\tfrac12 m v^2 = \tfrac12 m v_0^2 + m g h \Rightarrow v = \sqrt{v_0^2 + 2gh} = \sqrt{400 + 294} = 26.3\ \mathrm{m/s}\).
        Check with components: \(v_y = 10 - 9.8(3.05) = -19.9\ \mathrm{m/s}\), \(\sqrt{17.3^2 + 19.9^2} = 26.4\ \mathrm{m/s}\) ✓ (rounding).
      ar: |
        المركّبتان: \(v_{0x} = 20\cos 30^\circ = 17.3\ \mathrm{m/s}\) و\(v_{0y} = 20\sin 30^\circ = 10.0\ \mathrm{m/s}\). المبدأ عند نقطة القذف والمحور \(y\) نحو الأعلى.
        (أ) عند القمة \(v_y = 0\): \(\Delta y_{\max} = \dfrac{v_{0y}^2}{2g} = \dfrac{100}{19.6} = 5.10\ \mathrm{m}\).
        (ب) يصل الأرض عندما \(y = -15\ \mathrm{m}\):
        \[ -15 = 10\,t - 4.9\,t^2 \;\Rightarrow\; 4.9t^2 - 10t - 15 = 0 \;\Rightarrow\; t = \frac{10 + \sqrt{100 + 294}}{9.8} = 3.05\ \mathrm{s} \]
        (ج) \(x = v_{0x} t = 17.3 \times 3.05 = 52.8\ \mathrm{m}\).
        (د) \(\tfrac12 m v^2 = \tfrac12 m v_0^2 + m g h \Rightarrow v = \sqrt{v_0^2 + 2gh} = \sqrt{400 + 294} = 26.3\ \mathrm{m/s}\).
        تحقق بالمركّبات: \(v_y = 10 - 9.8(3.05) = -19.9\ \mathrm{m/s}\) و\(\sqrt{17.3^2 + 19.9^2} = 26.4\ \mathrm{m/s}\) ✓ (مع التقريب).
  - title: { en: 'Block on a rough incline pulled by a hanging mass', ar: 'جسم على مستوٍ مائل خشن يسحبه جسم معلّق' }
    difficulty: 2
    statement:
      en: 'A block \(m_1 = 4.0\ \mathrm{kg}\) on a \(30^\circ\) incline (\(\mu_k = 0.20\)) is connected by a light string over a frictionless, massless pulley at the top to a hanging block \(m_2 = 3.0\ \mathrm{kg}\). The system moves with \(m_2\) descending. Find the acceleration and the tension.'
      ar: 'جسم \(m_1 = 4.0\ \mathrm{kg}\) موضوع على مستوٍ مائل بزاوية \(30^\circ\) (\(\mu_k = 0.20\)) ومربوط بخيط خفيف يمر على بكرة ملساء مهملة الكتلة في أعلى المستوي بجسم معلّق \(m_2 = 3.0\ \mathrm{kg}\). يتحرك النظام بحيث ينزل \(m_2\). أوجد التسارع وشدة الشد.'
    hint:
      en: 'Write Newton''s second law for each block along its own direction of motion; the kinetic friction on \(m_1\) points down the slope.'
      ar: 'اكتب قانون نيوتن الثاني لكل جسم على اتجاه حركته؛ قوة الاحتكاك الحركي على \(m_1\) تتجه نحو أسفل المستوي.'
    solution:
      en: |
        For \(m_1\) (up the slope positive): \(T - m_1 g\sin\theta - \mu_k m_1 g\cos\theta = m_1 a\).
        For \(m_2\) (downward positive): \(m_2 g - T = m_2 a\).
        Adding:
        \[ a = \frac{m_2 g - m_1 g(\sin\theta + \mu_k\cos\theta)}{m_1 + m_2} = \frac{29.4 - 19.6 - 6.79}{7.0} = 0.43\ \mathrm{m/s^2} \]
        \[ T = m_2(g - a) = 3.0(9.8 - 0.43) = 28.1\ \mathrm{N} \]
        Check on \(m_1\): \(28.1 - 19.6 - 6.79 = 1.72\ \mathrm{N} = 4.0 \times 0.43\) ✓. As expected, \(T\) lies between \(m_1 g\sin\theta + f_k\) and \(m_2 g\).
      ar: |
        للجسم \(m_1\) (الاتجاه الموجب نحو أعلى المستوي): \(T - m_1 g\sin\theta - \mu_k m_1 g\cos\theta = m_1 a\).
        للجسم \(m_2\) (الاتجاه الموجب نحو الأسفل): \(m_2 g - T = m_2 a\).
        بالجمع:
        \[ a = \frac{m_2 g - m_1 g(\sin\theta + \mu_k\cos\theta)}{m_1 + m_2} = \frac{29.4 - 19.6 - 6.79}{7.0} = 0.43\ \mathrm{m/s^2} \]
        \[ T = m_2(g - a) = 3.0(9.8 - 0.43) = 28.1\ \mathrm{N} \]
        تحقق على \(m_1\): \(28.1 - 19.6 - 6.79 = 1.72\ \mathrm{N} = 4.0 \times 0.43\) ✓. وكما هو متوقع، تقع \(T\) بين \(m_1 g\sin\theta + f_k\) و\(m_2 g\).
  - title: { en: 'The ballistic pendulum', ar: 'النواس القذفي' }
    difficulty: 2
    statement:
      en: 'A bullet of mass \(m = 10\ \mathrm{g}\) is fired horizontally into a wooden block of mass \(M = 2.0\ \mathrm{kg}\) hanging from light strings. The bullet stays embedded and the block rises by \(h = 10\ \mathrm{cm}\). Find (a) the speed of the block just after impact, (b) the speed of the bullet, (c) the fraction of kinetic energy lost in the collision.'
      ar: 'تُطلق رصاصة كتلتها \(m = 10\ \mathrm{g}\) أفقيًا نحو قطعة خشب كتلتها \(M = 2.0\ \mathrm{kg}\) معلقة بخيوط خفيفة. تنغرس الرصاصة في القطعة فترتفع بمقدار \(h = 10\ \mathrm{cm}\). أوجد (أ) سرعة القطعة بعد التصادم مباشرة، (ب) سرعة الرصاصة، (ج) نسبة الطاقة الحركية المفقودة في التصادم.'
    hint:
      en: 'Two stages: momentum is conserved during the very short collision; mechanical energy is conserved during the swing.'
      ar: 'مرحلتان: الزخم الخطي محفوظ خلال التصادم القصير جدًا، والطاقة الميكانيكية محفوظة خلال التأرجح.'
    solution:
      en: |
        (a) Swing: \(\tfrac12 (m+M)V^2 = (m+M) g h \Rightarrow V = \sqrt{2gh} = \sqrt{2(9.8)(0.10)} = 1.40\ \mathrm{m/s}\).
        (b) Collision (perfectly inelastic): \(m v = (m+M)V\)
        \[ v = \frac{m+M}{m} V = \frac{2.01}{0.010}(1.40) = 281\ \mathrm{m/s} \]
        (c) \[ \frac{K_i - K_f}{K_i} = 1 - \frac{(m+M)V^2}{m v^2} = 1 - \frac{m}{m+M} = \frac{M}{m+M} = \frac{2.0}{2.01} = 0.995 \]
        About 99.5 % of the bullet's kinetic energy becomes internal energy (heat, deformation): energy is <em>not</em> conserved in the collision, which is why the two stages must be treated separately.
      ar: |
        (أ) التأرجح: \(\tfrac12 (m+M)V^2 = (m+M) g h \Rightarrow V = \sqrt{2gh} = \sqrt{2(9.8)(0.10)} = 1.40\ \mathrm{m/s}\).
        (ب) التصادم (عديم المرونة تمامًا): \(m v = (m+M)V\)
        \[ v = \frac{m+M}{m} V = \frac{2.01}{0.010}(1.40) = 281\ \mathrm{m/s} \]
        (ج) \[ \frac{K_i - K_f}{K_i} = 1 - \frac{(m+M)V^2}{m v^2} = 1 - \frac{m}{m+M} = \frac{M}{m+M} = \frac{2.0}{2.01} = 0.995 \]
        يتحول نحو 99.5 % من الطاقة الحركية للرصاصة إلى طاقة داخلية (حرارة وتشوّه): الطاقة الميكانيكية <em>غير</em> محفوظة في التصادم، ولهذا يجب معالجة المرحلتين كلٌّ على حدة.
  - title: { en: 'Mass hanging from a pulley with inertia', ar: 'جسم معلّق ببكرة ذات عطالة' }
    difficulty: 3
    statement:
      en: 'A light string is wrapped around a pulley that is a uniform disc (\(M = 2.0\ \mathrm{kg}\), \(R = 0.10\ \mathrm{m}\)) free to turn about a fixed horizontal axle. A block \(m = 1.0\ \mathrm{kg}\) hangs from the string and is released from rest. Find (a) the acceleration of the block, (b) the tension, (c) the speed after the block has fallen \(1.0\ \mathrm{m}\), using energy as a check.'
      ar: 'خيط خفيف ملفوف حول بكرة على شكل قرص متجانس (\(M = 2.0\ \mathrm{kg}\)، \(R = 0.10\ \mathrm{m}\)) تدور بحرية حول محور أفقي ثابت. يتدلى من الخيط جسم \(m = 1.0\ \mathrm{kg}\) يُترك دون سرعة ابتدائية. أوجد (أ) تسارع الجسم، (ب) شدة الشد، (ج) السرعة بعد أن ينزل الجسم \(1.0\ \mathrm{m}\)، مع التحقق بطريقة الطاقة.'
    hint:
      en: 'Use \(I = \tfrac12 MR^2\), \(\tau = TR = I\alpha\), and the no-slip condition \(a = \alpha R\).'
      ar: 'استعمل \(I = \tfrac12 MR^2\) و\(\tau = TR = I\alpha\) وشرط عدم الانزلاق \(a = \alpha R\).'
    solution:
      en: |
        Block: \(mg - T = ma\). Pulley: \(TR = I\alpha = \tfrac12 MR^2 (a/R) \Rightarrow T = \tfrac12 M a\).
        (a) \[ a = \frac{mg}{m + M/2} = \frac{9.8}{1.0 + 1.0} = 4.9\ \mathrm{m/s^2} \]
        (b) \(T = \tfrac12 M a = 4.9\ \mathrm{N}\) (less than \(mg = 9.8\ \mathrm{N}\), as it must be).
        (c) Kinematics: \(v = \sqrt{2ah} = \sqrt{2(4.9)(1.0)} = 3.13\ \mathrm{m/s}\).
        Energy check: \(mgh = \tfrac12 m v^2 + \tfrac12 I\omega^2 = \tfrac12 v^2\left(m + \tfrac12 M\right)\)
        \[ v = \sqrt{\frac{2mgh}{m + M/2}} = \sqrt{\frac{2(9.8)}{2.0}} = 3.13\ \mathrm{m/s} \] ✓
      ar: |
        الجسم: \(mg - T = ma\). البكرة: \(TR = I\alpha = \tfrac12 MR^2 (a/R) \Rightarrow T = \tfrac12 M a\).
        (أ) \[ a = \frac{mg}{m + M/2} = \frac{9.8}{1.0 + 1.0} = 4.9\ \mathrm{m/s^2} \]
        (ب) \(T = \tfrac12 M a = 4.9\ \mathrm{N}\) (أصغر من \(mg = 9.8\ \mathrm{N}\) كما ينبغي).
        (ج) بعلاقات الحركة: \(v = \sqrt{2ah} = \sqrt{2(4.9)(1.0)} = 3.13\ \mathrm{m/s}\).
        التحقق بالطاقة: \(mgh = \tfrac12 m v^2 + \tfrac12 I\omega^2 = \tfrac12 v^2\left(m + \tfrac12 M\right)\)
        \[ v = \sqrt{\frac{2mgh}{m + M/2}} = \sqrt{\frac{2(9.8)}{2.0}} = 3.13\ \mathrm{m/s} \] ✓
  - title: { en: 'Geostationary orbit', ar: 'المدار الثابت بالنسبة للأرض' }
    difficulty: 2
    statement:
      en: 'A geostationary satellite stays above the same point of the equator: its period equals one sidereal day, \(T = 86\,164\ \mathrm{s}\). Using \(GM_E = 3.986 \times 10^{14}\ \mathrm{m^3/s^2}\) and \(R_E = 6371\ \mathrm{km}\), find the orbital radius, the altitude and the orbital speed.'
      ar: 'يبقى القمر الصناعي الثابت بالنسبة للأرض فوق النقطة نفسها من خط الاستواء، فدوره يساوي يومًا نجميًا واحدًا \(T = 86\,164\ \mathrm{s}\). باستعمال \(GM_E = 3.986 \times 10^{14}\ \mathrm{m^3/s^2}\) و\(R_E = 6371\ \mathrm{km}\)، أوجد نصف قطر المدار والارتفاع عن سطح الأرض والسرعة المدارية.'
    hint:
      en: 'Gravity provides the centripetal force: \(GM_E m/r^2 = m\,(2\pi/T)^2 r\).'
      ar: 'الجاذبية هي التي توفر القوة المركزية: \(GM_E m/r^2 = m\,(2\pi/T)^2 r\).'
    solution:
      en: |
        \[ \frac{GM_E}{r^2} = \frac{4\pi^2}{T^2}\,r \;\Rightarrow\; r = \left(\frac{GM_E T^2}{4\pi^2}\right)^{1/3} = \left(\frac{3.986\times10^{14}\,(86\,164)^2}{39.48}\right)^{1/3} = 4.22\times10^{7}\ \mathrm{m} \]
        This is Kepler's third law. Altitude: \(r - R_E = 42\,160 - 6371 \approx 35\,800\ \mathrm{km}\).
        Speed: \(v = \dfrac{2\pi r}{T} = \dfrac{2\pi(4.216\times10^{7})}{86\,164} = 3.07\ \mathrm{km/s}\), consistent with \(v = \sqrt{GM_E/r}\).
      ar: |
        \[ \frac{GM_E}{r^2} = \frac{4\pi^2}{T^2}\,r \;\Rightarrow\; r = \left(\frac{GM_E T^2}{4\pi^2}\right)^{1/3} = \left(\frac{3.986\times10^{14}\,(86\,164)^2}{39.48}\right)^{1/3} = 4.22\times10^{7}\ \mathrm{m} \]
        وهذا هو قانون كبلر الثالث. الارتفاع: \(r - R_E = 42\,160 - 6371 \approx 35\,800\ \mathrm{km}\).
        السرعة: \(v = \dfrac{2\pi r}{T} = \dfrac{2\pi(4.216\times10^{7})}{86\,164} = 3.07\ \mathrm{km/s}\)، وهي متوافقة مع \(v = \sqrt{GM_E/r}\).

quizzes:
  - title: { en: 'Measurement, vectors and kinematics', ar: 'القياس والمتجهات وعلم الحركة' }
    questions:
      - q:
          en: 'Which combination has the dimensions of an acceleration (\(v\): speed, \(x\): length, \(t\): time)?'
          ar: 'أي التراكيب التالية له أبعاد التسارع (\(v\): سرعة، \(x\): طول، \(t\): زمن)؟'
        options:
          - '\(v/x\)'
          - '\(v^2/x\)'
          - '\(v\,t\)'
          - '\(x/t\)'
        answer: 1
        explain:
          en: '\([v^2/x] = (\mathrm{L^2T^{-2}})/\mathrm{L} = \mathrm{L\,T^{-2}}\), the dimensions of acceleration. \(v/x\) is \(\mathrm{T^{-1}}\), \(x/t\) is a speed and \(vt\) a length.'
          ar: '\([v^2/x] = (\mathrm{L^2T^{-2}})/\mathrm{L} = \mathrm{L\,T^{-2}}\) وهي أبعاد التسارع. أما \(v/x\) فبعده \(\mathrm{T^{-1}}\)، و\(x/t\) سرعة، و\(vt\) طول.'
      - q:
          en: 'Given \(\vec A = 3\hat\imath + 4\hat\jmath\) and \(\vec B = 4\hat\imath - 3\hat\jmath\), what is \(\vec A\cdot\vec B\)?'
          ar: 'إذا كان \(\vec A = 3\hat\imath + 4\hat\jmath\) و\(\vec B = 4\hat\imath - 3\hat\jmath\)، فما قيمة \(\vec A\cdot\vec B\)؟'
        options:
          - '0'
          - '24'
          - '7'
          - '25'
        answer: 0
        explain:
          en: '\(\vec A\cdot\vec B = A_xB_x + A_yB_y = 12 - 12 = 0\): the two vectors (both of magnitude 5) are perpendicular.'
          ar: '\(\vec A\cdot\vec B = A_xB_x + A_yB_y = 12 - 12 = 0\): المتجهان (وطويلة كل منهما 5) متعامدان.'
      - q:
          en: 'A car starts from rest with constant acceleration \(2\ \mathrm{m/s^2}\). How far does it travel in the first \(5\ \mathrm{s}\)?'
          ar: 'تنطلق سيارة من السكون بتسارع ثابت \(2\ \mathrm{m/s^2}\). ما المسافة التي تقطعها في الثواني الخمس الأولى؟'
        options:
          - '\(50\ \mathrm{m}\)'
          - '\(10\ \mathrm{m}\)'
          - '\(25\ \mathrm{m}\)'
          - '\(100\ \mathrm{m}\)'
        answer: 2
        explain:
          en: '\(x = \tfrac12 a t^2 = \tfrac12(2)(5)^2 = 25\ \mathrm{m}\). The answer \(50\ \mathrm{m}\) forgets the factor \(\tfrac12\).'
          ar: '\(x = \tfrac12 a t^2 = \tfrac12(2)(5)^2 = 25\ \mathrm{m}\). الإجابة \(50\ \mathrm{m}\) تنسى المعامل \(\tfrac12\).'
      - q:
          en: 'Two projectiles are launched from level ground with the same speed, at \(30^\circ\) and at \(60^\circ\). Without air resistance:'
          ar: 'يُقذف مقذوفان من أرض مستوية بالسرعة نفسها، أحدهما بزاوية \(30^\circ\) والآخر بزاوية \(60^\circ\). بإهمال مقاومة الهواء:'
        options:
          - { en: 'The 30° one has the larger range and the larger height.', ar: 'المقذوف بزاوية 30° له مدى أكبر وارتفاع أكبر.' }
          - { en: 'They have the same range; the 60° one goes higher.', ar: 'لهما المدى نفسه، ويرتفع المقذوف بزاوية 60° أكثر.' }
          - { en: 'The 60° one has twice the range.', ar: 'مدى المقذوف بزاوية 60° ضعف مدى الآخر.' }
          - { en: 'They land at the same time.', ar: 'يصلان إلى الأرض في اللحظة نفسها.' }
        answer: 1
        explain:
          en: '\(R = v_0^2\sin 2\theta/g\) and \(\sin 60^\circ = \sin 120^\circ\), so complementary angles give equal ranges. The height \(v_0^2\sin^2\theta/2g\) and flight time \(2v_0\sin\theta/g\) are larger for \(60^\circ\).'
          ar: '\(R = v_0^2\sin 2\theta/g\) و\(\sin 60^\circ = \sin 120^\circ\)، فالزاويتان المتتامتان تعطيان المدى نفسه. أما الارتفاع \(v_0^2\sin^2\theta/2g\) وزمن التحليق \(2v_0\sin\theta/g\) فهما أكبر عند \(60^\circ\).'
      - q:
          en: 'At the highest point of a projectile''s path (no air resistance):'
          ar: 'عند أعلى نقطة من مسار مقذوف (بإهمال مقاومة الهواء):'
        options:
          - { en: 'the velocity is zero and the acceleration is \(g\) downward', ar: 'السرعة منعدمة والتسارع \(g\) نحو الأسفل' }
          - { en: 'the velocity and the acceleration are both zero', ar: 'السرعة والتسارع منعدمان كلاهما' }
          - { en: 'the acceleration is horizontal', ar: 'التسارع أفقي' }
          - { en: 'the velocity is horizontal and the acceleration is \(g\) downward', ar: 'السرعة أفقية والتسارع \(g\) نحو الأسفل' }
        answer: 3
        explain:
          en: 'Only \(v_y\) vanishes at the top; \(v_x\) is constant throughout. The acceleration is \(\vec g\) at every point of the flight.'
          ar: 'عند القمة تنعدم المركّبة \(v_y\) فقط، أما \(v_x\) فثابتة طوال الحركة. والتسارع يساوي \(\vec g\) في كل نقطة من المسار.'
  - title: { en: 'Newton''s laws and circular motion', ar: 'قوانين نيوتن والحركة الدائرية' }
    questions:
      - q:
          en: 'A person of mass \(m\) stands on a scale in a lift accelerating <em>upward</em> with magnitude \(a\). The scale reads:'
          ar: 'يقف شخص كتلته \(m\) على ميزان داخل مصعد يتسارع <em>نحو الأعلى</em> بتسارع مقداره \(a\). قراءة الميزان هي:'
        options:
          - '\(ma\)'
          - '\(m(g + a)\)'
          - '\(m(g - a)\)'
          - '\(mg\)'
        answer: 1
        explain:
          en: 'Newton''s second law upward: \(N - mg = ma\), so \(N = m(g + a)\). The scale shows the normal force, which exceeds the weight.'
          ar: 'قانون نيوتن الثاني نحو الأعلى: \(N - mg = ma\)، إذن \(N = m(g + a)\). الميزان يقيس رد الفعل العمودي، وهو أكبر من الثقل.'
      - q:
          en: 'A box rests on a rough floor (\(\mu_s = 0.5\)). You push horizontally with a force smaller than \(\mu_s mg\) and it does not move. The friction force is:'
          ar: 'صندوق ساكن على أرضية خشنة (\(\mu_s = 0.5\)). تدفعه أفقيًا بقوة أصغر من \(\mu_s mg\) فلا يتحرك. قوة الاحتكاك تساوي:'
        options:
          - '\(\mu_k mg\)'
          - { en: 'equal in magnitude to your push', ar: 'مقدار قوة دفعك' }
          - '\(\mu_s mg\)'
          - { en: 'zero', ar: 'صفرًا' }
        answer: 1
        explain:
          en: 'Static friction adjusts to keep the box in equilibrium: \(f_s = F\). The expression \(\mu_s N\) is only its <em>maximum</em> value.'
          ar: 'يتكيّف الاحتكاك السكوني ليبقى الصندوق في توازن: \(f_s = F\). أما \(\mu_s N\) فهي قيمته <em>العظمى</em> فقط.'
      - q:
          en: 'What is the maximum speed of a car on a flat (unbanked) curve of radius \(r\) if the coefficient of static friction is \(\mu_s\)?'
          ar: 'ما السرعة القصوى لسيارة في منعطف أفقي (غير مائل) نصف قطره \(r\) إذا كان معامل الاحتكاك السكوني \(\mu_s\)؟'
        options:
          - '\(\sqrt{\mu_s g / r}\)'
          - '\(\sqrt{g r/\mu_s}\)'
          - '\(\mu_s g r\)'
          - '\(\sqrt{\mu_s g r}\)'
        answer: 3
        explain:
          en: 'Friction supplies the centripetal force: \(m v^2/r \le \mu_s m g\), hence \(v_{\max} = \sqrt{\mu_s g r}\), independent of the mass.'
          ar: 'الاحتكاك هو الذي يوفر القوة المركزية: \(m v^2/r \le \mu_s m g\)، إذن \(v_{\max} = \sqrt{\mu_s g r}\)، وهي مستقلة عن الكتلة.'
      - q:
          en: 'A book lies on a table. The Newton''s-third-law partner of the Earth''s gravitational pull on the book is:'
          ar: 'كتاب موضوع على طاولة. القوة المقابلة (حسب قانون نيوتن الثالث) لجذب الأرض للكتاب هي:'
        options:
          - { en: 'the weight of the table', ar: 'ثقل الطاولة' }
          - { en: 'the normal force of the table on the book', ar: 'رد فعل الطاولة العمودي على الكتاب' }
          - { en: 'the force of the book on the table', ar: 'قوة ضغط الكتاب على الطاولة' }
          - { en: 'the gravitational pull of the book on the Earth', ar: 'جذب الكتاب للأرض' }
        answer: 3
        explain:
          en: 'Action–reaction pairs involve the same two bodies and the same type of interaction. The normal force acts on the book too, so it cannot be the partner of another force on the book.'
          ar: 'زوجا الفعل ورد الفعل يتعلقان بالجسمين نفسيهما وبنوع التأثير نفسه. أما رد الفعل العمودي فيؤثر هو أيضًا على الكتاب، فلا يمكن أن يكون مقابلًا لقوة أخرى مؤثرة على الكتاب.'
      - q:
          en: 'In uniform circular motion of fixed radius, the speed is doubled. The centripetal acceleration is multiplied by:'
          ar: 'في حركة دائرية منتظمة بنصف قطر ثابت، تضاعفت السرعة. يُضرب التسارع المركزي في:'
        options:
          - '1'
          - '2'
          - '4'
          - '\(\sqrt2\)'
        answer: 2
        explain:
          en: '\(a_c = v^2/r\) is quadratic in \(v\): \((2v)^2/r = 4\,v^2/r\).'
          ar: '\(a_c = v^2/r\) تتناسب مع مربع السرعة: \((2v)^2/r = 4\,v^2/r\).'
  - title: { en: 'Work, energy and momentum', ar: 'الشغل والطاقة والزخم الخطي' }
    questions:
      - q:
          en: 'A constant force \(\vec F = (3\hat\imath + 2\hat\jmath)\ \mathrm{N}\) acts during a displacement \(\Delta\vec r = (2\hat\imath - \hat\jmath)\ \mathrm{m}\). The work done is:'
          ar: 'تؤثر قوة ثابتة \(\vec F = (3\hat\imath + 2\hat\jmath)\ \mathrm{N}\) خلال إزاحة \(\Delta\vec r = (2\hat\imath - \hat\jmath)\ \mathrm{m}\). الشغل المنجز هو:'
        options:
          - '\(4\ \mathrm{J}\)'
          - '\(8\ \mathrm{J}\)'
          - '\(6\ \mathrm{J}\)'
          - '\(-2\ \mathrm{J}\)'
        answer: 0
        explain:
          en: '\(W = \vec F\cdot\Delta\vec r = (3)(2) + (2)(-1) = 4\ \mathrm{J}\).'
          ar: '\(W = \vec F\cdot\Delta\vec r = (3)(2) + (2)(-1) = 4\ \mathrm{J}\).'
      - q:
          en: 'A stone is dropped from rest. If the drop height is multiplied by 4, its impact speed (no air resistance) is multiplied by:'
          ar: 'يُترك حجر يسقط من السكون. إذا ضُرب ارتفاع السقوط في 4، فإن سرعة ارتطامه (بإهمال مقاومة الهواء) تُضرب في:'
        options:
          - '16'
          - '4'
          - '2'
          - '\(\sqrt2\)'
        answer: 2
        explain:
          en: 'Energy conservation gives \(v = \sqrt{2gh}\), so \(v \propto \sqrt h\) and \(\sqrt4 = 2\).'
          ar: 'حفظ الطاقة يعطي \(v = \sqrt{2gh}\)، أي أن \(v \propto \sqrt h\) و\(\sqrt4 = 2\).'
      - q:
          en: 'A cart of mass \(m\) moving at \(v\) collides with an identical cart at rest and they stick together. What fraction of the initial kinetic energy is lost?'
          ar: 'عربة كتلتها \(m\) تتحرك بسرعة \(v\) تصطدم بعربة مماثلة ساكنة فتلتحمان. ما نسبة الطاقة الحركية الابتدائية المفقودة؟'
        options:
          - '0'
          - '\(3/4\)'
          - '\(1/2\)'
          - '\(1/4\)'
        answer: 2
        explain:
          en: 'Momentum: \(mv = 2m\,V \Rightarrow V = v/2\). \(K_f = \tfrac12(2m)(v/2)^2 = \tfrac14 mv^2 = K_i/2\), so half is lost.'
          ar: 'حفظ الزخم: \(mv = 2m\,V \Rightarrow V = v/2\). إذن \(K_f = \tfrac12(2m)(v/2)^2 = \tfrac14 mv^2 = K_i/2\)، فيضيع النصف.'
      - q:
          en: 'The compression of a spring (Hooke''s law) is doubled. The elastic potential energy stored is multiplied by:'
          ar: 'تضاعف انضغاط نابض يخضع لقانون هوك. تُضرب طاقة الوضع المرونية المخزنة في:'
        options:
          - '8'
          - '\(\sqrt2\)'
          - '2'
          - '4'
        answer: 3
        explain:
          en: '\(U = \tfrac12 k x^2\) is quadratic in \(x\): doubling \(x\) multiplies \(U\) by 4.'
          ar: '\(U = \tfrac12 k x^2\) تتناسب مع مربع الانضغاط: مضاعفة \(x\) تضرب \(U\) في 4.'
      - q:
          en: 'Which statement characterises a conservative force?'
          ar: 'أي العبارات التالية تميّز القوة المحافظة؟'
        options:
          - { en: 'It is always perpendicular to the velocity.', ar: 'هي دائمًا عمودية على السرعة.' }
          - { en: 'It always does positive work.', ar: 'شغلها موجب دائمًا.' }
          - { en: 'Kinetic friction is an example.', ar: 'الاحتكاك الحركي مثال عليها.' }
          - { en: 'Its work around any closed path is zero.', ar: 'شغلها على أي مسار مغلق منعدم.' }
        answer: 3
        explain:
          en: 'A force is conservative when its work depends only on the end points (equivalently, is zero on any closed path); only then can a potential energy be defined. Kinetic friction always dissipates energy.'
          ar: 'تكون القوة محافظة إذا كان شغلها متعلقًا بنقطتي البداية والنهاية فقط (أي منعدمًا على أي مسار مغلق)، وعندها فقط يمكن تعريف طاقة وضع. أما الاحتكاك الحركي فيبدّد الطاقة دائمًا.'
  - title: { en: 'Rotation and gravitation', ar: 'الدوران والجاذبية' }
    questions:
      - q:
          en: 'A solid sphere, a solid disc and a thin hoop are released together and roll without slipping down the same incline. Which reaches the bottom first?'
          ar: 'تُترك كرة مصمتة وقرص مصمت وحلقة رقيقة في آن واحد فتتدحرج دون انزلاق على المستوي المائل نفسه. أيها يصل إلى الأسفل أولًا؟'
        options:
          - { en: 'all at the same time', ar: 'تصل جميعها في الوقت نفسه' }
          - { en: 'the solid disc', ar: 'القرص المصمت' }
          - { en: 'the solid sphere', ar: 'الكرة المصمتة' }
          - { en: 'the hoop', ar: 'الحلقة' }
        answer: 2
        explain:
          en: 'Energy gives \(v^2 = 2gh/(1 + I/MR^2)\) with \(I/MR^2 = 2/5,\ 1/2,\ 1\). The smallest ratio (sphere) gives the largest speed at every height, independent of mass and radius.'
          ar: 'من حفظ الطاقة: \(v^2 = 2gh/(1 + I/MR^2)\) حيث \(I/MR^2 = 2/5,\ 1/2,\ 1\). أصغر نسبة (الكرة) تعطي أكبر سرعة عند كل ارتفاع، بغض النظر عن الكتلة ونصف القطر.'
      - q:
          en: 'A spinning skater pulls in her arms. Her rotational kinetic energy:'
          ar: 'متزلجة تدور حول نفسها تضم ذراعيها. طاقتها الحركية الدورانية:'
        options:
          - { en: 'becomes zero', ar: 'تنعدم' }
          - { en: 'increases', ar: 'تزداد' }
          - { en: 'stays the same', ar: 'تبقى ثابتة' }
          - { en: 'decreases', ar: 'تتناقص' }
        answer: 1
        explain:
          en: 'Angular momentum \(L = I\omega\) is conserved and \(K = L^2/2I\). Since \(I\) decreases, \(K\) increases; the extra energy comes from the work done by her muscles.'
          ar: 'الزخم الزاوي \(L = I\omega\) محفوظ و\(K = L^2/2I\). وبما أن \(I\) تتناقص فإن \(K\) تزداد؛ والطاقة الإضافية مصدرها شغل عضلاتها.'
      - q:
          en: 'A force of \(10\ \mathrm{N}\) is applied at \(0.50\ \mathrm{m}\) from a pivot, making an angle of \(30^\circ\) with the position vector. The magnitude of the torque is:'
          ar: 'تؤثر قوة شدتها \(10\ \mathrm{N}\) على بعد \(0.50\ \mathrm{m}\) من محور الدوران وتصنع زاوية \(30^\circ\) مع متجه الموضع. مقدار عزم القوة هو:'
        options:
          - '\(5.0\ \mathrm{N\,m}\)'
          - '\(2.5\ \mathrm{N\,m}\)'
          - '\(4.3\ \mathrm{N\,m}\)'
          - '\(20\ \mathrm{N\,m}\)'
        answer: 1
        explain:
          en: '\(\tau = rF\sin\theta = (0.50)(10)\sin 30^\circ = 2.5\ \mathrm{N\,m}\). Using \(\cos 30^\circ\) gives the wrong value 4.3.'
          ar: '\(\tau = rF\sin\theta = (0.50)(10)\sin 30^\circ = 2.5\ \mathrm{N\,m}\). استعمال \(\cos 30^\circ\) يعطي القيمة الخاطئة 4.3.'
      - q:
          en: 'A satellite moves to a circular orbit of radius four times larger. Its orbital speed is:'
          ar: 'انتقل قمر صناعي إلى مدار دائري نصف قطره أكبر بأربع مرات. سرعته المدارية:'
        options:
          - { en: 'doubled', ar: 'تتضاعف' }
          - { en: 'halved', ar: 'تنقص إلى النصف' }
          - { en: 'divided by 4', ar: 'تُقسم على 4' }
          - { en: 'unchanged', ar: 'لا تتغير' }
        answer: 1
        explain:
          en: '\(GMm/r^2 = mv^2/r \Rightarrow v = \sqrt{GM/r}\); multiplying \(r\) by 4 divides \(v\) by 2.'
          ar: '\(GMm/r^2 = mv^2/r \Rightarrow v = \sqrt{GM/r}\)؛ ضرب \(r\) في 4 يقسم \(v\) على 2.'
      - q:
          en: 'By Kepler''s third law, if a planet''s orbital radius were 4 times larger, its period would be multiplied by:'
          ar: 'حسب قانون كبلر الثالث، إذا كان نصف قطر مدار كوكب أكبر بأربع مرات، فإن دوره يُضرب في:'
        options:
          - '16'
          - '2'
          - '4'
          - '8'
        answer: 3
        explain:
          en: '\(T^2 \propto r^3\), so \(T \propto r^{3/2}\) and \(4^{3/2} = 8\).'
          ar: '\(T^2 \propto r^3\)، أي \(T \propto r^{3/2}\) و\(4^{3/2} = 8\).'


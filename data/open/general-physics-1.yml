  - { en: 'Newton''s laws & friction', ar: 'قوانين نيوتن والاحتكاك' }
  - { en: 'Work & energy conservation', ar: 'الشغل وحفظ الطاقة' }
  - { en: 'Momentum & collisions', ar: 'الزخم الخطي والتصادمات' }
  - { en: 'Rigid-body rotation', ar: 'دوران الجسم الصلب' }
  - { en: 'Angular momentum', ar: 'الزخم الزاوي' }
  - { en: 'Universal gravitation', ar: 'الجذب العام' }

outcomes:
  - id: CLO1
    bloom: understand
    domain: knowledge
    text:
      en: 'Explain the fundamental quantities of mechanics (displacement, velocity, acceleration, force, energy, momentum, angular momentum) and the laws that relate them, using correct SI units and dimensions.'
      ar: 'يشرح المقادير الأساسية في الميكانيكا (الإزاحة، السرعة، التسارع، القوة، الطاقة، الزخم الخطي، الزخم الزاوي) والقوانين التي تربط بينها، مستعملًا وحدات النظام الدولي والأبعاد الصحيحة.'
    assessed_by: [quizzes, midterm1, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: 'Use vector algebra and elementary calculus to describe motion in one and two dimensions, including projectile, circular and relative motion.'
      ar: 'يستعمل جبر المتجهات ومبادئ التفاضل والتكامل لوصف الحركة في بعد واحد وفي بعدين، بما في ذلك حركة المقذوفات والحركة الدائرية والحركة النسبية.'
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO3
    bloom: apply
    domain: skills
    text:
      en: 'Draw free-body diagrams and apply Newton''s laws to single and connected bodies with friction, tension, normal and centripetal forces.'
      ar: 'يرسم مخططات الجسم الحر ويطبّق قوانين نيوتن على الأجسام المفردة والمترابطة بوجود الاحتكاك والشد ورد الفعل العمودي والقوة المركزية.'
    assessed_by: [homework, midterm1, final]
  - id: CLO4
    bloom: analyze
    domain: skills
    text:
      en: 'Analyse mechanical systems with the work–energy theorem and the conservation of mechanical energy, and decide when non-conservative forces must be included.'
      ar: 'يحلل الأنظمة الميكانيكية باستعمال مبرهنة الشغل والطاقة وحفظ الطاقة الميكانيكية، ويقرر متى يجب إدراج القوى غير المحافظة.'
    assessed_by: [homework, midterm2, final]
  - id: CLO5
    bloom: analyze
    domain: skills
    text:
      en: 'Apply conservation of linear momentum to collisions and explosions, and distinguish elastic from inelastic collisions using energy.'
      ar: 'يطبّق حفظ الزخم الخطي على التصادمات والانفجارات، ويميّز بين التصادم المرن وغير المرن باستعمال الطاقة.'
    assessed_by: [quizzes, midterm2, final]
  - id: CLO6
    bloom: apply
    domain: skills
    text:
      en: 'Solve problems on rigid-body rotation (moment of inertia, torque, rolling, angular momentum) and on circular orbits under universal gravitation.'
      ar: 'يحل مسائل دوران الجسم الصلب (عزم القصور الذاتي، عزم القوة، التدحرج، الزخم الزاوي) ومسائل المدارات الدائرية تحت تأثير الجذب العام.'
    assessed_by: [quizzes, homework, final]
  - id: CLO7
    bloom: evaluate
    domain: skills
    text:
      en: 'Carry out simple mechanics experiments, represent data graphically, estimate uncertainties and judge whether results agree with a model.'
      ar: 'يُجري تجارب بسيطة في الميكانيكا، ويمثل البيانات بيانيًا، ويقدّر الارتيابات، ويحكم على مدى توافق النتائج مع النموذج.'
    assessed_by: [lab]
  - id: CLO8
    bloom: apply
    domain: values
    text:
      en: 'Work effectively in a laboratory team and report measurements honestly, completely and on time.'
      ar: 'يعمل بفاعلية ضمن فريق المختبر، ويعرض القياسات بأمانة وبشكل كامل وفي الآجال المحددة.'
    assessed_by: [lab, homework]

assessment:
  - id: quizzes
    type: quiz
    weight: 10
    title: { en: 'Short quizzes', ar: 'اختبارات قصيرة' }
    detail:
      en: 'Four 15-minute quizzes (one short problem or 5 MCQs) at the end of a tutorial session; the best three count.'
      ar: 'أربعة اختبارات قصيرة مدة كل منها 15 دقيقة (مسألة قصيرة أو خمسة أسئلة اختيار من متعدد) في نهاية حصة التمارين، وتُحتسب أفضل ثلاثة منها.'
    when: { en: 'Weeks 4, 6, 10, 13', ar: 'الأسابيع 4 و6 و10 و13' }
  - id: homework
    type: homework
    weight: 5
    title: { en: 'Problem sets', ar: 'سلاسل المسائل' }
    detail:
      en: 'Weekly problem sets; selected problems are collected and graded for method, units and clarity of presentation.'
      ar: 'سلاسل مسائل أسبوعية، تُجمع مسائل مختارة منها وتُقيَّم على أساس المنهجية والوحدات ووضوح العرض.'
    when: { en: 'Weekly', ar: 'أسبوعيًا' }
  - id: midterm1
    type: midterm
    weight: 15
    title: { en: 'Midterm exam 1', ar: 'الاختبار الدوري الأول' }
    detail:
      en: '75-minute written exam on measurement, vectors, kinematics and Newton''s laws (weeks 1–6).'
      ar: 'اختبار كتابي مدته 75 دقيقة في القياس والمتجهات وعلم الحركة وقوانين نيوتن (الأسابيع 1–6).'
    when: { en: 'Week 7', ar: 'الأسبوع 7' }
  - id: midterm2
    type: midterm
    weight: 15
    title: { en: 'Midterm exam 2', ar: 'الاختبار الدوري الثاني' }
    detail:
      en: '75-minute written exam on circular motion, work, energy and momentum (weeks 7–10).'
      ar: 'اختبار كتابي مدته 75 دقيقة في الحركة الدائرية والشغل والطاقة والزخم الخطي (الأسابيع 7–10).'
    when: { en: 'Week 12', ar: 'الأسبوع 12' }
  - id: lab
    type: lab
    weight: 15
    title: { en: 'Laboratory work', ar: 'الأعمال التطبيقية (المختبر)' }
    detail:
      en: 'Five experiments; for each, a pre-lab preparation and a short report (data table, graph, uncertainty analysis, conclusion). Attendance is compulsory.'
      ar: 'خمس تجارب، لكل منها تحضير قبلي وتقرير قصير (جدول بيانات، تمثيل بياني، تحليل الارتيابات، خلاصة). الحضور إلزامي.'
    when: { en: 'Weeks 3–11', ar: 'الأسابيع 3–11' }
  - id: final
    type: final
    weight: 40
    title: { en: 'Final exam', ar: 'الاختبار النهائي' }
    detail:
      en: 'Comprehensive 2-hour written exam: conceptual MCQs and 4–5 multi-step problems covering the whole course.'
      ar: 'اختبار كتابي شامل مدته ساعتان: أسئلة مفاهيمية من نوع الاختيار من متعدد و4–5 مسائل متعددة الخطوات تغطي المقرر كاملًا.'
    when: { en: 'After week 14', ar: 'بعد الأسبوع 14' }

schedule:
  - week: 1
    title: { en: 'Physics and measurement', ar: 'الفيزياء والقياس' }
    topics:
      en:
        - 'SI units, standards of length, mass and time'
        - 'Dimensional analysis and dimensional equations'
        - 'Orders of magnitude, significant figures'
        - 'Measurement uncertainty and error calculation'
      ar:
        - 'وحدات النظام الدولي، معايير الطول والكتلة والزمن'
        - 'التحليل البعدي ومعادلات الأبعاد'
        - 'رتب المقادير والأرقام المعنوية'
        - 'ارتياب القياس وحساب الأخطاء'
    reading: Serway §1.1–1.6
    activity: { en: 'Problem set 1 released', ar: 'نشر السلسلة 1' }
  - week: 2
    title: { en: 'Vectors', ar: 'المتجهات' }
    topics:
      en:
        - 'Coordinate systems; scalars and vectors'
        - 'Components and unit vectors'
        - 'Scalar (dot) product'
        - 'Vector (cross) product'
      ar:
        - 'جمل الإحداثيات؛ الكميات العددية والمتجهة'
        - 'المركّبات ومتجهات الوحدة'
        - 'الجداء السلّمي (النقطي)'
        - 'الجداء المتجهي (الاتجاهي)'
    reading: Serway ch. 3, §7.3, §11.1
    activity: { en: 'Problem set 2; TD 1 (vector analysis)', ar: 'السلسلة 2؛ السلسلة الموجهة 1 (التحليل المتجهي)' }
  - week: 3
    title: { en: 'Motion in one dimension', ar: 'الحركة في بعد واحد' }
    topics:
      en:
        - 'Position, displacement, average and instantaneous velocity'
        - 'Acceleration; motion diagrams and graphs'
        - 'Constant-acceleration kinematics'
        - 'Free fall; kinematic equations from calculus'
      ar:
        - 'الموضع والإزاحة والسرعة المتوسطة واللحظية'
        - 'التسارع؛ مخططات الحركة والمنحنيات البيانية'
        - 'الحركة بتسارع ثابت'
        - 'السقوط الحر؛ استنتاج معادلات الحركة بالتكامل'
    reading: Serway ch. 2
    activity: { en: 'Lab (TP 1): rectilinear motion', ar: 'المختبر (TP 1): الحركة المستقيمة' }
  - week: 4
    title: { en: 'Motion in two dimensions', ar: 'الحركة في بعدين' }
    topics:
      en:
        - 'Position, velocity and acceleration vectors'
        - 'Motion with constant acceleration in a plane'
        - 'Projectile motion: trajectory, range, maximum height'
      ar:
        - 'متجهات الموضع والسرعة والتسارع'
        - 'الحركة بتسارع ثابت في مستوٍ'
        - 'حركة المقذوفات: المسار والمدى وأقصى ارتفاع'
    reading: Serway §4.1–4.3
    activity: { en: 'Quiz 1; Lab (TP 3): motion in the gravitational field; try the projectile simulation', ar: 'الاختبار القصير 1؛ المختبر (TP 3): الحركة في حقل الثقالة؛ جرّب محاكاة المقذوفات' }
    milestone: quiz
  - week: 5
    title: { en: 'Circular and relative motion', ar: 'الحركة الدائرية والحركة النسبية' }
    topics:
      en:
        - 'Uniform circular motion, centripetal acceleration'
        - 'Tangential and normal (radial) acceleration'
        - 'Polar coordinates and the intrinsic (Frenet) frame'
        - 'Relative velocity and Galilean transformation'
      ar:
        - 'الحركة الدائرية المنتظمة والتسارع المركزي'
        - 'التسارع المماسي والتسارع الناظمي (القطري)'
        - 'الإحداثيات القطبية ومعلم فرينيه الذاتي'
        - 'السرعة النسبية وتحويل غاليليو'
    reading: Serway §4.4–4.6
    activity: { en: 'TD 2–3 (kinematics); Lab (TP 2): circular motion', ar: 'السلسلتان الموجهتان 2–3 (علم الحركة)؛ المختبر (TP 2): الحركة الدائرية' }
  - week: 6
    title: { en: 'The laws of motion', ar: 'قوانين الحركة' }
    topics:
      en:
        - 'Force, mass and inertia; inertial frames'
        - 'Newton''s three laws'
        - 'Weight, normal force, tension'
        - 'Particle in equilibrium and under a net force'
      ar:
        - 'القوة والكتلة والقصور الذاتي؛ المعالم العطالية'
        - 'قوانين نيوتن الثلاثة'
        - 'الثقل ورد الفعل العمودي والشد'
        - 'جسيم في حالة توازن وجسيم تحت تأثير محصلة قوى'
    reading: Serway §5.1–5.7
    activity: { en: 'Quiz 2; TD 4 (dynamics)', ar: 'الاختبار القصير 2؛ السلسلة الموجهة 4 (التحريك)' }
    milestone: quiz
  - week: 7
    title: { en: 'Friction and circular dynamics', ar: 'الاحتكاك وتحريك الحركة الدائرية' }
    topics:
      en:
        - 'Static and kinetic friction'
        - 'Dynamics of uniform and non-uniform circular motion'
        - 'Motion in accelerated frames (qualitative)'
        - 'Motion with resistive forces'
      ar:
        - 'الاحتكاك السكوني والاحتكاك الحركي'
        - 'تحريك الحركة الدائرية المنتظمة وغير المنتظمة'
        - 'الحركة في المعالم المتسارعة (وصفيًا)'
        - 'الحركة بوجود قوى المقاومة'
    reading: Serway §5.8, ch. 6
    activity: { en: 'Midterm exam 1 (weeks 1–6); Lab (TP 4): friction and contact forces', ar: 'الاختبار الدوري الأول (الأسابيع 1–6)؛ المختبر (TP 4): الاحتكاك وقوة التلامس' }
    milestone: midterm
  - week: 8
    title: { en: 'Energy of a system', ar: 'طاقة نظام' }
    topics:
      en:
        - 'Work done by a constant and a varying force'
        - 'Spring force and Hooke''s law'
        - 'Kinetic energy and the work–kinetic energy theorem'
        - 'Potential energy; conservative forces; energy diagrams'
      ar:
        - 'شغل قوة ثابتة وقوة متغيرة'
        - 'قوة النابض وقانون هوك'
        - 'الطاقة الحركية ومبرهنة الشغل والطاقة الحركية'
        - 'طاقة الوضع؛ القوى المحافظة؛ مخططات الطاقة'
    reading: Serway ch. 7
  - week: 9
    title: { en: 'Conservation of energy', ar: 'حفظ الطاقة' }
    topics:
      en:
        - 'Isolated and non-isolated systems'
        - 'Conservation of mechanical energy'
        - 'Friction and changes in internal energy'
        - 'Power'
      ar:
        - 'الأنظمة المعزولة وغير المعزولة'
        - 'حفظ الطاقة الميكانيكية'
        - 'الاحتكاك وتغير الطاقة الداخلية'
        - 'القدرة'
    reading: Serway ch. 8
    activity: { en: 'Lab (TP 5): study of an energy transfer', ar: 'المختبر (TP 5): دراسة تحويل للطاقة' }
  - week: 10
    title: { en: 'Linear momentum and collisions', ar: 'الزخم الخطي والتصادمات' }
    topics:
      en:
        - 'Linear momentum and impulse'
        - 'Conservation of momentum for an isolated system'
        - 'Elastic and inelastic collisions in 1D and 2D'
        - 'Centre of mass and motion of a system of particles'
      ar:
        - 'الزخم الخطي والدفع'
        - 'حفظ الزخم الخطي لنظام معزول'
        - 'التصادمات المرنة وغير المرنة في بعد وبعدين'
        - 'مركز الكتلة وحركة نظام من الجسيمات'
    reading: Serway §9.1–9.7
    activity: { en: 'Quiz 3', ar: 'الاختبار القصير 3' }
    milestone: quiz
  - week: 11
    title: { en: 'Rotation of a rigid body', ar: 'دوران الجسم الصلب' }
    topics:
      en:
        - 'Angular position, velocity and acceleration'
        - 'Rotational kinetic energy and moment of inertia'
        - 'Torque and Newton''s second law for rotation'
        - 'Parallel-axis theorem'
      ar:
        - 'الموضع الزاوي والسرعة الزاوية والتسارع الزاوي'
        - 'الطاقة الحركية الدورانية وعزم القصور الذاتي'
        - 'عزم القوة وقانون نيوتن الثاني للدوران'
        - 'مبرهنة المحاور المتوازية'
    reading: Serway §10.1–10.8
  - week: 12
    title: { en: 'Rolling and angular momentum', ar: 'التدحرج والزخم الزاوي' }
    topics:
      en:
        - 'Rolling without slipping'
        - 'Angular momentum of a particle and of a rigid body'
        - 'Conservation of angular momentum'
      ar:
        - 'التدحرج دون انزلاق'
        - 'الزخم الزاوي لجسيم ولجسم صلب'
        - 'حفظ الزخم الزاوي'
    reading: Serway §10.9, ch. 11
    activity: { en: 'Midterm exam 2 (weeks 7–10)', ar: 'الاختبار الدوري الثاني (الأسابيع 7–10)' }
    milestone: midterm
  - week: 13
    title: { en: 'Universal gravitation', ar: 'الجذب العام' }
    topics:
      en:
        - 'Newton''s law of universal gravitation'
        - 'Gravitational field and free-fall acceleration'
        - 'Kepler''s laws and circular orbits'
        - 'Gravitational potential energy; escape speed'
      ar:
        - 'قانون نيوتن للجذب العام'
        - 'حقل الجاذبية وتسارع السقوط الحر'
        - 'قوانين كبلر والمدارات الدائرية'
        - 'طاقة الوضع الثقالية؛ سرعة الإفلات'
    reading: Serway ch. 13
    activity: { en: 'Quiz 4', ar: 'الاختبار القصير 4' }

  - { en: Electricity & magnetism vocabulary, ar: مفردات الكهرباء والمغناطيسية }
  - { en: Waves & modern physics vocabulary, ar: مفردات الموجات والفيزياء الحديثة }
  - { en: Reading equations aloud, ar: قراءة المعادلات بصوت عالٍ }
  - { en: Lab reports & abstracts, ar: تقارير المختبر والملخصات }
  - { en: Scientific emails, ar: الرسائل العلمية الرسمية }
  - { en: Oral presentations, ar: العروض الشفهية }

outcomes:
  - id: CLO1
    bloom: remember
    domain: knowledge
    text:
      en: Recognise and correctly use the core English vocabulary of mechanics, waves, thermodynamics, electromagnetism and modern physics.
      ar: يتعرّف على المفردات الإنجليزية الأساسية في الميكانيكا والموجات والديناميكا الحرارية والكهرومغناطيسية والفيزياء الحديثة ويستعملها استعمالًا صحيحًا.
    assessed_by: [quizzes, homework, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: Read aloud, and write in words, numbers, units, symbols and simple mathematical expressions.
      ar: يقرأ بصوت عالٍ الأعداد والوحدات والرموز والعبارات الرياضية البسيطة ويكتبها بالحروف.
    assessed_by: [quizzes, presentation, final]
  - id: CLO3
    bloom: analyze
    domain: skills
    text:
      en: Read an elementary scientific or technical text, identify its main ideas and key details, and summarise it orally or in writing.
      ar: يقرأ نصًا علميًا أو تقنيًا أوليًا، ويحدد أفكاره الرئيسية وتفاصيله المهمة، ويلخّصه شفهيًا أو كتابيًا.
    assessed_by: [homework, final]
  - id: CLO4
    bloom: apply
    domain: skills
    text:
      en: Use the grammar of scientific English (present simple for laws, passive voice for methods, comparatives, cause–effect connectors, hedging) accurately.
      ar: يوظّف قواعد الإنجليزية العلمية بدقة (المضارع البسيط للقوانين، والمبني للمجهول لوصف الطرائق، وصيغ المقارنة، وأدوات السبب والنتيجة، وصيغ التحفّظ).
    assessed_by: [quizzes, homework, report, final]
  - id: CLO5
    bloom: create
    domain: skills
    text:
      en: Write a short lab report, an abstract, a description of a graph and a formal email with the appropriate structure and register.
      ar: يكتب تقرير مختبر قصيرًا وملخصًا علميًا ووصفًا لمنحنى ورسالة إلكترونية رسمية بالبنية والأسلوب المناسبين.
    assessed_by: [report, homework, final]
  - id: CLO6
    bloom: create
    domain: skills
    text:
      en: Deliver a structured five-minute oral presentation on a physics topic and answer questions from the audience.
      ar: يقدّم عرضًا شفهيًا منظّمًا مدته خمس دقائق حول موضوع فيزيائي ويجيب عن أسئلة الحضور.
    assessed_by: [presentation]
  - id: CLO7
    bloom: understand
    domain: skills
    text:
      en: Follow a short lecture, video or technical conversation in English and note its key information.
      ar: يتابع محاضرة قصيرة أو مقطعًا مرئيًا أو محادثة تقنية بالإنجليزية ويدوّن معلوماتها الأساسية.
    assessed_by: [participation, homework]
  - id: CLO8
    bloom: apply
    domain: values
    text:
      en: Act with academic integrity, citing sources and producing original texts rather than copied or machine-translated ones.
      ar: يلتزم بالنزاهة الأكاديمية، فيوثّق المصادر وينتج نصوصًا أصيلة لا منسوخة ولا مترجمة آليًا.
    assessed_by: [report, homework, participation]

assessment:
  - id: homework
    type: homework
    weight: 25
    title:
      en: Weekly assignments
      ar: الواجبات الأسبوعية
    detail:
      en: Each unit of the lecture notes ends with a text to read, comprehension and vocabulary questions, and a written-expression task. Answers are due one week later. Master students prepare a whole unit, with full text, questions, answers and the writing task.
      ar: تنتهي كل وحدة من المذكرة بنص للقراءة وأسئلة في الفهم والمفردات ومهمة في التعبير الكتابي، وتُسلَّم الأجوبة بعد أسبوع. ويُعِدّ طلبة الماستر وحدة كاملة بنصها وأسئلتها وأجوبتها ومهمتها الكتابية.
    when:
      en: Weeks 2–12
      ar: الأسابيع 2–12
  - id: quizzes
    type: quiz
    weight: 10
    title:
      en: Vocabulary and grammar quizzes
      ar: اختبارات قصيرة في المفردات والقواعد
    detail:
      en: Three 15-minute quizzes covering vocabulary, the reading of numbers and equations, and grammar points.
      ar: ثلاثة اختبارات قصيرة مدة كل منها 15 دقيقة في المفردات وقراءة الأعداد والمعادلات والقواعد.
    when:
      en: Weeks 4, 8, 11
      ar: الأسابيع 4 و8 و11
  - id: report
    type: report
    weight: 10
    title:
      en: Lab report and abstract
      ar: تقرير مختبر وملخص علمي
    detail:
      en: A two-page report in IMRaD form on a simple experiment (data supplied), with a 100–150-word abstract. Graded on structure, accuracy, register and language.
      ar: تقرير من صفحتين وفق بنية IMRaD عن تجربة بسيطة (تُقدَّم المعطيات)، مع ملخص من 100–150 كلمة. يُقيَّم على البنية والدقة والأسلوب واللغة.
    when:
      en: Due week 10
      ar: يُسلَّم في الأسبوع 10
  - id: presentation
    type: presentation
    weight: 15
    title:
      en: Oral presentation
      ar: العرض الشفهي
    detail:
      en: A five-minute talk with slides on a physics topic of the student's choice, followed by two or three questions. Graded on content, structure, pronunciation of terms and equations, fluency and handling of questions.
      ar: عرض مدته خمس دقائق مع شرائح حول موضوع فيزيائي يختاره الطالب، تليه سؤالان أو ثلاثة. يُقيَّم على المحتوى والبنية ونطق المصطلحات والمعادلات والطلاقة والتعامل مع الأسئلة.
    when:
      en: Weeks 13–14
      ar: الأسبوعان 13–14
  - id: participation
    type: participation
    weight: 5
    title:
      en: Participation
      ar: المشاركة
    detail:
      en: Reading aloud, short listening tasks and pair discussions in class.
      ar: القراءة بصوت عالٍ ومهام الاستماع القصيرة والنقاش الثنائي داخل القسم.
    when:
      en: All weeks
      ar: كل الأسابيع
  - id: final
    type: final
    weight: 35
    title:
      en: Final exam
      ar: الاختبار النهائي
    detail:
      en: One hour. Reading comprehension of an unseen physics text, vocabulary and grammar questions, and a short written-expression task.
      ar: ساعة واحدة. فهم نص فيزيائي غير مدروس، وأسئلة في المفردات والقواعد، ومهمة قصيرة في التعبير الكتابي.
    when:
      en: Final exam period
      ar: فترة الاختبارات النهائية

schedule:
  - week: 1
    title:
      en: English in physics; numbers, symbols and units
      ar: الإنجليزية في الفيزياء؛ الأعداد والرموز والوحدات
    topics:
      en:
        - Introductory session and needs analysis
        - 'Reading numbers aloud: decimals, powers of ten, fractions'
        - SI units and prefixes; Greek letters
      ar:
        - حصة تعريفية وتحديد الاحتياجات
        - 'قراءة الأعداد بصوت عالٍ: الكسور العشرية وقوى العشرة والكسور'
        - وحدات النظام الدولي وبادئاتها؛ الحروف اليونانية
    reading: Lecture notes – introduction
  - week: 2
    title:
      en: Forces and motion
      ar: القوى والحركة
    topics:
      en:
        - Vocabulary of kinematics and Newton's laws
        - 'Grammar: present simple for laws and definitions'
        - Defining with relative clauses
      ar:
        - مفردات علم الحركة وقوانين نيوتن
        - 'القواعد: المضارع البسيط للقوانين والتعاريف'
        - التعريف باستعمال الجمل الموصولة
    reading: Lecture notes – Forces & motion
    activity:
      en: Assignment 1
      ar: الواجب 1
  - week: 3
    title:
      en: Energy and its sources
      ar: الطاقة ومصادرها
    topics:
      en:
        - Work, energy, power; renewable and non-renewable sources
        - 'Grammar: the passive voice to describe processes'
      ar:
        - الشغل والطاقة والقدرة؛ المصادر المتجددة وغير المتجددة
        - 'القواعد: المبني للمجهول لوصف العمليات'
    reading: Lecture notes – Energy & its sources
    activity:
      en: Assignment 2
      ar: الواجب 2
  - week: 4
    title:
      en: Gravity
      ar: الجاذبية
    topics:
      en:
        - Weight, free fall, orbits and tides
        - Comparatives and superlatives
        - Reading equations aloud (1)
      ar:
        - الوزن والسقوط الحر والمدارات والمد والجزر
        - صيغ المقارنة والتفضيل
        - قراءة المعادلات بصوت عالٍ (1)
    reading: Lecture notes – Gravity
    activity:
      en: Assignment 3; quiz 1
      ar: الواجب 3؛ الاختبار القصير 1
    milestone: quiz
  - week: 5
    title:
      en: Sound waves
      ar: الموجات الصوتية
    topics:
      en:
        - Oscillations and waves; amplitude, frequency, wavelength
        - Describing shape, size and quantity
      ar:
        - الاهتزازات والموجات؛ السعة والتردد وطول الموجة
        - وصف الشكل والحجم والكمية
    reading: Lecture notes – Sound waves
    activity:
      en: Assignment 4
      ar: الواجب 4
  - week: 6
    title:
      en: Pitch, echoes and ultrasound
      ar: حدة الصوت والصدى والموجات فوق الصوتية
    topics:
      en:
        - Pitch, loudness, echoes, medical and industrial ultrasound
        - Describing graphs and trends (rise, fall, peak, level off)
      ar:
        - حدة الصوت وشدته والصدى والموجات فوق الصوتية في الطب والصناعة
        - وصف المنحنيات والاتجاهات (يرتفع، ينخفض، يبلغ ذروته، يستقر)
    reading: Lecture notes – Pitch, echoes & ultrasound
    activity:
      en: Assignment 5
      ar: الواجب 5
  - week: 7
    title:
      en: 'Thermodynamics: the arrow of time'
      ar: 'الديناميكا الحرارية: سهم الزمن'
    topics:
      en:
        - Heat, temperature, entropy and irreversibility
        - Cause and effect connectors (because of, therefore, as a result)
      ar:
        - الحرارة ودرجة الحرارة والإنتروبيا واللاعكوسية
        - أدوات السبب والنتيجة (because of، therefore، as a result)
    reading: Lecture notes – The arrow of time
    activity:
      en: Assignment 6
      ar: الواجب 6
  - week: 8
    title:
      en: The electricity of things
      ar: كهرباء الأشياء
    topics:
      en:
        - Charge, current, voltage, resistance, circuits
        - Giving instructions; reading a technical manual
      ar:
        - الشحنة والتيار والجهد والمقاومة والدارات
        - إعطاء التعليمات؛ قراءة دليل استعمال تقني
    reading: Lecture notes – Electricity of things
    activity:
      en: Assignment 7; quiz 2
      ar: الواجب 7؛ الاختبار القصير 2
    milestone: quiz
  - week: 9
    title:
      en: Our own giant magnet
      ar: مغناطيسنا العملاق
    topics:
      en:
        - Magnetic fields, the Earth's magnetism, compasses
        - 'Writing a lab report: the IMRaD structure'
      ar:
        - المجالات المغناطيسية ومغناطيسية الأرض والبوصلة
        - 'كتابة تقرير المختبر: بنية IMRaD'
    reading: Lecture notes – Our own giant magnet
    activity:
      en: Assignment 8
      ar: الواجب 8
  - week: 10
    title:
      en: Light, lasers and the power of light
      ar: الضوء والليزر وقدرة الضوء
    topics:
      en:
        - Reflection, refraction, lasers and their applications
        - Writing an abstract
      ar:
        - الانعكاس والانكسار والليزر وتطبيقاته
        - كتابة الملخص العلمي
    reading: Lecture notes – Lasers; The power of light
    activity:
      en: Assignment 9; lab report and abstract due
      ar: الواجب 9؛ تسليم تقرير المختبر والملخص
    milestone: project
  - week: 11
    title:
      en: Relativity and quantum mechanics
      ar: النسبية وميكانيكا الكم
    topics:
      en:
        - Time dilation, mass–energy, photons and wave–particle duality
        - Hedging and modal verbs (may, might, appears to)
        - Writing formal emails
      ar:
        - تمدد الزمن، وتكافؤ الكتلة والطاقة، والفوتونات، والطبيعة المزدوجة موجة–جسيم
        - صيغ التحفّظ والأفعال الناقصة (may، might، appears to)
        - كتابة الرسائل الإلكترونية الرسمية
    reading: Lecture notes – Relativity; Quantum mechanics
    activity:
      en: Assignment 10; quiz 3
      ar: الواجب 10؛ الاختبار القصير 3
    milestone: quiz
  - week: 12
    title:
      en: Atomic and nuclear physics
      ar: الفيزياء الذرية والنووية
    topics:
      en:
        - Atoms, isotopes, radioactivity and half-life
        - 'Oral presentation skills: structure, signposting, slides'
      ar:
        - الذرات والنظائر والنشاط الإشعاعي وعمر النصف
        - 'مهارات العرض الشفهي: البنية وعبارات الربط والشرائح'
    reading: Lecture notes – Atomic physics; Nuclear physics
    activity:
      en: Assignment 11
      ar: الواجب 11
  - week: 13
    title:
      en: Particles and the cosmos
      ar: الجسيمات والكون
    topics:
      en:
        - The Standard Model of particle physics
        - The life cycles of stars; the Moon
        - Student presentations (1)
      ar:
        - النموذج القياسي لفيزياء الجسيمات
        - دورة حياة النجوم؛ القمر
        - عروض الطلبة (1)
    reading: Lecture notes – Standard Model; Stars; The Moon
    milestone: project
  - week: 14
    title:
      en: Presentations and review
      ar: العروض والمراجعة
    topics:
      en:
        - Student presentations (2)
        - Review and exam practice
      ar:
        - عروض الطلبة (2)
        - مراجعة وتدريب على الاختبار
    milestone: review


exam_guide:
  format:
    en: 'One hour, three parts. Part A (about 40%) is reading comprehension of an unseen physics text, with true/false, short-answer and vocabulary-in-context questions. Part B (about 30%) is language work: grammar, word formation, and writing numbers or equations in words. Part C (about 30%) is a written-expression task of 100–150 words, such as a summary, a description of a graph, an abstract or an email.'
    ar: 'ساعة واحدة في ثلاثة أجزاء. الجزء (أ) (نحو 40%) فهم نص فيزيائي غير مدروس، بأسئلة صواب/خطأ وأجوبة قصيرة ومفردات في السياق. الجزء (ب) (نحو 30%) تمارين لغوية: القواعد، واشتقاق الكلمات، وكتابة الأعداد أو المعادلات بالحروف. الجزء (ج) (نحو 30%) مهمة تعبير كتابي من 100–150 كلمة، مثل ملخص أو وصف منحنى أو ملخص علمي أو رسالة إلكترونية.'
  allowed:
    en: Pen and paper only. Dictionaries, translators, phones and calculators are not allowed.
    ar: القلم والورقة فقط. لا يُسمح بالقواميس ولا بأدوات الترجمة ولا بالهواتف ولا بالآلات الحاسبة.
  tips:
    - en: Read the questions before the text, then scan the text for the answers; underline key words.
      ar: اقرأ الأسئلة قبل النص، ثم امسح النص بحثًا عن الأجوبة، وضع خطًا تحت الكلمات المفتاحية.
    - en: Guess unknown words from context and from their roots (e.g. thermo-, -meter, electro-) before giving up.
      ar: خمّن معاني الكلمات المجهولة من السياق ومن جذورها (مثل البادئة thermo- واللاحقة meter- والبادئة electro-) قبل أن تستسلم.
    - en: Answer in your own words; copying whole sentences from the text earns few marks.
      ar: أجب بكلماتك الخاصة؛ فنسخ جمل كاملة من النص لا يمنح إلا علامات قليلة.
    - en: 'In the writing task, plan three short paragraphs and check verb tenses, articles (a/an/the) and plural -s.'
      ar: 'في مهمة الكتابة خطّط لثلاث فقرات قصيرة، وراجع أزمنة الأفعال وأدوات التعريف والتنكير (a/an/the) وعلامة الجمع -s.'
    - en: 'Use a decimal point, not a comma (2.5, not 2,5), and leave a space between number and unit (5 N).'
      ar: 'استعمل النقطة العشرية لا الفاصلة (2.5 وليس 2,5)، واترك فراغًا بين العدد والوحدة (5 N).'

problems:
  - title:
      en: Reading equations aloud
      ar: قراءة المعادلات بصوت عالٍ
    difficulty: 1
    statement:
      en: |
        Write in words how each expression is read in English:
        (a) \(F = ma\); (b) \(E = mc^2\); (c) \(c = 3.0\times10^{8}\ \text{m s}^{-1}\); (d) \(\lambda = h/p\); (e) \(\int_0^{\infty} e^{-x}\,\dd x = 1\); (f) \(\pdv{u}{t} = D\,\dfrac{\partial^2 u}{\partial x^2}\).
      ar: |
        اكتب بالحروف الإنجليزية كيف تُقرأ كل عبارة:
        (أ) \(F = ma\)؛ (ب) \(E = mc^2\)؛ (ج) \(c = 3.0\times10^{8}\ \text{m s}^{-1}\)؛ (د) \(\lambda = h/p\)؛ (هـ) \(\int_0^{\infty} e^{-x}\,\dd x = 1\)؛ (و) \(\pdv{u}{t} = D\,\dfrac{\partial^2 u}{\partial x^2}\).
    hint:
      en: '“=” is read “equals” (or “is equal to”), a/b “a over b”, x² “x squared”, 10⁸ “ten to the (power) eight”.'
      ar: 'تُقرأ “=” equals (أو is equal to)، وa/b تُقرأ a over b، وx² تُقرأ x squared، و10⁸ تُقرأ ten to the (power) eight.'
    solution:
      en: |
        (a) “F equals m a” — or, in full, “force equals mass times acceleration”.
        <br>(b) “E equals m c squared.”
        <br>(c) “c equals three point zero times ten to the eight metres per second.”
        <br>(d) “lambda equals h over p” (“the wavelength equals Planck's constant divided by the momentum”).
        <br>(e) “The integral from zero to infinity of e to the minus x, d x, equals one.”
        <br>(f) “Partial u by partial t equals D times partial squared u by partial x squared” — or “the partial derivative of u with respect to t equals D times the second partial derivative of u with respect to x”.
      ar: |
        (أ) “F equals m a”، أو كاملة: “force equals mass times acceleration”.
        <br>(ب) “E equals m c squared.”
        <br>(ج) “c equals three point zero times ten to the eight metres per second.” لاحظ: النقطة العشرية تُقرأ point، ووحدة m s⁻¹ تُقرأ metres per second.
        <br>(د) “lambda equals h over p” (أي: طول الموجة يساوي ثابت بلانك مقسومًا على الزخم).
        <br>(هـ) “The integral from zero to infinity of e to the minus x, d x, equals one.”
        <br>(و) “Partial u by partial t equals D times partial squared u by partial x squared”، أو “the partial derivative of u with respect to t equals D times the second partial derivative of u with respect to x”.
  - title:
      en: Vocabulary in context — the simple pendulum
      ar: المفردات في السياق — النواس البسيط
    difficulty: 1
    statement:
      en: |
        Fill in the blanks with: <em>period, amplitude, frequency, oscillates, length, gravitational</em>.
        <br>“A simple pendulum (1) ___ about its equilibrium position. The maximum displacement from equilibrium is called the (2) ___. The time for one complete swing is the (3) ___, and the number of swings per second is the (4) ___. For small swings, the period depends only on the (5) ___ of the string and on the (6) ___ field strength.”
      ar: |
        املأ الفراغات بالكلمات: <em>period, amplitude, frequency, oscillates, length, gravitational</em>.
        <br>“A simple pendulum (1) ___ about its equilibrium position. The maximum displacement from equilibrium is called the (2) ___. The time for one complete swing is the (3) ___, and the number of swings per second is the (4) ___. For small swings, the period depends only on the (5) ___ of the string and on the (6) ___ field strength.”
    hint:
      en: Decide first which blank needs a verb (third person -s) and which need nouns or an adjective.
      ar: حدّد أولًا أي فراغ يحتاج فعلًا (مع -s للغائب المفرد) وأيها يحتاج اسمًا أو صفة.
    solution:
      en: |
        (1) oscillates (verb, present simple, third person); (2) amplitude; (3) period; (4) frequency; (5) length; (6) gravitational (adjective before “field”).
        <br>The physics behind it: \(T = 2\pi\sqrt{L/g}\) for small amplitudes, so \(T\) is independent of the mass and of the amplitude.
      ar: |
        (1) oscillates (فعل في المضارع البسيط مع ضمير الغائب)؛ (2) amplitude (السعة)؛ (3) period (الدور)؛ (4) frequency (التردد)؛ (5) length (الطول)؛ (6) gravitational (صفة قبل field: شدة مجال الجاذبية).
        <br>الفيزياء وراء النص: \(T = 2\pi\sqrt{L/g}\) للسعات الصغيرة، فالدور لا يتوقف على الكتلة ولا على السعة.
  - title:
      en: From lab notebook to Methods section
      ar: من دفتر المختبر إلى قسم الطريقة
    difficulty: 2
    statement:
      en: |
        Rewrite these informal notes as a formal Methods paragraph (passive voice, past simple, complete sentences, correct units). Then compute \(g\) from the result.
        <br><em>“we took a steel ball. dropped it from 1 m. timed the fall with a light gate. did it 10 times. average 0.45 s.”</em>
      ar: |
        أعد صياغة هذه الملاحظات غير الرسمية في فقرة رسمية لقسم الطريقة (المبني للمجهول، الماضي البسيط، جمل كاملة، وحدات صحيحة)، ثم احسب \(g\) من النتيجة.
        <br><em>“we took a steel ball. dropped it from 1 m. timed the fall with a light gate. did it 10 times. average 0.45 s.”</em>
    hint:
      en: 'Methods describe what was done, so use the past simple passive: “was released”, “was measured”. For the free fall, \(h = \tfrac12 g t^2\).'
      ar: 'قسم الطريقة يصف ما أُنجز، لذا استعمل المبني للمجهول في الماضي البسيط: “was released” و“was measured”. وللسقوط الحر \(h = \tfrac12 g t^2\).'
    solution:
      en: |
        <em>Model answer:</em> “A steel ball was released from rest at a height of 1.00 m above a light gate. The fall time was measured electronically, and the measurement was repeated ten times. The mean fall time was 0.45 s.”
        <br>Points to notice: the subject is the object studied, not “we”; verbs are in the past simple passive; numbers carry units with a space (1.00 m, 0.45 s); “ten” is written in words because it is a count, not a measurement.
        <br>Physics: \(g = 2h/t^2 = 2(1.00\ \text{m})/(0.45\ \text{s})^2 \approx 9.9\ \text{m s}^{-2}\).
      ar: |
        <em>جواب نموذجي (بالإنجليزية):</em> “A steel ball was released from rest at a height of 1.00 m above a light gate. The fall time was measured electronically, and the measurement was repeated ten times. The mean fall time was 0.45 s.”
        <br>ملاحظات: الفاعل النحوي هو الشيء المدروس لا “we”؛ والأفعال في الماضي البسيط المبني للمجهول؛ والأعداد مرفقة بوحداتها مع فراغ (1.00 m و0.45 s)؛ وكُتبت “ten” بالحروف لأنها عدد مرات لا قيمة مقيسة.
        <br>الفيزياء: \(g = 2h/t^2 = 2(1.00\ \text{m})/(0.45\ \text{s})^2 \approx 9.9\ \text{m s}^{-2}\).
  - title:
      en: Describing a graph — discharging a capacitor
      ar: وصف منحنى — تفريغ مكثّف
    difficulty: 2
    statement:
      en: |
        A graph shows the voltage across a capacitor discharging through a resistor. The voltage starts at 10 V, falls to about 3.7 V after 1 s, to 1.4 V after 2 s, and is almost zero after 5 s. Write a paragraph of 60–80 words describing the graph and explaining its shape. Use at least four expressions of trend.
      ar: |
        يمثّل منحنى الجهد بين طرفي مكثّف يتفرغ عبر مقاومة. يبدأ الجهد من 10 V، وينخفض إلى نحو 3.7 V بعد 1 s، ثم إلى 1.4 V بعد 2 s، ويكاد ينعدم بعد 5 s. اكتب بالإنجليزية فقرة من 60–80 كلمة تصف المنحنى وتفسّر شكله، مستعملًا أربع عبارات على الأقل للتعبير عن الاتجاه.
    hint:
      en: 'Useful language: “falls sharply”, “decreases gradually”, “levels off”, “approaches zero”, “by a factor of”. The decay law is \(V = V_0 e^{-t/RC}\).'
      ar: 'عبارات مفيدة: “falls sharply” و“decreases gradually” و“levels off” و“approaches zero” و“by a factor of”. وقانون التناقص هو \(V = V_0 e^{-t/RC}\).'
    solution:
      en: |
        <em>Model answer:</em> “The graph shows how the voltage across the capacitor varies with time during discharge. The voltage falls sharply at first, from 10 V to about 3.7 V in the first second. After that, it decreases more and more slowly, reaching 1.4 V at 2 s, and it levels off close to zero after about 5 s. This is exponential decay: in every second the voltage drops by the same factor, \(e \approx 2.7\), so the time constant \(RC\) is 1 s.”
        <br>Check: \(10\,e^{-1} = 3.7\ \text{V}\), \(10\,e^{-2} = 1.4\ \text{V}\), \(10\,e^{-5} \approx 0.07\ \text{V}\).
      ar: |
        <em>جواب نموذجي (بالإنجليزية):</em> “The graph shows how the voltage across the capacitor varies with time during discharge. The voltage falls sharply at first, from 10 V to about 3.7 V in the first second. After that, it decreases more and more slowly, reaching 1.4 V at 2 s, and it levels off close to zero after about 5 s. This is exponential decay: in every second the voltage drops by the same factor, \(e \approx 2.7\), so the time constant \(RC\) is 1 s.”
        <br>تحقق: \(10\,e^{-1} = 3.7\ \text{V}\)، \(10\,e^{-2} = 1.4\ \text{V}\)، \(10\,e^{-5} \approx 0.07\ \text{V}\).
  - title:
      en: Writing an abstract
      ar: كتابة ملخص علمي
    difficulty: 3
    statement:
      en: |
        Write an abstract (maximum 120 words) for this experiment. The period \(T\) of a simple pendulum was measured for ten lengths \(L\) between 0.20 m and 1.00 m, timing 20 oscillations each time. A graph of \(T^2\) against \(L\) was a straight line through the origin with slope \(4.03 \pm 0.02\ \text{s}^2\,\text{m}^{-1}\).
      ar: |
        اكتب بالإنجليزية ملخصًا علميًا (120 كلمة على الأكثر) لهذه التجربة. قيس الدور \(T\) لنواس بسيط من أجل عشرة أطوال \(L\) بين 0.20 m و1.00 m، بتوقيت 20 اهتزازة في كل مرة. وكان منحنى \(T^2\) بدلالة \(L\) خطًا مستقيمًا يمر بالمبدأ وميله \(4.03 \pm 0.02\ \text{s}^2\,\text{m}^{-1}\).
    hint:
      en: 'An abstract answers four questions in four to six sentences: why, how, what was found, and what it means. Use \(g = 4\pi^2/\text{slope}\) and propagate the relative uncertainty.'
      ar: 'يجيب الملخص عن أربعة أسئلة في أربع إلى ست جمل: لماذا، وكيف، وماذا وُجد، وما معنى ذلك. استعمل \(g = 4\pi^2/\text{slope}\) وانقل الارتياب النسبي.'
    solution:
      en: |
        Physics first: \(g = 4\pi^2/4.03 = 9.80\ \text{m s}^{-2}\); relative uncertainty \(0.02/4.03 = 0.5\%\), so \(g = 9.80 \pm 0.05\ \text{m s}^{-2}\).
        <br><em>Model abstract (88 words):</em> “The aim of this experiment was to determine the acceleration due to gravity using a simple pendulum. The period was measured for ten string lengths between 0.20 m and 1.00 m by timing twenty oscillations with a stopwatch. A plot of the square of the period against length was linear and passed through the origin, as predicted by small-angle theory. From its slope, \(g = 9.80 \pm 0.05\ \text{m s}^{-2}\) was obtained, in agreement with the accepted local value. The method is simple, inexpensive and accurate to better than one per cent.”
      ar: |
        الفيزياء أولًا: \(g = 4\pi^2/4.03 = 9.80\ \text{m s}^{-2}\)؛ والارتياب النسبي \(0.02/4.03 = 0.5\%\)، إذن \(g = 9.80 \pm 0.05\ \text{m s}^{-2}\).
        <br><em>ملخص نموذجي (88 كلمة):</em> “The aim of this experiment was to determine the acceleration due to gravity using a simple pendulum. The period was measured for ten string lengths between 0.20 m and 1.00 m by timing twenty oscillations with a stopwatch. A plot of the square of the period against length was linear and passed through the origin, as predicted by small-angle theory. From its slope, \(g = 9.80 \pm 0.05\ \text{m s}^{-2}\) was obtained, in agreement with the accepted local value. The method is simple, inexpensive and accurate to better than one per cent.”
        <br>لاحظ البنية: الهدف ← الطريقة ← النتيجة مع ارتيابها ← الخلاصة، وكلها بالماضي البسيط ما عدا الحكم العام الأخير.
  - title:
      en: A formal email to a supervisor
      ar: رسالة إلكترونية رسمية إلى مشرف
    difficulty: 2
    statement:
      en: |
        You cannot submit your lab report on time because the department's oscilloscope was out of order for a week. Write an email (80–120 words) to your supervisor asking for a short extension and proposing a new date.
      ar: |
        لا تستطيع تسليم تقرير المختبر في موعده لأن راسم الذبذبات في القسم كان معطّلًا مدة أسبوع. اكتب بالإنجليزية رسالة إلكترونية (80–120 كلمة) إلى مشرفك تطلب فيها تمديدًا قصيرًا وتقترح موعدًا جديدًا.
    hint:
      en: 'Clear subject line; formal greeting; reason in one or two sentences; precise request; polite closing (“Kind regards”); full name.'
      ar: 'سطر موضوع واضح؛ تحية رسمية؛ السبب في جملة أو جملتين؛ طلب محدد؛ ختام مهذّب (“Kind regards”)؛ الاسم الكامل.'
    solution:
      en: |
        <em>Model answer:</em>
        <br><strong>Subject:</strong> Request for a short extension – RC circuit lab report
        <br>Dear Dr Smith,
        <br>I am writing to ask whether I could have a short extension for the RC circuit lab report, which is due this Thursday. The oscilloscope in Laboratory 2 was out of order from 3 to 10 March, so I was only able to record the discharge curves yesterday. I have analysed most of the data and I am confident that I can submit the complete report by Monday 17 March.
        <br>Thank you for considering my request. I would be happy to discuss it during your office hours.
        <br>Kind regards,
        <br>[Your full name], Year 2 Physics
      ar: |
        <em>جواب نموذجي (بالإنجليزية):</em>
        <br><strong>Subject:</strong> Request for a short extension – RC circuit lab report
        <br>Dear Dr Smith,
        <br>I am writing to ask whether I could have a short extension for the RC circuit lab report, which is due this Thursday. The oscilloscope in Laboratory 2 was out of order from 3 to 10 March, so I was only able to record the discharge curves yesterday. I have analysed most of the data and I am confident that I can submit the complete report by Monday 17 March.
        <br>Thank you for considering my request. I would be happy to discuss it during your office hours.
        <br>Kind regards,
        <br>[Your full name], Year 2 Physics
        <br>لاحظ: صيغ الطلب المهذّبة (I am writing to ask whether / I could)، والسبب الموضوعي المختصر، والتاريخ المقترح المحدد، وتجنّب الاختصارات العامية.

quizzes:
  - title:
      en: Numbers, symbols and units
      ar: الأعداد والرموز والوحدات
    questions:
      - q:
          en: 'How is \(x^2\) normally read aloud?'
          ar: 'كيف تُقرأ \(x^2\) عادةً بصوت عالٍ؟'
        options: ['x two', 'x squared', 'x double', 'two x']
        answer: 1
        explain:
          en: 'Powers 2 and 3 have special names: “x squared”, “x cubed”. Higher powers are “x to the fourth”, “x to the power n”.'
          ar: 'للأسّين 2 و3 اسمان خاصان: “x squared” و“x cubed”. أما الأسس الأعلى فتُقرأ “x to the fourth” و“x to the power n”.'
      - q:
          en: 'Which SI prefix means \(10^{-6}\)?'
          ar: 'أي بادئة في النظام الدولي تعني \(10^{-6}\)؟'
        options: ['milli- (m)', 'nano- (n)', 'micro- (μ)', 'pico- (p)']
        answer: 2
        explain:
          en: 'milli = \(10^{-3}\), micro = \(10^{-6}\), nano = \(10^{-9}\), pico = \(10^{-12}\). “μm” is read “micrometre” (or “micron”).'
          ar: 'milli = \(10^{-3}\)، وmicro = \(10^{-6}\)، وnano = \(10^{-9}\)، وpico = \(10^{-12}\). وتُقرأ “μm” “micrometre” (أو “micron”).'
      - q:
          en: 'How is \(\Delta T\) read?'
          ar: 'كيف تُقرأ \(\Delta T\)؟'
        options: ['delta T', 'triangle T', 'd T', 'del T']
        answer: 0
        explain:
          en: 'Δ is the Greek capital letter delta; \(\Delta T\) is read “delta T” and means “the change in T”. “d T” is for an infinitesimal \(\dd T\), and “del” is the operator \(\nabla\).'
          ar: 'Δ هو الحرف اليوناني الكبير دلتا، و\(\Delta T\) تُقرأ “delta T” وتعني “التغير في T”. أما “d T” فللتفاضل \(\dd T\)، و“del” للمؤثر \(\nabla\).'
      - q:
          en: 'How do you read \(3.0\times10^{8}\ \text{m s}^{-1}\)?'
          ar: 'كيف تقرأ \(3.0\times10^{8}\ \text{m s}^{-1}\)؟'
        options:
          - three comma zero ten eight metre second
          - three zero times eight metres a second
          - three point zero ten power eight metres
          - three point zero times ten to the eight metres per second
        answer: 3
        explain:
          en: 'English uses a decimal <em>point</em> (“three point zero”), “times ten to the eight” for the power of ten, and “per” for \(\text{s}^{-1}\).'
          ar: 'تستعمل الإنجليزية النقطة العشرية (“three point zero”)، وتُقرأ قوة العشرة “times ten to the eight”، وتُقرأ \(\text{s}^{-1}\) “per second”.'
      - q:
          en: The number written “2,5” in French is written in English as
          ar: العدد الذي يُكتب “2,5” بالفرنسية يُكتب بالإنجليزية
        options:
          - '2.5 — read “two point five”'
          - '2,5 — read “two comma five”'
          - '25 — read “twenty-five”'
          - '2;5 — read “two and five”'
        answer: 0
        explain:
          en: 'English uses a point as the decimal separator; a comma in English groups thousands (2,500 = two thousand five hundred). Confusing them is a classic error.'
          ar: 'تستعمل الإنجليزية النقطة فاصلًا عشريًا، أما الفاصلة فتفصل الآلاف (2,500 = ألفان وخمسمائة). والخلط بينهما خطأ شائع.'
  - title:
      en: Vocabulary of physics
      ar: مفردات الفيزياء
    questions:
      - q:
          en: '“The rate of change of velocity with time” is called'
          ar: '“معدل تغير السرعة المتجهة بالنسبة إلى الزمن” يسمّى'
        options: ['speed', 'acceleration', 'momentum', 'displacement']
        answer: 1
        explain:
          en: 'Acceleration \(\vb{a} = \dd\vb{v}/\dd t\). Speed is the magnitude of velocity, momentum is \(m\vb{v}\), displacement is the change in position.'
          ar: 'التسارع \(\vb{a} = \dd\vb{v}/\dd t\). أما speed فهي مقدار السرعة، وmomentum هو الزخم \(m\vb{v}\)، وdisplacement هو الإزاحة (تغير الموضع).'
      - q:
          en: '“The number of complete oscillations per second” is the'
          ar: '“عدد الاهتزازات الكاملة في الثانية” هو'
        options: ['period', 'wavelength', 'frequency', 'amplitude']
        answer: 2
        explain:
          en: 'Frequency \(f\) is measured in hertz (Hz). The period is its inverse, \(T = 1/f\).'
          ar: 'التردد \(f\) ويقاس بالهرتز (Hz). والدور هو مقلوبه \(T = 1/f\).'
      - q:
          en: '“The opposition of a conductor to the flow of electric current” is its'
          ar: '“ممانعة الناقل لمرور التيار الكهربائي” هي'
        options: ['resistance', 'voltage', 'capacitance', 'power']
        answer: 0
        explain:
          en: 'Resistance \(R = V/I\), measured in ohms (Ω). Voltage is the potential difference that drives the current.'
          ar: 'المقاومة \(R = V/I\) وتقاس بالأوم (Ω). أما voltage فهو فرق الجهد الذي يدفع التيار.'
      - q:
          en: '“A quantity that has both magnitude and direction” is a'
          ar: '“مقدار له قيمة واتجاه معًا” يسمّى'
        options: ['scalar', 'unit', 'dimension', 'vector']
        answer: 3
        explain:
          en: 'Force, velocity and electric field are vectors; mass, energy and temperature are scalars (magnitude only).'
          ar: 'القوة والسرعة المتجهة والمجال الكهربائي مقادير متجهة (vectors)؛ أما الكتلة والطاقة ودرجة الحرارة فمقادير قياسية (scalars) لها قيمة فقط.'
      - q:
          en: '“The time taken for half of the nuclei in a radioactive sample to decay” is the'
          ar: '“الزمن اللازم لتفكك نصف أنوية عينة مشعة” هو'
        options: ['decay constant', 'half-life', 'mean free path', 'period']
        answer: 1
        explain:
          en: 'The half-life is \(t_{1/2} = \ln 2/\lambda\), where \(\lambda\) is the decay constant.'
          ar: 'عمر النصف \(t_{1/2} = \ln 2/\lambda\)، حيث \(\lambda\) ثابت التفكك.'
  - title:
      en: Grammar of scientific English
      ar: قواعد الإنجليزية العلمية
    questions:
      - q:
          en: Which sentence is most appropriate in the Methods section of a report?
          ar: أي جملة هي الأنسب في قسم الطريقة من تقرير علمي؟
        options:
          - We heat the sample to 300 K.
          - The sample is heating to 300 K.
          - The sample was heated to 300 K.
          - Heat the sample to 300 K!
        answer: 2
        explain:
          en: 'Methods report what was done: past simple, usually passive, so that the focus is on the procedure rather than on the people.'
          ar: 'قسم الطريقة يروي ما أُنجز: الماضي البسيط وغالبًا بالمبني للمجهول، ليكون التركيز على الإجراء لا على الأشخاص.'
      - q:
          en: 'General scientific facts such as “Water boils at 100 °C at sea level” are expressed in the'
          ar: 'الحقائق العلمية العامة مثل “Water boils at 100 °C at sea level” تُعبَّر عنها بـ'
        options:
          - { en: past continuous, ar: الماضي المستمر (past continuous) }
          - { en: present simple, ar: المضارع البسيط (present simple) }
          - { en: future perfect, ar: المستقبل التام (future perfect) }
          - { en: present continuous, ar: المضارع المستمر (present continuous) }
        answer: 1
        explain:
          en: 'The present simple expresses permanent truths, laws and definitions: “Like charges repel.”'
          ar: 'يعبّر المضارع البسيط عن الحقائق الدائمة والقوانين والتعاريف: “Like charges repel.”'
      - q:
          en: In formal scientific writing, which sentence is preferred?
          ar: في الكتابة العلمية الرسمية، أي جملة هي المفضّلة؟
        options:
          - The data are consistent with the model.
          - The datas are consistent with the model.
          - The data is consist with the model.
          - The datum are consistent with the model.
        answer: 0
        explain:
          en: '“Data” is traditionally the plural of “datum”, so formal writing uses “the data are”. “Datas” does not exist, and “consist” is a verb, not an adjective.'
          ar: 'كلمة “data” في الأصل جمع “datum”، لذا تستعمل الكتابة الرسمية “the data are”. أما “datas” فلا وجود لها، و“consist” فعل لا صفة.'
      - q:
          en: 'Choose the most suitably cautious verb: “These results ___ that the effect is caused by impurities.”'
          ar: 'اختر الفعل الأكثر تحفّظًا: “These results ___ that the effect is caused by impurities.”'
        options: ['prove absolutely', 'are proving', 'must show', 'suggest']
        answer: 3
        explain:
          en: 'Scientists “hedge” claims that are not certain: suggest, indicate, may, appear to. “Prove absolutely” overstates what a single experiment can show.'
          ar: 'يتحفّظ العلماء في الادعاءات غير المؤكدة: suggest وindicate وmay وappear to. أما “prove absolutely” فمبالغة لا تستطيع تجربة واحدة إثباتها.'
      - q:
          en: 'Fill in the blank: “Temperature strongly ___ the resistance of a metal.”'
          ar: 'أكمل الفراغ: “Temperature strongly ___ the resistance of a metal.”'
        options: ['effects', 'affects', 'effect', 'affective']
        answer: 1
        explain:
          en: '“Affect” is the verb (to influence); “effect” is usually the noun (the result). Here a verb in the present simple, third person, is needed: “affects”.'
          ar: '“affect” فعل بمعنى يؤثّر، و“effect” غالبًا اسم بمعنى الأثر. والمطلوب هنا فعل في المضارع البسيط مع الغائب المفرد: “affects”.'
  - title:
      en: Writing and presenting
      ar: الكتابة والعرض
    questions:
      - q:
          en: What is the usual order of sections in a lab report or research article?
          ar: ما الترتيب المعتاد لأقسام تقرير المختبر أو المقال البحثي؟
        options:
          - Results, Introduction, Discussion, Methods
          - Discussion, Methods, Introduction, Results
          - Introduction, Methods, Results, Discussion
          - Methods, Discussion, Results, Introduction
        answer: 2
        explain:
          en: 'IMRaD: Introduction (why), Methods (how), Results (what was found), and Discussion (what it means). The abstract comes before it all, and the references come after.'
          ar: 'بنية IMRaD: المقدمة (لماذا)، والطريقة (كيف)، والنتائج (ماذا وُجد)، والمناقشة (ماذا يعني ذلك). ويسبقها الملخص وتليها المراجع.'
      - q:
          en: An abstract should
          ar: ينبغي للملخص العلمي أن
        options:
          - { en: 'summarise the aim, method, main results and conclusion in about 100–250 words', ar: يلخّص الهدف والطريقة وأهم النتائج والخلاصة في نحو 100–250 كلمة }
          - { en: contain all the raw data, ar: يحتوي على كل المعطيات الخام }
          - { en: include figures and a list of references, ar: يتضمن أشكالًا وقائمة مراجع }
          - { en: be a long history of the subject, ar: يكون تاريخًا طويلًا للموضوع }
        answer: 0
        explain:
          en: 'Many readers read only the abstract. It must stand alone and be short, with no figures, no references and no undefined abbreviations.'
          ar: 'كثير من القراء لا يقرؤون إلا الملخص، فيجب أن يكون مستقلًا بذاته وقصيرًا، بلا أشكال ولا مراجع ولا اختصارات غير معرّفة.'
      - q:
          en: Which is the best opening for an email to a professor you have not met?
          ar: ما أفضل افتتاح لرسالة إلكترونية إلى أستاذ لم تلتقه من قبل؟
        options: ['Hey Prof!', 'Dear Professor Smith,', 'Yo Smith,', 'My dear friend,']
        answer: 1
        explain:
          en: 'Formal emails use “Dear” + title + family name. Close with “Kind regards” or “Yours sincerely” and your full name.'
          ar: 'تبدأ الرسائل الرسمية بـ “Dear” مع اللقب واسم العائلة، وتُختم بـ “Kind regards” أو “Yours sincerely” مع الاسم الكامل.'
      - q:
          en: Which phrase is a “signpost” in an oral presentation?
          ar: أي عبارة تُعدّ “عبارة ربط إرشادية” في العرض الشفهي؟
        options: ['Umm… so, yeah.', 'As everybody knows.', 'I don''t know.', 'Now let''s move on to the results.']
        answer: 3
        explain:
          en: 'Signposts tell the audience where the talk is going: “First, I will…”, “Let''s move on to…”, “To sum up…”. They make a talk easy to follow.'
          ar: 'عبارات الربط الإرشادية تخبر الجمهور إلى أين يتجه العرض: “First, I will…” و“Let''s move on to…” و“To sum up…”، فتجعل العرض سهل المتابعة.'
      - q:
          en: Copying a paragraph from an article into your report, even if you translate it, without quotation marks or a citation is
          ar: نسخ فقرة من مقال في تقريرك، ولو بعد ترجمتها، دون علامات تنصيص أو توثيق، يُعدّ
        options:
          - { en: acceptable if the article is online, ar: مقبولًا إذا كان المقال منشورًا على الإنترنت }
          - { en: good practice in scientific writing, ar: ممارسة جيدة في الكتابة العلمية }
          - { en: plagiarism, ar: انتحالًا علميًا }
          - { en: allowed in the Discussion section only, ar: مسموحًا في قسم المناقشة فقط }
        answer: 2
        explain:
          en: 'Using someone else''s words or ideas without credit is plagiarism, whatever the language. Paraphrase in your own words <em>and</em> cite the source.'
          ar: 'استعمال كلمات الآخرين أو أفكارهم دون نسبتها إليهم انتحال علمي مهما كانت اللغة. أعد الصياغة بكلماتك <em>و</em>وثّق المصدر.'


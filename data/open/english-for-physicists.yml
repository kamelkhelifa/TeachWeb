glossary:
  - { en: displacement, ar: الإزاحة, fr: déplacement, def: { en: 'The change in position of an object, with direction (a vector).', ar: 'تغير موضع الجسم مع اتجاهه (مقدار متجه).' } }
  - { en: velocity, ar: السرعة المتجهة, fr: vitesse, def: { en: 'Rate of change of displacement; speed together with direction.', ar: 'معدل تغير الإزاحة؛ أي السرعة مع اتجاهها.' } }
  - { en: acceleration, ar: التسارع, fr: accélération, def: { en: 'Rate of change of velocity, in m s⁻².', ar: 'معدل تغير السرعة المتجهة، ويقاس بـ m s⁻².' } }
  - { en: force, ar: القوة, fr: force, def: { en: 'A push or pull that changes the motion of a body, measured in newtons (N).', ar: 'دفع أو جذب يغيّر حركة الجسم، ويقاس بالنيوتن (N).' } }
  - { en: mass, ar: الكتلة, fr: masse, def: { en: 'Amount of matter in a body and measure of its inertia, in kilograms.', ar: 'كمية المادة في الجسم ومقياس عطالته، وتقاس بالكيلوغرام.' } }
  - { en: weight, ar: الوزن, fr: poids, def: { en: 'The gravitational force on a body, W = mg (a force, not a mass).', ar: 'قوة الجاذبية المؤثرة في الجسم W = mg (قوة لا كتلة).' } }
  - { en: momentum, ar: الزخم (كمية الحركة), fr: quantité de mouvement, def: { en: 'Product of mass and velocity, p = mv.', ar: 'جداء الكتلة في السرعة المتجهة p = mv.' } }
  - { en: friction, ar: الاحتكاك, fr: frottement, def: { en: 'Force that opposes the sliding of one surface over another.', ar: 'قوة تعاكس انزلاق سطح على آخر.' } }
  - { en: work, ar: الشغل, fr: travail, def: { en: 'Energy transferred by a force acting through a displacement, in joules.', ar: 'الطاقة المنقولة بقوة تنتقل نقطة تأثيرها، ويقاس بالجول.' } }
  - { en: energy, ar: الطاقة, fr: énergie, def: { en: 'The capacity to do work; it is conserved and measured in joules (J).', ar: 'القدرة على إنجاز شغل؛ وهي منحفظة وتقاس بالجول (J).' } }
  - { en: power, ar: القدرة, fr: puissance, def: { en: 'Rate of transfer of energy, in watts (W = J s⁻¹).', ar: 'معدل نقل الطاقة، ويقاس بالواط (W = J s⁻¹).' } }
  - { en: gravity, ar: الجاذبية, fr: gravitation, def: { en: 'The attraction between all masses.', ar: 'التجاذب بين كل الكتل.' } }
  - { en: orbit, ar: المدار, fr: orbite, def: { en: 'The curved path of a body around a star, planet or moon.', ar: 'المسار المنحني لجسم حول نجم أو كوكب أو قمر.' } }
  - { en: oscillation, ar: الاهتزاز, fr: oscillation, def: { en: 'Repeated back-and-forth motion about an equilibrium position.', ar: 'حركة ذهاب وإياب متكررة حول وضع توازن.' } }
  - { en: amplitude, ar: السعة, fr: amplitude, def: { en: 'Maximum displacement from the equilibrium position.', ar: 'أكبر إزاحة عن وضع التوازن.' } }
  - { en: frequency, ar: التردد, fr: fréquence, def: { en: 'Number of cycles per second, in hertz (Hz).', ar: 'عدد الدورات في الثانية، ويقاس بالهرتز (Hz).' } }
  - { en: period, ar: الدور, fr: période, def: { en: 'Time for one complete cycle, T = 1/f.', ar: 'زمن دورة كاملة T = 1/f.' } }
  - { en: wavelength, ar: طول الموجة, fr: longueur d'onde, def: { en: 'Distance between two successive crests of a wave.', ar: 'المسافة بين قمتين متتاليتين للموجة.' } }
  - { en: pitch, ar: حدة الصوت, fr: hauteur (du son), def: { en: 'How high or low a sound is perceived; set by its frequency.', ar: 'مدى إدراك الصوت حادًا أو غليظًا؛ ويحدّدها التردد.' } }
  - { en: echo, ar: الصدى, fr: écho, def: { en: 'A sound heard again after reflection from a surface.', ar: 'صوت يُسمع مرة أخرى بعد انعكاسه على سطح.' } }
  - { en: ultrasound, ar: الموجات فوق الصوتية, fr: ultrason, def: { en: 'Sound with frequency above 20 kHz, beyond human hearing.', ar: 'صوت تردده أعلى من 20 kHz، خارج مجال السمع البشري.' } }
  - { en: heat, ar: الحرارة, fr: chaleur, def: { en: 'Energy transferred because of a temperature difference.', ar: 'طاقة تنتقل بسبب فرق في درجة الحرارة.' } }
  - { en: temperature, ar: درجة الحرارة, fr: température, def: { en: 'Measure of the average kinetic energy of particles, in kelvins.', ar: 'مقياس لمتوسط الطاقة الحركية للجسيمات، وتقاس بالكلفن.' } }
  - { en: entropy, ar: الإنتروبيا, fr: entropie, def: { en: 'Measure of disorder; it never decreases in an isolated system (the arrow of time).', ar: 'مقياس للفوضى؛ لا تتناقص أبدًا في نظام معزول (سهم الزمن).' } }
  - { en: electric charge, ar: الشحنة الكهربائية, fr: charge électrique, def: { en: 'Property of matter that causes electric forces, in coulombs (C).', ar: 'خاصية للمادة تسبب القوى الكهربائية، وتقاس بالكولوم (C).' } }
  - { en: current, ar: التيار الكهربائي, fr: courant électrique, def: { en: 'Rate of flow of charge, in amperes (A).', ar: 'معدل تدفق الشحنة، ويقاس بالأمبير (A).' } }
  - { en: voltage, ar: الجهد الكهربائي (فرق الجهد), fr: tension, def: { en: 'Potential difference; energy per unit charge, in volts (V).', ar: 'فرق الجهد؛ الطاقة لكل وحدة شحنة، ويقاس بالفولط (V).' } }
  - { en: resistance, ar: المقاومة, fr: résistance, def: { en: 'Opposition to current, R = V/I, in ohms (Ω).', ar: 'ممانعة مرور التيار R = V/I، وتقاس بالأوم (Ω).' } }
  - { en: circuit, ar: الدارة الكهربائية, fr: circuit, def: { en: 'A closed path through which current can flow.', ar: 'مسار مغلق يمكن أن يمر عبره التيار.' } }
  - { en: magnetic field, ar: المجال المغناطيسي, fr: champ magnétique, def: { en: 'Region where a magnet or moving charge feels a force, in teslas (T).', ar: 'منطقة يتأثر فيها مغناطيس أو شحنة متحركة بقوة، ويقاس بالتسلا (T).' } }
  - { en: compass, ar: البوصلة, fr: boussole, def: { en: 'A small magnet that aligns with the Earth''s magnetic field.', ar: 'مغناطيس صغير يصطف مع المجال المغناطيسي للأرض.' } }
  - { en: refraction, ar: الانكسار, fr: réfraction, def: { en: 'Change of direction of light when it passes from one medium to another.', ar: 'تغير اتجاه الضوء عند انتقاله من وسط إلى آخر.' } }
  - { en: laser, ar: الليزر, fr: laser, def: { en: 'Light Amplification by Stimulated Emission of Radiation: an intense, coherent, single-colour beam.', ar: 'تضخيم الضوء بالانبعاث المحفَّز للإشعاع: حزمة شديدة مترابطة أحادية اللون.' } }
  - { en: photon, ar: الفوتون, fr: photon, def: { en: 'A quantum of light with energy E = hf.', ar: 'كمّ الضوء وطاقته E = hf.' } }
  - { en: relativity, ar: النسبية, fr: relativité, def: { en: 'Einstein''s theory of space, time and motion at high speeds and in gravity.', ar: 'نظرية أينشتاين في المكان والزمان والحركة عند السرعات العالية وفي الجاذبية.' } }
  - { en: wave–particle duality, ar: ازدواجية الموجة والجسيم, fr: dualité onde–corpuscule, def: { en: 'Light and matter show both wave and particle behaviour.', ar: 'يُظهر الضوء والمادة سلوكًا موجيًا وجسيميًا معًا.' } }
  - { en: nucleus, ar: النواة, fr: noyau, def: { en: 'The small, dense centre of an atom, made of protons and neutrons.', ar: 'مركز الذرة الصغير الكثيف، ويتكون من بروتونات ونيوترونات.' } }
  - { en: isotope, ar: النظير, fr: isotope, def: { en: 'Atoms of the same element with different numbers of neutrons.', ar: 'ذرات العنصر نفسه بأعداد مختلفة من النيوترونات.' } }
  - { en: half-life, ar: عمر النصف, fr: demi-vie, def: { en: 'Time for half of the nuclei in a radioactive sample to decay.', ar: 'الزمن اللازم لتفكك نصف أنوية عينة مشعة.' } }
  - { en: quark, ar: الكوارك, fr: quark, def: { en: 'Elementary particle that makes up protons and neutrons.', ar: 'جسيم أولي تتكون منه البروتونات والنيوترونات.' } }
  - { en: hypothesis, ar: الفرضية, fr: hypothèse, def: { en: 'A testable proposed explanation.', ar: 'تفسير مقترح قابل للاختبار.' } }
  - { en: abstract, ar: الملخص العلمي, fr: résumé, def: { en: 'Short summary of a paper: aim, method, results and conclusion.', ar: 'ملخص قصير للمقال: الهدف والطريقة والنتائج والخلاصة.' } }
  - { en: lab report, ar: تقرير المختبر, fr: compte rendu de TP, def: { en: 'Structured written account of an experiment (IMRaD).', ar: 'عرض مكتوب منظّم لتجربة (بنية IMRaD).' } }

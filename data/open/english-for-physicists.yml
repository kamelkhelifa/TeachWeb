notes: >
  Merged from three pages. The recent page (UET, years 2-3 and Master 1) gave the description, the detailed
  learning outcomes, the lecture-notes PDF, the thematic 18-week calendar (compressed here to 14 weeks), and the final
  exams with solutions. The two older pages taught the course as a physics review in English and gave
  the 2014 exam and the 2012-13 exam and resit, which are classical-mechanics papers written in English. The language
  strand (grammar, writing, presentations), assessment scheme, CLOs, quizzes, problems and glossary were
  written new. The supplementary links on the page were misspelled and not hyperlinked (bbc.co.uk/learningenglis,
  learnigenglish.org.uk); they were corrected to BBC Learning English and British Council LearnEnglish, and
  Academic Phrasebank and the Cambridge Dictionary were added. Not carried over: marks PDFs, student
  portal, assignment-submission forms and the course questionnaire. The M1 papers and the 2023-24 papers
  were never uploaded.

description:
  en: |
    <p>English is the working language of physics: textbooks, research articles, datasheets, conferences and most online courses use it. This course trains physics students to <strong>read, write, listen and speak about physics in English</strong> with accuracy and confidence. Each week combines a physics theme with a language focus. The themes are forces and motion, energy, gravity, sound and ultrasound, thermodynamics, electricity and magnetism, light and lasers, relativity and quantum physics, atomic and nuclear physics, particles and astronomy.</p>
    <p>Reading is based on short authentic texts with comprehension questions and vocabulary work: word families, Greek and Latin roots, and false friends with French. Students learn to read numbers, units, symbols and equations aloud. The writing strand covers describing an experiment, describing graphs, lab reports, abstracts and formal emails. The speaking strand ends with a short oral presentation on a physics topic, followed by questions.</p>
    <p>The same units are used at several levels (second year, third year and Master). Higher levels prepare a complete unit, with text, questions and answers, and present it to the class. The built-in flashcards with spoken pronunciation help students learn the course glossary.</p>
  ar: |
    <p>الإنجليزية هي لغة العمل في الفيزياء، إذ تُكتب بها الكتب المرجعية والمقالات البحثية ونشرات البيانات، وتُعقد بها المؤتمرات ومعظم المقررات على الإنترنت. يدرّب هذا المقرر طلبة الفيزياء على <strong>قراءة الفيزياء وكتابتها والاستماع إليها والتحدث عنها بالإنجليزية</strong> بدقة وثقة. ويجمع كل أسبوع بين موضوع فيزيائي ومحور لغوي. أما المواضيع فهي القوى والحركة، والطاقة، والجاذبية، والصوت والموجات فوق الصوتية، والديناميكا الحرارية، والكهرباء والمغناطيسية، والضوء والليزر، والنسبية وفيزياء الكم، والفيزياء الذرية والنووية، والجسيمات وعلم الفلك.</p>
    <p>تعتمد القراءة على نصوص أصيلة قصيرة مع أسئلة فهم وتمارين في المفردات، منها عائلات الكلمات والجذور اليونانية واللاتينية والكلمات المتشابهة المضللة مع الفرنسية. ويتعلم الطالب قراءة الأعداد والوحدات والرموز والمعادلات بصوت عالٍ. ويغطي محور الكتابة وصف تجربة، ووصف المنحنيات، وتقارير المختبر، والملخصات العلمية، والرسائل الإلكترونية الرسمية. ويُختتم محور التحدث بعرض شفهي قصير حول موضوع فيزيائي تليه أسئلة.</p>
    <p>تُستعمل الوحدات نفسها في عدة مستويات (السنة الثانية والسنة الثالثة والماستر). وفي المستويات العليا يُعِدّ الطالب وحدة كاملة بنصها وأسئلتها وأجوبتها ويقدّمها لزملائه. وتساعد البطاقات التعليمية المدمجة، مع النطق المسموع، على حفظ مسرد المقرر.</p>


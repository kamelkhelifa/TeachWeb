  (10/25/25/40) and all links come from the PHYS 352 page. The source had only two learning outcomes and a one-line
  description: reconstructed the full description, CLOs, the varied assessment split (homework/quizzes/presentation
  added), applications of special functions to separable PDEs (Laplace, Helmholtz, Schrodinger) inside weeks 5-9, the
  exam guide, all quizzes, problems and glossary. Textbook data corrected: the Arfken & Weber edition whose chapter
  numbers match the readings is the 6th (2005), not 1995; Boas listed in its current 3rd edition; Riley-Hobson-Bence
  added. Past exams 1437 (S1/S2) mapped to 2015-2016, 1438 (S1/S2) to 2016-2017; first periodic exam to 2019-2020.
  A stray navigation link to a quantum-mechanics page and the course questionnaire were not kept. DLMF added to online
  resources.

description:
  en: |
    <p>Most of the core physics curriculum — quantum mechanics, electromagnetism, waves and statistical physics — relies on a common set of mathematical tools. This course provides them. It starts with the Gamma and Beta functions and Stirling's formula. It then develops the theory of second-order linear differential equations: singular points, power-series solutions, the Frobenius method and second solutions.</p>
    <p>These methods produce the <strong>special functions</strong> of mathematical physics. Bessel functions (and their Neumann, Hankel, modified and spherical forms) appear in cylindrical and spherical problems. Legendre polynomials appear in potentials with spherical symmetry, Hermite polynomials in the quantum oscillator, and Laguerre polynomials in the hydrogen atom. For each family we study generating functions, recurrence relations and orthogonality, and we use them in separable partial differential equations.</p>
    <p>The second part covers <strong>Fourier series</strong> (convergence, Gibbs phenomenon, Parseval), the <strong>Fourier and Laplace transforms</strong> with their use in solving differential equations, an introduction to <strong>probability and statistics</strong>, and a first look at <strong>group theory</strong>.</p>
  ar: |
    <p>يعتمد معظم المنهج الأساسي للفيزياء (ميكانيكا الكم، والكهرومغناطيسية، والموجات، والفيزياء الإحصائية) على مجموعة مشتركة من الأدوات الرياضية، وهذا المقرر يقدّمها. يبدأ بدالتي غاما وبيتا وصيغة ستيرلنغ. ثم يطوّر نظرية المعادلات التفاضلية الخطية من الرتبة الثانية: النقاط الشاذة، والحلول بمتسلسلات القوى، وطريقة فروبينيوس، والحل الثاني.</p>
    <p>تُنتج هذه الطرق <strong>الدوال الخاصة</strong> في الفيزياء الرياضية. فدوال بسل (وصيغها: نويمان وهانكل والمعدّلة والكروية) تظهر في المسائل الأسطوانية والكروية. وتظهر كثيرات حدود لوجندر في الكمونات ذات التناظر الكروي، وكثيرات حدود هيرميت في المهتز التوافقي الكمومي، وكثيرات حدود لاغير في ذرة الهيدروجين. وندرس لكل عائلة دالتها المولّدة وعلاقاتها التراجعية وتعامدها، ونستعملها في المعادلات التفاضلية الجزئية القابلة لفصل المتغيرات.</p>
    <p>ويتناول الجزء الثاني <strong>متسلسلات فورييه</strong> (التقارب، ظاهرة غيبس، مبرهنة بارسفال)، و<strong>تحويلي فورييه ولابلاس</strong> واستعمالهما في حل المعادلات التفاضلية، ومدخلًا إلى <strong>الاحتمالات والإحصاء</strong>، ونظرة أولى في <strong>نظرية الزمر</strong>.</p>


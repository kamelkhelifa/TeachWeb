outcomes:
  - id: CLO1
    bloom: apply
    domain: knowledge
    text:
      en: Use the Gamma and Beta functions, their properties and Stirling's formula to evaluate integrals and factorial-type expressions.
      ar: يستعمل دالتي غاما وبيتا وخصائصهما وصيغة ستيرلنغ لحساب تكاملات وعبارات من نوع المضروب.
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: Classify the singular points of a second-order linear ODE and construct power-series and Frobenius solutions, including a second solution.
      ar: يصنّف النقاط الشاذة لمعادلة تفاضلية خطية من الرتبة الثانية ويبني حلولها بمتسلسلات القوى وبطريقة فروبينيوس، بما في ذلك الحل الثاني.
    assessed_by: [homework, midterm1, final]
  - id: CLO3
    bloom: analyze
    domain: knowledge
    text:
      en: Derive and use generating functions, recurrence relations and orthogonality of Bessel, Legendre, Hermite and Laguerre functions.
      ar: يستنتج الدوال المولّدة والعلاقات التراجعية وخواص التعامد لدوال بسل ولوجندر وهيرميت ولاغير، ويستعملها.
    assessed_by: [quizzes, homework, midterm1, midterm2, final]
  - id: CLO4
    bloom: apply
    domain: skills
    text:
      en: Separate variables in the Laplace, Helmholtz and Schrödinger equations and identify the special functions that arise in physical problems.
      ar: يفصل المتغيرات في معادلات لابلاس وهلمهولتز وشرودنغر، ويتعرّف على الدوال الخاصة التي تظهر في المسائل الفيزيائية.
    assessed_by: [homework, presentation, final]
  - id: CLO5
    bloom: apply
    domain: skills
    text:
      en: Expand functions in Fourier series, discuss convergence and the Gibbs phenomenon, and apply Parseval's theorem.
      ar: ينشر الدوال في متسلسلات فورييه، ويناقش تقاربها وظاهرة غيبس، ويطبّق مبرهنة بارسفال.
    assessed_by: [quizzes, homework, midterm2, final]
  - id: CLO6
    bloom: apply
    domain: skills
    text:
      en: Compute Fourier and Laplace transforms and use them, with the convolution theorem, to solve differential equations and initial-value problems.
      ar: يحسب تحويلي فورييه ولابلاس ويستعملهما، مع مبرهنة الالتفاف، في حل المعادلات التفاضلية ومسائل القيم الابتدائية.
    assessed_by: [homework, midterm2, final]
  - id: CLO7
    bloom: understand
    domain: knowledge
    text:
      en: Describe random variables and the binomial, Poisson and Gaussian distributions, and explain the basic notions of a group and its representations.
      ar: يصف المتغيرات العشوائية والتوزيعات ذات الحدين وبواسون والغاوسي، ويشرح المفاهيم الأساسية للزمرة وتمثيلاتها.
    assessed_by: [quizzes, final]
  - id: CLO8
    bloom: create
    domain: values
    text:
      en: Prepare and present, honestly and clearly, a short self-contained account of a physical application of a mathematical method.
      ar: يُعدّ ويعرض بأمانة ووضوح عرضًا قصيرًا متكاملًا لتطبيق فيزيائي لإحدى الطرق الرياضية.
    assessed_by: [presentation]

assessment:
  - id: homework
    type: homework
    weight: 10
    title: { en: Weekly problem sets, ar: أوراق المسائل الأسبوعية }
    detail:
      en: Eleven problem sets, each due one week later in class. Graded on correctness, rigour and presentation. Work them out yourself and ask for help on unclear points.
      ar: إحدى عشرة ورقة مسائل، تُسلَّم كلٌّ منها بعد أسبوع داخل القاعة. تُقيَّم على صحة الحل ودقته وحسن عرضه. حُلّها بنفسك واطلب المساعدة في النقاط غير الواضحة.
    when: { en: Weeks 2–14, ar: الأسابيع 2–14 }
  - id: quizzes
    type: quiz
    weight: 5
    title: { en: Short quizzes, ar: اختبارات قصيرة }
    detail:
      en: Three 15-minute quizzes testing definitions, key formulas and one quick computation.
      ar: ثلاثة اختبارات قصيرة مدة كلٍّ منها 15 دقيقة، تختبر التعاريف والصيغ الأساسية وحسابًا سريعًا.
    when: { en: 'Weeks 4, 10, 13', ar: الأسابيع 4، 10، 13 }
  - id: midterm1
    type: midterm
    weight: 20
    title: { en: First periodic exam, ar: الاختبار الدوري الأول }
    detail:
      en: One hour, in class. Gamma/Beta functions, series solutions, Bessel functions.
      ar: ساعة واحدة داخل القاعة. دالتا غاما وبيتا، الحلول بالمتسلسلات، دوال بسل.
    when: { en: Week 7, ar: الأسبوع 7 }
  - id: midterm2
    type: midterm
    weight: 20
    title: { en: Second periodic exam, ar: الاختبار الدوري الثاني }
    detail:
      en: One hour, in class. Legendre, Hermite and Laguerre functions; Fourier series; Fourier transform.
      ar: ساعة واحدة داخل القاعة. دوال لوجندر وهيرميت ولاغير؛ متسلسلات فورييه؛ تحويل فورييه.
    when: { en: Week 12, ar: الأسبوع 12 }
  - id: presentation
    type: presentation
    weight: 5
    title: { en: Short presentation, ar: عرض قصير }
    detail:
      en: 'A 10-minute presentation (in pairs) on a physical application: e.g. vibrating drum (Bessel), hydrogen atom (Laguerre), spectrum analysis (Fourier). Graded on correctness, clarity and answers to questions.'
      ar: 'عرض مدته 10 دقائق (ثنائيًّا) عن تطبيق فيزيائي، مثل: اهتزاز الطبلة (بسل)، ذرة الهيدروجين (لاغير)، التحليل الطيفي (فورييه). يُقيَّم على صحة المحتوى ووضوحه والإجابة عن الأسئلة.'
    when: { en: Week 14, ar: الأسبوع 14 }
  - id: final
    type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }
    detail:
      en: Two hours, comprehensive.
      ar: ساعتان، شامل لكل المقرر.
    when: { en: Final exam period, ar: فترة الاختبارات النهائية }

schedule:
  - week: 1
    title: { en: The Gamma function, ar: دالة غاما }
    topics:
      en: [Overview of the course, 'Definition \(\Gamma(z)=\int_0^\infty t^{z-1}e^{-t}\dd t\), recurrence \(\Gamma(z+1)=z\Gamma(z)\)', 'Reflection formula, \(\Gamma(1/2)=\sqrt\pi\), digamma function, Stirling''s series']
      ar: [نظرة عامة على المقرر, 'التعريف \(\Gamma(z)=\int_0^\infty t^{z-1}e^{-t}\dd t\) والعلاقة التراجعية \(\Gamma(z+1)=z\Gamma(z)\)', 'صيغة الانعكاس، \(\Gamma(1/2)=\sqrt\pi\)، دالة ديغاما، متسلسلة ستيرلنغ']
    reading: Arfken & Weber §8.1–8.3
  - week: 2
    title: { en: Beta and incomplete Gamma functions, ar: دالة بيتا ودالة غاما الناقصة }
    topics:
      en: ['Beta function \(B(p,q)=\Gamma(p)\Gamma(q)/\Gamma(p+q)\) and trigonometric integrals', 'Incomplete Gamma function and the error function']
      ar: ['دالة بيتا \(B(p,q)=\Gamma(p)\Gamma(q)/\Gamma(p+q)\) والتكاملات المثلثية', 'دالة غاما الناقصة ودالة الخطأ']
    reading: Arfken & Weber §8.4–8.5
    activity: { en: Problem set 1, ar: ورقة المسائل 1 }
  - week: 3
    title: { en: Series solutions of second-order ODEs, ar: الحلول بالمتسلسلات للمعادلات من الرتبة الثانية }
    topics:
      en: ['Ordinary, regular singular and irregular singular points', 'Frobenius method and the indicial equation']
      ar: ['النقاط العادية والشاذة المنتظمة والشاذة غير المنتظمة', 'طريقة فروبينيوس والمعادلة الدليلية']
    reading: Arfken & Weber §9.4–9.5
    activity: { en: Problem set 2, ar: ورقة المسائل 2 }
  - week: 4
    title: { en: A second solution; applications, ar: الحل الثاني؛ تطبيقات }
    topics:
      en: ['Wronskian and linear independence', 'Second solution when indicial roots coincide or differ by an integer (logarithmic terms)', 'Separation of variables in PDEs; non-homogeneous equations']
      ar: ['الرونسكيان والاستقلال الخطي', 'الحل الثاني عندما تتساوى جذور المعادلة الدليلية أو تختلف بعدد صحيح (حدود لوغاريتمية)', 'فصل المتغيرات في المعادلات التفاضلية الجزئية؛ المعادلات غير المتجانسة']
    reading: Arfken & Weber §9.6–9.8
    activity: { en: Problem set 3; Quiz 1, ar: ورقة المسائل 3؛ الاختبار القصير 1 }
    milestone: quiz
  - week: 5
    title: { en: Bessel functions, ar: دوال بسل }
    topics:
      en: ['\(J_\nu(x)\): series, generating function, recurrence relations', 'Orthogonality on \([0,a]\); vibrating circular membrane', 'Neumann functions \(Y_\nu\) and Hankel functions \(H^{(1,2)}_\nu\)']
      ar: ['\(J_\nu(x)\): المتسلسلة والدالة المولّدة والعلاقات التراجعية', 'التعامد على \([0,a]\)؛ الغشاء الدائري المهتز', 'دوال نويمان \(Y_\nu\) ودوال هانكل \(H^{(1,2)}_\nu\)']
    reading: Arfken & Weber §11.1–11.4
    activity: { en: Problem set 4, ar: ورقة المسائل 4 }
  - week: 6
    title: { en: Modified and spherical Bessel functions, ar: دوال بسل المعدّلة والكروية }
    topics:
      en: ['Modified Bessel functions \(I_\nu, K_\nu\)', 'Spherical Bessel functions \(j_\ell, n_\ell\); Helmholtz equation in spherical coordinates', 'Review for the first exam']
      ar: ['دوال بسل المعدّلة \(I_\nu, K_\nu\)', 'دوال بسل الكروية \(j_\ell, n_\ell\)؛ معادلة هلمهولتز في الإحداثيات الكروية', 'مراجعة للاختبار الأول']
    reading: Arfken & Weber §11.5–11.7
    milestone: review
  - week: 7
    title: { en: Legendre functions, ar: دوال لوجندر }
    topics:
      en: ['Generating function, Rodrigues'' formula and recurrence relations of \(P_\ell(x)\)', 'Orthogonality; Laplace''s equation with azimuthal symmetry', First periodic exam]
      ar: ['الدالة المولّدة وصيغة رودريغز والعلاقات التراجعية لـ \(P_\ell(x)\)', 'التعامد؛ معادلة لابلاس في حالة التناظر السمتي', الاختبار الدوري الأول]
    reading: Arfken & Weber §12.1–12.4
    activity: { en: Problem set 5, ar: ورقة المسائل 5 }
    milestone: midterm
  - week: 8
    title: { en: Hermite functions, ar: دوال هيرميت }
    topics:
      en: ['Hermite polynomials: generating function, recurrences, orthogonality with weight \(e^{-x^2}\)', 'Quantum harmonic oscillator wavefunctions']
      ar: ['كثيرات حدود هيرميت: الدالة المولّدة والعلاقات التراجعية والتعامد بدالة الوزن \(e^{-x^2}\)', 'الدوال الموجية للمهتز التوافقي الكمومي']
    reading: Arfken & Weber §13.1
    activity: { en: Problem set 6, ar: ورقة المسائل 6 }
  - week: 9
    title: { en: Laguerre functions, ar: دوال لاغير }
    topics:
      en: ['Laguerre and associated Laguerre polynomials', 'Radial wavefunctions of the hydrogen atom']
      ar: ['كثيرات حدود لاغير ولاغير المرافقة', 'الدوال الموجية القطرية لذرة الهيدروجين']
    reading: Arfken & Weber §13.2
    activity: { en: Problem set 7, ar: ورقة المسائل 7 }
  - week: 10
    title: { en: Fourier series, ar: متسلسلات فورييه }
    topics:
      en: ['Fourier coefficients, even/odd functions, complex form', 'Dirichlet conditions, convergence at discontinuities, Gibbs phenomenon', 'Parseval''s identity; applications (square and sawtooth waves)']
      ar: ['معاملات فورييه، الدوال الزوجية والفردية، الصيغة المركبة', 'شروط ديريكليه، التقارب عند نقاط الانقطاع، ظاهرة غيبس', 'متطابقة بارسفال؛ تطبيقات (الموجة المربعة والموجة سنّ المنشار)']
    reading: Arfken & Weber §14.1–14.4, 14.6
    activity: { en: Problem set 8; Quiz 2; Fourier-series lab, ar: ورقة المسائل 8؛ الاختبار القصير 2؛ مختبر متسلسلات فورييه }
    milestone: quiz
  - week: 11
    title: { en: Integral transforms; the Fourier transform, ar: التحويلات التكاملية؛ تحويل فورييه }
    topics:
      en: ['Fourier integral and the Fourier transform pair', 'Transform of derivatives; convolution theorem; Parseval''s relation', 'Applications: Gaussian wave packet, uncertainty relation']
      ar: ['تكامل فورييه وزوج تحويل فورييه', 'تحويل المشتقات؛ مبرهنة الالتفاف؛ علاقة بارسفال', 'تطبيقات: الحزمة الموجية الغاوسية، علاقة الارتياب']
    reading: Arfken & Weber §15.1–15.5
  - week: 12
    title: { en: The Laplace transform, ar: تحويل لابلاس }
    topics:
      en: ['Definition, elementary transforms, shifting theorems', 'Transform of derivatives; solving initial-value problems; inverse by partial fractions', Second periodic exam]
      ar: ['التعريف والتحويلات الأولية ومبرهنتا الإزاحة', 'تحويل المشتقات؛ حل مسائل القيم الابتدائية؛ التحويل العكسي بالكسور الجزئية', الاختبار الدوري الثاني]
    reading: Arfken & Weber §15.8–15.12
    activity: { en: Problem set 9, ar: ورقة المسائل 9 }
    milestone: midterm
  - week: 13
    title: { en: Probability and random variables, ar: الاحتمالات والمتغيرات العشوائية }
    topics:
      en: ['Probability axioms, conditional probability', 'Random variables, mean, variance, moments', 'Binomial, Poisson and Gaussian distributions']
      ar: ['مسلّمات الاحتمال، الاحتمال الشرطي', 'المتغيرات العشوائية، المتوسط، التباين، العزوم', 'التوزيعات ذات الحدين وبواسون والغاوسي']
    reading: Arfken & Weber §19.2–19.5
    activity: { en: Problem set 10; Quiz 3, ar: ورقة المسائل 10؛ الاختبار القصير 3 }
    milestone: quiz
  - week: 14
    title: { en: Statistics and group theory; review, ar: الإحصاء ونظرية الزمر؛ مراجعة }
    topics:
      en: ['Statistics: estimators, error propagation, least squares', 'Groups: definitions, examples, subgroups, representations', 'Student presentations and course review']
      ar: ['الإحصاء: المقدِّرات، انتشار الأخطاء، المربعات الصغرى', 'الزمر: التعاريف، أمثلة، الزمر الجزئية، التمثيلات', 'عروض الطلبة ومراجعة المقرر']
    reading: Arfken & Weber §19.6, 4.1–4.2
    activity: { en: Problem set 11; presentations, ar: ورقة المسائل 11؛ العروض }
    milestone: review


exam_guide:
  format:
    en: Periodic exams last 60 minutes with 3–4 problems (e.g. evaluate an integral with Gamma/Beta functions, a Frobenius solution, a property of a special function). The final exam lasts 2 hours and contains 5–6 problems covering the whole course, including transforms and probability.
    ar: تدوم الاختبارات الدورية 60 دقيقة وتتضمن 3 إلى 4 مسائل (مثل حساب تكامل بدالتي غاما وبيتا، أو حل بطريقة فروبينيوس، أو خاصية لإحدى الدوال الخاصة). ويدوم الاختبار النهائي ساعتين ويتضمن 5 إلى 6 مسائل تغطي المقرر كله، بما فيه التحويلات والاحتمالات.
  allowed:
    en: A non-programmable calculator. A formula sheet (generating functions, Rodrigues' formulas, table of Laplace transforms) is attached to the paper when needed; personal notes are not allowed.
    ar: آلة حاسبة غير قابلة للبرمجة. تُرفق بورقة الاختبار عند الحاجة ورقة صيغ (الدوال المولّدة، صيغ رودريغز، جدول تحويلات لابلاس)؛ ولا يُسمح بالمذكرات الشخصية.
  tips:
    - en: Learn the defining properties (ODE, generating function, recurrence, orthogonality) of each special function — most questions use one of them.
      ar: احفظ الخصائص المعرِّفة لكل دالة خاصة (المعادلة التفاضلية، الدالة المولّدة، العلاقة التراجعية، التعامد)؛ فمعظم الأسئلة تعتمد على إحداها.
    - en: In Frobenius problems, write the indicial equation first and check whether the roots differ by an integer; this decides the form of the second solution.
      ar: في مسائل فروبينيوس اكتب المعادلة الدليلية أولًا وتحقق هل يختلف الجذران بعدد صحيح؛ فهذا يحدد شكل الحل الثاني.
    - en: For Fourier series, check the parity of the function first — half of the coefficients often vanish.
      ar: في متسلسلات فورييه تحقق من زوجية الدالة أو فرديتها أولًا؛ فكثيرًا ما ينعدم نصف المعاملات.
    - en: Verify results on simple special cases (\(n=0,1\), \(x=0\), a known integral) before moving on.
      ar: 'تحقق من نتائجك على حالات خاصة بسيطة (\(n=0,1\) أو \(x=0\) أو تكامل معروف) قبل المتابعة.'

problems:
  - title: { en: Integrals with the Beta function, ar: تكاملات بدالة بيتا }
    difficulty: 1
    statement:
      en: |
        Using the Beta function, evaluate
        \[I_1 = \int_0^1 x^4(1-x)^3\,\dd x, \qquad I_2 = \int_0^{\pi/2}\sin^3\theta\,\cos^5\theta\,\dd\theta .\]
      ar: |
        باستعمال دالة بيتا، احسب
        \[I_1 = \int_0^1 x^4(1-x)^3\,\dd x, \qquad I_2 = \int_0^{\pi/2}\sin^3\theta\,\cos^5\theta\,\dd\theta .\]
    hint:
      en: '\(B(p,q)=\int_0^1 t^{p-1}(1-t)^{q-1}\dd t = 2\int_0^{\pi/2}\sin^{2p-1}\theta\cos^{2q-1}\theta\,\dd\theta = \dfrac{\Gamma(p)\Gamma(q)}{\Gamma(p+q)}\).'
      ar: '\(B(p,q)=\int_0^1 t^{p-1}(1-t)^{q-1}\dd t = 2\int_0^{\pi/2}\sin^{2p-1}\theta\cos^{2q-1}\theta\,\dd\theta = \dfrac{\Gamma(p)\Gamma(q)}{\Gamma(p+q)}\).'
    solution:
      en: |
        \(I_1 = B(5,4) = \dfrac{\Gamma(5)\Gamma(4)}{\Gamma(9)} = \dfrac{4!\,3!}{8!} = \dfrac{144}{40320} = \dfrac{1}{280}.\)
        For \(I_2\): \(2p-1=3\Rightarrow p=2\) and \(2q-1=5\Rightarrow q=3\), so
        \[I_2 = \tfrac12 B(2,3) = \frac12\,\frac{1!\,2!}{4!} = \frac{1}{24}.\]
        Check: with \(u=\cos\theta\), \(I_2=\int_0^1(1-u^2)u^5\,\dd u = \tfrac16-\tfrac18 = \tfrac1{24}\). ✓
      ar: |
        \(I_1 = B(5,4) = \dfrac{\Gamma(5)\Gamma(4)}{\Gamma(9)} = \dfrac{4!\,3!}{8!} = \dfrac{144}{40320} = \dfrac{1}{280}.\)
        ومن أجل \(I_2\): \(2p-1=3\Rightarrow p=2\) و\(2q-1=5\Rightarrow q=3\)، إذن
        \[I_2 = \tfrac12 B(2,3) = \frac12\,\frac{1!\,2!}{4!} = \frac{1}{24}.\]
        تحقق: بوضع \(u=\cos\theta\) نجد \(I_2=\int_0^1(1-u^2)u^5\,\dd u = \tfrac16-\tfrac18 = \tfrac1{24}\). ✓
  - title: { en: 'Frobenius solution of \(4xy''''+2y''+y=0\)', ar: 'حل المعادلة \(4xy''''+2y''+y=0\) بطريقة فروبينيوس' }
    difficulty: 2
    statement:
      en: |
        Consider \(4x\,y'' + 2y' + y = 0\).
        (a) Show that \(x=0\) is a regular singular point. (b) Find the indicial equation and its roots. (c) Derive the recurrence relation and identify the two solutions in closed form.
      ar: |
        لتكن المعادلة \(4x\,y'' + 2y' + y = 0\).
        (أ) بيّن أن \(x=0\) نقطة شاذة منتظمة. (ب) أوجد المعادلة الدليلية وجذريها. (ج) استنتج العلاقة التراجعية وتعرّف على الحلين بصيغة مغلقة.
    hint:
      en: 'Substitute \(y=\sum_{n\ge0}a_n x^{n+r}\) with \(a_0\neq0\) and equate the coefficients of \(x^{n+r}\).'
      ar: 'عوّض \(y=\sum_{n\ge0}a_n x^{n+r}\) حيث \(a_0\neq0\)، وساوِ معاملات \(x^{n+r}\).'
    solution:
      en: |
        (a) In standard form \(y''+\frac{1}{2x}y'+\frac{1}{4x}y=0\): \(xP=\tfrac12\) and \(x^2Q=\tfrac{x}{4}\) are analytic at 0, so \(x=0\) is a regular singular point.
        (b) The lowest power \(x^{r-1}\) gives \(a_0[4r(r-1)+2r]=0\Rightarrow 2r(2r-1)=0\), so \(r=0\) or \(r=\tfrac12\). The roots do not differ by an integer, so there are two independent Frobenius series.
        (c) The coefficient of \(x^{n+r}\) gives
        \[a_{n+1} = -\frac{a_n}{2(n+r+1)(2n+2r+1)}.\]
        \(r=0\): \(a_{n+1}=-a_n/[(2n+2)(2n+1)]\Rightarrow a_n=(-1)^n/(2n)!\), so
        \[y_1=\sum_{n\ge0}\frac{(-1)^n x^n}{(2n)!}=\cos\sqrt{x}.\]
        \(r=\tfrac12\): \(a_{n+1}=-a_n/[(2n+3)(2n+2)]\Rightarrow a_n=(-1)^n/(2n+1)!\), so
        \[y_2=\sum_{n\ge0}\frac{(-1)^n x^{n+1/2}}{(2n+1)!}=\sin\sqrt{x}.\]
        General solution: \(y = A\cos\sqrt x + B\sin\sqrt x\) (easily checked by direct substitution).
      ar: |
        (أ) بالصيغة المعيارية \(y''+\frac{1}{2x}y'+\frac{1}{4x}y=0\): الدالتان \(xP=\tfrac12\) و\(x^2Q=\tfrac{x}{4}\) تحليليتان عند 0، إذن \(x=0\) نقطة شاذة منتظمة.
        (ب) تعطي أدنى قوة \(x^{r-1}\): \(a_0[4r(r-1)+2r]=0\Rightarrow 2r(2r-1)=0\)، أي \(r=0\) أو \(r=\tfrac12\). ولا يختلف الجذران بعدد صحيح، فنحصل على متسلسلتي فروبينيوس مستقلتين.
        (ج) يعطي معامل \(x^{n+r}\):
        \[a_{n+1} = -\frac{a_n}{2(n+r+1)(2n+2r+1)}.\]
        \(r=0\): \(a_{n+1}=-a_n/[(2n+2)(2n+1)]\Rightarrow a_n=(-1)^n/(2n)!\)، إذن
        \[y_1=\sum_{n\ge0}\frac{(-1)^n x^n}{(2n)!}=\cos\sqrt{x}.\]
        \(r=\tfrac12\): \(a_{n+1}=-a_n/[(2n+3)(2n+2)]\Rightarrow a_n=(-1)^n/(2n+1)!\)، إذن
        \[y_2=\sum_{n\ge0}\frac{(-1)^n x^{n+1/2}}{(2n+1)!}=\sin\sqrt{x}.\]
        الحل العام: \(y = A\cos\sqrt x + B\sin\sqrt x\) (ويمكن التحقق منه بسهولة بالتعويض المباشر).
  - title: { en: Potential of a sphere with prescribed surface potential, ar: كمون كرة ذات كمون سطحي معلوم }
    difficulty: 2
    statement:
      en: |
        The surface of a sphere of radius \(R\) (no charge inside or outside) is held at the potential \(V(R,\theta)=V_0\cos^2\theta\).
        Using Legendre polynomials, find the potential \(V(r,\theta)\) inside and outside the sphere.
      ar: |
        يُثبَّت سطح كرة نصف قطرها \(R\) (لا شحنات داخلها ولا خارجها) عند الكمون \(V(R,\theta)=V_0\cos^2\theta\).
        باستعمال كثيرات حدود لوجندر، أوجد الكمون \(V(r,\theta)\) داخل الكرة وخارجها.
    hint:
      en: 'General axisymmetric solution: \(V=\sum_\ell (A_\ell r^\ell + B_\ell r^{-\ell-1})P_\ell(\cos\theta)\). Write \(\cos^2\theta\) in terms of \(P_0\) and \(P_2\).'
      ar: 'الحل العام في حالة التناظر السمتي: \(V=\sum_\ell (A_\ell r^\ell + B_\ell r^{-\ell-1})P_\ell(\cos\theta)\). اكتب \(\cos^2\theta\) بدلالة \(P_0\) و\(P_2\).'
    solution:
      en: |
        Since \(P_2(x)=\tfrac12(3x^2-1)\), we have \(x^2 = \tfrac13 P_0 + \tfrac23 P_2\). Hence \(V(R,\theta)=V_0\left[\tfrac13 P_0+\tfrac23P_2(\cos\theta)\right]\), and by orthogonality only \(\ell=0,2\) appear.
        Inside (\(r<R\)), regular at the origin, so \(B_\ell=0\):
        \[V_\text{in}=V_0\left[\frac13+\frac23\left(\frac{r}{R}\right)^2P_2(\cos\theta)\right].\]
        Outside (\(r>R\)), vanishing at infinity, so \(A_\ell=0\):
        \[V_\text{out}=V_0\left[\frac13\,\frac{R}{r}+\frac23\left(\frac{R}{r}\right)^3P_2(\cos\theta)\right].\]
        Both match \(V_0\cos^2\theta\) at \(r=R\). The \(1/r\) term is the potential of a net charge \(Q = 4\pi\varepsilon_0 R V_0/3\); the \(1/r^3\) term is a quadrupole.
      ar: |
        بما أن \(P_2(x)=\tfrac12(3x^2-1)\) فإن \(x^2 = \tfrac13 P_0 + \tfrac23 P_2\)، ومنه \(V(R,\theta)=V_0\left[\tfrac13 P_0+\tfrac23P_2(\cos\theta)\right]\)، وبفضل التعامد لا يظهر إلا \(\ell=0,2\).
        في الداخل (\(r<R\)) يجب أن يكون الكمون منتظمًا عند المركز فإن \(B_\ell=0\):
        \[V_\text{in}=V_0\left[\frac13+\frac23\left(\frac{r}{R}\right)^2P_2(\cos\theta)\right].\]
        في الخارج (\(r>R\)) يجب أن ينعدم الكمون في اللانهاية فإن \(A_\ell=0\):
        \[V_\text{out}=V_0\left[\frac13\,\frac{R}{r}+\frac23\left(\frac{R}{r}\right)^3P_2(\cos\theta)\right].\]
        يتطابق الحلّان مع \(V_0\cos^2\theta\) عند \(r=R\). والحد \(1/r\) هو كمون شحنة كلية \(Q = 4\pi\varepsilon_0 R V_0/3\)، أما الحد \(1/r^3\) فهو رباعي أقطاب.
  - title: { en: Fourier series of a square wave and two famous sums, ar: متسلسلة فورييه لموجة مربعة ومجموعان شهيران }
    difficulty: 2
    statement:
      en: |
        Let \(f(x)=-1\) for \(-\pi<x<0\) and \(f(x)=+1\) for \(0<x<\pi\), extended with period \(2\pi\).
        (a) Find its Fourier series. (b) Evaluate it at \(x=\pi/2\) to obtain a series for \(\pi\). (c) Use Parseval's identity to find \(\sum_{k\ge0}\frac{1}{(2k+1)^2}\). (d) What does the series give at \(x=0\)?
      ar: |
        لتكن \(f(x)=-1\) من أجل \(-\pi<x<0\) و\(f(x)=+1\) من أجل \(0<x<\pi\)، ممدَّدة بدور \(2\pi\).
        (أ) أوجد متسلسلة فورييه لها. (ب) احسبها عند \(x=\pi/2\) لتحصل على متسلسلة لـ \(\pi\). (ج) استعمل متطابقة بارسفال لإيجاد \(\sum_{k\ge0}\frac{1}{(2k+1)^2}\). (د) ماذا تعطي المتسلسلة عند \(x=0\)؟
    hint:
      en: '\(f\) is odd, so \(a_n=0\). Parseval: \(\frac1\pi\int_{-\pi}^{\pi}f^2\,\dd x = \frac{a_0^2}{2}+\sum_n(a_n^2+b_n^2)\).'
      ar: '\(f\) فردية فإن \(a_n=0\). متطابقة بارسفال: \(\frac1\pi\int_{-\pi}^{\pi}f^2\,\dd x = \frac{a_0^2}{2}+\sum_n(a_n^2+b_n^2)\).'
    solution:
      en: |
        (a) \(b_n=\frac{2}{\pi}\int_0^\pi\sin nx\,\dd x=\frac{2}{n\pi}(1-\cos n\pi)\), i.e. \(4/(n\pi)\) for odd \(n\) and 0 for even \(n\):
        \[f(x)=\frac4\pi\left(\sin x+\frac{\sin3x}{3}+\frac{\sin5x}{5}+\cdots\right).\]
        (b) At \(x=\pi/2\), \(f=1\) and \(\sin(n\pi/2) = 1,-1,1,\dots\) for \(n=1,3,5,\dots\):
        \[1=\frac4\pi\left(1-\frac13+\frac15-\cdots\right)\;\Rightarrow\;\frac\pi4=\sum_{k\ge0}\frac{(-1)^k}{2k+1}.\]
        (c) \(\frac1\pi\int_{-\pi}^{\pi}1\,\dd x=2=\frac{16}{\pi^2}\sum_{k\ge0}\frac1{(2k+1)^2}\Rightarrow\sum_{k\ge0}\frac{1}{(2k+1)^2}=\frac{\pi^2}{8}.\)
        (d) Every term vanishes at \(x=0\): the series converges to 0, the average of the one-sided limits \(-1\) and \(+1\). Near the jump, partial sums overshoot by about 9% of the jump (Gibbs phenomenon) — explore it with the Fourier lab.
      ar: |
        (أ) \(b_n=\frac{2}{\pi}\int_0^\pi\sin nx\,\dd x=\frac{2}{n\pi}(1-\cos n\pi)\)، أي \(4/(n\pi)\) من أجل \(n\) الفردي و0 من أجل \(n\) الزوجي:
        \[f(x)=\frac4\pi\left(\sin x+\frac{\sin3x}{3}+\frac{\sin5x}{5}+\cdots\right).\]
        (ب) عند \(x=\pi/2\) تكون \(f=1\) و\(\sin(n\pi/2) = 1,-1,1,\dots\) من أجل \(n=1,3,5,\dots\):
        \[1=\frac4\pi\left(1-\frac13+\frac15-\cdots\right)\;\Rightarrow\;\frac\pi4=\sum_{k\ge0}\frac{(-1)^k}{2k+1}.\]
        (ج) \(\frac1\pi\int_{-\pi}^{\pi}1\,\dd x=2=\frac{16}{\pi^2}\sum_{k\ge0}\frac1{(2k+1)^2}\Rightarrow\sum_{k\ge0}\frac{1}{(2k+1)^2}=\frac{\pi^2}{8}.\)
        (د) تنعدم كل الحدود عند \(x=0\)، فتتقارب المتسلسلة إلى 0، وهو متوسط النهايتين الجانبيتين \(-1\) و\(+1\). وبالقرب من نقطة القفز تتجاوز المجاميع الجزئية القيمة بنحو 9% من القفزة (ظاهرة غيبس)؛ استكشفها في مختبر فورييه.
  - title: { en: Solving an initial-value problem with the Laplace transform, ar: حل مسألة قيم ابتدائية بتحويل لابلاس }
    difficulty: 2
    statement:
      en: |
        Solve \(y''+3y'+2y=2\) with \(y(0)=0\), \(y'(0)=1\) using the Laplace transform, and check the result.
      ar: |
        حُلّ المعادلة \(y''+3y'+2y=2\) مع \(y(0)=0\) و\(y'(0)=1\) باستعمال تحويل لابلاس، ثم تحقق من النتيجة.
    hint:
      en: '\(\mathcal L\{y''\}=sY-y(0)\), \(\mathcal L\{y''''\}=s^2Y-sy(0)-y''(0)\), \(\mathcal L\{1\}=1/s\), \(\mathcal L\{e^{-at}\}=1/(s+a)\).'
      ar: '\(\mathcal L\{y''\}=sY-y(0)\)، \(\mathcal L\{y''''\}=s^2Y-sy(0)-y''(0)\)، \(\mathcal L\{1\}=1/s\)، \(\mathcal L\{e^{-at}\}=1/(s+a)\).'
    solution:
      en: |
        Transforming: \((s^2Y-1)+3sY+2Y=\dfrac2s\), so
        \[Y(s)=\frac{1+2/s}{s^2+3s+2}=\frac{s+2}{s(s+1)(s+2)}=\frac{1}{s(s+1)}=\frac1s-\frac1{s+1}.\]
        Inverting: \(y(t)=1-e^{-t}\).
        Check: \(y'=e^{-t}\), \(y''=-e^{-t}\); \(-e^{-t}+3e^{-t}+2-2e^{-t}=2\) ✓, \(y(0)=0\) ✓, \(y'(0)=1\) ✓.
        Note that the factor \((s+2)\) cancelled: the initial conditions are such that the \(e^{-2t}\) mode is never excited.
      ar: |
        بأخذ التحويل: \((s^2Y-1)+3sY+2Y=\dfrac2s\)، إذن
        \[Y(s)=\frac{1+2/s}{s^2+3s+2}=\frac{s+2}{s(s+1)(s+2)}=\frac{1}{s(s+1)}=\frac1s-\frac1{s+1}.\]
        وبالتحويل العكسي: \(y(t)=1-e^{-t}\).
        تحقق: \(y'=e^{-t}\) و\(y''=-e^{-t}\)؛ \(-e^{-t}+3e^{-t}+2-2e^{-t}=2\) ✓، \(y(0)=0\) ✓، \(y'(0)=1\) ✓.
        لاحظ أن العامل \((s+2)\) قد اختُزل: فالشروط الابتدائية لا تُثير النمط \(e^{-2t}\) إطلاقًا.
  - title: { en: 'Fourier transform of \(e^{-a|x|}\) and Parseval', ar: 'تحويل فورييه لـ \(e^{-a|x|}\) ومبرهنة بارسفال' }
    difficulty: 3
    statement:
      en: |
        With the convention \(F(k)=\int_{-\infty}^{\infty}f(x)e^{-ikx}\dd x\):
        (a) compute the Fourier transform of \(f(x)=e^{-a|x|}\), \(a>0\);
        (b) use Parseval's theorem \(\int|f|^2\dd x=\frac1{2\pi}\int|F|^2\dd k\) to evaluate \(\displaystyle\int_{-\infty}^{\infty}\frac{\dd k}{(k^2+a^2)^2}\).
      ar: |
        باعتماد الاصطلاح \(F(k)=\int_{-\infty}^{\infty}f(x)e^{-ikx}\dd x\):
        (أ) احسب تحويل فورييه للدالة \(f(x)=e^{-a|x|}\) حيث \(a>0\)؛
        (ب) استعمل مبرهنة بارسفال \(\int|f|^2\dd x=\frac1{2\pi}\int|F|^2\dd k\) لحساب \(\displaystyle\int_{-\infty}^{\infty}\frac{\dd k}{(k^2+a^2)^2}\).
    hint:
      en: Split the integral at \(x=0\); each half is an elementary exponential integral.
      ar: 'جزّئ التكامل عند \(x=0\)؛ فكل نصف تكامل أسي بسيط.'
    solution:
      en: |
        (a)
        \[F(k)=\int_{-\infty}^{0}e^{(a-ik)x}\dd x+\int_0^{\infty}e^{-(a+ik)x}\dd x=\frac1{a-ik}+\frac1{a+ik}=\frac{2a}{a^2+k^2}.\]
        A sharp cusp at \(x=0\) gives a slowly decaying (Lorentzian) spectrum.
        (b) \(\int_{-\infty}^{\infty}e^{-2a|x|}\dd x=\dfrac1a\). Parseval gives
        \[\frac1a=\frac1{2\pi}\int_{-\infty}^{\infty}\frac{4a^2}{(a^2+k^2)^2}\dd k\;\Rightarrow\;\int_{-\infty}^{\infty}\frac{\dd k}{(k^2+a^2)^2}=\frac{\pi}{2a^3}.\]
        (A residue calculation or the substitution \(k=a\tan\phi\) gives the same result.)
      ar: |
        (أ)
        \[F(k)=\int_{-\infty}^{0}e^{(a-ik)x}\dd x+\int_0^{\infty}e^{-(a+ik)x}\dd x=\frac1{a-ik}+\frac1{a+ik}=\frac{2a}{a^2+k^2}.\]
        فالنتوء الحاد عند \(x=0\) يعطي طيفًا يتناقص ببطء (لورنتزي).
        (ب) \(\int_{-\infty}^{\infty}e^{-2a|x|}\dd x=\dfrac1a\). وتعطي مبرهنة بارسفال
        \[\frac1a=\frac1{2\pi}\int_{-\infty}^{\infty}\frac{4a^2}{(a^2+k^2)^2}\dd k\;\Rightarrow\;\int_{-\infty}^{\infty}\frac{\dd k}{(k^2+a^2)^2}=\frac{\pi}{2a^3}.\]
        (ويعطي حساب الرواسب أو التعويض \(k=a\tan\phi\) النتيجة نفسها.)

quizzes:
  - title: { en: 'Gamma and Beta functions', ar: 'دالتا غاما وبيتا' }
    questions:
      - q:
          en: 'What is \(\Gamma(5)\)?'
          ar: 'ما قيمة \(\Gamma(5)\)؟'
        options:
          - '5'
          - '4'
          - '24'
          - '120'
        answer: 2
        explain:
          en: '\(\Gamma(n)=(n-1)!\) for positive integers, so \(\Gamma(5)=4!=24\).'
          ar: '\(\Gamma(n)=(n-1)!\) من أجل الأعداد الصحيحة الموجبة، إذن \(\Gamma(5)=4!=24\).'
      - q:
          en: 'What is \(\Gamma(1/2)\)?'
          ar: 'ما قيمة \(\Gamma(1/2)\)؟'
        options:
          - '\(\sqrt\pi\)'
          - '\(\pi\)'
          - '\(1/2\)'
          - '\(\sqrt{\pi}/2\)'
        answer: 0
        explain:
          en: '\(\Gamma(\tfrac12)=\int_0^\infty t^{-1/2}e^{-t}\dd t = 2\int_0^\infty e^{-u^2}\dd u=\sqrt\pi\). The value \(\sqrt\pi/2\) is \(\Gamma(3/2)\).'
          ar: '\(\Gamma(\tfrac12)=\int_0^\infty t^{-1/2}e^{-t}\dd t = 2\int_0^\infty e^{-u^2}\dd u=\sqrt\pi\). أما \(\sqrt\pi/2\) فهي \(\Gamma(3/2)\).'
      - q:
          en: 'What is \(B(2,3)\)?'
          ar: 'ما قيمة \(B(2,3)\)؟'
        options:
          - '\(1/6\)'
          - '\(1/24\)'
          - '\(2/3\)'
          - '\(1/12\)'
        answer: 3
        explain:
          en: '\(B(2,3)=\Gamma(2)\Gamma(3)/\Gamma(5)=1\cdot2/24=1/12\).'
          ar: '\(B(2,3)=\Gamma(2)\Gamma(3)/\Gamma(5)=1\cdot2/24=1/12\).'
      - q:
          en: 'Evaluate \(\int_0^\infty x^2e^{-x^2}\dd x\).'
          ar: 'احسب \(\int_0^\infty x^2e^{-x^2}\dd x\).'
        options:
          - '\(1/2\)'
          - '\(\sqrt\pi/4\)'
          - '\(\sqrt\pi/2\)'
          - '\(\sqrt\pi\)'
        answer: 1
        explain:
          en: 'With \(t=x^2\): \(\int_0^\infty x^2e^{-x^2}\dd x=\tfrac12\int_0^\infty t^{1/2}e^{-t}\dd t=\tfrac12\Gamma(\tfrac32)=\tfrac12\cdot\tfrac{\sqrt\pi}{2}=\tfrac{\sqrt\pi}{4}\).'
          ar: 'بوضع \(t=x^2\): \(\int_0^\infty x^2e^{-x^2}\dd x=\tfrac12\int_0^\infty t^{1/2}e^{-t}\dd t=\tfrac12\Gamma(\tfrac32)=\tfrac12\cdot\tfrac{\sqrt\pi}{2}=\tfrac{\sqrt\pi}{4}\).'
      - q:
          en: 'For large \(n\), Stirling''s formula gives \(\ln n!\approx\)'
          ar: 'من أجل \(n\) كبير، تعطي صيغة ستيرلنغ \(\ln n!\approx\)'
        options:
          - '\(\ln n - n\)'
          - '\(n\ln n-n\)'
          - '\(n\ln n\)'
          - '\(n^2/2\)'
        answer: 1
        explain:
          en: '\(n!\approx\sqrt{2\pi n}\,(n/e)^n\), so \(\ln n!=n\ln n-n+\tfrac12\ln(2\pi n)+\dots\); the leading terms are \(n\ln n-n\).'
          ar: '\(n!\approx\sqrt{2\pi n}\,(n/e)^n\)، إذن \(\ln n!=n\ln n-n+\tfrac12\ln(2\pi n)+\dots\)، والحدان الرئيسيان هما \(n\ln n-n\).'
  - title: { en: 'Series solutions and special functions', ar: 'الحلول بالمتسلسلات والدوال الخاصة' }
    questions:
      - q:
          en: 'For Bessel''s equation \(x^2y''''+xy''+(x^2-\nu^2)y=0\), the point \(x=0\) is'
          ar: 'من أجل معادلة بسل \(x^2y''''+xy''+(x^2-\nu^2)y=0\)، النقطة \(x=0\) هي'
        options:
          - { en: 'an ordinary point', ar: 'نقطة عادية' }
          - { en: 'an irregular singular point', ar: 'نقطة شاذة غير منتظمة' }
          - { en: 'a branch point of every solution', ar: 'نقطة تفرّع لكل الحلول' }
          - { en: 'a regular singular point', ar: 'نقطة شاذة منتظمة' }
        answer: 3
        explain:
          en: '\(P=1/x\) and \(Q=1-\nu^2/x^2\) are singular, but \(xP=1\) and \(x^2Q=x^2-\nu^2\) are analytic: regular singular point, so the Frobenius method applies.'
          ar: 'الدالتان \(P=1/x\) و\(Q=1-\nu^2/x^2\) شاذتان، لكن \(xP=1\) و\(x^2Q=x^2-\nu^2\) تحليليتان، فهي نقطة شاذة منتظمة وتنطبق طريقة فروبينيوس.'
      - q:
          en: 'What are the roots of the indicial equation of Bessel''s equation of order \(\nu\)?'
          ar: 'ما جذرا المعادلة الدليلية لمعادلة بسل من الرتبة \(\nu\)؟'
        options:
          - '\(r=\pm\nu\)'
          - '\(r=0,1\)'
          - '\(r=\nu,\nu+1\)'
          - '\(r=\pm\nu^2\)'
        answer: 0
        explain:
          en: 'The lowest power gives \(r(r-1)+r-\nu^2=r^2-\nu^2=0\). When \(2\nu\) is an integer the second solution may need care (e.g. \(Y_n\) has a logarithm).'
          ar: 'تعطي أدنى قوة \(r(r-1)+r-\nu^2=r^2-\nu^2=0\). وعندما يكون \(2\nu\) عددًا صحيحًا قد يتطلب الحل الثاني عناية خاصة (فمثلًا \(Y_n\) يحتوي على لوغاريتم).'
      - q:
          en: 'Which is the Legendre polynomial \(P_2(x)\)?'
          ar: 'ما كثير حدود لوجندر \(P_2(x)\)؟'
        options:
          - '\(\tfrac12(5x^3-3x)\)'
          - '\(x^2\)'
          - '\(\tfrac12(3x^2-1)\)'
          - '\(3x^2-1\)'
        answer: 2
        explain:
          en: 'From Rodrigues'' formula \(P_\ell=\frac1{2^\ell\ell!}\frac{\dd^\ell}{\dd x^\ell}(x^2-1)^\ell\) with \(\ell=2\); it is normalised so that \(P_2(1)=1\). \(\tfrac12(5x^3-3x)\) is \(P_3\).'
          ar: 'من صيغة رودريغز \(P_\ell=\frac1{2^\ell\ell!}\frac{\dd^\ell}{\dd x^\ell}(x^2-1)^\ell\) مع \(\ell=2\)، وهو مقيَّس بحيث \(P_2(1)=1\). أما \(\tfrac12(5x^3-3x)\) فهو \(P_3\).'
      - q:
          en: 'What is \(\int_{-1}^{1}[P_2(x)]^2\dd x\)?'
          ar: 'ما قيمة \(\int_{-1}^{1}[P_2(x)]^2\dd x\)؟'
        options:
          - '\(1\)'
          - '\(0\)'
          - '\(2/3\)'
          - '\(2/5\)'
        answer: 3
        explain:
          en: '\(\int_{-1}^1P_\ell P_m\dd x=\frac{2}{2\ell+1}\delta_{\ell m}\); with \(\ell=2\) this is \(2/5\).'
          ar: '\(\int_{-1}^1P_\ell P_m\dd x=\frac{2}{2\ell+1}\delta_{\ell m}\)، ومن أجل \(\ell=2\) نجد \(2/5\).'
      - q:
          en: 'Which special functions appear in the radial wavefunctions of the hydrogen atom?'
          ar: 'ما الدوال الخاصة التي تظهر في الدوال الموجية القطرية لذرة الهيدروجين؟'
        options:
          - { en: 'Chebyshev polynomials', ar: 'كثيرات حدود تشيبيشيف' }
          - { en: 'Associated Laguerre polynomials', ar: 'كثيرات حدود لاغير المرافقة' }
          - { en: 'Hermite polynomials', ar: 'كثيرات حدود هيرميت' }
          - { en: 'Bessel functions of the first kind', ar: 'دوال بسل من النوع الأول' }
        answer: 1
        explain:
          en: '\(R_{n\ell}(r)\propto\rho^\ell e^{-\rho/2}L^{2\ell+1}_{n-\ell-1}(\rho)\). Hermite polynomials belong to the harmonic oscillator; the angular part involves Legendre functions.'
          ar: '\(R_{n\ell}(r)\propto\rho^\ell e^{-\rho/2}L^{2\ell+1}_{n-\ell-1}(\rho)\). أما كثيرات حدود هيرميت فتخص المهتز التوافقي، ويتضمن الجزء الزاوي دوال لوجندر.'
  - title: { en: 'Fourier series and integral transforms', ar: 'متسلسلات فورييه والتحويلات التكاملية' }
    questions:
      - q:
          en: 'The Fourier series on \((-\pi,\pi)\) of an odd function contains'
          ar: 'تحتوي متسلسلة فورييه على المجال \((-\pi,\pi)\) لدالة فردية على'
        options:
          - { en: 'both sines and cosines', ar: 'حدود جيبية وجيب تمام معًا' }
          - { en: 'only a constant term', ar: 'حدًّا ثابتًا فقط' }
          - { en: 'only sine terms', ar: 'حدود جيبية فقط' }
          - { en: 'only cosine terms and a constant', ar: 'حدود جيب تمام وحد ثابت فقط' }
        answer: 2
        explain:
          en: '\(a_n=\frac1\pi\int f\cos nx\,\dd x\) integrates an odd function over a symmetric interval, so \(a_n=0\) (and \(a_0=0\)).'
          ar: '\(a_n=\frac1\pi\int f\cos nx\,\dd x\) تكامل لدالة فردية على مجال متناظر، إذن \(a_n=0\) (و\(a_0=0\)).'
      - q:
          en: 'At a jump discontinuity of a piecewise smooth function, its Fourier series converges to'
          ar: 'عند نقطة انقطاع بقفزة لدالة ملساء قطعيًّا، تتقارب متسلسلة فورييه إلى'
        options:
          - { en: 'the average of the left and right limits', ar: 'متوسط النهايتين اليسرى واليمنى' }
          - { en: 'the left limit', ar: 'النهاية اليسرى' }
          - { en: 'the right limit', ar: 'النهاية اليمنى' }
          - { en: 'it diverges there', ar: 'لا تتقارب عندها' }
        answer: 0
        explain:
          en: 'Dirichlet''s theorem: the series converges to \(\tfrac12[f(x^-)+f(x^+)]\).'
          ar: 'وفق مبرهنة ديريكليه تتقارب المتسلسلة إلى \(\tfrac12[f(x^-)+f(x^+)]\).'
      - q:
          en: 'The Gibbs phenomenon is an overshoot of the partial sums near a jump of about'
          ar: 'ظاهرة غيبس تجاوزٌ للمجاميع الجزئية قرب القفزة بمقدار يقارب'
        options:
          - { en: '9% of the jump, which does not vanish as more terms are added', ar: '9% من القفزة، ولا يزول بزيادة عدد الحدود' }
          - { en: '9% of the jump, which tends to zero with more terms', ar: '9% من القفزة، ويؤول إلى الصفر بزيادة عدد الحدود' }
          - { en: '50% of the jump', ar: '50% من القفزة' }
          - { en: 'zero for smooth functions and jumps alike', ar: 'صفر سواء في الدوال الملساء أو عند القفزات' }
        answer: 0
        explain:
          en: 'The overshoot tends to about 0.0895 of the jump. Adding terms narrows the overshoot region but does not reduce its height. Try it in the Fourier lab.'
          ar: 'يؤول التجاوز إلى نحو 0.0895 من القفزة. وزيادة عدد الحدود تضيّق منطقة التجاوز لكنها لا تُنقص ارتفاعه. جرّب ذلك في مختبر فورييه.'
      - q:
          en: 'The Fourier transform of a Gaussian \(e^{-x^2/2\sigma^2}\) is'
          ar: 'تحويل فورييه لدالة غاوسية \(e^{-x^2/2\sigma^2}\) هو'
        options:
          - { en: 'a Lorentzian', ar: 'دالة لورنتزية' }
          - { en: 'a sinc function', ar: 'دالة sinc' }
          - { en: 'a Gaussian whose width is proportional to \(1/\sigma\)', ar: 'دالة غاوسية عرضها يتناسب مع \(1/\sigma\)' }
          - { en: 'a Gaussian with the same width \(\sigma\)', ar: 'دالة غاوسية بالعرض نفسه \(\sigma\)' }
        answer: 2
        explain:
          en: '\(\int e^{-x^2/2\sigma^2}e^{-ikx}\dd x=\sqrt{2\pi}\,\sigma\,e^{-\sigma^2k^2/2}\). A narrow pulse has a broad spectrum — the origin of the uncertainty relation.'
          ar: '\(\int e^{-x^2/2\sigma^2}e^{-ikx}\dd x=\sqrt{2\pi}\,\sigma\,e^{-\sigma^2k^2/2}\). فالنبضة الضيقة ذات طيف عريض، وهذا أصل علاقة الارتياب.'
      - q:
          en: 'If \(\mathcal L\{f(t)\}=F(s)\), what is \(\mathcal L\{f''(t)\}\)?'
          ar: 'إذا كان \(\mathcal L\{f(t)\}=F(s)\)، فما \(\mathcal L\{f''(t)\}\)؟'
        options:
          - '\(F''(s)\)'
          - '\(sF(s)-f(0)\)'
          - '\(sF(s)\)'
          - '\(F(s)/s\)'
        answer: 1
        explain:
          en: 'Integrating by parts: \(\int_0^\infty f''e^{-st}\dd t=[fe^{-st}]_0^\infty+s\int_0^\infty fe^{-st}\dd t=sF(s)-f(0)\). This turns ODEs into algebraic equations that include the initial conditions.'
          ar: 'بالتكامل بالتجزئة: \(\int_0^\infty f''e^{-st}\dd t=[fe^{-st}]_0^\infty+s\int_0^\infty fe^{-st}\dd t=sF(s)-f(0)\)؛ وبذلك تتحول المعادلات التفاضلية إلى معادلات جبرية تتضمن الشروط الابتدائية.'
  - title: { en: 'Probability, statistics and groups', ar: 'الاحتمالات والإحصاء والزمر' }
    questions:
      - q:
          en: 'A Poisson distribution with mean \(\lambda\) has variance'
          ar: 'تباين توزيع بواسون ذي المتوسط \(\lambda\) يساوي'
        options:
          - '\(\lambda^2\)'
          - '\(\sqrt\lambda\)'
          - '\(1/\lambda\)'
          - '\(\lambda\)'
        answer: 3
        explain:
          en: 'For \(P(n)=\lambda^ne^{-\lambda}/n!\), both the mean and the variance equal \(\lambda\); the standard deviation is \(\sqrt\lambda\).'
          ar: 'من أجل \(P(n)=\lambda^ne^{-\lambda}/n!\) يساوي كلٌّ من المتوسط والتباين \(\lambda\)، أما الانحراف المعياري فهو \(\sqrt\lambda\).'
      - q:
          en: 'What is the variance of the number of heads in 100 tosses of a fair coin?'
          ar: 'ما تباين عدد مرات ظهور الوجه في 100 رمية لقطعة نقود متوازنة؟'
        options:
          - '10'
          - '25'
          - '50'
          - '5'
        answer: 1
        explain:
          en: 'Binomial: \(\sigma^2=np(1-p)=100\times\tfrac12\times\tfrac12=25\) (standard deviation 5).'
          ar: 'التوزيع ذو الحدين: \(\sigma^2=np(1-p)=100\times\tfrac12\times\tfrac12=25\) (والانحراف المعياري 5).'
      - q:
          en: 'For a Gaussian distribution, what is the probability of falling within one standard deviation of the mean?'
          ar: 'ما احتمال وقوع قيمة ضمن انحراف معياري واحد حول المتوسط في التوزيع الغاوسي؟'
        options:
          - { en: 'about 95%', ar: 'نحو 95%' }
          - { en: 'about 50%', ar: 'نحو 50%' }
          - { en: 'about 99.7%', ar: 'نحو 99.7%' }
          - { en: 'about 68%', ar: 'نحو 68%' }
        answer: 3
        explain:
          en: '\(\operatorname{erf}(1/\sqrt2)\approx0.683\). About 95% lies within \(2\sigma\) and 99.7% within \(3\sigma\).'
          ar: '\(\operatorname{erf}(1/\sqrt2)\approx0.683\). ويقع نحو 95% ضمن \(2\sigma\) و99.7% ضمن \(3\sigma\).'
      - q:
          en: 'Which of the following is NOT one of the group axioms?'
          ar: 'أيّ مما يلي ليس من مسلّمات الزمرة؟'
        options:
          - { en: 'Associativity', ar: 'التجميع' }
          - { en: 'Existence of an identity and of inverses', ar: 'وجود العنصر المحايد والنظائر' }
          - { en: 'Commutativity', ar: 'التبديل' }
          - { en: 'Closure', ar: 'الانغلاق' }
        answer: 2
        explain:
          en: 'A group needs closure, associativity, an identity and inverses. Commutativity defines the special case of an abelian group (rotations in 3D, for example, do not commute).'
          ar: 'تتطلب الزمرة الانغلاق والتجميع ووجود المحايد والنظائر. أما التبديل فيعرّف الحالة الخاصة للزمرة الأبيلية (فالدورانات في ثلاثة أبعاد مثلًا غير تبديلية).'
      - q:
          en: 'Under multiplication, the set \(\{1,-1,i,-i\}\)'
          ar: 'المجموعة \(\{1,-1,i,-i\}\) مع عملية الضرب'
        options:
          - { en: 'is a cyclic group of order 4', ar: 'زمرة دورية من الرتبة 4' }
          - { en: 'is not a group (some inverses are missing)', ar: 'ليست زمرة (بعض النظائر غير موجود)' }
          - { en: 'is a non-abelian group', ar: 'زمرة غير أبيلية' }
          - { en: 'is a group of order 2', ar: 'زمرة من الرتبة 2' }
        answer: 0
        explain:
          en: 'All elements are powers of \(i\) (\(i^0, i^1, i^2, i^3\)). The set is closed, \(1\) is the identity, \(i^{-1}=-i\), so it is the cyclic group \(C_4\), which is abelian.'
          ar: 'كل العناصر قوى للعدد \(i\) (\(i^0, i^1, i^2, i^3\))، والمجموعة مغلقة، و\(1\) هو المحايد، و\(i^{-1}=-i\)؛ فهي الزمرة الدورية \(C_4\)، وهي أبيلية.'


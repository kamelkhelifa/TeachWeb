  en: Calculus (series, multiple integrals), linear algebra and first-order/second-order ODEs with constant coefficients, as covered in Mathematical Physics I.
  ar: التفاضل والتكامل (المتسلسلات، التكاملات المتعددة)، والجبر الخطي، والمعادلات التفاضلية من الرتبتين الأولى والثانية ذات المعاملات الثابتة، كما تُدرَّس في مقرر الفيزياء الرياضية 1.

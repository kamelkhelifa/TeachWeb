glossary:
  - { en: Gamma function, ar: دالة غاما, fr: Fonction gamma, def: { en: '\(\Gamma(z)=\int_0^\infty t^{z-1}e^{-t}\dd t\); extends the factorial: \(\Gamma(n+1)=n!\).', ar: '\(\Gamma(z)=\int_0^\infty t^{z-1}e^{-t}\dd t\)، وهي تعميم للمضروب: \(\Gamma(n+1)=n!\).' } }
  - { en: Beta function, ar: دالة بيتا, fr: Fonction bêta, def: { en: '\(B(p,q)=\int_0^1t^{p-1}(1-t)^{q-1}\dd t=\Gamma(p)\Gamma(q)/\Gamma(p+q)\).', ar: '\(B(p,q)=\int_0^1t^{p-1}(1-t)^{q-1}\dd t=\Gamma(p)\Gamma(q)/\Gamma(p+q)\).' } }
  - { en: Stirling's formula, ar: صيغة ستيرلنغ, fr: Formule de Stirling, def: { en: 'Asymptotic form \(n!\approx\sqrt{2\pi n}\,(n/e)^n\) for large \(n\).', ar: 'الصيغة التقاربية \(n!\approx\sqrt{2\pi n}\,(n/e)^n\) من أجل \(n\) كبير.' } }
  - { en: Error function, ar: دالة الخطأ, fr: Fonction d'erreur, def: { en: '\(\operatorname{erf}x=\frac{2}{\sqrt\pi}\int_0^xe^{-t^2}\dd t\), related to the incomplete Gamma function.', ar: '\(\operatorname{erf}x=\frac{2}{\sqrt\pi}\int_0^xe^{-t^2}\dd t\)، وترتبط بدالة غاما الناقصة.' } }
  - { en: Ordinary point, ar: نقطة عادية, fr: Point ordinaire, def: { en: 'A point where the coefficients \(P, Q\) of \(y''''+Py''+Qy=0\) are analytic; two power-series solutions exist there.', ar: 'نقطة تكون عندها المعاملات \(P, Q\) في \(y''''+Py''+Qy=0\) تحليلية، ويوجد عندها حلّان بمتسلسلات القوى.' } }
  - { en: Regular singular point, ar: نقطة شاذة منتظمة, fr: Point singulier régulier, def: { en: 'A singular point \(x_0\) where \((x-x_0)P\) and \((x-x_0)^2Q\) are analytic; the Frobenius method applies there.', ar: 'نقطة شاذة \(x_0\) تكون عندها \((x-x_0)P\) و\((x-x_0)^2Q\) تحليليتين، وتنطبق عندها طريقة فروبينيوس.' } }
  - { en: Frobenius method, ar: طريقة فروبينيوس, fr: Méthode de Frobenius, def: { en: 'Series solution \(y=\sum a_nx^{n+r}\) about a regular singular point.', ar: 'حل بالمتسلسلة \(y=\sum a_nx^{n+r}\) حول نقطة شاذة منتظمة.' } }
  - { en: Indicial equation, ar: المعادلة الدليلية, fr: Équation indicielle, def: { en: 'The equation for the exponent \(r\) obtained from the lowest power in the Frobenius method.', ar: 'المعادلة التي تحدد الأس \(r\)، وتُستخرج من أدنى قوة في طريقة فروبينيوس.' } }
  - { en: Wronskian, ar: الرونسكيان, fr: Wronskien, def: { en: '\(W=y_1y_2''-y_1''y_2\); non-zero if and only if the two solutions are linearly independent.', ar: '\(W=y_1y_2''-y_1''y_2\)، ولا ينعدم إلا إذا كان الحلّان مرتبطين خطيًّا.' } }
  - { en: Bessel function, ar: دالة بسل, fr: Fonction de Bessel, def: { en: '\(J_\nu(x)\), the solution of Bessel''s equation that is regular at the origin; it appears in problems with cylindrical symmetry.', ar: '\(J_\nu(x)\)، حل معادلة بسل المنتظم عند المبدأ، ويظهر في المسائل ذات التناظر الأسطواني.' } }
  - { en: Neumann function, ar: دالة نويمان, fr: Fonction de Neumann, def: { en: '\(Y_\nu(x)\), the second solution of Bessel''s equation; it is singular at \(x=0\).', ar: '\(Y_\nu(x)\)، الحل الثاني لمعادلة بسل، وهو شاذ عند \(x=0\).' } }
  - { en: Hankel functions, ar: دوال هانكل, fr: Fonctions de Hankel, def: { en: '\(H^{(1,2)}_\nu=J_\nu\pm iY_\nu\); they describe outgoing and incoming cylindrical waves.', ar: '\(H^{(1,2)}_\nu=J_\nu\pm iY_\nu\)، وتصف الموجات الأسطوانية الصادرة والواردة.' } }
  - { en: Modified Bessel functions, ar: دوال بسل المعدّلة, fr: Fonctions de Bessel modifiées, def: { en: '\(I_\nu, K_\nu\): solutions of \(x^2y''''+xy''-(x^2+\nu^2)y=0\), growing or decaying exponentially.', ar: '\(I_\nu, K_\nu\): حلول \(x^2y''''+xy''-(x^2+\nu^2)y=0\)، وتتزايد أو تتناقص أسيًّا.' } }
  - { en: Spherical Bessel functions, ar: دوال بسل الكروية, fr: Fonctions de Bessel sphériques, def: { en: '\(j_\ell(x)=\sqrt{\pi/2x}\,J_{\ell+1/2}(x)\); radial solutions of the Helmholtz equation in spherical coordinates.', ar: '\(j_\ell(x)=\sqrt{\pi/2x}\,J_{\ell+1/2}(x)\)، وهي الحلول القطرية لمعادلة هلمهولتز في الإحداثيات الكروية.' } }
  - { en: Legendre polynomial, ar: كثير حدود لوجندر, fr: Polynôme de Legendre, def: { en: '\(P_\ell(x)\), polynomial solution of Legendre''s equation; orthogonal on \([-1,1]\).', ar: '\(P_\ell(x)\)، الحل كثير الحدود لمعادلة لوجندر، وهو متعامد على \([-1,1]\).' } }
  - { en: Rodrigues' formula, ar: صيغة رودريغز, fr: Formule de Rodrigues, def: { en: 'Expression of an orthogonal polynomial as a repeated derivative, e.g. \(P_\ell=\frac{1}{2^\ell\ell!}\frac{\dd^\ell}{\dd x^\ell}(x^2-1)^\ell\).', ar: 'تعبير عن كثير حدود متعامد بمشتقة متكررة، مثل \(P_\ell=\frac{1}{2^\ell\ell!}\frac{\dd^\ell}{\dd x^\ell}(x^2-1)^\ell\).' } }
  - { en: Generating function, ar: الدالة المولّدة, fr: Fonction génératrice, def: { en: 'A function whose power-series coefficients are a family of functions, e.g. \((1-2xt+t^2)^{-1/2}=\sum P_\ell(x)t^\ell\).', ar: 'دالة معاملات نشرها في متسلسلة قوى هي عائلة من الدوال، مثل \((1-2xt+t^2)^{-1/2}=\sum P_\ell(x)t^\ell\).' } }
  - { en: Orthogonality, ar: التعامد, fr: Orthogonalité, def: { en: 'Vanishing of \(\int f_nf_m\,w\,\dd x\) for \(n\ne m\) with a weight function \(w\); it allows expansions in series of special functions.', ar: 'انعدام \(\int f_nf_m\,w\,\dd x\) من أجل \(n\ne m\) بدالة وزن \(w\)، وهو ما يسمح بالنشر في متسلسلات من الدوال الخاصة.' } }
  - { en: Hermite polynomial, ar: كثير حدود هيرميت, fr: Polynôme d'Hermite, def: { en: '\(H_n(x)\), orthogonal with weight \(e^{-x^2}\); it appears in the quantum harmonic oscillator.', ar: '\(H_n(x)\)، متعامد بدالة الوزن \(e^{-x^2}\)، ويظهر في المهتز التوافقي الكمومي.' } }
  - { en: Laguerre polynomial, ar: كثير حدود لاغير, fr: Polynôme de Laguerre, def: { en: '\(L_n(x)\), orthogonal on \([0,\infty)\) with weight \(e^{-x}\); its associated forms appear in the hydrogen atom.', ar: '\(L_n(x)\)، متعامد على \([0,\infty)\) بدالة الوزن \(e^{-x}\)، وتظهر صيغه المرافقة في ذرة الهيدروجين.' } }
  - { en: Fourier series, ar: متسلسلة فورييه, fr: Série de Fourier, def: { en: Expansion of a periodic function in sines and cosines (or complex exponentials)., ar: نشر دالة دورية بدلالة الجيوب وجيوب التمام (أو الأسيات المركبة). } }
  - { en: Gibbs phenomenon, ar: ظاهرة غيبس, fr: Phénomène de Gibbs, def: { en: Persistent overshoot (about 9% of the jump) of Fourier partial sums near a discontinuity., ar: تجاوز دائم (نحو 9% من القفزة) للمجاميع الجزئية لمتسلسلة فورييه قرب نقطة انقطاع. } }
  - { en: Parseval's theorem, ar: مبرهنة بارسفال, fr: Théorème de Parseval, def: { en: 'The integral of \(|f|^2\) equals the corresponding sum or integral of the squared Fourier coefficients (energy conservation).', ar: 'تكامل \(|f|^2\) يساوي المجموع أو التكامل المقابل لمربعات معاملات فورييه (انحفاظ الطاقة).' } }
  - { en: Fourier transform, ar: تحويل فورييه, fr: Transformée de Fourier, def: { en: '\(F(k)=\int f(x)e^{-ikx}\dd x\); it decomposes a non-periodic function into plane waves.', ar: '\(F(k)=\int f(x)e^{-ikx}\dd x\)، ويحلّل دالة غير دورية إلى موجات مستوية.' } }
  - { en: Convolution, ar: الالتفاف, fr: Produit de convolution, def: { en: '\((f*g)(x)=\int f(y)g(x-y)\dd y\); its Fourier transform is the product \(FG\).', ar: '\((f*g)(x)=\int f(y)g(x-y)\dd y\)، وتحويل فورييه له هو الجداء \(FG\).' } }
  - { en: Laplace transform, ar: تحويل لابلاس, fr: Transformée de Laplace, def: { en: '\(F(s)=\int_0^\infty f(t)e^{-st}\dd t\); it converts linear initial-value problems into algebra.', ar: '\(F(s)=\int_0^\infty f(t)e^{-st}\dd t\)، ويحوّل مسائل القيم الابتدائية الخطية إلى مسائل جبرية.' } }
  - { en: Random variable, ar: المتغير العشوائي, fr: Variable aléatoire, def: { en: A quantity whose value is determined by the outcome of a random experiment., ar: مقدار تتحدد قيمته بنتيجة تجربة عشوائية. } }
  - { en: Poisson distribution, ar: توزيع بواسون, fr: Loi de Poisson, def: { en: '\(P(n)=\lambda^ne^{-\lambda}/n!\); it counts rare independent events (e.g. radioactive decays).', ar: '\(P(n)=\lambda^ne^{-\lambda}/n!\)، ويصف عدد الأحداث النادرة المستقلة (مثل الانحلالات الإشعاعية).' } }
  - { en: Gaussian (normal) distribution, ar: التوزيع الغاوسي (الطبيعي), fr: Loi normale (gaussienne), def: { en: 'Probability density \(\propto e^{-(x-\mu)^2/2\sigma^2}\); the limit of sums of many independent variables.', ar: 'كثافة احتمال \(\propto e^{-(x-\mu)^2/2\sigma^2}\)، وهو نهاية مجموع عدد كبير من المتغيرات المستقلة.' } }
  - { en: Group, ar: الزمرة, fr: Groupe, def: { en: 'A set with an associative, closed operation that has an identity and inverses; the language of symmetry.', ar: مجموعة مزوّدة بعملية تجميعية مغلقة لها عنصر محايد ونظائر، وهي لغة التناظر. } }


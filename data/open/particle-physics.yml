    - { authors: F. Halzen & A. D. Martin, title: 'Quarks and Leptons: An Introductory Course in Modern Particle Physics', publisher: John Wiley & Sons, year: 1984 }
    - { authors: B. R. Martin & G. Shaw, title: Particle Physics, edition: 4th, publisher: John Wiley & Sons, year: 2017 }
    - { authors: D. H. Perkins, title: Introduction to High Energy Physics, edition: 4th, publisher: Cambridge University Press, year: 2000 }
    - { authors: A. Bettini, title: Introduction to Elementary Particle Physics, edition: 2nd, publisher: Cambridge University Press, year: 2014 }
  online:
    - title: { en: Particle Data Group (PDG), ar: مجموعة بيانات الجسيمات (PDG) }
      url: https://pdg.lbl.gov/
      note: { en: 'The reference for particle masses, lifetimes, branching ratios and review articles; used in the problem sets.', ar: 'المرجع المعتمد لكتل الجسيمات وأعمارها ونسب تفرّعها ومقالاتها المرجعية؛ ويُستعمل في سلاسل التمارين.' }
    - title: { en: CERN Open Data portal, ar: بوابة البيانات المفتوحة لـ CERN }
      url: https://opendata.cern.ch/
      note: { en: Real LHC collision data and tutorials — a natural source for the mini-project., ar: معطيات تصادمات حقيقية من LHC ودروس تطبيقية — مصدر طبيعي للمشروع المصغّر. }
    - title: { en: The Particle Adventure, ar: مغامرة الجسيمات }
      url: https://particleadventure.org/
      note: { en: Accessible illustrated tour of the Standard Model for revision., ar: جولة مصوّرة ميسّرة في النموذج القياسي للمراجعة. }

glossary:
  - { en: Standard Model, ar: النموذج القياسي, fr: Modèle standard, def: { en: 'Gauge theory SU(3)×SU(2)×U(1) of the strong, weak and electromagnetic interactions of quarks and leptons.', ar: 'نظرية معيارية SU(3)×SU(2)×U(1) للتفاعلات القوية والضعيفة والكهرومغناطيسية بين الكواركات واللبتونات.' } }
  - { en: Quark, ar: الكوارك, fr: Quark, def: { en: 'Fractionally charged, coloured fermion; six flavours u, d, s, c, b, t.', ar: 'فرميون ذو شحنة كسرية ولون؛ له ست نكهات u وd وs وc وb وt.' } }
  - { en: Lepton, ar: اللبتون, fr: Lepton, def: { en: 'Fermion without colour: e, μ, τ and their neutrinos.', ar: 'فرميون بلا لون: e وμ وτ ونيوترينواتها.' } }
  - { en: Hadron, ar: الهادرون, fr: Hadron, def: { en: Colour-neutral bound state of quarks — a baryon (qqq) or a meson (qq̄)., ar: حالة مقيّدة متعادلة لونيًا من الكواركات — باريون (qqq) أو ميزون (qq̄). } }
  - { en: Gauge boson, ar: البوزون المعياري, fr: Boson de jauge, def: { en: 'Spin-1 carrier of an interaction: photon, W±, Z, gluons.', ar: 'حامل التفاعل ذو السبين 1: الفوتون، W±، Z، الغلوونات.' } }
  - { en: Four-momentum, ar: الزخم الرباعي, fr: Quadri-impulsion, def: { en: '\(p^\mu = (E/c, \vb{p})\), whose square \(p^2 = m^2c^2\) is invariant.', ar: '\(p^\mu = (E/c, \vb{p})\)، ومربعه \(p^2 = m^2c^2\) لامتغير.' } }
  - { en: Invariant mass, ar: الكتلة اللامتغيرة, fr: Masse invariante, def: { en: '\(\sqrt s\), total energy in the centre-of-mass frame of a system of particles.', ar: '\(\sqrt s\)، الطاقة الكلية لجملة جسيمات في إطار مركز كتلتها.' } }
  - { en: Cross-section, ar: المقطع العرضي, fr: Section efficace, def: { en: Effective target area measuring the probability of an interaction; unit the barn (10⁻²⁸ m²)., ar: مساحة هدف فعّالة تقيس احتمال حدوث التفاعل؛ ووحدتها البارن (10⁻²⁸ m²). } }
  - { en: Decay width, ar: عرض الاضمحلال, fr: Largeur de désintégration, def: { en: 'Decay rate expressed as an energy, \(\Gamma = \hbar/\tau\).', ar: 'معدل الاضمحلال معبّرًا عنه بالطاقة: \(\Gamma = \hbar/\tau\).' } }
  - { en: Branching ratio, ar: نسبة التفرّع, fr: Rapport d'embranchement, def: { en: Fraction of decays that proceed through a given channel., ar: نسبة الاضمحلالات التي تتم عبر قناة معيّنة. } }
  - { en: Baryon number, ar: العدد الباريوني, fr: Nombre baryonique, def: { en: '+1/3 for each quark and −1/3 for each antiquark; conserved in all observed processes.', ar: '+1/3 لكل كوارك و−1/3 لكل كوارك مضاد؛ وهو منحفظ في كل العمليات المرصودة.' } }
  - { en: Lepton number, ar: العدد اللبتوني, fr: Nombre leptonique, def: { en: 'Number of leptons minus antileptons, conserved separately for each family in the Standard Model (except via neutrino oscillations).', ar: 'عدد اللبتونات ناقص عدد اللبتونات المضادة، وينحفظ لكل عائلة على حدة في النموذج القياسي (باستثناء تذبذبات النيوترينو).' } }
  - { en: Strangeness, ar: الغرابة, fr: Étrangeté, def: { en: Quantum number counting strange antiquarks minus strange quarks; violated only by the weak interaction., ar: عدد كمومي يساوي عدد الكواركات الغريبة المضادة ناقص الكواركات الغريبة؛ ولا ينتهكه إلا التفاعل الضعيف. } }
  - { en: Parity, ar: الزوجية (التماثل المكاني), fr: Parité, def: { en: 'Symmetry under spatial inversion \(\vb{r}\to-\vb{r}\); conserved by strong and EM interactions, maximally violated by the weak one.', ar: 'التناظر بالنسبة للانعكاس المكاني \(\vb{r}\to-\vb{r}\)؛ ينحفظ في التفاعلين القوي والكهرومغناطيسي ويُنتهك انتهاكًا أعظميًا في الضعيف.' } }
  - { en: Isospin, ar: اللف النظائري (الإيزوسبين), fr: Isospin, def: { en: SU(2) symmetry treating u and d quarks (or proton and neutron) as two states of one particle., ar: تناظر SU(2) يعامل الكواركين u وd (أو البروتون والنيوترون) كحالتين لجسيم واحد. } }
  - { en: Colour, ar: الشحنة اللونية, fr: Couleur, def: { en: 'Three-valued charge of quarks and gluons, the source of the strong interaction.', ar: 'شحنة ثلاثية القيم للكواركات والغلوونات، وهي مصدر التفاعل القوي.' } }
  - { en: Gluon, ar: الغلوون, fr: Gluon, def: { en: Massless coloured gauge boson of QCD; there are eight., ar: بوزون معياري عديم الكتلة ملوّن في الكروموديناميكا الكمومية؛ وعددها ثمانية. } }
  - { en: Asymptotic freedom, ar: الحرية التقاربية, fr: Liberté asymptotique, def: { en: Decrease of the strong coupling at high energies (short distances)., ar: تناقص ثابت الاقتران القوي عند الطاقات العالية (المسافات القصيرة). } }
  - { en: Confinement, ar: الحصر (اللوني), fr: Confinement, def: { en: Impossibility of isolating colour-charged quarks or gluons; only colour singlets are observed., ar: استحالة عزل الكواركات أو الغلوونات المشحونة لونيًا؛ ولا تُرصد إلا الحالات الأحادية اللون. } }
  - { en: Dirac equation, ar: معادلة ديراك, fr: Équation de Dirac, def: { en: 'Relativistic wave equation \((i\gamma^\mu\partial_\mu - m)\psi = 0\) for spin-½ particles.', ar: 'معادلة موجية نسبية \((i\gamma^\mu\partial_\mu - m)\psi = 0\) للجسيمات ذات السبين ½.' } }
  - { en: Helicity, ar: الهيليسية, fr: Hélicité, def: { en: Projection of the spin on the direction of motion., ar: إسقاط السبين على اتجاه الحركة. } }
  - { en: Chirality, ar: الكيرالية, fr: Chiralité, def: { en: 'Lorentz-invariant handedness defined by \(\gamma^5\); equals helicity for massless particles.', ar: 'اليدوية اللامتغيرة لورنتزيًا والمعرّفة بـ \(\gamma^5\)؛ وتساوي الهيليسية للجسيمات عديمة الكتلة.' } }
  - { en: Feynman diagram, ar: مخطط فاينمان, fr: Diagramme de Feynman, def: { en: Pictorial representation of a term in the perturbative expansion of a scattering amplitude., ar: تمثيل تصويري لحدّ في النشر الاضطرابي لسعة الاستطارة. } }
  - { en: Propagator, ar: المنتشر, fr: Propagateur, def: { en: 'Factor \(\propto 1/(q^2 - m^2)\) associated with a virtual exchanged particle.', ar: 'العامل \(\propto 1/(q^2 - m^2)\) المرتبط بجسيم افتراضي متبادل.' } }
  - { en: Deep inelastic scattering, ar: الاستطارة العميقة غير المرنة, fr: Diffusion profondément inélastique, def: { en: High-momentum-transfer lepton–nucleon scattering that resolves the partons inside the nucleon., ar: استطارة لبتون-نوكليون بانتقال زخم كبير تكشف البارتونات داخل النوكليون. } }
  - { en: CKM matrix, ar: مصفوفة CKM, fr: Matrice CKM, def: { en: Unitary 3×3 matrix of quark-flavour mixing in charged weak currents., ar: مصفوفة أحادية 3×3 لخلط نكهات الكواركات في التيارات الضعيفة المشحونة. } }
  - { en: Neutrino oscillation, ar: تذبذب النيوترينو, fr: Oscillation des neutrinos, def: { en: Periodic change of neutrino flavour during propagation due to mixing and mass differences., ar: تغيّر دوري لنكهة النيوترينو أثناء انتشاره بسبب الخلط والفروق الكتلية. } }
  - { en: Weak mixing angle, ar: زاوية الخلط الضعيفة (زاوية واينبرغ), fr: Angle de mélange faible, def: { en: 'Angle \(\theta_W\) relating the electromagnetic and weak couplings, \(\sin^2\theta_W \approx 0.23\).', ar: 'الزاوية \(\theta_W\) التي تربط الاقترانين الكهرومغناطيسي والضعيف، \(\sin^2\theta_W \approx 0.23\).' } }
  - { en: Higgs mechanism, ar: آلية هيغز, fr: Mécanisme de Higgs, def: { en: Spontaneous breaking of gauge symmetry by a scalar field that gives mass to the W and Z bosons and to fermions., ar: كسر تلقائي للتناظر المعياري بحقل سلّمي يمنح الكتلة للبوزونين W وZ وللفرميونات. } }
  - { en: Higgs boson, ar: بوزون هيغز, fr: Boson de Higgs, def: { en: 'Spin-0 particle of the Higgs field, discovered in 2012 with mass about 125 GeV.', ar: 'جسيم الحقل الهيغزي ذو السبين 0، اكتُشف سنة 2012 بكتلة تقارب 125 GeV.' } }

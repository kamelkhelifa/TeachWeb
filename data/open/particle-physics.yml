exam_guide:
  format:
    en: A 90-minute mid-term and a two-hour final. Each paper opens with short conceptual questions (allowed or forbidden processes, quark content, Feynman diagrams) followed by multi-part problems on kinematics, cross-sections and decay rates, and the weak and electroweak sectors.
    ar: اختبار نصفي مدته 90 دقيقة واختبار نهائي مدته ساعتان. تبدأ كل ورقة بأسئلة مفاهيمية قصيرة (عمليات مسموحة أو ممنوعة، المحتوى الكواركي، مخططات فاينمان) تليها مسائل متعددة الأجزاء حول الحركيات، والمقاطع العرضية ومعدلات الاضمحلال، والقطاعين الضعيف والكهروضعيف.
  allowed:
    en: A scientific calculator. A data sheet with particle masses, lifetimes, coupling constants and the main Feynman rules is provided.
    ar: آلة حاسبة علمية. تُوفَّر ورقة معطيات فيها كتل الجسيمات وأعمارها وثوابت الاقتران وأهم قواعد فاينمان.
  tips:
    - en: 'For kinematics, write everything with four-vectors and evaluate the invariant \(s = (p_1+p_2)^2\) in the most convenient frame.'
      ar: 'في مسائل الحركيات، اكتب كل شيء بالمتجهات الرباعية واحسب اللامتغير \(s = (p_1+p_2)^2\) في أنسب إطار مرجعي.'
    - en: 'To decide whether a process is allowed, check in order: energy, charge, baryon number, each lepton number, then the quantities conserved only by strong/EM interactions (strangeness, parity).'
      ar: 'للحكم على إمكان حدوث عملية، تحقّق بالترتيب من: الطاقة، الشحنة، العدد الباريوني، كل عدد لبتوني، ثم المقادير التي لا تنحفظ إلا في التفاعلين القوي والكهرومغناطيسي (الغرابة، الزوجية).'
    - en: 'Use \(\hbar c = 197.3\) MeV·fm and \((\hbar c)^2 = 0.3894\) mb·GeV² to convert natural units to lengths and cross-sections.'
      ar: 'استعمل \(\hbar c = 197.3\) MeV·fm و\((\hbar c)^2 = 0.3894\) mb·GeV² للتحويل من الوحدات الطبيعية إلى الأطوال والمقاطع العرضية.'
    - en: Draw the Feynman diagram first; counting vertices tells you immediately how a rate scales with the coupling constants.
      ar: ارسم مخطط فاينمان أولًا؛ فعدّ الرؤوس يخبرك مباشرة كيف يتغير المعدل مع ثوابت الاقتران.

problems:
  - title: { en: Conservation laws, ar: قوانين الانحفاظ }
    difficulty: 1
    statement:
      en: |
        For each process, state whether it is allowed. If it is forbidden, name a conservation law it violates; if it is allowed, name the interaction responsible.
        (a) \(p \to e^+ + \pi^0\)  (b) \(\mu^- \to e^- + \gamma\)  (c) \(\Lambda \to p + \pi^-\)  (d) \(\pi^0 \to \gamma + \gamma\)  (e) \(n \to p + e^- + \nu_e\)  (f) \(\pi^- + p \to K^0 + \Lambda\)
      ar: |
        حدِّد لكل عملية ما إذا كانت مسموحة. إذا كانت ممنوعة فاذكر قانون انحفاظ تنتهكه، وإذا كانت مسموحة فاذكر التفاعل المسؤول عنها.
        (أ) \(p \to e^+ + \pi^0\)  (ب) \(\mu^- \to e^- + \gamma\)  (ج) \(\Lambda \to p + \pi^-\)  (د) \(\pi^0 \to \gamma + \gamma\)  (هـ) \(n \to p + e^- + \nu_e\)  (و) \(\pi^- + p \to K^0 + \Lambda\)
    hint:
      en: 'Λ = uds and K⁰ = d s̄. Strangeness is conserved by strong and EM interactions only.'
      ar: 'Λ = uds وK⁰ = d s̄. لا تنحفظ الغرابة إلا في التفاعلين القوي والكهرومغناطيسي.'
    solution:
      en: |
        (a) Forbidden: baryon number \(1 \to 0\) (the proton is stable, \(\tau > 10^{34}\) y).
        (b) Forbidden: electron and muon lepton numbers are separately violated (\(L_\mu: 1\to0\), \(L_e: 0\to1\)); never observed.
        (c) Allowed, <strong>weak</strong>: strangeness changes by one unit (\(S=-1 \to 0\)); hence the long lifetime \(2.6\times10^{-10}\) s.
        (d) Allowed, <strong>electromagnetic</strong> (\(\tau \approx 8.5\times10^{-17}\) s).
        (e) Forbidden: lepton number \(0 \to 2\). The correct decay emits an antineutrino, \(n\to p\,e^-\bar\nu_e\).
        (f) Allowed, <strong>strong</strong>: \(S\): \(0+0 \to (+1)+(-1) = 0\), charge \(-1+1 = 0\), baryon number \(1 \to 1\). This "associated production" of strange particles was a key clue to strangeness.
      ar: |
        (أ) ممنوعة: العدد الباريوني \(1 \to 0\) (البروتون مستقر، \(\tau > 10^{34}\) سنة).
        (ب) ممنوعة: ينتهك العددين اللبتونيين الإلكتروني والميوني كلًّا على حدة (\(L_\mu: 1\to0\)، \(L_e: 0\to1\))؛ ولم تُرصد قط.
        (ج) مسموحة، بالتفاعل <strong>الضعيف</strong>: تتغير الغرابة بوحدة واحدة (\(S=-1 \to 0\))؛ ومن هنا العمر الطويل \(2.6\times10^{-10}\) s.
        (د) مسموحة، بالتفاعل <strong>الكهرومغناطيسي</strong> (\(\tau \approx 8.5\times10^{-17}\) s).
        (هـ) ممنوعة: العدد اللبتوني \(0 \to 2\). والاضمحلال الصحيح يُطلق ضديد نيوترينو: \(n\to p\,e^-\bar\nu_e\).
        (و) مسموحة، بالتفاعل <strong>القوي</strong>: \(S\): \(0+0 \to (+1)+(-1) = 0\)، والشحنة \(-1+1 = 0\)، والعدد الباريوني \(1 \to 1\). وكان هذا «الإنتاج المترافق» للجسيمات الغريبة مفتاحًا لاكتشاف الغرابة.
  - title: { en: Antiproton production threshold, ar: عتبة إنتاج البروتون المضاد }
    difficulty: 1
    statement:
      en: |
        Antiprotons are produced in the reaction \(p + p \to p + p + p + \bar p\), with a proton beam striking protons at rest. Find the minimum (threshold) kinetic energy of the beam proton (\(m_pc^2 = 938.3\) MeV).
      ar: |
        تُنتَج البروتونات المضادة في التفاعل \(p + p \to p + p + p + \bar p\)، بقذف بروتونات ساكنة بحزمة من البروتونات. أوجد الطاقة الحركية الدنيا (العتبة) لبروتون الحزمة (\(m_pc^2 = 938.3\) MeV).
    hint:
      en: 'Compute the invariant \(s\) in the lab frame and in the centre-of-mass frame at threshold, where all final particles are at rest.'
      ar: 'احسب اللامتغير \(s\) في إطار المختبر وفي إطار مركز الكتلة عند العتبة، حيث تكون كل الجسيمات النهائية ساكنة.'
    solution:
      en: |
        In natural units, lab frame: \(s = (E+m)^2 - p^2 = 2m^2 + 2mE\). At threshold in the CM frame the four final particles are at rest: \(s = (4m)^2 = 16m^2\). Hence
        \[ 2m^2 + 2mE = 16m^2 \Rightarrow E = 7m, \qquad T = E - m = 6\,m_pc^2 = 5.63\ \text{GeV}. \]
        Only \(2m_pc^2\) of new mass is created, yet the beam needs \(6m_pc^2\) of kinetic energy, because most of it goes into the motion of the centre of mass. The Bevatron was designed for this energy, and the antiproton was discovered there in 1955. Colliders avoid this penalty.
      ar: |
        في الوحدات الطبيعية وفي إطار المختبر: \(s = (E+m)^2 - p^2 = 2m^2 + 2mE\). وعند العتبة في إطار مركز الكتلة تكون الجسيمات النهائية الأربعة ساكنة: \(s = (4m)^2 = 16m^2\). إذن
        \[ 2m^2 + 2mE = 16m^2 \Rightarrow E = 7m, \qquad T = E - m = 6\,m_pc^2 = 5.63\ \text{GeV}. \]
        لا تُنشأ إلا كتلة جديدة قدرها \(2m_pc^2\)، ومع ذلك تحتاج الحزمة إلى طاقة حركية قدرها \(6m_pc^2\)، لأن معظمها يذهب في حركة مركز الكتلة. وقد صُمّم مسرّع البيفاترون لهذه الطاقة، واكتُشف فيه البروتون المضاد سنة 1955. أما المصادمات فتتجنّب هذا الهدر.
  - title: { en: Charged-pion decay and helicity suppression, ar: اضمحلال البيون المشحون والكبت الهيليسي }
    difficulty: 3
    statement:
      en: |
        (a) A \(\pi^+\) at rest decays to \(\mu^+\nu_\mu\). Find the muon momentum and kinetic energy (\(m_\pi = 139.57\), \(m_\mu = 105.66\) MeV; neglect the neutrino mass).
        (b) The V−A theory predicts
        \[ \frac{\Gamma(\pi^+\to e^+\nu_e)}{\Gamma(\pi^+\to\mu^+\nu_\mu)} = \left(\frac{m_e}{m_\mu}\right)^2\left(\frac{m_\pi^2-m_e^2}{m_\pi^2-m_\mu^2}\right)^2. \]
        Evaluate it and explain physically why the decay to the lighter electron is so strongly suppressed.
      ar: |
        (أ) يضمحل \(\pi^+\) ساكن إلى \(\mu^+\nu_\mu\). أوجد زخم الميون وطاقته الحركية (\(m_\pi = 139.57\) و\(m_\mu = 105.66\) MeV؛ أهمل كتلة النيوترينو).
        (ب) تتنبأ نظرية V−A بأن
        \[ \frac{\Gamma(\pi^+\to e^+\nu_e)}{\Gamma(\pi^+\to\mu^+\nu_\mu)} = \left(\frac{m_e}{m_\mu}\right)^2\left(\frac{m_\pi^2-m_e^2}{m_\pi^2-m_\mu^2}\right)^2. \]
        احسب هذه النسبة، وفسّر فيزيائيًا لماذا يُكبت الاضمحلال إلى الإلكترون الأخف بهذه الشدة.
    hint:
      en: 'Two-body decay at rest: \(p^* = (m_\pi^2-m_\mu^2)/2m_\pi\). For (b), think about the spin of the pion and the helicities that the weak current imposes.'
      ar: 'الاضمحلال إلى جسيمين في السكون: \(p^* = (m_\pi^2-m_\mu^2)/2m_\pi\). وفي (ب) فكّر في سبين البيون وفي الهيليسيات التي يفرضها التيار الضعيف.'
    solution:
      en: |
        (a) Energy–momentum conservation gives
        \[ p^* = \frac{m_\pi^2-m_\mu^2}{2m_\pi} = \frac{19479.8-11164.0}{279.14} = 29.8\ \text{MeV}/c, \qquad E_\mu = \frac{m_\pi^2+m_\mu^2}{2m_\pi} = 109.8\ \text{MeV}, \]
        so \(T_\mu = E_\mu - m_\mu = 4.1\) MeV: a monoenergetic muon, the signature of a two-body decay.
        (b) \((m_e/m_\mu)^2 = (0.511/105.66)^2 = 2.34\times10^{-5}\) and \(\left(\frac{19479.8}{8315.7}\right)^2 = 5.49\), so the ratio is \(1.28\times10^{-4}\) (measured: \(1.23\times10^{-4}\), the difference being radiative corrections).
        Physics: the pion has spin 0, so the back-to-back leptons must have opposite spin projections along their common axis, i.e. the <em>same</em> helicity. The V−A current produces the neutrino left-handed, which forces the charged antilepton into a left-handed helicity state, whereas the current wants it right-handed. The amplitude for this "wrong" helicity is proportional to \(m_\ell/E_\ell\) — tiny for the electron. Phase space alone would favour the electron, yet the decay goes almost entirely to muons.
      ar: |
        (أ) يعطي انحفاظ الطاقة-الزخم
        \[ p^* = \frac{m_\pi^2-m_\mu^2}{2m_\pi} = \frac{19479.8-11164.0}{279.14} = 29.8\ \text{MeV}/c, \qquad E_\mu = \frac{m_\pi^2+m_\mu^2}{2m_\pi} = 109.8\ \text{MeV}, \]
        إذن \(T_\mu = E_\mu - m_\mu = 4.1\) MeV: ميون أحادي الطاقة، وهذه علامة الاضمحلال إلى جسيمين.
        (ب) \((m_e/m_\mu)^2 = (0.511/105.66)^2 = 2.34\times10^{-5}\) و\(\left(\frac{19479.8}{8315.7}\right)^2 = 5.49\)، فالنسبة \(1.28\times10^{-4}\) (والقيمة المقيسة \(1.23\times10^{-4}\)، ويعود الفرق إلى التصحيحات الإشعاعية).
        التفسير الفيزيائي: سبين البيون صفر، لذا يجب أن يكون للبتونين المنطلقين في اتجاهين متعاكسين إسقاطا سبين متعاكسان على محورهما المشترك، أي الهيليسية <em>نفسها</em>. ينتج تيار V−A النيوترينو يساري الهيليسية، فيُجبَر ضديد اللبتون المشحون على حالة هيليسية يسارية، بينما يفضّله التيار يمينيًا. وسعة هذه الهيليسية «الخاطئة» تتناسب مع \(m_\ell/E_\ell\)، وهي ضئيلة جدًا للإلكترون. ففضاء الطور وحده يفضّل الإلكترون، ومع ذلك يتم الاضمحلال كله تقريبًا إلى ميونات.
  - title: { en: 'Muon pairs and the R-ratio', ar: 'أزواج الميونات والنسبة R' }
    difficulty: 2
    statement:
      en: |
        At lowest order in QED, and for \(\sqrt s \gg m_\mu\),
        \[ \frac{d\sigma}{d\Omega}(e^+e^-\to\mu^+\mu^-) = \frac{\alpha^2}{4s}\left(1+\cos^2\theta\right). \]
        (a) Derive the total cross-section and evaluate it in nb at \(\sqrt s = 10\) GeV.
        (b) In the quark–parton picture, predict \(R = \sigma(e^+e^-\to\text{hadrons})/\sigma(e^+e^-\to\mu^+\mu^-)\) at this energy. What does the measured value \(R\approx 3.6\) tell us?
      ar: |
        في أدنى رتبة من الكهروديناميكا الكمومية، ومن أجل \(\sqrt s \gg m_\mu\):
        \[ \frac{d\sigma}{d\Omega}(e^+e^-\to\mu^+\mu^-) = \frac{\alpha^2}{4s}\left(1+\cos^2\theta\right). \]
        (أ) استنتج المقطع العرضي الكلي واحسبه بالنانوبارن عند \(\sqrt s = 10\) GeV.
        (ب) في صورة الكواركات-البارتونات، تنبّأ بقيمة \(R = \sigma(e^+e^-\to\text{hadrons})/\sigma(e^+e^-\to\mu^+\mu^-)\) عند هذه الطاقة. ماذا تخبرنا القيمة المقيسة \(R\approx 3.6\)؟
    hint:
      en: '\(\int(1+\cos^2\theta)\,d\Omega = 16\pi/3\); \((\hbar c)^2 = 0.3894\ \text{mb·GeV}^2\). Quark pairs are produced like muon pairs, weighted by \(Q_q^2\) and by the number of colours.'
      ar: '\(\int(1+\cos^2\theta)\,d\Omega = 16\pi/3\)؛ و\((\hbar c)^2 = 0.3894\ \text{mb·GeV}^2\). تُنتَج أزواج الكواركات كأزواج الميونات، مع ترجيح بـ \(Q_q^2\) وبعدد الألوان.'
    solution:
      en: |
        (a)
        \[ \sigma = \frac{\alpha^2}{4s}\cdot\frac{16\pi}{3} = \frac{4\pi\alpha^2}{3s} = \frac{86.8\ \text{nb·GeV}^2}{s}. \]
        At \(s = 100\ \text{GeV}^2\): \(\sigma \approx 0.87\) nb.
        (b) Above the \(b\bar b\) threshold and below \(t\bar t\), five quark flavours are accessible:
        \[ R = N_c\sum_q Q_q^2 = 3\left(\tfrac49+\tfrac19+\tfrac19+\tfrac49+\tfrac19\right) = 3\times\frac{11}{9} = \frac{11}{3} \approx 3.67. \]
        Without colour one would expect \(11/9 \approx 1.2\). The data (\(R\approx3.6\), slightly above \(11/3\) because of QCD corrections \(\propto 1+\alpha_s/\pi\)) is direct evidence that quarks come in three colours and have fractional charges.
      ar: |
        (أ)
        \[ \sigma = \frac{\alpha^2}{4s}\cdot\frac{16\pi}{3} = \frac{4\pi\alpha^2}{3s} = \frac{86.8\ \text{nb·GeV}^2}{s}. \]
        عند \(s = 100\ \text{GeV}^2\): \(\sigma \approx 0.87\) nb.
        (ب) فوق عتبة \(b\bar b\) ودون عتبة \(t\bar t\) تكون خمس نكهات من الكواركات متاحة:
        \[ R = N_c\sum_q Q_q^2 = 3\left(\tfrac49+\tfrac19+\tfrac19+\tfrac49+\tfrac19\right) = 3\times\frac{11}{9} = \frac{11}{3} \approx 3.67. \]
        لولا اللون لتوقّعنا \(11/9 \approx 1.2\). والمعطيات التجريبية (\(R\approx3.6\)، أعلى قليلًا من \(11/3\) بسبب تصحيحات الكروموديناميكا الكمومية \(\propto 1+\alpha_s/\pi\)) دليل مباشر على أن للكواركات ثلاثة ألوان وشحنات كسرية.
  - title: { en: Designing a neutrino-oscillation experiment, ar: تصميم تجربة لتذبذب النيوترينو }
    difficulty: 2
    statement:
      en: |
        In the two-flavour approximation,
        \[ P(\nu_\mu\to\nu_\tau) = \sin^22\theta\,\sin^2\!\left(\frac{1.27\,\Delta m^2[\text{eV}^2]\,L[\text{km}]}{E[\text{GeV}]}\right). \]
        (a) Show where the factor 1.27 comes from, starting from the phase \(\Delta m^2c^4L/(4\hbar cE)\).
        (b) With \(\Delta m^2 = 2.5\times10^{-3}\ \text{eV}^2\), \(\sin^22\theta \approx 1\) and \(E = 1\) GeV, at what baseline is the first oscillation maximum?
        (c) Explain why atmospheric \(\nu_\mu\) coming from below (through the Earth) are depleted while those from above are not.
      ar: |
        في تقريب النكهتين:
        \[ P(\nu_\mu\to\nu_\tau) = \sin^22\theta\,\sin^2\!\left(\frac{1.27\,\Delta m^2[\text{eV}^2]\,L[\text{km}]}{E[\text{GeV}]}\right). \]
        (أ) بيّن من أين يأتي العامل 1.27 انطلاقًا من الطور \(\Delta m^2c^4L/(4\hbar cE)\).
        (ب) مع \(\Delta m^2 = 2.5\times10^{-3}\ \text{eV}^2\) و\(\sin^22\theta \approx 1\) و\(E = 1\) GeV، عند أي مسافة يقع أول حدّ أعظمي للتذبذب؟
        (ج) فسّر لماذا تنقص نيوترينوات \(\nu_\mu\) الجوية الآتية من الأسفل (عبر الأرض) بينما لا تنقص الآتية من الأعلى.
    hint:
      en: '\(\hbar c = 1.973\times10^{-7}\ \text{eV·m}\). The first maximum is where the argument of the sine equals \(\pi/2\).'
      ar: '\(\hbar c = 1.973\times10^{-7}\ \text{eV·m}\). يقع أول حدّ أعظمي حيث يساوي متغير الجيب \(\pi/2\).'
    solution:
      en: |
        (a) With \(\Delta m^2c^4\) in eV², \(L\) in km and \(E\) in GeV:
        \[ \frac{\Delta m^2c^4\,L}{4\hbar c\,E} = \frac{(\text{eV}^2)(10^3\ \text{m})}{4(1.973\times10^{-7}\ \text{eV·m})(10^9\ \text{eV})} = \frac{10^3}{789.3} = 1.267. \]
        (b) \(1.27\,\Delta m^2L/E = \pi/2 \Rightarrow L = \dfrac{1.571}{1.27\times2.5\times10^{-3}}\ \text{km} \approx 495\ \text{km}\). Long-baseline experiments (a few hundred km for GeV beams) are built around this condition.
        (c) Downward-going neutrinos travel \(L\sim 15\) km, so the phase is \(\ll 1\) and no oscillation occurs. Upward-going ones cross the Earth (\(L\sim 10^4\) km): the phase is large, the oscillations average out to \(P \approx \frac12\sin^22\theta \approx 0.5\), and about half of the \(\nu_\mu\) have turned into \(\nu_\tau\). This up–down asymmetry was the 1998 discovery of neutrino oscillations, proving that neutrinos have mass.
      ar: |
        (أ) مع \(\Delta m^2c^4\) بـ eV² و\(L\) بالكيلومتر و\(E\) بـ GeV:
        \[ \frac{\Delta m^2c^4\,L}{4\hbar c\,E} = \frac{(\text{eV}^2)(10^3\ \text{m})}{4(1.973\times10^{-7}\ \text{eV·m})(10^9\ \text{eV})} = \frac{10^3}{789.3} = 1.267. \]
        (ب) \(1.27\,\Delta m^2L/E = \pi/2 \Rightarrow L = \dfrac{1.571}{1.27\times2.5\times10^{-3}}\ \text{km} \approx 495\ \text{km}\). وعلى هذا الشرط تُبنى تجارب المسافة الطويلة (بضع مئات من الكيلومترات لحزم من رتبة GeV).
        (ج) تقطع النيوترينوات النازلة \(L\sim 15\) km، فيكون الطور \(\ll 1\) ولا يحدث تذبذب. أما الصاعدة فتعبر الأرض (\(L\sim 10^4\) km): الطور كبير، ومتوسط التذبذبات \(P \approx \frac12\sin^22\theta \approx 0.5\)، فيتحول نحو نصف \(\nu_\mu\) إلى \(\nu_\tau\). وكان هذا اللاتناظر بين الأعلى والأسفل هو اكتشاف تذبذب النيوترينو سنة 1998، الذي أثبت أن للنيوترينوات كتلة.
  - title: { en: Predicting the W and Z masses, ar: التنبؤ بكتلتي W وZ }
    difficulty: 3
    statement:
      en: |
        In the electroweak theory at tree level,
        \[ \frac{G_F}{\sqrt2} = \frac{g_W^2}{8m_W^2}, \qquad e = g_W\sin\theta_W, \qquad m_Z = \frac{m_W}{\cos\theta_W}. \]
        (a) Show that \(m_W = \left(\dfrac{\pi\alpha}{\sqrt2\,G_F}\right)^{1/2}\dfrac{1}{\sin\theta_W}\).
        (b) Evaluate \(m_W\) and \(m_Z\) with \(G_F = 1.166\times10^{-5}\ \text{GeV}^{-2}\), \(\sin^2\theta_W = 0.231\), first with \(\alpha = 1/137\) and then with \(\alpha(m_Z) = 1/128\). Compare with the measured \(m_W = 80.4\) GeV and \(m_Z = 91.2\) GeV.
      ar: |
        في النظرية الكهروضعيفة وفي أدنى رتبة:
        \[ \frac{G_F}{\sqrt2} = \frac{g_W^2}{8m_W^2}, \qquad e = g_W\sin\theta_W, \qquad m_Z = \frac{m_W}{\cos\theta_W}. \]
        (أ) بيّن أن \(m_W = \left(\dfrac{\pi\alpha}{\sqrt2\,G_F}\right)^{1/2}\dfrac{1}{\sin\theta_W}\).
        (ب) احسب \(m_W\) و\(m_Z\) مع \(G_F = 1.166\times10^{-5}\ \text{GeV}^{-2}\) و\(\sin^2\theta_W = 0.231\)، أولًا باستعمال \(\alpha = 1/137\) ثم باستعمال \(\alpha(m_Z) = 1/128\). قارن بالقيمتين المقيستين \(m_W = 80.4\) GeV و\(m_Z = 91.2\) GeV.
    hint:
      en: 'In natural (Heaviside–Lorentz) units \(e^2 = 4\pi\alpha\).'
      ar: 'في الوحدات الطبيعية (هيفيسايد-لورنتز) \(e^2 = 4\pi\alpha\).'
    solution:
      en: |
        (a) \(g_W^2 = e^2/\sin^2\theta_W = 4\pi\alpha/\sin^2\theta_W\), so
        \[ m_W^2 = \frac{\sqrt2\,g_W^2}{8G_F} = \frac{\sqrt2\cdot4\pi\alpha}{8G_F\sin^2\theta_W} = \frac{\pi\alpha}{\sqrt2\,G_F\sin^2\theta_W}. \]
        (b) With \(\alpha = 1/137\): \(\left(\pi\alpha/\sqrt2G_F\right)^{1/2} = (1390\ \text{GeV}^2)^{1/2} = 37.3\) GeV, so \(m_W = 37.3/0.4806 = 77.6\) GeV and \(m_Z = 77.6/0.877 = 88.5\) GeV.
        With \(\alpha(m_Z) = 1/128\): \((1488\ \text{GeV}^2)^{1/2} = 38.6\) GeV, giving \(m_W \approx 80.3\) GeV and \(m_Z \approx 91.5\) GeV, in good agreement with experiment.
        The theory predicted these masses before the W and Z were discovered (1983); the remaining small differences come from loop corrections, which are sensitive to the top-quark and Higgs masses.
      ar: |
        (أ) \(g_W^2 = e^2/\sin^2\theta_W = 4\pi\alpha/\sin^2\theta_W\)، إذن
        \[ m_W^2 = \frac{\sqrt2\,g_W^2}{8G_F} = \frac{\sqrt2\cdot4\pi\alpha}{8G_F\sin^2\theta_W} = \frac{\pi\alpha}{\sqrt2\,G_F\sin^2\theta_W}. \]
        (ب) مع \(\alpha = 1/137\): \(\left(\pi\alpha/\sqrt2G_F\right)^{1/2} = (1390\ \text{GeV}^2)^{1/2} = 37.3\) GeV، إذن \(m_W = 37.3/0.4806 = 77.6\) GeV و\(m_Z = 77.6/0.877 = 88.5\) GeV.
        ومع \(\alpha(m_Z) = 1/128\): \((1488\ \text{GeV}^2)^{1/2} = 38.6\) GeV، فنحصل على \(m_W \approx 80.3\) GeV و\(m_Z \approx 91.5\) GeV، في توافق جيد مع التجربة.
        لقد تنبأت النظرية بهاتين الكتلتين قبل اكتشاف W وZ (1983)؛ وتعود الفروق الصغيرة المتبقية إلى تصحيحات الحلقات، وهي حساسة لكتلتي كوارك القمة وبوزون هيغز.

quizzes:
  - title: { en: 'Kinematics, interactions and conservation laws', ar: 'الحركيات والتفاعلات وقوانين الانحفاظ' }
    questions:
      - q:
          en: 'Which quantity has the same value in every inertial frame?'
          ar: 'أي مقدار له القيمة نفسها في كل الأطر العطالية؟'
        options:
          - { en: The energy E, ar: الطاقة E }
          - { en: The momentum p, ar: الزخم p }
          - '\(E^2 - p^2c^2\)'
          - { en: The speed v, ar: السرعة v }
        answer: 2
        explain:
          en: '\(E^2 - p^2c^2 = m^2c^4\) is the square of the four-momentum, a Lorentz invariant. For a system of particles it defines the invariant mass \(\sqrt s\).'
          ar: '\(E^2 - p^2c^2 = m^2c^4\) هو مربع الزخم الرباعي، وهو لامتغير لورنتزي. وبالنسبة لجملة جسيمات يعرّف الكتلة اللامتغيرة \(\sqrt s\).'
      - q:
          en: 'What is the value of \(\hbar c\), the key conversion factor of natural units?'
          ar: 'ما قيمة \(\hbar c\)، عامل التحويل الأساسي في الوحدات الطبيعية؟'
        options: ['197.3 MeV·fm', '931.5 MeV·fm', '0.511 MeV·fm', '1240 MeV·fm']
        answer: 0
        explain:
          en: '\(\hbar c = 197.3\) MeV·fm, so \(1\ \text{GeV}^{-1} = 0.197\) fm. (1240 is \(hc\) in eV·nm; 931.5 MeV is the atomic mass unit.)'
          ar: '\(\hbar c = 197.3\) MeV·fm، إذن \(1\ \text{GeV}^{-1} = 0.197\) fm. (أما 1240 فهي \(hc\) بوحدة eV·nm، و931.5 MeV هي وحدة الكتلة الذرية.)'
      - q:
          en: 'Which quantity is conserved by the strong and electromagnetic interactions but not by the weak interaction?'
          ar: 'أي مقدار ينحفظ في التفاعلين القوي والكهرومغناطيسي ولا ينحفظ في التفاعل الضعيف؟'
        options:
          - { en: Electric charge, ar: الشحنة الكهربائية }
          - { en: Baryon number, ar: العدد الباريوني }
          - { en: Total energy, ar: الطاقة الكلية }
          - { en: Strangeness, ar: الغرابة }
        answer: 3
        explain:
          en: 'Only the charged weak current changes quark flavour (e.g. \(s\to u\)). Charge, baryon number and energy are conserved by all interactions.'
          ar: 'التيار الضعيف المشحون وحده يغيّر نكهة الكوارك (مثل \(s\to u\)). أما الشحنة والعدد الباريوني والطاقة فتنحفظ في كل التفاعلات.'
      - q:
          en: 'The charged pion lives \(2.6\times10^{-8}\) s, the \(\pi^0\) about \(10^{-16}\) s and the \(\Delta\) resonance about \(10^{-23}\) s. These lifetimes indicate decays by, respectively:'
          ar: 'يعيش البيون المشحون \(2.6\times10^{-8}\) s، و\(\pi^0\) نحو \(10^{-16}\) s، والطنين \(\Delta\) نحو \(10^{-23}\) s. تدل هذه الأعمار على اضمحلالات بالتفاعلات، على الترتيب:'
        options:
          - { en: 'Strong, EM, weak', ar: 'القوي، الكهرومغناطيسي، الضعيف' }
          - { en: 'Weak, EM, strong', ar: 'الضعيف، الكهرومغناطيسي، القوي' }
          - { en: 'EM, weak, strong', ar: 'الكهرومغناطيسي، الضعيف، القوي' }
          - { en: 'Weak, strong, EM', ar: 'الضعيف، القوي، الكهرومغناطيسي' }
        answer: 1
        explain:
          en: 'The stronger the interaction, the shorter the lifetime: \(\pi^\pm\to\mu\nu\) is weak, \(\pi^0\to\gamma\gamma\) is electromagnetic and \(\Delta\to N\pi\) is strong.'
          ar: 'كلما كان التفاعل أقوى كان العمر أقصر: \(\pi^\pm\to\mu\nu\) ضعيف، و\(\pi^0\to\gamma\gamma\) كهرومغناطيسي، و\(\Delta\to N\pi\) قوي.'
      - q:
          en: 'What is the intrinsic parity of a quark–antiquark meson with orbital angular momentum \(L = 0\) (e.g. the pion)?'
          ar: 'ما الزوجية الذاتية لميزون مكوّن من كوارك وكوارك مضاد بزخم زاوي مداري \(L = 0\) (مثل البيون)؟'
        options: ['\(+1\)', '\(-1\)', '\(0\)', '\(\pm i\)']
        answer: 1
        explain:
          en: 'A fermion and its antifermion have opposite intrinsic parities, so \(P = (-1)^{L+1} = -1\) for \(L = 0\): pseudoscalar (\(J^P = 0^-\)) and vector (\(1^-\)) mesons.'
          ar: 'للفرميون ولضديده زوجيتان ذاتيتان متعاكستان، إذن \(P = (-1)^{L+1} = -1\) من أجل \(L = 0\): ميزونات شبه سلّمية (\(J^P = 0^-\)) ومتجهة (\(1^-\)).'
  - title: { en: Quark model and QCD, ar: نموذج الكواركات والكروموديناميكا الكمومية }
    questions:
      - q:
          en: 'Which hadron has the quark content \(uds\)?'
          ar: 'أي هادرون محتواه الكواركي \(uds\)؟'
        options:
          - '\(p\)'
          - '\(\Lambda^0\)'
          - '\(K^+\)'
          - '\(\Omega^-\)'
        answer: 1
        explain:
          en: '\(\Lambda^0 = uds\) (as is \(\Sigma^0\), with a different isospin). The proton is \(uud\), \(K^+ = u\bar s\) and \(\Omega^- = sss\).'
          ar: '\(\Lambda^0 = uds\) (وكذلك \(\Sigma^0\) بإيزوسبين مختلف). البروتون \(uud\)، و\(K^+ = u\bar s\)، و\(\Omega^- = sss\).'
      - q:
          en: 'Why was colour originally introduced?'
          ar: 'لماذا أُدخل اللون في الأصل؟'
        options:
          - { en: To explain the masses of quarks, ar: لتفسير كتل الكواركات }
          - { en: To explain the electric charge of hadrons, ar: لتفسير الشحنة الكهربائية للهادرونات }
          - { en: To explain beta decay, ar: لتفسير اضمحلال بيتا }
          - { en: 'To reconcile states such as Δ⁺⁺ (uuu, all spins aligned) with the Pauli principle', ar: 'للتوفيق بين حالات مثل Δ⁺⁺ (uuu، بسبينات متوازية) ومبدأ باولي' }
        answer: 3
        explain:
          en: 'The Δ⁺⁺ flavour–spin–space wavefunction is symmetric, which is forbidden for fermions. An antisymmetric colour wavefunction (a colour singlet) restores overall antisymmetry; colour later became the charge of QCD.'
          ar: 'الدالة الموجية لـ Δ⁺⁺ في النكهة والسبين والمكان متناظرة، وهذا ممنوع للفرميونات. ودالة موجية لونية ضد متناظرة (أحادية لونية) تعيد ضد التناظر الكلي؛ ثم أصبح اللون شحنة الكروموديناميكا الكمومية.'
      - q:
          en: 'How many gluons are there in QCD?'
          ar: 'كم عدد الغلوونات في الكروموديناميكا الكمومية؟'
        options: ['1', '3', '8', '9']
        answer: 2
        explain:
          en: 'Gluons belong to the adjoint representation of SU(3), of dimension \(3^2-1 = 8\). The ninth, colour-singlet combination does not exist.'
          ar: 'تنتمي الغلوونات إلى التمثيل المرافق للزمرة SU(3)، وبعده \(3^2-1 = 8\). أما التركيبة التاسعة الأحادية اللون فغير موجودة.'
      - q:
          en: 'Asymptotic freedom means that the strong coupling \(\alpha_s(Q^2)\):'
          ar: 'تعني الحرية التقاربية أن ثابت الاقتران القوي \(\alpha_s(Q^2)\):'
        options:
          - { en: Decreases at high momentum transfer (short distances), ar: يتناقص عند انتقال الزخم الكبير (المسافات القصيرة) }
          - { en: Increases at high momentum transfer, ar: يزداد عند انتقال الزخم الكبير }
          - { en: Is constant, ar: ثابت }
          - { en: Vanishes for heavy quarks, ar: ينعدم للكواركات الثقيلة }
        answer: 0
        explain:
          en: 'Gluon self-interaction makes \(\alpha_s\) fall logarithmically with \(Q^2\) (about 0.12 at \(m_Z\)). Quarks behave as nearly free at short distances, while at long distances the coupling grows and confines them.'
          ar: 'يجعل التفاعل الذاتي للغلوونات \(\alpha_s\) يتناقص لوغاريتميًا مع \(Q^2\) (نحو 0.12 عند \(m_Z\)). فتتصرف الكواركات كأنها شبه حرة على المسافات القصيرة، بينما يزداد الاقتران على المسافات الطويلة فيحصرها.'
      - q:
          en: 'In deep inelastic electron–proton scattering, Bjorken scaling (structure functions nearly independent of \(Q^2\)) shows that:'
          ar: 'في الاستطارة العميقة غير المرنة إلكترون-بروتون، يُظهر تدرّج بيوركن (عدم تعلّق دوال البنية تقريبًا بـ \(Q^2\)) أن:'
        options:
          - { en: The proton is a uniform sphere of charge, ar: البروتون كرة مشحونة منتظمة }
          - { en: The electron has internal structure, ar: للإلكترون بنية داخلية }
          - { en: The proton contains point-like constituents, ar: البروتون يحتوي على مكوّنات نقطية }
          - { en: The photon is massive, ar: للفوتون كتلة }
        answer: 2
        explain:
          en: 'Scattering off point-like partons introduces no length scale, so the structure functions depend only on the dimensionless \(x\). This was the first dynamical evidence for quarks (SLAC, late 1960s).'
          ar: 'الاستطارة على بارتونات نقطية لا تُدخل أي سلّم طولي، فلا تتعلق دوال البنية إلا بالمتغير اللابعدي \(x\). وكان هذا أول دليل ديناميكي على وجود الكواركات (SLAC، أواخر ستينيات القرن العشرين).'
  - title: { en: Dirac equation and QED, ar: معادلة ديراك والكهروديناميكا الكمومية }
    questions:
      - q:
          en: 'In four space-time dimensions, the smallest matrices satisfying \(\{\gamma^\mu,\gamma^\nu\} = 2g^{\mu\nu}\) are:'
          ar: 'في زمكان رباعي الأبعاد، أصغر مصفوفات تحقق \(\{\gamma^\mu,\gamma^\nu\} = 2g^{\mu\nu}\) هي:'
        options: ['2×2', '3×3', '4×4', '8×8']
        answer: 2
        explain:
          en: 'Four mutually anticommuting matrices cannot be found in 2×2 (only three Pauli matrices anticommute). Hence Dirac spinors have four components: two spin states each for particle and antiparticle.'
          ar: 'لا يمكن إيجاد أربع مصفوفات متضادة التبادل مثنى مثنى بأبعاد 2×2 (فمصفوفات باولي الثلاث وحدها متضادة التبادل). ولذلك لسبينورات ديراك أربع مركّبات: حالتا سبين لكل من الجسيم والجسيم المضاد.'
      - q:
          en: 'In the Feynman–Stückelberg interpretation, negative-energy solutions of the Dirac equation describe:'
          ar: 'في تفسير فاينمان-شتوكلبرغ، تصف حلول معادلة ديراك ذات الطاقة السالبة:'
        options:
          - { en: Unphysical states to be discarded, ar: حالات غير فيزيائية ينبغي إهمالها }
          - { en: Tachyons, ar: تاكيونات (جسيمات أسرع من الضوء) }
          - { en: Bound states, ar: حالات مقيّدة }
          - { en: Positive-energy antiparticles propagating forward in time, ar: جسيمات مضادة ذات طاقة موجبة تنتشر إلى الأمام في الزمن }
        answer: 3
        explain:
          en: 'A negative-energy particle travelling backwards in time is equivalent to a positive-energy antiparticle travelling forwards. This removes the need for the Dirac sea and underlies the Feynman diagrams.'
          ar: 'جسيم ذو طاقة سالبة يسير إلى الخلف في الزمن يكافئ جسيمًا مضادًا ذا طاقة موجبة يسير إلى الأمام. وهذا يغني عن بحر ديراك، وعليه تقوم مخططات فاينمان.'
      - q:
          en: 'The lowest-order cross-section for \(e^+e^-\to\mu^+\mu^-\) scales with the fine-structure constant as:'
          ar: 'يتناسب المقطع العرضي في أدنى رتبة لـ \(e^+e^-\to\mu^+\mu^-\) مع ثابت البنية الدقيقة كـ:'
        options: ['\(\alpha\)', '\(\alpha^2\)', '\(\alpha^4\)', '\(\sqrt\alpha\)']
        answer: 1
        explain:
          en: 'The diagram has two vertices, each with factor \(e \propto \sqrt\alpha\); the amplitude is \(\propto \alpha\) and the cross-section, its square, \(\propto \alpha^2\).'
          ar: 'للمخطط رأسان، لكل منهما العامل \(e \propto \sqrt\alpha\)؛ فالسعة \(\propto \alpha\)، والمقطع العرضي، وهو مربعها، \(\propto \alpha^2\).'
      - q:
          en: 'The angular distribution of \(e^+e^-\to\mu^+\mu^-\) via a single photon at high energy is proportional to:'
          ar: 'يتناسب التوزيع الزاوي لـ \(e^+e^-\to\mu^+\mu^-\) عبر فوتون واحد عند الطاقات العالية مع:'
        options: ['\(1\)', '\(\sin^2\theta\)', '\(1+\cos^2\theta\)', '\(1/\sin^4(\theta/2)\)']
        answer: 2
        explain:
          en: 'Helicity conservation at the vector vertices allows only two spin configurations, with amplitudes \(\propto (1\pm\cos\theta)\); adding their squares gives \(1+\cos^2\theta\). (\(1/\sin^4(\theta/2)\) is Rutherford scattering.)'
          ar: 'انحفاظ الهيليسية عند الرؤوس المتجهة لا يسمح إلا بتشكيلتين للسبين، سعتاهما \(\propto (1\pm\cos\theta)\)؛ وجمع مربعيهما يعطي \(1+\cos^2\theta\). (أما \(1/\sin^4(\theta/2)\) فهي استطارة رذرفورد.)'
      - q:
          en: 'For which particles are helicity and chirality eigenstates the same?'
          ar: 'بالنسبة لأي جسيمات تتطابق الحالات الذاتية للهيليسية والكيرالية؟'
        options:
          - { en: For massless (or ultra-relativistic) particles, ar: للجسيمات عديمة الكتلة (أو فائقة النسبية) }
          - { en: For particles at rest, ar: للجسيمات الساكنة }
          - { en: For all particles, ar: لكل الجسيمات }
          - { en: Only for bosons, ar: للبوزونات فقط }
        answer: 0
        explain:
          en: 'Helicity is frame-dependent for massive particles, while chirality is Lorentz invariant. They coincide only when \(E \gg m\); the mismatch is of order \(m/E\), as in pion-decay helicity suppression.'
          ar: 'الهيليسية تتعلق بالإطار المرجعي للجسيمات ذات الكتلة، بينما الكيرالية لامتغيرة لورنتزيًا. ولا تتطابقان إلا عندما \(E \gg m\)؛ والفرق من رتبة \(m/E\)، كما في الكبت الهيليسي لاضمحلال البيون.'
  - title: { en: 'Weak, electroweak and neutrino physics', ar: 'الفيزياء الضعيفة والكهروضعيفة وفيزياء النيوترينو' }
    questions:
      - q:
          en: 'The charged-current weak interaction couples to:'
          ar: 'يقترن التفاعل الضعيف ذو التيار المشحون بـ:'
        options:
          - { en: Left-handed chiral particles and right-handed chiral antiparticles only, ar: الجسيمات ذات الكيرالية اليسارية والجسيمات المضادة ذات الكيرالية اليمينية فقط }
          - { en: Right-handed particles only, ar: الجسيمات اليمينية فقط }
          - { en: Both chiralities equally, ar: الكيراليتين بالتساوي }
          - { en: Neutral particles only, ar: الجسيمات المتعادلة فقط }
        answer: 0
        explain:
          en: 'The V−A vertex contains the projector \(\frac12(1-\gamma^5)\), so parity is maximally violated (Wu experiment, 1957).'
          ar: 'يحتوي الرأس V−A على المسقِط \(\frac12(1-\gamma^5)\)، ولذلك تُنتهك الزوجية انتهاكًا أعظميًا (تجربة وو، 1957).'
      - q:
          en: 'What are the approximate masses of the W and Z bosons?'
          ar: 'ما القيمتان التقريبيتان لكتلتي البوزونين W وZ؟'
        options: ['80.4 and 91.2 GeV', '91.2 and 80.4 GeV', '125 and 173 GeV', '0 and 91.2 GeV']
        answer: 0
        explain:
          en: '\(m_W = 80.4\) GeV and \(m_Z = 91.2\) GeV, with \(m_W/m_Z = \cos\theta_W\). The Higgs (125 GeV) and the top quark (173 GeV) are heavier.'
          ar: '\(m_W = 80.4\) GeV و\(m_Z = 91.2\) GeV، مع \(m_W/m_Z = \cos\theta_W\). أما هيغز (125 GeV) وكوارك القمة (173 GeV) فأثقل منهما.'
      - q:
          en: 'The CKM matrix describes:'
          ar: 'تصف مصفوفة CKM:'
        options:
          - { en: Neutrino mixing, ar: خلط النيوترينوات }
          - { en: The mixing of quark flavours in charged-current weak interactions, ar: خلط نكهات الكواركات في التفاعلات الضعيفة ذات التيار المشحون }
          - { en: The colour charges of gluons, ar: الشحنات اللونية للغلوونات }
          - { en: The masses of the W and Z, ar: كتلتي W وZ }
        answer: 1
        explain:
          en: 'The weak eigenstates \(d'',s'',b''\) are unitary combinations of the mass eigenstates. The complex phase of this 3×3 matrix is the Standard-Model source of CP violation in quarks. Neutrino mixing is described by the PMNS matrix.'
          ar: 'الحالات الذاتية الضعيفة \(d'',s'',b''\) تراكيب أحادية (واحدية) لحالات الكتلة الذاتية. والطور المركّب لهذه المصفوفة 3×3 هو مصدر انتهاك CP في قطاع الكواركات ضمن النموذج القياسي. أما خلط النيوترينوات فتصفه مصفوفة PMNS.'
      - q:
          en: 'Neutrino oscillations require that:'
          ar: 'تتطلب تذبذبات النيوترينو أن:'
        options:
          - { en: Neutrinos are massless, ar: تكون النيوترينوات عديمة الكتلة }
          - { en: Lepton number is violated by two units, ar: يُنتهك العدد اللبتوني بوحدتين }
          - { en: Neutrinos are their own antiparticles, ar: تكون النيوترينوات مضادات لنفسها }
          - { en: 'The flavour states differ from the mass states, which have different masses', ar: 'تختلف حالات النكهة عن حالات الكتلة، وأن تكون لهذه الأخيرة كتل مختلفة' }
        answer: 3
        explain:
          en: 'The oscillation phase is proportional to \(\Delta m^2L/E\): without mixing (\(\theta\neq0\)) and non-zero mass differences there is no oscillation. Whether neutrinos are Majorana particles is a separate, still open question.'
          ar: 'طور التذبذب يتناسب مع \(\Delta m^2L/E\): فلا تذبذب دون خلط (\(\theta\neq0\)) ودون فروق كتلية غير معدومة. أما كون النيوترينوات جسيمات مايورانا فسؤال مستقل لا يزال مفتوحًا.'
      - q:
          en: 'In the Standard Model, the Higgs mechanism:'
          ar: 'في النموذج القياسي، آلية هيغز:'
        options:
          - { en: Gives mass to the photon, ar: تمنح الفوتون كتلة }
          - { en: Explains the mass of the proton, ar: تفسّر كتلة البروتون }
          - { en: 'Gives mass to the W and Z bosons and, through Yukawa couplings, to the charged fermions', ar: 'تمنح البوزونين W وZ كتلة، وتمنح الفرميونات المشحونة كتلتها عبر اقترانات يوكاوا' }
          - { en: Explains dark matter, ar: تفسّر المادة المظلمة }
        answer: 2
        explain:
          en: 'Spontaneous breaking of SU(2)×U(1) gives mass to W and Z while the photon stays massless. Most of the proton mass, however, comes from QCD binding energy, not from the Higgs. The Higgs boson was discovered at the LHC in 2012 (125 GeV).'
          ar: 'يمنح الكسر التلقائي للتناظر SU(2)×U(1) البوزونين W وZ كتلة بينما يبقى الفوتون عديم الكتلة. أما معظم كتلة البروتون فمصدره طاقة الربط في الكروموديناميكا الكمومية لا آلية هيغز. واكتُشف بوزون هيغز في مصادم LHC سنة 2012 (125 GeV).'

textbooks:
  required:

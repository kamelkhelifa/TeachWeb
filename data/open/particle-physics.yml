title: { en: Particle Physics, ar: فيزياء الجسيمات }
tagline:
  en: Quarks, leptons and the forces between them — the Standard Model from Dirac to Higgs.
  ar: الكواركات واللبتونات والقوى بينها — النموذج القياسي من ديراك إلى هيغز.
area: modern
level: 4
credits: 3
hours: { lecture: 3, tutorial: 1, lab: 0 }
weeks: 14
instruction: [en]
prerequisites: [quantum-mechanics-2]
prerequisite_note:
  en: 'Quantum mechanics (angular momentum, spin, perturbation theory, Fermi''s golden rule), special relativity with four-vectors, and classical electromagnetism (Maxwell''s equations, potentials).'
  ar: 'ميكانيكا الكم (الزخم الزاوي، السبين، نظرية الاضطراب، قاعدة فيرمي الذهبية)، والنسبية الخاصة بالمتجهات الرباعية، والكهرومغناطيسية الكلاسيكية (معادلات ماكسويل، الكمونات).'
sims: [particles]
sources:
  - https://khelifak.wordpress.com/studying/teaching-2/usthb/particle-physics/
notes: >
  The source page is very thin: a one-session-per-week, mostly qualitative introduction (introduction,
  interactions, conservation laws; partly an English/LaTeX course) with a 100% final exam. Only the
  final and resit papers + solutions (2013-2014) are real material and are preserved; the two marks
  files (student grades, .xls/.pdf) were not linked, nor the internal 'Physicist's Toolkit' post.
  Everything else - description, 14-week Master-level syllabus (Thomson 'Modern Particle Physics' /
  Griffiths 'Elementary Particles'), hours, CLOs, assessment, quizzes, worked problems, glossary,
  online resources (PDG, CERN Open Data, Particle Adventure: well-known URLs, not from the source) -
  is reconstructed. Note the preserved exams match the older qualitative version, so they are easier
  than the reconstructed syllabus.

description:
  en: |
    <p>This Master-level course is an introduction to the Standard Model of particle physics, the theory that describes all known elementary particles — six quarks, six leptons, the gauge bosons and the Higgs boson — and three of the four fundamental interactions. It combines a clear qualitative picture of the subatomic world (particles, forces, conservation laws, the quark model) with the quantitative tools used in modern research: relativistic kinematics, decay rates and cross-sections, the Dirac equation and Feynman diagrams.</p>
    <p>After the foundations, the course develops quantum electrodynamics through the calculation of \(e^+e^-\to\mu^+\mu^-\), probes the structure of the proton with elastic and deep-inelastic scattering, and introduces quantum chromodynamics, colour confinement and asymptotic freedom. The second half is devoted to the weak interaction (parity violation, the V−A structure, the CKM matrix), neutrino oscillations, electroweak unification and the Higgs mechanism, ending with the experimental tests of the Standard Model and the open questions beyond it.</p>
    <p>Lectures are complemented by tutorials, problem sets based on real data from the Particle Data Group, and a small project on a landmark measurement. The interactive Standard Model table on this page can be used throughout to explore particle properties.</p>
  ar: |
    <p>هذا المقرر، على مستوى الماستر، مدخل إلى النموذج القياسي لفيزياء الجسيمات، وهو النظرية التي تصف كل الجسيمات الأولية المعروفة — الكواركات الستة، واللبتونات الستة، والبوزونات المعيارية، وبوزون هيغز — وثلاثًا من التفاعلات الأساسية الأربعة. ويجمع المقرر بين صورة نوعية واضحة للعالم دون الذري (الجسيمات، القوى، قوانين الانحفاظ، نموذج الكواركات) والأدوات الكمية المستعملة في البحث الحديث: الحركيات النسبية، ومعدلات الاضمحلال والمقاطع العرضية، ومعادلة ديراك، ومخططات فاينمان.</p>
    <p>بعد الأسس، يطوّر المقرر الكهروديناميكا الكمومية من خلال حساب \(e^+e^-\to\mu^+\mu^-\)، ويستكشف بنية البروتون بالاستطارة المرنة والاستطارة العميقة غير المرنة، ويقدّم الكروموديناميكا الكمومية والحصر اللوني والحرية التقاربية. ويُخصَّص النصف الثاني للتفاعل الضعيف (انتهاك الزوجية، بنية V−A، مصفوفة CKM)، وتذبذبات النيوترينو، والتوحيد الكهروضعيف وآلية هيغز، لينتهي بالاختبارات التجريبية للنموذج القياسي والأسئلة المفتوحة فيما وراءه.</p>
    <p>تُستكمل المحاضرات بحصص أعمال موجهة، وسلاسل تمارين مبنية على بيانات حقيقية من مجموعة بيانات الجسيمات (PDG)، ومشروع صغير حول قياس تاريخي. ويمكن استعمال جدول النموذج القياسي التفاعلي في هذه الصفحة طوال المقرر لاستكشاف خصائص الجسيمات.</p>

topics:
  - { en: Relativistic kinematics, ar: الحركيات النسبية }
  - { en: Symmetries & conservation laws, ar: التناظرات وقوانين الانحفاظ }
  - { en: The quark model, ar: نموذج الكواركات }
  - { en: Dirac equation, ar: معادلة ديراك }
  - { en: QED & Feynman rules, ar: الكهروديناميكا الكمومية وقواعد فاينمان }
  - { en: QCD & deep inelastic scattering, ar: الكروموديناميكا الكمومية والاستطارة العميقة غير المرنة }
  - { en: Weak interaction & CKM, ar: التفاعل الضعيف ومصفوفة CKM }
  - { en: Neutrino oscillations, ar: تذبذبات النيوترينو }
  - { en: Electroweak unification & Higgs, ar: التوحيد الكهروضعيف وبوزون هيغز }

outcomes:
  - id: CLO1
    bloom: understand
    domain: knowledge
    text:
      en: Describe the particle content and interactions of the Standard Model and use conservation laws (energy–momentum, charge, baryon and lepton numbers, strangeness, parity) to decide whether a process is allowed and by which interaction.
      ar: يصف محتوى النموذج القياسي من الجسيمات وتفاعلاتها، ويستعمل قوانين الانحفاظ (الطاقة-الزخم، الشحنة، العددين الباريوني واللبتوني، الغرابة، الزوجية) للحكم على إمكان حدوث عملية ما وتحديد التفاعل المسؤول عنها.
    assessed_by: [homework, midterm, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: Apply relativistic kinematics (four-vectors, invariant mass, thresholds, two-body decays) and Fermi's golden rule to compute decay rates and cross-sections.
      ar: يطبّق الحركيات النسبية (المتجهات الرباعية، الكتلة اللامتغيرة، العتبات، الاضمحلال إلى جسيمين) وقاعدة فيرمي الذهبية لحساب معدلات الاضمحلال والمقاطع العرضية.
    assessed_by: [homework, midterm, final]
  - id: CLO3
    bloom: apply
    domain: knowledge
    text:
      en: Construct meson and baryon multiplets in the quark model and explain the role of colour.
      ar: يبني متعددات الميزونات والباريونات في نموذج الكواركات، ويشرح دور الشحنة اللونية.
    assessed_by: [homework, midterm, final]
  - id: CLO4
    bloom: apply
    domain: skills
    text:
      en: Solve the free Dirac equation, apply Feynman rules to lowest-order QED processes and compute spin-averaged matrix elements such as that of \(e^+e^-\to\mu^+\mu^-\).
      ar: يحل معادلة ديراك الحرة، ويطبّق قواعد فاينمان على عمليات الكهروديناميكا الكمومية في أدنى رتبة، ويحسب العناصر المصفوفية المتوسطة على السبين مثل عنصر \(e^+e^-\to\mu^+\mu^-\).
    assessed_by: [homework, midterm, final]
  - id: CLO5
    bloom: analyze
    domain: knowledge
    text:
      en: Analyse experimental evidence for quarks and gluons (deep inelastic scattering, R-ratio, jets) and explain asymptotic freedom and confinement in QCD.
      ar: يحلّل الأدلة التجريبية على الكواركات والغلوونات (الاستطارة العميقة غير المرنة، النسبة R، النفاثات)، ويشرح الحرية التقاربية والحصر في الكروموديناميكا الكمومية.
    assessed_by: [homework, project, final]
  - id: CLO6
    bloom: analyze
    domain: knowledge
    text:
      en: Explain the V−A structure of the weak interaction, quark mixing, neutrino oscillations and the Higgs mechanism of electroweak symmetry breaking, and relate them to measured masses and mixing parameters.
      ar: يشرح بنية V−A للتفاعل الضعيف، وخلط الكواركات، وتذبذبات النيوترينو، وآلية هيغز لكسر التناظر الكهروضعيف، ويربطها بالكتل ومعاملات الخلط المقيسة.
    assessed_by: [homework, presentation, final]
  - id: CLO7
    bloom: evaluate
    domain: values
    text:
      en: Critically read, summarise and present a landmark particle-physics measurement using primary sources and PDG data, with correct attribution.
      ar: يقرأ قياسًا تاريخيًا في فيزياء الجسيمات قراءة نقدية، ويلخّصه ويعرضه مستعينًا بالمصادر الأصلية وبيانات PDG، مع نسبة الأعمال إلى أصحابها بشكل صحيح.
    assessed_by: [project, presentation, participation]

assessment:
  - id: homework
    type: homework
    weight: 15
    title: { en: Problem sets, ar: سلاسل التمارين }
    detail:
      en: Six fortnightly problem sets combining analytic calculations with look-ups and estimates from PDG data. Discussed in tutorials.
      ar: ست سلاسل تمارين كل أسبوعين تجمع بين الحسابات التحليلية واستخراج المعطيات والتقديرات من بيانات PDG. تُناقش في حصص الأعمال الموجهة.
    when: { en: Weeks 2–13, ar: الأسابيع 2–13 }
  - id: midterm
    type: midterm
    weight: 20
    title: { en: Mid-term exam, ar: الاختبار النصفي }
    detail:
      en: 'Ninety minutes: kinematics, conservation laws, quark model, Dirac equation.'
      ar: 'تسعون دقيقة: الحركيات، قوانين الانحفاظ، نموذج الكواركات، معادلة ديراك.'
    when: { en: Week 7, ar: الأسبوع 7 }
  - id: project
    type: project
    weight: 10
    title: { en: Mini-project, ar: مشروع مصغّر }
    detail:
      en: 'A short written study (4–6 pages) of a key measurement — e.g. the discovery of the W and Z, the R-ratio, the top quark, neutrino oscillations or the Higgs boson — or a simple analysis of a public dataset (invariant-mass peak).'
      ar: 'دراسة مكتوبة قصيرة (4–6 صفحات) لقياس محوري — مثل اكتشاف W وZ، أو النسبة R، أو كوارك القمة، أو تذبذبات النيوترينو، أو بوزون هيغز — أو تحليل بسيط لمجموعة بيانات عامة (قمة الكتلة اللامتغيرة).'
    when: { en: Due week 12, ar: يُسلَّم في الأسبوع 12 }
  - id: presentation
    type: presentation
    weight: 10
    title: { en: Seminar presentation, ar: عرض في حلقة نقاش }
    detail:
      en: A 15-minute presentation of the mini-project followed by questions.
      ar: عرض مدته 15 دقيقة للمشروع المصغّر تليه أسئلة.
    when: { en: Weeks 13–14, ar: الأسبوعان 13–14 }
  - id: participation
    type: participation
    weight: 5
    title: { en: Tutorial participation, ar: المشاركة في الأعمال الموجهة }
    detail:
      en: Preparation and discussion of tutorial problems.
      ar: تحضير مسائل الأعمال الموجهة ومناقشتها.
    when: { en: Throughout, ar: طوال الفصل }
  - id: final
    type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }
    detail:
      en: Two-hour written exam with a short conceptual section and four or five problems covering the whole course.
      ar: اختبار كتابي مدته ساعتان، فيه قسم مفاهيمي قصير وأربع أو خمس مسائل تغطي المقرر كله.
    when: { en: Final exam period, ar: فترة الاختبارات النهائية }

schedule:
  - week: 1
    title: { en: Introduction to the Standard Model, ar: مدخل إلى النموذج القياسي }
    topics:
      en:
        - Quarks, leptons and gauge bosons
        - The four fundamental interactions; Feynman diagrams (qualitative)
        - Natural units; experimental methods (accelerators and detectors)
      ar:
        - الكواركات واللبتونات والبوزونات المعيارية
        - التفاعلات الأساسية الأربعة؛ مخططات فاينمان (وصفيًا)
        - الوحدات الطبيعية؛ الطرق التجريبية (المسرّعات والكواشف)
    reading: Thomson ch. 1; Griffiths ch. 1–2
  - week: 2
    title: { en: Relativistic kinematics, ar: الحركيات النسبية }
    topics:
      en:
        - Four-vectors and Lorentz invariants
        - Invariant mass; production thresholds
        - Two-body decays; Mandelstam variables
      ar:
        - المتجهات الرباعية واللامتغيرات اللورنتزية
        - الكتلة اللامتغيرة؛ عتبات الإنتاج
        - الاضمحلال إلى جسيمين؛ متغيرات ماندلستام
    reading: Thomson §2.1–2.3; Griffiths ch. 3
    activity: { en: Problem set 1, ar: السلسلة 1 }
  - week: 3
    title: { en: Decay rates and cross-sections, ar: معدلات الاضمحلال والمقاطع العرضية }
    topics:
      en:
        - Fermi's golden rule; Lorentz-invariant phase space
        - Decay widths, lifetimes and branching ratios
        - Cross-sections and luminosity
      ar:
        - قاعدة فيرمي الذهبية؛ فضاء الطور اللامتغير لورنتزيًا
        - عروض الاضمحلال والأعمار ونسب التفرّع
        - المقاطع العرضية واللمعان
    reading: Thomson ch. 3; Griffiths §6.1–6.2
  - week: 4
    title: { en: Symmetries and conservation laws, ar: التناظرات وقوانين الانحفاظ }
    topics:
      en:
        - Symmetries and conserved quantities (Noether)
        - Baryon and lepton numbers; strangeness
        - 'Parity, charge conjugation and time reversal'
        - Isospin
      ar:
        - التناظرات والمقادير المنحفظة (نوثر)
        - العددان الباريوني واللبتوني؛ الغرابة
        - 'الزوجية، ومرافقة الشحنة، وانعكاس الزمن'
        - اللف النظائري (الإيزوسبين)
    reading: Griffiths ch. 4; Thomson §9.1
    activity: { en: Problem set 2, ar: السلسلة 2 }
  - week: 5
    title: { en: The quark model, ar: نموذج الكواركات }
    topics:
      en:
        - SU(3) flavour symmetry; the eightfold way
        - Meson nonets and baryon octet/decuplet
        - Colour; hadron wavefunctions and magnetic moments
      ar:
        - تناظر النكهة SU(3)؛ الطريق الثماني
        - تساعيات الميزونات وثمانيات/عشاريات الباريونات
        - اللون؛ الدوال الموجية للهادرونات وعزومها المغناطيسية
    reading: Thomson ch. 9; Griffiths §5.5–5.6
  - week: 6
    title: { en: The Dirac equation, ar: معادلة ديراك }
    topics:
      en:
        - Klein–Gordon equation and its problems
        - Dirac equation; gamma matrices
        - Free-particle spinors; antiparticles
        - Helicity and chirality
      ar:
        - معادلة كلاين-غوردون ومشكلاتها
        - معادلة ديراك؛ مصفوفات غاما
        - سبينورات الجسيم الحر؛ الجسيمات المضادة
        - الهيليسية والكيرالية
    reading: Thomson ch. 4; Griffiths §7.1–7.4
    activity: { en: Problem set 3, ar: السلسلة 3 }
  - week: 7
    title: { en: Interaction by particle exchange, ar: التفاعل بتبادل الجسيمات }
    topics:
      en:
        - Propagators and virtual particles
        - Feynman rules for QED
        - Mid-term exam
      ar:
        - المنتشرات والجسيمات الافتراضية
        - قواعد فاينمان للكهروديناميكا الكمومية
        - الاختبار النصفي
    reading: Thomson ch. 5; Griffiths §6.3, §7.5
    milestone: midterm
  - week: 8
    title: { en: Quantum electrodynamics, ar: الكهروديناميكا الكمومية }
    topics:
      en:
        - 'Electron–positron annihilation \(e^+e^-\to\mu^+\mu^-\)'
        - Spin sums and trace techniques
        - Angular distribution and total cross-section
      ar:
        - 'فناء الإلكترون-البوزيترون \(e^+e^-\to\mu^+\mu^-\)'
        - مجاميع السبين وتقنيات الأثر
        - التوزيع الزاوي والمقطع العرضي الكلي
    reading: Thomson ch. 6; Griffiths §7.6–7.8
    activity: { en: Problem set 4, ar: السلسلة 4 }
  - week: 9
    title: { en: Probing the proton, ar: سبر البروتون }
    topics:
      en:
        - Elastic electron–proton scattering; form factors
        - Deep inelastic scattering; Bjorken scaling
        - Parton model and parton distribution functions
      ar:
        - الاستطارة المرنة إلكترون-بروتون؛ عوامل الشكل
        - الاستطارة العميقة غير المرنة؛ تدرّج بيوركن
        - النموذج البارتوني ودوال توزيع البارتونات
    reading: Thomson ch. 7–8
  - week: 10
    title: { en: Quantum chromodynamics, ar: الكروموديناميكا الكمومية }
    topics:
      en:
        - Colour SU(3) and gluons
        - Running coupling; asymptotic freedom; confinement
        - 'Jets and the R-ratio in \(e^+e^-\) annihilation'
      ar:
        - الزمرة اللونية SU(3) والغلوونات
        - ثابت الاقتران الجاري؛ الحرية التقاربية؛ الحصر
        - 'النفاثات والنسبة R في فناء \(e^+e^-\)'
    reading: Thomson ch. 10; Griffiths ch. 8
    activity: { en: Problem set 5, ar: السلسلة 5 }
  - week: 11
    title: { en: The weak interaction, ar: التفاعل الضعيف }
    topics:
      en:
        - Parity violation; the V−A structure
        - Muon decay and pion decay; helicity suppression
        - Quark mixing; the CKM matrix and CP violation
      ar:
        - انتهاك الزوجية؛ بنية V−A
        - اضمحلال الميون واضمحلال البيون؛ الكبت الهيليسي
        - خلط الكواركات؛ مصفوفة CKM وانتهاك CP
    reading: Thomson ch. 11–12, 14; Griffiths ch. 9
  - week: 12
    title: { en: Neutrino physics, ar: فيزياء النيوترينو }
    topics:
      en:
        - Neutrino flavours and mass states; the PMNS matrix
        - Two-flavour oscillation formula
        - Solar, atmospheric and reactor experiments
      ar:
        - نكهات النيوترينو وحالاته الكتلية؛ مصفوفة PMNS
        - صيغة التذبذب لنكهتين
        - التجارب الشمسية والجوية والمفاعلات
    reading: Thomson ch. 13; Griffiths ch. 11
    activity: { en: Problem set 6; mini-project due, ar: السلسلة 6؛ تسليم المشروع المصغّر }
    milestone: project
  - week: 13
    title: { en: Electroweak unification and the Higgs boson, ar: التوحيد الكهروضعيف وبوزون هيغز }
    topics:
      en:
        - 'SU(2)\(_L\)×U(1)\(_Y\); W and Z bosons; the weak mixing angle'
        - Gauge invariance and the Higgs mechanism
        - Discovery and properties of the Higgs boson
        - Seminar presentations
      ar:
        - 'SU(2)\(_L\)×U(1)\(_Y\)؛ البوزونان W وZ؛ زاوية الخلط الضعيفة'
        - اللاتغير المعياري وآلية هيغز
        - اكتشاف بوزون هيغز وخصائصه
        - عروض حلقات النقاش
    reading: Thomson ch. 15, 17; Griffiths ch. 10
  - week: 14
    title: { en: Testing the Standard Model and beyond, ar: اختبار النموذج القياسي وما وراءه }
    topics:
      en:
        - Precision tests at the Z pole; number of light neutrinos
        - Open questions — neutrino masses, dark matter, matter–antimatter asymmetry
        - Seminar presentations; course review
      ar:
        - الاختبارات الدقيقة عند قطب Z؛ عدد النيوترينوات الخفيفة
        - 'أسئلة مفتوحة: كتل النيوترينوات، المادة المظلمة، اللاتناظر بين المادة والمادة المضادة'
        - عروض حلقات النقاش؛ مراجعة المقرر
    reading: Thomson ch. 16, 18
    milestone: review


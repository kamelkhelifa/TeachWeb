notes: >
  Main source: PHYS 102 page (Halliday 10th ed., 14 chapters, slides for each). That offering covered
  waves and thermodynamics (Halliday ch. 16–20) before E&M; since this course is defined as E&M (as in
  PHYS 193), the 14-week schedule covers Halliday ch. 21–30 only, and the waves/thermodynamics slides,
  problem sheets 1–4 and the MIT 5.60 / Open Yale links are kept as "complementary" materials without a
  week. The PHYS 102 past papers (2017–2018) probably include waves/thermo questions (quizzes, midterm 1).
  The lecture/tutorial part of the French "Electricité" page (UEF 212: lecture notes, electrostatics
  summary, TD 1 + solution, two tests in two versions each, final exam paper) was placed here because it
  is E&M lecture material; its lab sheets went to the electricity-lab course. Original PHYS 102 weighting
  was quizzes 5 %, two periodic exams 30 %, lab 25 %, final 40 %; since the lab is now a separate course,
  the scheme was rebuilt. CLOs were adapted from the 12 outcomes on the PHYS 102 page. Mark lists and a
  bookshop link for Alonso–Finn were not kept. Quizzes, problems, glossary, readings written new.

description:
  en: |
    <p>The second semester of the introductory calculus-based sequence is devoted to electricity and magnetism. Starting from electric charge and Coulomb's law, the course builds the concepts of electric field and electric potential, applies Gauss's law to symmetric charge distributions and conductors, and studies capacitors and dielectrics.</p>
    <p>The second half turns to moving charges: current, resistance and direct-current circuits (Ohm's law, Kirchhoff's rules, RC transients), magnetic forces on charges and currents, magnetic fields produced by currents (Biot–Savart and Ampère's laws), and finally electromagnetic induction (Faraday's and Lenz's laws, inductance and RL circuits), which prepares Maxwell's equations.</p>
    <p>Lectures follow the chapter order of Halliday, Resnick &amp; Walker (ch. 21–30) with a slide deck per chapter. French lecture notes, an electrostatics summary and a solved tutorial sheet offer a second presentation of the first half. Interactive labs on this page let you drag charges to see field lines and equipotentials, and watch a capacitor charge through a resistor. An earlier version of the course opened with a short unit on waves and thermodynamics; its slides and problem sheets are kept as complementary material, and some past papers contain questions on those topics.</p>
  ar: |
    <p>يُخصَّص الفصل الثاني من سلسلة الفيزياء التمهيدية القائمة على التفاضل والتكامل للكهرباء والمغناطيسية. ينطلق المقرر من الشحنة الكهربائية وقانون كولوم ليبني مفهومي الحقل الكهربائي والكمون الكهربائي، ثم يطبّق قانون غاوس على توزيعات الشحن المتناظرة وعلى النواقل، ويدرس المكثفات والعوازل.</p>
    <p>ويتناول النصف الثاني الشحنات المتحركة: التيار والمقاومة ودارات التيار المستمر (قانون أوم، قانونا كيرشوف، النظام الانتقالي في الدارة RC)، والقوى المغناطيسية المؤثرة في الشحنات والتيارات، والحقول المغناطيسية الناشئة عن التيارات (قانونا بيو-سافار وأمبير)، وأخيرًا التحريض الكهرومغناطيسي (قانونا فاراداي ولنز، الذاتية والدارة RL)، تمهيدًا لمعادلات ماكسويل.</p>
    <p>تتبع المحاضرات ترتيب فصول كتاب Halliday وResnick وWalker (الفصول 21–30) مع مجموعة شرائح لكل فصل. وتقدّم المطبوعة الفرنسية وملخص الكهروساكنة وسلسلة تمارين محلولة عرضًا ثانيًا للنصف الأول من المقرر. وتتيح المختبرات التفاعلية في هذه الصفحة سحب الشحنات لمشاهدة خطوط الحقل والسطوح متساوية الكمون، ومتابعة شحن مكثفة عبر مقاومة. كانت نسخة سابقة من المقرر تبدأ بوحدة قصيرة عن الأمواج والديناميكا الحرارية، وقد احتُفظ بشرائحها وسلاسل مسائلها موادَّ تكميلية، وبعض الاختبارات السابقة يتضمن أسئلة في هذين الموضوعين.</p>


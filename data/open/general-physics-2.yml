outcomes:
  - id: CLO1
    bloom: understand
    domain: knowledge
    text:
      en: 'Describe electric charge, Coulomb''s law, the electric field and the electric potential, and explain the superposition principle.'
      ar: 'يصف الشحنة الكهربائية وقانون كولوم والحقل الكهربائي والكمون الكهربائي، ويشرح مبدأ التراكب.'
    assessed_by: [quizzes, midterm1, final]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: 'Calculate electric fields and potentials of point charges, dipoles and continuous charge distributions by superposition and integration, and relate them through \(\vec E = -\nabla V\).'
      ar: 'يحسب الحقول والكمونات الكهربائية للشحنات النقطية وثنائيات الأقطاب والتوزيعات المتصلة بالتراكب والتكامل، ويربط بينها بالعلاقة \(\vec E = -\nabla V\).'
    assessed_by: [homework, midterm1, final]
  - id: CLO3
    bloom: apply
    domain: skills
    text:
      en: 'Apply Gauss''s law to charge distributions with spherical, cylindrical and planar symmetry, and to conductors in electrostatic equilibrium.'
      ar: 'يطبّق قانون غاوس على توزيعات الشحن ذات التناظر الكروي والأسطواني والمستوي، وعلى النواقل في حالة التوازن الكهروساكن.'
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO4
    bloom: analyze
    domain: skills
    text:
      en: 'Analyse capacitor networks, including the effect of dielectrics and the energy stored in the electric field.'
      ar: 'يحلل شبكات المكثفات، بما في ذلك أثر العوازل والطاقة المخزنة في الحقل الكهربائي.'
    assessed_by: [homework, midterm2, final]
  - id: CLO5
    bloom: analyze
    domain: skills
    text:
      en: 'Analyse direct-current circuits with Ohm''s law and Kirchhoff''s rules, and describe the charging and discharging of an RC circuit.'
      ar: 'يحلل دارات التيار المستمر باستعمال قانون أوم وقانوني كيرشوف، ويصف شحن الدارة RC وتفريغها.'
    assessed_by: [quizzes, midterm2, project, final]
  - id: CLO6
    bloom: apply
    domain: skills
    text:
      en: 'Determine magnetic forces on moving charges and currents, and compute magnetic fields of currents with the Biot–Savart and Ampère laws.'
      ar: 'يحدد القوى المغناطيسية المؤثرة في الشحنات المتحركة والتيارات، ويحسب الحقول المغناطيسية للتيارات بقانوني بيو-سافار وأمبير.'
    assessed_by: [homework, midterm2, final]
  - id: CLO7
    bloom: apply
    domain: skills
    text:
      en: 'Use Faraday''s and Lenz''s laws to find induced emfs and currents, and compute self-inductance and the behaviour of RL circuits.'
      ar: 'يستعمل قانوني فاراداي ولنز لإيجاد القوى المحركة الكهربائية والتيارات المتحرَّضة، ويحسب الذاتية وسلوك الدارة RL.'
    assessed_by: [quizzes, final]
  - id: CLO8
    bloom: evaluate
    domain: values
    text:
      en: 'Investigate a field or circuit with an interactive simulation, compare it critically with theory, and communicate the results clearly and honestly.'
      ar: 'يستقصي حقلًا أو دارة بواسطة محاكاة تفاعلية، ويقارن النتائج بالنظرية مقارنة نقدية، ويعرضها بوضوح وأمانة.'
    assessed_by: [project, participation]

assessment:
  - id: quizzes
    type: quiz
    weight: 10
    title: { en: 'Short quizzes', ar: 'اختبارات قصيرة' }
    detail:
      en: 'Three 15-minute quizzes on the most recent chapters (one short problem or five MCQs each).'
      ar: 'ثلاثة اختبارات قصيرة مدة كل منها 15 دقيقة حول الفصول الأخيرة (مسألة قصيرة أو خمسة أسئلة اختيار من متعدد).'
    when: { en: 'Weeks 4, 10, 13', ar: 'الأسابيع 4 و10 و13' }
  - id: homework
    type: homework
    weight: 10
    title: { en: 'Problem sets', ar: 'سلاسل المسائل' }
    detail:
      en: 'One problem set per chapter; two or three problems are graded for physical reasoning, correct vector directions and units.'
      ar: 'سلسلة مسائل لكل فصل؛ تُقيَّم مسألتان أو ثلاث منها على أساس الاستدلال الفيزيائي وصحة اتجاهات المتجهات والوحدات.'
    when: { en: 'Weekly', ar: 'أسبوعيًا' }
  - id: midterm1
    type: midterm
    weight: 15
    title: { en: 'Midterm exam 1', ar: 'الاختبار الدوري الأول' }
    detail:
      en: '75-minute written exam on electrostatics: charge, field, Gauss''s law and potential (weeks 1–6).'
      ar: 'اختبار كتابي مدته 75 دقيقة في الكهروساكنة: الشحنة والحقل وقانون غاوس والكمون (الأسابيع 1–6).'
    when: { en: 'Week 7', ar: 'الأسبوع 7' }
  - id: midterm2
    type: midterm
    weight: 15
    title: { en: 'Midterm exam 2', ar: 'الاختبار الدوري الثاني' }
    detail:
      en: '75-minute written exam on capacitance, current, circuits and magnetic force (weeks 7–11).'
      ar: 'اختبار كتابي مدته 75 دقيقة في السعة والتيار والدارات والقوة المغناطيسية (الأسابيع 7–11).'
    when: { en: 'Week 12', ar: 'الأسبوع 12' }
  - id: project
    type: project
    weight: 5
    title: { en: 'Simulation mini-project', ar: 'مشروع مصغّر بالمحاكاة' }
    detail:
      en: 'In pairs, use the electric-field or RC-circuit simulation to test a prediction (e.g. the \(1/r^2\) law, or \(\tau = RC\)); hand in a two-page report with screenshots, data and a comparison with theory.'
      ar: 'يستعمل الطلاب في ثنائيات محاكاة الحقل الكهربائي أو الدارة RC لاختبار توقّع ما (مثل قانون \(1/r^2\) أو \(\tau = RC\))، ويسلّمون تقريرًا من صفحتين يتضمن لقطات شاشة وبيانات ومقارنة مع النظرية.'
    when: { en: 'Due week 13', ar: 'التسليم في الأسبوع 13' }
  - id: participation
    type: participation
    weight: 5
    title: { en: 'Participation', ar: 'المشاركة' }
    detail:
      en: 'Active work in tutorial sessions: presenting a solution at the board, concept questions in class.'
      ar: 'العمل الفعّال في حصص التمارين: عرض حل على السبورة، والإجابة عن الأسئلة المفاهيمية في القسم.'
    when: { en: 'Throughout', ar: 'طوال الفصل' }
  - id: final
    type: final
    weight: 40
    title: { en: 'Final exam', ar: 'الاختبار النهائي' }
    detail:
      en: 'Comprehensive 2-hour written exam: conceptual MCQs and 4–5 problems covering the whole course, with emphasis on circuits, magnetism and induction.'
      ar: 'اختبار كتابي شامل مدته ساعتان: أسئلة مفاهيمية من نوع الاختيار من متعدد و4–5 مسائل تغطي المقرر كاملًا، مع التركيز على الدارات والمغناطيسية والتحريض.'
    when: { en: 'After week 14', ar: 'بعد الأسبوع 14' }


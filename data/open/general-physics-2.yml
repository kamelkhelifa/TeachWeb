exam_guide:
  format:
    en: 'Midterms last 75 minutes: about five conceptual MCQs and two or three problems. The 2-hour final covers the whole course with 8–10 MCQs and 4–5 multi-step problems (typically: a superposition or Gauss''s-law problem, a capacitor or circuit problem, a magnetic-field problem and an induction problem).'
    ar: 'مدة كل اختبار دوري 75 دقيقة: نحو خمسة أسئلة مفاهيمية من نوع الاختيار من متعدد ومسألتان أو ثلاث. ويغطي الاختبار النهائي (ساعتان) المقرر كاملًا بـ 8–10 أسئلة اختيار من متعدد و4–5 مسائل متعددة الخطوات (عادةً: مسألة تراكب أو قانون غاوس، ومسألة مكثفات أو دارات، ومسألة حقل مغناطيسي، ومسألة تحريض).'
  allowed:
    en: 'A non-programmable scientific calculator. A sheet of constants (\(k = 8.99\times10^9\ \mathrm{N\,m^2/C^2}\), \(\varepsilon_0\), \(\mu_0 = 4\pi\times10^{-7}\ \mathrm{T\,m/A}\), \(e\), \(m_e\)…) and key formulas is provided. No personal notes or phones.'
    ar: 'آلة حاسبة علمية غير قابلة للبرمجة. تُوفَّر ورقة ثوابت (\(k = 8.99\times10^9\ \mathrm{N\,m^2/C^2}\) و\(\varepsilon_0\) و\(\mu_0 = 4\pi\times10^{-7}\ \mathrm{T\,m/A}\) و\(e\) و\(m_e\)…) وأهم الصيغ. لا يُسمح بالملاحظات الشخصية ولا بالهواتف.'
  tips:
    - en: 'For fields, always draw the vectors from each source before adding components; use symmetry to cancel components first.'
      ar: 'عند حساب الحقول ارسم دائمًا متجه كل مصدر قبل جمع المركّبات، واستعمل التناظر أولًا لحذف المركّبات التي تلغي بعضها.'
    - en: 'Gauss''s law is only useful when symmetry makes \(E\) constant on the Gaussian surface — state that symmetry explicitly.'
      ar: 'لا يكون قانون غاوس مفيدًا إلا إذا جعل التناظر \(E\) ثابتًا على سطح غاوس — صرّح بهذا التناظر بوضوح.'
    - en: 'In circuits, choose current directions once, write one junction equation fewer than the number of nodes, and check with a power balance.'
      ar: 'في الدارات اختر اتجاهات التيارات مرة واحدة، واكتب عددًا من معادلات العقد يقل بواحد عن عدد العقد، ثم تحقق بموازنة القدرات.'
    - en: 'For induction, find the sign with Lenz''s law separately from the magnitude \(|\mathcal E| = |\dd\Phi_B/\dd t|\).'
      ar: 'في التحريض حدّد الإشارة بقانون لنز بمعزل عن حساب المقدار \(|\mathcal E| = |\dd\Phi_B/\dd t|\).'

problems:
  - title: { en: 'Where does the field vanish?', ar: 'أين ينعدم الحقل؟' }
    difficulty: 1
    statement:
      en: 'A charge \(q_1 = +4.0\ \mu\mathrm{C}\) is at \(x = 0\) and \(q_2 = +1.0\ \mu\mathrm{C}\) at \(x = 0.30\ \mathrm{m}\). (a) Find the point on the \(x\)-axis where the electric field is zero. (b) Find the force on a charge \(q_3 = -2.0\ \mathrm{nC}\) placed at \(x = 0.10\ \mathrm{m}\).'
      ar: 'توجد شحنة \(q_1 = +4.0\ \mu\mathrm{C}\) عند \(x = 0\) وشحنة \(q_2 = +1.0\ \mu\mathrm{C}\) عند \(x = 0.30\ \mathrm{m}\). (أ) أوجد النقطة على المحور \(x\) التي ينعدم فيها الحقل الكهربائي. (ب) أوجد القوة المؤثرة في شحنة \(q_3 = -2.0\ \mathrm{nC}\) موضوعة عند \(x = 0.10\ \mathrm{m}\).'
    hint:
      en: 'For two like charges the zero must lie between them, closer to the smaller one.'
      ar: 'في حالة شحنتين من النوع نفسه تقع نقطة الانعدام بينهما، وأقرب إلى الشحنة الأصغر.'
    solution:
      en: |
        (a) Between the charges the two fields point in opposite directions. Setting their magnitudes equal:
        \[ \frac{k(4.0)}{x^2} = \frac{k(1.0)}{(0.30 - x)^2} \;\Rightarrow\; \frac{2}{x} = \frac{1}{0.30 - x} \;\Rightarrow\; x = 0.20\ \mathrm{m} \]
        (Outside the segment both fields point the same way, so no other zero exists.)
        (b) At \(x = 0.10\ \mathrm{m}\):
        \[ E_1 = \frac{(8.99\times10^9)(4.0\times10^{-6})}{(0.10)^2} = 3.60\times10^6\ \mathrm{N/C}\ (+x), \quad E_2 = \frac{(8.99\times10^9)(1.0\times10^{-6})}{(0.20)^2} = 2.25\times10^5\ \mathrm{N/C}\ (-x) \]
        \(E = 3.37\times10^6\ \mathrm{N/C}\) along \(+x\), so \(F = q_3E = (-2.0\times10^{-9})(3.37\times10^6) = -6.7\times10^{-3}\ \mathrm{N}\): \(6.7\ \mathrm{mN}\) towards \(q_1\) (negative charges feel a force opposite to \(\vec E\)).
      ar: |
        (أ) بين الشحنتين يتجه الحقلان اتجاهين متعاكسين. بمساواة مقداريهما:
        \[ \frac{k(4.0)}{x^2} = \frac{k(1.0)}{(0.30 - x)^2} \;\Rightarrow\; \frac{2}{x} = \frac{1}{0.30 - x} \;\Rightarrow\; x = 0.20\ \mathrm{m} \]
        (خارج القطعة المستقيمة يكون للحقلين الاتجاه نفسه، فلا توجد نقطة انعدام أخرى.)
        (ب) عند \(x = 0.10\ \mathrm{m}\):
        \[ E_1 = \frac{(8.99\times10^9)(4.0\times10^{-6})}{(0.10)^2} = 3.60\times10^6\ \mathrm{N/C}\ (+x), \quad E_2 = \frac{(8.99\times10^9)(1.0\times10^{-6})}{(0.20)^2} = 2.25\times10^5\ \mathrm{N/C}\ (-x) \]
        \(E = 3.37\times10^6\ \mathrm{N/C}\) في الاتجاه \(+x\)، إذن \(F = q_3E = (-2.0\times10^{-9})(3.37\times10^6) = -6.7\times10^{-3}\ \mathrm{N}\): أي \(6.7\ \mathrm{mN}\) نحو \(q_1\) (الشحنة السالبة تخضع لقوة معاكسة لاتجاه \(\vec E\)).
  - title: { en: 'Field on the axis of a charged ring', ar: 'الحقل على محور حلقة مشحونة' }
    difficulty: 2
    statement:
      en: 'A thin ring of radius \(R\) carries a charge \(Q > 0\) uniformly distributed. (a) Find the electric field at a point on its axis at distance \(z\) from the centre. (b) Check the limits \(z = 0\) and \(z \gg R\). (c) At what distance is the field maximum? Evaluate \(E_{\max}\) for \(Q = 10\ \mathrm{nC}\), \(R = 5.0\ \mathrm{cm}\).'
      ar: 'حلقة رقيقة نصف قطرها \(R\) تحمل شحنة \(Q > 0\) موزعة بانتظام. (أ) أوجد الحقل الكهربائي في نقطة من محورها على بعد \(z\) من المركز. (ب) تحقق من الحالتين الحدّيتين \(z = 0\) و\(z \gg R\). (ج) عند أي مسافة يكون الحقل أعظميًا؟ احسب \(E_{\max}\) من أجل \(Q = 10\ \mathrm{nC}\) و\(R = 5.0\ \mathrm{cm}\).'
    hint:
      en: 'Every element \(\dd q\) is at the same distance \(\sqrt{z^2 + R^2}\); by symmetry only the axial components survive.'
      ar: 'كل عنصر \(\dd q\) يقع على البعد نفسه \(\sqrt{z^2 + R^2}\)، وبسبب التناظر لا تبقى إلا المركّبات المحورية.'
    solution:
      en: |
        (a) The axial component of the field of \(\dd q\) is \(\dd E_z = \dfrac{k\,\dd q}{z^2 + R^2}\cdot\dfrac{z}{\sqrt{z^2 + R^2}}\); perpendicular components cancel in pairs. Integrating over the ring:
        \[ E_z = \frac{kQz}{(z^2 + R^2)^{3/2}} \]
        (b) At \(z = 0\), \(E = 0\) (contributions cancel). For \(z \gg R\), \(E \approx kQ/z^2\): the ring looks like a point charge.
        (c) \[ \dv{E}{z} = kQ\,\frac{(z^2 + R^2) - 3z^2}{(z^2 + R^2)^{5/2}} = 0 \;\Rightarrow\; z = \frac{R}{\sqrt2} \]
        \[ E_{\max} = \frac{2}{3\sqrt3}\,\frac{kQ}{R^2} = 0.385\times\frac{(8.99\times10^9)(10\times10^{-9})}{(0.050)^2} = 1.38\times10^4\ \mathrm{N/C} \]
      ar: |
        (أ) المركّبة المحورية لحقل العنصر \(\dd q\) هي \(\dd E_z = \dfrac{k\,\dd q}{z^2 + R^2}\cdot\dfrac{z}{\sqrt{z^2 + R^2}}\)، أما المركّبات العمودية على المحور فتلغي بعضها مثنى مثنى. بالتكامل على الحلقة:
        \[ E_z = \frac{kQz}{(z^2 + R^2)^{3/2}} \]
        (ب) عند \(z = 0\) يكون \(E = 0\) (تلغي المساهمات بعضها). ومن أجل \(z \gg R\) يكون \(E \approx kQ/z^2\): تبدو الحلقة كشحنة نقطية.
        (ج) \[ \dv{E}{z} = kQ\,\frac{(z^2 + R^2) - 3z^2}{(z^2 + R^2)^{5/2}} = 0 \;\Rightarrow\; z = \frac{R}{\sqrt2} \]
        \[ E_{\max} = \frac{2}{3\sqrt3}\,\frac{kQ}{R^2} = 0.385\times\frac{(8.99\times10^9)(10\times10^{-9})}{(0.050)^2} = 1.38\times10^4\ \mathrm{N/C} \]
  - title: { en: 'Uniformly charged insulating sphere', ar: 'كرة عازلة مشحونة بانتظام' }
    difficulty: 3
    statement:
      en: 'An insulating sphere of radius \(R\) carries a total charge \(Q\) uniformly distributed in its volume. (a) Use Gauss''s law to find \(E(r)\) inside and outside. (b) Find the potential at the centre, taking \(V(\infty) = 0\).'
      ar: 'كرة عازلة نصف قطرها \(R\) تحمل شحنة كلية \(Q\) موزعة بانتظام في حجمها. (أ) استعمل قانون غاوس لإيجاد \(E(r)\) داخل الكرة وخارجها. (ب) أوجد الكمون في المركز باعتبار \(V(\infty) = 0\).'
    hint:
      en: 'Use concentric spherical Gaussian surfaces; inside, the enclosed charge is \(Q r^3/R^3\). Then integrate \(V(0) = \int_0^\infty E\,\dd r\).'
      ar: 'استعمل سطوح غاوس كروية متحدة المركز؛ الشحنة المحصورة داخل الكرة هي \(Q r^3/R^3\). ثم كامل \(V(0) = \int_0^\infty E\,\dd r\).'
    solution:
      en: |
        (a) By spherical symmetry \(\vec E = E(r)\,\hat r\) and \(\oint \vec E\cdot\dd\vec A = 4\pi r^2 E\).
        \[ r \ge R:\; 4\pi r^2 E = \frac{Q}{\varepsilon_0} \Rightarrow E = \frac{kQ}{r^2}; \qquad r < R:\; 4\pi r^2 E = \frac{Q r^3}{\varepsilon_0 R^3} \Rightarrow E = \frac{kQ\,r}{R^3} \]
        The field grows linearly inside, peaks at \(r = R\) and is continuous there.
        (b) \[ V(0) = \int_0^R \frac{kQr}{R^3}\,\dd r + \int_R^\infty \frac{kQ}{r^2}\,\dd r = \frac{kQ}{2R} + \frac{kQ}{R} = \frac{3kQ}{2R} \]
        The centre is at 1.5 times the surface potential.
      ar: |
        (أ) بسبب التناظر الكروي \(\vec E = E(r)\,\hat r\) و\(\oint \vec E\cdot\dd\vec A = 4\pi r^2 E\).
        \[ r \ge R:\; 4\pi r^2 E = \frac{Q}{\varepsilon_0} \Rightarrow E = \frac{kQ}{r^2}; \qquad r < R:\; 4\pi r^2 E = \frac{Q r^3}{\varepsilon_0 R^3} \Rightarrow E = \frac{kQ\,r}{R^3} \]
        يتزايد الحقل خطيًا داخل الكرة، ويبلغ قيمته العظمى عند \(r = R\) وهو مستمر عندها.
        (ب) \[ V(0) = \int_0^R \frac{kQr}{R^3}\,\dd r + \int_R^\infty \frac{kQ}{r^2}\,\dd r = \frac{kQ}{2R} + \frac{kQ}{R} = \frac{3kQ}{2R} \]
        كمون المركز يساوي 1.5 مرة كمون السطح.
  - title: { en: 'A capacitor network', ar: 'شبكة مكثفات' }
    difficulty: 2
    statement:
      en: 'A capacitor \(C_1 = 4.0\ \mu\mathrm{F}\) is connected in series with the parallel combination of \(C_2 = 2.0\ \mu\mathrm{F}\) and \(C_3 = 6.0\ \mu\mathrm{F}\), across a \(12\ \mathrm{V}\) battery. Find the equivalent capacitance, the charge and voltage of each capacitor, and the total stored energy.'
      ar: 'مكثفة \(C_1 = 4.0\ \mu\mathrm{F}\) موصولة على التسلسل مع التجميع على التفرع للمكثفتين \(C_2 = 2.0\ \mu\mathrm{F}\) و\(C_3 = 6.0\ \mu\mathrm{F}\)، والمجموعة موصولة ببطارية \(12\ \mathrm{V}\). أوجد السعة المكافئة، وشحنة كل مكثفة وفرق الكمون بين لبوسيها، والطاقة الكلية المخزنة.'
    hint:
      en: 'Series capacitors carry the same charge; parallel capacitors share the same voltage.'
      ar: 'المكثفات على التسلسل تحمل الشحنة نفسها، والمكثفات على التفرع لها فرق الكمون نفسه.'
    solution:
      en: |
        \(C_{23} = C_2 + C_3 = 8.0\ \mu\mathrm{F}\); \(C_{eq} = \dfrac{C_1 C_{23}}{C_1 + C_{23}} = \dfrac{4 \times 8}{12} = 2.67\ \mu\mathrm{F}\).
        \(Q_1 = Q_{23} = C_{eq}V = 2.67 \times 12 = 32\ \mu\mathrm{C}\).
        \(V_1 = Q_1/C_1 = 8.0\ \mathrm{V}\), \(V_{23} = 12 - 8 = 4.0\ \mathrm{V}\); \(Q_2 = C_2V_{23} = 8.0\ \mu\mathrm{C}\), \(Q_3 = 24\ \mu\mathrm{C}\) (and \(Q_2 + Q_3 = 32\ \mu\mathrm{C}\) ✓).
        \[ U = \tfrac12 C_{eq}V^2 = \tfrac12(2.67\times10^{-6})(12)^2 = 192\ \mu\mathrm{J} \]
        Check: \(\tfrac12(32)(8) + \tfrac12(8)(4) + \tfrac12(24)(4) = 128 + 16 + 48 = 192\ \mu\mathrm{J}\) ✓.
      ar: |
        \(C_{23} = C_2 + C_3 = 8.0\ \mu\mathrm{F}\)؛ \(C_{eq} = \dfrac{C_1 C_{23}}{C_1 + C_{23}} = \dfrac{4 \times 8}{12} = 2.67\ \mu\mathrm{F}\).
        \(Q_1 = Q_{23} = C_{eq}V = 2.67 \times 12 = 32\ \mu\mathrm{C}\).
        \(V_1 = Q_1/C_1 = 8.0\ \mathrm{V}\)، \(V_{23} = 12 - 8 = 4.0\ \mathrm{V}\)؛ \(Q_2 = C_2V_{23} = 8.0\ \mu\mathrm{C}\)، \(Q_3 = 24\ \mu\mathrm{C}\) (و\(Q_2 + Q_3 = 32\ \mu\mathrm{C}\) ✓).
        \[ U = \tfrac12 C_{eq}V^2 = \tfrac12(2.67\times10^{-6})(12)^2 = 192\ \mu\mathrm{J} \]
        تحقق: \(\tfrac12(32)(8) + \tfrac12(8)(4) + \tfrac12(24)(4) = 128 + 16 + 48 = 192\ \mu\mathrm{J}\) ✓.
  - title: { en: 'Two-loop circuit with Kirchhoff''s rules', ar: 'دارة بحلقتين وقانونا كيرشوف' }
    difficulty: 2
    statement:
      en: 'Three branches connect node \(a\) (top) to node \(b\) (bottom). Left branch: an ideal battery \(\mathcal E_1 = 12\ \mathrm{V}\) (positive terminal towards \(a\)) in series with \(R_1 = 2.0\ \Omega\). Middle branch: \(R_3 = 6.0\ \Omega\). Right branch: an ideal battery \(\mathcal E_2 = 6.0\ \mathrm{V}\) (positive terminal towards \(a\)) in series with \(R_2 = 4.0\ \Omega\). Find the current in each branch and \(V_a - V_b\), and check the power balance.'
      ar: 'ثلاثة فروع تصل العقدة \(a\) (في الأعلى) بالعقدة \(b\) (في الأسفل). الفرع الأيسر: بطارية مثالية \(\mathcal E_1 = 12\ \mathrm{V}\) (قطبها الموجب نحو \(a\)) على التسلسل مع \(R_1 = 2.0\ \Omega\). الفرع الأوسط: \(R_3 = 6.0\ \Omega\). الفرع الأيمن: بطارية مثالية \(\mathcal E_2 = 6.0\ \mathrm{V}\) (قطبها الموجب نحو \(a\)) على التسلسل مع \(R_2 = 4.0\ \Omega\). أوجد التيار في كل فرع و\(V_a - V_b\)، ثم تحقق من موازنة القدرات.'
    hint:
      en: 'Assume \(I_1\) and \(I_2\) flow up through the battery branches into \(a\) and \(I_3\) flows down through \(R_3\). A negative result just means the true direction is opposite.'
      ar: 'افترض أن \(I_1\) و\(I_2\) يصعدان عبر فرعي البطاريتين نحو \(a\)، وأن \(I_3\) ينزل عبر \(R_3\). النتيجة السالبة تعني فقط أن الاتجاه الحقيقي معاكس.'
    solution:
      en: |
        Junction \(a\): \(I_1 + I_2 = I_3\).
        Left loop: \(12 - 2I_1 - 6I_3 = 0\); right loop: \(6 - 4I_2 - 6I_3 = 0\).
        So \(I_1 = 6 - 3I_3\), \(I_2 = 1.5 - 1.5I_3\), and \(7.5 - 4.5I_3 = I_3\):
        \[ I_3 = \tfrac{15}{11} = 1.36\ \mathrm{A}, \quad I_1 = \tfrac{21}{11} = 1.91\ \mathrm{A}, \quad I_2 = -\tfrac{6}{11} = -0.545\ \mathrm{A} \]
        \(I_2 < 0\): current flows <em>into</em> the positive terminal of \(\mathcal E_2\), which is being charged.
        \(V_a - V_b = R_3 I_3 = 90/11 = 8.18\ \mathrm{V}\).
        Power: \(\mathcal E_1\) supplies \(12 \times 21/11 = 22.9\ \mathrm{W}\); \(\mathcal E_2\) absorbs \(6 \times 6/11 = 3.27\ \mathrm{W}\); resistors dissipate \(\sum RI^2 = 2376/121 = 19.6\ \mathrm{W}\); and \(22.9 - 3.27 = 19.6\ \mathrm{W}\) ✓.
      ar: |
        العقدة \(a\): \(I_1 + I_2 = I_3\).
        الحلقة اليسرى: \(12 - 2I_1 - 6I_3 = 0\)؛ الحلقة اليمنى: \(6 - 4I_2 - 6I_3 = 0\).
        إذن \(I_1 = 6 - 3I_3\) و\(I_2 = 1.5 - 1.5I_3\)، ومنه \(7.5 - 4.5I_3 = I_3\):
        \[ I_3 = \tfrac{15}{11} = 1.36\ \mathrm{A}, \quad I_1 = \tfrac{21}{11} = 1.91\ \mathrm{A}, \quad I_2 = -\tfrac{6}{11} = -0.545\ \mathrm{A} \]
        \(I_2 < 0\): يدخل التيار من القطب الموجب للبطارية \(\mathcal E_2\)، أي أنها في حالة شحن.
        \(V_a - V_b = R_3 I_3 = 90/11 = 8.18\ \mathrm{V}\).
        القدرات: تقدّم \(\mathcal E_1\) القدرة \(12 \times 21/11 = 22.9\ \mathrm{W}\)، وتمتص \(\mathcal E_2\) القدرة \(6 \times 6/11 = 3.27\ \mathrm{W}\)، وتبدد المقاومات \(\sum RI^2 = 2376/121 = 19.6\ \mathrm{W}\)؛ و\(22.9 - 3.27 = 19.6\ \mathrm{W}\) ✓.
  - title: { en: 'Sliding rod on rails', ar: 'قضيب منزلق على سكتين' }
    difficulty: 2
    statement:
      en: 'A conducting rod of length \(L = 0.50\ \mathrm{m}\) slides without friction at constant speed \(v = 2.0\ \mathrm{m/s}\) on two parallel rails joined by a resistor \(R = 2.0\ \Omega\). A uniform field \(B = 0.40\ \mathrm{T}\) is perpendicular to the plane of the rails. Neglecting the resistance of rod and rails, find the induced emf, the current, the force needed to keep \(v\) constant, and compare the mechanical power with the Joule power.'
      ar: 'قضيب ناقل طوله \(L = 0.50\ \mathrm{m}\) ينزلق دون احتكاك بسرعة ثابتة \(v = 2.0\ \mathrm{m/s}\) على سكتين متوازيتين تصل بينهما مقاومة \(R = 2.0\ \Omega\). يوجد حقل منتظم \(B = 0.40\ \mathrm{T}\) عمودي على مستوي السكتين. بإهمال مقاومة القضيب والسكتين، أوجد القوة المحركة الكهربائية المتحرَّضة، والتيار، والقوة اللازمة لإبقاء \(v\) ثابتة، ثم قارن القدرة الميكانيكية بقدرة جول.'
    hint:
      en: 'The flux through the circuit is \(\Phi_B = BLx\) and \(\dd x/\dd t = v\).'
      ar: 'التدفق عبر الدارة هو \(\Phi_B = BLx\) و\(\dd x/\dd t = v\).'
    solution:
      en: |
        \[ |\mathcal E| = \left|\dv{\Phi_B}{t}\right| = BLv = (0.40)(0.50)(2.0) = 0.40\ \mathrm{V}, \qquad I = \frac{\mathcal E}{R} = 0.20\ \mathrm{A} \]
        By Lenz's law the current opposes the increase of flux, so the magnetic force on the rod, \(F_B = ILB = (0.20)(0.50)(0.40) = 0.040\ \mathrm{N}\), opposes the motion. An external force of \(0.040\ \mathrm{N}\) is needed.
        Mechanical power \(P = Fv = 0.080\ \mathrm{W}\); Joule power \(RI^2 = 2.0 \times 0.040 = 0.080\ \mathrm{W}\) ✓ — the work done by the hand is entirely converted into heat in the resistor, as energy conservation requires.
      ar: |
        \[ |\mathcal E| = \left|\dv{\Phi_B}{t}\right| = BLv = (0.40)(0.50)(2.0) = 0.40\ \mathrm{V}, \qquad I = \frac{\mathcal E}{R} = 0.20\ \mathrm{A} \]
        حسب قانون لنز يعاكس التيار تزايد التدفق، فتكون القوة المغناطيسية على القضيب \(F_B = ILB = (0.20)(0.50)(0.40) = 0.040\ \mathrm{N}\) معاكسة للحركة، ويلزم تطبيق قوة خارجية مقدارها \(0.040\ \mathrm{N}\).
        القدرة الميكانيكية \(P = Fv = 0.080\ \mathrm{W}\)، وقدرة جول \(RI^2 = 2.0 \times 0.040 = 0.080\ \mathrm{W}\) ✓ — أي أن الشغل المبذول يتحول كليًا إلى حرارة في المقاومة، كما يقتضي مبدأ حفظ الطاقة.

quizzes:
  - title: { en: 'Charge, field and Gauss''s law', ar: 'الشحنة والحقل وقانون غاوس' }
    questions:
      - q:
          en: 'Two point charges exert a force \(F\) on each other. If both charges are doubled and their separation is also doubled, the new force is:'
          ar: 'تتبادل شحنتان نقطيتان قوة \(F\). إذا ضوعفت كلتا الشحنتين وضوعفت المسافة بينهما أيضًا، فإن القوة الجديدة تساوي:'
        options:
          - '\(2F\)'
          - '\(F\)'
          - '\(F/2\)'
          - '\(4F\)'
        answer: 1
        explain:
          en: '\(F = kq_1q_2/r^2\): the numerator is multiplied by 4 and the denominator by 4, so the force is unchanged.'
          ar: '\(F = kq_1q_2/r^2\): يُضرب البسط في 4 والمقام في 4، فتبقى القوة دون تغيير.'
      - q:
          en: 'What is the electric field at the midpoint between two equal positive charges?'
          ar: 'ما الحقل الكهربائي في منتصف المسافة بين شحنتين موجبتين متساويتين؟'
        options:
          - { en: 'perpendicular to the line joining them', ar: 'عمودي على المستقيم الواصل بينهما' }
          - { en: 'directed towards one of the charges', ar: 'متجه نحو إحدى الشحنتين' }
          - { en: 'twice the field of one charge', ar: 'ضعف حقل شحنة واحدة' }
          - { en: 'zero', ar: 'منعدم' }
        answer: 3
        explain:
          en: 'Each charge produces a field of the same magnitude pointing away from itself, i.e. in opposite directions at the midpoint: they cancel. (The potential there is not zero, however.)'
          ar: 'تنتج كل شحنة حقلًا له المقدار نفسه ويتجه مبتعدًا عنها، أي في اتجاهين متعاكسين عند المنتصف، فيلغي أحدهما الآخر. (لكن الكمون هناك ليس منعدمًا.)'
      - q:
          en: 'A closed surface encloses an electric dipole (\(+q\) and \(-q\)). The net electric flux through the surface is:'
          ar: 'سطح مغلق يحيط بثنائي قطب كهربائي (\(+q\) و\(-q\)). التدفق الكهربائي الكلي عبر السطح هو:'
        options:
          - '\(2q/\varepsilon_0\)'
          - '\(-q/\varepsilon_0\)'
          - '0'
          - '\(q/\varepsilon_0\)'
        answer: 2
        explain:
          en: 'Gauss''s law: \(\Phi = Q_{enc}/\varepsilon_0\) and \(Q_{enc} = +q - q = 0\). The field on the surface is not zero; only its total flux is.'
          ar: 'قانون غاوس: \(\Phi = Q_{enc}/\varepsilon_0\) و\(Q_{enc} = +q - q = 0\). الحقل على السطح ليس منعدمًا، وإنما تدفقه الكلي هو المنعدم.'
      - q:
          en: 'Inside the material of a conductor in electrostatic equilibrium, the electric field is:'
          ar: 'داخل مادة ناقل في حالة توازن كهروساكن، يكون الحقل الكهربائي:'
        options:
          - { en: 'tangent to the surface', ar: 'مماسيًا للسطح' }
          - { en: 'equal to \(\sigma/\varepsilon_0\)', ar: 'مساويًا لـ \(\sigma/\varepsilon_0\)' }
          - { en: 'radial and proportional to \(r\)', ar: 'قطريًا ومتناسبًا مع \(r\)' }
          - { en: 'zero', ar: 'منعدمًا' }
        answer: 3
        explain:
          en: 'If \(E\) were non-zero, free charges would move — contradicting equilibrium. Any excess charge resides on the surface, and just outside \(E = \sigma/\varepsilon_0\), perpendicular to the surface.'
          ar: 'لو لم يكن \(E\) منعدمًا لتحركت الشحنات الحرة، وهذا يناقض التوازن. وتتوزع الشحنة الزائدة على السطح، ويكون الحقل خارجه مباشرة \(E = \sigma/\varepsilon_0\) وعموديًا على السطح.'
      - q:
          en: 'The field of a large uniformly charged non-conducting sheet with surface density \(\sigma\) is:'
          ar: 'حقل صفيحة عازلة كبيرة مشحونة بانتظام بكثافة سطحية \(\sigma\) هو:'
        options:
          - { en: '\(\sigma/\varepsilon_0\), independent of distance', ar: '\(\sigma/\varepsilon_0\)، مستقل عن البعد' }
          - { en: 'proportional to \(1/r\)', ar: 'متناسب مع \(1/r\)' }
          - { en: '\(\sigma/2\varepsilon_0\), independent of distance', ar: '\(\sigma/2\varepsilon_0\)، مستقل عن البعد' }
          - { en: 'proportional to \(1/r^2\)', ar: 'متناسب مع \(1/r^2\)' }
        answer: 2
        explain:
          en: 'A Gaussian "pillbox" crossing the sheet has flux \(2EA = \sigma A/\varepsilon_0\), so \(E = \sigma/2\varepsilon_0\). The value \(\sigma/\varepsilon_0\) holds just outside a conductor, where the field exists on one side only.'
          ar: 'سطح غاوس أسطواني يخترق الصفيحة يعطي تدفقًا \(2EA = \sigma A/\varepsilon_0\)، إذن \(E = \sigma/2\varepsilon_0\). أما القيمة \(\sigma/\varepsilon_0\) فتصح خارج ناقل مباشرة، حيث يوجد الحقل في جهة واحدة فقط.'
  - title: { en: 'Potential and capacitance', ar: 'الكمون والسعة' }
    questions:
      - q:
          en: 'How much work does the electric field do on a charge moved along an equipotential surface?'
          ar: 'ما الشغل الذي ينجزه الحقل الكهربائي على شحنة تُنقل على سطح متساوي الكمون؟'
        options:
          - '\(qEd\)'
          - '\(qV\)'
          - { en: 'zero', ar: 'منعدم' }
          - { en: 'it depends on the path', ar: 'يتعلق بالمسار' }
        answer: 2
        explain:
          en: '\(W = -q\Delta V\) and \(\Delta V = 0\) on an equipotential; equivalently, \(\vec E\) is perpendicular to the surface and thus to the displacement.'
          ar: '\(W = -q\Delta V\) و\(\Delta V = 0\) على سطح متساوي الكمون؛ وبعبارة أخرى، \(\vec E\) عمودي على السطح ومن ثم على الانتقال.'
      - q:
          en: 'In a region the potential is \(V(x) = 5x^2\) (V, with \(x\) in m). What is \(E_x\) at \(x = 2\ \mathrm{m}\)?'
          ar: 'في منطقة ما يُعطى الكمون بـ \(V(x) = 5x^2\) (بالفولط، و\(x\) بالمتر). ما قيمة \(E_x\) عند \(x = 2\ \mathrm{m}\)؟'
        options:
          - '\(-10\ \mathrm{V/m}\)'
          - '\(+20\ \mathrm{V}\)'
          - '\(-20\ \mathrm{V/m}\)'
          - '\(+20\ \mathrm{V/m}\)'
        answer: 2
        explain:
          en: '\(E_x = -\dd V/\dd x = -10x = -20\ \mathrm{V/m}\): the field points towards decreasing potential, here the \(-x\) direction.'
          ar: '\(E_x = -\dd V/\dd x = -10x = -20\ \mathrm{V/m}\): يتجه الحقل نحو تناقص الكمون، أي في الاتجاه \(-x\) هنا.'
      - q:
          en: 'A proton is accelerated from rest through a potential difference of \(1000\ \mathrm{V}\). Its kinetic energy is:'
          ar: 'يُسرَّع بروتون من السكون عبر فرق كمون \(1000\ \mathrm{V}\). طاقته الحركية تساوي:'
        options:
          - '\(1\ \mathrm{keV} = 1.6\times10^{-16}\ \mathrm{J}\)'
          - '\(1\ \mathrm{MeV}\)'
          - '\(1000\ \mathrm{J}\)'
          - '\(1.6\times10^{-19}\ \mathrm{J}\)'
        answer: 0
        explain:
          en: '\(K = e\Delta V = (1.6\times10^{-19}\ \mathrm{C})(1000\ \mathrm{V}) = 1.6\times10^{-16}\ \mathrm{J} = 1000\ \mathrm{eV}\).'
          ar: '\(K = e\Delta V = (1.6\times10^{-19}\ \mathrm{C})(1000\ \mathrm{V}) = 1.6\times10^{-16}\ \mathrm{J} = 1000\ \mathrm{eV}\).'
      - q:
          en: 'A parallel-plate capacitor stays connected to a battery while its plate separation is doubled. The charge on its plates:'
          ar: 'مكثفة مستوية تبقى موصولة ببطارية بينما تُضاعف المسافة بين لبوسيها. الشحنة على لبوسيها:'
        options:
          - { en: 'is halved', ar: 'تنقص إلى النصف' }
          - { en: 'is unchanged', ar: 'لا تتغير' }
          - { en: 'is multiplied by 4', ar: 'تُضرب في 4' }
          - { en: 'is doubled', ar: 'تتضاعف' }
        answer: 0
        explain:
          en: '\(C = \varepsilon_0A/d\) is halved; the battery keeps \(V\) fixed, so \(Q = CV\) is halved. (If the capacitor were isolated, \(Q\) would stay fixed and \(V\) would double.)'
          ar: '\(C = \varepsilon_0A/d\) تنقص إلى النصف، والبطارية تُبقي \(V\) ثابتًا، إذن \(Q = CV\) تنقص إلى النصف. (لو كانت المكثفة معزولة لبقيت \(Q\) ثابتة وتضاعف \(V\).)'
      - q:
          en: 'Capacitors of \(2\ \mu\mathrm{F}\) and \(3\ \mu\mathrm{F}\) are connected in series. The equivalent capacitance is:'
          ar: 'مكثفتان سعتاهما \(2\ \mu\mathrm{F}\) و\(3\ \mu\mathrm{F}\) موصولتان على التسلسل. السعة المكافئة هي:'
        options:
          - '\(1.2\ \mu\mathrm{F}\)'
          - '\(2.5\ \mu\mathrm{F}\)'
          - '\(5\ \mu\mathrm{F}\)'
          - '\(6\ \mu\mathrm{F}\)'
        answer: 0
        explain:
          en: '\(1/C = 1/2 + 1/3 = 5/6\), so \(C = 6/5 = 1.2\ \mu\mathrm{F}\) — always smaller than the smallest capacitor in the series.'
          ar: '\(1/C = 1/2 + 1/3 = 5/6\)، إذن \(C = 6/5 = 1.2\ \mu\mathrm{F}\) — وهي دائمًا أصغر من أصغر سعة في التسلسل.'
  - title: { en: 'Current and DC circuits', ar: 'التيار ودارات التيار المستمر' }
    questions:
      - q:
          en: 'A wire is replaced by one of the same material, twice as long and with twice the diameter. Its resistance is:'
          ar: 'استُبدل سلك بآخر من المادة نفسها طوله ضعف الأول وقطره ضعف الأول. مقاومته:'
        options:
          - { en: 'halved', ar: 'تنقص إلى النصف' }
          - { en: 'unchanged', ar: 'لا تتغير' }
          - { en: 'doubled', ar: 'تتضاعف' }
          - { en: 'divided by 4', ar: 'تُقسم على 4' }
        answer: 0
        explain:
          en: '\(R = \rho L/A\): \(L\) is doubled and \(A \propto d^2\) is multiplied by 4, so \(R\) is multiplied by \(2/4 = 1/2\).'
          ar: '\(R = \rho L/A\): يتضاعف \(L\) وتُضرب \(A \propto d^2\) في 4، إذن تُضرب \(R\) في \(2/4 = 1/2\).'
      - q:
          en: 'Three identical resistors \(R\) are connected in parallel. The equivalent resistance is:'
          ar: 'ثلاث مقاومات متماثلة \(R\) موصولة على التفرع. المقاومة المكافئة هي:'
        options:
          - '\(3R\)'
          - '\(R\)'
          - '\(2R/3\)'
          - '\(R/3\)'
        answer: 3
        explain:
          en: '\(1/R_{eq} = 3/R\), so \(R_{eq} = R/3\), smaller than each branch.'
          ar: '\(1/R_{eq} = 3/R\)، إذن \(R_{eq} = R/3\)، وهي أصغر من مقاومة كل فرع.'
      - q:
          en: 'Kirchhoff''s junction rule is a consequence of:'
          ar: 'قانون العقد لكيرشوف هو نتيجة لـ:'
        options:
          - { en: 'Coulomb''s law', ar: 'قانون كولوم' }
          - { en: 'Ohm''s law', ar: 'قانون أوم' }
          - { en: 'conservation of electric charge', ar: 'انحفاظ الشحنة الكهربائية' }
          - { en: 'conservation of energy', ar: 'حفظ الطاقة' }
        answer: 2
        explain:
          en: 'Charge cannot accumulate at a node in steady state, so what flows in must flow out. The loop rule, in contrast, expresses energy conservation.'
          ar: 'لا يمكن للشحنة أن تتراكم في عقدة في النظام الدائم، فما يدخلها يخرج منها. أما قانون الحلقات فيعبّر عن حفظ الطاقة.'
      - q:
          en: 'A capacitor charges through \(R = 10\ \mathrm{k\Omega}\) with \(C = 100\ \mu\mathrm{F}\). After one time constant, the charge has reached what fraction of its final value?'
          ar: 'تُشحن مكثفة \(C = 100\ \mu\mathrm{F}\) عبر مقاومة \(R = 10\ \mathrm{k\Omega}\). بعد مرور ثابت زمن واحد، ما النسبة التي بلغتها الشحنة من قيمتها النهائية؟'
        options:
          - { en: '50 % (after \(\tau = 0.1\ \mathrm{s}\))', ar: '50 % (بعد \(\tau = 0.1\ \mathrm{s}\))' }
          - { en: 'about 63 % (after \(\tau = 1\ \mathrm{s}\))', ar: 'نحو 63 % (بعد \(\tau = 1\ \mathrm{s}\))' }
          - { en: 'about 37 % (after \(\tau = 1\ \mathrm{s}\))', ar: 'نحو 37 % (بعد \(\tau = 1\ \mathrm{s}\))' }
          - { en: '100 % (after \(\tau = 1\ \mathrm{ms}\))', ar: '100 % (بعد \(\tau = 1\ \mathrm{ms}\))' }
        answer: 1
        explain:
          en: '\(\tau = RC = (10^4)(10^{-4}) = 1\ \mathrm{s}\) and \(q(\tau) = Q_f(1 - e^{-1}) = 0.632\,Q_f\). The value 37 % is what remains during a <em>discharge</em>.'
          ar: '\(\tau = RC = (10^4)(10^{-4}) = 1\ \mathrm{s}\) و\(q(\tau) = Q_f(1 - e^{-1}) = 0.632\,Q_f\). أما النسبة 37 % فهي ما يتبقى أثناء <em>التفريغ</em>.'
      - q:
          en: 'A 60 W and a 100 W bulb, both rated for the same voltage, are connected in series to that voltage. Which glows brighter?'
          ar: 'مصباحان 60 W و100 W مصمَّمان للجهد نفسه وُصلا على التسلسل بذلك الجهد. أيهما يتوهج أكثر؟'
        options:
          - { en: 'the 100 W bulb', ar: 'المصباح 100 W' }
          - { en: 'the 60 W bulb', ar: 'المصباح 60 W' }
          - { en: 'neither lights up', ar: 'لا يضيء أي منهما' }
          - { en: 'both equally', ar: 'كلاهما بالقدر نفسه' }
        answer: 1
        explain:
          en: 'From \(P = V^2/R\), the 60 W bulb has the larger resistance. In series both carry the same current, and \(P = I^2R\) is larger for the larger \(R\).'
          ar: 'من \(P = V^2/R\) تكون مقاومة المصباح 60 W أكبر. وفي التسلسل يمر التيار نفسه في المصباحين، فتكون \(P = I^2R\) أكبر للمقاومة الأكبر.'
  - title: { en: 'Magnetism and induction', ar: 'المغناطيسية والتحريض' }
    questions:
      - q:
          en: 'A charged particle moves parallel to a uniform magnetic field. The magnetic force on it is:'
          ar: 'جسيم مشحون يتحرك موازيًا لحقل مغناطيسي منتظم. القوة المغناطيسية المؤثرة فيه:'
        options:
          - { en: 'directed towards the centre of a circle', ar: 'متجهة نحو مركز دائرة' }
          - { en: 'parallel to \(\vec B\)', ar: 'موازية لـ \(\vec B\)' }
          - '\(qvB\)'
          - { en: 'zero', ar: 'منعدمة' }
        answer: 3
        explain:
          en: '\(\vec F = q\vec v\times\vec B\) and the cross product of parallel vectors is zero; the particle continues in a straight line.'
          ar: '\(\vec F = q\vec v\times\vec B\)، والجداء المتجهي لمتجهين متوازيين منعدم، فيواصل الجسيم حركته في خط مستقيم.'
      - q:
          en: 'A charged particle moves on a circle perpendicular to a uniform field \(B\). If its speed is doubled, the radius of the circle:'
          ar: 'جسيم مشحون يتحرك على دائرة عمودية على حقل منتظم \(B\). إذا ضوعفت سرعته فإن نصف قطر الدائرة:'
        options:
          - { en: 'doubles', ar: 'يتضاعف' }
          - { en: 'is multiplied by 4', ar: 'يُضرب في 4' }
          - { en: 'is unchanged', ar: 'لا يتغير' }
          - { en: 'halves', ar: 'ينقص إلى النصف' }
        answer: 0
        explain:
          en: '\(qvB = mv^2/r \Rightarrow r = mv/|q|B\propto v\). The period \(2\pi m/|q|B\), however, does not depend on speed (cyclotron principle).'
          ar: '\(qvB = mv^2/r \Rightarrow r = mv/|q|B\propto v\). أما الدور \(2\pi m/|q|B\) فلا يتعلق بالسرعة (مبدأ السيكلوترون).'
      - q:
          en: 'Two long parallel wires carry currents in the <em>same</em> direction. They:'
          ar: 'سلكان طويلان متوازيان يحملان تيارين في الاتجاه <em>نفسه</em>. فإنهما:'
        options:
          - { en: 'exert no force', ar: 'لا يتبادلان أي قوة' }
          - { en: 'repel each other', ar: 'يتنافران' }
          - { en: 'exert a torque only', ar: 'يتبادلان عزمًا فقط' }
          - { en: 'attract each other', ar: 'يتجاذبان' }
        answer: 3
        explain:
          en: 'The field of wire 1 at wire 2 combined with \(\vec F = I\vec L\times\vec B\) gives a force towards wire 1, of magnitude \(\mu_0 I_1I_2L/2\pi d\). Antiparallel currents repel.'
          ar: 'حقل السلك 1 عند السلك 2 مع العلاقة \(\vec F = I\vec L\times\vec B\) يعطي قوة نحو السلك 1 مقدارها \(\mu_0 I_1I_2L/2\pi d\). أما التياران المتعاكسان فيتنافران.'
      - q:
          en: 'The north pole of a bar magnet is pushed towards a closed wire loop. The induced current in the loop:'
          ar: 'يُقرَّب القطب الشمالي لمغناطيس مستقيم من حلقة سلكية مغلقة. التيار المتحرَّض في الحلقة:'
        options:
          - { en: 'makes the loop attract the magnet', ar: 'يجعل الحلقة تجذب المغناطيس' }
          - { en: 'produces a field in the same direction as the magnet''s', ar: 'ينتج حقلًا في اتجاه حقل المغناطيس نفسه' }
          - { en: 'makes the loop repel the magnet', ar: 'يجعل الحلقة تنافر المغناطيس' }
          - { en: 'is zero because the magnet is not inside the loop', ar: 'منعدم لأن المغناطيس ليس داخل الحلقة' }
        answer: 2
        explain:
          en: 'Lenz''s law: the induced current opposes the increase of flux, so the face of the loop towards the magnet becomes a north pole and repels it. Otherwise energy would be created from nothing.'
          ar: 'قانون لنز: يعاكس التيار المتحرَّض تزايد التدفق، فيصبح وجه الحلقة المقابل للمغناطيس قطبًا شماليًا وينافره. ولو حدث العكس لتولدت طاقة من العدم.'
      - q:
          en: 'At fixed current, the number of turns per unit length of a long solenoid is doubled. The field inside:'
          ar: 'عند تيار ثابت، ضوعف عدد اللفات في وحدة الطول لوشيعة حلزونية طويلة. الحقل داخلها:'
        options:
          - { en: 'halves', ar: 'ينقص إلى النصف' }
          - { en: 'is multiplied by 4', ar: 'يُضرب في 4' }
          - { en: 'doubles', ar: 'يتضاعف' }
          - { en: 'is unchanged', ar: 'لا يتغير' }
        answer: 2
        explain:
          en: 'Ampère''s law gives \(B = \mu_0 n I\) inside a long solenoid, proportional to \(n\). (The self-inductance \(L = \mu_0 n^2 A\ell\), however, is multiplied by 4.)'
          ar: 'يعطي قانون أمبير \(B = \mu_0 n I\) داخل وشيعة طويلة، أي أنه متناسب مع \(n\). (أما الذاتية \(L = \mu_0 n^2 A\ell\) فتُضرب في 4.)'


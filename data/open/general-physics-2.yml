glossary:
  - { en: 'Electric charge', ar: 'الشحنة الكهربائية', fr: 'Charge électrique', def: { en: 'Conserved, quantised property of matter (\(e = 1.602\times10^{-19}\ \mathrm{C}\)) that is the source of electric fields.', ar: 'خاصية للمادة محفوظة ومكمّاة (\(e = 1.602\times10^{-19}\ \mathrm{C}\))، وهي مصدر الحقول الكهربائية.' } }
  - { en: 'Coulomb''s law', ar: 'قانون كولوم', fr: 'Loi de Coulomb', def: { en: 'Force between point charges: \(F = k|q_1q_2|/r^2\), with \(k = 1/4\pi\varepsilon_0\).', ar: 'القوة بين شحنتين نقطيتين \(F = k|q_1q_2|/r^2\) حيث \(k = 1/4\pi\varepsilon_0\).' } }
  - { en: 'Electric field', ar: 'الحقل الكهربائي', fr: 'Champ électrique', def: { en: 'Force per unit positive test charge, \(\vec E = \vec F/q_0\); unit N/C = V/m.', ar: 'القوة لكل وحدة شحنة اختبار موجبة \(\vec E = \vec F/q_0\)؛ وحدته N/C = V/m.' } }
  - { en: 'Field line', ar: 'خط الحقل', fr: 'Ligne de champ', def: { en: 'Curve tangent to \(\vec E\) everywhere; lines start on positive and end on negative charges.', ar: 'منحنى يمس \(\vec E\) في كل نقطة؛ تبدأ الخطوط من الشحنات الموجبة وتنتهي عند السالبة.' } }
  - { en: 'Superposition principle', ar: 'مبدأ التراكب', fr: 'Principe de superposition', def: { en: 'The total field (or force) is the vector sum of the contributions of each source.', ar: 'الحقل (أو القوة) الكلي هو المجموع المتجهي لمساهمات كل مصدر.' } }
  - { en: 'Electric dipole moment', ar: 'عزم ثنائي القطب الكهربائي', fr: 'Moment dipolaire électrique', def: { en: '\(\vec p = q\vec d\), from \(-q\) to \(+q\); in a field it feels the torque \(\vec\tau = \vec p\times\vec E\).', ar: '\(\vec p = q\vec d\) يتجه من \(-q\) إلى \(+q\)؛ ويخضع في حقل لعزم مزدوجة \(\vec\tau = \vec p\times\vec E\).' } }
  - { en: 'Electric flux', ar: 'التدفق الكهربائي', fr: 'Flux électrique', def: { en: '\(\Phi_E = \int\vec E\cdot\dd\vec A\), the "number of field lines" crossing a surface.', ar: '\(\Phi_E = \int\vec E\cdot\dd\vec A\)، ويمثل "عدد خطوط الحقل" التي تعبر سطحًا.' } }
  - { en: 'Gauss''s law', ar: 'قانون غاوس', fr: 'Théorème de Gauss', def: { en: '\(\oint\vec E\cdot\dd\vec A = Q_{enc}/\varepsilon_0\) for any closed surface.', ar: '\(\oint\vec E\cdot\dd\vec A = Q_{enc}/\varepsilon_0\) لأي سطح مغلق.' } }
  - { en: 'Permittivity of free space', ar: 'سماحية الفراغ', fr: 'Permittivité du vide', def: { en: '\(\varepsilon_0 = 8.85\times10^{-12}\ \mathrm{C^2/(N\,m^2)}\).', ar: '\(\varepsilon_0 = 8.85\times10^{-12}\ \mathrm{C^2/(N\,m^2)}\).' } }
  - { en: 'Electric potential', ar: 'الكمون الكهربائي', fr: 'Potentiel électrique', def: { en: 'Potential energy per unit charge, \(V = U/q_0\); \(\Delta V = -\int\vec E\cdot\dd\vec s\); unit volt.', ar: 'طاقة الوضع لكل وحدة شحنة \(V = U/q_0\)؛ \(\Delta V = -\int\vec E\cdot\dd\vec s\)؛ ووحدته الفولط.' } }
  - { en: 'Equipotential surface', ar: 'سطح متساوي الكمون', fr: 'Surface équipotentielle', def: { en: 'Surface of constant \(V\); always perpendicular to field lines.', ar: 'سطح يكون عليه \(V\) ثابتًا، وهو دائمًا عمودي على خطوط الحقل.' } }
  - { en: 'Electron-volt', ar: 'الإلكترون فولط', fr: 'Électron-volt', def: { en: 'Energy gained by charge \(e\) through 1 V: \(1\ \mathrm{eV} = 1.602\times10^{-19}\ \mathrm{J}\).', ar: 'الطاقة التي تكتسبها الشحنة \(e\) عبر فرق كمون 1 V: \(1\ \mathrm{eV} = 1.602\times10^{-19}\ \mathrm{J}\).' } }
  - { en: 'Capacitance', ar: 'السعة', fr: 'Capacité', def: { en: '\(C = Q/V\); for a parallel-plate capacitor \(C = \varepsilon_0A/d\); unit farad.', ar: '\(C = Q/V\)؛ وللمكثفة المستوية \(C = \varepsilon_0A/d\)؛ ووحدتها الفاراد.' } }
  - { en: 'Dielectric', ar: 'العازل الكهربائي', fr: 'Diélectrique', def: { en: 'Insulator that polarises in a field and multiplies capacitance by its dielectric constant \(\kappa\).', ar: 'مادة عازلة تستقطب في الحقل وتضرب السعة في ثابت العزل \(\kappa\).' } }
  - { en: 'Electric current', ar: 'التيار الكهربائي', fr: 'Courant électrique', def: { en: 'Rate of charge flow through a cross-section, \(I = \dd q/\dd t\); unit ampere.', ar: 'معدل تدفق الشحنة عبر مقطع \(I = \dd q/\dd t\)؛ ووحدته الأمبير.' } }
  - { en: 'Resistivity', ar: 'المقاومية', fr: 'Résistivité', def: { en: 'Material property \(\rho = E/J\); a wire has \(R = \rho L/A\).', ar: 'خاصية للمادة \(\rho = E/J\)؛ ومقاومة سلك \(R = \rho L/A\).' } }
  - { en: 'Ohm''s law', ar: 'قانون أوم', fr: 'Loi d''Ohm', def: { en: '\(V = RI\) with \(R\) independent of \(V\) (ohmic conductor).', ar: '\(V = RI\) حيث \(R\) لا تتعلق بـ \(V\) (ناقل أومي).' } }
  - { en: 'Electromotive force (emf)', ar: 'القوة المحركة الكهربائية', fr: 'Force électromotrice', def: { en: 'Work per unit charge done by a source to move charge around a circuit, \(\mathcal E\); unit volt.', ar: 'الشغل لكل وحدة شحنة الذي ينجزه مولد لتحريك الشحنة في الدارة \(\mathcal E\)؛ ووحدتها الفولط.' } }
  - { en: 'Kirchhoff''s rules', ar: 'قانونا كيرشوف', fr: 'Lois de Kirchhoff', def: { en: 'Junction rule \(\sum I = 0\) (charge conservation) and loop rule \(\sum\Delta V = 0\) (energy conservation).', ar: 'قانون العقد \(\sum I = 0\) (انحفاظ الشحنة) وقانون الحلقات \(\sum\Delta V = 0\) (حفظ الطاقة).' } }
  - { en: 'Time constant', ar: 'ثابت الزمن', fr: 'Constante de temps', def: { en: '\(\tau = RC\) (or \(L/R\)): time for a transient to change by a factor \(e\).', ar: '\(\tau = RC\) (أو \(L/R\)): الزمن اللازم ليتغير النظام الانتقالي بمعامل \(e\).' } }
  - { en: 'Magnetic field', ar: 'الحقل المغناطيسي', fr: 'Champ magnétique', def: { en: 'Field \(\vec B\) defined by the force on a moving charge; unit tesla.', ar: 'حقل \(\vec B\) يُعرَّف بالقوة المؤثرة في شحنة متحركة؛ ووحدته التسلا.' } }
  - { en: 'Lorentz force', ar: 'قوة لورنتز', fr: 'Force de Lorentz', def: { en: '\(\vec F = q(\vec E + \vec v\times\vec B)\).', ar: '\(\vec F = q(\vec E + \vec v\times\vec B)\).' } }
  - { en: 'Biot–Savart law', ar: 'قانون بيو-سافار', fr: 'Loi de Biot et Savart', def: { en: '\(\dd\vec B = \dfrac{\mu_0}{4\pi}\dfrac{I\,\dd\vec s\times\hat r}{r^2}\): field of a current element.', ar: '\(\dd\vec B = \dfrac{\mu_0}{4\pi}\dfrac{I\,\dd\vec s\times\hat r}{r^2}\): حقل عنصر تيار.' } }
  - { en: 'Ampère''s law', ar: 'قانون أمبير', fr: 'Théorème d''Ampère', def: { en: '\(\oint\vec B\cdot\dd\vec s = \mu_0 I_{enc}\) for any closed loop (steady currents).', ar: '\(\oint\vec B\cdot\dd\vec s = \mu_0 I_{enc}\) لأي مسار مغلق (تيارات مستقرة).' } }
  - { en: 'Magnetic flux', ar: 'التدفق المغناطيسي', fr: 'Flux magnétique', def: { en: '\(\Phi_B = \int\vec B\cdot\dd\vec A\); unit weber.', ar: '\(\Phi_B = \int\vec B\cdot\dd\vec A\)؛ ووحدته الويبر.' } }
  - { en: 'Faraday''s law', ar: 'قانون فاراداي', fr: 'Loi de Faraday', def: { en: 'Induced emf \(\mathcal E = -\dd\Phi_B/\dd t\) (times \(N\) for a coil of \(N\) turns).', ar: 'القوة المحركة الكهربائية المتحرَّضة \(\mathcal E = -\dd\Phi_B/\dd t\) (مضروبة في \(N\) لوشيعة من \(N\) لفة).' } }
  - { en: 'Lenz''s law', ar: 'قانون لنز', fr: 'Loi de Lenz', def: { en: 'The induced current flows so as to oppose the change of flux that produces it.', ar: 'يسري التيار المتحرَّض في اتجاه يعاكس تغيّر التدفق الذي أحدثه.' } }
  - { en: 'Self-inductance', ar: 'الذاتية (معامل التحريض الذاتي)', fr: 'Inductance propre', def: { en: '\(L = N\Phi_B/I\); a coil opposes changes of current with \(\mathcal E_L = -L\,\dd I/\dd t\); unit henry.', ar: '\(L = N\Phi_B/I\)؛ تعاكس الوشيعة تغيرات التيار بقوة \(\mathcal E_L = -L\,\dd I/\dd t\)؛ ووحدتها الهنري.' } }
  - { en: 'Hall effect', ar: 'ظاهرة هول', fr: 'Effet Hall', def: { en: 'Transverse voltage across a current-carrying conductor in a magnetic field; used to measure \(B\).', ar: 'فرق كمون عرضي يظهر في ناقل يحمل تيارًا داخل حقل مغناطيسي، ويُستعمل لقياس \(B\).' } }


description:
  en: |
    <p>This course brings together the two complementary views of heat and temperature. <strong>Classical thermodynamics</strong> describes macroscopic systems through a handful of state variables and three general laws, independent of any microscopic model. <strong>Statistical mechanics</strong> explains those laws from the behaviour of very large numbers of atoms, using probability and the Boltzmann factor.</p>
    <p>We start from temperature, probability and the Boltzmann distribution. Then we develop the first, second and third laws, entropy (including its information-theoretic meaning), heat engines, thermodynamic potentials and Maxwell relations. The second half introduces the partition function and the canonical and grand canonical ensembles. These are applied to the ideal gas, to real gases, to black-body radiation (photons), to the heat capacity of solids (phonons) and to quantum gases obeying Bose–Einstein and Fermi–Dirac statistics.</p>
    <p>Weekly problem sets are central to the course. Solving problems yourself, step by step and with honest effort, is the only way to master the material. Short experiments (Rüchardt's method for \(\gamma\), a toy heat engine) and a Carnot-cycle simulation connect the formalism to real systems.</p>
  ar: |
    <p>يجمع هذا المقرر بين نظرتين متكاملتين إلى الحرارة ودرجة الحرارة. فـ<strong>الديناميكا الحرارية الكلاسيكية</strong> تصف الأنظمة العيانية بعدد قليل من متغيرات الحالة وثلاثة قوانين عامة لا تعتمد على أي نموذج مجهري. أما <strong>الميكانيكا الإحصائية</strong> فتفسّر هذه القوانين انطلاقًا من سلوك أعداد هائلة من الذرات، مستعينةً بالاحتمالات وعامل بولتزمان.</p>
    <p>نبدأ بدرجة الحرارة والاحتمالات وتوزيع بولتزمان. ثم نطوّر القوانين الأول والثاني والثالث، والإنتروبيا (بما في ذلك معناها في نظرية المعلومات)، والآلات الحرارية، والكمونات الترموديناميكية وعلاقات ماكسويل. ويقدّم النصف الثاني دالة التجزئة والمجموعتين القانونية والقانونية الكبرى. ونطبّقها على الغاز المثالي، والغازات الحقيقية، وإشعاع الجسم الأسود (الفوتونات)، والسعة الحرارية للأجسام الصلبة (الفونونات)، والغازات الكمومية الخاضعة لإحصاء بوز-أينشتاين وفيرمي-ديراك.</p>
    <p>تحتل أوراق المسائل الأسبوعية مكانة محورية في المقرر. فحلّ المسائل بنفسك، خطوةً بخطوة وبجهد صادق، هو السبيل الوحيد لإتقان المادة. وتربط تجارب قصيرة (طريقة روشارت لقياس \(\gamma\)، وآلة حرارية بسيطة) ومحاكاةٌ لدورة كارنو هذا الإطار النظري بأنظمة حقيقية.</p>


  - { en: Partition function & equipartition, ar: دالة التجزئة وتساوي توزيع الطاقة }
  - { en: Ideal and real gases, ar: الغازات المثالية والحقيقية }
  - { en: Chemical potential & grand ensemble, ar: الكمون الكيميائي والمجموعة القانونية الكبرى }
  - { en: Photons & phonons, ar: الفوتونات والفونونات }
  - { en: Bose–Einstein & Fermi–Dirac gases, ar: غازات بوز-أينشتاين وفيرمي-ديراك }

outcomes:
  - id: CLO1
    bloom: understand
    domain: knowledge
    text:
      en: Explain temperature, the Boltzmann factor and entropy from a statistical (microstate counting) point of view.
      ar: يشرح درجة الحرارة وعامل بولتزمان والإنتروبيا من منظور إحصائي (عدّ الحالات المجهرية).
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO2
    bloom: apply
    domain: knowledge
    text:
      en: State the three laws of thermodynamics and apply them to processes, cycles and heat engines (work, heat, efficiency, entropy changes).
      ar: يصوغ قوانين الديناميكا الحرارية الثلاثة ويطبّقها على التحولات والدورات والآلات الحرارية (الشغل، الحرارة، الكفاءة، تغيرات الإنتروبيا).
    assessed_by: [quizzes, homework, midterm1, final]
  - id: CLO3
    bloom: analyze
    domain: skills
    text:
      en: Derive thermodynamic relations using the potentials \(U, H, F, G\) and Maxwell relations, and use them to compute measurable quantities.
      ar: 'يستنتج العلاقات الترموديناميكية باستعمال الكمونات \(U, H, F, G\) وعلاقات ماكسويل، ويوظّفها في حساب مقادير قابلة للقياس.'
    assessed_by: [homework, midterm1, final]
  - id: CLO4
    bloom: apply
    domain: skills
    text:
      en: Construct the partition function of simple systems in the canonical and grand canonical ensembles and derive from it \(U\), \(F\), \(S\), \(C_V\) and the equation of state.
      ar: 'يبني دالة التجزئة لأنظمة بسيطة في المجموعتين القانونية والقانونية الكبرى، ويستنتج منها \(U\) و\(F\) و\(S\) و\(C_V\) ومعادلة الحالة.'
    assessed_by: [quizzes, homework, midterm2, final]
  - id: CLO5
    bloom: analyze
    domain: knowledge
    text:
      en: Analyse the thermal properties of the classical ideal gas and of gases beyond the ideal approximation (van der Waals, virial expansion).
      ar: يحلّل الخصائص الحرارية للغاز المثالي الكلاسيكي وللغازات خارج التقريب المثالي (معادلة فان دير فالس، النشر الفيريالي).
    assessed_by: [homework, midterm2, final]
  - id: CLO6
    bloom: apply
    domain: knowledge
    text:
      en: Apply Bose–Einstein and Fermi–Dirac statistics to photons, phonons, conduction electrons and Bose condensates.
      ar: يطبّق إحصاء بوز-أينشتاين وفيرمي-ديراك على الفوتونات والفونونات وإلكترونات التوصيل وتكاثفات بوز.
    assessed_by: [quizzes, midterm2, project, final]
  - id: CLO7
    bloom: evaluate
    domain: skills
    text:
      en: Use a short computation or simulation to evaluate a thermal property (e.g. Einstein vs Debye heat capacity) and judge the validity of approximations in a written report.
      ar: يستعمل حسابًا أو محاكاة قصيرة لتقييم خاصية حرارية (مثل السعة الحرارية وفق نموذجي أينشتاين وديباي) ويحكم على صلاحية التقريبات في تقرير مكتوب.
    assessed_by: [project]
  - id: CLO8
    bloom: apply
    domain: values
    text:
      en: Work independently and with academic integrity, presenting complete, clear and logically checked solutions.
      ar: يعمل باستقلالية ونزاهة أكاديمية، ويقدّم حلولًا كاملة وواضحة ومتحقَّقًا من منطقها.
    assessed_by: [homework, project]

assessment:
  - id: quizzes
    type: quiz
    weight: 10
    title: { en: Short quizzes, ar: اختبارات قصيرة }
    detail:
      en: Four 15-minute quizzes at the end of each chapter (basic concepts, classical thermodynamics, statistical mechanics, quantum gases). Conceptual questions and one short calculation.
      ar: أربعة اختبارات قصيرة مدة كلٍّ منها 15 دقيقة في نهاية كل فصل (مفاهيم أساسية، ديناميكا حرارية كلاسيكية، ميكانيكا إحصائية، غازات كمومية). أسئلة مفاهيمية ومسألة حسابية قصيرة.
    when: { en: 'Weeks 2, 5, 9, 13', ar: الأسابيع 2، 5، 9، 13 }
  - id: homework
    type: homework
    weight: 15
    title: { en: Weekly problem sets, ar: أوراق المسائل الأسبوعية }
    detail:
      en: Eleven problem sets, each due one week after release. Graded on correctness, clarity of reasoning and completeness. Write your own solutions; copying is a breach of academic integrity.
      ar: إحدى عشرة ورقة مسائل، تُسلَّم كلٌّ منها بعد أسبوع من نشرها. تُقيَّم على صحة الحل ووضوح الاستدلال واكتماله. اكتب حلولك بنفسك، فالنقل خرقٌ للنزاهة الأكاديمية.
    when: { en: Weeks 2–14, ar: الأسابيع 2–14 }
  - id: midterm1
    type: midterm
    weight: 15
    title: { en: First periodic exam, ar: الاختبار الدوري الأول }
    detail:
      en: 'One hour, in class. Covers basic concepts, probability and classical thermodynamics (first, second and third laws, potentials).'
      ar: 'ساعة واحدة داخل القاعة. يغطي المفاهيم الأساسية والاحتمالات والديناميكا الحرارية الكلاسيكية (القوانين الأول والثاني والثالث، الكمونات).'
    when: { en: Week 7, ar: الأسبوع 7 }
  - id: midterm2
    type: midterm
    weight: 15
    title: { en: Second periodic exam, ar: الاختبار الدوري الثاني }
    detail:
      en: One hour, in class. Covers equipartition, the partition function, the ideal gas, the chemical potential, photons and phonons.
      ar: ساعة واحدة داخل القاعة. يغطي تساوي توزيع الطاقة ودالة التجزئة والغاز المثالي والكمون الكيميائي والفوتونات والفونونات.
    when: { en: Week 12, ar: الأسبوع 12 }
  - id: project
    type: project
    weight: 5
    title: { en: Computational mini-project, ar: مشروع حسابي مصغّر }
    detail:
      en: A short numerical study (e.g. Einstein vs Debye heat capacity, or the Fermi–Dirac distribution vs temperature) with a 3–4 page report. Graded on correctness, figures and discussion of approximations.
      ar: دراسة عددية قصيرة (مثل مقارنة السعة الحرارية وفق نموذجي أينشتاين وديباي، أو تغيّر توزيع فيرمي-ديراك مع درجة الحرارة) مع تقرير من 3 إلى 4 صفحات. يُقيَّم على صحة النتائج والأشكال ومناقشة التقريبات.
    when: { en: 'Assigned week 10, due week 13', ar: يُكلَّف به في الأسبوع 10 ويُسلَّم في الأسبوع 13 }
  - id: final
    type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }
    detail:
      en: Two hours, comprehensive, with emphasis on statistical mechanics and quantum gases.
      ar: ساعتان، شامل لكل المقرر مع تركيز على الميكانيكا الإحصائية والغازات الكمومية.
    when: { en: Final exam period, ar: فترة الاختبارات النهائية }

schedule:
  - week: 1
    title: { en: Basic concepts, ar: مفاهيم أساسية }
    topics:
      en: [Overview of the course, 'Macroscopic vs microscopic descriptions; the mole, thermal equilibrium', 'Heat and heat capacity']
      ar: [نظرة عامة على المقرر, 'الوصف العياني والوصف المجهري؛ المول والتوازن الحراري', 'الحرارة والسعة الحرارية']
    reading: Blundell & Blundell Ch. 1–2
  - week: 2
    title: { en: 'Probability, temperature and the Boltzmann distribution', ar: الاحتمالات ودرجة الحرارة وتوزيع بولتزمان }
    topics:
      en: ['Discrete and continuous probability distributions, mean and variance', 'Statistical definition of temperature, \(1/k_BT = \dd \ln\Omega/\dd E\)', 'The Boltzmann factor; Maxwell–Boltzmann speed distribution']
      ar: ['التوزيعات الاحتمالية المتقطعة والمتصلة، المتوسط والتباين', 'التعريف الإحصائي لدرجة الحرارة \(1/k_BT = \dd \ln\Omega/\dd E\)', 'عامل بولتزمان؛ توزيع ماكسويل-بولتزمان للسرعات']
    reading: Blundell & Blundell Ch. 3–5
    activity: { en: Problem set 1 released; Quiz 1, ar: نشر ورقة المسائل 1؛ الاختبار القصير 1 }
    milestone: quiz
  - week: 3
    title: { en: The first law, ar: القانون الأول }
    topics:
      en: ['Internal energy, work and heat; functions of state', 'Heat capacities \(C_V\) and \(C_p\)', 'Isothermal and adiabatic processes, \(pV^\gamma=\text{const}\)']
      ar: ['الطاقة الداخلية والشغل والحرارة؛ دوال الحالة', 'السعتان الحراريتان \(C_V\) و\(C_p\)', 'التحولات متساوية درجة الحرارة والكظومة، \(pV^\gamma=\text{const}\)']
    reading: Blundell & Blundell Ch. 11–12
    activity: { en: Problem set 2; Rüchardt experiment for \(\gamma\), ar: ورقة المسائل 2؛ تجربة روشارت لقياس \(\gamma\) }
  - week: 4
    title: { en: The second law and entropy, ar: القانون الثاني والإنتروبيا }
    topics:
      en: ['Heat engines, the Carnot cycle and its efficiency', 'Kelvin and Clausius statements; Clausius inequality', 'Entropy, \(\dd S = \dd Q_\text{rev}/T\); Joule expansion', 'Information theory and Shannon entropy*']
      ar: ['الآلات الحرارية ودورة كارنو وكفاءتها', 'صيغتا كلفن وكلاوزيوس؛ متباينة كلاوزيوس', 'الإنتروبيا \(\dd S = \dd Q_\text{rev}/T\)؛ تمدد جول', 'نظرية المعلومات وإنتروبيا شانون*']
    reading: Blundell & Blundell Ch. 13–15
    activity: { en: Problem set 3; Carnot-cycle simulation, ar: ورقة المسائل 3؛ محاكاة دورة كارنو }
  - week: 5
    title: { en: Thermodynamic potentials, ar: الكمونات الترموديناميكية }
    topics:
      en: ['Enthalpy, Helmholtz and Gibbs free energies', 'Maxwell relations and their use', 'Availability and equilibrium conditions']
      ar: ['الإنثالبي وطاقتا هلمهولتز وجيبس الحرتان', 'علاقات ماكسويل وتطبيقاتها', 'الطاقة المتاحة وشروط التوازن']
    reading: Blundell & Blundell Ch. 16
    activity: { en: Problem set 4; Quiz 2, ar: ورقة المسائل 4؛ الاختبار القصير 2 }
    milestone: quiz
  - week: 6
    title: { en: 'Rods, bubbles, magnets and the third law', ar: القضبان والفقاعات والمغانط والقانون الثالث }
    topics:
      en: ['Thermodynamics of elastic rods, surface tension and paramagnets', 'The third law: Nernst statement and consequences', 'Review for the first exam']
      ar: ['ديناميكا حرارية للقضبان المرنة والتوتر السطحي والمواد البارامغناطيسية', 'القانون الثالث: صيغة نيرنست ونتائجها', 'مراجعة للاختبار الأول']
    reading: Blundell & Blundell Ch. 17–18
    milestone: review
  - week: 7
    title: { en: Equipartition of energy, ar: تساوي توزيع الطاقة }
    topics:
      en: ['Equipartition theorem: \(\tfrac12 k_BT\) per quadratic degree of freedom', 'Heat capacity of gases and solids; failure at low temperature', First periodic exam]
      ar: ['مبرهنة تساوي توزيع الطاقة: \(\tfrac12 k_BT\) لكل درجة حرية تربيعية', 'السعة الحرارية للغازات والأجسام الصلبة؛ إخفاق المبرهنة في درجات الحرارة المنخفضة', الاختبار الدوري الأول]
    reading: Blundell & Blundell Ch. 19
    activity: { en: Problem set 5, ar: ورقة المسائل 5 }
    milestone: midterm
  - week: 8
    title: { en: The partition function, ar: دالة التجزئة }
    topics:
      en: ['Canonical ensemble, \(Z=\sum_i e^{-\beta E_i}\)', 'Obtaining \(U, F, S, C_V\) from \(\ln Z\)', 'Two-level system and harmonic oscillator; combining partition functions']
      ar: ['المجموعة القانونية، \(Z=\sum_i e^{-\beta E_i}\)', 'استخراج \(U, F, S, C_V\) من \(\ln Z\)', 'نظام المستويين والمهتز التوافقي؛ تركيب دوال التجزئة']
    reading: Blundell & Blundell Ch. 20
    activity: { en: Problem set 6, ar: ورقة المسائل 6 }
  - week: 9
    title: { en: Statistical mechanics of the ideal gas, ar: الميكانيكا الإحصائية للغاز المثالي }
    topics:
      en: ['Single-particle partition function and the thermal wavelength \(\lambda_{th}\)', 'Indistinguishability, the \(N!\) factor and the Gibbs paradox', 'Sackur–Tetrode entropy; internal degrees of freedom']
      ar: ['دالة التجزئة لجسيم واحد وطول الموجة الحراري \(\lambda_{th}\)', 'عدم التمايز، العامل \(N!\) ومفارقة جيبس', 'إنتروبيا ساكور-تترود؛ درجات الحرية الداخلية']
    reading: Blundell & Blundell Ch. 21
    activity: { en: Problem set 7; Quiz 3, ar: ورقة المسائل 7؛ الاختبار القصير 3 }
    milestone: quiz
  - week: 10
    title: { en: Chemical potential and the grand partition function, ar: الكمون الكيميائي ودالة التجزئة الكبرى }
    topics:
      en: ['Chemical potential \(\mu\) and particle exchange', 'Grand canonical ensemble and grand potential \(\Phi_G=-k_BT\ln\mathcal{Z}\)', 'Chemical reactions and equilibrium']
      ar: ['الكمون الكيميائي \(\mu\) وتبادل الجسيمات', 'المجموعة القانونية الكبرى والكمون الأكبر \(\Phi_G=-k_BT\ln\mathcal{Z}\)', 'التفاعلات الكيميائية والتوازن']
    reading: Blundell & Blundell Ch. 22
    activity: { en: Problem set 8; mini-project assigned, ar: ورقة المسائل 8؛ تكليف المشروع المصغّر }
    milestone: project
  - week: 11
    title: { en: Photons and phonons, ar: الفوتونات والفونونات }
    topics:
      en: ['Black-body radiation, Planck law, Stefan–Boltzmann law', 'Einstein model of a solid', 'Debye model and the \(T^3\) law']
      ar: ['إشعاع الجسم الأسود، قانون بلانك، قانون ستيفان-بولتزمان', 'نموذج أينشتاين للجسم الصلب', 'نموذج ديباي وقانون \(T^3\)']
    reading: Blundell & Blundell Ch. 23–24
  - week: 12
    title: { en: Relativistic and real gases, ar: الغازات النسبوية والحقيقية }
    topics:
      en: ['Ultra-relativistic gas', 'Van der Waals gas, virial expansion, Joule and Joule–Kelvin expansions', Second periodic exam]
      ar: ['الغاز فائق النسبوية', 'غاز فان دير فالس، النشر الفيريالي، تمدد جول وتمدد جول-كلفن', الاختبار الدوري الثاني]
    reading: Blundell & Blundell Ch. 25–26
    activity: { en: Problem set 9, ar: ورقة المسائل 9 }
    milestone: midterm
  - week: 13
    title: { en: Bose–Einstein and Fermi–Dirac distributions, ar: توزيعا بوز-أينشتاين وفيرمي-ديراك }
    topics:
      en: ['Exchange symmetry: bosons and fermions', 'Derivation of \(\bar n = 1/(e^{\beta(E-\mu)}\mp 1)\)', 'Classical limit and density of states']
      ar: ['تناظر التبادل: البوزونات والفرميونات', 'استنتاج \(\bar n = 1/(e^{\beta(E-\mu)}\mp 1)\)', 'النهاية الكلاسيكية وكثافة الحالات']
    reading: Blundell & Blundell Ch. 29
    activity: { en: Problem set 10; Quiz 4; mini-project due, ar: ورقة المسائل 10؛ الاختبار القصير 4؛ تسليم المشروع المصغّر }

exam_guide:
  format:
    en: Periodic exams last 60 minutes and contain 3–4 problems, usually one conceptual question plus derivations and short calculations. The final exam lasts 2 hours, is comprehensive and contains 5–6 problems of increasing difficulty.
    ar: تدوم الاختبارات الدورية 60 دقيقة وتتضمن 3 إلى 4 مسائل، عادةً سؤال مفاهيمي إلى جانب استنتاجات وحسابات قصيرة. ويدوم الاختبار النهائي ساعتين، وهو شامل ويتضمن 5 إلى 6 مسائل متدرجة الصعوبة.
  allowed:
    en: A non-programmable scientific calculator. A sheet of physical constants and standard integrals (Gaussian, Bose and Fermi integrals) is provided with the paper; personal notes are not allowed.
    ar: آلة حاسبة علمية غير قابلة للبرمجة. تُرفق بورقة الاختبار ورقة بالثوابت الفيزيائية والتكاملات المعيارية (تكاملات غاوس وبوز وفيرمي)؛ ولا يُسمح بالمذكرات الشخصية.
  tips:
    - en: Always start by identifying the system, the constraints (fixed \(T\), \(V\), \(N\)?) and therefore the natural potential or ensemble.
      ar: 'ابدأ دائمًا بتحديد النظام والقيود (هل \(T\) و\(V\) و\(N\) ثابتة؟) ومن ثمّ الكمون أو المجموعة الإحصائية المناسبة.'
    - en: For entropy changes in irreversible processes, compute along a reversible path between the same end states — entropy is a function of state.
      ar: لحساب تغيّر الإنتروبيا في التحولات غير العكوسة، احسبه على مسار عكوس بين الحالتين نفسيهما؛ فالإنتروبيا دالة حالة.
    - en: Once you have \(\ln Z\), every thermodynamic quantity follows by differentiation. Write \(Z\) carefully first, then differentiate.
      ar: 'بمجرد حصولك على \(\ln Z\) تُستخرج كل المقادير الترموديناميكية بالاشتقاق. اكتب \(Z\) بعناية أولًا ثم اشتق.'
    - en: Check limits — high and low temperature, classical limit, dimensions — before handing in an answer.
      ar: تحقق من النهايات (درجات الحرارة المرتفعة والمنخفضة، النهاية الكلاسيكية) ومن الأبعاد قبل تسليم الإجابة.
    - en: Practise with the past papers under timed conditions; most questions are close variants of problem-set exercises.
      ar: تدرّب على الاختبارات السابقة في زمن محدد؛ فمعظم الأسئلة صيغ قريبة من تمارين أوراق المسائل.

problems:
  - title: { en: Two-level system and the Schottky anomaly, ar: نظام المستويين وشذوذ شوتكي }
    difficulty: 1
    statement:
      en: |
        A solid contains \(N\) independent, distinguishable impurities, each with two energy levels \(0\) and \(\varepsilon>0\), in equilibrium at temperature \(T\).
        (a) Write the single-particle partition function. (b) Find the internal energy \(U(T)\). (c) Find the heat capacity \(C(T)\) and its behaviour at low and high temperature.
      ar: |
        يحتوي جسم صلب على \(N\) شائبة مستقلة وقابلة للتمييز، لكلٍّ منها مستويا طاقة \(0\) و\(\varepsilon>0\)، في حالة توازن عند درجة الحرارة \(T\).
        (أ) اكتب دالة التجزئة لجسيم واحد. (ب) أوجد الطاقة الداخلية \(U(T)\). (ج) أوجد السعة الحرارية \(C(T)\) وسلوكها عند درجات الحرارة المنخفضة والمرتفعة.
    hint:
      en: 'Use \(U = -N\,\partial \ln Z_1/\partial\beta\) and \(C = \dd U/\dd T\). Introduce \(x = \beta\varepsilon = \varepsilon/k_BT\).'
      ar: 'استعمل \(U = -N\,\partial \ln Z_1/\partial\beta\) و\(C = \dd U/\dd T\). وضع \(x = \beta\varepsilon = \varepsilon/k_BT\).'
    solution:
      en: |
        (a) \(Z_1 = 1 + e^{-\beta\varepsilon}\).
        (b) \[U = -N\pdv{\ln Z_1}{\beta} = \frac{N\varepsilon\, e^{-\beta\varepsilon}}{1+e^{-\beta\varepsilon}} = \frac{N\varepsilon}{e^{\beta\varepsilon}+1}.\]
        (c) With \(x=\varepsilon/k_BT\), \(\dd x/\dd T = -x/T\):
        \[C = \dv{U}{T} = N k_B\, \frac{x^2 e^{x}}{(e^{x}+1)^2}.\]
        Low \(T\) (\(x\gg1\)): \(C \approx N k_B x^2 e^{-x}\to 0\) exponentially — too little thermal energy to excite the upper level.
        High \(T\) (\(x\ll1\)): \(C \approx N k_B x^2/4 \to 0\) — both levels are almost equally populated and \(U\to N\varepsilon/2\) saturates.
        Between these limits \(C\) has a maximum (the <em>Schottky anomaly</em>) at \(x\approx 2.40\), i.e. \(k_BT\approx 0.42\,\varepsilon\), with \(C_\text{max}\approx 0.44\,Nk_B\).
      ar: |
        (أ) \(Z_1 = 1 + e^{-\beta\varepsilon}\).
        (ب) \[U = -N\pdv{\ln Z_1}{\beta} = \frac{N\varepsilon\, e^{-\beta\varepsilon}}{1+e^{-\beta\varepsilon}} = \frac{N\varepsilon}{e^{\beta\varepsilon}+1}.\]
        (ج) بوضع \(x=\varepsilon/k_BT\) حيث \(\dd x/\dd T = -x/T\):
        \[C = \dv{U}{T} = N k_B\, \frac{x^2 e^{x}}{(e^{x}+1)^2}.\]
        عند \(T\) المنخفضة (\(x\gg1\)): \(C \approx N k_B x^2 e^{-x}\to 0\) أسيًّا، لأن الطاقة الحرارية لا تكفي لإثارة المستوى الأعلى.
        عند \(T\) المرتفعة (\(x\ll1\)): \(C \approx N k_B x^2/4 \to 0\)، إذ يتساوى إشغال المستويين تقريبًا وتتشبّع \(U\to N\varepsilon/2\).
        وبين هاتين النهايتين تبلغ \(C\) قيمة عظمى (<em>شذوذ شوتكي</em>) عند \(x\approx 2.40\) أي \(k_BT\approx 0.42\,\varepsilon\)، حيث \(C_\text{max}\approx 0.44\,Nk_B\).
  - title: { en: Entropy of the universe when heating water, ar: إنتروبيا الكون عند تسخين الماء }
    difficulty: 2
    statement:
      en: |
        A 1.00 kg sample of water at \(20^\circ\text{C}\) is placed in thermal contact with a large reservoir at \(80^\circ\text{C}\) and reaches equilibrium. Take \(c = 4186\ \text{J kg}^{-1}\text{K}^{-1}\), constant.
        Compute the entropy change of (a) the water, (b) the reservoir, (c) the universe. Comment on the sign of (c).
      ar: |
        توضع كتلة 1.00 kg من الماء عند \(20^\circ\text{C}\) في تماس حراري مع خزان حراري كبير عند \(80^\circ\text{C}\) حتى تبلغ التوازن. خذ \(c = 4186\ \text{J kg}^{-1}\text{K}^{-1}\) ثابتة.
        احسب تغيّر الإنتروبيا (أ) للماء، (ب) للخزان، (ج) للكون. علّق على إشارة (ج).
    hint:
      en: 'The water''s entropy change is computed along a reversible heating path: \(\dd S = mc\,\dd T/T\). The reservoir stays at fixed \(T\).'
      ar: 'يُحسب تغيّر إنتروبيا الماء على مسار تسخين عكوس: \(\dd S = mc\,\dd T/T\). أما الخزان فتبقى درجة حرارته ثابتة.'
    solution:
      en: |
        \(T_1 = 293.15\ \text{K}\), \(T_2 = 353.15\ \text{K}\).
        (a) \[\Delta S_\text{w} = mc\ln\frac{T_2}{T_1} = 4186\,\ln\frac{353.15}{293.15} \approx +779\ \text{J/K}.\]
        (b) The reservoir gives \(Q = mc\,(T_2-T_1) = 4186\times 60 = 2.51\times10^5\ \text{J}\) at constant \(T_2\):
        \[\Delta S_\text{res} = -\frac{Q}{T_2} = -\frac{2.51\times10^5}{353.15}\approx -711\ \text{J/K}.\]
        (c) \(\Delta S_\text{univ} = 779 - 711 \approx +68\ \text{J/K} > 0\).
        Heat flowing across a finite temperature difference is irreversible, so the total entropy increases, as the second law requires.
      ar: |
        \(T_1 = 293.15\ \text{K}\) و\(T_2 = 353.15\ \text{K}\).
        (أ) \[\Delta S_\text{w} = mc\ln\frac{T_2}{T_1} = 4186\,\ln\frac{353.15}{293.15} \approx +779\ \text{J/K}.\]
        (ب) يعطي الخزان حرارة \(Q = mc\,(T_2-T_1) = 4186\times 60 = 2.51\times10^5\ \text{J}\) عند درجة الحرارة الثابتة \(T_2\):
        \[\Delta S_\text{res} = -\frac{Q}{T_2} = -\frac{2.51\times10^5}{353.15}\approx -711\ \text{J/K}.\]
        (ج) \(\Delta S_\text{univ} = 779 - 711 \approx +68\ \text{J/K} > 0\).
        انتقال الحرارة عبر فرق منتهٍ في درجة الحرارة عملية غير عكوسة، لذا تزداد الإنتروبيا الكلية كما يقتضي القانون الثاني.
  - title: { en: Van der Waals gas in a Joule expansion, ar: غاز فان دير فالس في تمدد جول }
    difficulty: 2
    statement:
      en: |
        (a) Using a Maxwell relation, show that \(\left(\pdv{U}{V}\right)_T = T\left(\pdv{p}{T}\right)_V - p\).
        (b) For \(n\) moles of a van der Waals gas, \(\left(p + \frac{an^2}{V^2}\right)(V-nb) = nRT\), evaluate \((\partial U/\partial V)_T\).
        (c) The gas expands freely into vacuum (Joule expansion) from \(V_1\) to \(V_2\). Assuming \(C_V\) constant, find the temperature change.
      ar: |
        (أ) باستعمال إحدى علاقات ماكسويل، بيّن أن \(\left(\pdv{U}{V}\right)_T = T\left(\pdv{p}{T}\right)_V - p\).
        (ب) من أجل \(n\) مول من غاز فان دير فالس \(\left(p + \frac{an^2}{V^2}\right)(V-nb) = nRT\)، احسب \((\partial U/\partial V)_T\).
        (ج) يتمدد الغاز تمددًا حرًّا في الفراغ (تمدد جول) من \(V_1\) إلى \(V_2\). بافتراض \(C_V\) ثابتة، أوجد تغيّر درجة الحرارة.
    hint:
      en: 'Start from \(\dd U = T\dd S - p\dd V\) and use \((\partial S/\partial V)_T = (\partial p/\partial T)_V\) from \(\dd F = -S\dd T - p\dd V\). In a Joule expansion \(\Delta U = 0\).'
      ar: 'انطلق من \(\dd U = T\dd S - p\dd V\) واستعمل \((\partial S/\partial V)_T = (\partial p/\partial T)_V\) المستخرجة من \(\dd F = -S\dd T - p\dd V\). في تمدد جول يكون \(\Delta U = 0\).'
    solution:
      en: |
        (a) Dividing \(\dd U = T\dd S - p\dd V\) by \(\dd V\) at constant \(T\): \((\partial U/\partial V)_T = T(\partial S/\partial V)_T - p\). The Maxwell relation from \(F\) gives \((\partial S/\partial V)_T=(\partial p/\partial T)_V\), hence the result.
        (b) \(p = \dfrac{nRT}{V-nb} - \dfrac{an^2}{V^2}\), so \(T(\partial p/\partial T)_V = \dfrac{nRT}{V-nb}\) and
        \[\left(\pdv{U}{V}\right)_T = \frac{an^2}{V^2}.\]
        (For an ideal gas, \(a=0\) and \(U\) depends on \(T\) only.)
        (c) \(\dd U = C_V\dd T + \dfrac{an^2}{V^2}\dd V = 0\), so
        \[\Delta T = -\frac{an^2}{C_V}\left(\frac{1}{V_1}-\frac{1}{V_2}\right) < 0 .\]
        The gas cools: work is done against the attractive intermolecular forces (the \(a\) term).
      ar: |
        (أ) بقسمة \(\dd U = T\dd S - p\dd V\) على \(\dd V\) عند \(T\) ثابتة: \((\partial U/\partial V)_T = T(\partial S/\partial V)_T - p\). وتعطي علاقة ماكسويل المستخرجة من \(F\) أن \((\partial S/\partial V)_T=(\partial p/\partial T)_V\)، ومنه النتيجة.
        (ب) \(p = \dfrac{nRT}{V-nb} - \dfrac{an^2}{V^2}\)، إذن \(T(\partial p/\partial T)_V = \dfrac{nRT}{V-nb}\) و
        \[\left(\pdv{U}{V}\right)_T = \frac{an^2}{V^2}.\]
        (في الغاز المثالي \(a=0\) فتتعلق \(U\) بدرجة الحرارة وحدها.)
        (ج) \(\dd U = C_V\dd T + \dfrac{an^2}{V^2}\dd V = 0\)، إذن
        \[\Delta T = -\frac{an^2}{C_V}\left(\frac{1}{V_1}-\frac{1}{V_2}\right) < 0 .\]
        يبرد الغاز، لأنه يبذل شغلًا ضد قوى التجاذب بين الجزيئات (الحد \(a\)).
  - title: { en: Ideal gas from the partition function (Sackur–Tetrode), ar: الغاز المثالي من دالة التجزئة (معادلة ساكور-تترود) }
    difficulty: 3
    statement:
      en: |
        For \(N\) indistinguishable monatomic particles of mass \(m\) in a volume \(V\), the single-particle partition function is \(Z_1 = V/\lambda^3\) with \(\lambda = h/\sqrt{2\pi m k_BT}\).
        Using \(Z_N = Z_1^N/N!\) and Stirling's formula, derive \(F\), the equation of state, \(U\) and the entropy \(S\). When is this treatment valid?
      ar: |
        من أجل \(N\) جسيمًا أحادي الذرة غير قابل للتمييز، كتلة كلٍّ منها \(m\)، في حجم \(V\)، دالة التجزئة لجسيم واحد هي \(Z_1 = V/\lambda^3\) حيث \(\lambda = h/\sqrt{2\pi m k_BT}\).
        باستعمال \(Z_N = Z_1^N/N!\) وصيغة ستيرلنغ، استنتج \(F\) ومعادلة الحالة و\(U\) والإنتروبيا \(S\). متى تكون هذه المعالجة صالحة؟
    hint:
      en: '\(\ln N! \approx N\ln N - N\); \(F=-k_BT\ln Z_N\); \(p = -(\partial F/\partial V)_T\); \(S = (U-F)/T\); note \(\lambda^3 \propto \beta^{3/2}\).'
      ar: '\(\ln N! \approx N\ln N - N\)؛ \(F=-k_BT\ln Z_N\)؛ \(p = -(\partial F/\partial V)_T\)؛ \(S = (U-F)/T\)؛ ولاحظ أن \(\lambda^3 \propto \beta^{3/2}\).'
    solution:
      en: |
        \[\ln Z_N = N\ln\frac{V}{\lambda^3} - N\ln N + N \;\Rightarrow\; F = -Nk_BT\left[\ln\frac{V}{N\lambda^3}+1\right].\]
        Equation of state: \(p = -(\partial F/\partial V)_T = Nk_BT/V\), i.e. \(pV = Nk_BT\).
        Energy: since \(\ln Z_N = -\tfrac{3N}{2}\ln\beta + (\text{terms independent of }\beta)\),
        \[U = -\pdv{\ln Z_N}{\beta} = \frac{3N}{2\beta} = \tfrac32 Nk_BT .\]
        Entropy:
        \[S = \frac{U-F}{T} = Nk_B\left[\ln\frac{V}{N\lambda^3} + \frac52\right]\quad\text{(Sackur–Tetrode)}.\]
        The \(1/N!\) makes \(S\) extensive (it resolves the Gibbs paradox). The treatment is valid when the gas is non-degenerate, \(n\lambda^3 \ll 1\): the mean interparticle spacing is much larger than the thermal wavelength, so each state is rarely multiply occupied.
      ar: |
        \[\ln Z_N = N\ln\frac{V}{\lambda^3} - N\ln N + N \;\Rightarrow\; F = -Nk_BT\left[\ln\frac{V}{N\lambda^3}+1\right].\]
        معادلة الحالة: \(p = -(\partial F/\partial V)_T = Nk_BT/V\)، أي \(pV = Nk_BT\).
        الطاقة: بما أن \(\ln Z_N = -\tfrac{3N}{2}\ln\beta + (\text{حدود لا تتعلق بـ }\beta)\)،
        \[U = -\pdv{\ln Z_N}{\beta} = \frac{3N}{2\beta} = \tfrac32 Nk_BT .\]
        الإنتروبيا:
        \[S = \frac{U-F}{T} = Nk_B\left[\ln\frac{V}{N\lambda^3} + \frac52\right]\quad\text{(Sackur–Tetrode)}.\]
        يجعل العامل \(1/N!\) الإنتروبيا مقدارًا شاملًا (وبه تُحلّ مفارقة جيبس). وتصح المعالجة عندما يكون الغاز غير منحلّ، \(n\lambda^3 \ll 1\): أي أن المسافة المتوسطة بين الجسيمات أكبر بكثير من طول الموجة الحراري، فنادرًا ما تُشغَل الحالة الواحدة بأكثر من جسيم.
  - title: { en: Einstein model of a solid, ar: نموذج أينشتاين للجسم الصلب }
    difficulty: 2
    statement:
      en: |
        Model a solid of \(N\) atoms as \(3N\) independent quantum harmonic oscillators of the same angular frequency \(\omega\), with energies \(E_n = (n+\tfrac12)\hbar\omega\).
        Find the mean energy and the heat capacity, and discuss the high- and low-temperature limits.
      ar: |
        نمذج جسمًا صلبًا من \(N\) ذرة بـ \(3N\) مهتزًّا توافقيًّا كموميًّا مستقلًّا لها التردد الزاوي نفسه \(\omega\)، وطاقاتها \(E_n = (n+\tfrac12)\hbar\omega\).
        أوجد الطاقة المتوسطة والسعة الحرارية، وناقش النهايتين عند درجات الحرارة المرتفعة والمنخفضة.
    hint:
      en: 'Sum the geometric series for \(Z_1\). Use \(x = \hbar\omega/k_BT\) and expand \(e^x\) for small \(x\).'
      ar: 'اجمع المتسلسلة الهندسية لحساب \(Z_1\). استعمل \(x = \hbar\omega/k_BT\) ونشر \(e^x\) عند \(x\) الصغيرة.'
    solution:
      en: |
        \[Z_1 = \sum_{n=0}^{\infty} e^{-\beta\hbar\omega(n+1/2)} = \frac{e^{-\beta\hbar\omega/2}}{1-e^{-\beta\hbar\omega}},\qquad
        \expval{E} = -\pdv{\ln Z_1}{\beta} = \frac{\hbar\omega}{2} + \frac{\hbar\omega}{e^{\beta\hbar\omega}-1}.\]
        For \(3N\) oscillators, \(U = 3N\expval{E}\) and with \(x=\hbar\omega/k_BT\):
        \[C_V = 3Nk_B\,\frac{x^2 e^{x}}{(e^{x}-1)^2}.\]
        High \(T\) (\(x\ll1\)): \((e^x-1)^2\approx x^2\), so \(C_V\to 3Nk_B = 3R\) per mole — the Dulong–Petit law, as equipartition predicts.
        Low \(T\) (\(x\gg1\)): \(C_V\approx 3Nk_B x^2 e^{-x}\), which vanishes exponentially. Experiment shows \(C_V\propto T^3\): a single frequency cannot describe the low-energy acoustic phonons, which is corrected by the Debye model.
      ar: |
        \[Z_1 = \sum_{n=0}^{\infty} e^{-\beta\hbar\omega(n+1/2)} = \frac{e^{-\beta\hbar\omega/2}}{1-e^{-\beta\hbar\omega}},\qquad
        \expval{E} = -\pdv{\ln Z_1}{\beta} = \frac{\hbar\omega}{2} + \frac{\hbar\omega}{e^{\beta\hbar\omega}-1}.\]
        من أجل \(3N\) مهتزًّا يكون \(U = 3N\expval{E}\)، وبوضع \(x=\hbar\omega/k_BT\):
        \[C_V = 3Nk_B\,\frac{x^2 e^{x}}{(e^{x}-1)^2}.\]
        عند \(T\) المرتفعة (\(x\ll1\)): \((e^x-1)^2\approx x^2\)، فإن \(C_V\to 3Nk_B = 3R\) لكل مول، وهو قانون ديولونغ-بوتي كما تتنبأ مبرهنة تساوي توزيع الطاقة.
        عند \(T\) المنخفضة (\(x\gg1\)): \(C_V\approx 3Nk_B x^2 e^{-x}\) وتتلاشى أسيًّا. غير أن التجربة تُظهر أن \(C_V\propto T^3\)؛ فتردد وحيد لا يصف الفونونات الصوتية منخفضة الطاقة، وهو ما يصحّحه نموذج ديباي.
  - title: { en: Fermi energy of conduction electrons in copper, ar: طاقة فيرمي لإلكترونات التوصيل في النحاس }
    difficulty: 3
    statement:
      en: |
        Copper has \(n = 8.47\times10^{28}\) conduction electrons per m³. Treating them as an ideal Fermi gas (spin \(\tfrac12\)) at \(T=0\):
        (a) derive \(E_F = \dfrac{\hbar^2}{2m}(3\pi^2 n)^{2/3}\) and evaluate it in eV, together with the Fermi temperature \(T_F\);
        (b) using \(C_\text{el}\approx \dfrac{\pi^2}{2}Nk_B\dfrac{T}{T_F}\), compare the electronic heat capacity at 300 K with the classical value \(\tfrac32 Nk_B\).
      ar: |
        يحتوي النحاس على \(n = 8.47\times10^{28}\) إلكترون توصيل في كل m³. بمعاملتها كغاز فيرمي مثالي (اللف المغزلي \(\tfrac12\)) عند \(T=0\):
        (أ) استنتج \(E_F = \dfrac{\hbar^2}{2m}(3\pi^2 n)^{2/3}\) واحسب قيمتها بالإلكترون-فولت مع درجة حرارة فيرمي \(T_F\)؛
        (ب) باستعمال \(C_\text{el}\approx \dfrac{\pi^2}{2}Nk_B\dfrac{T}{T_F}\)، قارن السعة الحرارية الإلكترونية عند 300 K بالقيمة الكلاسيكية \(\tfrac32 Nk_B\).
    hint:
      en: At \(T=0\) all states inside the Fermi sphere of radius \(k_F\) are filled, two electrons (spin up and down) per \(k\)-state; each \(k\)-state occupies \((2\pi)^3/V\) of \(k\)-space.
      ar: 'عند \(T=0\) تُملأ كل الحالات داخل كرة فيرمي ذات نصف القطر \(k_F\)، بإلكترونين (لف مغزلي علوي وسفلي) لكل حالة \(k\)؛ وتشغل كل حالة \(k\) حجمًا قدره \((2\pi)^3/V\) من فضاء \(k\).'
    solution:
      en: |
        (a) Counting states: \(N = 2\cdot\dfrac{V}{(2\pi)^3}\cdot\dfrac{4\pi k_F^3}{3}\Rightarrow n = \dfrac{k_F^3}{3\pi^2}\), so \(k_F = (3\pi^2 n)^{1/3}\) and \(E_F = \hbar^2k_F^2/2m\) gives the formula.
        Numerically \(k_F = (3\pi^2\times 8.47\times10^{28})^{1/3} = 1.36\times10^{10}\ \text{m}^{-1}\) and
        \[E_F = \frac{(1.055\times10^{-34})^2(1.36\times10^{10})^2}{2\times 9.11\times10^{-31}} \approx 1.13\times10^{-18}\ \text{J}\approx 7.0\ \text{eV},\qquad T_F = \frac{E_F}{k_B}\approx 8.2\times10^{4}\ \text{K}.\]
        (b) At 300 K, \(T/T_F\approx 3.7\times10^{-3}\):
        \[C_\text{el}\approx \frac{\pi^2}{2}\times 3.7\times10^{-3}\,Nk_B \approx 0.018\,Nk_B,\]
        about 1% of the classical \(1.5\,Nk_B\). Only electrons within \(\sim k_BT\) of \(E_F\) can be excited (Pauli exclusion), which explains why conduction electrons contribute so little to the heat capacity of metals at room temperature.
      ar: |
        (أ) بعدّ الحالات: \(N = 2\cdot\dfrac{V}{(2\pi)^3}\cdot\dfrac{4\pi k_F^3}{3}\Rightarrow n = \dfrac{k_F^3}{3\pi^2}\)، إذن \(k_F = (3\pi^2 n)^{1/3}\)، ومن \(E_F = \hbar^2k_F^2/2m\) نحصل على الصيغة.
        عدديًّا \(k_F = (3\pi^2\times 8.47\times10^{28})^{1/3} = 1.36\times10^{10}\ \text{m}^{-1}\) و
        \[E_F = \frac{(1.055\times10^{-34})^2(1.36\times10^{10})^2}{2\times 9.11\times10^{-31}} \approx 1.13\times10^{-18}\ \text{J}\approx 7.0\ \text{eV},\qquad T_F = \frac{E_F}{k_B}\approx 8.2\times10^{4}\ \text{K}.\]
        (ب) عند 300 K تكون \(T/T_F\approx 3.7\times10^{-3}\):
        \[C_\text{el}\approx \frac{\pi^2}{2}\times 3.7\times10^{-3}\,Nk_B \approx 0.018\,Nk_B,\]
        أي نحو 1% من القيمة الكلاسيكية \(1.5\,Nk_B\). فلا يمكن إثارة إلا الإلكترونات الواقعة ضمن \(\sim k_BT\) من \(E_F\) (مبدأ الاستبعاد لباولي)، وهذا ما يفسّر ضآلة إسهام إلكترونات التوصيل في السعة الحرارية للمعادن عند درجة حرارة الغرفة.

quizzes:
  - title: { en: 'Temperature, probability and the Boltzmann factor', ar: 'درجة الحرارة والاحتمالات وعامل بولتزمان' }
    questions:
      - q:
          en: 'Two non-degenerate levels are separated by \(\Delta E = k_BT\). What is the ratio of the upper to the lower population?'
          ar: 'مستويان غير منحلّين يفصل بينهما \(\Delta E = k_BT\). ما نسبة إشغال المستوى الأعلى إلى إشغال المستوى الأدنى؟'
        options:
          - '\(e\approx 2.72\)'
          - '\(e^{-2}\approx 0.14\)'
          - '\(e^{-1}\approx 0.37\)'
          - '\(0.5\)'
        answer: 2
        explain:
          en: 'The Boltzmann factor gives \(N_2/N_1 = e^{-\Delta E/k_BT} = e^{-1}\approx 0.37\).'
          ar: 'يعطي عامل بولتزمان \(N_2/N_1 = e^{-\Delta E/k_BT} = e^{-1}\approx 0.37\).'
      - q:
          en: 'What is the most probable speed in the Maxwell–Boltzmann distribution \(f(v)\propto v^2 e^{-mv^2/2k_BT}\)?'
          ar: 'ما السرعة الأكثر احتمالًا في توزيع ماكسويل-بولتزمان \(f(v)\propto v^2 e^{-mv^2/2k_BT}\)؟'
        options:
          - '\(\sqrt{2k_BT/m}\)'
          - '\(\sqrt{3k_BT/m}\)'
          - '\(\sqrt{8k_BT/\pi m}\)'
          - '\(\sqrt{k_BT/m}\)'
        answer: 0
        explain:
          en: 'Setting \(\dd f/\dd v = 0\): \(2v - v^3 m/k_BT = 0\Rightarrow v_p=\sqrt{2k_BT/m}\). \(\sqrt{8k_BT/\pi m}\) is the mean speed and \(\sqrt{3k_BT/m}\) the rms speed.'
          ar: 'بوضع \(\dd f/\dd v = 0\): \(2v - v^3 m/k_BT = 0\Rightarrow v_p=\sqrt{2k_BT/m}\). أما \(\sqrt{8k_BT/\pi m}\) فهي السرعة المتوسطة و\(\sqrt{3k_BT/m}\) جذر متوسط مربع السرعة.'
      - q:
          en: 'If the absolute temperature of an ideal gas is multiplied by 4, the rms speed of its molecules is'
          ar: 'إذا ضُربت درجة الحرارة المطلقة لغاز مثالي في 4، فإن جذر متوسط مربع سرعة جزيئاته'
        options:
          - { en: 'multiplied by 4', ar: 'يُضرب في 4' }
          - { en: 'multiplied by 16', ar: 'يُضرب في 16' }
          - { en: 'unchanged', ar: 'لا يتغير' }
          - { en: 'multiplied by 2', ar: 'يُضرب في 2' }
        answer: 3
        explain:
          en: '\(v_\text{rms}=\sqrt{3k_BT/m}\propto\sqrt{T}\), so a factor 4 in \(T\) gives a factor 2 in \(v_\text{rms}\).'
          ar: '\(v_\text{rms}=\sqrt{3k_BT/m}\propto\sqrt{T}\)، فمضاعفة \(T\) أربع مرات تضاعف \(v_\text{rms}\) مرتين.'
      - q:
          en: 'The zeroth law of thermodynamics'
          ar: 'ينص القانون الصفري للديناميكا الحرارية على'
        options:
          - { en: 'states that absolute zero cannot be reached', ar: 'أن الصفر المطلق لا يمكن بلوغه' }
          - { en: 'makes thermal equilibrium transitive and so defines temperature', ar: 'أن التوازن الحراري علاقة متعدية، ومنه تعريف درجة الحرارة' }
          - { en: 'states that energy is conserved', ar: 'أن الطاقة محفوظة' }
          - { en: 'states that entropy never decreases', ar: 'أن الإنتروبيا لا تتناقص أبدًا' }
        answer: 1
        explain:
          en: 'If A is in equilibrium with C and B with C, then A is in equilibrium with B. This allows a common label — temperature — to be assigned. The other options are the first, second and third laws.'
          ar: 'إذا كان A في توازن مع C وكان B في توازن مع C فإن A في توازن مع B، وهذا يسمح بإسناد مقدار مشترك هو درجة الحرارة. أما الخيارات الأخرى فهي القوانين الأول والثاني والثالث.'
      - q:
          en: 'The energy of a system is the sum of \(N\) independent, identical contributions. How does the relative fluctuation \(\sigma_E/\expval{E}\) scale with \(N\)?'
          ar: 'طاقة نظام هي مجموع \(N\) إسهامًا مستقلًّا ومتماثلًا. كيف يتغير التذبذب النسبي \(\sigma_E/\expval{E}\) مع \(N\)؟'
        options:
          - { en: 'independent of \(N\)', ar: 'لا يتعلق بـ \(N\)' }
          - '\(1/\sqrt{N}\)'
          - '\(1/N\)'
          - '\(\sqrt{N}\)'
        answer: 1
        explain:
          en: 'Means add: \(\expval{E}\propto N\). Variances of independent variables add: \(\sigma_E^2\propto N\). Hence \(\sigma_E/\expval{E}\propto 1/\sqrt N\), about \(10^{-12}\) for a mole — why thermodynamics is so sharp.'
          ar: 'تُجمع المتوسطات: \(\expval{E}\propto N\)، وتُجمع تباينات المتغيرات المستقلة: \(\sigma_E^2\propto N\). إذن \(\sigma_E/\expval{E}\propto 1/\sqrt N\)، أي نحو \(10^{-12}\) لمول واحد، ولهذا تكون نتائج الديناميكا الحرارية دقيقة إلى هذا الحد.'
  - title: { en: 'Laws of thermodynamics and entropy', ar: 'قوانين الديناميكا الحرارية والإنتروبيا' }
    questions:
      - q:
          en: 'What is the maximum efficiency of a heat engine operating between reservoirs at 600 K and 300 K?'
          ar: 'ما أقصى كفاءة لآلة حرارية تعمل بين خزانين عند 600 K و300 K؟'
        options:
          - '100%'
          - '33%'
          - '67%'
          - '50%'
        answer: 3
        explain:
          en: 'The Carnot efficiency \(\eta = 1 - T_c/T_h = 1 - 300/600 = 0.5\). No engine between these reservoirs can do better.'
          ar: 'كفاءة كارنو \(\eta = 1 - T_c/T_h = 1 - 300/600 = 0.5\)، ولا يمكن لأي آلة تعمل بين هذين الخزانين أن تتجاوزها.'
      - q:
          en: 'One mole of ideal gas undergoes a free (Joule) expansion into vacuum, doubling its volume. Its entropy change is'
          ar: 'يخضع مول واحد من غاز مثالي لتمدد حر (تمدد جول) في الفراغ فيتضاعف حجمه. تغيّر إنتروبيته يساوي'
        options:
          - '\(R\ln 2\)'
          - '\(-R\ln 2\)'
          - '\(R/2\)'
          - '\(0\)'
        answer: 0
        explain:
          en: 'No heat flows, but the process is irreversible. \(S\) is a function of state, so compute along a reversible isotherm (\(T\) is unchanged for an ideal gas): \(\Delta S = R\ln(V_2/V_1) = R\ln2\approx 5.76\ \text{J/K}\).'
          ar: 'لا تنتقل حرارة لكن التحول غير عكوس. وبما أن \(S\) دالة حالة نحسبها على مسار عكوس متساوي درجة الحرارة (لا تتغير \(T\) في الغاز المثالي): \(\Delta S = R\ln(V_2/V_1) = R\ln2\approx 5.76\ \text{J/K}\).'
      - q:
          en: 'For a reversible adiabatic process of an ideal gas with \(\gamma = C_p/C_V\), which quantity is constant?'
          ar: 'في تحول كظوم عكوس لغاز مثالي حيث \(\gamma = C_p/C_V\)، أيّ المقادير التالية يبقى ثابتًا؟'
        options:
          - '\(TV^\gamma\)'
          - '\(p/T\)'
          - '\(pV^\gamma\)'
          - '\(pV\)'
        answer: 2
        explain:
          en: 'From \(\dd U = -p\,\dd V\) with \(\dd U = C_V\dd T\) and \(pV=nRT\) one finds \(pV^\gamma\) = const (equivalently \(TV^{\gamma-1}\) = const). \(pV\) = const is the isotherm.'
          ar: 'من \(\dd U = -p\,\dd V\) مع \(\dd U = C_V\dd T\) و\(pV=nRT\) نجد أن \(pV^\gamma\) ثابت (أو ما يكافئه \(TV^{\gamma-1}\) ثابت). أما \(pV\) ثابت فهو منحنى التحول متساوي درجة الحرارة.'
      - q:
          en: 'Which Maxwell relation follows from \(\dd F = -S\,\dd T - p\,\dd V\)?'
          ar: 'أيّ علاقات ماكسويل تنتج من \(\dd F = -S\,\dd T - p\,\dd V\)؟'
        options:
          - '\((\partial T/\partial V)_S = -(\partial p/\partial S)_V\)'
          - '\((\partial S/\partial p)_T = -(\partial V/\partial T)_p\)'
          - '\((\partial T/\partial p)_S = (\partial V/\partial S)_p\)'
          - '\((\partial S/\partial V)_T = (\partial p/\partial T)_V\)'
        answer: 3
        explain:
          en: 'Equality of mixed second derivatives of \(F(T,V)\): \(\partial_V(-S) = \partial_T(-p)\). The other relations come from \(U\), \(G\) and \(H\) respectively.'
          ar: 'من تساوي المشتقات الثانية المختلطة لـ \(F(T,V)\): \(\partial_V(-S) = \partial_T(-p)\). أما العلاقات الأخرى فتنتج على الترتيب من \(U\) و\(G\) و\(H\).'
      - q:
          en: 'A consequence of the third law is that, as \(T\to0\),'
          ar: 'من نتائج القانون الثالث أنه عندما \(T\to0\)'
        options:
          - { en: '\(T=0\) is reached in a finite number of steps', ar: 'نبلغ \(T=0\) في عدد منتهٍ من الخطوات' }
          - { en: 'all heat capacities tend to zero', ar: 'تؤول كل السعات الحرارية إلى الصفر' }
          - { en: 'heat capacities tend to a constant', ar: 'تؤول السعات الحرارية إلى قيمة ثابتة' }
          - { en: 'the entropy diverges', ar: 'تتباعد الإنتروبيا إلى اللانهاية' }
        answer: 1
        explain:
          en: 'Since \(S(T) = \int_0^T C(T'')\,\dd T''/T''\) must stay finite and tend to a constant, \(C\to 0\). The third law also forbids reaching \(T=0\) in a finite number of steps.'
          ar: 'بما أن \(S(T) = \int_0^T C(T'')\,\dd T''/T''\) يجب أن تبقى منتهية وتؤول إلى ثابت، فلا بد أن \(C\to 0\). كما يمنع القانون الثالث بلوغ \(T=0\) في عدد منتهٍ من الخطوات.'
  - title: { en: 'Partition function and equipartition', ar: 'دالة التجزئة وتساوي توزيع الطاقة' }
    questions:
      - q:
          en: 'What is the molar \(C_V\) of a diatomic ideal gas at room temperature, with vibrations frozen out?'
          ar: 'ما قيمة \(C_V\) المولية لغاز مثالي ثنائي الذرة عند درجة حرارة الغرفة، حيث الاهتزازات مجمَّدة؟'
        options:
          - '\(\tfrac72 R\)'
          - '\(3R\)'
          - '\(\tfrac52 R\)'
          - '\(\tfrac32 R\)'
        answer: 2
        explain:
          en: 'Three translational and two rotational quadratic terms give \(5\times\tfrac12 R\). Vibration (two more terms) only contributes when \(k_BT\gtrsim\hbar\omega\), which needs several thousand K.'
          ar: 'ثلاثة حدود تربيعية انتقالية وحدّان دورانيان تعطي \(5\times\tfrac12 R\). ولا يسهم الاهتزاز (بحدّين إضافيين) إلا عندما \(k_BT\gtrsim\hbar\omega\)، أي عند آلاف الكلفنات.'
      - q:
          en: 'What is the partition function of one particle with two levels, of energies \(0\) and \(\varepsilon\)?'
          ar: 'ما دالة التجزئة لجسيم واحد له مستويان طاقتاهما \(0\) و\(\varepsilon\)؟'
        options:
          - '\(1+e^{-\beta\varepsilon}\)'
          - '\(e^{-\beta\varepsilon}\)'
          - '\(1-e^{-\beta\varepsilon}\)'
          - '\(2\cosh\beta\varepsilon\)'
        answer: 0
        explain:
          en: '\(Z=\sum_i e^{-\beta E_i} = e^{0} + e^{-\beta\varepsilon}\).'
          ar: '\(Z=\sum_i e^{-\beta E_i} = e^{0} + e^{-\beta\varepsilon}\).'
      - q:
          en: 'In the canonical ensemble, the mean energy is obtained from \(Z\) as'
          ar: 'في المجموعة القانونية، تُستخرج الطاقة المتوسطة من \(Z\) بالعلاقة'
        options:
          - '\(U = -\partial\ln Z/\partial\beta\)'
          - '\(U = -k_BT\ln Z\)'
          - '\(U = k_B\ln Z\)'
          - '\(U = \partial Z/\partial T\)'
        answer: 0
        explain:
          en: '\(-\partial_\beta\ln Z = \sum_i E_i e^{-\beta E_i}/Z = \expval{E}\). Note \(-k_BT\ln Z\) is the Helmholtz free energy \(F\), not \(U\).'
          ar: '\(-\partial_\beta\ln Z = \sum_i E_i e^{-\beta E_i}/Z = \expval{E}\). ولاحظ أن \(-k_BT\ln Z\) هي طاقة هلمهولتز الحرة \(F\) وليست \(U\).'
      - q:
          en: 'Which thermodynamic potential is directly given by \(-k_BT\ln Z\)?'
          ar: 'أيّ الكمونات الترموديناميكية يساوي مباشرةً \(-k_BT\ln Z\)؟'
        options:
          - { en: 'Enthalpy \(H\)', ar: 'الإنثالبي \(H\)' }
          - { en: 'Internal energy \(U\)', ar: 'الطاقة الداخلية \(U\)' }
          - { en: 'Helmholtz free energy \(F\)', ar: 'طاقة هلمهولتز الحرة \(F\)' }
          - { en: 'Gibbs free energy \(G\)', ar: 'طاقة جيبس الحرة \(G\)' }
        answer: 2
        explain:
          en: 'The canonical ensemble has fixed \(T, V, N\), whose natural potential is \(F(T,V,N) = -k_BT\ln Z\).'
          ar: 'متغيرات المجموعة القانونية الثابتة هي \(T, V, N\)، وكمونها الطبيعي \(F(T,V,N) = -k_BT\ln Z\).'
      - q:
          en: 'According to classical equipartition, the mean total energy of a one-dimensional harmonic oscillator at temperature \(T\) is'
          ar: 'وفق مبرهنة تساوي توزيع الطاقة الكلاسيكية، الطاقة الكلية المتوسطة لمهتز توافقي أحادي البعد عند درجة الحرارة \(T\) هي'
        options:
          - '\(\hbar\omega/2\)'
          - '\(k_BT\)'
          - '\(\tfrac12 k_BT\)'
          - '\(\tfrac32 k_BT\)'
        answer: 1
        explain:
          en: 'Two quadratic terms, \(p^2/2m\) and \(\tfrac12 m\omega^2x^2\), each contribute \(\tfrac12 k_BT\). This is also the high-\(T\) limit of the quantum result.'
          ar: 'هناك حدّان تربيعيان \(p^2/2m\) و\(\tfrac12 m\omega^2x^2\)، يسهم كلٌّ منهما بـ \(\tfrac12 k_BT\). وهذه أيضًا نهاية النتيجة الكمومية عند \(T\) المرتفعة.'
  - title: { en: 'Photons, phonons and quantum gases', ar: 'الفوتونات والفونونات والغازات الكمومية' }
    questions:
      - q:
          en: 'What is the Fermi–Dirac occupation of a state whose energy equals the chemical potential, \(E=\mu\)?'
          ar: 'ما إشغال فيرمي-ديراك لحالة طاقتها تساوي الكمون الكيميائي \(E=\mu\)؟'
        options:
          - '\(1\)'
          - '\(0\)'
          - '\(1/e\)'
          - '\(1/2\)'
        answer: 3
        explain:
          en: '\(\bar n = 1/(e^{0}+1) = 1/2\) at any temperature.'
          ar: '\(\bar n = 1/(e^{0}+1) = 1/2\) عند أي درجة حرارة.'
      - q:
          en: 'The absolute temperature of a black body is doubled. Its total emitted power becomes'
          ar: 'تضاعفت درجة الحرارة المطلقة لجسم أسود. تصبح القدرة الكلية التي يشعّها'
        options:
          - { en: '8 times larger', ar: 'أكبر بـ 8 مرات' }
          - { en: '16 times larger', ar: 'أكبر بـ 16 مرة' }
          - { en: '4 times larger', ar: 'أكبر بـ 4 مرات' }
          - { en: '2 times larger', ar: 'أكبر بمرتين' }
        answer: 1
        explain:
          en: 'Stefan–Boltzmann law: \(P = \sigma A T^4\), so \(2^4 = 16\).'
          ar: 'قانون ستيفان-بولتزمان: \(P = \sigma A T^4\)، إذن \(2^4 = 16\).'
      - q:
          en: 'In the Debye model, the lattice heat capacity at low temperature varies as'
          ar: 'في نموذج ديباي، تتغير السعة الحرارية للشبكة عند درجات الحرارة المنخفضة وفق'
        options:
          - '\(T\)'
          - '\(e^{-\Theta/T}\)'
          - { en: 'constant', ar: 'قيمة ثابتة' }
          - '\(T^3\)'
        answer: 3
        explain:
          en: 'Only long-wavelength acoustic phonons with \(\hbar\omega\lesssim k_BT\) are excited. Their number grows as \(T^3\) and each carries \(\sim k_BT\), so \(U\propto T^4\) and \(C\propto T^3\). The exponential is the Einstein-model result.'
          ar: 'لا تُثار إلا الفونونات الصوتية طويلة الموجة التي تحقق \(\hbar\omega\lesssim k_BT\)، وعددها يتناسب مع \(T^3\) وكلٌّ منها يحمل \(\sim k_BT\)، فتكون \(U\propto T^4\) و\(C\propto T^3\). أما السلوك الأسي فهو نتيجة نموذج أينشتاين.'
      - q:
          en: 'What is the chemical potential of black-body photons?'
          ar: 'ما قيمة الكمون الكيميائي لفوتونات الجسم الأسود؟'
        options:
          - '\(-k_BT\)'
          - '\(\hbar\omega\)'
          - '\(0\)'
          - '\(k_BT\)'
        answer: 2
        explain:
          en: 'Photons are freely created and absorbed by the walls, so \(N\) is not conserved. Minimising \(F\) with respect to \(N\) gives \(\mu = (\partial F/\partial N)_{T,V} = 0\).'
          ar: 'تُخلَق الفوتونات وتُمتص بحرية في الجدران، فلا يكون \(N\) محفوظًا، وتصغير \(F\) بالنسبة إلى \(N\) يعطي \(\mu = (\partial F/\partial N)_{T,V} = 0\).'
      - q:
          en: 'For an ideal Bose gas in 3D below \(T_c\), what fraction of particles is in the ground state?'
          ar: 'في غاز بوز مثالي ثلاثي الأبعاد تحت \(T_c\)، ما نسبة الجسيمات الموجودة في الحالة الأساسية؟'
        options:
          - '\(1-(T/T_c)^{3/2}\)'
          - '\((T/T_c)^{3/2}\)'
          - '\(1-(T/T_c)^{3}\)'
          - '\(1-T/T_c\)'
        answer: 0
        explain:
          en: 'Below \(T_c\) (where \(\mu\to 0\)), the excited states can hold at most \(N(T/T_c)^{3/2}\) particles; the rest, \(N_0/N = 1-(T/T_c)^{3/2}\), condense into the ground state.'
          ar: 'تحت \(T_c\) (حيث \(\mu\to 0\)) لا تستوعب الحالات المثارة أكثر من \(N(T/T_c)^{3/2}\) جسيمًا، ويتكاثف الباقي \(N_0/N = 1-(T/T_c)^{3/2}\) في الحالة الأساسية.'


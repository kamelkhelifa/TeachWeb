glossary:
  - { en: Temperature, ar: درجة الحرارة, fr: Température, def: { en: 'Statistically, \(1/k_BT = \dd\ln\Omega/\dd E\); the quantity that is equal for two systems in thermal equilibrium.', ar: 'إحصائيًّا \(1/k_BT = \dd\ln\Omega/\dd E\)؛ وهي المقدار الذي يتساوى بين نظامين في حالة توازن حراري.' } }
  - { en: Thermal equilibrium, ar: التوازن الحراري, fr: Équilibre thermique, def: { en: State in which no net heat flows between systems in thermal contact., ar: حالة لا يحدث فيها انتقال صافٍ للحرارة بين نظامين في تماس حراري. } }
  - { en: Microstate, ar: الحالة المجهرية, fr: Micro-état, def: { en: A complete specification of the state of every particle of the system., ar: تحديد كامل لحالة كل جسيم من جسيمات النظام. } }
  - { en: Macrostate, ar: الحالة العيانية, fr: Macro-état, def: { en: 'The state specified by a few macroscopic variables (\(U, V, N\)...); it corresponds to many microstates.', ar: 'الحالة المحددة بعدد قليل من المتغيرات العيانية (\(U, V, N\)...)، وتقابلها حالات مجهرية كثيرة.' } }
  - { en: Boltzmann factor, ar: عامل بولتزمان, fr: Facteur de Boltzmann, def: { en: 'The factor \(e^{-E/k_BT}\) giving the relative probability of a state of energy \(E\) at temperature \(T\).', ar: 'العامل \(e^{-E/k_BT}\) الذي يعطي الاحتمال النسبي لحالة طاقتها \(E\) عند درجة الحرارة \(T\).' } }
  - { en: Internal energy, ar: الطاقة الداخلية, fr: Énergie interne, def: { en: 'Total microscopic (kinetic + potential) energy \(U\) of a system; a function of state.', ar: 'مجموع الطاقة المجهرية (الحركية والكامنة) \(U\) للنظام، وهي دالة حالة.' } }
  - { en: Heat capacity, ar: السعة الحرارية, fr: Capacité thermique, def: { en: 'Heat needed per unit temperature rise, e.g. \(C_V = (\partial U/\partial T)_V\).', ar: 'الحرارة اللازمة لرفع درجة الحرارة بوحدة واحدة، مثل \(C_V = (\partial U/\partial T)_V\).' } }
  - { en: Adiabatic process, ar: تحول كظوم, fr: Transformation adiabatique, def: { en: A process with no heat exchange; if reversible it is also isentropic., ar: تحول لا يحدث فيه تبادل حراري، وإن كان عكوسًا فهو أيضًا متساوي الإنتروبيا. } }
  - { en: Isothermal process, ar: تحول متساوي درجة الحرارة, fr: Transformation isotherme, def: { en: A process at constant temperature., ar: تحول يجري عند درجة حرارة ثابتة. } }
  - { en: Entropy, ar: الإنتروبيا, fr: Entropie, def: { en: 'Function of state with \(\dd S = \dd Q_\text{rev}/T\); statistically \(S = k_B\ln\Omega\).', ar: 'دالة حالة تحقق \(\dd S = \dd Q_\text{rev}/T\)، وإحصائيًّا \(S = k_B\ln\Omega\).' } }
  - { en: Heat engine, ar: آلة حرارية, fr: Machine thermique, def: { en: A cyclic device converting part of the heat from a hot reservoir into work and rejecting the rest to a cold one., ar: جهاز دوري يحوّل جزءًا من الحرارة المأخوذة من خزان ساخن إلى شغل ويطرح الباقي إلى خزان بارد. } }
  - { en: Carnot cycle, ar: دورة كارنو, fr: Cycle de Carnot, def: { en: 'A reversible cycle of two isotherms and two adiabats; efficiency \(1-T_c/T_h\).', ar: 'دورة عكوسة مكوّنة من تحولين متساويي درجة الحرارة وتحولين كظومين، كفاءتها \(1-T_c/T_h\).' } }
  - { en: Efficiency, ar: الكفاءة (المردود), fr: Rendement, def: { en: 'Ratio of work output to heat input, \(\eta = W/Q_h\).', ar: 'نسبة الشغل الناتج إلى الحرارة المكتسبة \(\eta = W/Q_h\).' } }
  - { en: Enthalpy, ar: الإنثالبي (المحتوى الحراري), fr: Enthalpie, def: { en: '\(H = U + pV\); the heat exchanged at constant pressure.', ar: '\(H = U + pV\)، وتساوي الحرارة المتبادلة عند ضغط ثابت.' } }
  - { en: Helmholtz free energy, ar: طاقة هلمهولتز الحرة, fr: Énergie libre de Helmholtz, def: { en: '\(F = U - TS = -k_BT\ln Z\); minimal at equilibrium for fixed \(T, V\).', ar: '\(F = U - TS = -k_BT\ln Z\)، وتكون صغرى عند التوازن إذا ثبتت \(T\) و\(V\).' } }
  - { en: Gibbs free energy, ar: طاقة جيبس الحرة, fr: Enthalpie libre de Gibbs, def: { en: '\(G = H - TS\); minimal at equilibrium for fixed \(T, p\); \(G = N\mu\).', ar: '\(G = H - TS\)، وتكون صغرى عند التوازن إذا ثبتت \(T\) و\(p\)؛ و\(G = N\mu\).' } }
  - { en: Maxwell relations, ar: علاقات ماكسويل, fr: Relations de Maxwell, def: { en: Identities between partial derivatives that follow from the equality of mixed second derivatives of the potentials., ar: متطابقات بين مشتقات جزئية تنتج عن تساوي المشتقات الثانية المختلطة للكمونات. } }
  - { en: Third law, ar: القانون الثالث, fr: Troisième principe, def: { en: 'The entropy of a system in equilibrium tends to a constant (zero for a unique ground state) as \(T\to0\).', ar: 'تؤول إنتروبيا نظام في حالة توازن إلى ثابت (صفر إذا كانت الحالة الأساسية وحيدة) عندما \(T\to0\).' } }
  - { en: Equipartition theorem, ar: مبرهنة تساوي توزيع الطاقة, fr: Théorème d'équipartition, def: { en: 'Classically, each quadratic term in the energy contributes \(\tfrac12k_BT\) to the mean energy.', ar: 'كلاسيكيًّا، يسهم كل حد تربيعي في الطاقة بـ \(\tfrac12k_BT\) في الطاقة المتوسطة.' } }
  - { en: Partition function, ar: دالة التجزئة, fr: Fonction de partition, def: { en: '\(Z = \sum_i e^{-\beta E_i}\); the normalisation of the Boltzmann distribution, from which all thermodynamics follows.', ar: '\(Z = \sum_i e^{-\beta E_i}\)، ثابت تقييس توزيع بولتزمان، ومنها تُستخرج كل المقادير الترموديناميكية.' } }
  - { en: Canonical ensemble, ar: المجموعة القانونية, fr: Ensemble canonique, def: { en: 'Systems at fixed \(N, V\) in contact with a heat bath at temperature \(T\).', ar: 'مجموعة أنظمة ذات \(N\) و\(V\) ثابتين في تماس مع حمّام حراري عند درجة الحرارة \(T\).' } }
  - { en: Grand canonical ensemble, ar: المجموعة القانونية الكبرى, fr: Ensemble grand-canonique, def: { en: 'Systems exchanging both energy and particles with a reservoir at fixed \(T\) and \(\mu\).', ar: 'مجموعة أنظمة تتبادل الطاقة والجسيمات مع خزان عند \(T\) و\(\mu\) ثابتين.' } }
  - { en: Chemical potential, ar: الكمون الكيميائي, fr: Potentiel chimique, def: { en: '\(\mu = (\partial G/\partial N)_{T,p}\); particles flow from high to low \(\mu\).', ar: '\(\mu = (\partial G/\partial N)_{T,p}\)، وتنتقل الجسيمات من \(\mu\) الأعلى إلى الأدنى.' } }
  - { en: Thermal de Broglie wavelength, ar: طول موجة دي برولي الحراري, fr: Longueur d'onde thermique de de Broglie, def: { en: '\(\lambda = h/\sqrt{2\pi mk_BT}\); quantum effects matter when \(n\lambda^3\gtrsim1\).', ar: '\(\lambda = h/\sqrt{2\pi mk_BT}\)، وتصبح الآثار الكمومية مهمة عندما \(n\lambda^3\gtrsim1\).' } }
  - { en: Black-body radiation, ar: إشعاع الجسم الأسود, fr: Rayonnement du corps noir, def: { en: Equilibrium electromagnetic radiation in a cavity; its spectrum is given by Planck's law., ar: إشعاع كهرومغناطيسي في حالة توازن داخل تجويف، يعطى طيفه بقانون بلانك. } }
  - { en: Phonon, ar: الفونون, fr: Phonon, def: { en: A quantum of lattice vibration; phonons are bosons with zero chemical potential., ar: كمّ اهتزاز الشبكة البلورية، وهو بوزون كمونه الكيميائي معدوم. } }
  - { en: Fermi–Dirac distribution, ar: توزيع فيرمي-ديراك, fr: Distribution de Fermi-Dirac, def: { en: '\(\bar n = 1/(e^{\beta(E-\mu)}+1)\): mean occupation of a single-particle state by fermions.', ar: '\(\bar n = 1/(e^{\beta(E-\mu)}+1)\): متوسط إشغال حالة جسيم واحد بالفرميونات.' } }
  - { en: Bose–Einstein distribution, ar: توزيع بوز-أينشتاين, fr: Distribution de Bose-Einstein, def: { en: '\(\bar n = 1/(e^{\beta(E-\mu)}-1)\): mean occupation of a single-particle state by bosons.', ar: '\(\bar n = 1/(e^{\beta(E-\mu)}-1)\): متوسط إشغال حالة جسيم واحد بالبوزونات.' } }
  - { en: Fermi energy, ar: طاقة فيرمي, fr: Énergie de Fermi, def: { en: Energy of the highest occupied state of an ideal Fermi gas at \(T=0\)., ar: 'طاقة أعلى حالة مشغولة في غاز فيرمي مثالي عند \(T=0\).' } }
  - { en: Bose–Einstein condensation, ar: تكاثف بوز-أينشتاين, fr: Condensation de Bose-Einstein, def: { en: 'Macroscopic occupation of the ground state by bosons below a critical temperature \(T_c\).', ar: 'إشغال عياني للحالة الأساسية بالبوزونات تحت درجة حرارة حرجة \(T_c\).' } }

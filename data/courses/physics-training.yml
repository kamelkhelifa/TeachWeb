notes: >
  The source page has only the course objective and a one-line description. It asks students to undertake
  laboratory or research work in a public or private institution in a field of physics, collect data, perform analysis,
  write a report and give a presentation. Its evaluation block (problem sets and periodic exams) is clearly
  copied from a lecture-course template and was not used. Everything else was reconstructed from
  standard physics internship and co-op syllabi. This includes the 14-week milestone schedule (2 weeks of
  preparation, about 8 weeks on placement, 3 weeks of reporting and defence), the assessment scheme
  (logbook, mid-placement and final reports, defence, employer evaluation, safety and ethics quiz), the CLOs,
  the exam guide, the quizzes, the problems and the glossary. Credits (3) and placement length (at least 8 weeks
  full time) are assumptions and should be checked. The source page links no material; its only link was a personal
  office-hours timetable and was not carried over.

description:
  en: |
    <p>Field training gives final-year students their first real professional experience as physicists. Each student spends a supervised placement of <strong>at least eight weeks</strong> in a host organisation. The host can be a university or government research laboratory, a hospital physics or radiation-protection unit, an industrial quality-control or metrology laboratory, an energy or telecommunications company, or a meteorological or geophysical service. There the student carries out a well-defined practical or research task in a specific field of physics.</p>
    <p>The course is built around a sequence of milestones. Before the placement, students follow an induction on laboratory safety, research ethics and record keeping, and agree a work plan with their host. During the placement, they keep a dated logbook, meet their supervisors every week, collect and analyse data with a proper treatment of uncertainties, and submit a mid-placement progress report. Afterwards they write a final technical report and present their work in a poster or oral defence before a panel. The host supervisor contributes a formal evaluation of their professional conduct.</p>
    <p>The training develops the skills that lecture courses cannot fully teach. These are working safely with real equipment, handling messy data honestly, managing time and deadlines, working in a team, and communicating results clearly to specialists and non-specialists.</p>
  ar: |
    <p>يمنح التدريب الميداني طلبة السنة النهائية أول تجربة مهنية حقيقية لهم كفيزيائيين. يقضي كل طالب فترة تدريب تحت الإشراف لا تقل عن <strong>ثمانية أسابيع</strong> في جهة مستضيفة. قد تكون الجهة مختبرًا بحثيًا جامعيًا أو حكوميًا، أو وحدة فيزياء طبية أو وقاية من الإشعاع في مستشفى، أو مختبرًا صناعيًا لمراقبة الجودة أو للقياسة، أو شركة طاقة أو اتصالات، أو مصلحة للأرصاد الجوية أو للجيوفيزياء. وهناك ينجز الطالب مهمة تطبيقية أو بحثية محددة في مجال من مجالات الفيزياء.</p>
    <p>يُبنى المقرر على سلسلة من المراحل. قبل التدريب يتلقى الطالب تهيئة في السلامة المخبرية وأخلاقيات البحث وتوثيق العمل، ويتفق مع الجهة المستضيفة على خطة عمل. وأثناء التدريب يمسك دفتر يوميات مؤرخًا، ويلتقي مشرفيه أسبوعيًا، ويجمع المعطيات ويحللها مع معالجة سليمة للارتيابات، ويسلّم تقريرًا مرحليًا في منتصف التدريب. وبعده يكتب تقريرًا تقنيًا نهائيًا ويعرض عمله في ملصق علمي أو مناقشة شفهية أمام لجنة. ويقدّم المشرف في الجهة المستضيفة تقييمًا رسميًا لسلوكه المهني.</p>
    <p>ينمّي التدريب مهارات لا تستطيع المقررات النظرية تعليمها بالكامل، منها العمل الآمن على أجهزة حقيقية، والتعامل النزيه مع معطيات غير مثالية، وإدارة الوقت والآجال، والعمل ضمن فريق، وإيصال النتائج بوضوح إلى المتخصصين وغير المتخصصين.</p>


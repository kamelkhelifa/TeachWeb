glossary:
  - { en: Placement, ar: فترة التدريب الميداني, fr: Stage, def: { en: 'Period of supervised work in a host organisation.', ar: 'فترة عمل تحت الإشراف في جهة مستضيفة.' } }
  - { en: Host supervisor, ar: المشرف في الجهة المستضيفة, fr: Maître de stage, def: { en: 'Professional who guides the trainee on site and evaluates their work.', ar: 'مهني يوجّه المتدرب في موقع العمل ويقيّم عمله.' } }
  - { en: Academic supervisor, ar: المشرف الأكاديمي, fr: Encadrant universitaire, def: { en: 'Faculty member responsible for the academic follow-up and the grading of the training.', ar: 'عضو هيئة التدريس المسؤول عن المتابعة الأكاديمية للتدريب وتقييمه.' } }
  - { en: Placement agreement, ar: اتفاقية التدريب, fr: Convention de stage, def: { en: 'Signed document that sets the task, dates, rules and confidentiality of the placement.', ar: 'وثيقة موقّعة تحدد مهمة التدريب ومواعيده وقواعده وشروط السرية.' } }
  - { en: Work plan, ar: خطة العمل, fr: Plan de travail, def: { en: 'Agreed list of objectives, tasks and deadlines for the placement.', ar: 'قائمة متفق عليها بأهداف التدريب ومهامه وآجاله.' } }
  - { en: Gantt chart, ar: مخطط غانت, fr: Diagramme de Gantt, def: { en: 'Bar chart showing tasks against time.', ar: 'مخطط بأشرطة يبيّن المهام بدلالة الزمن.' } }
  - { en: Logbook, ar: دفتر اليوميات, fr: Cahier de laboratoire, def: { en: 'Dated, permanent record of all work, settings and raw data.', ar: 'سجل مؤرخ ودائم لكل الأعمال والإعدادات والمعطيات الخام.' } }
  - { en: Risk assessment, ar: تقييم المخاطر, fr: Évaluation des risques, def: { en: 'Identifying hazards, estimating their risk and deciding control measures.', ar: 'تحديد مصادر الخطر وتقدير مخاطرها وتقرير إجراءات التحكم فيها.' } }
  - { en: Personal protective equipment (PPE), ar: معدات الوقاية الشخصية, fr: Équipement de protection individuelle (EPI), def: { en: 'Goggles, gloves, lab coat and similar items worn to reduce exposure.', ar: 'النظارات والقفازات والمئزر ونحوها مما يُلبس للحد من التعرض للخطر.' } }
  - { en: Safety Data Sheet (SDS), ar: صحيفة بيانات السلامة, fr: Fiche de données de sécurité (FDS), def: { en: 'Document giving the hazards and safe handling of a substance.', ar: 'وثيقة تبيّن مخاطر مادة وطرق التعامل الآمن معها.' } }
  - { en: Standard operating procedure (SOP), ar: إجراء التشغيل القياسي, fr: Mode opératoire normalisé, def: { en: 'Written step-by-step instructions for a routine operation.', ar: 'تعليمات مكتوبة خطوة بخطوة لعملية روتينية.' } }
  - { en: Calibration, ar: المعايرة, fr: Étalonnage, def: { en: 'Comparing an instrument with a reference standard to correct its readings.', ar: 'مقارنة جهاز بمعيار مرجعي لتصحيح قراءاته.' } }
  - { en: Traceability, ar: قابلية التتبع (المترولوجي), fr: Traçabilité, def: { en: 'Link of a measurement to national or international standards through an unbroken chain of calibrations.', ar: 'ربط القياس بالمعايير الوطنية أو الدولية عبر سلسلة متصلة من المعايرات.' } }
  - { en: Random error, ar: الخطأ العشوائي, fr: Erreur aléatoire, def: { en: 'Unpredictable scatter of readings; reduced by averaging.', ar: 'تشتت غير متوقع للقراءات؛ يقلّ بأخذ المتوسط.' } }
  - { en: Systematic error, ar: الخطأ المنهجي, fr: Erreur systématique, def: { en: 'Bias that shifts all readings in the same direction.', ar: 'انحياز يزيح كل القراءات في الاتجاه نفسه.' } }
  - { en: Standard uncertainty, ar: الارتياب المعياري, fr: Incertitude-type, def: { en: 'Uncertainty expressed as a standard deviation.', ar: 'ارتياب يُعبَّر عنه بانحراف معياري.' } }
  - { en: Propagation of uncertainty, ar: نقل الارتياب, fr: Propagation des incertitudes, def: { en: 'Calculating the uncertainty of a result from those of its inputs.', ar: 'حساب ارتياب نتيجة من ارتيابات المقادير الداخلة فيها.' } }
  - { en: Significant figures, ar: الأرقام المعنوية, fr: Chiffres significatifs, def: { en: 'Digits of a number that carry meaningful information.', ar: 'أرقام العدد التي تحمل معلومات ذات معنى.' } }
  - { en: Least-squares fit, ar: المطابقة بالمربعات الصغرى, fr: Ajustement par moindres carrés, def: { en: 'Choosing model parameters that minimise the sum of squared residuals.', ar: 'اختيار وسائط النموذج التي تجعل مجموع مربعات البواقي أصغريًا.' } }
  - { en: Outlier, ar: القيمة الشاذة, fr: Valeur aberrante, def: { en: 'Data point far from the others; it may be excluded only for a documented reason.', ar: 'نقطة بعيدة عن البقية؛ لا يجوز استبعادها إلا لسبب موثّق.' } }
  - { en: Reproducibility, ar: قابلية إعادة الإنتاج, fr: Reproductibilité, def: { en: 'Ability of independent workers to obtain the same result.', ar: 'قدرة باحثين مستقلين على الحصول على النتيجة نفسها.' } }
  - { en: Fabrication, ar: اختلاق المعطيات, fr: Fabrication de données, def: { en: 'Making up data or results.', ar: 'تأليف معطيات أو نتائج وهمية.' } }
  - { en: Falsification, ar: تزوير المعطيات, fr: Falsification, def: { en: 'Manipulating data, equipment or processes so that the record is not accurate.', ar: 'التلاعب بالمعطيات أو الأجهزة أو الإجراءات بحيث لا يعكس السجل الحقيقة.' } }
  - { en: Plagiarism, ar: الانتحال العلمي, fr: Plagiat, def: { en: 'Using another person''s words, ideas or figures without credit.', ar: 'استعمال كلمات الغير أو أفكاره أو أشكاله دون نسبتها إليه.' } }
  - { en: Confidentiality agreement, ar: اتفاقية السرية, fr: Accord de confidentialité, def: { en: 'Commitment not to disclose the host''s sensitive information.', ar: 'التزام بعدم إفشاء المعلومات الحساسة للجهة المستضيفة.' } }
  - { en: Progress report, ar: التقرير المرحلي, fr: Rapport d'avancement, def: { en: 'Interim report on what has been done, the problems met and the plans.', ar: 'تقرير مؤقت عما أُنجز والمشكلات المصادفة والخطط.' } }
  - { en: Technical report, ar: التقرير التقني, fr: Rapport technique, def: { en: 'Structured final document describing the work, methods and results.', ar: 'وثيقة نهائية منظمة تصف العمل والطرائق والنتائج.' } }
  - { en: Poster session, ar: جلسة الملصقات العلمية, fr: Session de posters, def: { en: 'Presentation of work on a large printed poster, discussed one-to-one.', ar: 'عرض العمل على ملصق مطبوع كبير ومناقشته مع الزوار فرديًا.' } }
  - { en: Oral defence, ar: المناقشة الشفهية, fr: Soutenance, def: { en: 'Presentation of the work followed by questions from an examining panel.', ar: 'عرض العمل تليه أسئلة لجنة الامتحان.' } }
  - { en: Reflective statement, ar: البيان التأملي, fr: Bilan réflexif, def: { en: 'Short personal analysis of what was learned and how.', ar: 'تحليل شخصي قصير لما تعلّمه المتدرب وكيف تعلّمه.' } }

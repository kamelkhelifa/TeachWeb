outcomes:
  - id: CLO1
    bloom: apply
    domain: skills
    text:
      en: Apply laboratory safety rules and carry out a simple risk assessment for the equipment and materials used in a professional environment.
      ar: يطبّق قواعد السلامة المخبرية ويُجري تقييمًا بسيطًا للمخاطر المتعلقة بالأجهزة والمواد المستعملة في بيئة مهنية.
    assessed_by: [safety, employer]
  - id: CLO2
    bloom: apply
    domain: skills
    text:
      en: Use physics knowledge and instrumentation to carry out a supervised practical or research task in a host organisation.
      ar: يوظّف معارفه الفيزيائية والأجهزة لإنجاز مهمة تطبيقية أو بحثية تحت الإشراف في جهة مستضيفة.
    assessed_by: [employer, logbook, finalreport]
  - id: CLO3
    bloom: analyze
    domain: skills
    text:
      en: Collect, process and analyse experimental data, including fitting, propagation of uncertainties and critical comparison with expected values.
      ar: يجمع المعطيات التجريبية ويعالجها ويحللها، بما في ذلك المطابقة ونقل الارتيابات والمقارنة النقدية مع القيم المتوقعة.
    assessed_by: [midreport, finalreport]
  - id: CLO4
    bloom: create
    domain: skills
    text:
      en: Write clear, well-structured mid-placement and final technical reports with properly labelled figures and references.
      ar: يكتب تقريرًا مرحليًا وتقريرًا تقنيًا نهائيًا واضحين وحسني البنية، مع أشكال معنونة بدقة ومراجع موثّقة.
    assessed_by: [midreport, finalreport]
  - id: CLO5
    bloom: create
    domain: skills
    text:
      en: Present and defend the work in a poster or oral presentation, answering questions from a panel.
      ar: يعرض عمله ويدافع عنه في ملصق علمي أو عرض شفهي، ويجيب عن أسئلة اللجنة.
    assessed_by: [defence]
  - id: CLO6
    bloom: evaluate
    domain: values
    text:
      en: Judge and follow the ethical rules of research and professional practice (data integrity, confidentiality, authorship, citation).
      ar: يقدّر القواعد الأخلاقية للبحث والممارسة المهنية ويلتزم بها (نزاهة المعطيات، والسرية، والتأليف، والتوثيق).
    assessed_by: [safety, logbook, employer]
  - id: CLO7
    bloom: apply
    domain: values
    text:
      en: Behave professionally by managing time, communicating with supervisors and working effectively in a team.
      ar: يتحلى بالسلوك المهني بإدارة وقته والتواصل مع مشرفيه والعمل بفعالية ضمن فريق.
    assessed_by: [employer, logbook]
  - id: CLO8
    bloom: evaluate
    domain: values
    text:
      en: Reflect critically on the skills gained during the placement and their relevance to future studies and career.
      ar: يتأمل تأملًا نقديًا في المهارات المكتسبة خلال التدريب وصلتها بدراسته المستقبلية ومساره المهني.
    assessed_by: [logbook, finalreport]

assessment:
  - id: safety
    type: quiz
    weight: 10
    title:
      en: Safety and ethics induction quiz
      ar: اختبار التهيئة في السلامة والأخلاقيات
    detail:
      en: A 30-minute multiple-choice quiz on laboratory safety, research ethics, record keeping and basic data handling. A mark of at least 70% is required before the placement starts; it may be retaken once.
      ar: اختبار متعدد الخيارات مدته 30 دقيقة في السلامة المخبرية وأخلاقيات البحث وتوثيق العمل ومبادئ معالجة المعطيات. يُشترط الحصول على 70% على الأقل قبل بدء التدريب، ويمكن إعادته مرة واحدة.
    when:
      en: Week 2
      ar: الأسبوع 2
  - id: logbook
    type: portfolio
    weight: 15
    title:
      en: Logbook and weekly records
      ar: دفتر اليوميات والسجلات الأسبوعية
    detail:
      en: A dated, bound or electronic logbook recording every working day (tasks, settings, raw data, problems, decisions), signed weekly by the host supervisor, with a one-page summary after each weekly meeting and a final reflective statement.
      ar: دفتر يوميات مؤرخ (ورقي مجلد أو إلكتروني) يسجّل كل يوم عمل (المهام، والإعدادات، والمعطيات الخام، والمشكلات، والقرارات)، يوقّعه المشرف في الجهة المستضيفة أسبوعيًا، مع ملخص من صفحة واحدة بعد كل لقاء أسبوعي وبيان تأملي ختامي.
    when:
      en: Weeks 3–14
      ar: الأسابيع 3–14
  - id: midreport
    type: report
    weight: 15
    title:
      en: Mid-placement progress report
      ar: التقرير المرحلي لمنتصف التدريب
    detail:
      en: At most five pages, covering the context and objectives of the task, the methods learned, the first results with uncertainties, the difficulties met and an updated plan for the remaining weeks.
      ar: خمس صفحات على الأكثر تتناول سياق المهمة وأهدافها، والطرائق المكتسبة، والنتائج الأولى مع ارتياباتها، والصعوبات المصادفة، وخطة محدّثة للأسابيع المتبقية.
    when:
      en: Week 7
      ar: الأسبوع 7
  - id: finalreport
    type: report
    weight: 30
    title:
      en: Final technical report
      ar: التقرير التقني النهائي
    detail:
      en: A report of 20–30 pages with abstract, introduction, background, methods, results with uncertainty analysis, discussion, conclusion, references and appendices. A draft is reviewed in week 12. It is graded by the academic supervisor and a second reader.
      ar: تقرير من 20–30 صفحة يضم ملخصًا ومقدمة وخلفية نظرية وطرائق ونتائج مع تحليل الارتيابات ومناقشة وخلاصة ومراجع وملاحق. تُراجَع مسودته في الأسبوع 12. ويقيّمه المشرف الأكاديمي وقارئ ثانٍ.
    when:
      en: Week 13
      ar: الأسبوع 13
  - id: defence
    type: presentation
    weight: 15
    title:
      en: Poster or oral defence
      ar: الملصق العلمي أو المناقشة الشفهية
    detail:
      en: A 15-minute presentation (or an A0 poster session) followed by 10 minutes of questions from a panel of at least two examiners. The panel grades clarity, mastery of the physics, quality of the results and answers to questions.
      ar: عرض مدته 15 دقيقة (أو جلسة ملصق علمي بمقاس A0) تليه 10 دقائق من أسئلة لجنة من ممتحنَين اثنين على الأقل. تقيّم اللجنة الوضوح والتمكن من الفيزياء وجودة النتائج والإجابة عن الأسئلة.
    when:
      en: Week 14
      ar: الأسبوع 14
  - id: employer
    type: participation
    weight: 15
    title:
      en: Host supervisor evaluation
      ar: تقييم المشرف في الجهة المستضيفة
    detail:
      en: A standard form completed by the host supervisor. It rates attendance and punctuality, safety behaviour, technical competence, initiative, teamwork, communication and the quality of the work delivered.
      ar: استمارة موحّدة يملؤها المشرف في الجهة المستضيفة لتقييم الحضور والانضباط في المواعيد، والالتزام بالسلامة، والكفاءة التقنية، وروح المبادرة، والعمل الجماعي، والتواصل، وجودة العمل المنجز.
    when:
      en: End of placement (week 11)
      ar: نهاية التدريب (الأسبوع 11)

schedule:
  - week: 1
    title:
      en: Orientation and placement matching
      ar: التوجيه وتحديد جهة التدريب
    topics:
      en:
        - Aims, rules and assessment of the training
        - Choosing a host organisation and a task
        - Placement agreement and confidentiality
      ar:
        - أهداف التدريب وقواعده وطرق تقييمه
        - اختيار الجهة المستضيفة والمهمة
        - اتفاقية التدريب والسرية
    activity:
      en: Submit host preferences and CV
      ar: تقديم رغبات جهة التدريب والسيرة الذاتية
  - week: 2
    title:
      en: Safety, ethics and the logbook
      ar: السلامة والأخلاقيات ودفتر اليوميات
    topics:
      en:
        - General laboratory safety and risk assessment
        - Research integrity, authorship and data ownership
        - Keeping a logbook; data management
      ar:
        - السلامة المخبرية العامة وتقييم المخاطر
        - النزاهة البحثية والتأليف وملكية المعطيات
        - مسك دفتر اليوميات؛ إدارة المعطيات
    reading: Taylor ch. 1–3; On Being a Scientist
    activity:
      en: Safety and ethics quiz
      ar: اختبار السلامة والأخلاقيات
    milestone: quiz
  - week: 3
    title:
      en: Start of placement
      ar: بداية التدريب
    topics:
      en:
        - Induction at the host and site-specific safety rules
        - Work plan and timeline (Gantt chart) agreed with the host supervisor
      ar:
        - التهيئة في الجهة المستضيفة وقواعد السلامة الخاصة بالموقع
        - خطة العمل والجدول الزمني (مخطط غانت) بالاتفاق مع المشرف المستضيف
    activity:
      en: Submit signed work plan
      ar: تسليم خطة العمل موقّعة
  - week: 4
    title:
      en: Background and instruments
      ar: الخلفية العلمية والأجهزة
    topics:
      en:
        - Background reading on the task
        - Learning the instruments and procedures
      ar:
        - قراءات حول خلفية المهمة
        - التعرّف على الأجهزة والإجراءات
    activity:
      en: Weekly supervisor meeting; logbook signed
      ar: اللقاء الأسبوعي مع المشرف؛ توقيع دفتر اليوميات
  - week: 5
    title:
      en: Data collection
      ar: جمع المعطيات
    topics:
      en:
        - First measurements or simulations
        - Calibration, file naming and back-ups
      ar:
        - القياسات أو المحاكاة الأولى
        - المعايرة وتسمية الملفات والنسخ الاحتياطي
    activity:
      en: Weekly supervisor meeting; logbook signed
      ar: اللقاء الأسبوعي مع المشرف؛ توقيع دفتر اليوميات
  - week: 6
    title:
      en: Measurement and uncertainty
      ar: القياس والارتياب
    topics:
      en:
        - Random and systematic errors
        - Propagation of uncertainties; least-squares fitting
      ar:
        - الأخطاء العشوائية والمنهجية
        - نقل الارتيابات؛ المطابقة بطريقة المربعات الصغرى
    reading: Taylor ch. 3–4 and 8
    activity:
      en: Weekly supervisor meeting; logbook signed
      ar: اللقاء الأسبوعي مع المشرف؛ توقيع دفتر اليوميات
  - week: 7
    title:
      en: Mid-placement review
      ar: المراجعة المرحلية
    topics:
      en:
        - Mid-placement progress report
        - Site visit or video call by the academic supervisor
      ar:
        - التقرير المرحلي لمنتصف التدريب
        - زيارة ميدانية أو اتصال مرئي من المشرف الأكاديمي
    activity:
      en: Mid-placement report due
      ar: تسليم التقرير المرحلي

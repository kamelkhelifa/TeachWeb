      ar:
        - العمل بالملاحظات على التقرير المرحلي
        - تحسين الطريقة وإعادة القياسات الأساسية
    activity:
      en: Weekly supervisor meeting; logbook signed
      ar: اللقاء الأسبوعي مع المشرف؛ توقيع دفتر اليوميات
  - week: 9
    title:
      en: Analysis and modelling
      ar: التحليل والنمذجة
    topics:
      en:
        - Comparing data with a model or specification
        - Consistency tests and weighted means
      ar:
        - مقارنة المعطيات بنموذج أو بمواصفة
        - اختبارات الاتساق والمتوسطات الموزونة
    activity:
      en: Weekly supervisor meeting; logbook signed
      ar: اللقاء الأسبوعي مع المشرف؛ توقيع دفتر اليوميات
  - week: 10
    title:
      en: Consolidating results
      ar: تثبيت النتائج
    topics:
      en:
        - Final figures and tables
        - Preparing the hand-over of data and documentation to the host
      ar:
        - الأشكال والجداول النهائية
        - تحضير تسليم المعطيات والوثائق للجهة المستضيفة
    activity:
      en: Weekly supervisor meeting; logbook signed
      ar: اللقاء الأسبوعي مع المشرف؛ توقيع دفتر اليوميات
  - week: 11
    title:
      en: End of placement
      ar: نهاية التدريب
    topics:
      en:
        - Final week at the host; hand-over
        - Host supervisor evaluation form
      ar:
        - الأسبوع الأخير في الجهة المستضيفة؛ تسليم العمل
        - استمارة تقييم المشرف المستضيف
    activity:
      en: Employer evaluation submitted; logbook closed
      ar: إرسال تقييم الجهة المستضيفة؛ إغلاق دفتر اليوميات
  - week: 12
    title:
      en: Writing the final report
      ar: كتابة التقرير النهائي
    topics:
      en:
        - Structure of a technical report; writing the abstract
        - Figures, tables, references and appendices
      ar:
        - بنية التقرير التقني؛ كتابة الملخص
        - الأشكال والجداول والمراجع والملاحق
    reading: Gastel & Day, selected chapters
    activity:
      en: Draft report submitted for feedback
      ar: تسليم مسودة التقرير لإبداء الملاحظات
  - week: 13
    title:
      en: Final report and poster
      ar: التقرير النهائي والملصق العلمي
    topics:
      en:
        - Final report submission
        - Designing a poster or slides
      ar:
        - تسليم التقرير النهائي
        - تصميم الملصق العلمي أو الشرائح
    activity:
      en: Final report due
      ar: موعد تسليم التقرير النهائي
    milestone: project
  - week: 14
    title:
      en: Defence
      ar: المناقشة
    topics:
      en:
        - Poster session or oral defence before the panel
        - Reflective statement and course feedback
      ar:
        - جلسة الملصقات العلمية أو المناقشة الشفهية أمام اللجنة
        - البيان التأملي وتقييم المقرر
    milestone: final

